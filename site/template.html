<meta name="description" content="Collectively tag research on agentic organizations against the AO Commons taxonomy.">

<style>
  /* Light is the default and is stamped explicitly, so the page does not
     change under someone whose laptop is set to dark. The toggle writes the
     stamp; prefers-color-scheme only supplies the first guess for people who
     have never chosen. */
  :root {
    --paper:   #fbfbf8;
    --card:    #ffffff;
    --sunk:    #f1f1ec;
    --ink:     #16191c;
    --muted:   #55595e;
    --faint:   #8b8f93;
    --rule:    #d8d8d0;
    --rule-hard: #b9b9ae;
    --accent:  #0b5e52;
    --accent-soft: #dfece9;
    --on-accent: #ffffff;
    --mark:    #ffe89c;
    --mark-edge: #e0b93a;
    --signal:  #9c3a10;
    --signal-soft: #f6e7de;
  }
  :root[data-theme="dark"] {
    --paper:   #15171a;
    --card:    #1c1f23;
    --sunk:    #111316;
    --ink:     #e9e9e3;
    --muted:   #9aa0a6;
    --faint:   #6f757b;
    --rule:    #2b2f35;
    --rule-hard: #3d434a;
    --accent:  #4fb6a0;
    --accent-soft: #14332d;
    --on-accent: #08110e;
    --mark:    #4a3f14;
    --mark-edge: #8a7325;
    --signal:  #d9873f;
    --signal-soft: #2e1e12;
  }

  :root {
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif: ui-serif, "Iowan Old Style", Georgia, Cambria, serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ---------- shell ---------- */
  /* Three groups, not seven loose items: who we are, where you are, what you
     control. The progress bar moves out of the row entirely and becomes a
     hairline under the whole header, which is what it was trying to be. */
  .masthead {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center;
    gap: 26px; padding: 12px 22px 0; border-bottom: 1px solid var(--rule);
    background: var(--card); position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; }
  .brand img { width: 26px; height: 26px; border-radius: 2px; display: block; }
  .wordmark { font-size: 14.5px; font-weight: 620; letter-spacing: -.01em; line-height: 1.25; }
  .wordmark { font-size: 15px; }
  .tools { display: flex; align-items: center; gap: 12px; justify-content: flex-end; padding-bottom: 12px; }
  .progress { height: 2px; background: var(--sunk); }

  @media (max-width: 860px) {
    .masthead { grid-template-columns: 1fr; gap: 0; }

  /* Ruled tabs rather than a segmented pill. The pill is the shape every app
     reaches for, and with the shadows gone it had nothing left to distinguish
     the active one. */
  .modes { display: flex; gap: 22px; align-items: flex-end; justify-content: center; align-self: end; }
  .modes button {
    border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: transparent;

    transition: color .1s, border-color .1s;
  }
  .modes button:hover { color: var(--ink); }

  }

  .search { position: relative; flex: 0 1 260px; }
  .search input {
    font: inherit; width: 100%; padding: 6px 11px; border-radius: 2px;
    border: 1px solid var(--rule); background: var(--paper); color: var(--ink); font-size: 13px;
  }
  .search-out {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 40;
    background: var(--card); border: 1px solid var(--rule); border-radius: 2px;
     max-height: 340px; overflow-y: auto; padding: 5px;
  }
  .search-out:empty { display: none; }
  .search-out .head {
    font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--faint); padding: 7px 9px 4px; font-weight: 600;
  }

  .branch-chip {
    display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px;

    border: 1px solid transparent; padding: 5px 10px; border-radius: 2px; margin-bottom: 14px;
  }
  .branch-chip button { border: 0; background: transparent; color: inherit; padding: 0 2px; font-size: 14px; }

  .ledger { border-top: 1px solid var(--rule); margin-top: 34px; padding-top: 18px; }
  .ledger table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .ledger th {
    text-align: left; font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--faint); font-weight: 600; padding: 0 10px 7px 0; white-space: nowrap;
  }
  .ledger td { padding: 6px 10px 6px 0; border-top: 1px solid var(--rule); vertical-align: top; }
  .ledger td.codes { font-family: var(--mono); font-size: 11.5px; color: var(--accent); white-space: nowrap; }
  .ledger td.when { font-family: var(--mono); font-size: 11px; color: var(--faint); white-space: nowrap; }
  .ledger td.by { color: var(--muted); white-space: nowrap; }
  .ledger-wrap { overflow-x: auto; }
  .ledger .none { color: var(--signal); }

  .theme {
    border: 1px solid var(--rule-hard); background: var(--card); color: var(--muted);
    padding: 5px 10px; border-radius: 2px; font-family: var(--mono);
    font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
  }
  .theme:hover { color: var(--ink); border-color: var(--accent); }


  main { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; align-items: start; }

  /* ---------- the tree ---------- */
  .tree-pane {
    border-right: 1px solid var(--rule); background: var(--card);
    height: calc(100vh - 61px); overflow-y: auto; position: sticky; top: 61px;
  }

  .tree-head {
    padding: 15px 20px 11px; display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--card);
  }
  .tree-head h2 { margin: 0; font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
  .filled { font-family: var(--mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .row { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; }
  .row:hover { background: var(--sunk); }
  .row.lit { background: var(--accent-soft); }
  .twist {

  .node {

  .node.section { padding-top: 9px; padding-bottom: 9px; }

  .count {

  .count.has { color: var(--accent); font-weight: 600; }

  .bar { height: 3px; border-radius: 2px; background: var(--accent); opacity: .28; }

  /* ---------- record ---------- */
  .stage { padding: 26px 30px 60px; max-width: 780px; }

  .section-label {

  .ask {

  .info:hover { border-color: var(--accent); color: var(--accent); }

  .staged {

  .more {

  .extras { display: flex; flex-direction: column; gap: 9px; margin: 14px 0 4px; }

  .chip .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .finder { position: relative; margin-bottom: 20px; }

  .results { margin-top: 7px; display: flex; flex-direction: column; gap: 2px; max-height: 240px; overflow-y: auto; }
  .result {
    display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline;
    border: 0; background: transparent; text-align: left; padding: 7px 10px; border-radius: 2px;
  }
  .result:hover { background: var(--sunk); }
  .result .trail { display: block; font-size: 11.5px; color: var(--faint); }

  .actions { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; padding-top: 6px; border-top: 1px solid var(--rule); }
  .btn {
    border: 1px solid var(--rule-hard); background: var(--card); color: var(--ink);
    padding: 9px 16px; border-radius: 2px; font-size: 13.5px; font-weight: 500;
  }
  .btn:hover { border-color: var(--accent); background: var(--accent-soft); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  /* ---------- progress + explore ---------- */

  .explore-item { padding: 13px 0; border-bottom: 1px solid var(--rule); }
  .explore-item h4 { margin: 0 0 3px; font-family: var(--serif); font-size: 17px; font-weight: 500; }
  .explore-item .meta { color: var(--muted); font-size: 12.5px; }
  .empty { color: var(--muted); font-size: 14px; padding: 26px 0; }
  .empty strong { color: var(--signal); }

  .panel {
    background: var(--card); border: 1px solid var(--rule); border-radius: 2px;

<script>
(() => {
  "use strict";
  const DATA = JSON.parse(document.getElementById("graph").textContent);
  const TOPICS = new Map(DATA.topics.map(t => [t.code, t]));
  const KEY = "aocommons.filing.v1";

  const THEME_KEY = "aocommons.theme";
  function applyTheme(mode) {
    document.documentElement.setAttribute("data-theme", mode);
    const button = document.getElementById("theme");
    if (button) button.textContent = mode === "dark" ? "Light" : "Dark";
    try { localStorage.setItem(THEME_KEY, mode); } catch (e) { /* private browsing */ }
  }
  // No stored choice means follow the laptop. Once someone picks, their pick
  // wins and keeps winning — the OS is a default, not an override.
  const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  let theme = prefersDark ? "dark" : "light";
  try { theme = localStorage.getItem(THEME_KEY) || theme; } catch (e) { /* default holds */ }

  const state = {
    mode: "review",
    cursor: 0,
    picked: new Set(),
    open: new Set(),
    focusTopic: null,
    author: null,
    viewing: null,
    showAll: false,
    unsure: false,
    note: "",
    noteOpen: false,
    decisions: {},
  };

  // Work other people have already had merged. Fetched same-origin, so it
  // resolves on Pages and simply stays empty anywhere else — there is no
  // shared server behind this page, and pretending otherwise would be worse
  // than the gap.
  const merged = new Map();
  // A 404 here is the normal case and is caught below; browsers still log the
  // failed request, which is noise rather than a fault.
  fetch("gold.json")
    .then(r => (r.ok ? r.json() : null))
    .then(payload => {
      if (!payload) return;
      Object.entries(payload.records || {}).forEach(([id, d]) =>
        merged.set(id, { topics: d.topics || [], on: d.reviewed_on || "", by: d.reviewer || "merged" }));
      if (merged.size) { renderStage(); renderTree(); }
    })
    .catch(() => { /* absent is the normal case */ });

  // ---- persistence -------------------------------------------------------
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
    state.decisions = saved.decisions || {};
  } catch (e) { /* corrupt or unavailable storage should not block filing */ }

  const save = () => {
    try {
      localStorage.setItem(KEY, JSON.stringify({ decisions: state.decisions }));
    } catch (e) { /* private browsing; the session still works, export still offered */ }
  };

  // ---- helpers -----------------------------------------------------------
  const ancestors = code => {
    const parts = code.split(".");
    return parts.slice(0, -1).map((_, i) => parts.slice(0, i + 1).join("."));
  };
  const el = (tag, props = {}, kids = []) => {
    const node = Object.assign(document.createElement(tag), props);
    (Array.isArray(kids) ? kids : [kids]).forEach(k =>
      node.append(k instanceof Node ? k : document.createTextNode(k)));
    return node;
  };
  const samePerson = name => name.toLowerCase().replace(/[.'`-]/g, "").replace(/\s+/g, " ").trim();
  const info = text => {
    const mark = el("span", { className: "info" }, "i");
    mark.title = text;
    mark.setAttribute("role", "img");
    mark.setAttribute("aria-label", text);
    return mark;
  };
  const trailOf = code => ancestors(code).map(c => TOPICS.get(c)?.title).filter(Boolean).join(" › ");

  // Counts combine what the corpus already claims with what you have filed,
  // so the tree fills as you work rather than only after a rebuild.
  const counts = () => {
    const tally = new Map();
    const bump = code => {
      if (!TOPICS.has(code)) return;
      tally.set(code, (tally.get(code) || 0) + 1);
      ancestors(code).forEach(a => tally.set(a, (tally.get(a) || 0) + 1));
    };
    DATA.records.forEach(r => {
      const filed = state.decisions[r.id];
      (filed ? filed.topics : r.current).forEach(bump);
    });
    return tally;
  };

  const reviewed = () => Object.keys(state.decisions).length;

  // ---- the tree ----------------------------------------------------------
  // Two separate affordances on one row: the chevron opens the branch, the
  // label selects it. The first version had only the former, and a leaf did
  // nothing at all when clicked — which is why the whole pane read as a
  // static list rather than navigation.
  function renderTree() {
    const tally = counts();
    const host = document.getElementById("tree");
    host.textContent = "";

    const lit = new Set();
    state.picked.forEach(c => { lit.add(c); ancestors(c).forEach(a => lit.add(a)); });
    if (state.focusTopic) { lit.add(state.focusTopic); ancestors(state.focusTopic).forEach(a => lit.add(a)); }

    const max = Math.max(1, ...[...tally.values()]);
    const hasKids = code => DATA.topics.some(t => t.parent === code);

    DATA.topics.forEach(topic => {
      if (topic.depth > 0 && !state.open.has(topic.section)) return;
      if (topic.depth > 1 && !state.open.has(topic.parent)) return;

      const n = tally.get(topic.code) || 0;
      const row = el("div", { className: "row" + (lit.has(topic.code) ? " lit" : "") });
      row.style.paddingLeft = (10 + topic.depth * 14) + "px";

      const expandable = hasKids(topic.code);
      const twist = el("button", { className: "twist" + (expandable ? "" : " leaf") }, "▶");
      twist.setAttribute("aria-expanded", String(state.open.has(topic.code)));
      twist.setAttribute("aria-label", (state.open.has(topic.code) ? "Collapse " : "Expand ") + topic.code);
      if (expandable) {
        twist.addEventListener("click", event => {
          event.stopPropagation();
          state.open.has(topic.code) ? state.open.delete(topic.code) : state.open.add(topic.code);
          renderTree();
        });
      }

      const node = el("button", { className: "node" + (topic.depth === 0 ? " section" : "") });
      node.title = topic.points.length ? topic.points.join(" · ") : topic.title;
      node.append(
        el("span", { className: "label" }, [el("span", { className: "code" }, topic.code), topic.title]),
        el("span", { className: "count" + (n ? " has" : (topic.depth === 0 ? " gap" : "")) },
           n ? String(n) : (topic.depth === 0 ? "0" : "")),
      );
      node.addEventListener("click", () => focusBranch(topic.code));

      row.append(twist, node);
      host.append(row);

      if (n && topic.depth === 0) {
        const bar = el("div", { className: "bar" });
        bar.style.width = Math.max(6, (n / max) * 100) + "%";
        bar.style.marginLeft = "28px";
        host.append(bar);
      }
    });

    const covered = DATA.topics.filter(t => (tally.get(t.code) || 0) > 0).length;
    document.getElementById("filled").textContent = `${covered}/${DATA.topics.length} filed`;
    document.getElementById("meter").style.width =
      ((reviewed() / DATA.records.length) * 100) + "%";
  }

  // Selecting a branch narrows the queue. This is how a group divides the
  // work without a server telling anyone what to do: take a section, and the
  // records you see are the ones that branch plausibly covers.
  function focusBranch(code) {
    state.focusTopic = state.focusTopic === code ? null : code;
    state.cursor = 0;
    ancestors(code).forEach(a => state.open.add(a));
    renderStage(); renderTree();
  }

  // ---- review ------------------------------------------------------------
  function inBranch(record, code) {
    const under = t => t === code || t.startsWith(code + ".");
    return record.current.some(under) || record.suggested.some(under);
  }

  function queue() {
    let pending = DATA.records.filter(r => !state.decisions[r.id] && !merged.has(r.id));
    if (state.focusTopic) pending = pending.filter(r => inBranch(r, state.focusTopic));
    return pending;
  }

  function renderReview() {
    const stage = document.getElementById("stage");
    stage.textContent = "";
    const pending = queue();

    if (!pending.length) {
      stage.append(
        el("h2", {}, "Everything here is filed."),
        el("p", { className: "empty" }, `You have filed ${reviewed()} record${reviewed() === 1 ? "" : "s"}. Open Submit to send them in.`),
      );
      return;
    }

    const record = currentRecord();
    if (!record) { advance(); return; }
    const already = state.decisions[record.id];
    const kicker = el("div", { className: "kicker" }, [
      el("span", {}, record.type.replace(/-/g, " ")),
      el("span", {}, record.date || "undated"),
      el("span", {}, `${pending.length} left`),
    ]);

    const title = el("h1", { className: "record-title" }, record.title);
    const byline = el("p", { className: "byline" });
    if (record.authors.length) byline.append(record.authors.join(", ") + (record.authors.length >= 5 ? " et al." : ""));
    if (record.url) {
      byline.append(byline.textContent ? " · " : "");
      byline.append(el("a", { href: record.url, target: "_blank", rel: "noopener" }, "read the source"));
    }

    const abstract = record.abstract
      ? el("p", { className: "abstract" }, record.abstract)
      : el("p", { className: "abstract none" }, "No abstract available. Judge from the title and source, or skip — a guess here is worse than a gap.");

    if (state.focusTopic) stage.append(branchChip());
    stage.append(kicker, title, byline, abstract);

    // Everything that wants a decision lives in one marked block, so a
    // contributor can see where to act without reading first.
    const ask = el("div", { className: "ask" });
    ask.append(el("div", { className: "prompt" }, [
      el("span", { className: "step" }, already ? "added" : "your call"),
      el("strong", {}, "Which topics does this belong under?"),
      el("span", { className: "sub" }, "Pick every one that applies — most papers sit under two or three."),
      info("A topic is what the paper is about. Tag the most specific one that fits: "
           + "tagging 2.2.2 already implies 2.2 and 2, so there is no need to add the parents."),
    ]));

    // Five, not fourteen. A wall of near-misses makes the choice harder, and
    // retrieval puts a right answer in the top five often enough that the
    // rest are better as a deliberate second look than as noise.
    const TOP = 5;
    const ranked = [...new Set([...record.suggested, ...state.picked])];
    const shown = state.showAll ? ranked : [...new Set([...ranked.slice(0, TOP), ...state.picked])];
    const chips = el("div", { className: "chips" });
    shown.forEach(code => {
      const topic = TOPICS.get(code);
      if (!topic) return;
      const chip = el("button", { className: "chip" + (record.current.includes(code) ? " was" : "") });
      chip.setAttribute("aria-pressed", state.picked.has(code) ? "true" : "false");
      chip.title = trailOf(code) || topic.title;
      chip.append(el("span", { className: "c" }, code), el("span", { className: "t" }, topic.title));
      chip.addEventListener("click", () => {
        state.picked.has(code) ? state.picked.delete(code) : state.picked.add(code);
        renderReview(); renderTree();
      });
      chips.append(chip);
    });
    ask.append(chips);

    if (!state.showAll && ranked.length > TOP) {
      const more = el("button", { className: "more" }, `Show ${ranked.length - TOP} more suggestions`);
      more.addEventListener("click", () => { state.showAll = true; renderReview(); });
      ask.append(more);
    }

    // Free search over all 567.
    const finder = el("div", { className: "finder" });
    const input = el("input", { placeholder: "Nothing fits? Search all 567 topics — try “revocation”, “budget”, “incident”", type: "search" });
    const results = el("div", { className: "results" });
    input.addEventListener("input", () => {
      results.textContent = "";
      const q = input.value.trim().toLowerCase();
      if (q.length < 2) return;
      DATA.topics
        .map(t => {
          const hay = (t.title + " " + t.points.join(" ")).toLowerCase();
          let score = hay.includes(q) ? 2 : 0;
          if (t.title.toLowerCase().startsWith(q)) score += 2;
          if (t.code.startsWith(q)) score += 3;
          return { t, score };
        })
        .filter(x => x.score > 0)
        .sort((a, b) => b.score - a.score)
        .slice(0, 12)
        .forEach(({ t }) => {
          const hit = el("button", { className: "result" }, [
            el("span", { className: "code" }, t.code),
            el("span", {}, [t.title, el("span", { className: "trail" }, trailOf(t.code))]),
          ]);
          hit.addEventListener("click", () => {
            state.picked.add(t.code); input.value = ""; results.textContent = "";
            renderReview(); renderTree();
          });
          results.append(hit);
        });
    });
    finder.append(input, results);
    ask.append(finder);

    const extras = el("div", { className: "extras" });

    const unsureBox = el("input", { type: "checkbox", id: "unsure", checked: state.unsure });
    unsureBox.addEventListener("change", () => { state.unsure = unsureBox.checked; });
    extras.append(el("div", { className: "checkline" }, [
      unsureBox,
      el("label", { htmlFor: "unsure" }, [
        "I'm not certain about this one",
        info("Recorded with your answer. An unsure call is not weighed the same as a "
             + "confident one when the gold set is used to measure the classifier, and it "
             + "tells a maintainer where a second opinion is worth having."),
        el("span", { className: "why" },
           "Better than guessing quietly — say so and someone will look again."),
      ]),
    ]));

    const note = el("div", { className: "note" });
    if (state.noteOpen) {
      const area = el("textarea", {
        placeholder: "Anything that gave you trouble — a topic that almost fit, a branch you were torn between.",
        value: state.note,
      });
      area.addEventListener("input", () => { state.note = area.value; });
      note.append(area);
    } else {
      const open = el("button", { className: "more" }, "Add a note");
      open.addEventListener("click", () => { state.noteOpen = true; renderReview(); });
      note.append(open);
    }
    extras.append(note);
    ask.append(extras);

    const file = el("button", { className: "btn primary" },
      already ? `Update — ${state.picked.size} topic${state.picked.size === 1 ? "" : "s"}`
              : `Add to submission — ${state.picked.size || "no"} topic${state.picked.size === 1 ? "" : "s"}`);
    file.disabled = state.picked.size === 0;
    file.addEventListener("click", () => commit(record, [...state.picked], "filed"));

    // "None apply" was two different findings wearing one button. Out of
    // scope means the corpus is wrong to hold this; nothing fits means the
    // taxonomy has a gap. The second is a proposal waiting to happen and the
    // first is an ingestion error, so they are worth telling apart.
    const outOfScope = el("button", { className: "btn" }, "Out of scope");
    outOfScope.title = "This paper does not belong in the library at all. Use it when agents hold "
      + "no real authority in whatever it describes — the scope test the taxonomy sets. "
      + "It tells us the corpus is holding something it should not.";
    outOfScope.addEventListener("click", () => commit(record, [], "out-of-scope"));

    const noFit = el("button", { className: "btn" }, "Nothing fits");
    noFit.title = "The paper belongs here, but no topic in the taxonomy covers it. "
      + "That is a gap worth a proposal, and the most useful thing you can tell us — "
      + "leave a note saying what was closest.";
    noFit.addEventListener("click", () => commit(record, [], "no-topic-fits"));

    const skip = el("button", { className: "btn" }, already ? "Next" : "Skip");
    skip.title = already ? "Move on. Your decision is kept."
                         : "No opinion on this one. Nothing is recorded and it stays in the queue.";
    skip.addEventListener("click", () => {
      if (!already) state.cursor = (state.cursor + 1) % Math.max(1, pending.length);
      advance();
    });

    ask.append(el("div", { className: "actions" }, [
      file, outOfScope, noFit, skip,
      el("span", { className: "hint" }, `${reviewed()} filed by you`),
    ]));
    stage.append(ask);

    if (already) {
      const verdict = already.verdict === "out-of-scope" ? "marked out of scope"
        : already.verdict === "no-topic-fits" ? "marked as fitting no topic"
        : `added under ${already.topics.join(", ")}`;
      const next = el("button", { className: "btn primary" }, "Next record");
      next.addEventListener("click", () => { state.viewing = null; advance(); });
      stage.append(el("div", { className: "staged" }, [
        el("span", {}, [el("strong", {}, "In your submission — "), verdict,
                        ". Change anything above and press Update."]),
        next,
      ]));
    }

    stage.append(ledger());
  }

  function branchChip() {
    const topic = TOPICS.get(state.focusTopic);
    const clear = el("button", { title: "Show every record again" }, "×");
    clear.addEventListener("click", () => focusBranch(state.focusTopic));
    return el("div", { className: "branch-chip" },
      [`Working through ${state.focusTopic} · ${topic ? topic.title : ""}`, clear]);
  }

  // The audit trail. Everything filed, newest first, so a group can see what
  // has already been covered instead of duplicating each other.
  function ledger() {
    const rows = [
      ...Object.entries(state.decisions).map(([id, d]) => ({ id, ...d, by: "you" })),
      ...[...merged.entries()].map(([id, d]) => ({ id, ...d })),
    ].sort((a, b) => (b.on || "").localeCompare(a.on || ""));

    const wrap = el("div", { className: "ledger" });
    wrap.append(el("p", { className: "section-label" },
      `Filed so far — ${rows.length} record${rows.length === 1 ? "" : "s"}`));

    if (!rows.length) {
      wrap.append(el("p", { className: "empty" }, "Nothing filed yet. Yours will appear here as you go."));
      return wrap;
    }

    const table = el("table");
    table.append(el("tr", {}, [
      el("th", {}, "Record"), el("th", {}, "Filed under"), el("th", {}, "By"), el("th", {}, "When"),
    ]));
    rows.slice(0, 60).forEach(r => {
      const record = DATA.records.find(x => x.id === r.id);
      const title = (record ? record.title : r.id).slice(0, 76);
      let cell;
      if (record && state.decisions[r.id]) {
        const back = el("button", { className: "more" }, title);
        back.title = "Open this again and change it";
        back.addEventListener("click", () => { setMode("review"); openRecord(record); });
        cell = el("td", {}, back);
      } else {
        cell = el("td", {}, title);
      }
      table.append(el("tr", {}, [
        cell,
        r.topics.length
          ? el("td", { className: "codes" },
              r.topics.join("  ") + (r.unsure ? "  (unsure)" : ""))
          : el("td", { className: "codes none" },
              r.verdict === "out-of-scope" ? "out of scope"
                : r.verdict === "no-topic-fits" ? "nothing fits" : "none apply"),
        el("td", { className: "by" }, r.by || "—"),
        el("td", { className: "when" }, r.on || ""),
      ]));
    });
    wrap.append(el("div", { className: "ledger-wrap" }, table));
    if (rows.length > 60) wrap.append(el("p", { className: "empty" }, `…and ${rows.length - 60} more.`));
    return wrap;
  }

  function commit(record, topics, verdict) {
    const entry = { topics, verdict, on: new Date().toISOString().slice(0, 10) };
    if (state.unsure) entry.unsure = true;
    if (state.note.trim()) entry.note = state.note.trim();
    state.decisions[record.id] = entry;
    // Pin the view to this record. Adding removes it from the queue, so
    // without this the page would slide to the next one — which is the
    // auto-advance this flow exists to avoid.
    state.viewing = record.id;
    save(); renderReview(); renderTree();
  }

  // The queue holds unfiled records; `viewing` lets someone step back onto one
  // they have already added, so a decision can be changed before it is sent.
  function currentRecord() {
    if (state.viewing) {
      const found = DATA.records.find(r => r.id === state.viewing);
      if (found) return found;
    }
    const pending = queue();
    return pending.length ? pending[Math.min(state.cursor, pending.length - 1)] : null;
  }

  function openRecord(record) {
    state.viewing = record.id;
    const filed = state.decisions[record.id];
    state.picked = new Set(filed ? filed.topics : []);
    state.unsure = !!(filed && filed.unsure);
    state.note = (filed && filed.note) || "";
    state.noteOpen = !!state.note;
    state.showAll = false;
    renderReview(); renderTree();
  }

  function advance() {
    state.viewing = null;
    state.picked.clear();
    state.note = ""; state.noteOpen = false; state.unsure = false; state.showAll = false;
    renderReview(); renderTree();
  }

  // ---- explore -----------------------------------------------------------
  function renderExplore() {
    const stage = document.getElementById("stage");
    stage.textContent = "";
    const code = state.focusTopic;

    if (state.author) {
      const wanted = samePerson(state.author);
      const theirs = DATA.records.filter(r =>
        (r.authors || []).some(a => samePerson(a) === wanted));
      stage.append(
        el("div", { className: "kicker" }, [el("span", {}, "author")]),
        el("h1", { className: "record-title" }, state.author),
        el("p", { className: "section-label" },
          `${theirs.length} record${theirs.length === 1 ? "" : "s"} in the library`),
      );
      theirs.forEach(r => {
        const item = el("div", { className: "explore-item" });
        item.append(
          r.url ? el("h4", {}, el("a", { href: r.url, target: "_blank", rel: "noopener" }, r.title))
                : el("h4", {}, r.title),
          el("div", { className: "meta" }, [r.date, (r.current || []).join(", ")].filter(Boolean).join(" · ")),
        );
        stage.append(item);
      });
      const back = el("button", { className: "btn" }, "Clear author");
      back.addEventListener("click", () => { state.author = null; renderStage(); });
      stage.append(el("div", { className: "actions" }, back));
      return;
    }

    if (!code) {
      stage.append(
        el("h1", { className: "record-title" }, "Browse the tree"),
        el("p", { className: "empty" }, "Pick a topic on the left to see what the library holds under it — and where it holds nothing."),
      );
      return;
    }

    const topic = TOPICS.get(code);
    stage.append(
      el("div", { className: "kicker" }, [el("span", {}, code), el("span", {}, trailOf(code) || "top level")]),
      el("h1", { className: "record-title" }, topic.title),
    );
    if (topic.points.length) {
      stage.append(el("p", { className: "abstract" }, topic.points.join(" · ")));
    }
    if (topic.coding) {
      stage.append(el("p", { className: "byline" },
        "Part of the failure coding scheme — an incident normally carries several of these at once."));
    }

    const under = DATA.records.filter(r => {
      const filed = state.decisions[r.id];
      const tags = filed ? filed.topics : r.current;
      return tags.some(t => t === code || t.startsWith(code + "."));
    });

    stage.append(el("p", { className: "section-label" }, `${under.length} record${under.length === 1 ? "" : "s"} here`));
    if (!under.length) {
      stage.append(el("p", { className: "empty" }, [
        el("strong", {}, "Nothing filed here yet. "),
        "That is a finding worth publishing, not a hole to fill — unless the library holds something that belongs and nobody has filed it.",
      ]));
      return;
    }
    under.forEach(r => {
      const item = el("div", { className: "explore-item" });
      const heading = r.url
        ? el("h4", {}, el("a", { href: r.url, target: "_blank", rel: "noopener" }, r.title))
        : el("h4", {}, r.title);
      item.append(heading, el("div", { className: "meta" },
        [r.authors.slice(0, 3).join(", "), r.date].filter(Boolean).join(" · ")));
      stage.append(item);
    });
  }

  // ---- add a paper -------------------------------------------------------
  // Proposing a paper is a different act from filing one, and it needs a
  // different question answered: not "where does this go" but "why does this
  // belong at all". The scope test is the whole of the library's discipline,
  // so the form asks for it directly rather than hoping.
  function renderAdd() {
    const stage = document.getElementById("stage");
    stage.textContent = "";

    stage.append(
      el("h1", { className: "record-title" }, "Add a paper to the library"),
      el("p", { className: "abstract" },
        "Something missing? Send it in. A maintainer resolves the metadata and it "
        + "joins the corpus for everyone to file."),
    );

    const ask = el("div", { className: "ask" });
    ask.append(el("div", { className: "prompt" }, [
      el("span", { className: "step" }, "your call"),
      el("strong", {}, "Does it belong here?"),
      info("The library is scoped to organizations where machine agents hold real "
           + "operational or decision authority. Excellent work about human collective "
           + "governance, unchanged by the presence of agents, does not belong however "
           + "good it is."),
    ]));

    const fields = {};
    const field = (key, label, placeholder, hint, area) => {
      const wrap = el("div", { className: "note", style: "margin-bottom:13px" });
      wrap.append(el("p", { className: "section-label" }, label));
      const input = area
        ? el("textarea", { placeholder })
        : el("input", { placeholder, type: "text" });
      if (!area) {
        input.style.cssText = "font:inherit;width:100%;padding:9px 11px;border-radius:2px;"
          + "border:1px solid var(--rule-hard);background:var(--card);color:var(--ink)";
      }
      input.addEventListener("input", () => { fields[key] = input.value; });
      wrap.append(input);
      if (hint) wrap.append(el("span", { className: "why", style: "color:var(--faint);font-size:12px" }, hint));
      ask.append(wrap);
      return input;
    };

    field("id", "DOI, arXiv id, or link", "10.48550/arXiv.2502.14143   ·   2502.14143   ·   https://…",
          "Any one of these is enough — the metadata is resolved from it.");
    field("title", "Title", "If you have it to hand", "Optional, but it helps a reviewer recognize it.");
    field("why", "Why does it belong?",
          "What would change about how you design, operate, oversee, or hold accountable an "
          + "organization where agents act with real authority?",
          "This is the scope test, and it is the part a maintainer cannot answer for you.", true);
    field("topics", "Topics, if you already know them",
          "2.2, 11.6", "Optional. Codes from the tree on the left.", false);

    const submit = el("a", { className: "btn primary", target: "_blank", rel: "noopener" },
                      "Open an issue to add it");
    const update = () => {
      const body = [
        `**Identifier:** ${fields.id || "—"}`,
        `**Title:** ${fields.title || "—"}`,
        "",
        "**Why it belongs**",
        "",
        fields.why || "—",
        "",
        `**Suggested topics:** ${fields.topics || "—"}`,
      ].join("\n");
      submit.href = "https://github.com/AO-Commons/knowledge-graph/issues/new"
        + "?labels=new-resource"
        + "&title=" + encodeURIComponent(`[Add] ${fields.title || fields.id || "a paper"}`)
        + "&body=" + encodeURIComponent(body.slice(0, 5200));
    };
    update();
    ask.addEventListener("input", update);
    ask.append(el("div", { className: "actions" }, [
      submit,
      el("span", { className: "hint" }, "opens GitHub — you will be asked to sign in"),
    ]));
    stage.append(ask);
  }

  // ---- submit ------------------------------------------------------------
  function renderExport() {
    const stage = document.getElementById("stage");
    stage.textContent = "";
    const entries = Object.entries(state.decisions);

    stage.append(el("h1", { className: "record-title" }, "Send in what you filed"));

    if (!entries.length) {
      stage.append(el("p", { className: "empty" }, "Nothing filed yet. Head to Review."));
      return;
    }

    const lines = ["records:"];
    entries.sort().forEach(([id, d]) => {
      lines.push(`  ${id}:`);
      // Quoted deliberately: unquoted, YAML reads 11.10 as the number 11.1,
      // which is a different topic in this taxonomy and nothing would catch it.
      lines.push(`    topics: [${d.topics.map(t => `"${t}"`).join(", ")}]`);
      if (d.verdict && d.verdict !== "filed") lines.push(`    verdict: ${d.verdict}`);
      if (d.unsure) lines.push("    unsure: true");
      if (d.note) lines.push(`    note: ${JSON.stringify(d.note)}`);
      lines.push(`    reviewed_on: ${d.on}`);
    });
    const yaml = lines.join("\n");

    const panel = el("div", { className: "panel" });
    panel.append(
      el("h3", {}, `${entries.length} record${entries.length === 1 ? "" : "s"} ready`),
      el("p", {}, "Open an issue and a bot checks every code against the taxonomy, then opens a pull request against the gold set. You never touch git. If something is wrong it says which record, on your issue, and nothing is merged until it is fixed."),
    );
    const box = el("textarea", { readOnly: true, value: yaml });
    panel.append(box);

    const copy = el("button", { className: "btn primary" }, "Copy");
    copy.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(yaml); }
      catch (e) { box.select(); document.execCommand("copy"); }
      copy.textContent = "Copied";
      setTimeout(() => (copy.textContent = "Copy"), 1600);
    });

    const issue = el("a", {
      className: "btn",
      href: "https://github.com/AO-Commons/knowledge-graph/issues/new"
        + "?template=filing.yml&labels=filing"
        + "&title=" + encodeURIComponent(`[Filing] ${entries.length} record(s)`)
        + "&filing=" + encodeURIComponent(yaml.slice(0, 5200)),
      target: "_blank", rel: "noopener",
    }, "Open an issue");

    const reset = el("button", { className: "btn" }, "Clear mine");
    reset.addEventListener("click", () => {
      if (!confirm("Delete everything you filed in this browser? This cannot be undone.")) return;
      state.decisions = {}; save(); renderExport(); renderTree();
    });

    panel.append(el("div", { className: "actions" }, [copy, issue, reset]));
    stage.append(panel);

    stage.append(el("p", { className: "empty" },
      "Your filing lives only in this browser until you send it. Nothing is uploaded automatically."));
  }

  // ---- search ------------------------------------------------------------
  // One box over three things people actually look for: a topic they have in
  // mind, an author they follow, and a paper they remember the title of.
  function runSearch(term) {
    const out = document.getElementById("q-out");
    out.textContent = "";
    const q = term.trim().toLowerCase();
    if (q.length < 2) return;

    const topics = DATA.topics
      .map(t => {
        const hay = (t.title + " " + t.points.join(" ")).toLowerCase();
        let score = hay.includes(q) ? 2 : 0;
        if (t.title.toLowerCase().startsWith(q)) score += 3;
        if (t.code.startsWith(q)) score += 5;
        return { t, score };
      })
      .filter(x => x.score > 0)
      .sort((a, b) => b.score - a.score)
      .slice(0, 6);

    const people = new Map();
    DATA.records.forEach(r => (r.authors || []).forEach(a => {
      if (!a.toLowerCase().includes(q)) return;
      const key = samePerson(a);
      const seen = people.get(key) || { label: a, n: 0 };
      // Keep the fuller spelling: "Joel Z. Leibo" over "Joel Z Leibo".
      if (a.length > seen.label.length) seen.label = a;
      seen.n += 1;
      people.set(key, seen);
    }));

    const papers = DATA.records
      .filter(r => r.title.toLowerCase().includes(q))
      .slice(0, 6);

    if (topics.length) {
      out.append(el("div", { className: "head" }, "Topics"));
      topics.forEach(({ t }) => {
        const hit = el("button", { className: "result" }, [
          el("span", { className: "code" }, t.code),
          el("span", {}, [t.title, el("span", { className: "trail" }, trailOf(t.code))]),
        ]);
        hit.addEventListener("click", () => { clearSearch(); focusBranch(t.code); });
        out.append(hit);
      });
    }

    if (people.size) {
      out.append(el("div", { className: "head" }, "Authors"));
      [...people.values()].sort((a, b) => b.n - a.n).slice(0, 5).forEach(({ label: name, n }) => {
        const hit = el("button", { className: "result" }, [
          el("span", { className: "code" }, String(n)),
          el("span", {}, [name, el("span", { className: "trail" },
            `${n} record${n === 1 ? "" : "s"} in the library`)]),
        ]);
        hit.addEventListener("click", () => { clearSearch(); showAuthor(name); });
        out.append(hit);
      });
    }

    if (papers.length) {
      out.append(el("div", { className: "head" }, "Records"));
      papers.forEach(r => {
        const hit = el("button", { className: "result" }, [
          el("span", { className: "code" }, state.decisions[r.id] || merged.has(r.id) ? "✓" : "·"),
          el("span", {}, [r.title.slice(0, 68),
            el("span", { className: "trail" }, (r.authors || []).slice(0, 3).join(", "))]),
        ]);
        hit.addEventListener("click", () => { clearSearch(); jumpTo(r); });
        out.append(hit);
      });
    }

    if (!out.childElementCount) {
      out.append(el("div", { className: "head" }, "Nothing matched"));
    }
  }

  function clearSearch() {
    document.getElementById("q").value = "";
    document.getElementById("q-out").textContent = "";
  }

  function jumpTo(record) {
    state.focusTopic = null;
    if (state.decisions[record.id]) delete state.decisions[record.id];
    const pending = queue();
    state.cursor = Math.max(0, pending.findIndex(r => r.id === record.id));
    state.picked = new Set(record.current);
    setMode("review");
  }

  function showAuthor(name) {
    state.author = name;
    setMode("explore");
  }

  // ---- wiring ------------------------------------------------------------
  function renderStage() {
    ({ review: renderReview, explore: renderExplore, add: renderAdd, export: renderExport })[state.mode]();
  }
  function setMode(mode) {
    state.mode = mode;
    ["review", "explore", "add", "export"].forEach(m =>
      document.getElementById("mode-" + m).setAttribute("aria-pressed", String(m === mode)));
    renderStage(); renderTree();
  }
  document.getElementById("mode-review").addEventListener("click", () => setMode("review"));
  document.getElementById("mode-explore").addEventListener("click", () => setMode("explore"));
  document.getElementById("mode-add").addEventListener("click", () => setMode("add"));
  document.getElementById("mode-export").addEventListener("click", () => setMode("export"));

  const box = document.getElementById("q");
  box.addEventListener("input", () => runSearch(box.value));
  box.addEventListener("keydown", event => { if (event.key === "Escape") clearSearch(); });
  document.addEventListener("click", event => {
    if (!event.target.closest(".search")) document.getElementById("q-out").textContent = "";
  });


  applyTheme(theme);
  document.getElementById("theme").addEventListener("click", () => {
    theme = theme === "dark" ? "light" : "dark";
    applyTheme(theme);
  });

  DATA.topics.filter(t => t.depth === 0).forEach(t => state.open.add(t.code));
  renderTree(); renderStage();
})();
</script>
