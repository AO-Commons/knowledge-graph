<meta name="description" content="Collectively tag research on agentic organizations against the AO Commons taxonomy.">

<style>
  /* Light is the default and is stamped explicitly, so the page does not
     change under someone whose laptop is set to dark. The toggle writes the
     stamp; prefers-color-scheme only supplies the first guess for people who
     have never chosen. */
  :root {
    --paper:   #fbfbf8;
    --card:    #ffffff;
    --sunk:    #f1f1ec;
    --ink:     #16191c;
    --muted:   #55595e;
    /* 4.6:1 on the sunk surface, 5.2:1 on card. The old value was
       2.87:1 against sunk — below AA on every surface in both themes,
       and it carried the quote, the context line and every hint on the
       review screen, which is most of what a reviewer reads. */
    --faint:   #686d72;
    --rule:    #d8d8d0;
    --rule-hard: #b9b9ae;
    --accent:  #0b5e52;
    --accent-soft: #dfece9;
    --n-relates: #b5452f;
    --on-accent: #ffffff;
    --mark:    #ffe89c;
    --mark-edge: #e0b93a;
    --signal:  #9c3a10;
    --signal-soft: #f6e7de;
  }
  :root[data-theme="dark"] {
    --paper:   #15171a;
    --card:    #1c1f23;
    --sunk:    #111316;
    --ink:     #e9e9e3;
    --muted:   #9aa0a6;
    --faint:   #8e949a;   /* 5.4:1 on card, 6.1:1 on sunk */
    --rule:    #2b2f35;
    --rule-hard: #3d434a;
    --accent:  #4fb6a0;
    --accent-soft: #14332d;
    --n-relates: #e07a5f;
    --on-accent: #08110e;
    --mark:    #4a3f14;
    --mark-edge: #8a7325;
    --signal:  #d9873f;
    --signal-soft: #2e1e12;
  }

  :root {
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif: ui-serif, "Iowan Old Style", Georgia, Cambria, serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ---------- shell ---------- */
  /* Three groups, not seven loose items: who we are, where you are, what you
     control. The progress bar moves out of the row entirely and becomes a
     hairline under the whole header, which is what it was trying to be. */
  .masthead {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center;
    gap: 20px; padding: 12px 22px 0; border-bottom: 1px solid var(--rule);
    background: var(--card); position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; }
  .brand img { width: 26px; height: 26px; border-radius: 2px; display: block; }
  .wordmark { font-size: 14.5px; font-weight: 620; letter-spacing: -.01em; line-height: 1.25; }
  .wordmark { font-size: 15px; }
  .tools { display: flex; align-items: center; gap: 12px; justify-content: flex-end;
           padding-bottom: 12px; min-width: 0; }
  .progress { height: 2px; background: var(--sunk); }
  .progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  @media (max-width: 860px) {
    .masthead { grid-template-columns: 1fr; gap: 0; }
    .tools { justify-content: flex-start; flex-wrap: wrap; }
  }

  /* Ruled tabs rather than a segmented pill. The pill is the shape every app
     reaches for, and with the shadows gone it had nothing left to distinguish
     the active one. */
  .modes { display: flex; gap: 22px; align-items: flex-end; justify-content: center; align-self: end; }
  .modes a {
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .modes a, .modes button {
    border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: transparent;
    color: var(--muted); padding: 4px 1px 6px; font-size: 13px; font-weight: 500;
    transition: color .1s, border-color .1s;
  }
  .modes a:hover, .modes button:hover { color: var(--ink); }
  .modes button[aria-pressed="true"] {
    color: var(--ink); border-bottom-color: var(--accent); font-weight: 620;
  }

  .search { position: relative; flex: 1 1 340px; min-width: 220px; max-width: 460px; }
  .search input {
    font: inherit; width: 100%; padding: 6px 11px; border-radius: 2px;
    border: 1px solid var(--rule); background: var(--paper); color: var(--ink); font-size: 13px;
  }
  .search-out {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 40;
    width: max(100%, 520px);
    background: var(--card); border: 1px solid var(--rule); border-radius: 2px;
     max-height: 420px; overflow-y: auto; padding: 5px;
  }
  .search-out:empty { display: none; }
  .search-out .head {
    font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--faint); padding: 7px 9px 4px; font-weight: 600;
  }

  .branch-chip {
    display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px;
    background: var(--accent-soft); color: var(--accent-ink);
    border: 1px solid transparent; padding: 5px 10px; border-radius: 2px; margin-bottom: 14px;
  }
  .branch-chip button { border: 0; background: transparent; color: inherit; padding: 0 2px; font-size: 14px; }

  .ledger { border-top: 1px solid var(--rule); margin-top: 34px; padding-top: 18px; }
  .ledger table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .ledger th {
    text-align: left; font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--faint); font-weight: 600; padding: 0 10px 7px 0; white-space: nowrap;
  }
  .ledger td { padding: 6px 10px 6px 0; border-top: 1px solid var(--rule); vertical-align: top; }
  .ledger td.codes { font-family: var(--mono); font-size: 11.5px; color: var(--accent); white-space: nowrap; }
  .ledger td.when { font-family: var(--mono); font-size: 11px; color: var(--faint); white-space: nowrap; }
  .ledger td.by { color: var(--muted); white-space: nowrap; }
  .ledger-wrap { overflow-x: auto; }
  .ledger .none { color: var(--signal); }

  .theme {
    border: 1px solid var(--rule-hard); background: var(--card); color: var(--muted);
    padding: 5px 10px; border-radius: 2px; font-family: var(--mono);
    font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
  }
  .theme:hover { color: var(--ink); border-color: var(--accent); }


  main { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

  /* ---------- the tree ---------- */
  .tree-pane {
    border-right: 1px solid var(--rule); background: var(--card);
    height: calc(100vh - 61px); overflow-y: auto; position: sticky; top: 61px;
  }
  @media (max-width: 900px) { .tree-pane { height: auto; position: static; border-right: 0; border-bottom: 1px solid var(--rule); } }

  .tree-head {
    padding: 15px 20px 11px; display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--card);
  }
  .tree-head h2 { margin: 0; font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
  .filled { font-family: var(--mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .row { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; }
  .row:hover { background: var(--sunk); }
  .row.lit { background: var(--accent-soft); }
  .twist {
    border: 0; background: transparent; color: var(--faint); padding: 4px 0;
    font-size: 9px; line-height: 1; transition: transform .12s;
  }
  .twist[aria-expanded="true"] { transform: rotate(90deg); }
  .twist.leaf { visibility: hidden; }
  .node {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px;
    width: 100%; text-align: left; border: 0; background: transparent;
    padding: 5px 20px 5px 0; border-bottom: 1px solid transparent;
  }
  .node.section { padding-top: 9px; padding-bottom: 9px; }
  .node.section .label { font-weight: 600; }
  .code {
    font-family: var(--mono); font-size: 11.5px; color: var(--faint);
    font-variant-numeric: tabular-nums; margin-right: 9px;
  }
  .node.lit .code, .node.lit .label { color: var(--accent-ink); }
  .label { font-size: 13.5px; }
  .count {
    font-family: var(--mono); font-size: 11px; color: var(--faint);
    font-variant-numeric: tabular-nums; min-width: 20px; text-align: right;
  }
  .count.has { color: var(--accent); font-weight: 600; }
  .count.gap { color: var(--signal); }
  .bar { height: 3px; border-radius: 2px; background: var(--accent); opacity: .28; }

  /* ---------- record ---------- */
  .stage { padding: 26px 30px 60px; max-width: 780px; }
  @media (max-width: 700px) { .stage { padding: 20px 18px 50px; } }

  .kicker {
    font-family: var(--mono); font-size: 11px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--faint); display: flex; gap: 10px; flex-wrap: wrap;
  }
  .record-title {
    font-family: var(--serif); font-size: 27px; line-height: 1.25; margin: 10px 0 8px;
    text-wrap: balance; letter-spacing: -.008em;
  }
  .byline { color: var(--muted); font-size: 13.5px; margin-bottom: 18px; }
  .byline a { color: var(--accent); }
  .abstract {
    font-family: var(--serif); font-size: 16.5px; line-height: 1.62; color: var(--ink);
    max-width: 66ch; margin: 0 0 22px; padding-left: 15px; border-left: 2px solid var(--rule);
  }
  .abstract.none { font-family: var(--sans); font-size: 14px; color: var(--signal); border-left-color: var(--signal); }

  /* A claim and the sentence it came from. The quote is set apart and in the
     serif so the eye can tell the source from our paraphrase at a glance —
     confusing the two is the one mistake this panel cannot afford. */
  .tool-card {
    border: 1px solid var(--rule); border-left: 2px solid var(--accent);
    padding: 15px 17px; margin-top: 14px; background: var(--card);
  }
  .tool-head h3 { margin: 0 0 3px; font-family: var(--serif); font-size: 18px; font-weight: 500; }
  .tool-head .byline { margin: 0 0 10px; font-size: 12.5px; color: var(--faint); }
  .profile {
    display: flex; flex-direction: column; gap: 9px;
    margin: 10px 0 2px; padding-left: 13px; border-left: 2px solid var(--accent-soft);
  }
  .profile-facts { margin: 0; font-size: 12.5px; color: var(--faint); }
  .profile-row { display: grid; grid-template-columns: 150px 1fr; gap: 14px; align-items: baseline; }
  .profile-label {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .07em;
    text-transform: uppercase; color: var(--faint);
  }
  .profile-value { font-size: 13.5px; line-height: 1.55; color: var(--ink); max-width: 62ch; }
  @media (max-width: 700px) { .profile-row { grid-template-columns: 1fr; gap: 3px; } }

  .claims-block { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--rule-hard); }
  .kicker .flag { color: var(--accent); font-weight: 600; }
  .claim { padding: 14px 0 14px 13px; border-top: 1px solid var(--rule);
           border-left: 2px solid transparent; }
  /* What is left to do should be findable by scrolling, not by reading.
     A judged statement steps back; an unjudged one keeps its weight. */
  .claim.judged { border-left-color: var(--accent); opacity: .62; }
  .claim.judged:hover, .claim.judged:focus-within { opacity: 1; }
  .claim:first-of-type { border-top: none; }
  .claim-text { font-size: 15px; line-height: 1.5; color: var(--ink); margin: 2px 0 10px; max-width: 62ch; }
  .ready { border-bottom: 1px solid var(--rule-hard); }
  .ready:empty { border-bottom: none; }
  .ready h2 { font-size: 12px; letter-spacing: .04em; margin: 0; }
  .ready-row {
    display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left;
    background: none; border: 0; font: inherit; color: var(--ink);
    padding: 7px 12px; cursor: pointer; border-top: 1px solid var(--rule);
  }
  .ready-row:hover { background: var(--mark); }
  .ready-row .t { flex: 1; font-size: 12.5px; line-height: 1.35; }
  .ready-row .s {
    font-family: var(--mono); font-size: 10px; color: var(--faint); white-space: nowrap;
  }
  .ready-row.done .s { color: var(--accent); }
  .claim.mine { border-left: 2px solid var(--accent); padding-left: 12px; }
  /* Borrowed claims. The badge changes the question being asked, so it sits
     above the paraphrase rather than beside it as a footnote. */
  .claim-borrowed {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .05em;
    color: var(--accent); border: 1px solid var(--accent-soft);
    padding: 3px 7px; display: inline-block; margin: 0 0 8px;
  }
  /* Concepts are the route out of one claim and into the others arguing
     about the same thing. Buttons, not labels — they go somewhere. */
  .concepts { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 10px; }
  .concept {
    font-family: var(--mono); font-size: 11.5px; color: var(--accent);
    border: 1px solid var(--accent-soft); background: var(--accent-soft);
    padding: 4px 9px; cursor: pointer; border-radius: 2px;
  }
  .concept:hover, .concept:focus { border-color: var(--accent); }
  .concept .n { opacity: .55; margin-left: 5px; }
  /* A relation is an assertion about two claims, so it is drawn as a block
     rather than a line of metadata — and an unconfirmed one is marked,
     because a model's suggestion and a person's judgment must never look
     alike. */
  .relation {
    border-left: 2px solid var(--n-relates, var(--accent)); padding: 7px 0 7px 12px;
    margin: 10px 0 2px; font-size: 13px; line-height: 1.5;
  }
  .relation .rel-kind {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .07em;
    text-transform: uppercase; color: var(--n-relates, var(--accent));
  }
  .relation .rel-other { color: var(--ink); margin: 3px 0; }
  .relation .rel-why { color: var(--faint); font-size: 12.5px; }
  .relation .rel-draft {
    font-family: var(--mono); font-size: 10.5px; color: var(--accent);
    margin-top: 4px;
  }
  .stage-wrap { min-width: 0; }
  .concept-panel {
    border: 1px solid var(--rule-hard); border-top: 2px solid var(--n-relates, var(--accent));
    background: var(--card); padding: 16px 18px; margin-bottom: 18px;
  }
  .concept-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .concept-head h2 { margin: 0; font-family: var(--serif); font-size: 19px; font-weight: 500; }
  .concept-head .hint { margin: 2px 0 0; }
  #concept-close {
    font-family: var(--mono); font-size: 11px; background: none; cursor: pointer;
    border: 1px solid var(--rule); color: var(--faint); padding: 4px 9px;
  }
  #concept-close:hover { color: var(--ink); border-color: var(--rule-hard); }
  /* The three actions are the work. They were chips — the same weight as a
     tag, which is a label rather than a control — and sat below a quote in
     the same gray. */
  .claim .chips { gap: 7px; margin-top: 4px; }
  .claim .chip {
    font-size: 13px; font-weight: 500; padding: 7px 14px;
    border: 1px solid var(--rule-hard); color: var(--ink); background: var(--card);
  }
  .claim .chip:hover { border-color: var(--accent); color: var(--accent); }
  .claim .chip[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: var(--on-accent);
  }
  /* The task header. A count, a bar, and one line of instruction. */
  .prompt.task { position: relative; }
  .prompt.task strong { font-size: 16px; }
  .prompt.task .count {
    position: absolute; top: 0; right: 0;
    font-family: var(--mono); font-size: 12px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .progress {
    display: block; height: 3px; background: var(--rule);
    margin: 9px 0 8px; overflow: hidden;
  }
  .progress .fill { display: block; height: 100%; background: var(--accent); }
  /* The type, as a badge rather than a word in a row of gray words. It is
     the first thing that tells a reviewer what kind of judgment this is. */
  .type-badge {
    font-family: var(--mono); font-size: 10px; letter-spacing: .07em;
    text-transform: uppercase; padding: 2px 7px; border-radius: 2px;
    border: 1px solid transparent;
  }
  .type-badge.primary {
    color: var(--accent); background: var(--accent-soft); border-color: var(--accent-soft);
  }
  .type-badge.supporting { color: var(--faint); border-color: var(--rule); }

  .group-head {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 12px; margin: 18px 0 2px; padding-bottom: 5px;
    border-bottom: 1px solid var(--rule-hard);
  }
  .group-head.supporting { border-bottom-color: var(--rule); }
  .group-head .g-title { font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .group-head.supporting .g-title { font-weight: 500; color: var(--muted); }
  .group-head .g-count {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .chip.derived { border-style: dashed; }
  .chip.derived .n { opacity: .55; margin-left: 6px; font-size: 10.5px; }
  .retag-label {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .05em;
    color: var(--faint); align-self: center; margin-right: 2px;
  }
  .concept.still { border-style: dashed; cursor: default; }
  /* A tag your wording suggested, sitting alongside the ones the
     extraction gave. Marked so the two are not mistaken for each other. */
  .concept.still.added { border-style: solid; border-color: var(--accent); }
  .claim-add { margin-top: 16px; }
  .claim-add textarea { min-height: 62px; }
  .claim-context { font-size: 13.5px; line-height: 1.5; color: var(--faint); margin: -4px 0 10px; max-width: 62ch; }
  .claim-where { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em;
                 text-transform: uppercase; color: var(--faint); margin: -6px 0 10px; }
  .claim-quote {
    font-family: var(--serif); font-size: 14.5px; line-height: 1.6; color: var(--faint);
    margin: 0 0 12px; padding-left: 13px; border-left: 2px solid var(--rule-hard);
    max-width: 62ch;
  }

  .section-label {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--faint); font-weight: 500; margin: 0 0 10px;
  }

  /* The one part of the page that wants something from you. Marked the way
     you would mark a paper form: a highlighter stripe down the edge and a
     tinted ground, so where to act is obvious before anything is read. */
  .ask {
    border: 1px solid var(--rule-hard); border-left: 4px solid var(--mark-edge);
    background: var(--card); padding: 16px 18px 18px; margin: 0 0 20px;
  }
  /* Descendant, not child: the claims block sits inside .ask, so a child
     selector skipped it and its heading ran straight into its subtitle. */
  .ask .prompt {
    display: flex; align-items: baseline; gap: 9px; margin: 0 0 13px; flex-wrap: wrap;
  }
  .ask .prompt strong { font-size: 15px; font-weight: 620; }
  .ask .prompt .sub { color: var(--muted); font-size: 13px; }
  .ask .step {
    font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink); background: var(--mark);
    padding: 3px 7px; white-space: nowrap;
  }
  .marked { background: var(--mark); padding: 0 3px; }

  /* Native title tooltips: no JS, keyboard reachable, and they cannot end up
     positioned off-screen the way a hand-rolled popover does. */
  .info-wrap { position: relative; display: inline-block; }
  .info {
    display: inline-flex; align-items: center; justify-content: center;
    width: 14px; height: 14px; border: 1px solid var(--rule-hard); border-radius: 50%;
    font-size: 9.5px; font-family: var(--mono); color: var(--muted); background: none;
    padding: 0; margin-left: 5px; cursor: help; vertical-align: 1px;
  }
  .info:hover, .info-wrap.open .info { border-color: var(--accent); color: var(--accent); }
  .tip {
    position: absolute; z-index: 40; left: -8px; top: calc(100% + 8px);
    width: max-content; max-width: min(46ch, 78vw);
    display: flex; flex-direction: column; gap: 9px;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--rule-hard); border-left: 2px solid var(--accent);
    padding: 11px 13px; box-shadow: 0 8px 26px rgba(0, 0, 0, .13);
    /* These sit inside uppercase mono labels and flex prompts, so every
       inherited text property has to be said again or the explanation
       arrives letter-spaced and shouting. */
    font-family: var(--sans); font-size: 12.5px; font-weight: 400; line-height: 1.55;
    text-transform: none; letter-spacing: 0; text-align: left; white-space: normal;
    opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .12s ease;
  }
  .tip.flip { left: auto; right: -8px; }
  .info-wrap:hover .tip, .info:focus-visible + .tip, .info-wrap.open .tip {
    opacity: 1; visibility: visible; pointer-events: auto;
  }

  .staged {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    border: 1px solid var(--accent); background: var(--accent-soft);
    color: var(--accent); padding: 9px 13px; margin-top: 14px; font-size: 13px;
  }
  .staged strong { color: var(--ink); font-weight: 620; }
  .staged .btn { margin-left: auto; }

  /* No anchor rule existed, so every bare link rendered in the browser's
     default blue, and purple once visited — unreadable on the dark theme and
     only accidentally tolerable on the light one. `visited` has to be said
     explicitly or it keeps the default. */
  a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
  a:visited { color: var(--accent); }
  a:hover { color: var(--ink); text-decoration-color: var(--accent); }

  .more {
    border: 0; background: transparent; color: var(--accent); font-size: 12.5px;
    padding: 6px 2px; text-decoration: underline; text-underline-offset: 3px;
  }
  .extras { display: flex; flex-direction: column; gap: 9px; margin: 14px 0 4px; }
  .checkline { display: flex; align-items: flex-start; gap: 9px; font-size: 13px; color: var(--muted); }
  .checkline input { margin: 3px 0 0; accent-color: var(--accent); }
  .checkline label { cursor: pointer; }
  .checkline .why { display: block; color: var(--faint); font-size: 12px; }
  .note textarea {
    min-height: 66px; font-family: var(--sans); font-size: 13px; background: var(--card);
  }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 20px; }
  .chip {
    display: inline-flex; align-items: baseline; gap: 8px; max-width: 100%;
    border: 1px solid var(--rule-hard); background: var(--card); color: var(--ink);
    padding: 7px 11px; border-radius: 2px; font-size: 13px;
    transition: border-color .1s, background .1s;
  }
  .chip:hover { border-color: var(--accent); background: var(--accent-soft); }
  .chip .c { font-family: var(--mono); font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .chip .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .chip[aria-pressed="true"] .c { color: var(--on-accent); opacity: .72; }
  .chip.was { border-style: dashed; }

  .finder { position: relative; margin-bottom: 20px; }
  .finder input {
    font: inherit; width: 100%; padding: 10px 13px; border-radius: 2px;
    border: 1px solid var(--rule); background: var(--card); color: var(--ink);
  }
  .finder input::placeholder { color: var(--faint); }
  .results { margin-top: 7px; display: flex; flex-direction: column; gap: 2px; max-height: 240px; overflow-y: auto; }
  .result {
    display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline;
    border: 0; background: transparent; text-align: left; padding: 7px 10px; border-radius: 2px;
    width: 100%;
  }
  .result > span:last-child { overflow-wrap: anywhere; }
  .result:hover { background: var(--sunk); }
  .result .trail { display: block; font-size: 11.5px; color: var(--faint); }

  .actions { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; padding-top: 6px; border-top: 1px solid var(--rule); }
  .btn {
    border: 1px solid var(--rule-hard); background: var(--card); color: var(--ink);
    padding: 9px 16px; border-radius: 2px; font-size: 13.5px; font-weight: 500;
  }
  .btn:hover { border-color: var(--accent); background: var(--accent-soft); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .hint { color: var(--faint); font-size: 12px; margin-left: auto; font-family: var(--mono); }

  /* ---------- progress + explore ---------- */

  .explore-item {
    display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center;
    padding: 14px 0; border-bottom: 1px solid var(--rule);
  }
  .explore-item h4 { margin: 0 0 3px; font-family: var(--serif); font-size: 17px; font-weight: 500; }
  .explore-item h4 a, .explore-item h4 a:visited {
    color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule-hard);
    text-underline-offset: 3px;
  }
  .explore-item h4 a:hover { text-decoration-color: var(--accent); color: var(--accent); }
  .explore-item .meta { color: var(--muted); font-size: 12.5px; }
  .reviews {
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px; text-align: right;
  }
  .reviews .count {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase;
    color: var(--faint); min-width: 0;
  }
  .reviews .count.some { color: var(--accent); }
  @media (max-width: 620px) {
    .explore-item { grid-template-columns: 1fr; }
    .reviews { align-items: flex-start; text-align: left; }
  }
  .empty { color: var(--muted); font-size: 14px; padding: 26px 0; }
  .empty strong { color: var(--signal); }

  .panel {
    background: var(--card); border: 1px solid var(--rule); border-radius: 2px;
    padding: 18px 20px; margin-bottom: 22px;
  }
  .panel h3 { margin: 0 0 8px; font-size: 15px; }
  .panel p { margin: 0 0 10px; color: var(--muted); font-size: 13.5px; max-width: 62ch; }
  textarea {
    font-family: var(--mono); font-size: 12px; width: 100%; min-height: 190px;
    border: 1px solid var(--rule); border-radius: 2px; padding: 12px;
    background: var(--sunk); color: var(--ink); resize: vertical;
  }
  .done { color: var(--accent); font-size: 13px; }
</style>

ctiveness measurement","Assurance framework composition and gap analysis","Third-party assessment and certification"],"aka":[]},{"code":"14.5","title":"Simulation and modeling","parent":"14","section":"14","depth":1,"coding":false,"points":["Agent-based simulation of organizational dynamics","Digital twins and scenario testing","Adversarial simulation and wargaming","Model validation and calibration"],"aka":["arena","competition environment","sandbox evaluation environment","agent-economy simulator"]},{"code":"15","title":"Borrowed foundations","parent":null,"section":"15","depth":0,"coding":false,"points":[],"aka":[]},{"code":"15.1","title":"From human collective governance","parent":"15","section":"15","depth":1,"coding":false,"points":["Delegation and liquid democracy theory","Reputation and sybil resistance mechanisms","Emergency powers and constitutional safeguards","Agenda control and proposal lifecycle"],"aka":[]},{"code":"15.2","title":"From safety-critical industries","parent":"15","section":"15","depth":1,"coding":false,"points":["Aviation automation and cockpit design","Nuclear and process safety","Autonomous vehicle oversight regimes","Medical device and clinical decision support"],"aka":[]},{"code":"15.3","title":"From organizational theory","parent":"15","section":"15","depth":1,"coding":false,"points":["Principal-agent and monitoring literature","High reliability organizations","Normal accident theory","Organizational learning and memory"],"aka":[]},{"code":"15.4","title":"From security practice","parent":"15","section":"15","depth":1,"coding":false,"points":["Zero trust architecture","Identity and access management","Supply chain security","Incident response practice"],"aka":[]},{"code":"15.5","title":"From law and regulation","parent":"15","section":"15","depth":1,"coding":false,"points":["Corporate agency law","Professional licensing and supervised practice","Vicarious liability doctrine","Administrative law and automated decision review"],"aka":[]},{"code":"15.6","title":"From reinforcement learning","parent":"15","section":"15","depth":1,"coding":false,"points":["Multi-agent reinforcement learning -- social dilemmas, cooperation, and competition between trained agents","Generalization to unfamiliar partners and novel social situations","Evaluation environments and benchmark suites","Reward design, and what optimizing a proxy does to a population"],"aka":["MARL","multi-agent reinforcement learning","multi agent reinforcement learning","social dilemma benchmark","melting pot","cooperative AI benchmark"]},{"code":"16","title":"Empirical study and methods","parent":null,"section":"16","depth":0,"coding":false,"points":[],"aka":[]},{"code":"16.1","title":"Studying agentic organizations","parent":"16","section":"16","depth":1,"coding":false,"points":["Deployment case studies","Longitudinal observation of autonomy expansion","Comparative studies across organizations","Access and observability constraints on research"],"aka":[]},{"code":"16.2","title":"Measurement","parent":"16","section":"16","depth":1,"coding":false,"points":["Autonomy level measurement instruments","Oversight effectiveness metrics","Agent performance in organizational context","Incident rate and severity measurement"],"aka":[]},{"code":"16.3","title":"Data","parent":"16","section":"16","depth":1,"coding":false,"points":["Agent action and decision datasets","Incident and postmortem corpora","Data quality, coverage, and disclosure bias","Shared schemas for agentic organization data"],"aka":[]},{"code":"16.4","title":"Research design and ethics","parent":"16","section":"16","depth":1,"coding":false,"points":["Experimental design in live agentic systems","Research ethics with autonomous systems","Dual-use considerations in publication","Replication under model version churn"],"aka":[]}],"records":[{"id":"resource:arxiv:1707.06600","title":"A multi-agent reinforcement learning model of common-pool resource appropriation","abstract":"Humanity faces numerous problems of common-pool resource appropriation. This class of multi-agent social dilemma includes the problems of ensuring sustainable use of fresh water, common fisheries, grazing pastures, and irrigation systems. Abstract models of common-pool resource appropriation based on non-cooperative game theory predict that self-interested agents will generally fail to find socially positive equilibria---a phenomenon called the tragedy of the commons. However, in reality, human societies are sometimes able to discover and implement stable cooperative solutions. Decades of behavioral game theory research have sought to uncover aspects of human behavior that make this possible. Most of that work was based on laboratory experiments where participants only make a single choice: how much to appropriate. Recognizing the importance of spatial and temporal resource dynamics, a recent trend has been toward experiments in more complex real-time video game-like environments. However, standard methods of non-cooperative game theory can no longer be used to generate predictions…","authors":["Julien Pérolat","Joel Z. Leibo","Vinícius Zambaldi","Charles Beattie","Karl Tuyls","Thore Graepel"],"date":"2017-07-20","url":"https://arxiv.org/abs/1707.06600","type":"preprint","doi":"10.48550/arxiv.1707.06600","arxiv":"1707.06600","repo":"","current":[],"suggested":["15.6","5.1"],"suggested_more":["16.1","1.2","16.4","13.2","12.5","11.6","14.5","5.4","11.7","1.4","5.2","15.3"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:1810.10862","title":"Multiparty Dynamics and Failure Modes for Machine Learning and Artificial Intelligence","abstract":"An important challenge for safety in machine learning and artificial intelligence systems is a~set of related failures involving specification gaming, reward hacking, fragility to distributional shifts, and Goodhart's or Campbell's law. This paper presents additional failure modes for interactions within multi-agent systems that are closely related. These multi-agent failure modes are more complex, more problematic, and less well understood than the single-agent case, and are also already occurring, largely unnoticed. After motivating the discussion with examples from poker-playing artificial intelligence (AI), the paper explains why these failure modes are in some senses unavoidable. Following this, the paper categorizes failure modes, provides definitions, and cites examples for each of the modes: accidental steering, coordination failures, adversarial misalignment, input spoofing and filtering, and goal co-option or direct hacking. The paper then discusses how extant literature on multi-agent AI fails to address these failure modes, and identifies work which may be useful for the…","authors":["David Manheim"],"date":"2018-10-16","url":"https://arxiv.org/abs/1810.10862","type":"peer-reviewed-paper","doi":"10.48550/arxiv.1810.10862","arxiv":"1810.10862","repo":"","current":["11.6","11.13","5.2"],"suggested":["11.2","10.6"],"suggested_more":["8.3","11.14","11.5","10.1","11.1","15.3","15.6","11.6","1.1","11.12","11.9","5.2"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:1903.00742","title":"Autocurricula and the Emergence of Innovation from Social Interaction: A Manifesto for Multi-Agent Intelligence Research","abstract":"Evolution has produced a multi-scale mosaic of interacting adaptive units. Innovations arise when perturbations push parts of the system away from stable equilibria into new regimes where previously well-adapted solutions no longer work. Here we explore the hypothesis that multi-agent systems sometimes display intrinsic dynamics arising from competition and cooperation that provide a naturally emergent curriculum, which we term an autocurriculum. The solution of one social task often begets new social tasks, continually generating novel challenges, and thereby promoting innovation. Under certain conditions these challenges may become increasingly complex over time, demanding that agents accumulate ever more innovations.","authors":["Joel Z. Leibo","Edward Hughes","Marc Lanctot","Thore Graepel"],"date":"2019-03-02","url":"https://arxiv.org/abs/1903.00742","type":"preprint","doi":"10.48550/arxiv.1903.00742","arxiv":"1903.00742","repo":"","current":["5.1"],"suggested":["15.6","5.2","5.1"],"suggested_more":["4.4","5.3","11.7","11.3","5.4","8.2","16.4","11.13","11.2","11.6","14.1"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:1910.05789","title":"On the Utility of Learning about Humans for Human-AI Coordination","abstract":"While we would like agents that can coordinate with humans, current algorithms such as self-play and population-based training create agents that can coordinate with themselves. Agents that assume their partner to be optimal or similar to them can converge to coordination protocols that fail to understand and be understood by humans. To demonstrate this, we introduce a simple environment that requires challenging coordination, based on the popular game Overcooked, and learn a simple model that mimics human play. We evaluate the performance of agents trained via self-play and population-based training. These agents perform very well when paired with themselves, but when paired with our human model, they are significantly worse than agents designed to play with the human model. An experiment with a planning algorithm yields the same conclusion, though only when the human-aware planner is given the exact human model that it is playing with. A user study with real humans shows this pattern as well, though less strongly. Qualitatively, we find that the gains come from having the agent…","authors":["Micah Carroll","Rohin Shah","Mark K. Ho","Thomas L. Griffiths","Sanjit A. Seshia","Pieter Abbeel","Anca D. Dragan"],"date":"2019-10-13","url":"https://arxiv.org/abs/1910.05789","type":"preprint","doi":"10.48550/arxiv.1910.05789","arxiv":"1910.05789","repo":"","current":[],"suggested":["15.6","3.2"],"suggested_more":["16.2","1.2","3.1","14.5","13.2","16.4","5.1","4.1","14.2","6.5","4.2","9.2"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2012.08630","title":"Open Problems in Cooperative AI","abstract":"Problems of cooperation--in which agents seek ways to jointly improve their welfare--are ubiquitous and important. They can be found at scales ranging from our daily routines--such as driving on highways, scheduling meetings, and working collaboratively--to our global challenges--such as peace, commerce, and pandemic preparedness. Arguably, the success of the human species is rooted in our ability to cooperate. Since machines powered by artificial intelligence are playing an ever greater role in our lives, it will be important to equip them with the capabilities necessary to cooperate and to foster cooperation. We see an opportunity for the field of artificial intelligence to explicitly focus effort on this class of problems, which we term Cooperative AI. The objective of this research would be to study the many aspects of the problems of cooperation and to innovate in AI to contribute to solving these problems. Central goals include building machine agents with the capabilities needed for cooperation, building tools to foster cooperation in populations of (machine and/or human)…","authors":["Allan Dafoe","Edward Hughes","Yoram Bachrach","Tantum Collins","Kevin R. McKee","Joel Z. Leibo","Kate Larson","Thore Graepel"],"date":"2020-12-15","url":"https://arxiv.org/abs/2012.08630","type":"preprint","doi":"10.48550/arxiv.2012.08630","arxiv":"2012.08630","repo":"","current":[],"suggested":["15.6","11.2"],"suggested_more":["14.1","11.11","16.4","8.3","15.1","1.2","1.1","11.1","10.1","4.4","16.1","5.3"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2107.06857","title":"Scalable Evaluation of Multi-Agent Reinforcement Learning with Melting Pot","abstract":"Existing evaluation suites for multi-agent reinforcement learning (MARL) do not assess generalization to novel situations as their primary objective (unlike supervised-learning benchmarks). Our contribution, Melting Pot, is a MARL evaluation suite that fills this gap, and uses reinforcement learning to reduce the human labor required to create novel test scenarios. This works because one agent's behavior constitutes (part of) another agent's environment. To demonstrate scalability, we have created over 80 unique test scenarios covering a broad range of research topics such as social dilemmas, reciprocity, resource sharing, and task partitioning. We apply these test scenarios to standard MARL training algorithms, and demonstrate how Melting Pot reveals weaknesses not apparent from training performance alone.","authors":["Joel Z. Leibo","Edgar Duéñez-Guzmán","Alexander Sasha Vezhnevets","John P. Agapiou","Peter Sunehag","Raphaël Koster","Jayd Matyas","Charles Beattie","Igor Mordatch","Thore Graepel"],"date":"2021-07-14","url":"https://arxiv.org/abs/2107.06857","type":"preprint","doi":"10.48550/arxiv.2107.06857","arxiv":"2107.06857","repo":"","current":["14.1","14.5"],"suggested":["15.6","14.5"],"suggested_more":["14.1","4.2","5.2","11.4","8.2","14.2","4.4","8.3","6.2","11.3","11.7","11.11"],"claims":[{"id":"claim:arxiv:2107.06857:1","text":"Existing MARL evaluation suites do not treat generalization to novel situations as their primary objective.","standalone":"As of 2021, existing evaluation suites for multi-agent reinforcement learning did not treat generalization to novel situations as their primary objective, unlike supervised-learning benchmarks.","quote":"Existing evaluation suites for multi-agent reinforcement learning (MARL) do not assess generalization to novel situations as their primary objective","where":"abstract","type":"background","primary":false,"topics":[],"verdict":"","by":"","concepts":["benchmarks-relevant-to-organizational-roles"],"own":false,"from_whom":"prior MARL evaluation literature"},{"id":"claim:arxiv:2107.06857:2","text":"Automated generation of multi-agent test scenarios is possible because one agent's behavior forms part of another agent's environment.","standalone":"Melting Pot's authors argue that reinforcement learning can generate novel multi-agent test scenarios because one agent's behavior is itself part of another agent's environment.","quote":"This works because one agent’s behavior constitutes (part of) another agent’s environment","where":"abstract","type":"method","primary":false,"topics":[],"verdict":"","by":"","concepts":["agent-generated-evaluation-and-scoring"],"own":true,"from_whom":""},{"id":"claim:arxiv:2107.06857:3","text":"Melting Pot reveals weaknesses in MARL algorithms that training performance alone does not show.","standalone":"The Melting Pot authors report that their suite reveals weaknesses in standard MARL training algorithms which are not apparent from training performance alone.","quote":"demonstrate how Melting Pot reveals weaknesses not apparent from training performance alone","where":"abstract","type":"finding","primary":true,"topics":[],"verdict":"","by":"","concepts":["reliability-and-consistency-measurement"],"own":true,"from_whom":""},{"id":"claim:arxiv:2107.06857:4","text":"Solving novel social situations appears to require agents that model trust, reciprocity and deception.","standalone":"Melting Pot's authors conclude that solving their test scenarios seems to require agents that understand trust, generosity, forgiveness, reciprocity, stubbornness and deception.","quote":"Solutions to the problems posed here seem to require agents that understand trust, generosity, and forgiveness, as well as reciprocity, stubbornness, and deception","where":"conclusion","type":"position","primary":true,"topics":[],"verdict":"","by":"","concepts":["prosocial-capability"],"own":true,"from_whom":""},{"id":"claim:arxiv:2107.06857:5","text":"An evaluation suite improves over time by folding improved agents into its background populations.","standalone":"Melting Pot's authors expect the suite to get harder over time, because improvements in agent performance are folded back into the background populations its test scenarios are built from.","quote":"Melting Pot will likewise improve over time by reincorporating the latest agent technology into new background populations and test scenarios","where":"conclusion","type":"position","primary":true,"topics":[],"verdict":"","by":"","concepts":["dynamic-evaluation"],"own":true,"from_whom":""}],"derived_topics":{"14.1":4,"14.3":1,"5.2":1,"8.2":1}},{"id":"resource:arxiv:2112.11471","title":"Towards a Science of Human-AI Decision Making: A Survey of Empirical Studies","abstract":"As AI systems demonstrate increasingly strong predictive performance, their adoption has grown in numerous domains. However, in high-stakes domains such as criminal justice and healthcare, full automation is often not desirable due to safety, ethical, and legal concerns, yet fully manual approaches can be inaccurate and time consuming. As a result, there is growing interest in the research community to augment human decision making with AI assistance. Besides developing AI technologies for this purpose, the emerging field of human-AI decision making must embrace empirical approaches to form a foundational understanding of how humans interact and work with AI to make decisions. To invite and help structure research efforts towards a science of understanding and improving human-AI decision making, we survey recent literature of empirical human-subject studies on this topic. We summarize the study design choices made in over 100 papers in three important aspects: (1) decision tasks, (2) AI models and AI assistance elements, and (3) evaluation metrics. For each aspect, we summarize…","authors":["Vivian Lai","Chacha Chen","Q. Vera Liao","Alison Smith-Renner","Chenhao Tan"],"date":"2021-12-21","url":"https://arxiv.org/abs/2112.11471","type":"preprint","doi":"10.48550/arxiv.2112.11471","arxiv":"2112.11471","repo":"","current":[],"suggested":["16.4","16.1","12.4"],"suggested_more":["4.4","16.2","8.2","13.2","7.2","14.1","11.1","1.2","15.2","11.4","1.3"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2210.03629","title":"Distributing Accountability, Not Capability: Phase Separation and the LLM Workflow Quadrant in Autonomous AI Agent Architectures","abstract":"Autonomous AI agents in business deployments exhibit a recurring failure mode: when an incident occurs, responsibility cannot be redirected to a separable contributor. The dominant discourse treats this as a single phenomenon, addressed by sandboxing, human-in-the-loop overload, or what Elish (2019) named the moral crumple zone. This paper argues the phenomenon is two architecturally distinct failure modes that have been conflated, and that the conflation is sustained by a missing positive name and a missing time-axis. The paper introduces two contributions. First, a four-quadrant decomposition of business AI work — along the axes of deterministic vs semantic-judgment and pre-defined vs exploratory — yields a positive name for the cell most current LLM applications occupy: the LLM Workflow Quadrant. The quadrant is defined by a single load-bearing property: the path is decided in advance by humans or by code, and the LLM is called as a single bounded step within that path; the property divides naturally into a conversational sub-form (specialized chat agents) and a batch sub-form…","authors":["Shunyu Yao","Jeffrey Zhao","Dian Yu","Nan Du","Izhak Shafran","Karthik Narasimhan","Yuan Cao"],"date":"2022-10-06","url":"https://arxiv.org/abs/2210.03629","type":"preprint","doi":"10.48550/arxiv.2210.03629","arxiv":"2210.03629","repo":"","current":[],"suggested":["11.4","1.1"],"suggested_more":["12.4","12.2","4.2","3.1","11.1","2.1","11.6","4.1","11.15","11.14","11.13","16.4"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2303.17760","title":"CAMEL: Communicative Agents for \"Mind\" Exploration of Large Language Model Society","abstract":"The rapid advancement of chat-based language models has led to remarkable progress in complex task-solving. However, their success heavily relies on human input to guide the conversation, which can be challenging and time-consuming. This paper explores the potential of building scalable techniques to facilitate autonomous cooperation among communicative agents, and provides insight into their \"cognitive\" processes. To address the challenges of achieving autonomous cooperation, we propose a novel communicative agent framework named role-playing. Our approach involves using inception prompting to guide chat agents toward task completion while maintaining consistency with human intentions. We showcase how role-playing can be used to generate conversational data for studying the behaviors and capabilities of a society of agents, providing a valuable resource for investigating conversational language models. In particular, we conduct comprehensive studies on instruction-following cooperation in multi-agent settings. Our contributions include introducing a novel communicative agent…","authors":["Guohao Li","Hasan Abed Al Kader Hammoud","Hani Itani","Dmitrii Khizbullin","Bernard Ghanem"],"date":"2023-03-31","url":"https://arxiv.org/abs/2303.17760","type":"preprint","doi":"10.48550/arxiv.2303.17760","arxiv":"2303.17760","repo":"","current":[],"suggested":["16.1","14.1","15.6","3.2","16.4","7.4"],"suggested_more":["5.4","12.4","11.7","4.5","5.2","11.14","16.3","13.3"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2304.03442","title":"Generative Agents: Interactive Simulacra of Human Behavior","abstract":"Believable proxies of human behavior can empower interactive applications ranging from immersive environments to rehearsal spaces for interpersonal communication to prototyping tools. In this paper, we introduce generative agents--computational software agents that simulate believable human behavior. Generative agents wake up, cook breakfast, and head to work; artists paint, while authors write; they form opinions, notice each other, and initiate conversations; they remember and reflect on days past as they plan the next day. To enable generative agents, we describe an architecture that extends a large language model to store a complete record of the agent's experiences using natural language, synthesize those memories over time into higher-level reflections, and retrieve them dynamically to plan behavior. We instantiate generative agents to populate an interactive sandbox environment inspired by The Sims, where end users can interact with a small town of twenty five agents using natural language. In an evaluation, these generative agents produce believable individual and emergent…","authors":["Joon Sung Park","Joseph C. O'Brien","Carrie J. Cai","Meredith Ringel Morris","Percy Liang","Michael S. Bernstein"],"date":"2023-04-07","url":"https://arxiv.org/abs/2304.03442","type":"preprint","doi":"10.48550/arxiv.2304.03442","arxiv":"2304.03442","repo":"","current":[],"suggested":["14.5","11.7","1.1"],"suggested_more":["8.2","11.13","11.4","11.3","9.2","3.4","5.2","2.1","6.5","15.6","2.6"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2308.00352","title":"MetaGPT: Meta Programming for A Multi-Agent Collaborative Framework","abstract":"Remarkable progress has been made on automated problem solving through societies of agents based on large language models (LLMs). Existing LLM-based multi-agent systems can already solve simple dialogue tasks. Solutions to more complex tasks, however, are complicated through logic inconsistencies due to cascading hallucinations caused by naively chaining LLMs. Here we introduce MetaGPT, an innovative meta-programming framework incorporating efficient human workflows into LLM-based multi-agent collaborations. MetaGPT encodes Standardized Operating Procedures (SOPs) into prompt sequences for more streamlined workflows, thus allowing agents with human-like domain expertise to verify intermediate results and reduce errors. MetaGPT utilizes an assembly line paradigm to assign diverse roles to various agents, efficiently breaking down complex tasks into subtasks involving many agents working together. On collaborative software engineering benchmarks, MetaGPT generates more coherent solutions than previous chat-based multi-agent systems. Our project can be found at…","authors":["Sirui Hong","Mingchen Zhuge","Jiaqi Chen","Xiawu Zheng","Yuheng Cheng","Ceyao Zhang","Jinlin Wang","Zili Wang","Steven Ka Shing Yau","Zijuan Lin","Liyang Zhou","Chenyu Ran","Lingfeng Xiao","Chenglin Wu","Jürgen Schmidhuber"],"date":"2023-08-01","url":"https://arxiv.org/abs/2308.00352","type":"preprint","doi":"10.48550/arxiv.2308.00352","arxiv":"2308.00352","repo":"","current":[],"suggested":["11.6","14.1","1.1","3.1"],"suggested_more":["11.11","15.6","3.4","8.2","5.4","13.3","11.13","10.5","4.4","2.1"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2309.07864","title":"The Rise and Potential of Large Language Model Based Agents: A Survey","abstract":"For a long time, humanity has pursued artificial intelligence (AI) equivalent to or surpassing the human level, with AI agents considered a promising vehicle for this pursuit. AI agents are artificial entities that sense their environment, make decisions, and take actions. Many efforts have been made to develop intelligent agents, but they mainly focus on advancement in algorithms or training strategies to enhance specific capabilities or performance on particular tasks. Actually, what the community lacks is a general and powerful model to serve as a starting point for designing AI agents that can adapt to diverse scenarios. Due to the versatile capabilities they demonstrate, large language models (LLMs) are regarded as potential sparks for Artificial General Intelligence (AGI), offering hope for building general AI agents. Many researchers have leveraged LLMs as the foundation to build AI agents and have achieved significant progress. In this paper, we perform a comprehensive survey on LLM-based agents. We start by tracing the concept of agents from its philosophical origins to its…","authors":["Zhiheng Xi","Wenxiang Chen","Xin Guo","Wei He","Yiwen Ding","Boyang Hong","Ming Zhang","Junzhe Wang","Senjie Jin","Enyu Zhou","Rui Zheng","Xiaoran Fan","Xiao Wang","Limao Xiong","Yuhao Zhou","Weiran Wang","Changhao Jiang","Yicheng Zou","Xiangyang Liu","Zhangyue Yin","Shihan Dou","Rongxiang Weng","Wensen Cheng","Qi Zhang","Wenjuan Qin","Yongyan Zheng","Xipeng Qiu","Xuanjing Huang","Tao Gui"],"date":"2023-09-14","url":"https://arxiv.org/abs/2309.07864","type":"preprint","doi":"10.48550/arxiv.2309.07864","arxiv":"2309.07864","repo":"","current":[],"suggested":["15.6","14.5","1.2"],"suggested_more":["14.1","6.1","5.2","16.2","6.2","5.4","15.2","10.5","12.4","1.1","1.4"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2312.03664","title":"Generative agent-based modeling with actions grounded in physical, social, or digital space using Concordia","abstract":"Agent-based modeling has been around for decades, and applied widely across the social and natural sciences. The scope of this research method is now poised to grow dramatically as it absorbs the new affordances provided by Large Language Models (LLM)s. Generative Agent-Based Models (GABM) are not just classic Agent-Based Models (ABM)s where the agents talk to one another. Rather, GABMs are constructed using an LLM to apply common sense to situations, act \"reasonably\", recall common semantic knowledge, produce API calls to control digital technologies like apps, and communicate both within the simulation and to researchers viewing it from the outside. Here we present Concordia, a library to facilitate constructing and working with GABMs. Concordia makes it easy to construct language-mediated simulations of physically- or digitally-grounded environments. Concordia agents produce their behavior using a flexible component system which mediates between two fundamental operations: LLM calls and associative memory retrieval. A special agent called the Game Master (GM), which was inspired…","authors":["Alexander Sasha Vezhnevets","John P. Agapiou","Avia Aharon","Ron Ziv","Jayd Matyas","Edgar A. Duéñez-Guzmán","William A. Cunningham","Simon Osindero","Danny Karmon","Joel Z. Leibo"],"date":"2023-12-06","url":"https://arxiv.org/abs/2312.03664","type":"preprint","doi":"10.48550/arxiv.2312.03664","arxiv":"2312.03664","repo":"","current":["14.5","16.1"],"suggested":["14.5","4.2","7.1","15.6","11.10","7.2"],"suggested_more":["2.2","16.4","10.4","5.2","16.3","13.3","10.1","6.2"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2312.05162","title":"A Review of Cooperation in Multi-agent Learning","abstract":"Cooperation in multi-agent learning (MAL) is a topic at the intersection of numerous disciplines, including game theory, economics, social sciences, and evolutionary biology. Research in this area aims to understand both how agents can coordinate effectively when goals are aligned and how they may cooperate in settings where gains from working together are possible but possibilities for conflict abound. In this paper we provide an overview of the fundamental concepts, problem settings and algorithms of multi-agent learning. This encompasses reinforcement learning, multi-agent sequential decision-making, challenges associated with multi-agent cooperation, and a comprehensive review of recent progress, along with an evaluation of relevant metrics. Finally we discuss open challenges in the field with the aim of inspiring new avenues for research.","authors":["Yali Du","Joel Z. Leibo","Usman Islam","Richard Willis","Peter Sunehag"],"date":"2023-12-08","url":"https://arxiv.org/abs/2312.05162","type":"preprint","doi":"10.48550/arxiv.2312.05162","arxiv":"2312.05162","repo":"","current":[],"suggested":["15.6","12.4"],"suggested_more":["11.2","14.1","5.2","15.3","8.2","1.2","5.3","4.4","8.3","11.5","16.4","15.5"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2401.11880","title":"PsySafe: A Comprehensive Framework for Psychological-based Attack, Defense, and Evaluation of Multi-agent System Safety","abstract":"Multi-agent systems, when enhanced with Large Language Models (LLMs), exhibit profound capabilities in collective intelligence. However, the potential misuse of this intelligence for malicious purposes presents significant risks. To date, comprehensive research on the safety issues associated with multi-agent systems remains limited. In this paper, we explore these concerns through the innovative lens of agent psychology, revealing that the dark psychological states of agents constitute a significant threat to safety. To tackle these concerns, we propose a comprehensive framework (PsySafe) grounded in agent psychology, focusing on three key areas: firstly, identifying how dark personality traits in agents can lead to risky behaviors; secondly, evaluating the safety of multi-agent systems from the psychological and behavioral perspectives, and thirdly, devising effective strategies to mitigate these risks. Our experiments reveal several intriguing phenomena, such as the collective dangerous behaviors among agents, agents' self-reflection when engaging in dangerous behavior, and the…","authors":["Zaibin Zhang","Yongting Zhang","Lijun Li","Hongzhi Gao","Lijun Wang","Huchuan Lu","Feng Zhao","Yu Qiao","Jing Shao"],"date":"2024-01-22","url":"https://arxiv.org/abs/2401.11880","type":"preprint","doi":"10.48550/arxiv.2401.11880","arxiv":"2401.11880","repo":"","current":["10.1","14.2"],"suggested":["14.4","10.5","10.6","14.2"],"suggested_more":["6.1","14.3","13.2","12.4","5.1","11.10","1.2","16.2","16.1","14.5"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2402.01680","title":"Large Language Model based Multi-Agents: A Survey of Progress and Challenges","abstract":"Large Language Models (LLMs) have achieved remarkable success across a wide array of tasks. Due to the impressive planning and reasoning abilities of LLMs, they have been used as autonomous agents to do many tasks automatically. Recently, based on the development of using one LLM as a single planning or decision-making agent, LLM-based multi-agent systems have achieved considerable progress in complex problem-solving and world simulation. To provide the community with an overview of this dynamic field, we present this survey to offer an in-depth discussion on the essential aspects of multi-agent systems based on LLMs, as well as the challenges. Our goal is for readers to gain substantial insights on the following questions: What domains and environments do LLM-based multi-agents simulate? How are these agents profiled and how do they communicate? What mechanisms contribute to the growth of agents' capacities? For those interested in delving into this field of study, we also summarize the commonly used datasets or benchmarks for them to have convenient access. To keep researchers…","authors":["Taicheng Guo","Xiuying Chen","Yaqi Wang","Ruidi Chang","Shichao Pei","Nitesh V. Chawla","Olaf Wiest","Xiangliang Zhang"],"date":"2024-01-21","url":"https://arxiv.org/abs/2402.01680","type":"preprint","doi":"10.48550/arxiv.2402.01680","arxiv":"2402.01680","repo":"","current":[],"suggested":["14.5","12.4","16.1"],"suggested_more":["14.1","16.4","5.4","16.3","15.6","6.5","4.4","5.2","11.6","1.2","10.6"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2402.04559","title":"Can Large Language Model Agents Simulate Human Trust Behavior?","abstract":"Large Language Model (LLM) agents have been increasingly adopted as simulation tools to model humans in social science and role-playing applications. However, one fundamental question remains: can LLM agents really simulate human behavior? In this paper, we focus on one critical and elemental behavior in human interactions, trust, and investigate whether LLM agents can simulate human trust behavior. We first find that LLM agents generally exhibit trust behavior, referred to as agent trust, under the framework of Trust Games, which are widely recognized in behavioral economics. Then, we discover that GPT-4 agents manifest high behavioral alignment with humans in terms of trust behavior, indicating the feasibility of simulating human trust behavior with LLM agents. In addition, we probe the biases of agent trust and differences in agent trust towards other LLM agents and humans. We also explore the intrinsic properties of agent trust under conditions including external manipulations and advanced reasoning strategies. Our study provides new insights into the behaviors of LLM agents and…","authors":["Chengxing Xie","Canyu Chen","Feiran Jia","Ziyu Ye","Shiyang Lai","Kai Shu","Jindong Gu","Adel Bibi","Ziniu Hu","David Jurgens","James Evans","Philip Torr","Bernard Ghanem","Guohao Li"],"date":"2024-02-07","url":"https://arxiv.org/abs/2402.04559","type":"preprint","doi":"10.48550/arxiv.2402.04559","arxiv":"2402.04559","repo":"","current":[],"suggested":["5.3","3.3","11.1"],"suggested_more":["4.4","11.13","13.1","5.2","13.3","9.4","8.2","13.4","3.4","4.1","14.5"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2403.12482","title":"Embodied LLM Agents Learn to Cooperate in Organized Teams","abstract":"Large Language Models (LLMs) have emerged as integral tools for reasoning, planning, and decision-making, drawing upon their extensive world knowledge and proficiency in language-related tasks. LLMs thus hold tremendous potential for natural language interaction within multi-agent systems to foster cooperation. However, LLM agents tend to over-report and comply with any instruction, which may result in information redundancy and confusion in multi-agent cooperation. Inspired by human organizations, this paper introduces a framework that imposes prompt-based organization structures on LLM agents to mitigate these problems. Through a series of experiments with embodied LLM agents and human-agent collaboration, our results highlight the impact of designated leadership on team efficiency, shedding light on the leadership qualities displayed by LLM agents and their spontaneous cooperative behaviors. Further, we harness the potential of LLMs to propose enhanced organizational prompts, via a Criticize-Reflect process, resulting in novel organization structures that reduce communication…","authors":["Xudong Guo","Kaixuan Huang","Jiale Liu","Wenhui Fan","Natalia Vélez","Qingyun Wu","Huazheng Wang","Thomas L. Griffiths","Mengdi Wang"],"date":"2024-03-19","url":"https://arxiv.org/abs/2403.12482","type":"preprint","doi":"10.48550/arxiv.2403.12482","arxiv":"2403.12482","repo":"","current":["3.1","5.2"],"suggested":["3.1","3.3","15.6","7.4","5.2","12.4"],"suggested_more":["11.13","10.1","11.7","1.2","5.1","4.2","13.3","4.4"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2406.04231","title":"Quantifying Misalignment Between Agents: Towards a Sociotechnical Understanding of Alignment","abstract":"Existing work on the alignment problem has focused mainly on (1) qualitative descriptions of the alignment problem; (2) attempting to align AI actions with human interests by focusing on value specification and learning; and/or (3) focusing on a single agent or on humanity as a monolith. Recent sociotechnical approaches highlight the need to understand complex misalignment among multiple human and AI agents. We address this gap by adapting a computational social science model of human contention to the alignment problem. Our model quantifies misalignment in large, diverse agent groups with potentially conflicting goals across various problem areas. Misalignment scores in our framework depend on the observed agent population, the domain in question, and conflict between agents' weighted preferences. Through simulations, we demonstrate how our model captures intuitive aspects of misalignment across different scenarios. We then apply our model to two case studies, including an autonomous vehicle setting, showcasing its practical utility. Our approach offers enhanced explanatory power…","authors":["Aidan Kierans","Avijit Ghosh","Hananel Hazan","Shiri Dori-Hacohen"],"date":"2024-06-06","url":"https://arxiv.org/abs/2406.04231","type":"preprint","doi":"10.48550/arxiv.2406.04231","arxiv":"2406.04231","repo":"","current":[],"suggested":["16.1","15.6","1.2","11.2","14.5"],"suggested_more":["15.2","3.2","12.5","2.1","11.6","8.2","10.1","8.3","11.11"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2411.09222","title":"Democratic AI is Possible. The Democracy Levels Framework Shows How It Might Work","abstract":"This position paper argues that effectively \"democratizing AI\" requires democratic governance and alignment of AI, and that this is particularly valuable for decisions with systemic societal impacts. Initial steps -- such as Meta's Community Forums and Anthropic's Collective Constitutional AI -- have illustrated a promising direction, where democratic processes could be used to meaningfully improve public involvement and trust in critical decisions. To more concretely explore what increasingly democratic AI might look like, we provide a \"Democracy Levels\" framework and associated tools that: (i) define milestones toward meaningfully democratic AI, which is also crucial for substantively pluralistic, human-centered, participatory, and public-interest AI, (ii) can help guide organizations seeking to increase the legitimacy of their decisions on difficult AI governance and alignment questions, and (iii) support the evaluation of such efforts.","authors":["Aviv Ovadya","Kyle Redman","Luke Thorburn","Quan Ze Chen","Oliver Smith","Flynn Devine","Andrew Konya","Smitha Milli","Manon Revel","K. J. Kevin Feng","Amy X. Zhang","Bilva Chandra","Michiel A. Bakker","Atoosa Kasirzadeh"],"date":"2024-11-14","url":"https://arxiv.org/abs/2411.09222","type":"preprint","doi":"10.48550/arxiv.2411.09222","arxiv":"2411.09222","repo":"","current":[],"suggested":["15.1","1.3"],"suggested_more":["1.1","15.2","1.2","11.13","2.7","14.4","14.1","12.4","8.2","3.3","12.5","13.2"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2412.14161","title":"TheAgentCompany: Benchmarking LLM Agents on Consequential Real World Tasks","abstract":"We interact with computers on an everyday basis, be it in everyday life or work, and many aspects of work can be done entirely with access to a computer and the Internet. At the same time, thanks to improvements in large language models (LLMs), there has also been a rapid development in AI agents that interact with and affect change in their surrounding environments. But how performant are AI agents at accelerating or even autonomously performing work-related tasks? The answer to this question has important implications both for industry looking to adopt AI into their workflows and for economic policy to understand the effects that adoption of AI may have on the labor market. To measure the progress of these LLM agents'performance on performing real-world professional tasks, in this paper we introduce TheAgentCompany, an extensible benchmark for evaluating AI agents that interact with the world in similar ways to those of a digital worker: by browsing the Web, writing code, running programs, and communicating with other coworkers. We build a self-contained environment with internal…","authors":["Frank F. Xu","Yufan Song","Boxuan Li","Yuxuan Tang","Kritanjali Jain","Mengxue Bao","Zora Z. Wang","Xuhui Zhou","Zhitong Guo","Murong Cao","Mingyang Yang","Hao Yang Lu","Amaad Martin","Zhe Su","Leander Maben","Raj Mehta","Wayne Chi","Lawrence Jang","Yiqing Xie","Shuyan Zhou","Graham Neubig"],"date":"2024-12-18","url":"https://arxiv.org/abs/2412.14161","type":"preprint","doi":"10.48550/arxiv.2412.14161","arxiv":"2412.14161","repo":"","current":["14.1","16.2"],"suggested":["14.1","10.6","10.4","14.5","11.4"],"suggested_more":["5.4","6.5","13.3","14.2","6.2","9.2","15.4","16.2","15.6"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2501.06322","title":"Multi-Agent Collaboration Mechanisms: A Survey of LLMs","abstract":"With recent advances in Large Language Models (LLMs), Agentic AI has become phenomenal in real-world applications, moving toward multiple LLM-based agents to perceive, learn, reason, and act collaboratively. These LLM-based Multi-Agent Systems (MASs) enable groups of intelligent agents to coordinate and solve complex tasks collectively at scale, transitioning from isolated models to collaboration-centric approaches. This work provides an extensive survey of the collaborative aspect of MASs and introduces an extensible framework to guide future research. Our framework characterizes collaboration mechanisms based on key dimensions: actors (agents involved), types (e.g., cooperation, competition, or coopetition), structures (e.g., peer-to-peer, centralized, or distributed), strategies (e.g., role-based or model-based), and coordination protocols. Through a review of existing methodologies, our findings serve as a foundation for demystifying and advancing LLM-based MASs toward more intelligent and collaborative solutions for complex, real-world use cases. In addition, various…","authors":["Khanh-Tung Tran","Dung Dao","Minh-Duong Nguyen","Quoc-Viet Pham","Barry O'Sullivan","Hoang D. Nguyen"],"date":"2025-01-10","url":"https://arxiv.org/abs/2501.06322","type":"preprint","doi":"10.48550/arxiv.2501.06322","arxiv":"2501.06322","repo":"","current":[],"suggested":["15.6","1.2"],"suggested_more":["14.1","3.2","14.5","11.13","4.5","3.1","16.4","16.1","11.11","5.2","10.5","12.1"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2501.16138","title":"Quantifying the Self-Interest Level of Markov Social Dilemmas","abstract":"This paper introduces a novel method for estimating the self-interest level of Markov social dilemmas. We extend the concept of self-interest level from normal-form games to Markov games, providing a quantitative measure of the minimum reward exchange required to align individual and collective interests. We demonstrate our method on three environments from the Melting Pot suite, representing either common-pool resources or public goods. Our results illustrate how reward exchange can enable agents to transition from selfish to collective equilibria in a Markov social dilemma. This work contributes to multi-agent reinforcement learning by providing a practical tool for analysing complex, multistep social dilemmas. Our findings offer insights into how reward structures can promote or hinder cooperation, with potential applications in areas such as mechanism design.","authors":["Richard Willis","Yali Du","Joel Z. Leibo","Michael Luck"],"date":"2025-01-27","url":"https://arxiv.org/abs/2501.16138","type":"preprint","doi":"10.48550/arxiv.2501.16138","arxiv":"2501.16138","repo":"","current":["5.2"],"suggested":["15.6","1.2"],"suggested_more":["13.2","16.2","16.4","5.2","4.2","15.3","1.1","15.1","5.1","14.4","12.1","14.1"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2501.16173","title":"Will Systems of LLM Agents Cooperate: An Investigation into a Social Dilemma","abstract":"As autonomous agents become more prevalent, understanding their collective behaviour in strategic interactions is crucial. This study investigates the emergent cooperative tendencies of systems of Large Language Model (LLM) agents in a social dilemma. Unlike previous research where LLMs output individual actions, we prompt state-of-the-art LLMs to generate complete strategies for iterated Prisoner's Dilemma. Using evolutionary game theory, we simulate populations of agents with different strategic dispositions (aggressive, cooperative, or neutral) and observe their evolutionary dynamics. Our findings reveal that different LLMs exhibit distinct biases affecting the relative success of aggressive versus cooperative strategies. This research provides insights into the potential long-term behaviour of systems of deployed LLM-based autonomous agents and highlights the importance of carefully considering the strategic environments in which they operate.","authors":["Richard Willis","Yali Du","Joel Z. Leibo","Michael Luck"],"date":"2025-01-27","url":"https://arxiv.org/abs/2501.16173","type":"preprint","doi":"10.48550/arxiv.2501.16173","arxiv":"2501.16173","repo":"","current":["5.2","14.1"],"suggested":["15.6","11.6"],"suggested_more":["16.4","3.4","16.1","14.5","11.5","10.4","1.2","5.1","16.3","11.1","15.1","11.7"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2501.18668","title":"Simulation Streams: A Programming Paradigm for Controlling Large Language Models and Building Complex Systems with Generative AI","abstract":"We introduce Simulation Streams, a programming paradigm designed to efficiently control and leverage Large Language Models (LLMs) for complex, dynamic simulations and agentic workflows. Our primary goal is to create a minimally interfering framework that harnesses the agentic abilities of LLMs while addressing their limitations in maintaining consistency, selectively ignoring/including information, and enforcing strict world rules. Simulation Streams achieves this through a state-based approach where variables are modified in sequential steps by \"operators,\" producing output on a recurring format and adhering to consistent rules for state variables. This approach focus the LLMs on defined tasks, while aiming to have the context stream remain \"in-distribution\". The approach incorporates an Entity-Component-System (ECS) architecture to write programs in a more intuitive manner, facilitating reuse of workflows across different components and entities. This ECS approach enhances the modularity of the output stream, allowing for complex, multi-entity simulations while maintaining format…","authors":["Peter Sunehag","Joel Z. Leibo"],"date":"2025-01-30","url":"https://arxiv.org/abs/2501.18668","type":"preprint","doi":"10.48550/arxiv.2501.18668","arxiv":"2501.18668","repo":"","current":["14.5"],"suggested":["15.6","14.5"],"suggested_more":["14.1","5.4","3.2","11.6","11.2","6.3","1.2","10.5","13.2","11.9","3.1","8.1"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2502.14143","title":"Multi-Agent Risks from Advanced AI","abstract":"The rapid development of advanced AI agents and the imminent deployment of many instances of these agents will give rise to multi-agent systems of unprecedented complexity. These systems pose novel and under-explored risks. In this report, we provide a structured taxonomy of these risks by identifying three key failure modes (miscoordination, conflict, and collusion) based on agents' incentives, as well as seven key risk factors (information asymmetries, network effects, selection pressures, destabilising dynamics, commitment problems, emergent agency, and multi-agent security) that can underpin them. We highlight several important instances of each risk, as well as promising directions to help mitigate them. By anchoring our analysis in a range of real-world examples and experimental evidence, we illustrate the distinct challenges posed by multi-agent systems and their implications for the safety, governance, and ethics of advanced AI.","authors":["Lewis Hammond","Alan Chan","Jesse Clifton","Jason Hoelscher-Obermaier","Akbir Khan","Euan McLean","Chandler Smith","Wolfram Barfuss","Jakob Foerster","Tomáš Gavenčiak","The Anh Han","Edward Hughes","Vojtěch Kovařík","Jan Kulveit","Joel Z. Leibo","Caspar Oesterheld","Christian Schroeder de Witt","Nisarg Shah","Michael Wellman","Paolo Bova","Theodor Cimpeanu","Carson Ezell","Quentin Feuillade-Montixi","Matija Franklin","Esben Kran","Igor Krawczuk","Max Lamparth","Niklas Lauffer","Alexander Meinke","Sumeet Motwani","Anka Reuel","Vincent Conitzer","Michael Dennis","Iason Gabriel","Adam Gleave","Gillian Hadfield","Nika Haghtalab","Atoosa Kasirzadeh","Sébastien Krier","Kate Larson","Joel Lehman","David C. Parkes","Georgios Piliouras","Iyad Rahwan"],"date":"2025-02-19","url":"https://arxiv.org/abs/2502.14143","type":"preprint","doi":"10.48550/arxiv.2502.14143","arxiv":"2502.14143","repo":"","current":["11.1","11.6","11.13"],"suggested":["11.1","11.6","5.2","4.2"],"suggested_more":["1.2","16.4","12.5","11.13","11.10","14.2","15.6","10.6","11.11","4.4"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2502.15840","title":"Vending-Bench: A Benchmark for Long-Term Coherence of Autonomous Agents","abstract":"While Large Language Models (LLMs) can exhibit impressive proficiency in isolated, short-term tasks, they often fail to maintain coherent performance over longer time horizons. In this paper, we present Vending-Bench, a simulated environment designed to specifically test an LLM-based agent's ability to manage a straightforward, long-running business scenario: operating a vending machine. Agents must balance inventories, place orders, set prices, and handle daily fees - tasks that are each simple but collectively, over long horizons (&gt;20M tokens per run) stress an LLM's capacity for sustained, coherent decision-making. Our experiments reveal high variance in performance across multiple LLMs: Claude 3.5 Sonnet and o3-mini manage the machine well in most runs and turn a profit, but all models have runs that derail, either through misinterpreting delivery schedules, forgetting orders, or descending into tangential \"meltdown\" loops from which they rarely recover. We find no clear correlation between failures and the point at which the model's context window becomes full, suggesting…","authors":["Axel Backlund","Lukas Petersson"],"date":"2025-02-20","url":"https://arxiv.org/abs/2502.15840","type":"preprint","doi":"10.48550/arxiv.2502.15840","arxiv":"2502.15840","repo":"","current":["8.1","14.1","14.5"],"suggested":["14.1","11.5","14.5","11.4","11.6","7.4"],"suggested_more":["7.1","8.1","5.4","12.4","10.4","14.2","11.3","11.13"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2503.14576","title":"SocialJax: An Ev
