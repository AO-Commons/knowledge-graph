,"type":"finding","topics":["14.1","14.3"],"verdict":"","by":""},{"id":"claim:arxiv:2606.03237:7","text":"Institutions should be treated as design primitives rather than as context.","standalone":"The paper calls for a non-solipsistic research paradigm whose concrete commitments include dynamic evaluation testbeds with adaptive counterparties, institutions as design primitives that restructure incentives, and human agency preserved as a structural feature.","quote":"This entails building dynamic evaluation testbeds involving adaptive counterparties, treating institutions as design primitives, and preserving human agency as a structural feature of the systems we build.","where":"abstract","type":"position","topics":["1.2","2.7"],"verdict":"","by":""}]},{"id":"resource:arxiv:2606.03518","title":"Overlaying Governance: A Compositional Authorization Framework for Delegation and Scope in Agentic AI","abstract":"As AI systems evolve from passive models into autonomous active agents capable of initiating actions, collaborating, and delegating tasks, the traditional boundaries of software systems blur. Traditional authorization and delegation frameworks, built around fixed principals, explicit requests, and static scopes, are insufficient to govern agentic systems. Agentic AI demands richer authorization semantics: agents must inherit and delegate permissions, act under time-limited authority, and coordinate through shared protocols. Existing Identity and Access Management (IAM) systems fail to fully capture this notion of agency, lacking mechanisms for recursive delegation, contextual boundaries, and dynamic scoping as executable governance primitives. Unlike access delegation standards such as OAuth 2.0, we treat delegation as a contractual term rather than merely a static token-based consent credential. This paper proposes a compositional governance framework that introduces primitives indispensable for agentic AI. We define types of delegation and their permissions and accountability…","authors":["Amjad Ibrahim","Yong Li"],"date":"2026-06-02","url":"https://arxiv.org/abs/2606.03518","type":"preprint","doi":"10.48550/arxiv.2606.03518","arxiv":"2606.03518","repo":"","current":["2.2","2.3"],"suggested":["2.3.2","2.3.1","2.3.8","2.3.6","15.4.2","2.3.3","12.1.3","2.3.7","14.4.3","2.3.5","14.2.5","12.4.2","2.7.6","11.3.5"],"claims":[]},{"id":"resource:arxiv:2606.16613","title":"CoffeeBench: Benchmarking Long-Horizon LLM Agents in Heterogeneous Multi-Agent Economies","abstract":"As LLM agents become capable of increasingly long-horizon tasks, evaluating their performance in economic systems is becoming increasingly important. Unlike existing benchmarks that primarily evaluate a single agent interacting with a passive environment, economic systems are inherently multi-agent, requiring autonomous agents to communicate, negotiate, and transact while pursuing their own objectives over extended periods. We introduce CoffeeBench, a benchmark for evaluating LLM agents in a long-horizon multi-agent economy composed of heterogeneous firms. In CoffeeBench, two farmers, two roasters, and two retailers autonomously operate their businesses over a 90-day simulation, each seeking to maximize cumulative net income through communication and transactions while managing cash, inventory, and pricing. The evaluated model controls one coffee roaster, while the remaining firms are controlled by fixed reference agents. Across several recent open-weight and proprietary LLMs, all models outperform a passive baseline that takes no actions, with most achieving positive net income.…","authors":["Issa Sugiura","Daichi Hattori","Kazuo Araragi","Keita Ogawa","Shota Onose"],"date":"2026-06-15","url":"https://arxiv.org/abs/2606.16613","type":"preprint","doi":"10.48550/arxiv.2606.16613","arxiv":"2606.16613","repo":"","current":["5.4","14.1"],"suggested":["10.4.3","11.7.1","10.6.1","5.4.3","14.1.4","11.7.3","6.2.3","13.1.4","11.13.3","11.6.6","11.1.2","5.4.5","9.3.3","16.4.2"],"claims":[]},{"id":"resource:arxiv:2607.26637","title":"Filesystem-Based Memory for LLM Agents: Organization, Evolution, and Sustainability","abstract":"Deployed LLM agents increasingly keep their long-term memory as a filesystem: a directory tree of markdown files that the agent itself reads, writes, and reorganizes through generic file tools. Yet research has largely passed over this medium: prior systems design bespoke memory representations and study retrieval over them, leaving the default's two working assumptions untested: that an agent can keep a growing store organized as memories accumulate, conflict, and go stale, and that this organization pays. We present the first systematic exploration of filesystem-based memory for LLM agents. We formalize the setting as three roles around one memory filesystem: a management agent integrates and organizes incoming content, a search agent answers queries with cited sources, and an execution agent supplies task trajectories that are distilled into skills, unifying declarative memory and skills in a single store. Across long-conversation benchmarks and embodied tasks, we vary memory shape (agent-organized hierarchy, verbatim dump, chunk retrieval), stream scale, tool harness (sandboxed…","authors":["Sizhe Zhou","Sheldon Yu","Hui Wei","Junda Wu","Siru Ouyang"],"date":"2026-07-29","url":"https://arxiv.org/abs/2607.26637","type":"preprint","doi":"10.48550/arxiv.2607.26637","arxiv":"2607.26637","repo":"","current":["7.2","7.4"],"suggested":["5.2.3","16.4.4","13.4.4","16.4.2","8.4.2","16.4.1","14.1.1","7.2.2","7.1.3","2.1.6","7.4.2","16.4.3","5.4.4","11.13.2"],"claims":[]},{"id":"resource:arxiv:2607.27415","title":"Bridging Inference-Time Scaling and Episodic Memory with Action-Centric Graphs","abstract":"Recent advancements in inference-time scaling have significantly unlocked the complex reasoning capabilities of Large Language Models~(LLMs). However, for agents, these approaches suffer from a critical inefficiency, operating in a stateless manner and engaging in redundant search processes. Existing memory mechanisms largely rely on the reasoning capabilities of LLMs, leading to prohibitive computational costs. In this paper, we propose a novel framework, \\textit{GAMER}~(Graph-based Action-centric Memory with Episodic Reasoning), that bridges the gap between inference scaling and episodic memory. Our approach models historical reasoning as a dynamic \\textit{Action-Centric Graph}. By decoupling the memory mechanism from LLMs, our method can save token/money usage by providing less memory context than memory mechanism baselines. To extract knowledge from the graph effectively, we use a dual-stream Temporal Difference learning mechanism to estimate the positive~(suggestion) and negative~(avoidance) value of action nodes based on past successes and failures. During the inference phase,…","authors":["Xu Zheng","Chaohao Lin","Zhuomin Chen","Weijieying Ren","Haifeng Chen"],"date":"2026-07-29","url":"https://arxiv.org/abs/2607.27415","type":"preprint","doi":"10.48550/arxiv.2607.27415","arxiv":"2607.27415","repo":"","current":["7.1","7.4"],"suggested":["7.3.3","7.2.3","7.3.1","3.4.3","7.4.3","16.4.3","7.3.2","3.2.5","14.4.3","15.3.4","7.4.1","7.4.2","1.4.5","7.3.4"],"claims":[]},{"id":"resource:doi:10-1007-s11831-026-10675-8","title":"A Holistic Review of Agentic AI Frameworks, Applications, and Research Trajectories","abstract":"Abstract Agentic Artificial Intelligence (Agentic AI), as a new generation of intelligent systems, extends beyond mere text or image generation by incorporating components such as multi step reasoning, persistent memory, multi agent interaction, and purposeful tool use. These features enable autonomy and dynamic decision making in open and complex environments. This paper provides an extensive review of the existing literature on Agentic AI. To this end, the conceptual and historical distinctions between Agentic Artificial Intelligence, classical agents, and general-purpose language models are first examined. Subsequently, the proposed architectural framework encompassing perception, role adoption, memory, planning and reflection, action and tool use, and online learning is elaborated. The discussion then turns to key infrastructures, including state and memory management, orchestration and Machine Learning Operations (MLOps), as well as agent safety. Evaluation metrics and protocols are reviewed, ranging from interactive and long horizon testing to process level assessments.…","authors":["Pejman Peykani","Sanly Ghanidel","Iman Javadi-Sisi","Václav Snåšel","Seyedali Mirjalili"],"date":"2026-06-15","url":"https://doi.org/10.1007/s11831-026-10675-8","type":"peer-reviewed-paper","doi":"10.1007/s11831-026-10675-8","arxiv":"","repo":"","current":["3.1","16.1"],"suggested":["14.1.4","10.5.1","10.5.2","16.4.3","10.5.5","16.2.1","14.2.3","10.4.3","10.5.4","10.5.3","16.4.2","12.4.5","5.1.3","14.4.3"],"claims":[]},{"id":"resource:doi:10-1016-j-inffus-2025-103599","title":"AI Agents vs. Agentic AI: A Conceptual taxonomy, applications and challenges","abstract":"Information fusion, in the context of the Generative AI era, must distinguish AI Agents from Agentic AI. This review critically distinguishes between AI Agents and Agentic AI, offering a structured, conceptual taxonomy, application mapping, and analysis of opportunities and challenges to clarify their divergent design philosophies and capabilities. We begin by outlining the search strategy and foundational definitions, characterizing AI Agents as modular systems driven and enabled by LLMs and LIMs for task-specific automation. Generative AI is positioned as a precursor providing the foundation, with AI agents advancing through tool integration, prompt engineering, and reasoning enhancements. We then characterize Agentic AI systems, which, in contrast to AI Agents, represent a paradigm shift marked by multi-agent collaboration, dynamic task decomposition, persistent memory, and coordinated autonomy. Through a chronological evaluation of architectural evolution, operational mechanisms, interaction styles, and autonomy levels, we present a comparative analysis across both AI agents and…","authors":["Ranjan Sapkota","Konstantinos I. Roumeliotis","Manoj Karkee"],"date":"2025-08-22","url":"https://doi.org/10.1016/j.inffus.2025.103599","type":"peer-reviewed-paper","doi":"10.1016/j.inffus.2025.103599","arxiv":"","repo":"","current":["1.1","1.2"],"suggested":["5.1.3","5.1.2","1.1.2","15.2.4","1.3.4","14.1.2","3.2.5","5.1.5","11.1.1","3.2.1","5.1.1","1.1.6","3.2.3","5.1.4"],"claims":[]},{"id":"resource:doi:10-1016-j-patter-2025-101341","title":"Lessons from complex systems science for AI governance","abstract":"The study of complex adaptive systems, pioneered in physics, biology, and the social sciences, offers important lessons for artificial intelligence (AI) governance. Contemporary AI systems and the environments in which they operate exhibit many of the properties characteristic of complex systems, including nonlinear growth patterns, emergent phenomena, and cascading effects that can lead to catastrophic failures. Complex systems science can help illuminate the features of AI that pose central challenges for policymakers, such as feedback loops induced by training AI models on synthetic data and the interconnectedness between AI systems and critical infrastructure. Drawing on insights from other domains shaped by complex systems, including public health and climate change, we examine how efforts to govern AI are marked by deep uncertainty. To contend with this challenge, we propose three desiderata for designing a set of complexity-compatible AI governance principles comprised of early and scalable intervention, adaptive institutional design, and risk thresholds calibrated to trigger…","authors":["Noam Kolt","Michal Shur‐Ofry","Reuven Cohen"],"date":"2025-08-01","url":"https://doi.org/10.1016/j.patter.2025.101341","type":"peer-reviewed-paper","doi":"10.1016/j.patter.2025.101341","arxiv":"","repo":"","current":["15.3","3.4"],"suggested":["5.1.3","11.6.3","11.14.7","16.3.4","11.10.5","10.4.2","6.1.5","16.3.3","4.1.4","4.2.2","11.10.6","7.2.1","7.2.2","13.2.4"],"claims":[]},{"id":"resource:doi:10-1017-s0140525x2510174x","title":"Institutions as cached computation for resource-rational negotiation","abstract":"Resource-rational contractualism explains human moral reasoning as efficient heuristics approximating idealized bargaining processes. Levine et al. compellingly model pairwise and small-group moral cognition, but overlook how institutions serve as computational shortcuts - pre-computed agreements that eliminate repeated negotiation. These cached computations can become rigid over time, driving new opportunities for flexible negotiation.","authors":["Muhua Huang","James A. Evans"],"date":"2026-01-01","url":"https://doi.org/10.1017/s0140525x2510174x","type":"peer-reviewed-paper","doi":"10.1017/s0140525x2510174x","arxiv":"","repo":"","current":["1.2","5.2","15.3"],"suggested":["8.2.4","11.3.5","11.7.3","11.4.6","4.3.2","2.5.4","4.4.5","5.2.1","6.4.4","2.5.5","2.2.3","9.1.2","2.1.4","16.4.4"],"claims":[]},{"id":"resource:doi:10-1073-pnas-2319947121","title":"Tabula rasa agents display emergent in-group behavior","abstract":"Theories on group-bias often posit an internal preparedness to bias one's cognition to favor the in-group (often envisioned as a product of evolution). In contrast, other theories suggest that group-biases can emerge from nonspecialized cognitive processes. These perspectives have historically been difficult to disambiguate given that observed behavior can often be attributed to innate processes, even when groups are experimentally assigned. Here, we use modern techniques from the field of AI that allow us to ask what group biases can be expected from a learning agent that is a pure blank slate without any intrinsic social biases, and whose lifetime of experiences can be tightly controlled. This is possible because deep reinforcement-learning agents learn to convert raw sensory input (i.e. pixels) to reward-driven action, a unique feature among cognitive models. We find that blank slate agents do develop group biases based on arbitrary group differences (i.e. color). We show that the bias develops as a result of familiarity of experience and depends on the visual patterns becoming…","authors":["Raphaël Koster","Edgar A. Duéñez-Guzmán","William A. Cunningham","Joel Z. Leibo"],"date":"2025-06-16","url":"https://doi.org/10.1073/pnas.2319947121","type":"peer-reviewed-paper","doi":"10.1073/pnas.2319947121","arxiv":"","repo":"","current":["5.1"],"suggested":["5.1.5","11.13.3","5.1.1","5.1.2","5.1.3","5.1.4","3.1.1","4.1.3","9.1.5","11.7.1","11.12.5","6.5.4","11.8.5","5.3.3"],"claims":[]},{"id":"resource:doi:10-1073-pnas-2319948121","title":"Collective cooperative intelligence","abstract":"Cooperation at scale is critical for achieving a sustainable future for humanity. However, achieving collective, cooperative behavior-in which intelligent actors in complex environments jointly improve their well-being-remains poorly understood. Complex systems science (CSS) provides a rich understanding of collective phenomena, the evolution of cooperation, and the institutions that can sustain both. Yet, much of the theory in this area fails to fully consider individual-level complexity and environmental context-largely for the sake of tractability and because it has not been clear how to do so rigorously. These elements are well captured in multiagent reinforcement learning (MARL), which has recently put focus on cooperative (artificial) intelligence. However, typical MARL simulations can be computationally expensive and challenging to interpret. In this perspective, we propose that bridging CSS and MARL affords new directions forward. Both fields can complement each other in their goals, methods, and scope. MARL offers CSS concrete ways to formalize cognitive processes in…","authors":["Wolfram Barfuss","Jessica C. Flack","Chaitanya S. Gokhale","Lewis Hammond","Christian Hilbe"],"date":"2025-06-16","url":"https://doi.org/10.1073/pnas.2319948121","type":"peer-reviewed-paper","doi":"10.1073/pnas.2319948121","arxiv":"","repo":"","current":["5.2","15.3"],"suggested":["15.3.4","5.1.5","1.3.2","15.1.1","16.2.1","5.1.1","1.2.4","16.4.2","5.1.2","5.1.3","5.1.4","11.3.6","1.2.1","15.3.3"],"claims":[]},{"id":"resource:doi:10-1111-epic-70009","title":"Building the Loop: The Role of Ethnography in Artificial Organisational Intelligence","abstract":"Abstract We introduce Artificial Organisational Intelligence (AOI): the capacity for organisations to make their knowledge (including routines, practices, rules, boundaries, and tacit know‐how) legible and governable. AOI is not about replacing organisations with AI, but about enabling them to talk to themselves and to each other through regulated feedback loops. Our collaborative project with BlockScience and Metagov develops Knowledge Organisation Infrastructure (KOI), a protocol for stitching together disparate systems and practices without homogenisation, thereby allowing organisations to embed rules, permissions, and context into machine‐readable forms. We describe how our ethnographic practice both informs and is transformed by this work: from observing hidden practices to actively building the loops that make organisational knowledge accessible and computable.","authors":["Ellie Rennie","Kelsie Nabben","Michael Zargham","Jason Potts","Brooke Ann Coco"],"date":"2025-11-01","url":"https://doi.org/10.1111/epic.70009","type":"peer-reviewed-paper","doi":"10.1111/epic.70009","arxiv":"","repo":"","current":["16.1","16.4"],"suggested":["5.1.3","11.6.3","4.1.1","12.3.3","11.11.6","7.3.1","7.4.3","7.2.1","7.2.3","7.2.4","7.1.2","7.2.2","7.2.5","7.4.1"],"claims":[{"id":"claim:doi:10-1111-epic-70009:1","text":"Artificial Organisational Intelligence is defined as an organisation's capacity to make its own knowledge legible and governable.","standalone":"The paper introduces Artificial Organisational Intelligence (AOI) as the capacity of organisations to render their routines, practices, rules, boundaries and tacit know-how legible and governable.","quote":"We introduce Artificial Organisational Intelligence (AOI): the capacity for organisations to make their knowledge (including routines, practices, rules, boundaries, and tacit know‐how) legible and governable.","where":"abstract","type":"method","topics":["16.1","2.4"],"verdict":"","by":""},{"id":"claim:doi:10-1111-epic-70009:2","text":"AOI is about organisations talking to themselves through regulated feedback loops, not about replacing them with AI.","standalone":"The paper is explicit that Artificial Organisational Intelligence does not mean substituting AI for organisations, but enabling organisations to communicate with themselves and each other through regulated feedback loops.","quote":"AOI is not about replacing organisations with AI, but about enabling them to talk to themselves and to each other through regulated feedback loops.","where":"abstract","type":"position","topics":["16.1"],"verdict":"","by":""},{"id":"claim:doi:10-1111-epic-70009:3","text":"Knowledge Organisation Infrastructure is a protocol for connecting disparate systems without homogenising them.","standalone":"Developed with BlockScience and Metagov, KOI is presented as a protocol that stitches together disparate organisational systems and practices without homogenisation, letting organisations embed rules, permissions and context in machine-readable form.","quote":"Our collaborative project with BlockScience and Metagov develops Knowledge Organisation Infrastructure (KOI), a protocol for stitching together disparate systems and practices without homogenisation, thereby allowing organisations to embed rules, permissions, and context into machine‐readable forms.","where":"abstract","type":"method","topics":["2.4","16.1"],"verdict":"","by":""},{"id":"claim:doi:10-1111-epic-70009:4","text":"Ethnographic practice is transformed by this work, moving from observing hidden practices to building the loops that make them computable.","standalone":"The paper argues that the ethnographer's role changes in this setting: rather than only observing hidden organisational practices, the ethnographer actively builds the feedback loops that render organisational knowledge accessible and computable.","quote":"We describe how our ethnographic practice both informs and is transformed by this work: from observing hidden practices to actively building the loops that make organisational knowledge accessible and computable.","where":"abstract","type":"position","topics":["16.1.4","16.4"],"verdict":"","by":""}]},{"id":"resource:doi:10-1177-00491241251337316","title":"Simulating Subjects: The Promise and Peril of Artificial Intelligence Stand-Ins for Social Agents and Interactions","abstract":"Large language models (LLMs), through their exposure to massive collections of online text, learn to reproduce the perspectives and linguistic styles of diverse social and cultural groups. This capability suggests a powerful social scientific application—the simulation of empirically realistic, culturally situated human subjects. Synthesizing recent research in artificial intelligence and computational social science, we outline a methodological foundation for simulating human subjects and their social interactions. We then identify six characteristics of current models that are likely to impair the realistic simulation of human subjects: bias, uniformity, atemporality, disembodiment, linguistic cultures, and alien intelligence. For each of these areas, we discuss promising approaches for overcoming their associated shortcomings. Given the rate of change of these models, we advocate for an ongoing methodological program for the simulation of human subjects that keeps pace with rapid technical progress, and caution that validation against human subjects data remains essential to…","authors":["Austin C. Kozlowski","James A. Evans"],"date":"2025-06-02","url":"https://doi.org/10.1177/00491241251337316","type":"peer-reviewed-paper","doi":"10.1177/00491241251337316","arxiv":"","repo":"","current":["14.5","16.4"],"suggested":["14.5.4","16.3.3","6.2.3","2.5.1","11.10.6","4.4.1","11.11.5","4.1.2","4.4.6","4.1.1","10.6.1","3.4.3","4.1.4","4.1.5"],"claims":[]},{"id":"resource:doi:10-12688-f1000research-169927-1","title":"Trustworthy agentic AI systems: a cross-layer review of architectures, threat models, and governance","abstract":"<ns3:p>Agentic Artificial Intelligence systems, characterized by autonomous reasoning, memory augmentation, and adaptive planning, are rapidly reshaping technological landscapes. Unlike traditional AI or large language models, agentic AI integrates decision-making with persistent execution, enabling complex interactions across dynamic environments. However, this evolution introduces novel security risks, governance challenges, and ethical considerations that current frameworks inadequately address. This survey provides a cross-layer review of agentic AI, encompassing architectural paradigms, threat taxonomies, and governance strategies. It consolidates findings from adjacent domains such as cybersecurity, AI safety, multi-agent coordination, and ethics, offering a holistic understanding of vulnerabilities and mitigation approaches. We integrate insights from recent advances in defense architectures and governance innovations, highlighting the limitations of static policies in addressing dynamically evolving threats. Real-world deployments from industrial automation to military and…","authors":["IBRAHIM ADABARA","Bashir Olaniyi Sadiq","Aliyu Nuhu Shuaibu","Yale Ibrahim Danjuma","Maninti Venkateswarlu"],"date":"2025-09-11","url":"https://doi.org/10.12688/f1000research.169927.1","type":"peer-reviewed-paper","doi":"10.12688/f1000research.169927.1","arxiv":"","repo":"","current":["3.1","10.5","4.1"],"suggested":["10.6.4","10.5.1","16.4.2","10.5.2","11.13.1","15.2.3","16.4.3","10.5.5","12.4.5","15.2.1","10.5.4","3.2.6","16.4.4","15.2.4"],"claims":[]},{"id":"resource:doi:10-1002-aaai-70041","title":"Multi-Agent Ethnography: Post-Conventional Anthropological Practice for Agentic Systems","abstract":"Method work for section 16, which is thin. Pairs with Rennie's ethnography paper.","authors":[],"date":"2026-02-01","url":"https://doi.org/10.1002/aaai.70041","type":"peer-reviewed-paper","doi":"10.1002/aaai.70041","arxiv":"","repo":"","current":["16.1","16.4"],"suggested":["15.4.4","11.15.6","15.4.1","15.4.2","15.4.3","15.5.2","5.4.1","5.3.1","5.1.1","5.4.2","5.4.5","11.6.2","5.1.2","5.1.3"],"claims":[]},{"id":"resource:doi:10-1007-s10462-026-11284-2","title":"Towards trustworthy agentic AI: a comprehensive survey of safety, alignment and governance","abstract":"","authors":[],"date":"2026-04-01","url":"https://doi.org/10.1007/s10462-026-11284-2","type":"peer-reviewed-paper","doi":"10.1007/s10462-026-11284-2","arxiv":"","repo":"","current":["4.1","9.4","14.2"],"suggested":["12.4.1","15.2.2","10.4.4","15.1.5","2.6.1","10.4.1","14.2.1","13.1.4","14.2.2","14.2.3","14.2.4","15.2.1","15.2.3","15.2.5"],"claims":[]},{"id":"resource:doi:10-1007-s44163-026-00521-4","title":"Autonomous Agents in a Zero-Trust World: Architecting Secure, Auditable Agent Systems","abstract":"","authors":[],"date":"2025-11-01","url":"https://doi.org/10.1007/s44163-026-00521-4","type":"peer-reviewed-paper","doi":"10.1007/s44163-026-00521-4","arxiv":"","repo":"","current":["2.2","9.2","15.4"],"suggested":["15.4.1","5.3.4","5.3.2","4.4.5","8.1.1","5.3.1","5.3.3","3.3.4","9.1.4","9.4.2","10.2.2","10.2.4","11.9.4","11.14.2"],"claims":[]},{"id":"resource:doi:10-1016-j-inffus-2025-103601","title":"TRiSM for Agentic AI: A review of Trust, Risk, and Security Management in LLM-based agentic multi-agent systems","abstract":"Most-cited candidate in the queue at 35. Trust, risk and secu ck/buzz","current":["2.1","3.2","9.2"],"suggested":["13.1.2","5.2.3","2.7.6","9.2.4","11.5.2","11.8.7","9.2.2","8.1.2","14.4.5","10.2.6","13.2.1","10.6.3","2.4.5","4.5.2"],"claims":[]},{"id":"resource:tool:paperclip","title":"Paperclip","abstract":"An open-source Node.js and React application for orchestrating teams of AI agents against business goals, with org charts, per-agent budgets, and approval gates. Users bring their own agents from any provider.","authors":[],"date":"2026-03-02","url":"https://paperclip.ing","type":"code-tool","doi":"","arxiv":"","repo":"https://github.com/paperclipai/paperclip","current":["2.2","3.1","3.2","4.1","8.1.4","8.4.1","8.4.2","9.2"],"suggested":["2.5.4","1.4.4","9.4.1","11.2.6","3.3.5","11.5.2","10.6.1","8.1.2","6.5.2","7.4.3","8.1.4","7.1.4","7.4.4","11.7.2"],"claims":[]}]}</script>
<script>
(() => {
  "use strict";
  const DATA = JSON.parse(document.getElementById("graph").textContent);
  const TOPICS = new Map(DATA.topics.map(t => [t.code, t]));
  const KEY = "aocommons.filing.v1";

  const THEME_KEY = "aocommons.theme";
  function applyTheme(mode) {
    document.documentElement.setAttribute("data-theme", mode);
    const button = document.getElementById("theme");
    if (button) button.textContent = mode === "dark" ? "Light" : "Dark";
    try { localStorage.setItem(THEME_KEY, mode); } catch (e) { /* private browsing */ }
  }
  // No stored choice means follow the laptop. Once someone picks, their pick
  // wins and keeps winning — the OS is a default, not an override.
  const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  let theme = prefersDark ? "dark" : "light";
  try { theme = localStorage.getItem(THEME_KEY) || theme; } catch (e) { /* default holds */ }

  const state = {
    mode: "explore",
    cursor: 0,
    picked: new Set(),
    open: new Set(),
    focusTopic: null,
    author: null,
    viewing: null,
    add: { raw: "", id: null, fields: {}, resolved: null, looking: false, picked: new Set(), topics: false },
    showAll: false,
    unsure: false,
    note: "",
    noteOpen: false,
    decisions: {},
    // Verdicts on extracted claims. Kept apart from `decisions` the whole way
    // through, because they answer a different question and are measured
    // against a different thing.
    claims: {},
    // Statements a reviewer wrote themselves, keyed by record. Held apart from
    // verdicts: one is a judgement on a machine's reading, the other is a new
    // reading of the paper, and they enter the corpus by different doors.
    newClaims: {},
    addingTo: null,
    draft: null,
    sent: [],
  };

  // Work other people have already had merged. Fetched same-origin, so it
  // resolves on Pages and simply stays empty anywhere else — there is no
  // shared server behind this page, and pretending otherwise would be worse
  // than the gap.
  const merged = new Map();

  // What the group has already sent in. The repository is public, so its
  // issues are readable without a token and without anyone signing in —
  // which is why there is no login here: a login would gate something that
  // is already public, and make contributing feel like joining.
  const submissions = { state: "loading", items: [], read: 0 };

  function loadSubmissions(force) {
    // Unauthenticated GitHub allows sixty reads an hour per address, and this
    // runs again every time someone comes back from a GitHub tab. Throttled so
    // that flicking between tabs cannot spend the hour's budget — the floor
    // holds even when a check was asked for explicitly.
    const now = Date.now();
    if (now - submissions.read < (force ? 3000 : 20000)) return;
    submissions.read = now;

    fetch("https://api.github.com/repos/AO-Commons/knowledge-graph/issues"
          + "?state=all&per_page=60&sort=created&direction=desc",
          { headers: { Accept: "application/vnd.github+json" } })
      .then(response => (response.ok ? response.json() : Promise.reject(response.status)))
      .then(issues => {
        submissions.state = "ready";
        submissions.items = issues
          .filter(issue => !issue.pull_request)
          .map(issue => ({
            number: issue.number,
            title: issue.title,
            who: issue.user && issue.user.login,
            createdAt: issue.created_at || "",
            when: (issue.created_at || "").slice(0, 10),
            open: issue.state === "open",
            url: issue.html_url,
            kind: (issue.labels || []).map(l => l.name)
              .find(n => ["filing", "new-resource", "taxonomy"].includes(n)) || "other",
          }));
        if (confirmSends() || state.mode === "export") renderStage();
      })
      .catch(() => {
        // Being unable to show the history is not a reason to block filing.
        submissions.state = "unavailable";
        if (state.mode === "export") renderStage();
      });
  }
  loadSubmissions(true);

  // Coming back from GitHub is the only signal this page gets that a trip
  // happened at all, so it is the moment to look for the issue.
  window.addEventListener("focus", () => {
    if (!state.sent.some(entry => !entry.number)) return;
    loadSubmissions(true);
    // GitHub's list can lag the submit by a second or two, and the person is
    // usually back here before it catches up. One follow-up covers that
    // without turning this into a poller.
    setTimeout(() => {
      if (state.sent.some(entry => !entry.number)) loadSubmissions(true);
    }, 6000);
  });
  // A 404 here is the normal case and is caught below; browsers still log the
  // failed request, which is noise rather than a fault.
  fetch("gold.json")
    .then(r => (r.ok ? r.json() : null))
    .then(payload => {
      if (!payload) return;
      Object.entries(payload.records || {}).forEach(([id, d]) =>
        merged.set(id, { topics: d.topics || [], on: d.reviewed_on || "", by: d.reviewer || "merged" }));
      if (merged.size) { renderStage(); renderTree(); }
    })
    .catch(() => { /* absent is the normal case */ });

  // ---- persistence -------------------------------------------------------
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
    state.decisions = saved.decisions || {};
    state.claims = saved.claims || {};
    state.newClaims = saved.newClaims || {};
    state.sent = Array.isArray(saved.sent) ? saved.sent : [];
  } catch (e) { /* corrupt or unavailable storage should not block filing */ }

  const save = () => {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        decisions: state.decisions, claims: state.claims,
        newClaims: state.newClaims, sent: state.sent,
      }));
    } catch (e) { /* private browsing; the session still works, export still offered */ }
  };

  // ---- helpers -----------------------------------------------------------
  const ancestors = code => {
    const parts = code.split(".");
    return parts.slice(0, -1).map((_, i) => parts.slice(0, i + 1).join("."));
  };
  const el = (tag, props = {}, kids = []) => {
    const node = Object.assign(document.createElement(tag), props);
    (Array.isArray(kids) ? kids : [kids]).forEach(k =>
      node.append(k instanceof Node ? k : document.createTextNode(k)));
    return node;
  };
  const samePerson = name => name.toLowerCase().replace(/[.'`-]/g, "").replace(/\s+/g, " ").trim();
  // A real popover rather than the browser's `title`. The native one waits a
  // second, cannot be styled, and truncates anything the length of an
  // explanation — which meant every one of these read as decoration that did
  // nothing. Takes a string or several, so an explanation can have paragraphs.
  let tipCount = 0;
  const info = (...parts) => {
    const wrap = el("span", { className: "info-wrap" });
    const mark = el("button", { className: "info", type: "button" }, "i");
    const tip = el("span", { className: "tip" });
    parts.flat().forEach(part => tip.append(el("span", { className: "tip-p" }, part)));

    tip.id = "tip-" + (++tipCount);
    tip.setAttribute("role", "tooltip");
    mark.setAttribute("aria-label", "What this means");
    mark.setAttribute("aria-describedby", tip.id);

    // Flip when it would run off the right edge — measured on open rather
    // than guessed, because these sit at every width in the layout.
    const place = () => {
      tip.classList.remove("flip");
      if (tip.getBoundingClientRect().right > window.innerWidth - 14) tip.classList.add("flip");
    };
    mark.addEventListener("mouseenter", place);
    mark.addEventListener("focus", place);
    // Tapping works too: on a touch screen there is no hover at all.
    mark.addEventListener("click", event => {
      event.preventDefault();
      wrap.classList.toggle("open");
      place();
    });
    wrap.append(mark, tip);
    return wrap;
  };
  const trailOf = code => ancestors(code).map(c => TOPICS.get(c)?.title).filter(Boolean).join(" › ");

  // Counts combine what the corpus already claims with what you have filed,
  // so the tree fills as you work rather than only after a rebuild.
  const counts = () => {
    const tally = new Map();
    const bump = code => {
      if (!TOPICS.has(code)) return;
      tally.set(code, (tally.get(code) || 0) + 1);
      ancestors(code).forEach(a => tally.set(a, (tally.get(a) || 0) + 1));
    };
    DATA.records.forEach(r => {
      const filed = state.decisions[r.id];
      (filed ? filed.topics : r.current).forEach(bump);
    });
    return tally;
  };

  const reviewed = () => Object.keys(state.decisions).length;

  // How many people have filed an opinion on a record: whatever has been
  // merged, plus your own if you have one. A count of nothing is the useful
  // case — it says where the group has not been yet.
  function reviewCount(id) {
    return (merged.has(id) ? 1 : 0) + (state.decisions[id] ? 1 : 0);
  }

  function reviewCell(record) {
    const n = reviewCount(record.id);
    const cell = el("div", { className: "reviews" });
    cell.append(el("span", { className: "count" + (n ? " some" : "") },
      n === 0 ? "no reviews yet" : `${n} review${n === 1 ? "" : "s"}`));
    const button = el("button", { className: "btn" },
      state.decisions[record.id] ? "Change your review" : "Review this resource");
    button.addEventListener("click", () => { setMode("review"); openRecord(record); });
    cell.append(button);
    return cell;
  }

  // ---- the tree ----------------------------------------------------------
  // Two separate affordances on one row: the chevron opens the branch, the
  // label selects it. The first version had only the former, and a leaf did
  // nothing at all when clicked — which is why the whole pane read as a
  // static list rather than navigation.
  function renderTree() {
    const tally = counts();
    const host = document.getElementById("tree");
    host.textContent = "";

    const lit = new Set();
    state.picked.forEach(c => { lit.add(c); ancestors(c).forEach(a => lit.add(a)); });
    if (state.focusTopic) { lit.add(state.focusTopic); ancestors(state.focusTopic).forEach(a => lit.add(a)); }

    const max = Math.max(1, ...[...tally.values()]);
    const hasKids = code => DATA.topics.some(t => t.parent === code);

    DATA.topics.forEach(topic => {
      if (topic.depth > 0 && !state.open.has(topic.section)) return;
      if (topic.depth > 1 && !state.open.has(topic.parent)) return;

      const n = tally.get(topic.code) || 0;
      const row = el("div", { className: "row" + (lit.has(topic.code) ? " lit" : "") });
      row.style.paddingLeft = (10 + topic.depth * 14) + "px";

      const expandable = hasKids(topic.code);
      const twist = el("button", { className: "twist" + (expandable ? "" : " leaf") }, "▶");
      twist.setAttribute("aria-expanded", String(state.open.has(topic.code)));
      twist.setAttribute("aria-label", (state.open.has(topic.code) ? "Collapse " : "Expand ") + topic.code);
      if (expandable) {
        twist.addEventListener("click", event => {
          event.stopPropagation();
          state.open.has(topic.code) ? state.open.delete(topic.code) : state.open.add(topic.code);
          renderTree();
        });
      }

      const node = el("button", { className: "node" + (topic.depth === 0 ? " section" : "") });
      node.title = topic.points.length ? topic.points.join(" · ") : topic.title;
      node.append(
        el("span", { className: "label" }, [el("span", { className: "code" }, topic.code), topic.title]),
        el("span", { className: "count" + (n ? " has" : (topic.depth === 0 ? " gap" : "")) },
           n ? String(n) : (topic.depth === 0 ? "0" : "")),
      );
      node.addEventListener("click", () => focusBranch(topic.code));

      row.append(twist, node);
      host.append(row);

      if (n && topic.depth === 0) {
        const bar = el("div", { className: "bar" });
        bar.style.width = Math.max(6, (n / max) * 100) + "%";
        bar.style.marginLeft = "28px";
        host.append(bar);
      }
    });

    renderReady();

    const covered = DATA.topics.filter(t => (tally.get(t.code) || 0) > 0).length;
    document.getElementById("filled").textContent = `${covered}/${DATA.topics.length} filed`;
    document.getElementById("meter").style.width =
      ((reviewed() / DATA.records.length) * 100) + "%";
  }

  // Records that can take the whole exercise: they have statements to check as
  // well as a place in the tree. Listed above the taxonomy because they are
  // worth more than an untagged record — a reviewer's hour spent here produces
  // two kinds of judgement instead of one, and the group should be steered
  // toward them rather than left to find them by chance.
  function renderReady() {
    const host = document.getElementById("ready");
    host.textContent = "";
    const ready = DATA.records.filter(r => (r.claims || []).length);
    if (!ready.length) return;

    const progress = record => {
      const claims = record.claims || [];
      const checked = claims.filter(c => state.claims[c.id] || c.verdict).length;
      return { checked, total: claims.length, tagged: !!state.decisions[record.id] };
    };
    // Unfinished first — a list whose top is work already done is a list
    // nobody reads twice.
    const ordered = [...ready].sort((a, a2) => {
      const x = progress(a), y = progress(a2);
      const doneX = x.tagged && x.checked === x.total, doneY = y.tagged && y.checked === y.total;
      return (doneX - doneY) || (y.total - x.total);
    });

    const outstanding = ordered.filter(r => {
      const p = progress(r);
      return !(p.tagged && p.checked === p.total);
    }).length;

    host.append(el("div", { className: "tree-head" }, [
      el("h2", {}, "Ready for complete review"),
      el("span", { className: "filled" }, `${outstanding} of ${ready.length} open`),
    ]));

    ordered.forEach(record => {
      const p = progress(record);
      const complete = p.tagged && p.checked === p.total;
      const row = el("button", { className: "ready-row" + (complete ? " done" : "") });
      row.title = "Both questions can be answered for this one: where it belongs, and "
        + "whether its statements are right.";
      row.append(
        el("span", { className: "t" }, shorten(record.title, 66)),
        el("span", { className: "s" },
           complete ? "done" : `${p.checked}/${p.total}${p.tagged ? " · tagged" : ""}`),
      );
      row.addEventListener("click", () => { setMode("review"); openRecord(record); });
      host.append(row);
    });
  }

  // Cutting at a fixed count leaves "…Melting P" and "…physical, socia", which
  // reads as a rendering fault rather than as a title that did not fit.
  function shorten(text, limit) {
    if (text.length <= limit) return text;
    const cut = text.slice(0, limit);
    const space = cut.lastIndexOf(" ");
    return (space > limit * 0.6 ? cut.slice(0, space) : cut).replace(/[\s,;:.\-]+$/, "") + "…";
  }

  // Selecting a branch narrows the queue. This is how a group divides the
  // work without a server telling anyone what to do: take a section, and the
  // records you see are the ones that branch plausibly covers.
  function focusBranch(code) {
    state.focusTopic = state.focusTopic === code ? null : code;
    state.cursor = 0;
    ancestors(code).forEach(a => state.open.add(a));
    renderStage(); renderTree();
  }

  // ---- review ------------------------------------------------------------
  function inBranch(record, code) {
    const under = t => t === code || t.startsWith(code + ".");
    return record.current.some(under) || record.suggested.some(under);
  }

  function queue() {
    let pending = DATA.records.filter(r => !state.decisions[r.id] && !merged.has(r.id));
    if (state.focusTopic) pending = pending.filter(r => inBranch(r, state.focusTopic));
    return pending;
  }

  function renderReview() {
    const stage = document.getElementById("stage");
    stage.textContent = "";
    const pending = queue();

    if (!pending.length) {
      stage.append(
        el("h2", {}, "Everything here is filed."),
        el("p", { className: "empty" }, `You have filed ${reviewed()} record${reviewed() === 1 ? "" : "s"}. Open Submit to send them in.`),
      );
      return;
    }

    const record = currentRecord();
    if (!record) { advance(); return; }
    const already = state.decisions[record.id];
    const claimCount = (record.claims || []).length;
    const kicker = el("div", { className: "kicker" }, [
      el("span", {}, record.type.replace(/-/g, " ")),
      el("span", {}, record.date || "undated"),
      el("span", {}, `${pending.length} left`),
      ...(claimCount
        ? [el("span", { className: "flag" },
             `${claimCount} statement${claimCount === 1 ? "" : "s"} to check`)]
        : []),
    ]);

    const title = el("h1", { className: "record-title" }, record.title);
    const byline = el("p", { className: "byline" });
    if (record.authors.length) byline.append(record.authors.join(", ") + (record.authors.length >= 5 ? " et al." : ""));
    if (record.url) {
      byline.append(byline.textContent ? " · " : "");
      byline.append(el("a", { href: record.url, target: "_blank", rel: "noopener" }, "read the source"));
    }

    const abstract = record.abstract
      ? el("p", { className: "abstract" }, record.abstract)
      : el("p", { className: "abstract none" }, "No abstract available. Judge from the title and source, or skip — a guess here is worse than a gap.");

    if (state.focusTopic) stage.append(branchChip());
    stage.append(kicker, title, byline, abstract);

    // Everything that wants a decision lives in one marked block, so a
    // contributor can see where to act without reading first.
    const ask = el("div", { className: "ask" });
    ask.append(el("div", { className: "prompt" }, [
      el("span", { className: "step" }, already ? "added" : "your call"),
      el("strong", {}, "Which topics does this belong under?"),
      el("span", { className: "sub" }, "Pick every one that applies — most papers sit under two or three."),
      info("A topic is what the paper is about. Tag the most specific one that fits: "
           + "tagging 2.2.2 already implies 2.2 and 2, so there is no need to add the parents."),
    ]));

    // Five, not fourteen. A wall of near-misses makes the choice harder, and
    // retrieval puts a right answer in the top five often enough that the
    // rest are better as a deliberate second look than as noise.
    const TOP = 5;
    const ranked = [...new Set([...record.suggested, ...state.picked])];
    const shown = state.showAll ? ranked : [...new Set([...ranked.slice(0, TOP), ...state.picked])];
    const chips = el("div", { className: "chips" });
    shown.forEach(code => {
      const topic = TOPICS.get(code);
      if (!topic) return;
      const chip = el("button", { className: "chip" + (record.current.includes(code) ? " was" : "") });
      chip.setAttribute("aria-pressed", state.picked.has(code) ? "true" : "false");
      chip.title = trailOf(code) || topic.title;
      chip.append(el("span", { className: "c" }, code), el("span", { className: "t" }, topic.title));
      chip.addEventListener("click", () => {
        state.picked.has(code) ? state.picked.delete(code) : state.picked.add(code);
        renderReview(); renderTree();
      });
      chips.append(chip);
    });
    ask.append(chips);

    if (!state.showAll && ranked.length > TOP) {
      const more = el("button", { className: "more" }, `Show ${ranked.length - TOP} more suggestions`);
      more.addEventListener("click", () => { state.showAll = true; renderReview(); });
      ask.append(more);
    }

    // Free search over all 567.
    const finder = el("div", { className: "finder" });
    const input = el("input", { placeholder: "Nothing fits? Search all 567 topics — try “revocation”, “budget”, “incident”", type: "search" });
    const results = el("div", { className: "results" });
    input.addEventListener("input", () => {
      results.textContent = "";
      const q = input.value.trim().toLowerCase();
      if (q.length < 2) return;
      DATA.topics
        .map(t => {
          const hay = (t.title + " " + t.points.join(" ")).toLowerCase();
          let score = hay.includes(q) ? 2 : 0;
          if (t.title.toLowerCase().startsWith(q)) score += 2;
          if (t.code.startsWith(q)) score += 3;
          return { t, score };
        })
        .filter(x => x.score > 0)
        .sort((a, b) => b.score - a.score)
        .slice(0, 12)
        .forEach(({ t }) => {
          const hit = el("button", { className: "result" }, [
            el("span", { className: "code" }, t.code),
            el("span", {}, [t.title, el("span", { className: "trail" }, trailOf(t.code))]),
          ]);
          hit.addEventListener("click", () => {
            state.picked.add(t.code); input.value = ""; results.textContent = "";
            renderReview(); renderTree();
          });
          results.append(hit);
        });
    });
    finder.append(input, results);
    ask.append(finder);

    const extras = el("div", { className: "extras" });

    const unsureBox = el("input", { type: "checkbox", id: "unsure", checked: state.unsure });
    unsureBox.addEventListener("change", () => { state.unsure = unsureBox.checked; });
    extras.append(el("div", { className: "checkline" }, [
      unsureBox,
      el("label", { htmlFor: "unsure" }, [
        "I'm not certain about this one",
        info("Recorded with your answer. An unsure call is not weighed the same as a "
             + "confident one when the gold set is used to measure the classifier, and it "
             + "tells a maintainer where a second opinion is worth having."),
        el("span", { className: "why" },
           "Better than guessing quietly — say so and someone will look again."),
      ]),
    ]));

    const note = el("div", { className: "note" });
    if (state.noteOpen) {
      const area = el("textarea", {
        placeholder: "Anything that gave you trouble — a topic that almost fit, a branch you were torn between.",
        value: state.note,
      });
      area.addEventListener("input", () => { state.note = area.value; });
      note.append(area);
    } else {
      const open = el("button", { className: "more" }, "Add a note");
      open.addEventListener("click", () => { state.noteOpen = true; renderReview(); });
      note.append(open);
    }
    extras.append(note);
    ask.append(extras);

    const file = el("button", { className: "btn primary" },
      already ? `Update — ${state.picked.size} topic${state.picked.size === 1 ? "" : "s"}`
              : `Add to submission — ${state.picked.size || "no"} topic${state.picked.size === 1 ? "" : "s"}`);
    file.disabled = state.picked.size === 0;
    file.addEventListener("click", () => commit(record, [...state.picked], "filed"));

    // "None apply" was two different findings wearing one button. Out of
    // scope means the corpus is wrong to hold this; nothing fits means the
    // taxonomy has a gap. The second is a proposal waiting to happen and the
    // first is an ingestion error, so they are worth telling apart.
    const outOfScope = el("button", { className: "btn" }, "Out of scope");
    outOfScope.title = "This paper does not belong in the library at all. Use it when agents hold "
      + "no real authority in whatever it describes — the scope test the taxonomy sets. "
      + "It tells us the corpus is holding something it should not.";
    outOfScope.addEventListener("click", () => commit(record, [], "out-of-scope"));

    const noFit = el("button", { className: "btn" }, "Nothing fits");
    noFit.title = "The paper belongs here, but no topic in the taxonomy covers it. "
      + "That is a gap worth a proposal, and the most useful thing you can tell us — "
      + "leave a note saying what was closest.";
    noFit.addEventListener("click", () => commit(record, [], "no-topic-fits"));

    const skip = el("button", { className: "btn" }, already ? "Next" : "Skip");
    skip.title = already ? "Move on. Your decision is kept."
                         : "No opinion on this one. Nothing is recorded and it stays in the queue.";
    skip.addEventListener("click", () => {
      if (!already) state.cursor = (state.cursor + 1) % Math.max(1, pending.length);
      advance();
    });

    // The second question, asked while the paper is still in your head — and
    // asked *before* the buttons. It sat after them once, which put it a full
    // screen below the fold and below the control that ends the task: a
    // reviewer tagged, clicked, and never saw it. Optional work still has to be
    // in the path of the eye, or it may as well not be built.
    if (record.claims && record.claims.length) {
      ask.append(claimPanel(record));
    } else {
      ask.append(el("p", { className: "hint", style: "margin-top:18px" },
        "Nothing has been extracted from this one yet, so topics are the whole job here."));
    }

    ask.append(el("div", { className: "actions" }, [
      file, outOfScope, noFit, skip,
      el("span", { className: "hint" }, `${reviewed()} filed by you`),
    ]));
    stage.append(ask);

    if (already) {
      const verdict = already.verdict === "out-of-scope" ? "marked out of scope"
        : already.verdict === "no-topic-fits" ? "marked as fitting no topic"
        : `added under ${already.topics.join(", ")}`;
      const next = el("button", { className: "btn primary" }, "Next record");
      next.addEventListener("click", () => { state.viewing = null; advance(); });
      stage.append(el("div", { className: "staged" }, [
        el("span", {}, [el("strong", {}, "In your submission — "), verdict,
                        ". Change anything above and press Update."]),
        next,
      ]));
    }

    stage.append(ledger());
  }

  function branchChip() {
    const topic = TOPICS.get(state.focusTopic);
    const clear = el("button", { title: "Show every record again" }, "×");
    clear.addEventListener("click", () => focusBranch(state.focusTopic));
    return el("div", { className: "branch-chip" },
      [`Working through ${state.focusTopic} · ${topic ? topic.title : ""}`, clear]);
  }

  // The audit trail. Everything filed, newest first, so a group can see what
  // has already been covered instead of duplicating each other.
  function ledger() {
    // Whose work this is, and — for your own — whether it has left the browser.
    // Someone filing for an hour deserves to see that from here rather than
    // having to open Submit to find out.
    const sent = new Set(state.sent
      .filter(entry => entry.kind === "filing" && entry.number)
      .flatMap(entry => entry.records || []));
    const rows = [
      ...Object.entries(state.decisions).map(([id, d]) =>
        ({ id, ...d, by: sent.has(id) ? "you · sent" : "you · not sent yet" })),
      ...[...merged.entries()].map(([id, d]) => ({ id, ...d })),
    ].sort((a, b) => (b.on || "").localeCompare(a.on || ""));

    const wrap = el("div", { className: "ledger" });
    wrap.append(el("p", { className: "section-label" },
      `Filed so far — ${rows.length} record${rows.length === 1 ? "" : "s"}`));

    if (!rows.length) {
      wrap.append(el("p", { className: "empty" }, "Nothing filed yet. Yours will appear here as you go."));
      return wrap;
    }

    const table = el("table");
    table.append(el("tr", {}, [
      el("th", {}, "Record"), el("th", {}, "Filed under"), el("th", {}, "By"), el("th", {}, "When"),
    ]));
    rows.slice(0, 60).forEach(r => {
      const record = DATA.records.find(x => x.id === r.id);
      const title = (record ? record.title : r.id).slice(0, 76);
      let cell;
      if (record && state.decisions[r.id]) {
        const back = el("button", { className: "more" }, title);
        back.title = "Open this again and change it";
        back.addEventListener("click", () => { setMode("review"); openRecord(record); });
        cell = el("td", {}, back);
      } else {
        cell = el("td", {}, title);
      }
      table.append(el("tr", {}, [
        cell,
        r.topics.length
          ? el("td", { className: "codes" },
              r.topics.join("  ") + (r.unsure ? "  (unsure)" : ""))
          : el("td", { className: "codes none" },
              r.verdict === "out-of-scope" ? "out of scope"
                : r.verdict === "no-topic-fits" ? "nothing fits" : "none apply"),
        el("td", { className: "by" }, r.by || "—"),
        el("td", { className: "when" }, r.on || ""),
      ]));
    });
    wrap.append(el("div", { className: "ledger-wrap" }, table));
    if (rows.length > 60) wrap.append(el("p", { className: "empty" }, `…and ${rows.length - 60} more.`));
    return wrap;
  }

  // ---- claims ------------------------------------------------------------
  // A paper is a container; the answerable things are the statements inside
  // it. These were read out of the abstract by a model and are worth exactly
  // nothing until a person has checked them against the quoted sentence —
  // which is why the sentence is shown, and why checking one takes seconds.

  const VERDICTS = [
    ["accurate", "Accurate",
     "The paraphrase says what the quoted sentence says, no more."],
    ["overstated", "Overstated",
     "It is in the paper, but the paraphrase claims more than the source does — a "
     + "hedge dropped, a scope widened. The most common way extraction goes wrong, and "
     + "invisible in a yes/no."],
    ["not-in-source", "Not in the source",
     "The paper does not say this. Either the quote does not support it or the quote "
     + "itself is wrong."],
    ["ambiguous", "Can't tell",
     "The sentence alone is not enough to judge, and you would need the full paper. "
     + "A real answer, not a failure to answer."],
  ];

  const CLAIM_KINDS = {
    finding: ["finding", "Something the work reports as observed or measured."],
    method: ["method", "A technique or mechanism the work introduces."],
    limitation: ["limitation", "A boundary the authors put on their own result."],
    position: ["position", "An argument or recommendation, offered without evidence here."],
  };

  function claimPanel(record) {
    const wrap = el("div", { className: "claims-block" });
    const done = record.claims.filter(c => state.claims[c.id] || c.verdict).length
      + mine(record).length;

    const total = record.claims.length + mine(record).length;
    wrap.append(el("div", { className: "prompt" }, [
      el("span", { className: "step" }, `${done} of ${total}`),
      el("strong", {}, "Context statements"),
      el("span", { className: "sub" },
        `${record.claims.length} read out of the paper automatically — from the abstract and, `
        + "where the full text was available, from its introduction, results and conclusion. "
        + "Each shows the sentence it came from."),
      info(
        "Why it is worth a minute: a confirmed statement carries its own source, so the "
        + "library can answer a question with the sentence behind it rather than handing "
        + "someone five papers to read.",
        "How to judge one: against the quoted sentence, not against the paper. Every quote "
        + "is checked word-for-word against the source before it reaches you, so if the "
        + "quote does not support the statement, the statement is wrong.",
        "A machine wrote these. Until a person confirms one, it stays marked as a machine's "
        + "reading everywhere it appears.",
      ),
    ]));

    record.claims.forEach(claim => {
      const card = el("div", { className: "claim" });
      const kind = CLAIM_KINDS[claim.type] || [claim.type, ""];
      card.append(el("div", { className: "kicker" }, [
        el("span", {}, kind[0]),
        ...(kind[1] ? [info(kind[1])] : []),
      ]));
      card.append(el("p", { className: "claim-text" }, claim.text));
      // The claim is deliberately stripped to one assertion, which can leave it
      // unjudgeable on its own — "it reveals weaknesses" reveals nothing about
      // what "it" is. The standalone form puts back exactly enough context to
      // decide, without putting back the sentence we are asking about.
      if (claim.standalone && claim.standalone !== claim.text) {
        card.append(el("p", { className: "claim-context" }, claim.standalone));
      }
      card.append(el("blockquote", { className: "claim-quote" }, "“" + claim.quote + "”"));
      if (claim.where) {
        card.append(el("p", { className: "claim-where" },
          claim.where === "abstract"
            ? "from the abstract, above"
            : `from the ${claim.where} — not shown above, so judge it on the quote`));
      }

      // Already merged means somebody else settled it. Shown rather than
      // asked again — re-deciding a merged verdict belongs in a disagreement,
      // not in a queue.
      if (claim.verdict) {
        card.append(el("p", { className: "hint" },
          `Checked${claim.by ? " by " + claim.by : ""} — ${claim.verdict.replace(/-/g, " ")}.`));
        wrap.append(card);
        return;
      }

      const mine = state.claims[claim.id];
      const row = el("div", { className: "chips" });
      VERDICTS.forEach(([value, label, why]) => {
        const chip = el("button", { className: "chip" });
        chip.setAttribute("aria-pressed", mine && mine.verdict === value ? "true" : "false");
        chip.title = why;
        chip.append(el("span", { className: "t" }, label));
        chip.addEventListener("click", () => {
          if (mine && mine.verdict === value) delete state.claims[claim.id];
          else state.claims[claim.id] = { verdict: value, on: today(), note: (mine || {}).note || "" };
          save(); renderReview();
        });
        row.append(chip);
      });
      card.append(row);

      // A note is where the actual finding lives when a verdict is negative:
      // "overstated" tells the extractor something is wrong, and the note
      // tells it what.
      if (mine && mine.verdict !== "accurate") {
        const area = el("textarea", {
          placeholder: "What is wrong with it? One line is plenty — this is what an "
                       + "extractor can be fixed against.",
          value: mine.note || "",
        });
        area.addEventListener("input", () => {
          state.claims[claim.id].note = area.value; save();
        });
        card.append(el("div", { className: "note" }, area));
      }
      wrap.append(card);
    });

    mine(record).forEach((entry, index) => {
      const card = el("div", { className: "claim mine" });
      card.append(el("div", { className: "kicker" }, [
        el("span", {}, entry.type), el("span", {}, "yours, not yet sent"),
      ]));
      card.append(el("p", { className: "claim-text" }, entry.text));
      card.append(el("blockquote", { className: "claim-quote" }, "“" + entry.quote + "”"));
      const drop = el("button", { className: "more" }, "Remove this one");
      drop.addEventListener("click", () => {
        state.newClaims[record.id].splice(index, 1);
        if (!state.newClaims[record.id].length) delete state.newClaims[record.id];
        save(); renderReview(); renderTree();
      });
      card.append(drop);
      wrap.append(card);
    });

    wrap.append(addStatement(record));
    wrap.append(el("p", { className: "hint" },
      done
        ? `${done} of ${total} done — they travel with your filing.`
        : "These go in the same submission as your topics."));
    return wrap;
  }

  const mine = record => state.newClaims[record.id] || [];

  // The extractor misses things, and the person who has just read the paper is
  // the only one positioned to notice. Asking for the quote alongside the
  // statement is not bureaucracy: it is the same standard the machine's
  // statements are held to, and a statement without a source cannot be checked
  // by anyone later.
  function addStatement(record) {
    const wrap = el("div", { className: "claim-add" });
    if (!state.addingTo || state.addingTo !== record.id) {
      const open = el("button", { className: "more" }, "Add a statement it missed");
      open.addEventListener("click", () => { state.addingTo = record.id; renderReview(); });
      wrap.append(open);
      return wrap;
    }

    const draft = state.draft || { text: "", quote: "", type: "finding" };
    state.draft = draft;

    wrap.append(el("p", { className: "section-label" }, "The statement"));
    const text = el("textarea", {
      placeholder: "One assertion, in one sentence. Split \u201cX is faster and cheaper\u201d into two.",
      value: draft.text,
    });
    text.addEventListener("input", () => { draft.text = text.value; refresh(); });

    wrap.append(text, el("p", { className: "section-label", style: "margin-top:14px" },
      "The sentence from the paper"));
    const quote = el("textarea", {
      placeholder: "Paste it word for word. A bot checks it against the source and rejects the "
                   + "submission if it is not there.",
      value: draft.quote,
    });
    quote.addEventListener("input", () => { draft.quote = quote.value; refresh(); });
    wrap.append(quote);

    wrap.append(el("p", { className: "section-label", style: "margin-top:14px" }, "What kind"));
    const kinds = el("div", { className: "chips" });
    Object.entries(CLAIM_KINDS).forEach(([value, [label, why]]) => {
      const chip = el("button", { className: "chip" });
      chip.setAttribute("aria-pressed", draft.type === value ? "true" : "false");
      chip.title = why;
      chip.append(el("span", { className: "t" }, label));
      chip.addEventListener("click", () => { draft.type = value; renderReview(); });
      kinds.append(chip);
    });
    wrap.append(kinds);

    const add = el("button", { className: "btn primary" }, "Add it");
    const cancel = el("button", { className: "btn" }, "Cancel");
    const row = el("div", { className: "actions" }, [add, cancel]);
    const refresh = () => {
      add.disabled = draft.text.trim().length < 10 || draft.quote.trim().length < 15;
    };
    add.addEventListener("click", () => {
      (state.newClaims[record.id] = state.newClaims[record.id] || []).push({
        text: draft.text.trim(), quote: draft.quote.trim(), type: draft.type, on: today(),
      });
      state.draft = null; state.addingTo = null;
      save(); renderReview(); renderTree();
    });
    cancel.addEventListener("click", () => {
      state.draft = null; state.addingTo = null; renderReview();
    });
    wrap.append(row);
    refresh();
    return wrap;
  }

  const today = () => new Date().toISOString().slice(0, 10);

  function commit(record, topics, verdict) {
    const entry = { topics, verdict, on: new Date().toISOString().slice(0, 10) };
    if (state.unsure) entry.unsure = true;
    if (state.note.trim()) entry.note = state.note.trim();
    state.decisions[record.id] = entry;
    // Pin the view to this record. Adding removes it from the queue, so
    // without this the page would slide to the next one — which is the
    // auto-advance this flow exists to avoid.
    state.viewing = record.id;
    save(); renderReview(); renderTree();
  }

  // The queue holds unfiled records; `viewing` lets someone step back onto one
  // they have already added, so a decision can be changed before it is sent.
  function currentRecord() {
    if (state.viewing) {
      const found = DATA.records.find(r => r.id === state.viewing);
      if (found) return found;
    }
    const pending = queue();
    return pending.length ? pending[Math.min(state.cursor, pending.length - 1)] : null;
  }

  function openRecord(record) {
    state.viewing = record.id;
    const filed = state.decisions[record.id];
    state.picked = new Set(filed ? filed.topics : []);
    state.unsure = !!(filed && filed.unsure);
    state.note = (filed && filed.note) || "";
    state.noteOpen = !!state.note;
    state.showAll = false;
    renderReview(); renderTree();
  }

  function advance() {
    state.viewing = null;
    state.picked.clear();
    state.note = ""; state.noteOpen = false; state.unsure = false; state.showAll = false;
    renderReview(); renderTree();
  }

  // ---- explore -----------------------------------------------------------
  function renderExplore() {
    const stage = document.getElementById("stage");
    stage.textContent = "";
    const code = state.focusTopic;

    if (state.author) {
      const wanted = samePerson(state.author);
      const theirs = DATA.records.filter(r =>
        (r.authors || []).some(a => samePerson(a) === wanted));
      stage.append(
        el("div", { className: "kicker" }, [el("span", {}, "author")]),
        el("h1", { className: "record-title" }, state.author),
        el("p", { className: "section-label" },
          `${theirs.length} record${theirs.length === 1 ? "" : "s"} in the library`),
      );
      theirs.forEach(r => {
        const item = el("div", { className: "explore-item" });
        item.append(
          el("div", {}, [
            r.url ? el("h4", {}, el("a", { href: r.url, target: "_blank", rel: "noopener" }, r.title))
                  : el("h4", {}, r.title),
            el("div", { className: "meta" },
               [r.date, (r.current || []).join(", ")].filter(Boolean).join(" · ")),
          ]),
          reviewCell(r),
        );
        stage.append(item);
      });
      const back = el("button", { className: "btn" }, "← Back to the tree");
      back.title = "Stop filtering by this author. Nothing about the records changes.";
      back.addEventListener("click", () => { state.author = null; renderStage(); });
      stage.append(el("div", { className: "actions" }, [
        back,
        el("span", { className: "hint" }, "nothing here can be edited or removed"),
      ]));
      return;
    }

    if (!code) {
      stage.append(
        el("h1", { className: "record-title" }, "Browse the tree"),
        el("p", { className: "abstract" },
          "Pick a topic on the left to see what the library holds under it. File the records "
          + "you know, add ones it is missing, and say so if a branch itself should change."),
        el("p", { className: "empty" },
          "When you are done, Submit opens a GitHub issue — a bot checks it and turns it into "
          + "a pull request against the library."),
      );
      return;
    }

    const topic = TOPICS.get(code);
    stage.append(
      el("div", { className: "kicker" }, [el("span", {}, code), el("span", {}, trailOf(code) || "top level")]),
      el("h1", { className: "record-title" }, topic.title),
    );
    if (topic.points.length) {
      stage.append(el("p", { className: "abstract" }, topic.points.join(" · ")));
    }
    if (topic.coding) {
      stage.append(el("p", { className: "byline" },
        "Part of the failure coding scheme — an incident normally carries several of these at once."));
    }

    const under = DATA.records.filter(r => {
      const filed = state.decisions[r.id];
      const tags = filed ? filed.topics : r.current;
      return tags.some(t => t === code || t.startsWith(code + "."));
    });

    stage.append(el("p", { className: "section-label" }, `${under.length} record${under.length === 1 ? "" : "s"} here`));
    if (!under.length) {
      stage.append(el("p", { className: "empty" }, [
        el("strong", {}, "Nothing filed here yet. "),
        "That is a finding worth publishing, not a hole to fill — unless the library holds something that belongs and nobody has filed it.",
      ]));
      return;
    }
    under.forEach(r => {
      const item = el("div", { className: "explore-item" });
      const heading = r.url
        ? el("h4", {}, el("a", { href: r.url, target: "_blank", rel: "noopener" }, r.title))
        : el("h4", {}, r.title);
      item.append(
        el("div", {}, [heading, el("div", { className: "meta" },
          [r.authors.slice(0, 3).join(", "), r.date].filter(Boolean).join(" · "))]),
        reviewCell(r),
      );
      stage.append(item);
    });

    stage.append(proposalForm(topic));
  }

  // ---- propose a change to the taxonomy ----------------------------------
  const PROPOSALS = [
    {
      key: "alias",
      label: "A name people search for that this topic does not answer to",
      hint: "The cheapest fix and usually the right one. The topic exists; it is just not "
            + "findable under the words you reached for.",
      ask: "Which words should find it?",
      placeholder: "steganographic collusion, covert signalling",
    },
    {
      key: "crosslink",
      label: "A link between this topic and another",
      hint: "For a relationship the tree cannot hold, because a topic has one parent and "
            + "the field does not work that way.",
      ask: "Which topic should it link to, and what is the relationship?",
      placeholder: "11.6.2 — this is the design question, that is what shows up in incidents",
    },
    {
      key: "child",
      label: "A missing topic that would sit under this one",
      hint: "Only once an alias and a cross-link have both been ruled out. A new code is "
            + "permanent — nothing is ever renumbered or reused.",
      ask: "What would it be called, and what belongs under it that has nowhere to go?",
      placeholder: "Information-flow control for agent data access — every child of 2.2 governs "
                   + "what an agent may reach, none governs what happens to data once it has it",
    },
    {
      key: "wrong",
      label: "This topic is wrong, misnamed, or in the wrong place",
      hint: "Say what it should be instead.",
      ask: "What is wrong with it?",
      placeholder: "",
    },
  ];

  function proposalForm(topic) {
    const wrap = el("div", { className: "ask", style: "margin-top:30px" });
    wrap.append(el("div", { className: "prompt" }, [
      el("span", { className: "step" }, "optional"),
      el("strong", {}, `Should “${topic.title}” itself change?`),
      info(`Topic ${topic.code}. The taxonomy is a seed, not scripture — but its codes are `
           + "stable identifiers that other people's tags point at. Try the cheapest fix "
           + "first: an alias, then a cross-link, then a new topic. Most gaps turn out to "
           + "be findability problems."),
    ]));

    const state_ = { kind: "", detail: "", why: "" };
    const detail = el("div", { style: "display:none;margin-top:16px" });
    const send = el("div", { className: "actions", style: "display:none;margin-top:16px" });

    const choices = el("div", { className: "chips" });
    PROPOSALS.forEach(option => {
      const chip = el("button", { className: "chip", style: "max-width:100%" });
      chip.setAttribute("aria-pressed", "false");
      chip.append(el("span", { className: "t" }, option.label));
      chip.title = option.hint;
      chip.addEventListener("click", () => {
        state_.kind = option.key;
        [...choices.children].forEach(c => c.setAttribute("aria-pressed", "false"));
        chip.setAttribute("aria-pressed", "true");
        detail.textContent = "";
        detail.append(el("p", { className: "section-label" }, option.ask));
        const area = el("textarea", { placeholder: option.placeholder });
        area.addEventListener("input", () => { state_.detail = area.value; refresh(); });
        detail.append(area, el("span",
          { className: "why", style: "color:var(--faint);font-size:12px" }, option.hint));
        detail.style.display = "";
        refresh();
      });
      choices.append(chip);
    });
    wrap.append(choices, detail);

    const refresh = () => {
      const ready = state_.kind && state_.detail.trim().length > 15;
      send.style.display = ready ? "" : "none";
      if (!ready) return;
      const option = PROPOSALS.find(o => o.key === state_.kind);
      const title = `[Taxonomy] ${topic.code} — ${option.key}`;
      fillSend(send, title, () => [
        issueButton("Open an issue with this proposal", title,
          [`**Topic:** ${topic.code} ${topic.title}`,
           `**Kind of change:** ${option.label}`, "",
           `**${option.ask}**`, "", state_.detail, "",
           "_Proposed from the filing site while browsing this branch._"].join("\n"),
          "taxonomy"),
        el("span", { className: "hint" }, "opens GitHub — you will be asked to sign in"),
      ]);
    };
    wrap.append(send);
    return wrap;
  }

  // ---- add something to the library -------------------------------------
  // The identifier drives everything. Paste it and the form works out what it
  // is looking at: something already held, a paper it can resolve, or a thing
  // with no scholarly identity at all — a tool or a deployment — which needs a
  // different set of questions. Nothing else opens until that is settled,
  // because every later field depends on the answer.

  // Mirrors ao_commons_kg.classify over the index baked in above. Only ever
  // used to suggest topics for a paper the corpus does not hold yet, and the
  // person adding it confirms or changes every one.
  const IX = DATA.index;
  const TERM_ID = new Map(IX.terms.map((t, i) => [t, i]));
  const STOP = new Set(("a an and are as at be by for from has in is it its of on or that the to with "
    + "these those their they this which while when where what who whom how why "
    + "agent agents agentic ai artificial intelligence machine system systems").split(" "));

  function tokens(text) {
    return (String(text || "").toLowerCase().match(/[a-z0-9]+/g) || [])
      .filter(w => w.length > 2 && !STOP.has(w));
  }

  function suggestTopics(text, limit) {
    const query = [...new Set(tokens(text).map(w => TERM_ID.get(w)).filter(id => id !== undefined))];
    if (!query.length) return [];
    const K1 = 1.2, B = 0.6;

    const scored = IX.topics.map((doc, i) => {
      const counts = new Map();
      doc.forEach(id => counts.set(id, (counts.get(id) || 0) + 1));
      const length = IX.lengths[i] || 1;
      let total = 0;
      query.forEach(id => {
        const frequency = counts.get(id);
        if (!frequency) return;
        total += (IX.idf[id] || 0) * (frequency * (K1 + 1))
          / (frequency + K1 * (1 - B + B * length / IX.averageLength));
      });
      return { code: DATA.topics[i].code, score: total };
    }).filter(x => x.score > 0).sort((a, b) => b.score - a.score);

    // Drop a parent when one of its own descendants also matched — the leaf
    // already implies it, and both would just take up a slot.
    const chosen = new Set(scored.slice(0, limit * 3).map(x => x.code));
    return scored
      .filter(x => ![...chosen].some(c => c !== x.code && c.startsWith(x.code + ".")))
      .slice(0, limit)
      .map(x => x.code);
  }

  const DOI = /^10\.\d{4,9}\/\S+$/;
  const ARXIV = /^\d{4}\.\d{4,5}(v\d+)?$/;

  function readIdentifier(raw) {
    const value = (raw || "").trim().replace(/^https?:\/\/(dx\.)?doi\.org\//i, "");
    if (!value) return { kind: "empty" };

    const arxivInUrl = value.match(/arxiv\.org\/(?:abs|pdf|html)\/(\d{4}\.\d{4,5})/i);
    if (arxivInUrl) return { kind: "paper", arxiv: arxivInUrl[1].toLowerCase(), label: arxivInUrl[1] };
    if (ARXIV.test(value)) return { kind: "paper", arxiv: value.split("v")[0].toLowerCase(), label: value };
    if (DOI.test(value)) return { kind: "paper", doi: value.toLowerCase(), label: value };

    const doiInUrl = value.match(/(10\.\d{4,9}\/\S+)/);
    if (doiInUrl) return { kind: "paper", doi: doiInUrl[1].toLowerCase(), label: doiInUrl[1] };

    if (/^(https?:\/\/|www\.)/i.test(value) || /^[\w-]+\.[\w.-]+\/?/.test(value)) {
      return { kind: "thing", url: value.startsWith("http") ? value : "https://" + value, label: value };
    }
    return { kind: "unclear", label: value };
  }

  // Two sources, in order, because one is not enough. OpenAlex does not hold
  // recent preprints — a paper posted this month answers 404, which the page
  // used to report as "could not reach OpenAlex", describing a network fault
  // that had not happened. Semantic Scholar has them and sends
  // `Access-Control-Allow-Origin: *`, so a page can ask it.
  //
  // arXiv itself would be better still and cannot be used here: it sends no
  // CORS header at all. The intake bot reads it server-side, which is why a
  // paper this form cannot resolve is still added correctly.

  function fromOpenAlex(id) {
    const key = id.doi ? `https://doi.org/${id.doi}` : `https://doi.org/10.48550/arXiv.${id.arxiv}`;
    return fetch(`https://api.openalex.org/works/${key}`
                 + "?select=title,abstract_inverted_index,authorships,publication_date"
                 + "&mailto=anke@stellar.org")
      .then(response => (response.ok ? response.json() : null))
      .then(work => {
        if (!work || !work.title) return null;
        let abstract = "";
