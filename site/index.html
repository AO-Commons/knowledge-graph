          } else {
            entry.draft = area.value;
          }
          retag(claim, area.value);
          save();
          renderTags();
          refreshConfirm();
        });
        card.append(el("div", { className: "note" }, area));

        // Tags follow the words. A statement edited from reputation to
        // sanctions is about something else now, and leaving the old tag on
        // it would connect it to the wrong statements — quietly, since a
        // wrong link looks exactly like a right one.
        const tagHost = el("div", { className: "concepts" });
        const renderTags = () => {
          tagHost.textContent = "";
          const current = (state.claims[claim.id] || {}).concepts || claim.concepts || [];
          const added = (state.claims[claim.id] || {}).suggested || [];
          tagHost.append(el("span", { className: "retag-label" },
            "tags, checked again on the pull request:"));
          current.forEach(id => {
            const concept = (DATA.concepts || {})[id] || { label: id };
            tagHost.append(el("span", {
              className: added.includes(id) ? "concept still added" : "concept still",
              title: added.includes(id) ? "suggested by your wording" : "from the extraction",
            }, concept.label));
          });
          if (!current.length) tagHost.append(el("span", { className: "hint" }, "none match"));
        };
        renderTags();
        card.append(tagHost);

        // Confirm, and a way back. Until confirmed the statement is not
        // counted as judged — the count at the top of the screen should not
        // tell somebody they are finished with a sentence they are still
        // halfway through rewriting.
        const confirm = el("button", { className: "btn primary small" }, "Confirm wording");
        const revert = el("button", { className: "btn small" }, "Back to original");
        const state_ = () => state.claims[claim.id] || {};
        function refreshConfirm() {
          const entry = state_();
          const committed = entry.text !== undefined ? entry.text.trim() : null;
          const draft = (entry.draft !== undefined ? entry.draft
                       : (committed !== null ? committed : claim.text)).trim();
          const settled = committed !== null && entry.draft === undefined;
          // Confirming the sentence exactly as extracted is not an
          // adjustment — it is "Add as is" reached the long way round, and
          // filing it as an adjustment would put a reviewer's name on a
          // rewording nobody did.
          const unchanged = committed === null && draft === (claim.text || "").trim();
          confirm.disabled = settled || unchanged || draft.length < 15 || draft === committed;
          confirm.textContent = settled ? "Confirmed"
            : unchanged ? "Unchanged — use Add as is"
            : "Confirm wording";
        }
        confirm.addEventListener("click", () => {
          const entry = state.claims[claim.id];
          entry.text = (entry.draft !== undefined ? entry.draft : entry.text).trim();
          delete entry.draft;
          retag(claim, entry.text);
          verdictChanged();
        });
        revert.addEventListener("click", () => {
          delete state.claims[claim.id];
          verdictChanged();
        });
        refreshConfirm();
        card.append(el("div", { className: "actions confirm-row" }, [confirm, revert]));
      } else if (mine && mine.verdict === "not-in-source") {
        const area = el("textarea", {
          placeholder: "Optional: what is wrong with it? One line is what an extractor "
                       + "can be fixed against.",
          value: mine.note || "",
        });
        area.addEventListener("input", () => {
          state.claims[claim.id].note = area.value; save();
        });
        card.append(el("div", { className: "note" }, area));
      }
      wrap.append(card);
      });
    });

    mine(record).forEach((entry, index) => {
      const card = el("div", { className: "claim mine" });
      card.append(el("div", { className: "kicker" }, [
        el("span", {}, entry.type), el("span", {}, "yours, not yet sent"),
      ]));
      card.append(el("p", { className: "claim-text" }, entry.text));
      card.append(el("blockquote", { className: "claim-quote" }, "“" + entry.quote + "”"));
      const drop = el("button", { className: "more" }, "Remove this one");
      drop.addEventListener("click", () => {
        state.newClaims[record.id].splice(index, 1);
        if (!state.newClaims[record.id].length) delete state.newClaims[record.id];
        save(); renderReview(); renderTree();
      });
      card.append(drop);
      wrap.append(card);
    });

    wrap.append(addStatement(record));
    wrap.append(el("p", { className: "hint" },
      done
        ? `${done} of ${total} done — they travel with your filing.`
        : "These go in the same submission as your topics."));
    return wrap;
  }

  const mine = record => state.newClaims[record.id] || [];

  // The extractor misses things, and the person who has just read the paper is
  // the only one positioned to notice. Asking for the quote alongside the
  // statement is not bureaucracy: it is the same standard the machine's
  // statements are held to, and a statement without a source cannot be checked
  // by anyone later.
  function addStatement(record) {
    const wrap = el("div", { className: "claim-add" });
    if (!state.addingTo || state.addingTo !== record.id) {
      const open = el("button", { className: "more" }, "Add a statement it missed");
      open.addEventListener("click", () => { state.addingTo = record.id; renderReview(); });
      wrap.append(open);
      return wrap;
    }

    const draft = state.draft || { text: "", quote: "", type: "finding" };
    state.draft = draft;

    wrap.append(el("p", { className: "section-label" }, "The statement"));
    const text = el("textarea", {
      placeholder: "One assertion, in one sentence. Split \u201cX is faster and cheaper\u201d into two.",
      value: draft.text,
    });
    text.addEventListener("input", () => { draft.text = text.value; refresh(); });

    wrap.append(text, el("p", { className: "section-label", style: "margin-top:14px" },
      "The sentence from the paper"));
    const quote = el("textarea", {
      placeholder: "Paste it word for word. A bot checks it against the source and rejects the "
                   + "submission if it is not there.",
      value: draft.quote,
    });
    quote.addEventListener("input", () => { draft.quote = quote.value; refresh(); });
    wrap.append(quote);

    wrap.append(el("p", { className: "section-label", style: "margin-top:14px" }, "What kind"));
    const kinds = el("div", { className: "chips" });
    Object.entries(CLAIM_KINDS).forEach(([value, [label, why]]) => {
      const chip = el("button", { className: "chip" });
      chip.setAttribute("aria-pressed", draft.type === value ? "true" : "false");
      chip.title = why;
      chip.append(el("span", { className: "t" }, label));
      chip.addEventListener("click", () => { draft.type = value; renderReview(); });
      kinds.append(chip);
    });
    wrap.append(kinds);

    const add = el("button", { className: "btn primary" }, "Add it");
    const cancel = el("button", { className: "btn" }, "Cancel");
    const row = el("div", { className: "actions" }, [add, cancel]);
    const refresh = () => {
      add.disabled = draft.text.trim().length < 10 || draft.quote.trim().length < 15;
    };
    add.addEventListener("click", () => {
      (state.newClaims[record.id] = state.newClaims[record.id] || []).push({
        text: draft.text.trim(), quote: draft.quote.trim(), type: draft.type, on: today(),
      });
      state.draft = null; state.addingTo = null;
      save(); renderReview(); renderTree();
    });
    cancel.addEventListener("click", () => {
      state.draft = null; state.addingTo = null; renderReview();
    });
    wrap.append(row);
    refresh();
    return wrap;
  }

  const today = () => new Date().toISOString().slice(0, 10);

  function commit(record, topics, verdict) {
    const entry = { topics, verdict, on: new Date().toISOString().slice(0, 10) };
    if (state.unsure) entry.unsure = true;
    if (state.note.trim()) entry.note = state.note.trim();
    state.decisions[record.id] = entry;
    // Pin the view to this record. Adding removes it from the queue, so
    // without this the page would slide to the next one — which is the
    // auto-advance this flow exists to avoid.
    state.viewing = record.id;
    save(); renderReview(); renderTree();
  }

  // The queue holds unfiled records; `viewing` lets someone step back onto one
  // they have already added, so a decision can be changed before it is sent.
  function currentRecord() {
    if (state.viewing) {
      const found = DATA.records.find(r => r.id === state.viewing);
      if (found) return found;
    }
    const pending = queue();
    return pending.length ? pending[Math.min(state.cursor, pending.length - 1)] : null;
  }

  function openRecord(record) {
    state.viewing = record.id;
    const filed = state.decisions[record.id];
    state.picked = new Set(filed ? filed.topics : []);
    state.unsure = !!(filed && filed.unsure);
    state.note = (filed && filed.note) || "";
    state.noteOpen = !!state.note;
    state.showAll = false;
    renderReview(); renderTree();
  }

  function advance() {
    state.viewing = null;
    state.picked.clear();
    state.note = ""; state.noteOpen = false; state.unsure = false; state.showAll = false;
    renderReview(); renderTree();
  }

  // ---- explore -----------------------------------------------------------
  function renderExplore() {
    const stage = document.getElementById("stage");
    stage.textContent = "";
    const code = state.focusTopic;

    if (state.author) {
      const wanted = samePerson(state.author);
      const theirs = DATA.records.filter(r =>
        (r.authors || []).some(a => samePerson(a) === wanted));
      stage.append(
        el("div", { className: "kicker" }, [el("span", {}, "author")]),
        el("h1", { className: "record-title" }, state.author),
        el("p", { className: "section-label" },
          `${theirs.length} record${theirs.length === 1 ? "" : "s"} in the library`),
      );
      theirs.forEach(r => {
        const item = el("div", { className: "explore-item" });
        item.append(
          el("div", {}, [
            r.url ? el("h4", {}, el("a", { href: r.url, target: "_blank", rel: "noopener" }, r.title))
                  : el("h4", {}, r.title),
            el("div", { className: "meta" },
               [r.date, (r.current || []).join(", ")].filter(Boolean).join(" · ")),
          ]),
          reviewCell(r),
        );
        stage.append(item);
      });
      const back = el("button", { className: "btn" }, "← Back to the tree");
      back.title = "Stop filtering by this author. Nothing about the records changes.";
      back.addEventListener("click", () => { state.author = null; renderStage(); });
      stage.append(el("div", { className: "actions" }, [
        back,
        el("span", { className: "hint" }, "nothing here can be edited or removed"),
      ]));
      return;
    }

    if (!code) {
      stage.append(
        el("h1", { className: "record-title" }, "Browse the tree"),
        el("p", { className: "abstract" },
          "Pick a topic on the left to see what the library holds under it. File the records "
          + "you know, add ones it is missing, and say so if a branch itself should change."),
        el("p", { className: "empty" },
          "When you are done, Submit opens a GitHub issue — a bot checks it and turns it into "
          + "a pull request against the library."),
      );
      return;
    }

    const topic = TOPICS.get(code);
    stage.append(
      el("div", { className: "kicker" }, [el("span", {}, code), el("span", {}, trailOf(code) || "top level")]),
      el("h1", { className: "record-title" }, topic.title),
    );
    if (topic.points.length) {
      stage.append(el("p", { className: "abstract" }, topic.points.join(" · ")));
    }
    if (topic.coding) {
      stage.append(el("p", { className: "byline" },
        "Part of the failure coding scheme — an incident normally carries several of these at once."));
    }

    const under = DATA.records.filter(r => {
      const filed = state.decisions[r.id];
      const tags = filed ? filed.topics : r.current;
      return tags.some(t => t === code || t.startsWith(code + "."));
    });

    stage.append(el("p", { className: "section-label" }, `${under.length} record${under.length === 1 ? "" : "s"} here`));
    if (!under.length) {
      stage.append(el("p", { className: "empty" }, [
        el("strong", {}, "Nothing filed here yet. "),
        "That is a finding worth publishing, not a hole to fill — unless the library holds something that belongs and nobody has filed it.",
      ]));
      return;
    }
    under.forEach(r => {
      const item = el("div", { className: "explore-item" });
      const heading = r.url
        ? el("h4", {}, el("a", { href: r.url, target: "_blank", rel: "noopener" }, r.title))
        : el("h4", {}, r.title);
      // A deployment, a tool and a paper are different kinds of answer to
      // "what does this branch hold", and they looked identical here.
      const meta = [r.type.replace(/-/g, " "),
                    r.authors.slice(0, 3).join(", "), r.date].filter(Boolean).join(" · ");
      const left = el("div", {}, [heading, el("div", { className: "meta" }, meta)]);
      const profile = toolProfile(r);
      if (profile) left.append(profile);
      item.append(left, reviewCell(r));
      stage.append(item);
    });

    stage.append(proposalForm(topic));
  }

  // ---- propose a change to the taxonomy ----------------------------------
  const PROPOSALS = [
    {
      key: "alias",
      label: "A name people search for that this topic does not answer to",
      hint: "The cheapest fix and usually the right one. The topic exists; it is just not "
            + "findable under the words you reached for.",
      ask: "Which words should find it?",
      placeholder: "steganographic collusion, covert signaling",
    },
    {
      key: "crosslink",
      label: "A link between this topic and another",
      hint: "For a relationship the tree cannot hold, because a topic has one parent and "
            + "the field does not work that way.",
      ask: "Which topic should it link to, and what is the relationship?",
      placeholder: "11.6.2 — this is the design question, that is what shows up in incidents",
    },
    {
      key: "child",
      label: "A missing topic that would sit under this one",
      hint: "Only once an alias and a cross-link have both been ruled out. A new code is "
            + "permanent — nothing is ever renumbered or reused.",
      ask: "What would it be called, and what belongs under it that has nowhere to go?",
      placeholder: "Information-flow control for agent data access — every child of 2.2 governs "
                   + "what an agent may reach, none governs what happens to data once it has it",
    },
    {
      key: "wrong",
      label: "This topic is wrong, misnamed, or in the wrong place",
      hint: "Say what it should be instead.",
      ask: "What is wrong with it?",
      placeholder: "",
    },
  ];

  function proposalForm(topic) {
    const wrap = el("div", { className: "ask", style: "margin-top:30px" });
    wrap.append(el("div", { className: "prompt" }, [
      el("span", { className: "step" }, "optional"),
      el("strong", {}, `Should “${topic.title}” itself change?`),
      info(`Topic ${topic.code}. The taxonomy is a seed, not scripture — but its codes are `
           + "stable identifiers that other people's tags point at. Try the cheapest fix "
           + "first: an alias, then a cross-link, then a new topic. Most gaps turn out to "
           + "be findability problems."),
    ]));

    const state_ = { kind: "", detail: "", why: "" };
    const detail = el("div", { style: "display:none;margin-top:16px" });
    const send = el("div", { className: "actions", style: "display:none;margin-top:16px" });

    const choices = el("div", { className: "chips" });
    PROPOSALS.forEach(option => {
      const chip = el("button", { className: "chip", style: "max-width:100%" });
      chip.setAttribute("aria-pressed", "false");
      chip.append(el("span", { className: "t" }, option.label));
      chip.title = option.hint;
      chip.addEventListener("click", () => {
        state_.kind = option.key;
        [...choices.children].forEach(c => c.setAttribute("aria-pressed", "false"));
        chip.setAttribute("aria-pressed", "true");
        detail.textContent = "";
        detail.append(el("p", { className: "section-label" }, option.ask));
        const area = el("textarea", { placeholder: option.placeholder });
        area.addEventListener("input", () => { state_.detail = area.value; refresh(); });
        detail.append(area, el("span",
          { className: "why", style: "color:var(--faint);font-size:12px" }, option.hint));
        detail.style.display = "";
        refresh();
      });
      choices.append(chip);
    });
    wrap.append(choices, detail);

    const refresh = () => {
      const ready = state_.kind && state_.detail.trim().length > 15;
      send.style.display = ready ? "" : "none";
      if (!ready) return;
      const option = PROPOSALS.find(o => o.key === state_.kind);
      const title = `[Taxonomy] ${topic.code} — ${option.key}`;
      fillSend(send, title, () => [
        issueButton("Open an issue with this proposal", title,
          [`**Topic:** ${topic.code} ${topic.title}`,
           `**Kind of change:** ${option.label}`, "",
           `**${option.ask}**`, "", state_.detail, "",
           "_Proposed from the filing site while browsing this branch._"].join("\n"),
          "taxonomy"),
        el("span", { className: "hint" }, "opens GitHub — you will be asked to sign in"),
      ]);
    };
    wrap.append(send);
    return wrap;
  }

  // ---- add something to the library -------------------------------------
  // The identifier drives everything. Paste it and the form works out what it
  // is looking at: something already held, a paper it can resolve, or a thing
  // with no scholarly identity at all — a tool or a deployment — which needs a
  // different set of questions. Nothing else opens until that is settled,
  // because every later field depends on the answer.

  // Mirrors ao_commons_kg.classify over the index baked in above. Only ever
  // used to suggest topics for a paper the corpus does not hold yet, and the
  // person adding it confirms or changes every one.
  // Fetched the first time the Add tab is opened, not on arrival. Everyone
  // else was parsing a search index they would never use.
  let IX = null, TERM_ID = null, indexWanted = false;

  function loadIndex() {
    if (indexWanted) return;
    indexWanted = true;
    fetch("classifier.json")
      .then(response => (response.ok ? response.json() : null))
      .then(payload => {
        if (!payload) return;
        IX = payload;
        TERM_ID = new Map(IX.terms.map((term, i) => [term, i]));
        if (state.mode === "add") renderAdd();
      })
      .catch(() => { /* the form still works; it just cannot suggest */ });
  }
  // Every constant here comes from ao_commons_kg.classify, injected at build
  // time. The scoring formula is still written twice, and has to be: this
  // scores a paper that is not in the corpus yet, which is the one thing the
  // server cannot precompute. What is no longer written twice is anything a
  // person could quietly change on one side only.
  const SCORING = DATA.scoring;
  const STOP = new Set(SCORING.stop);
  const WORD = new RegExp(SCORING.word, "g");

  function stem(word) {
    for (const suffix of SCORING.suffixes) {
      if (word.endsWith(suffix) && word.length - suffix.length >= 4) {
        return word.slice(0, -suffix.length);
      }
    }
    return word;
  }

  function tokens(text) {
    const words = (String(text || "").toLowerCase().match(WORD) || [])
      .filter(w => w.length > 2 && !STOP.has(w))
      .map(stem);
    return words.concat(words.slice(0, -1).map((w, i) => `${w}_${words[i + 1]}`));
  }

  function suggestTopics(text, limit) {
    if (!IX) return [];
    const query = [...new Set(tokens(text).map(w => TERM_ID.get(w)).filter(id => id !== undefined))];
    if (!query.length) return [];
    const K1 = SCORING.k1, B = SCORING.b;

    const scored = IX.topics.map((doc, i) => {
      const counts = new Map();
      doc.forEach(id => counts.set(id, (counts.get(id) || 0) + 1));
      const length = IX.lengths[i] || 1;
      let total = 0;
      query.forEach(id => {
        const frequency = counts.get(id);
        if (!frequency) return;
        total += (IX.idf[id] || 0) * (frequency * (K1 + 1))
          / (frequency + K1 * (1 - B + B * length / IX.averageLength));
      });
      return { code: DATA.topics[i].code, score: total };
    }).filter(x => x.score > 0).sort((a, b) => b.score - a.score);

    // Drop a parent when one of its own descendants also matched — the leaf
    // already implies it, and both would just take up a slot.
    const chosen = new Set(scored.slice(0, limit * 3).map(x => x.code));
    return scored
      .filter(x => ![...chosen].some(c => c !== x.code && c.startsWith(x.code + ".")))
      .slice(0, limit)
      .map(x => x.code);
  }

  const DOI = /^10\.\d{4,9}\/\S+$/;
  const ARXIV = /^\d{4}\.\d{4,5}(v\d+)?$/;

  function readIdentifier(raw) {
    const value = (raw || "").trim().replace(/^https?:\/\/(dx\.)?doi\.org\//i, "");
    if (!value) return { kind: "empty" };

    const arxivInUrl = value.match(/arxiv\.org\/(?:abs|pdf|html)\/(\d{4}\.\d{4,5})/i);
    if (arxivInUrl) return { kind: "paper", arxiv: arxivInUrl[1].toLowerCase(), label: arxivInUrl[1] };
    if (ARXIV.test(value)) return { kind: "paper", arxiv: value.split("v")[0].toLowerCase(), label: value };
    if (DOI.test(value)) return { kind: "paper", doi: value.toLowerCase(), label: value };

    const doiInUrl = value.match(/(10\.\d{4,9}\/\S+)/);
    if (doiInUrl) return { kind: "paper", doi: doiInUrl[1].toLowerCase(), label: doiInUrl[1] };

    if (/^(https?:\/\/|www\.)/i.test(value) || /^[\w-]+\.[\w.-]+\/?/.test(value)) {
      return { kind: "thing", url: value.startsWith("http") ? value : "https://" + value, label: value };
    }
    return { kind: "unclear", label: value };
  }

  // Two sources, in order, because one is not enough. OpenAlex does not hold
  // recent preprints — a paper posted this month answers 404, which the page
  // used to report as "could not reach OpenAlex", describing a network fault
  // that had not happened. Semantic Scholar has them and sends
  // `Access-Control-Allow-Origin: *`, so a page can ask it.
  //
  // arXiv itself would be better still and cannot be used here: it sends no
  // CORS header at all. The intake bot reads it server-side, which is why a
  // paper this form cannot resolve is still added correctly.

  function fromOpenAlex(id) {
    const key = id.doi ? `https://doi.org/${id.doi}` : `https://doi.org/10.48550/arXiv.${id.arxiv}`;
    return fetch(`https://api.openalex.org/works/${key}`
                 + "?select=title,abstract_inverted_index,authorships,publication_date"
                 + "&mailto=anke@stellar.org")
      .then(response => (response.ok ? response.json() : null))
      .then(work => {
        if (!work || !work.title) return null;
        let abstract = "";
        if (work.abstract_inverted_index) {
          const words = [];
          Object.entries(work.abstract_inverted_index).forEach(([word, spots]) =>
            spots.forEach(spot => { words[spot] = word; }));
          abstract = words.filter(Boolean).join(" ");
        }
        return {
          title: work.title,
          abstract,
          authors: (work.authorships || [])
            .map(a => a.author && a.author.display_name).filter(Boolean),
          source: "OpenAlex",
        };
      });
  }

  // DataCite holds arXiv's own DOI deposit, `10.48550/arXiv.<id>`, which is
  // arXiv's metadata by another route — and unlike arXiv's own API it reflects
  // the Origin header, so a page may read it. This is the reliable source for
  // exactly the papers OpenAlex has not indexed yet, which is the case that
  // sent people to a dead end.
  function fromDataCite(id) {
    const doi = id.doi || `10.48550/arXiv.${id.arxiv}`;
    return fetch(`https://api.datacite.org/dois/${encodeURIComponent(doi)}`)
      .then(response => (response.ok ? response.json() : null))
      .then(payload => {
        const work = payload && payload.data && payload.data.attributes;
        if (!work || !work.titles || !work.titles.length) return null;
        const abstract = (work.descriptions || [])
          .filter(d => d.descriptionType === "Abstract")
          .map(d => d.description)[0] || "";
        return {
          title: work.titles[0].title,
          abstract,
          // Given and family names are separate here; `name` arrives as
          // "Papadopoulos, Vassilis", which would enter the corpus backwards.
          authors: (work.creators || []).map(c =>
            c.givenName && c.familyName
              ? `${c.givenName} ${c.familyName}`
              : (c.name || "").split(",").map(part => part.trim()).reverse().join(" ")
          ).filter(Boolean),
          source: "DataCite",
        };
      });
  }

  // Crossref registers the DOIs of published papers, as DataCite registers
  // arXiv's. Between them they cover what a page is likely to be handed, and
  // both allow cross-origin reads.
  function fromCrossref(id) {
    if (!id.doi) return Promise.resolve(null);
    return fetch(`https://api.crossref.org/works/${encodeURIComponent(id.doi)}`
                 + "?mailto=anke@stellar.org")
      .then(response => (response.ok ? response.json() : null))
      .then(payload => {
        const work = payload && payload.message;
        if (!work || !work.title || !work.title.length) return null;
        return {
          title: work.title[0],
          // Crossref stores abstracts as JATS XML, tags and all.
          abstract: (work.abstract || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(),
          authors: (work.author || [])
            .map(a => [a.given, a.family].filter(Boolean).join(" ")).filter(Boolean),
          source: "Crossref",
        };
      });
  }

  function fromSemanticScholar(id) {
    const key = id.arxiv ? `arXiv:${id.arxiv}` : `DOI:${id.doi}`;
    return fetch(`https://api.semanticscholar.org/graph/v1/paper/${key}`
                 + "?fields=title,abstract,authors,publicationDate")
      .then(response => (response.ok ? response.json() : null))
      .then(paper => {
        if (!paper || !paper.title) return null;
        return {
          title: paper.title,
          abstract: paper.abstract || "",
          authors: (paper.authors || []).map(a => a.name).filter(Boolean),
          source: "Semantic Scholar",
        };
      });
  }

  function lookUp(id) {
    const settle = (found, why) => {
      if (state.add.id !== id) return;                 // a newer paste won
      state.add.looking = false;
      state.add.resolved = found || null;
      state.add.why = found ? "" : why;
      renderAdd();
    };

    // Three sources, cheapest and broadest first. Each only runs if the one
    // before it came back empty, so the common case is still a single request.
    let unavailable = false;
    const attempt = source => found =>
      found || source(id).catch(() => { unavailable = true; return null; });

    fromOpenAlex(id)
      .catch(() => null)
      .then(attempt(fromDataCite))
      .then(attempt(fromCrossref))
      // Semantic Scholar omits its CORS header on a 429, so a rate-limited
      // answer reaches the page as a network failure rather than a status.
      // "Did not answer" and "does not have it" are different facts, and the
      // page should not claim the second when it saw the first.
      .then(attempt(fromSemanticScholar))
      .then(found => settle(found, unavailable ? "unavailable" : "missing"))
      .catch(() => settle(null, "unavailable"));
  }

  function findExisting(id) {
    return DATA.records.find(r =>
      (id.doi && r.doi === id.doi)
      || (id.arxiv && r.arxiv === id.arxiv)
      || (id.url && (r.url === id.url || r.repo === id.url)));
  }

  function renderAdd() {
    const stage = document.getElementById("stage");
    stage.textContent = "";
    stage.append(el("h1", { className: "record-title" }, "Add to the library"));

    const ask = el("div", { className: "ask" });
    const box = el("input", {
      type: "text", value: state.add.raw,
      placeholder: "Paste a DOI, an arXiv id, or a link — then press Enter",
    });
    box.style.cssText = "font:inherit;width:100%;padding:11px 13px;border-radius:2px;"
      + "border:1px solid var(--rule-hard);background:var(--card);color:var(--ink)";
    box.addEventListener("input", () => { state.add.raw = box.value; });
    box.addEventListener("keydown", event => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      state.add.id = readIdentifier(box.value);
      state.add.fields = {};
      state.add.resolved = null;
      state.add.picked = new Set();
      state.add.extra = "";
      state.add.topics = false;
      state.add.looking = state.add.id.kind === "paper" && !findExisting(state.add.id);
      renderAdd();
      if (state.add.looking) lookUp(state.add.id);
      const next = document.querySelector(".ask input:not([type=text]), .ask textarea, .ask .btn");
      if (next && next.focus) next.focus();
    });
    ask.append(box);
    ask.append(el("span", { className: "why", style: "color:var(--faint);font-size:12px" },
      "A paper, a tool, a platform, a deployment — anything the library should hold."));

    // The one-at-a-time form is the wrong shape for a reading list, and
    // someone with twenty papers will otherwise either paste for an hour or
    // give up. The instructions are written for an agent to follow.
    ask.append(el("p", { className: "hint", style: "margin-top:10px" }, [
      "Have a lot of them? Point your agent at ",
      el("a", {
        href: "https://github.com/AO-Commons/knowledge-graph/blob/main/docs/bulk-add.md",
        target: "_blank", rel: "noopener",
      }, "docs/bulk-add.md"),
      " and it can add them in bulk as a pull request. Duplicates are skipped "
      + "and the original kept, the same as here.",
    ]));

    const id = state.add.id;
    if (id && id.kind !== "empty") ask.append(resolveStep(id));
    stage.append(ask);
    box.focus();
    box.setSelectionRange(box.value.length, box.value.length);
  }

  function fieldBlock(key, label, placeholder, hint, area) {
    const wrap = el("div", { style: "margin-top:16px" });
    wrap.dataset.field = key;
    wrap.append(el("p", { className: "section-label" }, label));
    const input = area ? el("textarea", { placeholder }) : el("input", { type: "text", placeholder });
    input.value = state.add.fields[key] || "";
    if (!area) {
      input.style.cssText = "font:inherit;width:100%;padding:9px 11px;border-radius:2px;"
        + "border:1px solid var(--rule-hard);background:var(--card);color:var(--ink)";
    }
    input.addEventListener("input", () => {
      state.add.fields[key] = input.value;
      gate();
    });
    wrap.append(input);
    if (hint) wrap.append(el("span", { className: "why", style: "color:var(--faint);font-size:12px" }, hint));
    return wrap;
  }

  // One place decides what is visible, so the rule for each step lives beside
  // the others instead of being scattered through render calls.
  let gate = () => {};

  function reveal(container, steps) {
    gate = () => {
      let unlocked = true;
      steps.forEach(step => {
        const node = container.querySelector(`[data-field="${step.key}"]`)
          || container.querySelector(`[data-step="${step.key}"]`);
        if (!node) return;
        const show = unlocked;
        node.style.display = show ? "" : "none";
        if (show && !step.satisfied()) unlocked = false;
      });
    };
    gate();
  }

  // ---- the trip to GitHub ------------------------------------------------
  // Opening an issue happens in a tab this page cannot see into, so on its own
  // the hand-off leaves no trace here: someone submits, comes back, and finds
  // the form exactly as they left it, with no way to tell whether it worked.
  //
  // So the hand-off is recorded on the way out and confirmed on the way back,
  // by finding the issue in the public list. The two are deliberately not shown
  // as the same thing. What this browser remembers is only that a link was
  // clicked — the person may have closed the GitHub tab without submitting.
  // The issue number is the proof, and nothing is treated as sent without it.

  function markSent(title, kind, records) {
    // A second attempt at the same thing replaces an unconfirmed first one;
    // a confirmed send is history and stays.
    state.sent = state.sent.filter(entry => entry.title !== title || entry.number);
    state.sent.unshift({
      title, kind, records: records || [], at: new Date().toISOString(),
      number: null, url: null,
    });
    save();
    // The next look at GitHub matters more than the last one did, so the
    // throttle starts from here rather than from a read taken before the trip.
    submissions.read = 0;
    // Redrawn on a timeout so the click's own navigation is not disturbed by
    // the button being replaced underneath it.
    setTimeout(renderStage, 0);
  }

  function sentFor(title) {
    return state.sent.find(entry => entry.title === title);
  }

  function confirmSends() {
    let changed = false;
    state.sent.forEach(pending => {
      if (pending.number) return;
      // Two minutes of slack: the browser's clock and GitHub's need not agree,
      // and a send confirmed by a stopped clock would be worse than a pending one.
      const since = Date.parse(pending.at) - 120000;
      const after = submissions.items.filter(issue => Date.parse(issue.createdAt) >= since);
      const sameKind = after.filter(issue => issue.kind === pending.kind);
      // The title as sent, or — if they edited it on GitHub — the one issue of
      // this kind that appeared since the click. Anything less certain than
      // that stays pending rather than claiming someone else's issue.
      const hit = after.find(issue => issue.title === pending.title)
        || (sameKind.length === 1 ? sameKind[0] : null);
      if (!hit) return;
      pending.number = hit.number;
      pending.url = hit.url;
      changed = true;
    });
    if (changed) save();
    return changed;
  }

  function sentNote(title) {
    const entry = sentFor(title);
    if (!entry) return null;

    if (entry.number) {
      return el("div", { className: "staged" }, [
        el("span", {}, [
          el("strong", {}, "Sent — "), "this is ",
          el("a", { href: entry.url, target: "_blank", rel: "noopener" }, `issue #${entry.number}`),
          ". A bot checks it and answers on the issue itself; you will be notified there.",
        ]),
      ]);
    }

    const wrap = el("div", {});
    wrap.append(el("div", { className: "staged" }, [
      el("span", {}, [
        el("strong", {}, "Opened on GitHub — not seen yet. "),
        "It appears here once GitHub lists it, usually within a few seconds of you "
        + "pressing Submit there. If you closed that tab without submitting, nothing "
        + "was recorded and the button below still works.",
      ]),
    ]));
    const again = el("button", { className: "btn", style: "margin-top:12px" }, "Check again");
    again.addEventListener("click", () => { loadSubmissions(true); again.textContent = "Checking…"; });
    wrap.append(el("div", { className: "actions" }, again));
    return wrap;
  }

  // Every place that hands off to GitHub draws the same way: the state of the
  // last attempt first, and the button only while pressing it would still add
  // something — once an issue exists, a second press just makes a duplicate.
  function fillSend(container, title, build) {
    container.textContent = "";
    const entry = sentFor(title);
    if (entry) container.append(sentNote(title));
    if (entry && entry.number) return;
    build().forEach(node => container.append(node));
  }

  function issueButton(label, title, body, labels, records) {
    const link = el("a", { className: "btn primary", target: "_blank", rel: "noopener" }, label);
    link.href = "https://github.com/AO-Commons/knowledge-graph/issues/new"
      + `?labels=${labels}`
      + "&title=" + encodeURIComponent(title)
      + "&body=" + encodeURIComponent(body.slice(0, 5200));
    link.addEventListener("click", () => markSent(title, labels, records));
    return link;
  }

  function resolveStep(id) {
    const held = findExisting(id);
    const block = el("div", { style: "margin-top:18px" });

    if (held) {
      block.append(el("div", { className: "staged" }, [
        el("span", {}, [el("strong", {}, "Already in the library — "), held.title]),
      ]));
      const open = el("button", { className: "btn primary", style: "margin-top:12px" },
        state.decisions[held.id] ? "Open it — you have already filed this" : "Open it and file it");
      open.addEventListener("click", () => { setMode("review"); openRecord(held); });
      block.append(open);
      return block;
    }

    if (id.kind === "unclear") {
      block.append(el("p", { className: "empty" },
        "That does not look like a DOI, an arXiv id, or a link. Paste one of those — "
        + "or the address of the tool's site if it has no paper."));
      return block;
    }

    const f = state.add.fields;

    if (id.kind === "paper") {
      const found = state.add.resolved;
      block.append(el("div", { className: "staged" }, [
        found
          ? el("span", {}, [el("strong", {}, "Found — "), found.title,
                            el("span", { className: "hint" }, ` via ${found.source}`)])
          : el("span", {}, [
              el("strong", {}, "New to the library. "),
              state.add.looking
                ? "Looking it up…"
                : [
                    state.add.why === "unavailable"
                      ? "OpenAlex, DataCite and Crossref do not have it, and Semantic Scholar "
                        + "did not answer — it rate-limits anonymous requests hard, so this "
                        + "happens."
                      : "None of OpenAlex, DataCite, Crossref or Semantic Scholar has it "
                        + "indexed.",
                    id.arxiv
                      ? " Add it anyway: the bot reads arXiv directly, which no page can, and "
                        + "fills in the title, authors and abstract when it runs."
                      : " Give it a title below and a maintainer will sort out the rest.",
                  ].join(""),
            ]),
      ]));

      if (found && found.abstract) {
        block.append(el("p", { className: "abstract", style: "margin-top:14px;font-size:15px" },
          found.abstract.slice(0, 460) + (found.abstract.length > 460 ? "…" : "")));
      }
      // Suggested from the abstract, for confirmation rather than authorship.
      // A person correcting five guesses is faster and more accurate than the
      // same person facing an empty box and 567 options.
      const suggested = found
        ? suggestTopics(`${found.title} ${found.abstract || ""}`, 8)
        : [];
      if (suggested.length) {
        const picker = el("div", { style: "margin-top:16px" });
        picker.dataset.field = "topics";
        picker.append(el("p", { className: "section-label" }, "Where does it belong?"));
        const chips = el("div", { className: "chips" });
        suggested.forEach((code, position) => {
          const topic = TOPICS.get(code);
          if (!topic) return;
          const chip = el("button", { className: "chip" });
          chip.setAttribute("aria-pressed", state.add.picked.has(code) ? "true" : "false");
          chip.title = trailOf(code) || topic.title;
          chip.append(el("span", { className: "c" }, code), el("span", { className: "t" }, topic.title));
          chip.addEventListener("click", () => {
            state.add.picked.has(code) ? state.add.picked.delete(code) : state.add.picked.add(code);
            chip.setAttribute("aria-pressed", state.add.picked.has(code) ? "true" : "false");
            state.add.fields.topics = [...state.add.picked,
              ...(state.add.extra || "").split(",").map(t => t.trim()).filter(Boolean)].join(", ");
            gate();
          });
          chips.append(chip);
        });
        state.add.topics = true;
        const extra = el("input", { type: "text", placeholder: "…or type codes it missed: 3.1, 3.2" });
        extra.style.cssText = "font:inherit;width:100%;margin-top:10px;padding:8px 11px;"
          + "border-radius:2px;border:1px solid var(--rule-hard);background:var(--card);color:var(--ink)";
        extra.addEventListener("input", () => {
          state.add.extra = extra.value;
          state.add.fields.topics = [...state.add.picked,
            ...extra.value.split(",").map(t => t.trim()).filter(Boolean)].join(", ");
          gate();
        });

        picker.append(chips, extra, el("span",
          { className: "why", style: "color:var(--faint);font-size:12px" },
          "Matched from the abstract, and nothing is ticked for you — this matcher finds "
          + "about a third of the right answers, so treat it as a shortlist rather than a "
          + "verdict. The tree on the left is searchable if none of these fit."));
        block.append(picker);
      } else {
        block.append(fieldBlock("topics", "Topics, if you know them", "2.2, 11.6",
          "Optional — codes from the tree on the left."));
      }

      block.append(fieldBlock("why", "Anything a reviewer should know",
        "Optional. Why it matters, or what nearly fits but does not.",
        "The scope test still applies: agents must hold real operational or decision "
        + "authority in whatever it describes.", true));

      const send = el("div", { className: "actions", style: "margin-top:16px" });
      send.dataset.step = "send";
      const rebuild = () => {
        const title = `[Add] ${(state.add.resolved && state.add.resolved.title) || id.label}`;
        fillSend(send, title, () => [
          issueButton("Open an issue to add it", title,
            [`**Identifier:** ${id.label}`,
             `**Title:** ${(state.add.resolved && state.add.resolved.title) || "—"}`, "",
             `**Topics the contributor confirmed:** ${f.topics || "—"}`, "",
             "**Notes**", "", f.why || "—"].join("\n"), "new-resource"),
          el("span", { className: "hint" }, "opens GitHub — you will be asked to sign in"),
        ]);
      };
      rebuild();
      block.append(send);

      reveal(block, [
        { key: "topics", satisfied: () => true },
        { key: "why", satisfied: () => true },
        { key: "send", satisfied: () => true },
      ]);
      const previous = gate;
      gate = () => { previous(); rebuild(); };
      return block;
    }

    // A link with no scholarly identity: a tool, a platform, a deployment.
    // None of it can be resolved, so the form has to ask — but only in the
    // order a person would answer, one field opening the next.
    block.append(el("div", { className: "staged" }, [
      el("span", {}, [el("strong", {}, "No paper behind this one. "),
                      "Tools and deployments are part of the library too — they just have to be described by hand."]),
    ]));

    block.append(
      fieldBlock("name", "What is it called?", "Paperclip"),
      fieldBlock("summary", "What does it do?",
        "One or two neutral sentences. Descriptive rather than promotional — vendor copy is a source, not a summary.",
        null, true),
      fieldBlock("agents", "How do agents participate?",
        "Managed workers a human assigns tasks to? Identity-holding peers with their own permissions? Orchestrated teams?",
        "What shape of organization the tool makes possible — the reason this collection exists.", true),
      fieldBlock("controls", "What oversight does it ship with?",
        "Spending caps, approval gates, pause and terminate, permission scopes, audit trails.",
        "If it ships none, say so. That is a finding, not a mark against it.", true),
      fieldBlock("maintainer", "Who maintains it?", "Block, Inc.",
        "The organization behind it — never an individual."),
      fieldBlock("license", "License and source", "Apache-2.0 · github.com/block/buzz",
        "If it is open source. Leave blank if it is not."),
    );

    const send = el("div", { className: "actions", style: "margin-top:16px" });
    send.dataset.step = "send";
    const rebuild = () => {
      const title = `[Add] ${f.name || id.label}`;
      fillSend(send, title, () => [
        issueButton("Open an issue to add it", title,
          [`**Name:** ${f.name || "—"}`, `**Link:** ${id.url}`, "",
           "**What it does**", "", f.summary || "", "",
           "**How agents participate**", "", f.agents || "", "",
           "**Oversight it ships**", "", f.controls || "", "",
           `**Maintainer:** ${f.maintainer || "—"}`,
           `**License and source:** ${f.license || "—"}`].join("\n"), "new-resource"),
        el("span", { className: "hint" }, "opens GitHub — you will be asked to sign in"),
      ]);
    };
    rebuild();
    block.append(send);

    reveal(block, [
      { key: "name", satisfied: () => (f.name || "").trim().length > 1 },
      { key: "summary", satisfied: () => (f.summary || "").trim().length > 20 },
      { key: "agents", satisfied: () => (f.agents || "").trim().length > 15 },
      { key: "controls", satisfied: () => (f.controls || "").trim().length > 10 },
      { key: "maintainer", satisfied: () => true },
      { key: "license", satisfied: () => true },
      { key: "send", satisfied: () => true },
    ]);
    const previous = gate;
    gate = () => { previous(); rebuild(); };
    return block;
  }


  // ---- what a tool lets agents do ------------------------------------------
  // Shown wherever a tool appears rather than on a page of its own. A tool and
  // the research about the problem it addresses belong on the same shelf: if
  // you are reading topic 8.1 on budgets and spend controls, the thing that
  // enforces a budget is part of that answer, not a separate errand.

  const TRISTATE = { yes: "yes", no: "no", partial: "partly", unknown: "not checked" };

  function toolProfile(record) {
    const t = record.tool;
    if (!t) return null;
    const wrap = el("div", { className: "profile" });

    const facts = [
      t.maintainer,
      t.open_source && t.open_source !== "unknown" ? `open source: ${TRISTATE[t.open_source]}` : null,
      t.self_hostable && t.self_hostable !== "unknown" ? `self-hostable: ${TRISTATE[t.self_hostable]}` : null,
      t.model_agnostic && t.model_agnostic !== "unknown" ? `model-agnostic: ${TRISTATE[t.model_agnostic]}` : null,
    ].filter(Boolean);
    if (facts.length) wrap.append(el("p", { className: "profile-facts" }, facts.join(" · ")));

    [["What agents may do", t.agent_model,
      "The shape of organization the tool makes possible — whether agents hold authority "
      + "and budget, or are workers a human assigns tasks to. The question this "
      + "collection exists to answer, asked of software instead of of literature."],
     ["What stops them", t.human_controls,
      "The oversight it actually ships: approval gates, spend caps, pause and terminate, "
      + "audit trails. A tool that ships none is a finding, not a mark against it."],
    ].forEach(([label, value, why]) => {
      if (!value) return;
      wrap.append(el("div", { className: "profile-row" }, [
        el("span", { className: "profile-label" }, [label, info(why)]),
        el("span", { className: "profile-value" }, value),
      ]));
    });

    if (!t.agent_model && !t.human_controls) {
      wrap.append(el("p", { className: "hint" },
        "Not profiled yet — nobody has read its documentation and written down what "
        + "oversight it ships."));
    }

    if (record.sources && record.sources.length) {
      const sources = el("p", { className: "hint" });
      sources.append("Read from: ");
      record.sources.forEach((src, i) => {
        if (i) sources.append(" · ");
        sources.append(el("a", { href: src.url, target: "_blank", rel: "noopener" },
                          src.title || src.url));
        if (src.accessed) sources.append(` (${src.accessed})`);
      });
      wrap.append(sources);
    }
    return wrap;
  }

  // ---- submit ------------------------------------------------------------
  function renderExport() {
    const stage = document.getElementById("stage");
    stage.textContent = "";

    // Only a confirmed send takes records out of the outgoing list. A click
    // this browser recorded but GitHub never showed might be an abandoned tab,
    // and quietly retiring those records would lose the work.
    const gone = new Set(state.sent
      .filter(entry => entry.kind === "filing" && entry.number)
      .flatMap(entry => entry.records || []));
    const all = Object.entries(state.decisions);
    const entries = all.filter(([id]) => !gone.has(id));
    // An adjustment nobody confirmed is a half-typed sentence, not a
    // judgment. It waits in the browser rather than going in: filing a
    // verdict of "adjusted" with no adjustment attached is refused by the
    // bot, which would take the rest of an otherwise good filing with it.
    const claimed = Object.entries(state.claims).filter(([id]) => !gone.has(id));
    const checked = claimed.filter(([, c]) => settledVerdict(c));
    const unconfirmed = claimed.length - checked.length;
    const written = Object.entries(state.newClaims).filter(([id]) => !gone.has(id));

    stage.append(el("h1", { className: "record-title" }, "Send in what you filed"));

    if (unconfirmed) {
      stage.append(el("p", { className: "hint" },
        `${unconfirmed} adjustment${unconfirmed === 1 ? " is" : "s are"} still being `
        + "written and not included here. Go back to Review and press Confirm wording "
        + `on ${unconfirmed === 1 ? "it" : "them"} to send ${unconfirmed === 1 ? "it" : "them"} too.`));
    }

    if (!entries.length && !checked.length && !written.length) {
      // The history is most wanted by someone who has filed nothing yet —
      // returning early here hid it from exactly that person.
      stage.append(el("p", { className: "empty" }, all.length
        ? `All ${all.length} of your filings are in. File more from Review, or see what `
          + "the rest of the group has sent below."
        : "You have not filed anything yet. Review a record, or see what others have sent in below."));
      stage.append(yourSends());
      stage.append(submissionHistory());
      return;
    }

    const lines = [];
    if (entries.length) {
      lines.push("records:");
      entries.sort().forEach(([id, d]) => {
        lines.push(`  ${id}:`);
        // Quoted deliberately: unquoted, YAML reads 11.10 as the number 11.1,
        // which is a different topic in this taxonomy and nothing would catch it.
        lines.push(`    topics: [${d.topics.map(t => `"${t}"`).join(", ")}]`);
        if (d.verdict && d.verdict !== "filed") lines.push(`    verdict: ${d.verdict}`);
        if (d.unsure) lines.push("    unsure: true");
        if (d.note) lines.push(`    note: ${JSON.stringify(d.note)}`);
        lines.push(`    reviewed_on: ${d.on}`);
      });
    }
    // The second block. One issue carries both because one reviewer made both
    // judgments in one sitting; the bot files them to different places
    // because they measure different things.
    if (checked.length) {
      lines.push("claims:");
      checked.sort().forEach(([id, c]) => {
        lines.push(`  ${id}:`);
        lines.push(`    verdict: ${c.verdict}`);
        // An adjustment is the reviewer's own wording, and the tags that
        // follow from it. Without these the verdict would say "adjusted" and
        // carry no adjustment — the edit would be lost between the browser
        // and the repository, which is the one place it cannot be lost.
        if (c.verdict === "adjusted" && c.text) {
          lines.push(`    text: ${JSON.stringify(c.text)}`);
          if (c.concepts && c.concepts.length) {
            lines.push(`    concepts: [${c.concepts.map(t => `"${t}"`).join(", ")}]`);
          }
        }
        if (c.note) lines.push(`    note: ${JSON.stringify(c.note)}`);
        lines.push(`    reviewed_on: ${c.on}`);
      });
    }
    // Statements the reviewer wrote themselves. A third block because they are
    // a third kind of thing: not a tag, not a verdict on someone else's
    // reading, but a new reading with its own source to be checked.
    if (written.length) {
      lines.push("new_statements:");
      written.sort().forEach(([id, list]) => {
        lines.push(`  ${id}:`);
        list.forEach(entry => {
          lines.push(`    - type: ${entry.type}`);
          lines.push(`      text: ${JSON.stringify(entry.text)}`);
          lines.push(`      quote: ${JSON.stringify(entry.quote)}`);
        });
      });
    }
    const yaml = lines.join("\n");

    const panel = el("div", { className: "panel" });
    panel.append(
      el("h3", {}, [
        `${entries.length} record${entries.length === 1 ? "" : "s"} ready`,
        checked.length ? ` · ${checked.length} statement${checked.length === 1 ? "" : "s"} checked` : "",
        written.length ? ` · ${written.length} written` : "",
      ].join("")),
      el("p", {}, "Open an issue and a bot checks every code against the taxonomy and prepares "
        + "the change. You never touch git. If something is wrong it says which record, on your "
        + "issue, and nothing is merged until it is fixed."),
    );
    if (gone.size) {
      panel.append(el("p", { className: "empty" },
        `${gone.size} record${gone.size === 1 ? "" : "s"} you already sent ${gone.size === 1 ? "is" : "are"} `
        + "not repeated here — only what is new goes in this one."));
    }
    // Golden-set reviewers file no topics at all, and "0 record(s)" as the
    // first thing in the title of their own submission reads like a failure.
    const parts = [];
    if (entries.length) parts.push(`${entries.length} record(s)`);
    if (checked.length) parts.push(`${checked.length} statement(s)`);
    const title = `[Filing] ${parts.join(" and ") || "a filing"}`
      + (written.length ? " with additions" : "");
    const waiting = sentFor(title);
    if (waiting) panel.append(sentNote(title));
    const box = el("textarea", { readOnly: true, value: yaml });
    panel.append(box);

    const copy = el("button", { className: "btn primary" }, "Copy");
    copy.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(yaml); }
      catch (e) { box.select(); document.execCommand("copy"); }
      copy.textContent = "Copied";
      setTimeout(() => (copy.textContent = "Copy"), 1600);
    });

    // A prefilled issue carries the filing in the URL, and a URL has a
    // ceiling. The first version sliced the filing to fit it: a reviewer who
    // rewrote most of the golden set — the whole point of the exercise —
    // would have had a third of their work cut off mid-line, the bot would
    // have refused what was left as malformed, and nothing anywhere would
    // have said why. Over the limit the filing goes by clipboard instead,
    // which has no ceiling and loses nothing.
    const blank = "https://github.com/AO-Commons/knowledge-graph/issues/new"
      + "?template=filing.yml&labels=filing&title=" + encodeURIComponent(title);
    const prefilled = blank + "&filing=" + encodeURIComponent(yaml);
    const fits = prefilled.length <= 6000;

    const issue = el("a", {
      className: "btn",
      href: fits ? prefilled : blank,
      target: "_blank", rel: "noopener",
    }, waiting ? "Open it again" : (fits ? "Open an issue" : "Copy and open an issue"));
    issue.addEventListener("click", async () => {
      if (!fits) {
        try { await navigator.clipboard.writeText(yaml); }
        catch (e) { box.select(); document.execCommand("copy"); }
      }
      markSent(title, "filing", entries.map(([id]) => id));
    });
    if (!fits) {
      panel.append(el("p", { className: "hint" },
        "This filing is too long to carry in a link, so the button copies it "
        + "instead. Paste it into the issue's \u201cYour filing\u201d box \u2014 "
        + "nothing is dropped."));
    }

    const reset = el("button", { className: "btn" }, "Clear mine");
    reset.addEventListener("click", () => {
      if (!confirm("Delete everything you filed in this browser? This cannot be undone.")) return;
      state.decisions = {}; state.claims = {}; state.newClaims = {}; save(); renderExport(); renderTree();
    });

    panel.append(el("div", { className: "actions" }, [copy, issue, reset]));
    stage.append(panel);

    stage.append(el("p", { className: "empty" },
      "Your filing lives only in this browser until you send it. Nothing is uploaded automatically."));
    stage.append(yourSends());
    stage.append(submissionHistory());
  }

  // What this browser has handed off, and whether GitHub has it. Separate from
  // the group's history below because it answers a different question: not
  // "what is the group doing" but "did the thing I just did work".
  function yourSends() {
    const wrap = el("div", { className: "ledger" });
    if (!state.sent.length) return wrap;

    wrap.append(el("p", { className: "section-label" }, "What you have sent"));
    const table = el("table");
    table.append(el("tr", {}, [
      el("th", {}, "Submission"), el("th", {}, "Kind"), el("th", {}, "When"), el("th", {}, "State"),
    ]));
    state.sent.slice(0, 20).forEach(entry => {
      table.append(el("tr", {}, [
        el("td", {}, entry.number
          ? el("a", { href: entry.url, target: "_blank", rel: "noopener" },
               `#${entry.number} ${entry.title}`.slice(0, 66))
          : entry.title.slice(0, 66)),
        el("td", { className: "codes" }, KINDS[entry.kind] || entry.kind),
        el("td", { className: "when" }, (entry.at || "").slice(0, 10)),
        el("td", { className: "by" }, entry.number ? "on GitHub" : "not seen yet"),
      ]));
    });
    wrap.append(el("div", { className: "ledger-wrap" }, table));

    if (state.sent.some(entry => !entry.number)) {
      const again = el("button", { className: "btn" }, "Check GitHub again");
      again.addEventListener("click", () => { loadSubmissions(true); again.textContent = "Checking…"; });
      wrap.append(el("div", { className: "actions" }, again));
      wrap.append(el("p", { className: "empty" },
        "“Not seen yet” means this browser opened the form and GitHub has not "
        + "listed the issue. Either it is a few seconds behind, or the tab was closed "
        + "before submitting — in which case sending it again costs nothing."));
    }
    return wrap;
  }

  const KINDS = {
    filing: "tags filed",
    "new-resource": "paper added",
    taxonomy: "taxonomy change",
    other: "other",
  };

  function submissionHistory() {
    const wrap = el("div", { className: "ledger" });
    wrap.append(el("p", { className: "section-label" }, "What the group has sent in"));

    if (submissions.state === "idle" || submissions.state === "loading") {
      wrap.append(el("p", { className: "empty" }, "Reading the repository…"));
      return wrap;
    }
    if (submissions.state === "unavailable") {
      wrap.append(el("p", { className: "empty" }, [
        "Could not reach GitHub just now — it allows sixty reads an hour per address. ",
        el("a", { href: "https://github.com/AO-Commons/knowledge-graph/issues", target: "_blank", rel: "noopener" },
           "The issues page"), " has the same list.",
      ]));
      return wrap;
    }
    if (!submissions.items.length) {
      wrap.append(el("p", { className: "empty" }, "Nothing yet. Yours would be the first."));
      return wrap;
    }

    const table = el("table");
    table.append(el("tr", {}, [
      el("th", {}, "Submission"), el("th", {}, "Kind"), el("th", {}, "By"),
      el("th", {}, "When"), el("th", {}, "State"),
    ]));
    submissions.items.slice(0, 40).forEach(item => {
      table.append(el("tr", {}, [
        el("td", {}, el("a", { href: item.url, target: "_blank", rel: "noopener" },
                        `#${item.number} ${item.title}`.slice(0, 66))),
        el("td", { className: "codes" }, KINDS[item.kind]),
        el("td", { className: "by" }, item.who || "—"),
        el("td", { className: "when" }, item.when),
        el("td", { className: "by" }, item.open ? "open" : "merged or closed"),
      ]));
    });
    wrap.append(el("div", { className: "ledger-wrap" }, table));
    wrap.append(el("p", { className: "empty" },
      "Read straight from the public repository — no sign-in needed to see this. "
      + "You are only asked to sign in at the moment you open an issue, because that is "
      + "what records who filed it."));
    return wrap;
  }

  // ---- search ------------------------------------------------------------
  // One box over three things people actually look for: a topic they have in
  // mind, an author they follow, and a paper they remember the title of.
  function runSearch(term) {
    const out = document.getElementById("q-out");
    out.textContent = "";
    const q = term.trim().toLowerCase();
    if (q.length < 2) return;

    const topics = DATA.topics
      .map(t => {
        // Aliases are searched too. They fed the classifier from the start
        // but never this box, so a topic could be the top machine suggestion
        // for a paper and still be unfindable by the word a person types.
        const hay = (t.title + " " + t.points.join(" ") + " " + (t.aka || []).join(" ")).toLowerCase();
        let score = hay.includes(q) ? 2 : 0;
        if (t.title.toLowerCase().startsWith(q)) score += 3;
        if ((t.aka || []).some(name => name.toLowerCase() === q)) score += 6;
        if (t.code.startsWith(q)) score += 5;
        return { t, score };
      })
      .filter(x => x.score > 0)
      .sort((a, b) => b.score - a.score)
      .slice(0, 6);

    const people = new Map();
    DATA.records.forEach(r => (r.authors || []).forEach(a => {
      if (!a.toLowerCase().includes(q)) return;
      const key = samePerson(a);
      const seen = people.get(key) || { label: a, n: 0 };
      // Keep the fuller spelling: "Joel Z. Leibo" over "Joel Z Leibo".
      if (a.length > seen.label.length) seen.label = a;
      seen.n += 1;
      people.set(key, seen);
    }));

    const papers = DATA.records
      .filter(r => r.title.toLowerCase().includes(q))
      .slice(0, 6);

    if (topics.length) {
      out.append(el("div", { className: "head" }, "Topics"));
      topics.forEach(({ t }) => {
        const hit = el("button", { className: "result" }, [
          el("span", { className: "code" }, t.code),
          el("span", {}, [t.title, el("span", { className: "trail" }, trailOf(t.code))]),
        ]);
        hit.addEventListener("click", () => { clearSearch(); focusBranch(t.code); });
        out.append(hit);
      });
    }

    if (people.size) {
      out.append(el("div", { className: "head" }, "Authors"));
      [...people.values()].sort((a, b) => b.n - a.n).slice(0, 5).forEach(({ label: name, n }) => {
        const hit = el("button", { className: "result" }, [
          el("span", { className: "code" }, String(n)),
          el("span", {}, [name, el("span", { className: "trail" },
            `${n} record${n === 1 ? "" : "s"} in the library`)]),
        ]);
        hit.addEventListener("click", () => { clearSearch(); showAuthor(name); });
        out.append(hit);
      });
    }

    if (papers.length) {
      out.append(el("div", { className: "head" }, "Records"));
      papers.forEach(r => {
        const hit = el("button", { className: "result" }, [
          el("span", { className: "code" }, state.decisions[r.id] || merged.has(r.id) ? "✓" : "·"),
          el("span", {}, [r.title,
            el("span", { className: "trail" }, (r.authors || []).slice(0, 3).join(", "))]),
        ]);
        hit.addEventListener("click", () => { clearSearch(); jumpTo(r); });
        out.append(hit);
      });
    }

    if (!out.childElementCount) {
      out.append(el("div", { className: "head" }, "Nothing matched"));
    }
  }

  function clearSearch() {
    document.getElementById("q").value = "";
    document.getElementById("q-out").textContent = "";
  }

  function jumpTo(record) {
    state.focusTopic = null;
    if (state.decisions[record.id]) delete state.decisions[record.id];
    const pending = queue();
    state.cursor = Math.max(0, pending.findIndex(r => r.id === record.id));
    state.picked = new Set(record.current);
    setMode("review");
  }

  function showAuthor(name) {
    state.author = name;
    setMode("explore");
  }

  // Every claim, by id, across every record. Relations cross papers, so an
  // edge's other end is usually not in the record currently open.
  let claimIndex = null;
  function claimById(id) {
    if (!claimIndex) {
      claimIndex = new Map();
      DATA.records.forEach(record =>
        (record.claims || []).forEach(claim => claimIndex.set(claim.id, {
          ...claim, paper: record.title, paperId: record.id,
        })));
    }
    return claimIndex.get(id) || null;
  }

  // One concept, and everything the corpus asserts under it.
  //
  // The reason the concept layer exists. Forty claims read one at a time are
  // forty paraphrase checks; the seven claims tagged `agent-reputation-systems`
  // read together are an argument, and whether they are consistent with each
  // other is a question only visible in this view.
  function showConcept(id) {
    const concept = (DATA.concepts || {})[id];
    if (!concept) return;
    const panel = document.getElementById("concept-panel");
    const body = document.getElementById("concept-body");
    document.getElementById("concept-title").textContent = concept.label;

    const claims = concept.claims.map(claimById).filter(Boolean);
    const papers = new Set(claims.map(c => c.paperId));
    document.getElementById("concept-count").textContent =
      `${claims.length} statement${claims.length === 1 ? "" : "s"} across `
      + `${papers.size} paper${papers.size === 1 ? "" : "s"}`;

    body.textContent = "";
    claims.forEach(claim => {
      const row = el("div", { className: "claim" });
      row.append(el("div", { className: "kicker" },
        [el("span", {}, (CLAIM_KINDS[claim.type] || [claim.type])[0])]));
      if (claim.own === false) {
        row.append(el("p", { className: "claim-borrowed" },
          "reported from prior work" + (claim.from_whom ? " — " + claim.from_whom : "")));
      }
      row.append(el("p", { className: "claim-text" }, claim.text));
      row.append(el("p", { className: "claim-where" }, claim.paper));
      body.append(row);
    });

    const related = (DATA.relations || []).filter(r =>
      concept.claims.includes(r.source) || concept.claims.includes(r.target));
    if (related.length) {
      body.append(el("p", { className: "section-label" }, "asserted between them"));
      related.forEach(r => {
        const from = claimById(r.source), to = claimById(r.target);
        const block = el("div", { className: "relation" });
        block.append(el("div", { className: "rel-kind" },
          r.relation.replace(/_/g, " ").toLowerCase()));
        block.append(el("div", { className: "rel-other" },
          (from ? from.text : r.source) + "  →  " + (to ? to.text : r.target)));
        if (r.because) block.append(el("div", { className: "rel-why" }, r.because));
        if (r.unconfirmed) {
          block.append(el("div", { className: "rel-draft" },
            "drafted by a machine and not confirmed"));
        }
        body.append(block);
      });
    } else if (claims.length > 1) {
      // Said out loud rather than left as an empty space. Claims sharing a
      // concept and relating to each other are different things, and a
      // reviewer who sees nothing here should know that means nobody has
      // looked, not that nothing connects.
      body.append(el("p", { className: "hint" },
        "Nothing asserted between these yet. Sharing a concept is not a "
        + "relation — but if two of them argue with each other, this is where "
        + "that would be recorded."));
    }
    panel.hidden = false;
    panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  // ---- wiring ------------------------------------------------------------
  function renderStage() {
    ({ review: renderReview, explore: renderExplore, add: renderAdd,
       export: renderExport })[state.mode]();
  }
  function setMode(mode) {
    state.mode = mode;
    ["review", "explore", "add", "export"].forEach(m =>
      document.getElementById("mode-" + m).setAttribute("aria-pressed", String(m === mode)));
    renderStage(); renderTree();
  }
  document.getElementById("concept-close").addEventListener("click", () => {
    document.getElementById("concept-panel").hidden = true;
  });
  document.getElementById("mode-review").addEventListener("click", () => setMode("review"));
  document.getElementById("mode-explore").addEventListener("click", () => setMode("explore"));
  document.getElementById("mode-add").addEventListener("click", () => { loadIndex(); setMode("add"); });
  document.getElementById("mode-export").addEventListener("click", () => {
    loadSubmissions(false);
    setMode("export");
  });

  const box = document.getElementById("q");
  box.addEventListener("input", () => runSearch(box.value));
  box.addEventListener("keydown", event => { if (event.key === "Escape") clearSearch(); });
  document.addEventListener("click", event => {
    if (!event.target.closest(".search")) document.getElementById("q-out").textContent = "";
  });


  applyTheme(theme);
  document.getElementById("theme").addEventListener("click", () => {
    theme = theme === "dark" ? "light" : "dark";
    applyTheme(theme);
  });

  DATA.topics.filter(t => t.depth === 0).forEach(t => state.open.add(t.code));

  // The graph links back here at a person, a branch or a record. Without this
  // every one of those links landed on the front page and left the reader to
  // find again what they had just clicked.
  function openFromHash() {
    const hash = decodeURIComponent(location.hash.replace(/^#/, ""));
    const [key, value] = [hash.slice(0, hash.indexOf("=")), hash.slice(hash.indexOf("=") + 1)];
    // Whatever the previous link set has to go, or the views stack and a topic
    // link lands on the author page it was supposed to replace.
    state.author = null;
    state.focusTopic = null;
    state.viewing = null;
    if (!value) { setMode("explore"); return; }

    if (key === "author") {
      state.author = value;
      setMode("explore");
    } else if (key === "topic" && TOPICS.has(value)) {
      setMode("explore");
      focusBranch(value);
    } else if (key === "record") {
      const record = DATA.records.find(r => r.id === value);
      if (record) { setMode("review"); openRecord(record); return; }
      setMode("explore");
    } else {
      setMode("explore");
    }
  }

  openFromHash();
  window.addEventListener("hashchange", openFromHash);
})();
</script>
