icy innovation.","authors":["Raphaël Koster","Jan Balaguer","Andrea Tacchetti","Ari Weinstein","Tina Zhu","Oliver Hauser","Duncan Williams","Lucy Campbell-Gillingham","Phoebe Thacker","Matthew Botvinick","Christopher Summerfield"],"date":"2022-07-04","url":"https://doi.org/10.1038/s41562-022-01383-x","type":"peer-reviewed-paper","doi":"10.1038/s41562-022-01383-x","arxiv":"","repo":"","current":[],"suggested":["15.6","4.1"],"suggested_more":["1.2","13.4","4.4","16.4","15.1","2.1","10.3","1.4","3.2","4.2","7.2","5.2"],"claims":[],"derived_topics":{}},{"id":"resource:doi:10-1073-pnas-2319947121","title":"Tabula rasa agents display emergent in-group behavior","abstract":"Theories on group-bias often posit an internal preparedness to bias one's cognition to favor the in-group (often envisioned as a product of evolution). In contrast, other theories suggest that group-biases can emerge from nonspecialized cognitive processes. These perspectives have historically been difficult to disambiguate given that observed behavior can often be attributed to innate processes, even when groups are experimentally assigned. Here, we use modern techniques from the field of AI that allow us to ask what group biases can be expected from a learning agent that is a pure blank slate without any intrinsic social biases, and whose lifetime of experiences can be tightly controlled. This is possible because deep reinforcement-learning agents learn to convert raw sensory input (i.e. pixels) to reward-driven action, a unique feature among cognitive models. We find that blank slate agents do develop group biases based on arbitrary group differences (i.e. color). We show that the bias develops as a result of familiarity of experience and depends on the visual patterns becoming…","authors":["Raphaël Koster","Edgar A. Duéñez-Guzmán","William A. Cunningham","Joel Z. Leibo"],"date":"2025-06-16","url":"https://doi.org/10.1073/pnas.2319947121","type":"peer-reviewed-paper","doi":"10.1073/pnas.2319947121","arxiv":"","repo":"","current":["5.1"],"suggested":["15.6","14.5"],"suggested_more":["3.1","5.2","14.2","11.13","11.4","5.1","1.4","12.2","11.6","5.4","11.9","11.5"],"claims":[],"derived_topics":{}},{"id":"resource:doi:10-1073-pnas-2319948121","title":"Collective cooperative intelligence","abstract":"Cooperation at scale is critical for achieving a sustainable future for humanity. However, achieving collective, cooperative behavior-in which intelligent actors in complex environments jointly improve their well-being-remains poorly understood. Complex systems science (CSS) provides a rich understanding of collective phenomena, the evolution of cooperation, and the institutions that can sustain both. Yet, much of the theory in this area fails to fully consider individual-level complexity and environmental context-largely for the sake of tractability and because it has not been clear how to do so rigorously. These elements are well captured in multiagent reinforcement learning (MARL), which has recently put focus on cooperative (artificial) intelligence. However, typical MARL simulations can be computationally expensive and challenging to interpret. In this perspective, we propose that bridging CSS and MARL affords new directions forward. Both fields can complement each other in their goals, methods, and scope. MARL offers CSS concrete ways to formalize cognitive processes in…","authors":["Wolfram Barfuss","Jessica C. Flack","Chaitanya S. Gokhale","Lewis Hammond","Christian Hilbe","Edward Hughes","Joel Z. Leibo","Tom Lenaerts","Naomi Ehrich Leonard","Simon A. Levin","Udari Madhushani","Alex McAvoy","Janusz M Meylahn","Fernando P. Santos"],"date":"2025-06-16","url":"https://doi.org/10.1073/pnas.2319948121","type":"peer-reviewed-paper","doi":"10.1073/pnas.2319948121","arxiv":"","repo":"","current":["5.2","15.3"],"suggested":["15.6","1.2"],"suggested_more":["16.4","15.3","14.5","5.3","11.3","15.1","1.3","5.2","5.1","11.2","16.2","7.1"],"claims":[],"derived_topics":{}},{"id":"resource:doi:10-1111-epic-70009","title":"Building the Loop: The Role of Ethnography in Artificial Organisational Intelligence","abstract":"Abstract We introduce Artificial Organisational Intelligence (AOI): the capacity for organisations to make their knowledge (including routines, practices, rules, boundaries, and tacit know‐how) legible and governable. AOI is not about replacing organisations with AI, but about enabling them to talk to themselves and to each other through regulated feedback loops. Our collaborative project with BlockScience and Metagov develops Knowledge Organisation Infrastructure (KOI), a protocol for stitching together disparate systems and practices without homogenisation, thereby allowing organisations to embed rules, permissions, and context into machine‐readable forms. We describe how our ethnographic practice both informs and is transformed by this work: from observing hidden practices to actively building the loops that make organisational knowledge accessible and computable.","authors":["Ellie Rennie","Kelsie Nabben","Michael Zargham","Jason Potts","Brooke Ann Coco","Luke Miller","Matthew Green"],"date":"2025-11-01","url":"https://doi.org/10.1111/epic.70009","type":"peer-reviewed-paper","doi":"10.1111/epic.70009","arxiv":"","repo":"","current":["16.1","16.4"],"suggested":["11.6","5.2","5.1","16.1","10.2","1.2"],"suggested_more":["16.2","12.4","12.1","11.5","7.2","7.3","10.1","11.3"],"claims":[{"id":"claim:doi:10-1111-epic-70009:1","text":"Artificial Organizational Intelligence is an organization's capacity to make its own knowledge legible and governable.","standalone":"The authors define Artificial Organizational Intelligence as an organization's capacity to make its knowledge — routines, practices, rules, boundaries and tacit know-how — legible and governable.","quote":"We introduce Artificial Organisational Intelligence (AOI): the capacity for organisations to make their knowledge (including routines, practices, rules, boundaries, and tacit know‐how) legible and governable","where":"abstract","type":"method","primary":false,"topics":[],"verdict":"","by":"","concepts":["organizational-knowledge-legibility"],"own":true,"from_whom":""},{"id":"claim:doi:10-1111-epic-70009:2","text":"Artificial Organizational Intelligence is about organizations talking to themselves through regulated feedback loops, not about replacing them with AI.","standalone":"The authors position Artificial Organizational Intelligence as enabling organizations to talk to themselves and each other through regulated feedback loops, rather than as replacing organizations with AI.","quote":"AOI is not about replacing organisations with AI, but about enabling them to talk to themselves and to each other through regulated feedback loops","where":"abstract","type":"position","primary":true,"topics":[],"verdict":"","by":"","concepts":["organizational-knowledge-legibility"],"own":true,"from_whom":""},{"id":"claim:doi:10-1111-epic-70009:3","text":"Knowledge Organization Infrastructure is a protocol for connecting disparate systems without homogenising them.","standalone":"The authors describe Knowledge Organization Infrastructure as a protocol for stitching together disparate organizational systems and practices without homogenising them, so rules and context become machine-readable.","quote":"develops Knowledge Organisation Infrastructure (KOI), a protocol for stitching together disparate systems and practices without homogenisation","where":"abstract","type":"method","primary":false,"topics":[],"verdict":"","by":"","concepts":["shared-schemas-for-agentic-organization-data"],"own":true,"from_whom":""}],"derived_topics":{"16.1":2,"2.4":2,"16.3":1}},{"id":"resource:doi:10-1126-science-adq2852","title":"AI can help humans find common ground in democratic deliberation","abstract":"Finding agreement through a free exchange of views is often difficult. Collective deliberation can be slow, difficult to scale, and unequally attentive to different voices. In this study, we trained an artificial intelligence (AI) to mediate human deliberation. Using participants’ personal opinions and critiques, the AI mediator iteratively generates and refines statements that express common ground among the group on social or political issues. Participants ( N = 5734) preferred AI-generated statements to those written by human mediators, rating them as more informative, clear, and unbiased. Discussants often updated their views after the deliberation, converging on a shared perspective. Text embeddings revealed that successful group statements incorporated dissenting voices while respecting the majority position. These findings were replicated in a virtual citizens’ assembly involving a demographically representative sample of the UK population.","authors":["Michael Henry Tessler","Michiel A. Bakker","Daniel Jarrett","Hannah Sheahan","Martin J. Chadwick","Raphaël Koster","Geoff Evans","Lucy Campbell-Gillingham","Tantum Collins","David C. Parkes","Matthew Botvinick","Christopher Summerfield"],"date":"2024-10-17","url":"https://doi.org/10.1126/science.adq2852","type":"peer-reviewed-paper","doi":"10.1126/science.adq2852","arxiv":"","repo":"","current":[],"suggested":["3.2","15.6","11.6","11.13","11.11","1.2"],"suggested_more":["5.1","6.1","16.3","8.2","12.4","15.1","4.5","11.7"],"claims":[],"derived_topics":{}},{"id":"resource:doi:10-1145-3491102-3517500","title":"Designing Human-Agent Collaborations: Commitment, responsiveness, and support","abstract":"With the advancements in AI, agents (i.e., smart products, robots, software agents) are increasingly capable of working closely together with humans in a variety of ways while benefiting from each other. These human-agent collaborations have gained growing attention in the HCI community; however, the field lacks clear guidelines on how to design the agents’ behaviors in collaborations. In this paper, the qualities that are relevant for designers to create robust and pleasant human-agent collaborations were investigated. Bratman's Shared Cooperative Activity framework was used to identify the core characteristics of collaborations and survey the most important issues in the design of human-agent collaborations, namely code-of-conduct, task delegation, autonomy and control, intelligibility, common ground, offering help and requesting help. The aim of this work is to add structure to this growing and important facet of HCI research and operationalize the concept of human-agent collaboration with concrete design considerations.","authors":["Nazlı Cila"],"date":"2022-04-28","url":"https://doi.org/10.1145/3491102.3517500","type":"peer-reviewed-paper","doi":"10.1145/3491102.3517500","arxiv":"","repo":"","current":[],"suggested":["16.4","4.3","4.4","3.4","11.13","14.1"],"suggested_more":["15.2","11.11","2.3","3.2","15.1","16.1","13.1","2.1"],"claims":[],"derived_topics":{}},{"id":"resource:doi:10-1145-3593013-3594033","title":"Harms from Increasingly Agentic Algorithmic Systems","abstract":"Research in Fairness, Accountability, Transparency, and Ethics (FATE)1 has established many sources and forms of algorithmic harm, in domains as diverse as health care, finance, policing, and recommendations. Much work remains to be done to mitigate the serious harms of these systems, particularly those disproportionately affecting marginalized communities. Despite these ongoing harms, new systems are being developed and deployed, typically without strong regulatory barriers, threatening the perpetuation of the same harms and the creation of novel ones. In response, the FATE community has emphasized the importance of anticipating harms, rather than just responding to them. Anticipation of harms is especially important given the rapid pace of developments in machine learning (ML). Our work focuses on the anticipation of harms from increasingly agentic systems. Rather than providing a definition of agency as a binary property, we identify 4 key characteristics which, particularly in combination, tend to increase the agency of a given algorithmic system: underspecification, directness…","authors":["Alan Chan","Rebecca Salganik","Alva Markelius","Chris Pang","Nitarshan Rajkumar","Dmitrii Krasheninnikov","Lauro Langosco","Zhonghao He","Yawen Duan","Micah Carroll","Michelle Lin","Alex Mayhew","Katherine M. Collins","Maryam Molamohammadi","John Burden","Wanru Zhao","Shalaleh Rismani","Konstantinos Voudouris","Umang Bhatt","Adrian Weller","David Krueger","Tegan Maharaj"],"date":"2023-06-12","url":"https://doi.org/10.1145/3593013.3594033","type":"peer-reviewed-paper","doi":"10.1145/3593013.3594033","arxiv":"","repo":"","current":[],"suggested":["12.4","1.1","16.4"],"suggested_more":["1.2","1.3","15.6","1.4","12.1","11.2","4.4","16.1","11.12","4.1","11.13"],"claims":[],"derived_topics":{}},{"id":"resource:doi:10-1145-3706598-3713423","title":"Towards Human-AI Deliberation: Design and Evaluation of LLM-Empowered Deliberative AI for AI-Assisted Decision-Making","abstract":"Traditional AI-assisted decision-making systems often provide fixed recommendations that users must either accept or reject entirely, limiting meaningful interaction - especially in cases of disagreement. To address this, we introduce Human-AI Deliberation, an approach inspired by human deliberation theories that enables dimension-level opinion elicitation, iterative decision updates, and structured discussions between humans and AI. At the core of this approach is Deliberative AI, an assistant powered by large language models (LLMs) that facilitates flexible, conversational interactions and precise information exchange with domain-specific models. Through a mixed-methods user study, we found that Deliberative AI outperforms traditional explainable AI (XAI) systems by fostering appropriate human reliance and improving task performance. By analyzing participant perceptions, user experience, and open-ended feedback, we highlight key findings, discuss potential concerns, and explore the broader applicability of this approach for future AI-assisted decision-making systems.","authors":["Shuai Ma","Qiaoyi Chen","Xinru Wang","Chengbo Zheng","Zhenhui Peng","Ming Yin","Xiaojuan Ma"],"date":"2025-04-23","url":"https://doi.org/10.1145/3706598.3713423","type":"peer-reviewed-paper","doi":"10.1145/3706598.3713423","arxiv":"","repo":"","current":[],"suggested":["14.1","16.2","3.2","12.4","16.1","6.2"],"suggested_more":["16.4","8.2","4.5","2.1","1.1","10.6","16.3","3.3"],"claims":[],"derived_topics":{}},{"id":"resource:doi:10-1177-00491241251337316","title":"Simulating Subjects: The Promise and Peril of Artificial Intelligence Stand-Ins for Social Agents and Interactions","abstract":"Large language models (LLMs), through their exposure to massive collections of online text, learn to reproduce the perspectives and linguistic styles of diverse social and cultural groups. This capability suggests a powerful social scientific application—the simulation of empirically realistic, culturally situated human subjects. Synthesizing recent research in artificial intelligence and computational social science, we outline a methodological foundation for simulating human subjects and their social interactions. We then identify six characteristics of current models that are likely to impair the realistic simulation of human subjects: bias, uniformity, atemporality, disembodiment, linguistic cultures, and alien intelligence. For each of these areas, we discuss promising approaches for overcoming their associated shortcomings. Given the rate of change of these models, we advocate for an ongoing methodological program for the simulation of human subjects that keeps pace with rapid technical progress, and caution that validation against human subjects data remains essential to…","authors":["Austin C. Kozlowski","James A. Evans"],"date":"2025-06-02","url":"https://doi.org/10.1177/00491241251337316","type":"peer-reviewed-paper","doi":"10.1177/00491241251337316","arxiv":"","repo":"","current":["14.5","16.4"],"suggested":["2.4","15.6","14.5"],"suggested_more":["1.2","12.1","16.3","8.2","4.4","2.7","6.2","6.1","11.10","11.13","3.3"],"claims":[],"derived_topics":{}},{"id":"resource:doi:10-12688-f1000research-169927-1","title":"Trustworthy agentic AI systems: a cross-layer review of architectures, threat models, and governance","abstract":"<ns3:p>Agentic Artificial Intelligence systems, characterized by autonomous reasoning, memory augmentation, and adaptive planning, are rapidly reshaping technological landscapes. Unlike traditional AI or large language models, agentic AI integrates decision-making with persistent execution, enabling complex interactions across dynamic environments. However, this evolution introduces novel security risks, governance challenges, and ethical considerations that current frameworks inadequately address. This survey provides a cross-layer review of agentic AI, encompassing architectural paradigms, threat taxonomies, and governance strategies. It consolidates findings from adjacent domains such as cybersecurity, AI safety, multi-agent coordination, and ethics, offering a holistic understanding of vulnerabilities and mitigation approaches. We integrate insights from recent advances in defense architectures and governance innovations, highlighting the limitations of static policies in addressing dynamically evolving threats. Real-world deployments from industrial automation to military and…","authors":["IBRAHIM ADABARA","Bashir Olaniyi Sadiq","Aliyu Nuhu Shuaibu","Yale Ibrahim Danjuma","Maninti Venkateswarlu"],"date":"2025-09-11","url":"https://doi.org/10.12688/f1000research.169927.1","type":"peer-reviewed-paper","doi":"10.12688/f1000research.169927.1","arxiv":"","repo":"","current":["3.1","10.5","4.1"],"suggested":["10.5","11.13"],"suggested_more":["15.2","16.4","12.4","1.1","10.6","15.6","8.2","12.1","2.1","10.1","14.2","8.1"],"claims":[],"derived_topics":{}},{"id":"resource:doi:10-3386-w34468","title":"The Coasean Singularity? Demand, Supply, and Market Design with AI Agents","abstract":"AI agents-autonomous systems that perceive, reason, and act on behalf of human principals-are poised to transform digital markets by dramatically reducing transaction costs.This chapter evaluates the economic implications of this transition, adopting a consumer-oriented view of agents as market participants that can search, negotiate, and transact directly.From the demand side, agent adoption reflects derived demand: users trade off decision quality against effort reduction, with outcomes mediated by agent capability and task context.On the supply side, firms will design, integrate, and monetize agents, with outcomes hinging on whether agents operate within or across platforms.At the market level, agents create efficiency gains from lower search, communication, and contracting costs, but also introduce frictions such as congestion and price obfuscation.By lowering the costs of preference elicitation, contract enforcement, and identity verification, agents expand the feasible set of market designs but also raise novel regulatory challenges.While the net welfare effects remain an…","authors":["Peyman Shahidi","Gili Rusak","Benjamin Manning","Andrey Fradkin","John Horton"],"date":"2025-11-01","url":"https://doi.org/10.3386/w34468","type":"technical-report","doi":"10.3386/w34468","arxiv":"","repo":"","current":[],"suggested":["13.3","16.4"],"suggested_more":["11.12","13.2","11.7","4.3","1.2","11.5","5.4","10.4","16.2","16.1","16.3","7.4"],"claims":[],"derived_topics":{}},{"id":"resource:doi:10-1002-aaai-70041","title":"Multi-Agent Ethnography: Post-Conventional Anthropological Practice for Agentic Systems","abstract":"Method work for section 16, which is thin. Pairs with Rennie's ethnography paper.","authors":[],"date":"2026-02-01","url":"https://doi.org/10.1002/aaai.70041","type":"peer-reviewed-paper","doi":"10.1002/aaai.70041","arxiv":"","repo":"","current":["16.1","16.4"]," e":"ARIA — Scaling Trust Arena","abstract":"Live adversarial multi-agent competition environment, roughly £50m programme, Arena launching Q3 2026.","authors":[],"date":"","url":"https://aria.org.uk/opportunity-spaces/trust-everything-everywhere/scaling-trust/arena","type":"research-programme","doi":"","arxiv":"","repo":"","current":["10.4","14.2"],"suggested":["14.5","15.6"],"suggested_more":["9.1","5.3","14.2","16.4","10.5","5.2","10.2","3.4","13.4","3.2","4.4","10.4"],"claims":[],"derived_topics":{}},{"id":"resource:platform:raft","title":"Raft","abstract":"Multi-agent platform, observational at roughly 45,000 agents.","authors":[],"date":"","url":"https://raft.build/","type":"platform","doi":"","arxiv":"","repo":"","current":["3.4","16.1"],"suggested":["15.6","5.3","5.1","5.4","14.1","10.5"],"suggested_more":["8.3","5.2","11.14","11.6","1.2"],"claims":[],"derived_topics":{}},{"id":"resource:platform:vending-bench-arena","title":"Vending-Bench Arena","abstract":"Multi-agent extension of Vending-Bench; source of the July 2026 price-collusion, truce-breaking, and supplier-deception results.","authors":[],"date":"","url":"https://andonlabs.com/evals/vending-bench-arena","type":"evaluation-suite","doi":"","arxiv":"","repo":"","current":["5.2","10.2","11.6","14.1"],"suggested":["5.2","11.6"],"suggested_more":["3.4","14.5","3.3","7.4","15.6","10.2","5.3","5.1","5.4","14.1","10.5","8.3"],"claims":[],"derived_topics":{}},{"id":"resource:tool:agentteam-email","title":"AgentTeam Email","abstract":"Email infrastructure that gives agents their own mailboxes and puts a human approval step between an agent's draft and what actually leaves the building. One of the few tools in the mirror where the oversight step is the product rather than a setting.","authors":[],"date":"","url":"https://github.com/agentteamhq/agentteam-email","type":"code-tool","doi":"","arxiv":"","repo":"https://github.com/agentteamhq/agentteam-email","tool":{"agent_model":"Agents get dedicated mailboxes with scoped access. They read inbound mail and draft outbound mail, but sending is not theirs to complete: the documentation describes letting \"agents draft replies or outbound mail while people approve, edit, or restrict what actually gets sent\". Untrusted inbound mail is opened in a separate product surface, which treats a message as data rather than as instructions.","human_controls":"Operator approval on outbound mail is the core mechanism, making this machine-proposal / human-approval by construction rather than by configuration. Role-based mailbox permissions are managed through an admin surface, sending is restricted by domain via Cloudflare, and enrolment is token-based through a CLI. Rate limits, recipient allowlists and the scope of audit logging are not documented.","maintainer":"AgentTeam HQ","open_source":"yes","status":"active","languages":["TypeScript","Go"]},"sources":[{"url":"https://github.com/agentteamhq/agentteam-email","title":"AgentTeam Email — repository and README","accessed":"2026-09-10","supports":["agent_model","human_controls","license","languages"]}],"current":["2.1","2.2","9.2","4.1"],"suggested":["1.1","4.1"],"suggested_more":["11.10","4.2","10.3","5.2","11.8","2.7","11.11","3.2","11.5","4.5","14.1","12.2"],"claims":[],"derived_topics":{}},{"id":"resource:tool:buzz","title":"Buzz","abstract":"A self-hostable workspace where humans and AI agents share the same channels, threads, code repositories, and workflows. Built as a Nostr relay, so every message, review approval, and git event is a signed event in one log.","authors":[],"date":"2026-07-21","url":"https://buzz.xyz","type":"code-tool","doi":"","arxiv":"","repo":"https://github.com/block/buzz","tool":{"agent_model":"Agents are participants rather than command-responders, holding their own cryptographic Nostr identities and defined permissions. They post, review code, send patches, and run approved workflows alongside humans under the same identity model. Block's announcement is explicit that this makes agents teammates, not holders of organizational authority.","human_controls":"Per-agent permission scopes, and automations that must be approved before an agent can run them. Every action by human or agent is a signed event in an append-only log, so the audit trail is inherent rather than a feature. Self-hosting means the operator controls the relay.","maintainer":"Block, Inc.","open_source":"yes","self_hostable":"yes","model_agnostic":"yes","status":"active","languages":["Rust"],"protocols":["nostr"]},"sources":[{"url":"https://block.xyz/inside/introducing-buzz-where-humans-and-agents-work-together","title":"Introducing Buzz: where humans and agents work together","accessed":"2026-08-07","supports":["agent_model","protocols","model_agnostic","launched"]},{"url":"https://github.com/block/buzz","title":"Buzz — repository","accessed":"2026-08-07","supports":["license","languages","open_source","self_hostable"]}],"current":["2.1","3.2","9.2"],"suggested":["4.1","9.2"],"suggested_more":["10.2","8.1","11.14","2.1","13.1","4.5","13.2","11.5","11.1","5.2","11.8","8.2"],"claims":[],"derived_topics":{}},{"id":"resource:tool:crewai","title":"CrewAI","abstract":"A Python framework for role-based multi-agent teams, in which agents hold specialised roles and may delegate to one another. The authority bounds are per-agent numeric limits — iterations, requests per minute, wall-clock time — with delegation and code execution off by default.","authors":[],"date":"","url":"https://docs.crewai.com/","type":"code-tool","doi":"","arxiv":"","repo":"https://github.com/crewAIInc/crewAI","tool":{"agent_model":"Agents hold specialised roles with defined goals and are described as having \"true autonomy and agency… through role-based collaboration\", with \"autonomous decision-making between agents\" and \"dynamic task delegation\". They call external tools, APIs and databases. Delegation to other agents is governed by `allow_delegation`, which defaults to False — an agent cannot hand work to another unless it is switched on.","human_controls":"Bounds are numeric and per-agent rather than policy-shaped. `max_iter` (default 20) caps reasoning cycles before the agent must give its best answer; `max_retry_limit` (default 2) caps retries; `max_rpm` and `max_execution_time` default to unlimited, so rate and duration are unbounded unless set. Code execution is off by default and `code_execution_mode` defaults to \"safe\" (Docker) — both now deprecated, with sandboxing pushed to E2B or Modal. At the task level `human_input` blocks completion pending human review of the final answer, and guardrails validate output either by a Python function returning (bool, Any) or by an LLM judging a natural-language criterion; a failed guardrail returns the error to the agent, which retries up to `guardrail_max_retries` (default 3). Notably the retry loop is agent-to-agent with no human in it — human_input is the only blocking human gate, and there is no documented spend cap or kill switch.","maintainer":"CrewAI, Inc.","open_source":"yes","status":"active","languages":["Python"]},"sources":[{"url":"https://docs.crewai.com/en/concepts/agents","title":"CrewAI Docs — Agents","accessed":"2026-09-10","supports":["agent_model","human_controls"]},{"url":"https://docs.crewai.com/en/concepts/tasks","title":"CrewAI Docs — Tasks","accessed":"2026-09-10","supports":["human_controls"]},{"url":"https://github.com/crewAIInc/crewAI","title":"CrewAI — repository","accessed":"2026-09-10","supports":["license","languages","open_source","agent_model"]}],"current":["2.1","2.3","2.5","3.1","5.1"],"suggested":["2.3","11.3","3.1"],"suggested_more":["2.2","2.6","2.1","4.1","8.1","5.2","5.4","14.1","10.5","1.2","2.7"],"claims":[],"derived_topics":{}},{"id":"resource:tool:gpt-researcher","title":"GPT Researcher","abstract":"An autonomous research agent that plans queries, scrapes and aggregates twenty or more sources, and writes a cited report. Widely used, and ships essentially no oversight surface — which is the interesting fact about it.","authors":[],"date":"","url":"https://github.com/assafelovic/gpt-researcher","type":"code-tool","doi":"","arxiv":"","repo":"https://github.com/assafelovic/gpt-researcher","tool":{"agent_model":"The agent researches autonomously end to end: it browses and scrapes the web with JavaScript enabled, aggregates over twenty sources, reads local documents, reaches external systems through MCP — \"GitHub repositories, databases, and custom APIs\" — and writes report files out to PDF and Word.","human_controls":"Almost none are documented, and the omission is the finding. No search or iteration ceiling, no approval step, no domain allowlist, no mandatory review before a report is produced. Docker is available but not required, so sandboxing is the operator's choice. The only quantified bound is economic and advisory rather than enforced: deep research is documented as costing around $0.40 per run. The project describes itself as experimental and \"as-is without any warranty\". A widely adopted agent that spends money and reaches arbitrary web and API endpoints with no ceiling is a useful data point for section 2.5.","maintainer":"Assaf Elovic","open_source":"yes","status":"active","languages":["Python"]},"sources":[{"url":"https://github.com/assafelovic/gpt-researcher","title":"GPT Researcher — repository and README","accessed":"2026-09-10","supports":["agent_model","human_controls","license","languages","maintainer"]}],"current":["2.5","8.2","9.2"],"suggested":["16.4","12.5"],"suggested_more":["4.4","1.3","15.2","12.4","11.14","11.11","16.1","13.2","14.3","4.1","4.5","8.3"],"claims":[],"derived_topics":{}},{"id":"resource:tool:kikubot","title":"Kikubot","abstract":"An email-driven multi-agent framework in Go where each agent is an autonomous inbox and agents coordinate by emailing one another. Notable for shipping sender allowlists, container isolation and watchdog timers as documented features rather than deployment advice.","authors":[],"date":"","url":"https://github.com/mxaiorg/kikubot","type":"code-tool","doi":"","arxiv":"","repo":"https://github.com/mxaiorg/kikubot","tool":{"agent_model":"Each agent is an autonomous mailbox; a coordinator agent delegates to specialists, and agents collaborate by emailing each other. They act on the outside world through IMAP/SMTP, Salesforce, Buffer, WordPress, Box, Xero, web search and bash execution, plus local or remote MCP servers. That is an unusually wide external surface for a small project — an agent here can email, post, update a CRM and touch accounting records.","human_controls":"The strongest control is on who may address an agent at all: whitelist and blacklist modes restrict senders by domain or address, which bounds the instruction surface rather than the action surface. Integrations use scoped API keys. Agents run in containers — \"no risk of AI agents running on user machines\" — and each has an isolated knowledge base. Watchdog timers stop stuck recurring tasks, and snoozing tools are stripped during scheduled replays. No approval gate before an agent sends outbound mail or writes to a connected system is documented, and no spend control.","maintainer":"mxHERO Labs","open_source":"yes","status":"active","languages":["Go"]},"sources":[{"url":"https://github.com/mxaiorg/kikubot","title":"Kikubot — repository and README","accessed":"2026-09-10","supports":["agent_model","human_controls","license","languages","maintainer"]}],"current":["2.2","5.1","5.3","9.2","11.6"],"suggested":["1.1","11.4"],"suggested_more":["11.9","5.2","9.4","10.5","12.4","7.3","11.14","2.4","16.1","15.6","6.1","14.4"],"claims":[],"derived_topics":{}},{"id":"resource:tool:meta-ads-kit","title":"Meta Ads Kit","abstract":"An agent kit that operates live Meta advertising accounts — pausing, resuming and adjusting budgets on real campaigns. The clearest case in the mirror of an agent with direct spend authority, and it answers that with approval gates and a dry-run default rather than with limits.","authors":[],"date":"","url":"https://github.com/TheMattBerman/meta-ads-kit","type":"code-tool","doi":"","arxiv":"","repo":"https://github.com/TheMattBerman/meta-ads-kit","tool":{"agent_model":"The agent works against real ad accounts through Meta's official Ads CLI and can \"take action — pause, resume, adjust budgets\" on live campaigns. That is unmediated authority over spend, which almost nothing else in the mirror claims.","human_controls":"Approval before anything that moves money: the agent \"asks before taking any spend-impacting action\", described as \"always with your approval\". A mock mode runs the whole loop without real API calls, a read-only mode allows reporting without action, and uploads are dry-run-first with new ads created PAUSED rather than live. The gap is that these are conventions of the loop, not enforced ceilings: there is no documented per-action spend cap, no rollback procedure if an approval is given in error, no audit log of who approved what, and the API token permission scopes required are unspecified.","maintainer":"Matt Berman","open_source":"yes","status":"active","languages":["Python"]},"sources":[{"url":"https://github.com/TheMattBerman/meta-ads-kit","title":"Meta Ads Kit — repository and README","accessed":"2026-09-10","supports":["agent_model","human_controls","license","maintainer"]}],"current":["2.1","2.5","8.1","9.2"],"suggested":["8.1","1.1"],"suggested_more":["4.1","4.5","11.9","2.1","2.5","2.3","14.3","2.7","2.2","16.4","9.4","10.6"],"claims":[],"derived_topics":{}},{"id":"resource:tool:mue-x","title":"MUE-X","abstract":"A self-modifying agent that rewrites its own source at the AST level, published by an organisation that describes itself as run by AI agents. The oversight model is an immutable kernel the agent may not touch — a boundary drawn inside the system rather than around it.","authors":[],"date":"","url":"https://github.com/KorroAi/mue-x","type":"code-tool","doi":"","arxiv":"","repo":"https://github.com/KorroAi/mue-x","tool":{"agent_model":"The agent modifies itself: it \"reads its own brain, generates mutations, validates them, and applies them\" through six AST-level strategies — repair, optimize, explore, exploit, innovate, prune. It absorbs GitHub repositories every seven cycles and self-reflects without user prompting. This is the strongest autonomy claim in the batch, and the only one where the artefact under change is the agent itself.","human_controls":"Control is architectural rather than procedural. Protected kernel modules \"cannot be modified\" by the agent, which is a boundary drawn inside the system rather than a gate a person stands at. Five security layers are documented, including backups, import validation, a SecurityGuard blocking dangerous bash commands, and audit logging. Steering is by CLI command. There is no human approval step before a mutation is applied — the agent validates its own changes, which makes the protected kernel the whole of the containment story.","maintainer":"KorroAi","open_source":"yes","status":"active","languages":["Python"]},"sources":[{"url":"https://github.com/KorroAi/mue-x","title":"MUE-X — repository and README","accessed":"2026-09-10","supports":["agent_model","human_controls","license","languages","maintainer"]}],"current":["2.5","2.7","6.2","11.6"],"suggested":["1.1","4.1"],"suggested_more":["16.2","11.4","3.3","2.1","1.2","13.2","14.4","7.1","10.6","13.1","7.4","11.9"],"claims":[],"derived_topics":{}},{"id":"resource:tool:onemancompany","title":"OneManCompany","abstract":"A browser-based platform for running a company staffed by AI employees in named roles — EA, HR, COO, engineers, QA — with the CEO seat reserved for a human. Quality gates are claimed at every level; the enforcement behind them is not documented.","authors":[],"date":"","url":"https://github.com/1mancompany/OneManCompany","type":"code-tool","doi":"","arxiv":"","repo":"https://github.com/1mancompany/OneManCompany","tool":{"agent_model":"Agents fill organisational roles in a hierarchy — the CEO seat is human-only and everything below it may be an agent. They execute tasks through hierarchical delegation, hold multi-agent meetings, access tools, execute code, and iterate on deliverables under version control. The org chart is the authority structure, which makes this a direct instance of what section 3 is about.","human_controls":"The documentation claims \"quality gates at every level\", CEO review of file change diffs before batch approval, task review before completion, and a spectrum from \"hands-off\" to \"full micromanagement\". What it does not document is how any of that is enforced: no budget caps or spending limits, no audit-log specification, no kill switch, no rate limiting on autonomous action. Human oversight is assumed at the workflow level rather than enforced at the infrastructure level — which is the distinction section 2.5 exists to draw, and makes this a useful negative example.","maintainer":"1manCompany","open_source":"yes","status":"active","languages":["Python","JavaScript"]},"sources":[{"url":"https://github.com/1mancompany/OneManCompany","title":"OneManCompany — repository and README","accessed":"2026-09-10","supports":["agent_model","human_controls","license","languages","maintainer"]}],"current":["3.1","3.2","6.1","2.4"],"suggested":["4.1","3.1","12.1","11.7"],"suggested_more":["12.4","11.11","13.3","5.3","7.3","1.1","4.2","16.3","9.4","16.2"],"claims":[],"derived_topics":{}},{"id":"resource:tool:paperclip","title":"Paperclip","abstract":"An open-source Node.js and React application for orchestrating teams of AI agents against business goals, with org charts, per-agent budgets, and approval gates. Users bring their own agents from any provider.","authors":[],"date":"2026-03-02","url":"https://paperclip.ing","type":"code-tool","doi":"","arxiv":"","repo":"https://github.com/paperclipai/paperclip","tool":{"agent_model":"Agents are managed workers arranged in an org chart — described as employees that wake on scheduled \"heartbeats\", execute assigned work, and go dormant between runs. They do not set direction or hold budget authority; the documentation places humans in the role of the board of directors.","human_controls":"Human approval required before an agent is hired and before an agent executes a strategy. Per-agent and per-project budgets that auto-pause execution when limits are hit. Any agent can be paused, resumed, overridden, reassigned, or terminated. Full run transcripts and per-agent cost tracking.","maintainer":"Paperclip Labs, Inc.","open_source":"yes","self_hostable":"yes","model_agnostic":"yes","status":"active","languages":["TypeScript"]},"sources":[{"url":"https://docs.paperclip.ing/guides/org/agents/","title":"Paperclip Docs — Agents","accessed":"2026-08-07","supports":["agent_model"]},{"url":"https://github.com/paperclipai/paperclip","title":"Paperclip — repository","accessed":"2026-08-07","supports":["license","languages","open_source","launched"]},{"url":"https://paperclip.ing/","title":"Paperclip — product site","accessed":"2026-08-07","supports":["agent_model","human_controls","self_hostable","maintainer"]}],"current":["2.2","3.1","3.2","4.1","8.1","8.4","9.2"],"suggested":["4.1","6.5"],"suggested_more":["7.4","10.6","8.1","2.5","11.2","8.2","1.4","3.3","9.4","7.1","8.4","14.2"],"claims":[],"derived_topics":{}}]}</script>
<script>
(() => {
  "use strict";
  const DATA = JSON.parse(document.getElementById("graph").textContent);
  const TOPICS = new Map(DATA.topics.map(t => [t.code, t]));
  const KEY = "aocommons.filing.v1";

  const THEME_KEY = "aocommons.theme";
  function applyTheme(mode) {
    document.documentElement.setAttribute("data-theme", mode);
    const button = document.getElementById("theme");
    if (button) button.textContent = mode === "dark" ? "Light" : "Dark";
    try { localStorage.setItem(THEME_KEY, mode); } catch (e) { /* private browsing */ }
  }
  // No stored choice means follow the laptop. Once someone picks, their pick
  // wins and keeps winning — the OS is a default, not an override.
  const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  let theme = prefersDark ? "dark" : "light";
  try { theme = localStorage.getItem(THEME_KEY) || theme; } catch (e) { /* default holds */ }

  const state = {
    mode: "explore",
    cursor: 0,
    picked: new Set(),
    open: new Set(),
    focusTopic: null,
    author: null,
    viewing: null,
    add: { raw: "", id: null, fields: {}, resolved: null, looking: false, picked: new Set(), topics: false },
    showAll: false,
    unsure: false,
    note: "",
    noteOpen: false,
    decisions: {},
    // Verdicts on extracted claims. Kept apart from `decisions` the whole way
    // through, because they answer a different question and are measured
    // against a different thing.
    claims: {},
    // Statements a reviewer wrote themselves, keyed by record. Held apart from
    // verdicts: one is a judgment on a machine's reading, the other is a new
    // reading of the paper, and they enter the corpus by different doors.
    newClaims: {},
    addingTo: null,
    draft: null,
    sent: [],
  };

  // Work other people have already had merged. Fetched same-origin, so it
  // resolves on Pages and simply stays empty anywhere else — there is no
  // shared server behind this page, and pretending otherwise would be worse
  // than the gap.
  const merged = new Map();

  // What the group has already sent in. The repository is public, so its
  // issues are readable without a token and without anyone signing in —
  // which is why there is no login here: a login would gate something that
  // is already public, and make contributing feel like joining.
  const submissions = { state: "idle", items: [], read: 0 };

  function loadSubmissions(force) {
    // Unauthenticated GitHub allows sixty reads an hour per address, and this
    // runs again every time someone comes back from a GitHub tab. Throttled so
    // that flicking between tabs cannot spend the hour's budget — the floor
    // holds even when a check was asked for explicitly.
    const now = Date.now();
    if (now - submissions.read < (force ? 3000 : 20000)) return;
    submissions.read = now;
    submissions.state = submissions.state === "idle" ? "loading" : submissions.state;

    fetch("https://api.github.com/repos/AO-Commons/knowledge-graph/issues"
          + "?state=all&per_page=60&sort=created&direction=desc",
          { headers: { Accept: "application/vnd.github+json" } })
      .then(response => (response.ok ? response.json() : Promise.reject(response.status)))
      .then(issues => {
        submissions.state = "ready";
        submissions.items = issues
          .filter(issue => !issue.pull_request)
          .map(issue => ({
            number: issue.number,
            title: issue.title,
            who: issue.user && issue.user.login,
            createdAt: issue.created_at || "",
            when: (issue.created_at || "").slice(0, 10),
            open: issue.state === "open",
            url: issue.html_url,
            kind: (issue.labels || []).map(l => l.name)
              .find(n => ["filing", "new-resource", "taxonomy"].includes(n)) || "other",
          }));
        if (confirmSends() || state.mode === "export") renderStage();
      })
      .catch(() => {
        // Being unable to show the history is not a reason to block filing.
        submissions.state = "unavailable";
        if (state.mode === "export") renderStage();
      });
  }


  // Coming back from GitHub is the only signal this page gets that a trip
  // happened at all, so it is the moment to look for the issue.
  window.addEventListener("focus", () => {
    if (!state.sent.some(entry => !entry.number)) return;
  
    // GitHub's list can lag the submit by a second or two, and the person is
    // usually back here before it catches up. One follow-up covers that
    // without turning this into a poller.
    setTimeout(() => {
      if (state.sent.some(entry => !entry.number)) loadSubmissions(true);
    }, 6000);
  });
  // A 404 here is the normal case and is caught below; browsers still log the
  // failed request, which is noise rather than a fault.
  fetch("gold.json")
    .then(r => (r.ok ? r.json() : null))
    .then(payload => {
      if (!payload) return;
      Object.entries(payload.records || {}).forEach(([id, d]) =>
        merged.set(id, { topics: d.topics || [], on: d.reviewed_on || "", by: d.reviewer || "merged" }));
      if (merged.size) { renderStage(); renderTree(); }
    })
    .catch(() => { /* absent is the normal case */ });

  // ---- persistence -------------------------------------------------------
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
    state.decisions = saved.decisions || {};
    state.claims = saved.claims || {};
    state.newClaims = saved.newClaims || {};
    state.sent = Array.isArray(saved.sent) ? saved.sent : [];
  } catch (e) { /* corrupt or unavailable storage should not block filing */ }

  const save = () => {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        decisions: state.decisions, claims: state.claims,
        newClaims: state.newClaims, sent: state.sent,
      }));
    } catch (e) { /* private browsing; the session still works, export still offered */ }
  };

  // ---- helpers -----------------------------------------------------------
  const ancestors = code => {
    const parts = code.split(".");
    return parts.slice(0, -1).map((_, i) => parts.slice(0, i + 1).join("."));
  };
  const el = (tag, props = {}, kids = []) => {
    const node = Object.assign(document.createElement(tag), props);
    (Array.isArray(kids) ? kids : [kids]).forEach(k =>
      node.append(k instanceof Node ? k : document.createTextNode(k)));
    return node;
  };
  const samePerson = name => name.toLowerCase().replace(/[.'`-]/g, "").replace(/\s+/g, " ").trim();
  // A real popover rather than the browser's `title`. The native one waits a
  // second, cannot be styled, and truncates anything the length of an
  // explanation — which meant every one of these read as decoration that did
  // nothing. Takes a string or several, so an explanation can have paragraphs.
  let tipCount = 0;
  const info = (...parts) => {
    const wrap = el("span", { className: "info-wrap" });
    const mark = el("button", { className: "info", type: "button" }, "i");
    const tip = el("span", { className: "tip" });
    parts.flat().forEach(part => tip.append(el("span", { className: "tip-p" }, part)));

    tip.id = "tip-" + (++tipCount);
    tip.setAttribute("role", "tooltip");
    mark.setAttribute("aria-label", "What this means");
    mark.setAttribute("aria-describedby", tip.id);

    // Flip when it would run off the right edge — measured on open rather
    // than guessed, because these sit at every width in the layout.
    const place = () => {
      tip.classList.remove("flip");
      if (tip.getBoundingClientRect().right > window.innerWidth - 14) tip.classList.add("flip");
    };
    mark.addEventListener("mouseenter", place);
    mark.addEventListener("focus", place);
    // Tapping works too: on a touch screen there is no hover at all.
    mark.addEventListener("click", event => {
      event.preventDefault();
      wrap.classList.toggle("open");
      place();
    });
    wrap.append(mark, tip);
    return wrap;
  };
  const trailOf = code => ancestors(code).map(c => TOPICS.get(c)?.title).filter(Boolean).join(" › ");

  // Counts combine what the corpus already claims with what you have filed,
  // so the tree fills as you work rather than only after a rebuild.
  const counts = () => {
    const tally = new Map();
    const bump = code => {
      if (!TOPICS.has(code)) return;
      tally.set(code, (tally.get(code) || 0) + 1);
      ancestors(code).forEach(a => tally.set(a, (tally.get(a) || 0) + 1));
    };
    DATA.records.forEach(r => {
      const filed = state.decisions[r.id];
      (filed ? filed.topics : r.current).forEach(bump);
    });
    return tally;
  };

  const reviewed = () => Object.keys(state.decisions).length;

  // How many people have filed an opinion on a record: whatever has been
  // merged, plus your own if you have one. A count of nothing is the useful
  // case — it says where the group has not been yet.
  function reviewCount(id) {
    return (merged.has(id) ? 1 : 0) + (state.decisions[id] ? 1 : 0);
  }

  function reviewCell(record) {
    const n = reviewCount(record.id);
    const cell = el("div", { className: "reviews" });
    cell.append(el("span", { className: "count" + (n ? " some" : "") },
      n === 0 ? "no reviews yet" : `${n} review${n === 1 ? "" : "s"}`));
    const button = el("button", { className: "btn" },
      state.decisions[record.id] ? "Change your review" : "Review this resource");
    button.addEventListener("click", () => { setMode("review"); openRecord(record); });
    cell.append(button);
    return cell;
  }

  // ---- the tree ----------------------------------------------------------
  // Two separate affordances on one row: the chevron opens the branch, the
  // label selects it. The first version had only the former, and a leaf did
  // nothing at all when clicked — which is why the whole pane read as a
  // static list rather than navigation.
  function renderTree() {
    const tally = counts();
    const host = document.getElementById("tree");
    host.textContent = "";

    const lit = new Set();
    state.picked.forEach(c => { lit.add(c); ancestors(c).forEach(a => lit.add(a)); });
    if (state.focusTopic) { lit.add(state.focusTopic); ancestors(state.focusTopic).forEach(a => lit.add(a)); }

    const max = Math.max(1, ...[...tally.values()]);
    const hasKids = code => DATA.topics.some(t => t.parent === code);

    DATA.topics.forEach(topic => {
      if (topic.depth > 0 && !state.open.has(topic.section)) return;
      if (topic.depth > 1 && !state.open.has(topic.parent)) return;

      const n = tally.get(topic.code) || 0;
      const row = el("div", { className: "row" + (lit.has(topic.code) ? " lit" : "") });
      row.style.paddingLeft = (10 + topic.depth * 14) + "px";

      const expandable = hasKids(topic.code);
      const twist = el("button", { className: "twist" + (expandable ? "" : " leaf") }, "▶");
      twist.setAttribute("aria-expanded", String(state.open.has(topic.code)));
      twist.setAttribute("aria-label", (state.open.has(topic.code) ? "Collapse " : "Expand ") + topic.code);
      if (expandable) {
        twist.addEventListener("click", event => {
          event.stopPropagation();
          state.open.has(topic.code) ? state.open.delete(topic.code) : state.open.add(topic.code);
          renderTree();
        });
      }

      const node = el("button", { className: "node" + (topic.depth === 0 ? " section" : "") });
      node.title = topic.points.length ? topic.points.join(" · ") : topic.title;
      node.append(
        el("span", { className: "label" }, [el("span", { className: "code" }, topic.code), topic.title]),
        el("span", { className: "count" + (n ? " has" : (topic.depth === 0 ? " gap" : "")) },
           n ? String(n) : (topic.depth === 0 ? "0" : "")),
      );
      node.addEventListener("click", () => focusBranch(topic.code));

      row.append(twist, node);
      host.append(row);

      if (n && topic.depth === 0) {
        const bar = el("div", { className: "bar" });
        bar.style.width = Math.max(6, (n / max) * 100) + "%";
        bar.style.marginLeft = "28px";
        host.append(bar);
      }
    });

    renderReady();

    const covered = DATA.topics.filter(t => (tally.get(t.code) || 0) > 0).length;
    document.getElementById("filled").textContent = `${covered}/${DATA.topics.length} filed`;
    document.getElementById("meter").style.width =
      ((reviewed() / DATA.records.length) * 100) + "%";
  }

  // Records that can take the whole exercise: they have statements to check as
  // well as a place in the tree. Listed above the taxonomy because they are
  // worth more than an untagged record — a reviewer's hour spent here produces
  // two kinds of judgment instead of one, and the group should be steered
  // toward them rather than left to find them by chance.
  function renderReady() {
    const host = document.getElementById("ready");
    host.textContent = "";
    const ready = DATA.records.filter(r => (r.claims || []).length);
    if (!ready.length) return;

    // Done means every statement is judged, and nothing else. It used to also
    // require the record to be filed under a topic — which was fair when the
    // reviewer was asked for both, and became unreachable when filing left
    // this screen. A paper could be finished, drop out of the queue, and
    // still sit here at "6 of 6 open": two counters on one screen
    // contradicting each other, with the wrong one in the heading.
    const progress = record => {
      const claims = record.claims || [];
      const checked = claims.filter(isJudged).length;
      return { checked, total: claims.length };
    };
    // Unfinished first — a list whose top is work already done is a list
    // nobody reads twice.
    const done = p => p.total > 0 && p.checked === p.total;
    const ordered = [...ready].sort((a, a2) => {
      const x = progress(a), y = progress(a2);
      return (done(x) - done(y)) || (y.total - x.total);
    });

    const outstanding = ordered.filter(r => !done(progress(r))).length;

    host.append(el("div", { className: "tree-head" }, [
      el("h2", {}, "Golden-set review"),
      el("span", { className: "filled" }, `${outstanding} of ${ready.length} open`),
    ]));

    ordered.forEach(record => {
      const p = progress(record);
      const complete = done(p);
      const row = el("button", { className: "ready-row" + (complete ? " done" : "") });
      row.title = "This one has statements, so a reviewer can check what it actually "
        + "says rather than only where it goes.";
      row.append(
        el("span", { className: "t" }, shorten(record.title, 66)),
        el("span", { className: "s" },
           complete ? "done" : `${p.checked}/${p.total}`),
      );
      row.addEventListener("click", () => { setMode("review"); openRecord(record); });
      host.append(row);
    });
  }

  // Cutting at a fixed count leaves "…Melting P" and "…physical, socia", which
  // reads as a rendering fault rather than as a title that did not fit.
  function shorten(text, limit) {
    if (text.length <= limit) return text;
    const cut = text.slice(0, limit);
    const space = cut.lastIndexOf(" ");
    return (space > limit * 0.6 ? cut.slice(0, space) : cut).replace(/[\s,;:.\-]+$/, "") + "…";
  }

  // Selecting a branch narrows the queue. This is how a group divides the
  // work without a server telling anyone what to do: take a section, and the
  // records you see are the ones that branch plausibly covers.
  function focusBranch(code) {
    state.focusTopic = state.focusTopic === code ? null : code;
    state.cursor = 0;
    ancestors(code).forEach(a => state.open.add(a));
    renderStage(); renderTree();
  }

  // ---- review ------------------------------------------------------------
  function inBranch(record, code) {
    const under = t => t === code || t.startsWith(code + ".");
    return record.current.some(under) || record.suggested.some(under);
  }

  // A paper is finished when every statement on it has been judged, not when
  // somebody pressed a button. Filing is gone, so there is no other signal —
  // and this one is true rather than declared.
  function outstanding(record) {
    const claims = record.claims || [];
    return claims.filter(c => !isJudged(c)).length;
  }

  function queue() {
    let pending = DATA.records.filter(r => !merged.has(r.id) && outstanding(r) > 0);
    if (state.focusTopic) pending = pending.filter(r => inBranch(r, state.focusTopic));
    // Most outstanding first, so the queue drains rather than scattering
    // half-finished papers behind it.
    return [...pending].sort((a, b) => outstanding(b) - outstanding(a));
  }

  // A verdict changed, so everything that counts verdicts redraws: the card,
  // and the paper list beside it. Three handlers redrew only the card, which
  // left a reviewer who had just finished a paper looking at "0/7" in the
  // list next to it and "6 of 6 open" in the heading above that — the work
  // was recorded, and the only two places showing progress both denied it.
  function verdictChanged() {
    save();
    renderReview();
    renderTree();
  }

  function renderReview() {
    const stage = document.getElementById("stage");
    stage.textContent = "";
    const pending = queue();

    if (!pending.length) {
      // Said in terms of the work actually done. A golden-set reviewer files
      // no topics at all, and being told they had filed 0 records after
      // judging thirty-two statements read as though none of it counted.
      const judged = judgedTotal();
      const filed = reviewed();
      const did = [];
      if (judged) did.push(`${judged} statement${judged === 1 ? "" : "s"}`);
      if (filed) did.push(`${filed} record${filed === 1 ? "" : "s"}`);
      stage.append(
        el("h2", {}, judged ? "That is the whole set." : "Everything here is filed."),
        el("p", { className: "empty" }, did.length
          ? `You judged ${did.join(" and ")}. Open Submit to send it in.`
          : "There is nothing left to check here."),
      );
      return;
    }

    const record = currentRecord();
    if (!record) { advance(); return; }
    const already = state.decisions[record.id];
    const claimCount = (record.claims || []).length;
    const kicker = el("div", { className: "kicker" }, [
      el("span", {}, record.type.replace(/-/g, " ")),
      el("span", {}, record.date || "undated"),
      el("span", {}, `${pending.length} left`),
      ...(claimCount
        ? [el("span", { className: "flag" },
             `${claimCount} statement${claimCount === 1 ? "" : "s"} to check`)]
        : []),
    ]);

    const title = el("h1", { className: "record-title" }, record.title);
    const byline = el("p", { className: "byline" });
    if (record.authors.length) {
      byline.append(record.authors.slice(0, 5).join(", ")
        + (record.authors.length > 5 ? ` and ${record.authors.length - 5} more` : ""));
    }
    if (record.url) {
      byline.append(byline.textContent ? " · " : "");
      byline.append(el("a", { href: record.url, target: "_blank", rel: "noopener" }, "read the source"));
    }

    const abstract = record.abstract
      ? el("p", { className: "abstract" }, record.abstract)
      : el("p", { className: "abstract none" }, "No abstract available. Judge from the title and source, or skip — a guess here is worse than a gap.");

    if (state.focusTopic) stage.append(branchChip());
    stage.append(kicker, title, byline, abstract);
    const profile = toolProfile(record);
    if (profile) stage.append(profile);

    // Everything that wants a decision lives in one marked block, so a
    // contributor can see where to act without reading first.
    const ask = el("div", { className: "ask" });
    const hasClaims = !!(record.claims && record.claims.length);

    // Statements come first where there are any, and the filing question
    // changes shape depending on whether they exist.
    //
    // Filing used to be the whole of this screen and the first thing asked.
    // That is the wrong question in the wrong order: naming what a paper is
    // "about" before anything has said what it contains is guesswork, and
    // the corpus shows it — two thirds of filed records carry more than one
    // code because one was never the whole truth.
    if (hasClaims) ask.append(claimPanel(record));

    // The filing question is gone. Naming what a paper is "about" is now
    // derived from the concepts on its statements — see docs/statements-first.md
    // — and asking a reviewer for it as well was asking them to redo, from an
    // abstract, a judgment the statements make better. Their time is worth
    // more on the statements themselves, which is the one thing here no
    // machine does.
    if (!hasClaims) {
      ask.append(el("p", { className: "hint", style: "margin-top:18px" },
        "No statements have been extracted from this one yet, so there is nothing here "
        + "to check. It is waiting on extraction, not on you."));
    }

    // Navigation, not a decision. Each statement is judged on its own card
    // and saved as it is judged, so there is nothing left to submit at the
    // record level — and a button implying otherwise would be asking for a
    // confirmation that means nothing.
    const judged = (record.claims || []).filter(isJudged).length;

    // Submit goes to Submit. Somebody reviewing one paper and stopping is
    // the normal case, not the exception, and leaving them on a "next paper"
    // button meant the work sat in a browser until they found the tab that
    // sends it — which is the one step between doing the work and the work
    // counting for anything.
    const submit = el("button", { className: "btn primary" }, "Submit");
    submit.disabled = !judgedTotal();
    submit.title = judgedTotal()
      ? "Opens Submit with everything you have judged, ready to send."
      : "Judge at least one statement first.";
    submit.addEventListener("click", () => {
      state.viewing = null;
      loadSubmissions(false);
      setMode("export");
    });

    const next = el("button", { className: "btn" }, "Next paper");
    next.addEventListener("click", () => { state.viewing = null; advance(); });

    ask.append(el("div", { className: "actions" }, [
      submit, next,
      el("span", { className: "hint" },
         judged && hasClaims && judged === record.claims.length
           ? "This paper is done."
           : `${judgedTotal()} statement${judgedTotal() === 1 ? "" : "s"} judged by you`),
    ]));
    stage.append(ask);

    stage.append(ledger());
  }

  function branchChip() {
    const topic = TOPICS.get(state.focusTopic);
    const clear = el("button", { title: "Show every record again" }, "×");
    clear.addEventListener("click", () => focusBranch(state.focusTopic));
    return el("div", { className: "branch-chip" },
      [`Working through ${state.focusTopic} · ${topic ? topic.title : ""}`, clear]);
  }

  // The audit trail. Everything filed, newest first, so a group can see what
  // has already been covered instead of duplicating each other.
  function ledger() {
    // Whose work this is, and — for your own — whether it has left the browser.
    // Someone filing for an hour deserves to see that from here rather than
    // having to open Submit to find out.
    const sent = new Set(state.sent
      .filter(entry => entry.kind === "filing" && entry.number)
      .flatMap(entry => entry.records || []));
    const rows = [
      ...Object.entries(state.decisions).map(([id, d]) =>
        ({ id, ...d, by: sent.has(id) ? "you · sent" : "you · not sent yet" })),
      ...[...merged.entries()].map(([id, d]) => ({ id, ...d })),
    ].sort((a, b) => (b.on || "").localeCompare(a.on || ""));

    const wrap = el("div", { className: "ledger" });
    wrap.append(el("p", { className: "section-label" },
      `Filed so far — ${rows.length} record${rows.length === 1 ? "" : "s"}`));

    if (!rows.length) {
      wrap.append(el("p", { className: "empty" }, "Nothing filed yet. Yours will appear here as you go."));
      return wrap;
    }

    const table = el("table");
    table.append(el("tr", {}, [
      el("th", {}, "Record"), el("th", {}, "Filed under"), el("th", {}, "By"), el("th", {}, "When"),
    ]));
    rows.slice(0, 60).forEach(r => {
      const record = DATA.records.find(x => x.id === r.id);
      const title = (record ? record.title : r.id).slice(0, 76);
      let cell;
      if (record && state.decisions[r.id]) {
        const back = el("button", { className: "more" }, title);
        back.title = "Open this again and change it";
        back.addEventListener("click", () => { setMode("review"); openRecord(record); });
        cell = el("td", {}, back);
      } else {
        cell = el("td", {}, title);
      }
      table.append(el("tr", {}, [
        cell,
        r.topics.length
          ? el("td", { className: "codes" },
              r.topics.join("  ") + (r.unsure ? "  (unsure)" : ""))
          : el("td", { className: "codes none" },
              r.verdict === "out-of-scope" ? "out of scope"
                : r.verdict === "no-topic-fits" ? "nothing fits" : "none apply"),
        el("td", { className: "by" }, r.by || "—"),
        el("td", { className: "when" }, r.on || ""),
      ]));
    });
    wrap.append(el("div", { className: "ledger-wrap" }, table));
    if (rows.length > 60) wrap.append(el("p", { className: "empty" }, `…and ${rows.length - 60} more.`));
    return wrap;
  }

  // ---- claims ------------------------------------------------------------
  // A paper is a container; the answerable things are the statements inside
  // it. These were read out of the abstract by a model and are worth exactly
  // nothing until a person has checked them against the quoted sentence —
  // which is why the sentence is shown, and why checking one takes seconds.

  // Three actions, because a reviewer is deciding what the library should
  // hold, not filling in a diagnostic form. The old set asked for a
  // classification — accurate, overstated, not-in-source, can't tell — which
  // is a useful signal about the extractor and a slow way to fix a sentence.
  // Adjusting is now the middle path it was missing: most statements that
  // are not right are not wrong either, they are a hedge away from right.
  const VERDICTS = [
    ["accurate", "Add as is",
     "The statement says what the quoted sentence says, no more."],
    ["adjusted", "Adjust",
     "Nearly right. Edit the wording and it goes in as yours — which is faster "
     + "than describing what is wrong and waiting for somebody to fix it."],
    ["not-in-source", "Remove",
     "The paper does not say this. Either the quote does not support it, or the "
     + "quote itself is wrong."],
  ];

  // All five, because the one that was missing is the one that most needs
  // saying. A `background` statement fell through to the raw value with no
  // explanation, so a reviewer got less help on exactly the type where the
  // hardest question lives — background is usually somebody else's result,
  // and the thing to check is whether it is credited to them.
  const CLAIM_KINDS = {
    finding: ["finding", "Something the work reports as observed or measured."],
    position: ["position", "An argument or recommendation, offered without evidence here. "
               + "\"Agents with budget caps overspent less in our trials\" and \"agents "
               + "should have budget caps\" look alike in an abstract and answer different "
               + "questions — one is evidence, the other is advocacy."],
    method: ["method", "A technique or mechanism the work introduces."],
    background: ["background", "An assertion about the state of the field or about prior "
                 + "work, rather than about this paper's own contribution. Usually somebody "
                 + "else's result, routinely asserted without evidence, and it dates badly — "
                 + "so the thing to check is whether it is credited to whoever actually "
                 + "showed it."],
    limitation: ["limitation", "A boundary the authors put on their own result. Rare in "
                 + "abstracts and disproportionately useful, because it is the part a "
                 + "downstream reader is most likely to drop."],
  };

  // Re-tag an edited statement from its own words.
  //
  // Word overlap against concept labels, scored so that a longer label
  // matching fully beats a short one matching by accident — "agent
  // reputation systems" against a sentence about reputation should win over
  // "reputation" alone. Deliberately simple and deliberately local: the
  // point is that the tags visibly track the wording while somebody types,
  // so an edit that changes the subject cannot silently keep the old tag.
  //
  // It proposes, and only for statements a person is editing. Tags on
  // unedited statements are left exactly as extracted.
  const STOPWORDS = new Set(["the","a","an","of","to","in","for","and","or","is","are",
    "was","were","be","been","that","this","it","its","as","by","on","with","not","no",
    "than","from","their","them","they","which","when","what","how","do","does","can"]);

  function words(text) {
    return new Set((text || "").toLowerCase().match(/[a-z]{3,}/g) || []);
  }

  function retag(claim, text) {
    const said = words(text);
    if (!said.size) return;
    const scored = [];
    Object.entries(DATA.concepts || {}).forEach(([id, concept]) => {
      const label = [...words(concept.label)].filter(w => !STOPWORDS.has(w));
      if (!label.length) return;
      const hit = label.filter(w => said.has(w)).length;
      if (!hit) return;
      // Proportion of the label matched, so a full match on a specific term
      // outranks one word of a vague one.
      scored.push([hit / label.length, hit, id]);
    });
    scored.sort((a, b) => b[0] - a[0] || b[1] - a[1]);
    const picked = scored.filter(s => s[0] >= 0.5).slice(0, 2).map(s => s[2]);
    // A suggestion is added to the extracted tags, never swapped for them.
    //
    // The extracted tags come from a model that read the paper; these come
    // from counting words, which is much weaker evidence and does not get to
    // overrule the stronger kind. Swapping was the first version and it was
    // wrong in the ordinary case: rewording "the binding constraint is
    // shifting from capability to coexistence" kept the subject intact but
    // dropped `endogenous-non-stationarity` — which no word in either version
    // matches — for two tags that happened to share the word "capability"
    // with a sentence arguing capability is not the constraint.
    const entry = state.claims[claim.id];
    const kept = claim.concepts || [];
    entry.suggested = picked.filter(id => !kept.includes(id));
    entry.concepts = [...kept, ...entry.suggested].slice(0, 3);
  }

  // A statement is judged when its verdict is settled — which for an
  // adjustment means the wording was confirmed, not merely typed. Counting
  // a half-rewritten sentence as done would have the progress bar tell
  // somebody they had finished a paper they were still in the middle of.
  function settledVerdict(entry, claim) {
    if (!entry) return !!(claim && claim.verdict);
    if (entry.verdict !== "adjusted") return true;
    return entry.text !== undefined && entry.draft === undefined;
  }

  function isJudged(claim) {
    return settledVerdict(state.claims[claim.id], claim);
  }

  function judgedTotal() {
    return Object.values(state.claims || {}).filter(e => settledVerdict(e)).length;
  }

  function claimPanel(record) {
    const wrap = el("div", { className: "claims-block" });
    const done = record.claims.filter(isJudged).length
      + mine(record).length;

    const total = record.claims.length + mine(record).length;
    const left = total - done;

    // A task with a visible end. It read as an open-ended pile of prose
    // before — three paragraphs of rationale above statements nobody had
    // been told how many of there were, or when they would be finished.
    // The rationale is still available behind the info marker; what changed
    // is that it is no longer the first thing in the way.
    const bar = el("div", { className: "progress" });
    bar.append(el("span", { className: "fill",
                            style: `width:${total ? (done / total) * 100 : 0}%` }));
    wrap.append(el("div", { className: "prompt task" }, [
      el("strong", {}, left === 0
        ? "All statements checked"
        : `Check ${left} statement${left === 1 ? "" : "s"}`),
      el("span", { className: "count" }, `${done}/${total}`),
      bar,
      el("span", { className: "sub" }, left === 0
        ? "Nothing left on this paper. Open Submit to send them in."
        : "Judge each against its quote, not against the paper."),
      info(
        "A confirmed statement carries its own source, so the library can answer a "
        + "question with the sentence behind it rather than handing someone five "
        + "papers to read.",
        "Every quote is checked word-for-word against the source before it reaches "
        + "you, so if the quote does not support the statement, the statement is wrong.",
        "A machine wrote these. Until a person confirms one, it stays marked as a "
        + "machine's reading everywhere it appears.",
      ),
    ]));

    // Two groups, because they are two different jobs. Findings and
    // positions are what the library is asked for — what has been shown and
    // what has been argued. The rest is how you judge one: the background it
    // rests on, the method that produced it, the limitation its authors put
    // on it. Interleaved, a reviewer reads eleven supporting statements at
    // the same weight as the twenty-one that carry the argument.
    const groups = [
      ["primary", "What this paper shows and argues",
       record.claims.filter(c => c.primary !== false)],
      ["supporting", "Context for judging those",
       record.claims.filter(c => c.primary === false)],
    ];

    groups.forEach(([key, heading, claims]) => {
      if (!claims.length) return;
      const openLeft = claims.filter(c => !isJudged(c)).length;
      wrap.append(el("div", { className: "group-head " + key }, [
        el("span", { className: "g-title" }, heading),
        el("span", { className: "g-count" },
           openLeft ? `${openLeft} to check` : "done"),
      ]));

      claims.forEach(claim => {
      const settled = isJudged(claim);
      const card = el("div", { className: "claim" + (settled ? " judged" : "") });
      const kind = CLAIM_KINDS[claim.type] || [claim.type, ""];
      card.append(el("div", { className: "kicker" }, [
        el("span", { className: "type-badge " + (claim.primary === false ? "supporting" : "primary") },
           kind[0]),
        ...(kind[1] ? [info(kind[1])] : []),
      ]));
      // Whose claim it is, before the claim itself. For a borrowed one the
      // reviewer is being asked something different — not "is this
      // accurate" but "is this correctly attributed" — and answering the
      // first question about the second is how a citation gets credited to
      // whoever most recently repeated it.
      if (claim.own === false) {
        card.append(el("p", { className: "claim-borrowed" },
          "reported from prior work" + (claim.from_whom ? " — " + claim.from_whom : "")));
      }
      card.append(el("p", { className: "claim-text" }, claim.text));
      // The claim is deliberately stripped to one assertion, which can leave it
      // unjudgeable on its own — "it reveals weaknesses" reveals nothing about
      // what "it" is. The standalone form puts back exactly enough context to
      // decide, without putting back the sentence we are asking about.
      if (claim.standalone && claim.standalone !== claim.text) {
        card.append(el("p", { className: "claim-context" }, claim.standalone));
      }
      card.append(el("blockquote", { className: "claim-quote" }, "“" + claim.quote + "”"));
      if (claim.where) {
        card.append(el("p", { className: "claim-where" },
          claim.where === "abstract"
            ? "from the abstract, above"
            : `from the ${claim.where} — not shown above, so judge it on the quote`));
      }

      // What this claim argues about, and the way out of it. Clicking a
      // concept shows every claim on it across the corpus — which is the
      // difference between reviewing forty cards and reading what the
      // library actually says about reputation.
      if ((claim.concepts || []).length) {
        const tags = el("div", { className: "concepts" });
        claim.concepts.forEach(id => {
          const concept = (DATA.concepts || {})[id] || { label: id, claims: [] };
          const button = el("button", { className: "concept", type: "button" }, [
            el("span", {}, concept.label),
            el("span", { className: "n" }, String(concept.claims.length)),
          ]);
          button.addEventListener("click", () => showConcept(id));
          tags.append(button);
        });
        card.append(tags);
      }

      // Relations are not shown here for now. Twelve of them across
      // thirty-two statements is not yet a layer a reviewer benefits from
      // meeting mid-task — it is three paragraphs of reasoning between one
      // statement and the next, on a screen whose whole job is getting the
      // statements right. They are still in the data, still on the graph,
      // and still proposed by `aokg relate`.
      //
      // This comes back when extraction and tagging are settled and there
      // are enough relations that seeing one is informative rather than
      // incidental.
      // Already merged means somebody else settled it. Shown rather than
      // asked again — re-deciding a merged verdict belongs in a disagreement,
      // not in a queue.
      if (claim.verdict) {
        card.append(el("p", { className: "hint" },
          `Checked${claim.by ? " by " + claim.by : ""} — ${claim.verdict.replace(/-/g, " ")}.`));
        wrap.append(card);
        return;
      }

      const mine = state.claims[claim.id];
      const row = el("div", { className: "chips" });
      VERDICTS.forEach(([value, label, why]) => {
        const chip = el("button", { className: "chip" });
        chip.setAttribute("aria-pressed", mine && mine.verdict === value ? "true" : "false");
        chip.title = why;
        chip.append(el("span", { className: "t" }, label));
        chip.addEventListener("click", () => {
          if (mine && mine.verdict === value) delete state.claims[claim.id];
          else state.claims[claim.id] = { verdict: value, on: today(), note: (mine || {}).note || "" };
          verdictChanged();
        });
        row.append(chip);
      });
      card.append(row);

      // Adjusting edits the statement itself. The quote is not editable and
      // never should be — it is the thing the statement is checked against,
      // and a reviewer who can change both can make anything true.
      if (mine && mine.verdict === "adjusted") {
        const area = el("textarea", {
          placeholder: "The statement, in your words. It still has to say what the "
                       + "quote above says.",
          value: mine.draft !== undefined ? mine.draft
               : (mine.text !== undefined ? mine.text : claim.text),
        });
        // Typing is a draft. It becomes the statement when somebody says so.
        //
        // Before this, every keystroke was the edit: an accidental character
        // in a textarea silently rewrote a statement, and there was no
        // moment where a reviewer said "yes, this is my version". The
        // tags moved with it too, so a half-typed sentence retagged itself
        // on the way past.
        area.addEventListener("input", () => {
          const entry = state.claims[claim.id];
          // Typing back to the wording already confirmed is that wording, not
          // a new draft of it. Without this the card strands: the draft
          // differs from nothing, so Confirm has nothing to do and stays
          // disabled, and the statement never counts as judged.
          if (entry.text !== undefined && area.value.trim() === entry.text.trim()) {
            delete entry.draft;
