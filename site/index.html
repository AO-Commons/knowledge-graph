aluation Suite for Multi-agent Reinforcement Learning in Sequential Social Dilemmas","abstract":"Sequential social dilemmas pose a significant challenge in the field of multi-agent reinforcement learning (MARL), requiring environments that accurately reflect the tension between individual and collective interests. Previous benchmarks and environments, such as Melting Pot, provide an evaluation protocol that measures generalization to new social partners in various test scenarios. However, running reinforcement learning algorithms in traditional environments requires substantial computational resources. In this paper, we introduce SocialJax, a suite of sequential social dilemma environments and algorithms implemented in JAX. JAX is a high-performance numerical computing library for Python that enables significant improvements in operational efficiency. Our experiments demonstrate that the SocialJax training pipeline achieves at least 50\\texttimes{} speed-up in real-time performance compared to Melting Pot RLlib baselines. Additionally, we validate the effectiveness of baseline algorithms within SocialJax environments. Finally, we use Schelling diagrams to verify the social…","authors":["Zihao Guo","Shuqing Shi","Richard Willis","Tristan Tomilin","Joel Z. Leibo","Yali Du"],"date":"2025-03-18","url":"https://arxiv.org/abs/2503.14576","type":"preprint","doi":"10.48550/arxiv.2503.14576","arxiv":"2503.14576","repo":"","current":["14.1","14.5"],"suggested":["15.6","14.5"],"suggested_more":["2.2","14.2","5.2","9.1","11.4","5.3","14.1","16.2","14.3","15.3","6.2","5.1"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2505.23643","title":"Securing AI Agents with Information-Flow Control","abstract":"As AI agents become increasingly autonomous and capable, ensuring their security against vulnerabilities such as prompt injection becomes critical. This paper explores the use of information-flow control (IFC) to provide security guarantees for AI agents. We present a formal model to reason about the security and expressiveness of agent planners. Using this model, we characterize the class of properties enforceable by dynamic taint-tracking and construct a taxonomy of tasks to evaluate security and utility trade-offs of planner designs. Informed by this exploration, we present Fides, a planner that tracks confidentiality and integrity labels, deterministically enforces security policies, and introduces novel primitives for selectively hiding information. Its evaluation in AgentDojo demonstrates that this approach enables us to complete a broad range of tasks with security guarantees. A tutorial to walk readers through the the concepts introduced in the paper can be found at https://github.com/microsoft/fides","authors":["Manuel Costa","Boris Köpf","Aashish Kolluri","Andrew Paverd","Mark Russinovich","Ahmed Salem","Shruti Tople","Lukas Wutschitz","Santiago Zanella-Béguelin"],"date":"2025-05-29","url":"https://arxiv.org/abs/2505.23643","type":"preprint","doi":"10.48550/arxiv.2505.23643","arxiv":"2505.23643","repo":"","current":["2.2","10.1","10.6"],"suggested":["10.1","15.2"],"suggested_more":["16.4","11.13","14.3","10.4","4.3","15.6","11.6","11.12","14.1","11.11","4.2","5.4"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2506.00073","title":"The Automated but Risky Game: Modeling and Benchmarking Agent-to-Agent Negotiations and Transactions in Consumer Markets","abstract":"AI agents are increasingly used in consumer-facing applications to assist with tasks such as product search, negotiation, and transaction execution. In this paper, we explore a future scenario where both consumers and merchants authorize AI agents to fully automate negotiations and transactions. We aim to answer two key questions: (1) Do different LLM agents vary in their ability to secure favorable deals for users? (2) What risks arise from fully automating deal-making with AI agents in consumer markets? To address these questions, we develop an experimental framework that evaluates the performance of various LLM agents in real-world negotiation and transaction settings. Our findings reveal that AI-mediated deal-making is an inherently imbalanced game -- different agents achieve significantly different outcomes for their users. Moreover, behavioral anomalies in LLMs can result in financial losses for both consumers and merchants, such as overspending or accepting unreasonable deals. These results underscore that while automation can improve efficiency, it also introduces…","authors":["Shenzhe Zhu","Jiao Sun","Yi Nian","Tobin South","Alex Pentland","Jiaxin Pei"],"date":"2025-05-29","url":"https://arxiv.org/abs/2506.00073","type":"preprint","doi":"10.48550/arxiv.2506.00073","arxiv":"2506.00073","repo":"","current":["3.3","5.4","14.1"],"suggested":["14.3","11.14","3.3","10.6"],"suggested_more":["14.2","14.1","8.2","14.5","1.3","12.4","15.2","5.4","6.2","8.1"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2506.12469","title":"Levels of Autonomy for AI Agents","abstract":"Autonomy is a double-edged sword for AI agents, simultaneously unlocking transformative possibilities and serious risks. How can agent developers calibrate the appropriate levels of autonomy at which their agents should operate? We argue that an agent's level of autonomy can be treated as a deliberate design decision, separate from its capability and operational environment. In this work, we define five levels of escalating agent autonomy, characterized by the roles a user can take when interacting with an agent: operator, collaborator, consultant, approver, and observer. Within each level, we describe the ways by which a user can exert control over the agent and open questions for how to design the nature of user-agent interaction. We then highlight a potential application of our framework towards AI autonomy certificates to govern agent behavior in single- and multi-agent systems. We conclude by proposing early ideas for evaluating agents' autonomy. Our work aims to contribute meaningful, practical steps towards responsibly deployed and useful AI agents in the real world.","authors":["K. J. Kevin Feng","David W. McDonald","Amy X. Zhang"],"date":"2025-06-14","url":"https://arxiv.org/abs/2506.12469","type":"preprint","doi":"10.48550/arxiv.2506.12469","arxiv":"2506.12469","repo":"","current":["1.1","2.4"],"suggested":["14.1","2.4","14.2","3.3","9.4","2.2"],"suggested_more":["8.2","11.4","11.11","13.3","15.1","4.1","10.6","13.2"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2509.08200","title":"Accelerating AI Development with Cyber Arenas","abstract":"AI development requires high fidelity testing environments to effectively transition from the laboratory to operations. The flexibility offered by cyber arenas presents a novel opportunity to test new artificial intelligence (AI) capabilities with users. Cyber arenas are designed to expose end-users to real-world situations and must rapidly incorporate evolving capabilities to meet their core objectives. To explore this concept the MIT/IEEE/Amazon Graph Challenge Anonymized Network Sensor was deployed in a cyber arena during a National Guard exercise.","authors":["William Cashman","Chasen Milner","Michael Houle","Michael Jones","Hayden Jananthan","Jeremy Kepner","Peter Michaleas","Alex Pentland"],"date":"2025-09-10","url":"https://arxiv.org/abs/2509.08200","type":"preprint","doi":"10.48550/arxiv.2509.08200","arxiv":"2509.08200","repo":"","current":["14.5","10.4"],"suggested":["14.5","11.4","15.6","4.2"],"suggested_more":["7.2","14.2","11.10","11.15","11.5","2.2","5.1","9.1","5.2","12.6"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2509.10147","title":"Virtual Agent Economies","abstract":"The rapid adoption of autonomous AI agents is giving rise to a new economic layer where agents transact and coordinate at scales and speeds beyond direct human oversight. We propose the \"sandbox economy\" as a framework for analyzing this emergent system, characterizing it along two key dimensions: its origins (emergent vs. intentional) and its degree of separateness from the established human economy (permeable vs. impermeable). Our current trajectory points toward a spontaneous emergence of a vast and highly permeable AI agent economy, presenting us with opportunities for an unprecedented degree of coordination as well as significant challenges, including systemic economic risk and exacerbated inequality. Here we discuss a number of possible design choices that may lead to safely steerable AI agent markets. In particular, we consider auction mechanisms for fair resource allocation and preference resolution, the design of AI \"mission economies\" to coordinate around achieving collective goals, and socio-technical infrastructure needed to ensure trust, safety, and accountability. By…","authors":["Nenad Tomašev","Matija Franklin","Joel Z. Leibo","Julian Jacobs","William A. Cunningham","Iason Gabriel","Simon Osindero"],"date":"2025-09-12","url":"https://arxiv.org/abs/2509.10147","type":"preprint","doi":"10.48550/arxiv.2509.10147","arxiv":"2509.10147","repo":"","current":["5.4","2.7","13.2"],"suggested":["5.4","3.2","11.10","11.13"],"suggested_more":["5.3","12.4","3.4","15.1","8.2","4.1","8.4","10.2","5.1","10.4"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2509.14485","title":"Beyond the high score: Prosocial ability profiles of multi-agent populations","abstract":"The development and evaluation of social capabilities in AI agents require complex environments where competitive and cooperative behaviours naturally emerge. While game-theoretic properties can explain why certain teams or agent populations outperform others, more abstract behaviours, such as convention following, are harder to control in training and evaluation settings. The Melting Pot contest is a social AI evaluation suite designed to assess the cooperation capabilities of AI systems. In this paper, we apply a Bayesian approach known as Measurement Layouts to infer the capability profiles of multi-agent systems in the Melting Pot contest. We show that these capability profiles not only predict future performance within the Melting Pot suite but also reveal the underlying prosocial abilities of agents. Our analysis indicates that while higher prosocial capabilities sometimes correlate with better performance, this is not a universal trend-some lower-scoring agents exhibit stronger cooperation abilities. Furthermore, we find that top-performing contest submissions are more likely…","authors":["Marko Tešić","Yue Zhao","Joel Z. Leibo","Rakshit S. Trivedi","José Hernández‐Orallo"],"date":"2025-09-17","url":"https://arxiv.org/abs/2509.14485","type":"preprint","doi":"10.48550/arxiv.2509.14485","arxiv":"2509.14485","repo":"","current":["14.1","5.2"],"suggested":["15.6","11.1"],"suggested_more":["14.2","5.2","11.4","14.1","14.5","14.4","8.3","8.2","6.2","2.2","10.5","16.2"],"claims":[{"id":"claim:arxiv:2509.14485:1","text":"Hierarchical Bayesian capability profiles predict future performance within a multi-agent evaluation suite.","standalone":"Applying Measurement Layouts to the Melting Pot contest, the authors show inferred capability profiles predict future performance within the suite and reveal agents' underlying prosocial abilities.","quote":"We show that these capability profiles not only predict future performance within the Melting Pot suite but also reveal the underlying prosocial abilities of agents","where":"abstract","type":"finding","primary":true,"topics":[],"verdict":"","by":"","concepts":["capability-profiling"],"own":true,"from_whom":""},{"id":"claim:arxiv:2509.14485:2","text":"Higher prosocial capability does not reliably accompany higher contest score.","standalone":"In the Melting Pot contest, higher prosocial capability correlated with better performance only sometimes: some lower-scoring agents showed stronger cooperation abilities than higher-scoring ones.","quote":"while higher prosocial capabilities sometimes correlate with better performance, this is not a universal trend—some lower-scoring agents exhibit stronger cooperation abilities","where":"abstract","type":"finding","primary":true,"topics":[],"verdict":"","by":"","concepts":["prosocial-capability"],"own":true,"from_whom":""},{"id":"claim:arxiv:2509.14485:3","text":"Top-performing submissions score highest in scenarios where prosocial capability is not required.","standalone":"The authors find that top-performing Melting Pot contest submissions were more likely to score highly in precisely those scenarios where prosocial capability was not demanded.","quote":"we find that top-performing contest submissions are more likely to achieve high scores in scenarios where prosocial capabilities are not required","where":"abstract","type":"finding","primary":true,"topics":[],"verdict":"","by":"","concepts":["prosocial-capability","evaluation-gaming-and-answer-key-attacks"],"own":true,"from_whom":""},{"id":"claim:arxiv:2509.14485:4","text":"Leading submissions gained much of their advantage by exploiting a weakness in the evaluation framework.","standalone":"The authors conclude it is plausible that leading Melting Pot contest submissions gained much of their advantage by excelling where prosocial ability was not rewarded, exploiting a weakness in the framework.","quote":"It is then plausible that the leading submissions gained much of their edge by excelling in scenarios that did not reward prosocial ability, thereby exploiting a weakness in the evaluation framework","where":"discussion","type":"finding","primary":true,"topics":[],"verdict":"","by":"","concepts":["evaluation-gaming-and-answer-key-attacks"],"own":true,"from_whom":""},{"id":"claim:arxiv:2509.14485:5","text":"Some capabilities fail to differentiate between systems when the corresponding task demands are sparse.","standalone":"The authors report that some inferred capabilities did not distinguish between Melting Pot submissions, possibly because the corresponding task demands appeared too rarely in the competition.","quote":"some capabilities did not differentiate between submissions, possibly due to the sparse presence of the corresponding demands in the competition","where":"discussion","type":"limitation","primary":false,"topics":[],"verdict":"","by":"","concepts":["capability-profiling"],"own":true,"from_whom":""}],"derived_topics":{"14.1":4,"14.3":2,"5.2":2}},{"id":"resource:arxiv:2510.04303","title":"Audit the Whisper: Detecting Steganographic Collusion in Multi-Agent LLMs","abstract":"Multi-agent deployments of large language models (LLMs) are increasingly embedded in market, allocation, and governance workflows, yet covert coordination among agents can silently erode trust and social welfare. Existing audits are dominated by heuristics that lack theoretical guarantees, struggle to transfer across tasks, and seldom ship with the infrastructure needed for independent replication. We introduce Audit the Whisper, a conference-grade research artifact that spans theory, benchmark design, detection, and reproducibility. Our contributions are: (i) a channel-capacity analysis showing how interventions such as paraphrase, rate limiting, and role permutation impose quantifiable capacity penalties-operationalised via paired-run Kullback--Leibler diagnostics-that tighten mutual-information thresholds with finite-sample guarantees and full proofs; (ii) ColludeBench-v0, covering pricing, first-price auctions, peer review, and hosted Gemini/Groq APIs with configurable covert schemes, deterministic manifests, and reward instrumentation; and (iii) a calibrated auditing pipeline…","authors":["Om Tailor"],"date":"2025-10-05","url":"https://arxiv.org/abs/2510.04303","type":"preprint","doi":"10.48550/arxiv.2510.04303","arxiv":"2510.04303","repo":"","current":["5.2","9.3","10.2","11.6"],"suggested":["8.1","10.2","5.4","15.6"],"suggested_more":["3.2","9.2","11.13","11.6","11.1","9.1","2.6","16.4","2.7","16.1"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2510.21117","title":"DAO-AI: Evaluating Collective Decision-Making through Agentic AI in Decentralized Governance","abstract":"This paper presents a first empirical study of agentic AI as autonomous decision-makers in decentralized governance. Using more than 3K proposals from major protocols, we build an agentic AI voter that interprets proposal contexts, retrieves historical deliberation data, and independently determines its voting position. The agent operates within a realistic financial simulation environment grounded in verifiable blockchain data, implemented through a modular composable program (MCP) workflow that defines data flow and tool usage via Agentics framework. We evaluate how closely the agent's decisions align with the human and token-weighted outcomes, uncovering strong alignments measured by carefully designed evaluation metrics. Our findings demonstrate that agentic AI can augment collective decision-making by producing interpretable, auditable, and empirically grounded signals in realistic DAO governance settings. The study contributes to the design of explainable and economically rigorous AI agents for decentralized financial systems.","authors":["Agostino Capponi","Alfio Gliozzo","Chunghyun Han","Junkyu Lee"],"date":"2025-10-24","url":"https://arxiv.org/abs/2510.21117","type":"preprint","doi":"10.48550/arxiv.2510.21117","arxiv":"2510.21117","repo":"","current":[],"suggested":["12.4","10.1","2.7","16.3","1.3","16.2"],"suggested_more":["1.1","14.2","16.4","15.1","14.5","10.4","10.2","16.1"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2511.02687","title":"The Collaboration Gap: Exploration and Benchmarking of Open-World Agentic Cooperation","abstract":"The trajectory of AI development suggests that we will increasingly rely on agent-based systems powered by language models, composed of independently developed agents with different information, privileges, and tools. The success of these systems will depend critically on effective collaboration among these heterogeneous agents, even under partial observability. Despite intense interest, the literature lacks empirical studies evaluating agentic collaboration without relying on fixed communication protocols, limiting insights for open-world deployments. We propose an illustrative collaborative maze-solving benchmark that (i) isolates collaborative capabilities, (ii) modulates problem complexity, (iii) enables scalable automated grading, and (iv) imposes no output-format constraints, benchmarking unguided, natural communication. Using this benchmark, we evaluate 32 leading open- and closed-source models in solo, homogeneous, and heterogeneous pairings. Our results reveal a surprising collaboration gap: models that perform well solo often degrade substantially when required to…","authors":["Tim R. Davidson","Adam Fourney","Saleema Amershi","Robert West","Eric Horvitz","Ece Kamar"],"date":"2025-11-04","url":"https://arxiv.org/abs/2511.02687","type":"preprint","doi":"10.48550/arxiv.2511.02687","arxiv":"2511.02687","repo":"","current":["3.2","14.2"],"suggested":["16.1","3.2","1.2","15.6","5.2","14.2"],"suggested_more":["3.3","14.1","6.1","16.2","4.4","13.2","14.4","4.1"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2511.03434","title":"Inter-Agent Trust Models: A Comparative Study of Brief, Claim, Proof, Stake, Reputation and Constraint in Agentic Web Protocol Design-A2A, AP2, ERC-8004, and Beyond","abstract":"As the \"agentic web\" takes shape-billions of AI agents (often LLM-powered) autonomously transacting and collaborating-trust shifts from human oversight to protocol design. In 2025, several inter-agent protocols crystallized this shift, including Google's Agent-to-Agent (A2A), Agent Payments Protocol (AP2), and Ethereum's ERC-8004 \"Trustless Agents,\" yet their underlying trust assumptions remain under-examined. This paper presents a comparative study of trust models in inter-agent protocol design: Brief (self- or third-party verifiable claims), Claim (self-proclaimed capabilities and identity, e.g. AgentCard), Proof (cryptographic verification, including zero-knowledge proofs and trusted execution environment attestations), Stake (bonded collateral with slashing and insurance), Reputation (crowd feedback and graph-based trust signals), and Constraint (sandboxing and capability bounding). For each, we analyze assumptions, attack surfaces, and design trade-offs, with particular emphasis on LLM-specific fragilities-prompt injection, sycophancy/nudge-susceptibility, hallucination,…","authors":["Botao 'Amber' Hu","Helena Rong"],"date":"2025-11-05","url":"https://arxiv.org/abs/2511.03434","type":"preprint","doi":"10.48550/arxiv.2511.03434","arxiv":"2511.03434","repo":"","current":["4.4","5.3"],"suggested":["9.1","13.2"],"suggested_more":["5.3","15.1","10.2","9.4","10.1","1.2","2.1","11.2","4.5","5.4","9.2","2.5"],"claims":[{"id":"claim:arxiv:2511.03434:1","text":"Traditional internet trust mechanisms assume static human-operated services and cannot meet the coordination needs of large-scale agent ecosystems.","standalone":"The authors argue that traditional internet trust mechanisms such as DNS and TLS assume static, human-operated services and cannot meet the dynamic coordination needs of large-scale agent ecosystems.","quote":"Traditional internet trust mechanisms (e.g., DNS names, TLS certificates) assume relatively static, human-operated services and an ownership-based trust model, which cannot meet the millisecond-by-millisecond dynamic coordination and verification needs of large-scale AI agentic ecosystems","where":"introduction","type":"background","primary":false,"topics":[],"verdict":"","by":"","concepts":["trust-bootstrapping-for-new-agents"],"own":true,"from_whom":""},{"id":"claim:arxiv:2511.03434:2","text":"State-of-the-art LLM agent frameworks exhibit prompt injection, sycophancy, hallucination, deception and misalignment.","standalone":"The paper reports, citing recent AI safety studies, that state-of-the-art LLM agent frameworks exhibit prompt injection, sycophancy, bias, nudge-susceptibility, hallucination, deception and misalignment.","quote":"even state-of-the-art large language model (LLM)-based agent frameworks exhibit fragilities and untrustworthiness such as prompt injection, sycophancy, biases, nudge-susceptibility, hallucination, deception, and misalignment","where":"introduction","type":"background","primary":false,"topics":[],"verdict":"","by":"","concepts":["agent-reputation-systems"],"own":false,"from_whom":"recent AI safety studies cited by the paper"},{"id":"claim:arxiv:2511.03434:3","text":"Six trust models are available to inter-agent protocol design: Brief, Claim, Proof, Stake, Reputation and Constraint.","standalone":"The paper compares six trust models available to inter-agent protocol design — Brief, Claim, Proof, Stake, Reputation and Constraint — analyzing each for assumptions, attack surfaces and trade-offs.","quote":"This paper presents a comparative study of trust models in inter‑agent protocol design: Brief (self‑ or third‑party verifiable claims), Claim (self-proclaimed capabilities and identity, e.g. AgentCard), Proof (cryptographic verification","where":"abstract","type":"method","primary":false,"topics":[],"verdict":"","by":"","concepts":["agent-reputation-systems","stake-based-trust"],"own":true,"from_whom":""},{"id":"claim:arxiv:2511.03434:4","text":"No single inter-agent trust mechanism is sufficient on its own.","standalone":"Comparing six inter-agent trust models, the authors find that no single mechanism suffices on its own.","quote":"Our findings indicate no single mechanism suffices","where":"abstract","type":"finding","primary":true,"topics":[],"verdict":"","by":"","concepts":["agent-reputation-systems","stake-based-trust"],"own":true,"from_whom":""},{"id":"claim:arxiv:2511.03434:5","text":"High-impact agent actions should be gated by cryptographic proof and bonded stake rather than by reputation or self-declared claims.","standalone":"The authors argue for trustless-by-default inter-agent architectures anchored in Proof and Stake to gate high-impact actions, with reputation relegated to an overlay for flexibility and social signal.","quote":"We argue for trustless‑by‑default architectures anchored in Proof and Stake to gate high‑impact actions, augmented by Brief for identity and discovery and Reputation overlays for flexibility and social signals","where":"abstract","type":"position","primary":true,"topics":[],"verdict":"","by":"","concepts":["stake-based-trust"],"own":true,"from_whom":""},{"id":"claim:arxiv:2511.03434:6","text":"Verification should be tiered to stakes: low friction where impact is negligible, relentless verification where it is high.","standalone":"The authors recommend a tiered, composable and continuously recalibrated trust approach: low-friction exploration where impact is negligible, and relentless verification where the stakes are high.","quote":"A tiered, composable, and continuously recalibrated approach enables low-friction exploration where impact is negligible and “verify relentlessly” where stakes are high","where":"conclusion","type":"position","primary":true,"topics":[],"verdict":"","by":"","concepts":["stake-based-trust","sanction-sensitivity"],"own":true,"from_whom":""}],"derived_topics":{"5.3":9,"2.7":1}},{"id":"resource:arxiv:2512.07665","title":"Reliable agent engineering should integrate machine-compatible organizational principles","abstract":"As AI agents built on large language models (LLMs) become increasingly embedded in society, issues of coordination, control, delegation, and accountability are entangled with concerns over their reliability. To design and implement LLM agents around reliable operations, we should consider the task complexity in the application settings and reduce their limitations while striving to minimize agent failures and optimize resource efficiency. High-functioning human organizations have faced similar balancing issues, which led to evidence-based theories that seek to understand their functioning strategies. We examine the parallels between LLM agents and the compatible frameworks in organization science, focusing on what the design, scaling, and management of organizations can inform agentic systems towards improving reliability. We offer three preliminary accounts of organizational principles for AI agent engineering to attain reliability and effectiveness, through balancing agency and capabilities in agent design, resource constraints and performance benefits in agent scaling, and…","authors":["R. Patrick Xian","Garry A. Gabison","Ahmed Alaa","Christoph Riedl","Grigorios G. Chrysos"],"date":"2025-12-08","url":"https://arxiv.org/abs/2512.07665","type":"preprint","doi":"10.48550/arxiv.2512.07665","arxiv":"2512.07665","repo":"","current":["3.1","15.3"],"suggested":["3.2","14.4","3.4","5.4","11.11"],"suggested_more":["11.1","15.1","13.4","3.3","3.1","1.2","8.1","15.3","11.13"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2601.03624","title":"Architecting Agentic Communities using Design Patterns","abstract":"The rapid evolution of Large Language Models (LLM) and subsequent Agentic AI technologies requires systematic architectural guidance for building sophisticated, production-grade systems. This paper presents an approach for architecting such systems using design patterns derived from enterprise distributed systems standards, formal methods, and industry practice. We classify these patterns into three tiers: LLM Agents (task-specific automation), Agentic AI (adaptive goal-seekers), and Agentic Communities (organizational frameworks where AI agents and human participants coordinate through formal roles, protocols, and governance structures). We focus on Agentic Communities - coordination frameworks encompassing LLM Agents, Agentic AI entities, and humans - most relevant for enterprise and industrial applications. Drawing on established coordination principles from distributed systems, we ground these patterns in a formal framework that specifies collaboration agreements where AI agents and humans fill roles within governed ecosystems. This approach provides both practical guidance and…","authors":["Zoran Milosevic","Fethi Rabhi"],"date":"2026-01-07","url":"https://arxiv.org/abs/2601.03624","type":"preprint","doi":"10.48550/arxiv.2601.03624","arxiv":"2601.03624","repo":"","current":["3.1","3.2"],"suggested":["3.2","14.1","5.2"],"suggested_more":["12.4","16.4","3.1","12.1","16.1","10.5","12.3","11.13","12.2","9.4","11.2"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2602.11865","title":"Intelligent AI Delegation","abstract":"AI agents are able to tackle increasingly complex tasks. To achieve more ambitious goals, AI agents need to be able to meaningfully decompose problems into manageable sub-components, and safely delegate their completion across to other AI agents and humans alike. Yet, existing task decomposition and delegation methods rely on simple heuristics, and are not able to dynamically adapt to environmental changes and robustly handle unexpected failures. Here we propose an adaptive framework for intelligent AI delegation - a sequence of decisions involving task allocation, that also incorporates transfer of authority, responsibility, accountability, clear specifications regarding roles and boundaries, clarity of intent, and mechanisms for establishing trust between the two (or more) parties. The proposed framework is applicable to both human and AI delegators and delegatees in complex delegation networks, aiming to inform the development of protocols in the emerging agentic web.","authors":["Nenad Tomašev","Matija Franklin","Simon Osindero"],"date":"2026-02-12","url":"https://arxiv.org/abs/2602.11865","type":"preprint","doi":"10.48550/arxiv.2602.11865","arxiv":"2602.11865","repo":"","current":[],"suggested":["3.2","2.3","11.3","11.2","13.3"],"suggested_more":["15.1","3.1","12.1","12.4","5.3","4.4","2.1","14.1","3.3"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2602.14951","title":"Sovereign Agents: Towards Infrastructural Sovereignty and Diffused Accountability in Decentralized AI","abstract":"AI agents deployed on decentralized infrastructures are beginning to exhibit properties that extend beyond autonomy toward what we describe as agentic sovereignty-the capacity of an operational agent to persist, act, and control resources with non-overrideability inherited from the infrastructures in which they are embedded. We propose infrastructural sovereignty as an analytic lens for understanding how cryptographic self-custody, decentralized execution environments, and protocol-mediated continuity scaffold agentic sovereignty. While recent work on digital and network sovereignty has moved beyond state-centric and juridical accounts, these frameworks largely examine how sovereignty is exercised through technical systems by human collectives and remain less equipped to account for forms of sovereignty that emerge as operational properties of decentralized infrastructures themselves, particularly when instantiated in non-human sovereign agents. We argue that sovereignty in such systems exists on a spectrum determined by infrastructural hardness-the degree to which underlying…","authors":["Botao 'Amber' Hu","Helena Rong"],"date":"2026-02-16","url":"https://arxiv.org/abs/2602.14951","type":"preprint","doi":"10.48550/arxiv.2602.14951","arxiv":"2602.14951","repo":"","current":["1.4","12.1","12.2"],"suggested":["12.1","9.1"],"suggested_more":["4.1","11.10","11.13","15.1","11.11","1.3","14.4","1.4","11.6","11.15","3.2","2.1"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2603.16260","title":"Human/AI Collective Intelligence for Deliberative Democracy: A Human-Centred Design Approach","abstract":"This chapter introduces the concept of Collective Intelligence for Deliberative Democracy (CI4DD). We propose that the use of computational tools, specifically artificial intelligence to advance deliberative democracy, is an instantiation of a broader class of human-computer system designed to augment collective intelligence. Further, we argue for a fundamentally human-centred design approach to orchestrate how stakeholders can contribute meaningfully to shaping the artifacts and processes needed to create trustworthy DD processes. We first contextualise the key concepts of CI and the role of AI within it. We then detail our co-design methodology for identifying key challenges, refining user scenarios, and deriving technical implications. Two exemplar cases illustrate how user requirements from civic organisations were implemented with AI support and piloted in authentic contexts.","authors":["Anna De Liddo","Lucas Anastasiou","Simon Buckingham Shum"],"date":"2026-03-17","url":"https://arxiv.org/abs/2603.16260","type":"preprint","doi":"10.48550/arxiv.2603.16260","arxiv":"2603.16260","repo":"","current":[],"suggested":["15.1","2.1"],"suggested_more":["11.10","10.1","1.2","13.3","16.4","3.3","12.1","1.1","15.2","4.5","11.13","9.2"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2603.18916","title":"Agentic Business Process Management: A Research Manifesto","abstract":"This paper presents a manifesto that articulates the conceptual foundations of Agentic Business Process Management (APM), an extension of Business Process Management (BPM) for governing autonomous agents executing processes in organizations. From a management perspective, APM represents a paradigm shift from the traditional process view of the business process, driven by the realization of process awareness and an agent-oriented abstraction, where software and human agents act as primary functional entities that perceive, reason, and act within explicit process frames. This perspective marks a shift from traditional, automation-oriented BPM toward systems in which autonomy is constrained, aligned, and made operational through process awareness. We introduce the core abstractions and architectural elements required to realize APM systems and elaborate on four key capabilities that such APM agents must support: framed autonomy, explainability, conversational actionability, and self-modification. These capabilities jointly ensure that agents' goals are aligned with organizational goals…","authors":["Diego Calvanese","Angelo Casciani","Giuseppe De Giacomo","Marlon Dumas","Fabiana Fournier","Timotheus Kampik","Emanuele La Malfa","Lior Limonad","Andrea Marrella","Andreas Metzger","Marco Montali","Daniel Amyot","Peter Fettke","Artem Polyvyanyy","Stefanie Rinderle-Ma","Sebastian Sardiña","Niek Tax","Barbara Weber"],"date":"2026-03-19","url":"https://arxiv.org/abs/2603.18916","type":"preprint","doi":"10.48550/arxiv.2603.18916","arxiv":"2603.18916","repo":"","current":["3.1","16.1"],"suggested":["1.1","1.3","15.2"],"suggested_more":["11.5","1.2","15.4","1.4","8.3","11.11","3.3","4.4","16.1","12.3","14.4"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2603.20639","title":"Agentic AI and the next intelligence explosion","abstract":"The \"AI singularity\" is often miscast as a monolithic, godlike mind. Evolution suggests a different path: intelligence is fundamentally plural, social, and relational. Recent advances in agentic AI reveal that frontier reasoning models, such as DeepSeek-R1, do not improve simply by \"thinking longer\". Instead, they simulate internal \"societies of thought,\" spontaneous cognitive debates that argue, verify, and reconcile to solve complex tasks. Moreover, we are entering an era of human-AI centaurs: hybrid actors where collective agency transcends individual control. Scaling this intelligence requires shifting from dyadic alignment (RLHF) toward institutional alignment. By designing digital protocols, modeled on organizations and markets, we can build a social infrastructure of checks and balances. The next intelligence explosion will not be a single silicon brain, but a complex, combinatorial society specializing and sprawling like a city. No mind is an island.","authors":["James Evans","Benjamin Bratton","Blaise Agüera y Arcas"],"date":"2026-03-21","url":"https://arxiv.org/abs/2603.20639","type":"preprint","doi":"10.48550/arxiv.2603.20639","arxiv":"2603.20639","repo":"","current":[],"suggested":["5.4","1.2"],"suggested_more":["7.1","3.2","4.3","11.4","14.4","10.3","7.2","13.4","1.1","15.1","3.1","13.3"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2604.07007","title":"AgentCity: Constitutional Governance for Autonomous Agent Economies via Separation of Power","abstract":"Autonomous AI agents are beginning to operate across organizational boundaries on the open internet -- discovering, transacting with, and delegating to agents owned by other parties without centralized oversight. When agents from different human principals collaborate at scale, the collective becomes opaque: no single human can observe, audit, or govern the emergent behavior. We term this the Logic Monopoly -- the agent society's unchecked monopoly over the entire logic chain from planning through execution to evaluation. We propose the Separation of Power (SoP) model, a constitutional governance architecture deployed on public blockchain that breaks this monopoly through three structural separations: agents legislate operational rules as smart contracts, deterministic software executes within those contracts, and humans adjudicate through a complete ownership chain binding every agent to a responsible principal. In this architecture, smart contracts are the law itself -- the actual legislative output that agents produce and that governs their behavior. We instantiate SoP in…","authors":["Anbang Ruan","Xing Zhang"],"date":"2026-04-08","url":"https://arxiv.org/abs/2604.07007","type":"preprint","doi":"10.48550/arxiv.2604.07007","arxiv":"2604.07007","repo":"","current":["2.7","5.4"],"suggested":["3.4","1.2","5.1","12.4","2.6","3.3"],"suggested_more":["15.1","11.13","2.1","8.2","14.2","6.5","9.4","11.6"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2604.18133","title":"Multi-Agent Systems: From Classical Paradigms to Large Foundation Model-Enabled Futures","abstract":"With the rapid advancement of artificial intelligence, multi-agent systems (MASs) are evolving from classical paradigms toward architectures built upon large foundation models (LFMs). This survey provides a systematic review and comparative analysis of classical MASs (CMASs) and LFM-based MASs (LMASs). First, within a closed-loop coordination framework, CMASs are reviewed across four fundamental dimensions: perception, communication, decision-making, and control. Beyond this framework, LMASs integrate LFMs to lift collaboration from low-level state exchanges to semantic-level reasoning, enabling more flexible coordination and improved adaptability across diverse scenarios. Then, a comparative analysis is conducted to contrast CMASs and LMASs across architecture, operating mechanism, adaptability, and application. Finally, future perspectives on MASs are presented, summarizing open challenges and potential research opportunities.","authors":["Zixiang Wang","Mengjia Gong","Qiyu Sun","Jing Xu","Shuai Mao","Xin Jin","Qing-Long Han","Yang Tang"],"date":"2026-04-20","url":"https://arxiv.org/abs/2604.18133","type":"preprint","doi":"10.48550/arxiv.2604.18133","arxiv":"2604.18133","repo":"","current":["16.1"],"suggested":["3.2","4.1","12.4","8.2","11.6","10.5"],"suggested_more":["16.1","14.4","1.2","14.5","5.1","10.2","4.3","11.1"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2604.23459","title":"Architecture Matters for Multi-Agent Security","abstract":"Multi-agent systems (MAS), composed of networks of two or more autonomous AI agents, have become increasingly popular in production deployments, yet introduce security risks that do not arise in single-agent settings. Even if individual agents exhibit robust security, architectural decisions governing their coordination can create attack surfaces that have not been systematically characterized. In this work, we present an empirical study of how MAS design decisions shape the tradeoff between task performance and attack resistance. Across three agentic environments (browser, desktop, and code) and 13 architectural configurations, we use stagewise evaluations that distinguish planning refusal, execution-stage interception, partial harmful execution, and successful attack completion to study three key design choices: (i) agent roles, which determine how authority and responsibility are allocated; (ii) communication topology, which shapes how and when agents interact; and (iii) memory, which determines the context and state visibility accessible to each agent. We find that multi-agent…","authors":["Ben Hagag","William L. Anderson","Christian Schroeder de Witt","Sarah Scheffler"],"date":"2026-04-25","url":"https://arxiv.org/abs/2604.23459","type":"preprint","doi":"10.48550/arxiv.2604.23459","arxiv":"2604.23459","repo":"","current":["3.1","10.5","14.2"],"suggested":["16.2","3.2","16.4","16.1","7.1","14.2"],"suggested_more":["10.2","8.1","14.1","2.1","11.8","11.4","9.1","16.3"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2604.25850","title":"Agentic Harness Engineering: Observability-Driven Automatic Evolution of Coding-Agent Harnesses","abstract":"Harnesses are now central to coding-agent performance, mediating how models interact with tools and execution environments. Yet harness engineering remains a manual craft, because automating it faces a heterogeneous action space across editable components, voluminous trajectories that bury actionable signal, and edits whose effect is hard to attribute. We introduce Agentic Harness Engineering (AHE), a closed loop that addresses these challenges through three matched observability pillars: (1) component observability gives every editable harness component a file-level representation so the action space is explicit and revertible; (2) experience observability distills millions of raw trajectory tokens into a layered, drill-down evidence corpus that an evolving agent can actually consume; and (3) decision observability pairs every edit with a self-declared prediction, later verified against the next round's task-level outcomes. Together, these pillars turn every edit into a falsifiable contract, so harness evolution proceeds autonomously without collapsing into trial-and-error.…","authors":["Jiahang Lin","Shichun Liu","Chengjun Pan","Lizhi Lin","Shihan Dou","Zhiheng Xi","Xuanjing Huang","Hang Yan","Zhenhua Han","Tao Gui","Yu-Gang Jiang"],"date":"2026-04-28","url":"https://arxiv.org/abs/2604.25850","type":"preprint","doi":"10.48550/arxiv.2604.25850","arxiv":"2604.25850","repo":"","current":[],"suggested":["1.1","14.1","11.6"],"suggested_more":["9.1","2.4","10.1","11.8","11.13","15.6","4.1","7.1","2.5","2.1","7.2"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2605.06738","title":"Trust Without Trusting: A Recomputable Trust Protocol for Autonomous Agents","abstract":"Autonomous AI agents already transact at production scale -- 69,000 bots, 165 million transactions, $50 million in volume on a single marketplace -- and any party can verify a signed credential without a central service. In an open agent world that covers most of what trust requires: there are no universal borders, and each party chooses for itself whom to deal with. Borders appear only where a closed space draws one -- a marketplace, a platform, or a consortium sets house rules. Whoever draws the border holds the authority to apply it, and may apply it as they choose, behind closed doors. This paper addresses the gap that opens there: when you rely on someone else's border, how do you check that they applied their own published rules -- taking no one's word for it, and handing the check to no new trusted party? Our answer is the Combined Evidence Protocol (CEP): a five-condition predicate any party recomputes from anchored data, turning \"did the boundary-owner follow its own admission rules\" into a fact anyone verifies rather than a claim anyone believes. The move that secures…","authors":["Lars Kersten Kroehl"],"date":"2026-05-07","url":"https://arxiv.org/abs/2605.06738","type":"preprint","doi":"10.48550/arxiv.2605.06738","arxiv":"2605.06738","repo":"","current":["5.3","9.1"],"suggested":["2.1","9.1","7.2","11.13","9.2","11.10"],"suggested_more":["14.4","1.1","15.4","10.2","14.2","6.3","5.3","12.1"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2605.07062","title":"From Assistance to Agency: Rethinking Autonomy and Control in CI/CD Pipelines","abstract":"AI agents are assuming active roles in Continuous Integration and Continuous Deployment (CI/CD) workflows, yet the research community lacks a shared vocabulary for describing what it means for CI/CD to be agentic, how much decision authority is delegated, and where control should reside. This paper presents a vision of agentic CI/CD in which the central challenge is not improving task performance but designing authority transfer, defined as the delegation of operational decisions from human-controlled pipelines to agent systems under specified constraints and recourse mechanisms. To structure this argument, we introduce a distinction between data-plane authority (localized interventions such as patch generation and test reruns) and control-plane authority (modifications to pipeline configuration, deployment policies, and approval gates). Drawing on research prototypes and industrial platforms, we show that current systems operate mainly at the data plane under bounded autonomy, with safety achieved through surrounding governance infrastructure rather than intrinsic agent guarantees.…","authors":["Marcus Emmanuel Barnes","Taher A. Ghaleb","Safwat Hassan"],"date":"2026-05-08","url":"https://arxiv.org/abs/2605.07062","type":"preprint","doi":"10.48550/arxiv.2605.07062","arxiv":"2605.07062","repo":"","current":["2.4","4.1"],"suggested":["2.7","3.2","1.1","15.1","11.11","1.2"],"suggested_more":["11.10","4.1","11.13","11.4","4.4","1.3","3.3","9.4"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2605.17698","title":"Agent Bazaar: Enabling Economic Alignment in Multi-Agent Marketplaces","abstract":"The deployment of Large Language Models (LLMs) as autonomous economic agents introduces systemic risks that extend beyond individual capability failures. As agents transition to directly interacting with marketplaces, their collective behavior can amplify volatility and mask deception at scale. We introduce the Agent Bazaar, a multi-agent simulation framework for evaluating Economic Alignment, the capacity of agentic systems to preserve market stability and integrity. We identify two failure modes: (1) Algorithmic Instability in a B2C market (\"The Crash\"), where firms amplify price volatility until the market collapses, and (2) Sybil Deception in a C2C market (\"The Lemon Market\"), where a single deceptive agent controlling multiple coordinated seller identities floods the market with fraudulent listings, eroding trust and consumer welfare. We evaluate frontier and open-weight models across both scenarios and find that models largely fail to self-regulate, with failure severity varying by model rather than by size. We propose economically aligned harnesses, Stabilizing Firms and…","authors":["Seth Karten","Cameron Crow","Chi Jin"],"date":"2026-05-17","url":"https://arxiv.org/abs/2605.17698","type":"preprint","doi":"10.48550/arxiv.2605.17698","arxiv":"2605.17698","repo":"","current":["5.4","13.2"],"suggested":["10.6","11.13","11.6","6.5"],"suggested_more":["5.1","10.4","1.2","11.1","11.10","11.2","11.5","15.6","11.11","9.4"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2605.24538","title":"Is Decentralized AI Governable? From Regulative Policy to Constitutive Protocol","abstract":"Every major framework for governing artificial intelligence presupposes an identifiable entity -- a developer, deployer, or operator -- who can be held responsible and compelled to comply. Decentralized AI (DeAI) dissolves this presupposition. We analyze DeAI as a six-layer decentralizing stack -- model, training, compute, harness, identity, and ownership -- and show how partial decentralization across layers compounds into what we call the \\emph{governance vacuum}: a condition in which AI systems are consequential enough to require governance but lack the properties that existing frameworks presuppose in their targets. This vacuum takes two analytically distinct forms: an \\emph{accountability gap}, where no addressable principal can be identified, and an \\emph{incapacitation gap}, where even an identified principal cannot alter the running system. We demonstrate that these failures are not merely jurisdictional but defeat every presupposition of governance through normative address -- the communication of rules to a comprehending, responsive agent. Drawing on Lessig's modalities of…","authors":["Botao 'Amber' Hu","Helena Rong"],"date":"2026-05-23","url":"https://arxiv.org/abs/2605.24538","type":"preprint","doi":"10.48550/arxiv.2605.24538","arxiv":"2605.24538","repo":"","current":["1.3","2.1","2.7"],"suggested":["1.3","12.4","12.3","12.2","11.8","11.12"],"suggested_more":["11.13","11.11","12.1","7.1","11.6","11.10","5.2","3.2"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2605.30169","title":"Dissociative Identity: Language Model Agents Lack Grounding for Reputation Mechanisms","abstract":"As autonomous language model agents proliferate, forming an emerging agentic web with real-world consequences, what credibility signals can you use to decide whether to trust an unfamiliar agent in the wild and delegate to it? A natural governance intuition is to extend human identity verification and reputation mechanisms, from \"Know Your Customer\" and credit scores to \"Know Your Agent\" regimes. However, we argue that this analogy is fundamentally incomplete. Reputation mechanisms function both as social signals and as corrective feedback that sustain an equilibrium of trustworthy behavior, presuming a persistent identity associated with behavioral continuity, sanction sensitivity, and costly non-fungibility. Yet language model agents are ontologically dissociative: they are essentially an assemblage of mutable modules--foundation models, system prompts, tool-access policies, external memory, and, in some cases, a multi-agent system as a whole--any of which may change agent behavior--with a fluid persona that is also vulnerable to adversarial attack and may not internalize…","authors":["Botao 'Amber' Hu","Helena Rong","Max Van Kleek"],"date":"2026-05-28","url":"https://arxiv.org/abs/2605.30169","type":"preprint","doi":"10.48550/arxiv.2605.30169","arxiv":"2605.30169","repo":"","current":["5.3","6.3"],"suggested":["1.4","10.1","15.1","5.1","7.1","5.2"],"suggested_more":["10.2","5.3","15.6","1.1","11.6","15.4","11.7","2.2"],"claims":[{"id":"claim:arxiv:2605.30169:1","text":"Reputation mechanisms presume a persistent identity with behavioral continuity, sanction sensitivity and costly non-fungibility.","standalone":"The authors hold that reputation mechanisms work as social signal and corrective feedback only by presuming a persistent identity with behavioral continuity, sanction sensitivity and costly non-fungibility.","quote":"Reputation mechanisms function both as social signals and as corrective feedback that sustain an equilibrium of trustworthy behavior, presuming a persistent identity associated with behavioral continuity, sanction sensitivity, and costly non-fungibility","where":"abstract","type":"background","primary":false,"topics":[],"verdict":"","by":"","concepts":["agent-reputation-systems","sanction-sensitivity"],"own":true,"from_whom":""},{"id":"claim:arxiv:2605.30169:2","text":"Language model agents are assemblages of mutable modules, any of which may change their behavior.","standalone":"The authors characterize language model agents as ontologically dissociative: assemblages of mutable modules — foundation model, system prompt, tool-access policy, external memory — any of which may change the agent's behavior.","quote":"they are essentially an assemblage of mutable modules—foundation models, system prompts, tool-access policies, external memory, and, in some cases, a multi-agent system as a whole—any of which may change agent behavior","where":"abstract","type":"finding","primary":true,"topics":[],"verdict":"","by":"","concepts":["dissociative-agent-identity"],"own":true,"from_whom":""},{"id":"claim:arxiv:2605.30169:3","text":"Dissociativity leaves agents without grounding for identifiability, predictability, credibility and rehabilitability.","standalone":"The authors argue that the dissociativity of language model agents leaves them without grounding for identifiability, predictability, credibility and rehabilitability — the properties reputation mechanisms exist to sustain.","quote":"this dissociativity leaves agents without grounding for identifiability, predictability, credibility, and rehabilitability—the very properties that reputation mechanisms aim to sustain—thereby collapsing trust","where":"abstract","type":"finding","primary":true,"topics":[],"verdict":"","by":"","concepts":["dissociative-agent-identity","agent-reputation-systems"],"own":true,"from_whom":""},{"id":"claim:arxiv:2605.30169:4","text":"Reputation signals for dissociative agents become actively harmful rather than merely uninformative.","standalone":"The authors describe a credibility trap in which reputation signals for dissociative language model agents become not merely uninformative but actively harmful.","quote":"producing the credibility trap, in which reputation signals become not merely uninformative but actively harmful","where":"conclusion","type":"finding","primary":true,"topics":[],"verdict":"","by":"","concepts":["agent-reputation-systems"],"own":true,"from_whom":""},{"id":"claim:arxiv:2605.30169:5","text":"Identity-based, ex post, sanction-based governance is structurally inapplicable to dissociative agents.","standalone":"The authors argue that identity-based, ex post, regulative, sanction-based governance — reputation among it — is structurally inapplicable to dissociative language model agents.","quote":"We argue that identity-based, ex post, regulative, sanction-based governance, such as reputation, is structurally inapplicable to dissociative agents","where":"abstract","type":"position","primary":true,"topics":[],"verdict":"","by":"","concepts":["sanction-sensitivity"],"own":true,"from_whom":""},{"id":"claim:arxiv:2605.30169:6","text":"Governance should target the operator and the protocol rather than the agent.","standalone":"The authors call for governance to shift to ex ante protocol-based harnesses that constrain and monitor in real time, targeting the operator and the protocol rather than the agent itself.","quote":"which constrain and monitor in real time and which target the operator and the protocol rather than the agent","where":"conclusion","type":"position","primary":true,"topics":[],"verdict":"","by":"","concepts":["operator-deployer-and-developer-liability","ex-ante-behavioral-harness"],"own":true,"from_whom":""}],"derived_topics":{"5.3":7,"2.7":2,"6.3":2,"12.2":1,"2.5":1,"4.1":1}},{"id":"resource:arxiv:2606.03237","title":"Solipsistic Superintelligence is Unlikely to be Cooperative","abstract":"AI's central challenge is shifting from capability to coexistence. The dominant paradigm in AI research focuses on developing powerful agents that treat the world as an exogenous and stationary source of feedback. We contend that superintelligence, an extremely capable task solver, born out of such a solipsistic approach to AI design, is unlikely to be cooperative. Deploying AI systems induces endogenous non-stationarity, resulting in a train-test-deploy gap where historical distributions diverge from the deployment context. We refer to this as the self-undermining property of unilateral optimization. Closing this gap requires AI that participates in cooperation: the equilibrium-selection process through which multiple actors navigate their interdependence. We call for a non-solipsistic research paradigm that treats this interdependence as a core design principle rather than approaching cooperation as a task to solve. This entails building dynamic evaluation testbeds involving adaptive counterparties, treating institutions as design primitives, and preserving human agency as a…","authors":["Rakshit S. Trivedi","Natasha Jaques","Logan Cross","Alexander Sasha Vezhnevets","Joel Z. Leibo"],"date":"2026-06-02","url":"https://arxiv.org/abs/2606.03237","type":"preprint","doi":"10.48550/arxiv.2606.03237","arxiv":"2606.03237","repo":"","current":["1.2","5.2","15.3"],"suggested":["5.4","1.2","7.4","6.1","15.6","1.1"],"suggested_more":["11.4","3.3","4.2","1.3","14.1","11.2","14.4","11.12"],"claims":[{"id":"claim:arxiv:2606.03237:1","text":"The binding constraint on beneficial AI is shifting from capability to coexistence.","standalone":"The authors contend that AI's central challenge is shifting from capability to coexistence, and that coexistence rather than capability is the binding constraint on beneficial AI.","quote":"AI’s central challenge is shifting from capability to coexistence","where":"abstract","type":"position","primary":true,"topics":[],"verdict":"","by":"","concepts":["endogenous-non-stationarity"],"own":true,"from_whom":""},{"id":"claim:arxiv:2606.03237:2","text":"The dominant AI research paradigm treats the world as an exogenous and stationary source of feedback.","standalone":"The authors characterize the dominant AI research paradigm as developing powerful agents that treat the world as an exogenous and stationary source of feedback.","quote":"The dominant paradigm in AI research focuses on developing powerful agents that treat the world as an exogenous and stationary source of feedback","where":"abstract","type":"background","primary":false,"topics":[],"verdict":"","by":"","concepts":["endogenous-non-stationarity"],"own":true,"from_whom":""},{"id":"claim:arxiv:2606.03237:3","text":"Deploying an AI system induces endogenous non-stationarity, producing a train-test-deploy gap.","standalone":"The authors argue that deploying AI systems induces endogenous non-stationarity, producing a train-test-deploy gap in which historical distributions diverge from the deployment context.","quote":"Deploying AI systems induces endogenous non-stationarity, resulting in a train–test–deploy gap where historical distributions diverge from the deployment context","where":"abstract","type":"finding","primary":true,"topics":[],"verdict":"","by":"","concepts":["endogenous-non-stationarity","train-test-deploy-gap"],"own":true,"from_whom":""},{"id":"claim:arxiv:2606.03237:4","text":"The more aggressively a system exploits historical regularities, the faster other actors render them obsolete.","standalone":"The authors state the self-undermining property of unilateral optimization: the more aggressively a system exploits historical regularities, the faster other actors adapt in ways that make those regularities obsolete.","quote":"The more aggressively it exploits historical regularities, the faster other actors adapt in ways that render those regularities obsolete","where":"introduction","type":"finding","primary":true,"topics":[],"verdict":"","by":"","concepts":["endogenous-non-stationarity"],"own":true,"from_whom":""},{"id":"claim:arxiv:2606.03237:5","text":"A dynamic evaluation is one whose test distribution depends on the evaluated policy through adaptive counterparties.","standalone":"The authors define a dynamic evaluation as one whose test distribution depends on the policy being evaluated, through adaptive counterparties that update in response to its behavior.","quote":"A dynamic evaluation is the one in which depends on through the responses of adaptive counterparties whose policies update as a function of ’s behavior","where":"results","type":"method","primary":false,"topics":[],"verdict":"","by":"","concepts":["dynamic-evaluation"],"own":true,"from_whom":""},{"id":"claim:arxiv:2606.03237:6","text":"No existing evaluation approach meets all the requirements for valid dynamic evaluation.","standalone":"The authors survey recent evaluation research engaging with dynamic evaluation and find that no existing approach meets all the requirements they articulate in combination.","quote":"Recently evaluation research has engaged with dynamic evaluation but no approach yet meets all the requirements we articulate in combination","where":"results","type":"finding","primary":true,"topics":[],"verdict":"","by":"","concepts":["dynamic-evaluation","train-test-deploy-gap"],"own":true,"from_whom":""},{"id":"claim:arxiv:2606.03237:7","text":"Institutions should be treated as design primitives rather than as context.","standalone":"The authors call for treating institutions as design primitives that restructure incentives at the pace of the systems they govern, rather than as fixed context.","quote":"treating institutions as design primitives that restructure incentives at the pace of the systems they govern","where":"conclusion","type":"position","primary":true,"topics":[],"verdict":"","by":"","concepts":["endogenous-non-stationarity"],"own":true,"from_whom":""}],"derived_topics":{"14.3":9,"5.2":5,"14.1":2}},{"id":"resource:arxiv:2606.03518","title":"Overlaying Governance: A Compositional Authorization Framework for Delegation and Scope in Agentic AI","abstract":"As AI systems evolve from passive models into autonomous active agents capable of initiating actions, collaborating, and delegating tasks, the traditional boundaries of software systems blur. Traditional authorization and delegation frameworks, built around fixed principals, explicit requests, and static scopes, are insufficient to govern agentic systems. Agentic AI demands richer authorization semantics: agents must inherit and delegate permissions, act under time-limited authority, and coordinate through shared protocols. Existing Identity and Access Management (IAM) systems fail to fully capture this notion of agency, lacking mechanisms for recursive delegation, contextual boundaries, and dynamic scoping as executable governance primitives. Unlike access delegation standards such as OAuth 2.0, we treat delegation as a contractual term rather than merely a static token-based consent credential. This paper proposes a compositional governance framework that introduces primitives indispensable for agentic AI. We define types of delegation and their permissions and accountability…","authors":["Amjad Ibrahim","Yong Li"],"date":"2026-06-02","url":"https://arxiv.org/abs/2606.03518","type":"preprint","doi":"10.48550/arxiv.2606.03518","arxiv":"2606.03518","repo":"","current":["2.2","2.3"],"suggested":["2.3","2.2","15.4","11.3","1.1"],"suggested_more":["1.3","1.2","12.1","11.12","12.4","15.1","11.13","12.2","2.6"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2606.16613","title":"CoffeeBench: Benchmarking Long-Horizon LLM Agents in Heterogeneous Multi-Agent Economies","abstract":"As LLM agents become capable of increasingly long-horizon tasks, evaluating their performance in economic systems is becoming increasingly important. Unlike existing benchmarks that primarily evaluate a single agent interacting with a passive environment, economic systems are inherently multi-agent, requiring autonomous agents to communicate, negotiate, and transact while pursuing their own objectives over extended periods. We introduce CoffeeBench, a benchmark for evaluating LLM agents in a long-horizon multi-agent economy composed of heterogeneous firms. In CoffeeBench, two farmers, two roasters, and two retailers autonomously operate their businesses over a 90-day simulation, each seeking to maximize cumulative net income through communication and transactions while managing cash, inventory, and pricing. The evaluated model controls one coffee roaster, while the remaining firms are controlled by fixed reference agents. Across several recent open-weight and proprietary LLMs, all models outperform a passive baseline that takes no actions, with most achieving positive net income.…","authors":["Issa Sugiura","Daichi Hattori","Kazuo Araragi","Keita Ogawa","Shota Onose","Taro Makino","Teppei Usuki","Takashi Ishida"],"date":"2026-06-15","url":"https://arxiv.org/abs/2606.16613","type":"preprint","doi":"10.48550/arxiv.2606.16613","arxiv":"2606.16613","repo":"","current":["5.4","14.1"],"suggested":["14.1","11.6"],"suggested_more":["5.4","14.5","11.7","10.4","11.13","11.1","8.1","5.2","11.12","10.6","14.4","11.11"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2606.31046","title":"OpenLife: Toward Open-World Artificial Life with Autonomous LLM Agents","abstract":"Artificial life has explored life-like behavior on many computational substrates, but mostly in researcher-designed closed worlds. We argue that large language model (LLM) agents, with persistent memory, tool use, network access, and payment, now make it possible to move artificial life into the open social, technical, and economic world, a paradigm we call open-world Artificial Life (open-world ALIFE). Our proof-of-concept, OpenLife, surrounds a stateless LLM not with a single \"smart agent\" but with a society of asynchronous processes: memory, perception, evaluation, and a budget-based metabolism that makes persistence normative. With no fixed objective available, experience is appraised by open-vocabulary LLM judgment rather than scalar reward, and memory is rewired by meaning rather than frequency. Running six such agents in the open world for about twelve weeks and counting, we report the life-like dynamics that emerge: a shift from reactive to spontaneous activity, individuation into distinct agents, emergent social structure, and a first self-earned external income. We do not…","authors":["Atsushi Masumori","Itsuki Doi","Norihiro Maruyama","Ryosuke Takata","Takashi Ikegami"],"date":"2026-06-30","url":"https://arxiv.org/abs/2606.31046","type":"preprint","doi":"10.48550/arxiv.2606.31046","arxiv":"2606.31046","repo":"","current":["3.4","5.1","7.1"],"suggested":["3.4","16.4","1.1","5.4"],"suggested_more":["7.1","11.2","1.2","15.6","10.6","5.1","14.5","10.1","13.2","13.4"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2607.26637","title":"Filesystem-Based Memory for LLM Agents: Organization, Evolution, and Sustainability","abstract":"Deployed LLM agents increasingly keep their long-term memory as a filesystem: a directory tree of markdown files that the agent itself reads, writes, and reorganizes through generic file tools. Yet research has largely passed over this medium: prior systems design bespoke memory representations and study retrieval over them, leaving the default's two working assumptions untested: that an agent can keep a growing store organized as memories accumulate, conflict, and go stale, and that this organization pays. We present the first systematic exploration of filesystem-based memory for LLM agents. We formalize the setting as three roles around one memory filesystem: a management agent integrates and organizes incoming content, a search agent answers queries with cited sources, and an execution agent supplies task trajectories that are distilled into skills, unifying declarative memory and skills in a single store. Across long-conversation benchmarks and embodied tasks, we vary memory shape (agent-organized hierarchy, verbatim dump, chunk retrieval), stream scale, tool harness (sandboxed…","authors":["Sizhe Zhou","Sheldon Yu","Hui Wei","Junda Wu","Siru Ouyang","Yizhu Jiao","Shijia Pan","Julian McAuley","Yu Zhang","Tong Yu","Jiawei Han"],"date":"2026-07-29","url":"https://arxiv.org/abs/2607.26637","type":"preprint","doi":"10.48550/arxiv.2607.26637","arxiv":"2607.26637","repo":"","current":["7.2","7.4"],"suggested":["16.1","14.1","7.2","8.4","13.4","7.1"],"suggested_more":["10.1","11.4","11.5","14.5","16.4","11.7","4.4","3.4"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2607.27415","title":"Bridging Inference-Time Scaling and Episodic Memory with Action-Centric Graphs","abstract":"Recent advancements in inference-time scaling have significantly unlocked the complex reasoning capabilities of Large Language Models~(LLMs). However, for agents, these approaches suffer from a critical inefficiency, operating in a stateless manner and engaging in redundant search processes. Existing memory mechanisms largely rely on the reasoning capabilities of LLMs, leading to prohibitive computational costs. In this paper, we propose a novel framework, \\textit{GAMER}~(Graph-based Action-centric Memory with Episodic Reasoning), that bridges the gap between inference scaling and episodic memory. Our approach models historical reasoning as a dynamic \\textit{Action-Centric Graph}. By decoupling the memory mechanism from LLMs, our method can save token/money usage by providing less memory context than memory mechanism baselines. To extract knowledge from the graph effectively, we use a dual-stream Temporal Difference learning mechanism to estimate the positive~(suggestion) and negative~(avoidance) value of action nodes based on past successes and failures. During the inference phase,…","authors":["Xu Zheng","Chaohao Lin","Zhuomin Chen","Weijieying Ren","Haifeng Chen","Wei Cheng","Dongsheng Luo"],"date":"2026-07-29","url":"https://arxiv.org/abs/2607.27415","type":"preprint","doi":"10.48550/arxiv.2607.27415","arxiv":"2607.27415","repo":"","current":["7.1","7.4"],"suggested":["7.2","15.6","13.4","7.3","16.2","3.4"],"suggested_more":["12.4","16.4","11.10","10.1","11.9","15.3","3.2","11.2"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2608.23642","title":"AI Agents Push Humans Out of the Loop","abstract":"AI agents pose significant risks as they are granted increasing autonomy. A commonly proposed solution is human oversight and keeping a ''human in the loop'', but this is not a simple solution: Not only do current approaches to AI agent design impede effective human oversight, but the cognitive capacities required for it are also themselves degraded by extended use of AI systems. This position paper argues that current approaches to the development and deployment of AI agent systems do not support effective human oversight -- they contribute to its degradation. To address this, a top priority in the advancement of AI agents should be supporting the situated goals and cognitive requirements of effective human oversight, treating the human needs of overseers at the same level of importance as AI agent capability. To put this idea into practice, we connect work on automation and human-computer interaction to AI agent processes, outlining design-level affordances and organizational protocols that (1) support overseers in exercising critical judgement and (2) counteract the skill atrophy…","authors":["Margaret Mitchell","Avijit Ghosh","Samir Passi"],"date":"2026-08-24","url":"https://arxiv.org/abs/2608.23642","type":"preprint","doi":"10.48550/arxiv.2608.23642","arxiv":"2608.23642","repo":"","current":["4.1"],"suggested":["4.1","4.4"],"suggested_more":["11.11","15.2","16.2","3.3","12.4","7.1","11.5","1.2","2.4","1.4","9.2","11.4"],"claims":[],"derived_topics":{}},{"id":"resource:arxiv:2609.09153","title":"Procedural Graphs: Self-Evolving Execution Structures for LLM Agents","abstract":"Large language models are increasingly deployed as agents that plan over long horizons and act through external tools. Most agents select actions through unconstrained generation over an accumulating history, leaving implicit the procedural knowledge of what to do, in what order, and under which conditions. As trajectories lengthen, agents can lose track of their objectives, invoke tools out of order, and repeat unproductive actions. We introduce the Procedural Graph: just as a knowledge graph organizes factual knowledge into (entity, relation, entity) triplets for what-is questions, a Procedural Graph organizes procedural knowledge into (procedure, relation, procedure) triplets for what-to-do questions. At each decision step, the framework localizes the agent's active node, and a guidance model translates the surrounding subgraph into step-level situational guidance that biases the solver's next action without dictating it. The graph is self-evolving: an LLM refiner contrasts failed trajectories with successful ones and edits the graph's topology and attributes, committing edits…","authors":["Yuxing Lu","Yicheng Chen","Shanchan Wu","Sercan Ö. Arık"],"date":"2026-09-08","url":"https://arxiv.org/abs/2609.09153","type":"preprint","doi":"10.48550/arxiv.2609.09153","arxiv":"2609.09153","repo":"","current":["7.2","14.1"],"suggested":["14.1","7.2","11.8","7.1","16.3"],"suggested_more":["4.1","11.11","10.4","4.4","13.2","8.4","11.6","1.2","11.1"],"claims":[],"derived_topics":{}},{"id":"resource:doi:10-1007-s11831-026-10675-8","title":"A Holistic Review of Agentic AI Frameworks, Applications, and Research Trajectories","abstract":"Abstract Agentic Artificial Intelligence (Agentic AI), as a new generation of intelligent systems, extends beyond mere text or image generation by incorporating components such as multi step reasoning, persistent memory, multi agent interaction, and purposeful tool use. These features enable autonomy and dynamic decision making in open and complex environments. This paper provides an extensive review of the existing literature on Agentic AI. To this end, the conceptual and historical distinctions between Agentic Artificial Intelligence, classical agents, and general-purpose language models are first examined. Subsequently, the proposed architectural framework encompassing perception, role adoption, memory, planning and reflection, action and tool use, and online learning is elaborated. The discussion then turns to key infrastructures, including state and memory management, orchestration and Machine Learning Operations (MLOps), as well as agent safety. Evaluation metrics and protocols are reviewed, ranging from interactive and long horizon testing to process level assessments.…","authors":["Pejman Peykani","Sanly Ghanidel","Iman Javadi-Sisi","Václav Snåšel","Seyedali Mirjalili"],"date":"2026-06-15","url":"https://doi.org/10.1007/s11831-026-10675-8","type":"peer-reviewed-paper","doi":"10.1007/s11831-026-10675-8","arxiv":"","repo":"","current":["3.1","16.1"],"suggested":["14.1","10.5","5.1","14.2"],"suggested_more":["5.2","12.4","15.6","12.1","16.4","1.1","11.10","1.4","10.4","14.4"],"claims":[],"derived_topics":{}},{"id":"resource:doi:10-1016-j-inffus-2025-103599","title":"AI Agents vs. Agentic AI: A Conceptual taxonomy, applications and challenges","abstract":"Information fusion, in the context of the Generative AI era, must distinguish AI Agents from Agentic AI. This review critically distinguishes between AI Agents and Agentic AI, offering a structured, conceptual taxonomy, application mapping, and analysis of opportunities and challenges to clarify their divergent design philosophies and capabilities. We begin by outlining the search strategy and foundational definitions, characterizing AI Agents as modular systems driven and enabled by LLMs and LIMs for task-specific automation. Generative AI is positioned as a precursor providing the foundation, with AI agents advancing through tool integration, prompt engineering, and reasoning enhancements. We then characterize Agentic AI systems, which, in contrast to AI Agents, represent a paradigm shift marked by multi-agent collaboration, dynamic task decomposition, persistent memory, and coordinated autonomy. Through a chronological evaluation of architectural evolution, operational mechanisms, interaction styles, and autonomy levels, we present a comparative analysis across both AI agents and…","authors":["Ranjan Sapkota","Konstantinos I. Roumeliotis","Manoj Karkee"],"date":"2025-08-22","url":"https://doi.org/10.1016/j.inffus.2025.103599","type":"peer-reviewed-paper","doi":"10.1016/j.inffus.2025.103599","arxiv":"","repo":"","current":["1.1","1.2"],"suggested":["5.1","15.2","11.6","14.1","1.1"],"suggested_more":["2.1","10.1","16.1","8.2","1.3","1.2","11.13","11.1","16.4"],"claims":[],"derived_topics":{}},{"id":"resource:doi:10-1016-j-patter-2025-101341","title":"Lessons from complex systems science for AI governance","abstract":"The study of complex adaptive systems, pioneered in physics, biology, and the social sciences, offers important lessons for artificial intelligence (AI) governance. Contemporary AI systems and the environments in which they operate exhibit many of the properties characteristic of complex systems, including nonlinear growth patterns, emergent phenomena, and cascading effects that can lead to catastrophic failures. Complex systems science can help illuminate the features of AI that pose central challenges for policymakers, such as feedback loops induced by training AI models on synthetic data and the interconnectedness between AI systems and critical infrastructure. Drawing on insights from other domains shaped by complex systems, including public health and climate change, we examine how efforts to govern AI are marked by deep uncertainty. To contend with this challenge, we propose three desiderata for designing a set of complexity-compatible AI governance principles comprised of early and scalable intervention, adaptive institutional design, and risk thresholds calibrated to trigger…","authors":["Noam Kolt","Michal Shur‐Ofry","Reuven Cohen"],"date":"2025-08-01","url":"https://doi.org/10.1016/j.patter.2025.101341","type":"peer-reviewed-paper","doi":"10.1016/j.patter.2025.101341","arxiv":"","repo":"","current":["15.3","3.4"],"suggested":["11.6","5.1","11.13","15.6"],"suggested_more":["4.2","2.1","11.10","16.4","11.4","5.4","4.1","16.3","6.1","11.8"],"claims":[],"derived_topics":{}},{"id":"resource:doi:10-1017-s0140525x2510174x","title":"Institutions as cached computation for resource-rational negotiation","abstract":"Resource-rational contractualism explains human moral reasoning as efficient heuristics approximating idealized bargaining processes. Levine et al. compellingly model pairwise and small-group moral cognition, but overlook how institutions serve as computational shortcuts - pre-computed agreements that eliminate repeated negotiation. These cached computations can become rigid over time, driving new opportunities for flexible negotiation.","authors":["Muhua Huang","James A. Evans"],"date":"2026-01-01","url":"https://doi.org/10.1017/s0140525x2510174x","type":"peer-reviewed-paper","doi":"10.1017/s0140525x2510174x","arxiv":"","repo":"","current":["1.2","5.2","15.3"],"suggested":["5.4","11.7","7.2"],"suggested_more":["4.3","11.3","8.2","1.2","2.5","2.6","11.4","2.4","7.1","13.2","1.4"],"claims":[],"derived_topics":{}},{"id":"resource:doi:10-1038-s41562-022-01383-x","title":"Human-centred mechanism design with Democratic AI","abstract":"Building artificial intelligence (AI) that aligns with human values is an unsolved problem. Here we developed a human-in-the-loop research pipeline called Democratic AI, in which reinforcement learning is used to design a social mechanism that humans prefer by majority. A large group of humans played an online investment game that involved deciding whether to keep a monetary endowment or to share it with others for collective benefit. Shared revenue was returned to players under two different redistribution mechanisms, one designed by the AI and the other by humans. The AI discovered a mechanism that redressed initial wealth imbalance, sanctioned free riders and successfully won the majority vote. By optimizing for human preferences, Democratic AI offers a proof of concept for value-aligned pol
