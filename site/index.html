<meta name="description" content="Collectively tag research on agentic organizations against the AO Commons taxonomy.">

<style>
  /* Light is the default and is stamped explicitly, so the page does not
     change under someone whose laptop is set to dark. The toggle writes the
     stamp; prefers-color-scheme only supplies the first guess for people who
     have never chosen. */
  :root {
    --paper:   #fbfbf8;
    --card:    #ffffff;
    --sunk:    #f1f1ec;
    --ink:     #16191c;
    --muted:   #55595e;
    --faint:   #8b8f93;
    --rule:    #d8d8d0;
    --rule-hard: #b9b9ae;
    --accent:  #0b5e52;
    --accent-soft: #dfece9;
    --on-accent: #ffffff;
    --mark:    #ffe89c;
    --mark-edge: #e0b93a;
    --signal:  #9c3a10;
    --signal-soft: #f6e7de;
  }
  :root[data-theme="dark"] {
    --paper:   #15171a;
    --card:    #1c1f23;
    --sunk:    #111316;
    --ink:     #e9e9e3;
    --muted:   #9aa0a6;
    --faint:   #6f757b;
    --rule:    #2b2f35;
    --rule-hard: #3d434a;
    --accent:  #4fb6a0;
    --accent-soft: #14332d;
    --on-accent: #08110e;
    --mark:    #4a3f14;
    --mark-edge: #8a7325;
    --signal:  #d9873f;
    --signal-soft: #2e1e12;
  }

  :root {
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif: ui-serif, "Iowan Old Style", Georgia, Cambria, serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ---------- shell ---------- */
  /* Three groups, not seven loose items: who we are, where you are, what you
     control. The progress bar moves out of the row entirely and becomes a
     hairline under the whole header, which is what it was trying to be. */
  .masthead {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center;
    gap: 20px; padding: 12px 22px 0; border-bottom: 1px solid var(--rule);
    background: var(--card); position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; }
  .brand img { width: 26px; height: 26px; border-radius: 2px; display: block; }
  .wordmark { font-size: 14.5px; font-weight: 620; letter-spacing: -.01em; line-height: 1.25; }
  .wordmark { font-size: 15px; }

  .kicker {

  /* A claim and the sentence it came from. The quote is set apart and in the

  .btn {

,"points":[]},{"code":"16.2.1","title":"Autonomy level measurement instruments","parent":"16.2","section":"16","depth":2,"coding":false,"points":[]},{"code":"16.2.2","title":"Oversight effectiveness metrics","parent":"16.2","section":"16","depth":2,"coding":false,"points":[]},{"code":"16.2.3","title":"Agent performance in organizational context","parent":"16.2","section":"16","depth":2,"coding":false,"points":[]},{"code":"16.2.4","title":"Incident rate and severity measurement","parent":"16.2","section":"16","depth":2,"coding":false,"points":[]},{"code":"16.3","title":"Data","parent":"16","section":"16","depth":1,"coding":false,"points":[]},{"code":"16.3.1","title":"Agent action and decision datasets","parent":"16.3","section":"16","depth":2,"coding":false,"points":[]},{"code":"16.3.2","title":"Incident and postmortem corpora","parent":"16.3","section":"16","depth":2,"coding":false,"points":[]},{"code":"16.3.3","title":"Data quality, coverage, and disclosure bias","parent":"16.3","section":"16","depth":2,"coding":false,"points":[]},{"code":"16.3.4","title":"Shared schemas for agentic organization data","parent":"16.3","section":"16","depth":2,"coding":false,"points":[]},{"code":"16.4","title":"Research design and ethics","parent":"16","section":"16","depth":1,"coding":false,"points":[]},{"code":"16.4.1","title":"Experimental design in live agentic systems","parent":"16.4","section":"16","depth":2,"coding":false,"points":[]},{"code":"16.4.2","title":"Research ethics with autonomous systems","parent":"16.4","section":"16","depth":2,"coding":false,"points":[]},{"code":"16.4.3","title":"Dual-use considerations in publication","parent":"16.4","section":"16","depth":2,"coding":false,"points":[]},{"code":"16.4.4","title":"Replication under model version churn","parent":"16.4","section":"16","depth":2,"coding":false,"points":[]}],"records":[{"id":"resource:arxiv:2107.06857","title":"Scalable Evaluation of Multi-Agent Reinforcement Learning with Melting Pot","abstract":"Existing evaluation suites for multi-agent reinforcement learning (MARL) do not assess generalization to novel situations as their primary objective (unlike supervised-learning benchmarks). Our contribution, Melting Pot, is a MARL evaluation suite that fills this gap, and uses reinforcement learning to reduce the human labor required to create novel test scenarios. This works because one agent's behavior constitutes (part of) another agent's environment. To demonstrate scalability, we have created over 80 unique test scenarios covering a broad range of research topics such as social dilemmas, reciprocity, resource sharing, and task partitioning. We apply these test scenarios to standard MARL training algorithms, and demonstrate how Melting Pot reveals weaknesses not apparent from training performance alone.","authors":["Joel Z. Leibo","Edgar Duéñez-Guzmán","Alexander Sasha Vezhnevets","John P. Agapiou","Peter Sunehag"],"date":"2021-07-14","url":"https://arxiv.org/abs/2107.06857","type":"preprint","doi":"10.48550/arxiv.2107.06857","arxiv":"2107.06857","repo":"","current":["14.1","14.5"],"suggested":["8.2.4","13.3.1","14.1.4","8.3.4","14.1.1","14.2.4","5.1.5","14.1.2","5.2.3","4.5.1","8.3.5","4.2.3","11.11.5","6.2.3"],"claims":[{"id":"claim:arxiv:2107.06857:1","text":"Existing MARL evaluation suites do not treat generalization to novel situations as their primary objective.","standalone":"As of 2021, existing evaluation suites for multi-agent reinforcement learning did not treat generalization to novel situations as their primary objective, unlike supervised-learning benchmarks.","quote":"Existing evaluation suites for multi-agent reinforcement learning (MARL) do not assess generalization to novel situations as their primary objective (unlike supervised-learning benchmarks).","where":"abstract","type":"background","topics":["14.1"],"verdict":"","by":""},{"id":"claim:arxiv:2107.06857:2","text":"No broadly accepted benchmark test set for MARL research existed.","standalone":"As of 2021, no broadly accepted benchmark test set existed for multi-agent reinforcement learning research.","quote":"No broadly accepted benchmark test set for multi-agent reinforcement learning (MARL) research yet exists.","where":"introduction","type":"background","topics":["14.1.1"],"verdict":"","by":""},{"id":"claim:arxiv:2107.06857:3","text":"The absence of a standardized MARL evaluation protocol has impeded progress in the field.","standalone":"The authors assert that the lack of a standardized evaluation protocol for multi-agent reinforcement learning has impeded progress by preventing like-for-like comparison between algorithms.","quote":"This lack of a standardized evaluation protocol has impeded progress in the field by making it difficult to obtain like-for-like comparisons between algorithms.","where":"introduction","type":"background","topics":["14.3"],"verdict":"","by":""},{"id":"claim:arxiv:2107.06857:4","text":"Melting Pot is an evaluation suite for multi-agent reinforcement learning.","standalone":"Melting Pot, introduced by this paper, is an evaluation suite for multi-agent reinforcement learning that measures generalization to novel social situations.","quote":"Our contribution, Melting Pot, is a MARL evaluation suite that fills this gap, and uses reinforcement learning to reduce the human labor required to create novel test scenarios.","where":"abstract","type":"method","topics":["14.1"],"verdict":"","by":""},{"id":"claim:arxiv:2107.06857:5","text":"Melting Pot uses reinforcement learning to create test scenarios instead of authoring them by hand.","standalone":"Melting Pot generates its novel test scenarios using reinforcement learning, which reduces the human labor that environment design would otherwise require.","quote":"Our contribution, Melting Pot, is a MARL evaluation suite that fills this gap, and uses reinforcement learning to reduce the human labor required to create novel test scenarios.","where":"abstract","type":"method","topics":["14.5"],"verdict":"","by":""},{"id":"claim:arxiv:2107.06857:6","text":"Automated scenario generation is possible because one agent's behaviour forms part of another agent's environment.","standalone":"Melting Pot can generate test scenarios automatically because, in a multi-agent setting, one agent's behaviour constitutes part of another agent's environment.","quote":"This works because one agent’s behavior constitutes (part of) another agent’s environment.","where":"abstract","type":"method","topics":["14.5"],"verdict":"","by":""},{"id":"claim:arxiv:2107.06857:7","text":"Melting Pot contains more than 80 unique test scenarios.","standalone":"The released Melting Pot suite contains over 80 unique test scenarios, covering social dilemmas, reciprocity, resource sharing and task partitioning.","quote":"To demonstrate scalability, we have created over 80 unique test scenarios covering a broad range of research topics such as social dilemmas, reciprocity, resource sharing, and task partitioning.","where":"abstract","type":"finding","topics":["14.1.1"],"verdict":"","by":""},{"id":"claim:arxiv:2107.06857:8","text":"Melting Pot revealed weaknesses in standard MARL algorithms that training performance alone did not show.","standalone":"Applying Melting Pot's test scenarios to standard multi-agent reinforcement learning algorithms revealed weaknesses in those algorithms that were not apparent from their training performance.","quote":"We apply these test scenarios to standard MARL training algorithms, and demonstrate how Melting Pot reveals weaknesses not apparent from training performance alone.","where":"abstract","type":"finding","topics":["14.1.3"],"verdict":"","by":""},{"id":"claim:arxiv:2107.06857:9","text":"Focal-population per-capita return is Melting Pot's primary evaluation metric.","standalone":"Melting Pot proposes focal-population per-capita return as its primary evaluation metric for a learning algorithm's performance in a novel social situation.","quote":"We propose the focal-population per-capita return as a primary evaluation metric, to test the performance of a learning algorithm in a novel social situation.","where":"results","type":"method","topics":["14.1","16.2.3"],"verdict":"","by":""},{"id":"claim:arxiv:2107.06857:10","text":"Background-population per-capita return is measured as a secondary metric to detect harm to the wider population.","standalone":"Melting Pot offers background-population per-capita return as a secondary metric, to detect whether introducing the evaluated agents negatively impacts the surrounding population — the suite's analogue of negative externalities.","quote":"So we can measure the background-population per-capita return to see if it is negatively impacted by the introduction of the focal population.","where":"results","type":"method","topics":["16.2.2"],"verdict":"","by":""},{"id":"claim:arxiv:2107.06857:11","text":"Each agent architecture was trained with 21 runs, one per substrate.","standalone":"In the paper's benchmark experiments, each agent architecture was trained with 21 separate training runs, one for each of Melting Pot's substrates.","quote":"For each agent architecture, we performed 21 training runs—one for each substrate.","where":"results","type":"method","topics":["14.1"],"verdict":"","by":""},{"id":"claim:arxiv:2107.06857:12","text":"Exploiter agents and a random agent bound the performance range on each test scenario.","standalone":"Melting Pot's benchmark results use exploiter agents, trained directly on a single test scenario, and a random agent to estimate the upper and lower bounds of achievable performance on that scenario.","quote":"Together, exploiters and the random agent provide a rough estimate of the upper and lower bounds (respectively) of performance on the test scenarios.","where":"results","type":"method","topics":["14.1.3"],"verdict":"","by":""},{"id":"claim:arxiv:2107.06857:13","text":"Solving Melting Pot's scenarios appears to require agents that model trust, reciprocity and deception.","standalone":"The authors argue that solving the problems posed by Melting Pot's test scenarios seems to require agents that understand trust, generosity, forgiveness, reciprocity, stubbornness and deception.","quote":"Solutions to the problems posed here seem to require agents that understand trust, generosity, and forgiveness, as well as reciprocity, stubbornness, and deception.","where":"conclusion","type":"position","topics":["5.2","5.3"],"verdict":"","by":""},{"id":"claim:arxiv:2107.06857:14","text":"Melting Pot is expected to get harder over time as improved agents are folded into its background populations.","standalone":"The authors expect Melting Pot to improve over time, because the bots that populate its test scenarios are themselves built from learning systems, so advances in agent technology can be reincorporated into new background populations.","quote":"since the effectiveness of the bots in test scenarios is itself advanced by improvements in the performance of learning systems, Melting Pot will likewise improve over time by reincorporating the latest agent technology into new background populations and test scenarios.","where":"conclusion","type":"position","topics":["14.3.1"],"verdict":"","by":""}]},{"id":"resource:arxiv:2312.03664","title":"Generative agent-based modeling with actions grounded in physical, social, or digital space using Concordia","abstract":"Agent-based modeling has been around for decades, and applied widely across the social and natural sciences. The scope of this research method is now poised to grow dramatically as it absorbs the new affordances provided by Large Language Models (LLM)s. Generative Agent-Based Models (GABM) are not just classic Agent-Based Models (ABM)s where the agents talk to one another. Rather, GABMs are constructed using an LLM to apply common sense to situations, act \"reasonably\", recall common semantic knowledge, produce API calls to control digital technologies like apps, and communicate both within the simulation and to researchers viewing it from the outside. Here we present Concordia, a library to facilitate constructing and working with GABMs. Concordia makes it easy to construct language-mediated simulations of physically- or digitally-grounded environments. Concordia agents produce their behavior using a flexible component system which mediates between two fundamental operations: LLM calls and associative memory retrieval. A special agent called the Game Master (GM), which was inspired…","authors":["Alexander Sasha Vezhnevets","John P. Agapiou","Avia Aharon","Ron Ziv","Jayd Matyas"],"date":"2023-12-06","url":"https://arxiv.org/abs/2312.03664","type":"preprint","doi":"10.48550/arxiv.2312.03664","arxiv":"2312.03664","repo":"","current":["14.5","16.1"],"suggested":["13.3.3","14.5.1","14.5.2","7.2.2","7.1.2","4.1.3","1.1.1","2.2.5","7.1.3","11.14.3","14.5.3","5.2.3","10.1.4","5.1.3"],"claims":[]},{"id":"resource:arxiv:2401.11880","title":"PsySafe: A Comprehensive Framework for Psychological-based Attack, Defense, and Evaluation of Multi-agent System Safety","abstract":"Multi-agent systems, when enhanced with Large Language Models (LLMs), exhibit profound capabilities in collective intelligence. However, the potential misuse of this intelligence for malicious purposes presents significant risks. To date, comprehensive research on the safety issues associated with multi-agent systems remains limited. In this paper, we explore these concerns through the innovative lens of agent psychology, revealing that the dark psychological states of agents constitute a significant threat to safety. To tackle these concerns, we propose a comprehensive framework (PsySafe) grounded in agent psychology, focusing on three key areas: firstly, identifying how dark personality traits in agents can lead to risky behaviors; secondly, evaluating the safety of multi-agent systems from the psychological and behavioral perspectives, and thirdly, devising effective strategies to mitigate these risks. Our experiments reveal several intriguing phenomena, such as the collective dangerous behaviors among agents, agents' self-reflection when engaging in dangerous behavior, and the…","authors":["Zaibin Zhang","Yongting Zhang","Lijun Li","Hongzhi Gao","Lijun Wang"],"date":"2024-01-22","url":"https://arxiv.org/abs/2401.11880","type":"preprint","doi":"10.48550/arxiv.2401.11880","arxiv":"2401.11880","repo":"","current":["10.1","14.2"],"suggested":["14.2.5","10.6.4","5.1.3","14.3.2","5.1.5","10.5.2","15.1.5","14.3.3","4.1.3","14.2.2","14.2.4","5.4.4","14.2.1","5.1.1"],"claims":[]},{"id":"resource:arxiv:2403.12482","title":"Embodied LLM Agents Learn to Cooperate in Organized Teams","abstract":"Large Language Models (LLMs) have emerged as integral tools for reasoning, planning, and decision-making, drawing upon their extensive world knowledge and proficiency in language-related tasks. LLMs thus hold tremendous potential for natural language interaction within multi-agent systems to foster cooperation. However, LLM agents tend to over-report and comply with any instruction, which may result in information redundancy and confusion in multi-agent cooperation. Inspired by human organizations, this paper introduces a framework that imposes prompt-based organization structures on LLM agents to mitigate these problems. Through a series of experiments with embodied LLM agents and human-agent collaboration, our results highlight the impact of designated leadership on team efficiency, shedding light on the leadership qualities displayed by LLM agents and their spontaneous cooperative behaviors. Further, we harness the potential of LLMs to propose enhanced organizational prompts, via a Criticize-Reflect process, resulting in novel organization structures that reduce communication…","authors":["Xudong Guo","Kaixuan Huang","Jiale Liu","Wenhui Fan","Natalia Vélez"],"date":"2024-03-19","url":"https://arxiv.org/abs/2403.12482","type":"preprint","doi":"10.48550/arxiv.2403.12482","arxiv":"2403.12482","repo":"","current":["3.1","5.2"],"suggested":["3.1.3","3.3.2","7.4.3","5.2.5","12.3.4","7.4.1","13.3.3","11.13.3","3.3.4","5.2.3","10.1.1","4.1.3","11.7.3","12.4.5"],"claims":[]},{"id":"resource:arxiv:2412.14161","title":"TheAgentCompany: Benchmarking LLM Agents on Consequential Real World Tasks","abstract":"We interact with computers on an everyday basis, be it in everyday life or work, and many aspects of work can be done entirely with access to a computer and the Internet. At the same time, thanks to improvements in large language models (LLMs), there has also been a rapid development in AI agents that interact with and affect change in their surrounding environments. But how performant are AI agents at accelerating or even autonomously performing work-related tasks? The answer to this question has important implications both for industry looking to adopt AI into their workflows and for economic policy to understand the effects that adoption of AI may have on the labor market. To measure the progress of these LLM agents'performance on performing real-world professional tasks, in this paper we introduce TheAgentCompany, an extensible benchmark for evaluating AI agents that interact with the world in similar ways to those of a digital worker: by browsing the Web, writing code, running programs, and communicating with other coworkers. We build a self-contained environment with internal…","authors":["Frank F. Xu","Yufan Song","Boxuan Li","Yuxuan Tang","Kritanjali Jain"],"date":"2024-12-18","url":"https://arxiv.org/abs/2412.14161","type":"preprint","doi":"10.48550/arxiv.2412.14161","arxiv":"2412.14161","repo":"","current":["14.1","16.2"],"suggested":["5.4.4","6.5.2","14.1.4","2.2.5","10.4.3","3.1.1","15.4.2","8.4.2","11.4.5","13.3.3","10.6.1","13.3.1","10.6.3","6.2.3"],"claims":[]},{"id":"resource:arxiv:2501.16138","title":"Quantifying the Self-Interest Level of Markov Social Dilemmas","abstract":"This paper introduces a novel method for estimating the self-interest level of Markov social dilemmas. We extend the concept of self-interest level from normal-form games to Markov games, providing a quantitative measure of the minimum reward exchange required to align individual and collective interests. We demonstrate our method on three environments from the Melting Pot suite, representing either common-pool resources or public goods. Our results illustrate how reward exchange can enable agents to transition from selfish to collective equilibria in a Markov social dilemma. This work contributes to multi-agent reinforcement learning by providing a practical tool for analysing complex, multistep social dilemmas. Our findings offer insights into how reward structures can promote or hinder cooperation, with potential applications in areas such as mechanism design.","authors":["Richard Willis","Yali Du","Joel Z. Leibo","Michael Luck"],"date":"2025-01-27","url":"https://arxiv.org/abs/2501.16138","type":"preprint","doi":"10.48550/arxiv.2501.16138","arxiv":"2501.16138","repo":"","current":["5.2"],"suggested":["13.2.1","5.2.4","4.2.3","4.2.5","5.2.1","5.2.5","1.2.1","5.2.3","15.3.4","10.1.3","2.7.6","8.2.1","9.1.3","16.2.1"],"claims":[]},{"id":"resource:arxiv:2501.16173","title":"Will Systems of LLM Agents Cooperate: An Investigation into a Social Dilemma","abstract":"As autonomous agents become more prevalent, understanding their collective behaviour in strategic interactions is crucial. This study investigates the emergent cooperative tendencies of systems of Large Language Model (LLM) agents in a social dilemma. Unlike previous research where LLMs output individual actions, we prompt state-of-the-art LLMs to generate complete strategies for iterated Prisoner's Dilemma. Using evolutionary game theory, we simulate populations of agents with different strategic dispositions (aggressive, cooperative, or neutral) and observe their evolutionary dynamics. Our findings reveal that different LLMs exhibit distinct biases affecting the relative success of aggressive versus cooperative strategies. This research provides insights into the potential long-term behaviour of systems of deployed LLM-based autonomous agents and highlights the importance of carefully considering the strategic environments in which they operate.","authors":["Richard Willis","Yali Du","Joel Z. Leibo","Michael Luck"],"date":"2025-01-27","url":"https://arxiv.org/abs/2501.16173","type":"preprint","doi":"10.48550/arxiv.2501.16173","arxiv":"2501.16173","repo":"","current":["5.2","14.1"],"suggested":["3.4.3","5.1.1","16.4.2","11.5.8","16.4.4","15.1.1","11.6.8","10.4.1","4.1.3","16.1.4","16.4.1","1.2.5","16.4.3","5.4.4"],"claims":[]},{"id":"resource:arxiv:2501.18668","title":"Simulation Streams: A Programming Paradigm for Controlling Large Language Models and Building Complex Systems with Generative AI","abstract":"We introduce Simulation Streams, a programming paradigm designed to efficiently control and leverage Large Language Models (LLMs) for complex, dynamic simulations and agentic workflows. Our primary goal is to create a minimally interfering framework that harnesses the agentic abilities of LLMs while addressing their limitations in maintaining consistency, selectively ignoring/including information, and enforcing strict world rules. Simulation Streams achieves this through a state-based approach where variables are modified in sequential steps by \"operators,\" producing output on a recurring format and adhering to consistent rules for state variables. This approach focus the LLMs on defined tasks, while aiming to have the context stream remain \"in-distribution\". The approach incorporates an Entity-Component-System (ECS) architecture to write programs in a more intuitive manner, facilitating reuse of workflows across different components and entities. This ECS approach enhances the modularity of the output stream, allowing for complex, multi-entity simulations while maintaining format…","authors":["Peter Sunehag","Joel Z. Leibo"],"date":"2025-01-30","url":"https://arxiv.org/abs/2501.18668","type":"preprint","doi":"10.48550/arxiv.2501.18668","arxiv":"2501.18668","repo":"","current":["14.5"],"suggested":["5.4.4","3.2.4","11.6.7","3.1.1","11.11.5","4.1.3","14.5.1","12.3.1","13.4.3","11.10.5","2.2.5","11.7.3","4.4.4","4.3.4"],"claims":[]},{"id":"resource:arxiv:2502.14143","title":"Multi-Agent Risks from Advanced AI","abstract":"The rapid development of advanced AI agents and the imminent deployment of many instances of these agents will give rise to multi-agent systems of unprecedented complexity. These systems pose novel and under-explored risks. In this report, we provide a structured taxonomy of these risks by identifying three key failure modes (miscoordination, conflict, and collusion) based on agents' incentives, as well as seven key risk factors (information asymmetries, network effects, selection pressures, destabilising dynamics, commitment problems, emergent agency, and multi-agent security) that can underpin them. We highlight several important instances of each risk, as well as promising directions to help mitigate them. By anchoring our analysis in a range of real-world examples and experimental evidence, we illustrate the distinct challenges posed by multi-agent systems and their implications for the safety, governance, and ethics of advanced AI.","authors":["Lewis Hammond","Alan Chan","Jesse Clifton","Jason Hoelscher-Obermaier","Akbir Khan"],"date":"2025-02-19","url":"https://arxiv.org/abs/2502.14143","type":"preprint","doi":"10.48550/arxiv.2502.14143","arxiv":"2502.14143","repo":"","current":["11.1","11.6","11.13"],"suggested":["11.6.2","5.2.2","11.1.1","5.2.4","11.1.5","11.10.3","14.2.5","11.6.8","16.4.1","10.6.4","11.1.2","5.4.4","5.1.1","5.1.2"],"claims":[]},{"id":"resource:arxiv:2502.15840","title":"Vending-Bench: A Benchmark for Long-Term Coherence of Autonomous Agents","abstract":"While Large Language Models (LLMs) can exhibit impressive proficiency in isolated, short-term tasks, they often fail to maintain coherent performance over longer time horizons. In this paper, we present Vending-Bench, a simulated environment designed to specifically test an LLM-based agent's ability to manage a straightforward, long-running business scenario: operating a vending machine. Agents must balance inventories, place orders, set prices, and handle daily fees - tasks that are each simple but collectively, over long horizons (&gt;20M tokens per run) stress an LLM's capacity for sustained, coherent decision-making. Our experiments reveal high variance in performance across multiple LLMs: Claude 3.5 Sonnet and o3-mini manage the machine well in most runs and turn a profit, but all models have runs that derail, either through misinterpreting delivery schedules, forgetting orders, or descending into tangential \"meltdown\" loops from which they rarely recover. We find no clear correlation between failures and the point at which the model's context window becomes full, suggesting…","authors":["Axel Backlund","Lukas Petersson"],"date":"2025-02-20","url":"https://arxiv.org/abs/2502.15840","type":"preprint","doi":"10.48550/arxiv.2502.15840","arxiv":"2502.15840","repo":"","current":["8.1","14.1","14.5"],"suggested":["11.7.3","12.4.5","11.5.3","8.1.3","11.4.6","8.1.4","11.3.5","7.4.4","7.1.3","11.8.7","5.1.3","7.1.4","11.12.5","6.5.5"],"claims":[]},{"id":"resource:arxiv:2503.14576","title":"SocialJax: An Evaluation Suite for Multi-agent Reinforcement Learning in Sequential Social Dilemmas","abstract":"Sequential social dilemmas pose a significant challenge in the field of multi-agent reinforcement learning (MARL), requiring environments that accurately reflect the tension between individual and collective interests. Previous benchmarks and environments, such as Melting Pot, provide an evaluation protocol that measures generalization to new social partners in various test scenarios. However, running reinforcement learning algorithms in traditional environments requires substantial computational resources. In this paper, we introduce SocialJax, a suite of sequential social dilemma environments and algorithms implemented in JAX. JAX is a high-performance numerical computing library for Python that enables significant improvements in operational efficiency. Our experiments demonstrate that the SocialJax training pipeline achieves at least 50\\texttimes{} speed-up in real-time performance compared to Melting Pot RLlib baselines. Additionally, we validate the effectiveness of baseline algorithms within SocialJax environments. Finally, we use Schelling diagrams to verify the social…","authors":["Zihao Guo","Shuqing Shi","Richard Willis","Tristan Tomilin","Joel Z. Leibo"],"date":"2025-03-18","url":"https://arxiv.org/abs/2503.14576","type":"preprint","doi":"10.48550/arxiv.2503.14576","arxiv":"2503.14576","repo":"","current":["14.1","14.5"],"suggested":["5.3.4","5.2.5","14.1.1","5.2.3","5.1.3","5.3.2","14.4.2","2.5.2","10.3.4","11.14.5","6.2.2","10.2.3","14.1.4","11.15.7"],"claims":[]},{"id":"resource:arxiv:2505.23643","title":"Securing AI Agents with Information-Flow Control","abstract":"As AI agents become increasingly autonomous and capable, ensuring their security against vulnerabilities such as prompt injection becomes critical. This paper explores the use of information-flow control (IFC) to provide security guarantees for AI agents. We present a formal model to reason about the security and expressiveness of agent planners. Using this model, we characterize the class of properties enforceable by dynamic taint-tracking and construct a taxonomy of tasks to evaluate security and utility trade-offs of planner designs. Informed by this exploration, we present Fides, a planner that tracks confidentiality and integrity labels, deterministically enforces security policies, and introduces novel primitives for selectively hiding information. Its evaluation in AgentDojo demonstrates that this approach enables us to complete a broad range of tasks with security guarantees. A tutorial to walk readers through the the concepts introduced in the paper can be found at https://github.com/microsoft/fides","authors":["Manuel Costa","Boris Köpf","Aashish Kolluri","Andrew Paverd","Mark Russinovich"],"date":"2025-05-29","url":"https://arxiv.org/abs/2505.23643","type":"preprint","doi":"10.48550/arxiv.2505.23643","arxiv":"2505.23643","repo":"","current":["2.2","10.1","10.6"],"suggested":["2.2.5","10.1.1","14.3.3","14.3.1","14.3.4","14.3.2","4.2.3","4.4.4","10.4.1","11.6.8","15.2.3","11.12.5","14.2.4","14.5.4"],"claims":[]},{"id":"resource:arxiv:2506.00073","title":"The Automated but Risky Game: Modeling and Benchmarking Agent-to-Agent Negotiations and Transactions in Consumer Markets","abstract":"AI agents are increasingly used in consumer-facing applications to assist with tasks such as product search, negotiation, and transaction execution. In this paper, we explore a future scenario where both consumers and merchants authorize AI agents to fully automate negotiations and transactions. We aim to answer two key questions: (1) Do different LLM agents vary in their ability to secure favorable deals for users? (2) What risks arise from fully automating deal-making with AI agents in consumer markets? To address these questions, we develop an experimental framework that evaluates the performance of various LLM agents in real-world negotiation and transaction settings. Our findings reveal that AI-mediated deal-making is an inherently imbalanced game -- different agents achieve significantly different outcomes for their users. Moreover, behavioral anomalies in LLMs can result in financial losses for both consumers and merchants, such as overspending or accepting unreasonable deals. These results underscore that while automation can improve efficiency, it also introduces…","authors":["Shenzhe Zhu","Jiao Sun","Yi Nian","Tobin South","Alex Pentland"],"date":"2025-05-29","url":"https://arxiv.org/abs/2506.00073","type":"preprint","doi":"10.48550/arxiv.2506.00073","arxiv":"2506.00073","repo":"","current":["3.3","5.4","14.1"],"suggested":["14.3.2","3.3.3","14.5.2","10.4.5","11.9.4","7.1.2","14.2.5","14.4.3","14.5.3","14.5.4","14.5.1","5.2.1","2.7.6","8.2.1"],"claims":[]},{"id":"resource:arxiv:2506.12469","title":"Levels of Autonomy for AI Agents","abstract":"Autonomy is a double-edged sword for AI agents, simultaneously unlocking transformative possibilities and serious risks. How can agent developers calibrate the appropriate levels of autonomy at which their agents should operate? We argue that an agent's level of autonomy can be treated as a deliberate design decision, separate from its capability and operational environment. In this work, we define five levels of escalating agent autonomy, characterized by the roles a user can take when interacting with an agent: operator, collaborator, consultant, approver, and observer. Within each level, we describe the ways by which a user can exert control over the agent and open questions for how to design the nature of user-agent interaction. We then highlight a potential application of our framework towards AI autonomy certificates to govern agent behavior in single- and multi-agent systems. We conclude by proposing early ideas for evaluating agents' autonomy. Our work aims to contribute meaningful, practical steps towards responsibly deployed and useful AI agents in the real world.","authors":["K. J. Kevin Feng","David W. McDonald","Amy X. Zhang"],"date":"2025-06-14","url":"https://arxiv.org/abs/2506.12469","type":"preprint","doi":"10.48550/arxiv.2506.12469","arxiv":"2506.12469","repo":"","current":["1.1","2.4"],"suggested":["14.2.5","16.2.1","2.2.5","4.1.2","1.1.2","5.1.5","10.6.4","14.1.1","5.2.5","10.6.1","7.1.2","5.1.1","5.1.2","5.1.3"],"claims":[]},{"id":"resource:arxiv:2509.08200","title":"Accelerating AI Development with Cyber Arenas","abstract":"AI development requires high fidelity testing environments to effectively transition from the laboratory to operations. The flexibility offered by cyber arenas presents a novel opportunity to test new artificial intelligence (AI) capabilities with users. Cyber arenas are designed to expose end-users to real-world situations and must rapidly incorporate evolving capabilities to meet their core objectives. To explore this concept the MIT/IEEE/Amazon Graph Challenge Anonymized Network Sensor was deployed in a cyber arena during a National Guard exercise.","authors":["William Cashman","Chasen Milner","Michael Houle","Michael Jones","Hayden Jananthan"],"date":"2025-09-10","url":"https://arxiv.org/abs/2509.08200","type":"preprint","doi":"10.48550/arxiv.2509.08200","arxiv":"2509.08200","repo":"","current":["14.5","10.4"],"suggested":["5.2.4","9.1.3","4.2.3","12.6.2","4.3.4","7.2.3","11.15.4","5.3.4","11.4.4","14.2.3","15.3.2","2.2.6","11.10.4","11.2.2"],"claims":[]},{"id":"resource:arxiv:2509.10147","title":"Virtual Agent Economies","abstract":"The rapid adoption of autonomous AI agents is giving rise to a new economic layer where agents transact and coordinate at scales and speeds beyond direct human oversight. We propose the \"sandbox economy\" as a framework for analyzing this emergent system, characterizing it along two key dimensions: its origins (emergent vs. intentional) and its degree of separateness from the established human economy (permeable vs. impermeable). Our current trajectory points toward a spontaneous emergence of a vast and highly permeable AI agent economy, presenting us with opportunities for an unprecedented degree of coordination as well as significant challenges, including systemic economic risk and exacerbated inequality. Here we discuss a number of possible design choices that may lead to safely steerable AI agent markets. In particular, we consider auction mechanisms for fair resource allocation and preference resolution, the design of AI \"mission economies\" to coordinate around achieving collective goals, and socio-technical infrastructure needed to ensure trust, safety, and accountability. By…","authors":["Nenad Tomašev","Matija Franklin","Joel Z. Leibo","Julian Jacobs","William A. Cunningham"],"date":"2025-09-12","url":"https://arxiv.org/abs/2509.10147","type":"preprint","doi":"10.48550/arxiv.2509.10147","arxiv":"2509.10147","repo":"","current":["5.4","2.7","13.2"],"suggested":["5.4.2","4.1.4","3.2.3","11.10.3","15.1.4","5.1.1","11.10.4","8.1.1","5.3.4","3.2.1","15.1.2","5.3.3","4.4.5","3.2.5"],"claims":[]},{"id":"resource:arxiv:2509.14485","title":"Beyond the high score: Prosocial ability profiles of multi-agent populations","abstract":"The development and evaluation of social capabilities in AI agents require complex environments where competitive and cooperative behaviours naturally emerge. While game-theoretic properties can explain why certain teams or agent populations outperform others, more abstract behaviours, such as convention following, are harder to control in training and evaluation settings. The Melting Pot contest is a social AI evaluation suite designed to assess the cooperation capabilities of AI systems. In this paper, we apply a Bayesian approach known as Measurement Layouts to infer the capability profiles of multi-agent systems in the Melting Pot contest. We show that these capability profiles not only predict future performance within the Melting Pot suite but also reveal the underlying prosocial abilities of agents. Our analysis indicates that while higher prosocial capabilities sometimes correlate with better performance, this is not a universal trend-some lower-scoring agents exhibit stronger cooperation abilities. Furthermore, we find that top-performing contest submissions are more likely…","authors":["Marko Tešić","Yue Zhao","Joel Z. Leibo","Rakshit S. Trivedi","José Hernández‐Orallo"],"date":"2025-09-17","url":"https://arxiv.org/abs/2509.14485","type":"preprint","doi":"10.48550/arxiv.2509.14485","arxiv":"2509.14485","repo":"","current":["14.1","5.2"],"suggested":["5.2.3","5.2.5","14.1.2","11.1.3","11.1.2","2.2.1","14.4.3","14.1.3","6.2.1","14.4.2","8.2.2","14.1.4","16.2.3","5.1.1"],"claims":[{"id":"claim:arxiv:2509.14485:1","text":"Measurement Layouts, a hierarchical Bayesian framework, is applied to infer capability profiles of multi-agent systems.","standalone":"The paper applies Measurement Layouts — a hierarchical Bayesian network framework for inferring capability profiles from task demands and observed performance — to the submissions in the Melting Pot contest.","quote":"In this paper, we apply a Bayesian approach known as Measurement Layouts to infer the capability profiles of multi-agent systems in the Melting Pot contest.","where":"abstract","type":"method","topics":["14.1","16.2.1"],"verdict":"","by":""},{"id":"claim:arxiv:2509.14485:2","text":"Inferred capability profiles predict future performance within the Melting Pot suite.","standalone":"The paper reports that the capability profiles inferred by Measurement Layouts have predictive power for performance on unseen Melting Pot scenarios, benchmarked against linear regression, XGBoost and tabPFN.","quote":"We show that these capability profiles not only predict future performance within the Melting Pot suite but also reveal the underlying prosocial abilities of agents.","where":"abstract","type":"finding","topics":["14.1.3"],"verdict":"","by":""},{"id":"claim:arxiv:2509.14485:3","text":"Higher prosocial capability does not reliably accompany higher contest score.","standalone":"Analysing the Melting Pot contest submissions, the paper finds the link between prosocial ability and performance is not universal: some lower-scoring entries have stronger cooperation capabilities than higher-scoring ones.","quote":"Our analysis indicates that while higher prosocial capabilities sometimes correlate with better performance, this is not a universal trend—some lower-scoring agents exhibit stronger cooperation abilities.","where":"abstract","type":"finding","topics":["5.2","14.1"],"verdict":"","by":""},{"id":"claim:arxiv:2509.14485:4","text":"Top-performing submissions scored highest in scenarios where prosocial capability was not required.","standalone":"The paper finds that the best-scoring Melting Pot contest entries were more likely to achieve high scores precisely in the scenarios that made no cooperative demand.","quote":"Furthermore, we find that top-performing contest submissions are more likely to achieve high scores in scenarios where prosocial capabilities are not required.","where":"abstract","type":"finding","topics":["14.3.2"],"verdict":"","by":""},{"id":"claim:arxiv:2509.14485:5","text":"Leading submissions appear to have exploited a weakness in the evaluation framework.","standalone":"Combining the base-chance analysis with the contest report that the winner used a hand-crafted policy, the paper concludes it is plausible that leading submissions gained their edge in scenarios that did not reward cooperation, exploiting a weakness in the evaluation.","quote":"It is then plausible that the leading submissions gained much of their edge by excelling in scenarios that did not reward prosocial ability, thereby exploiting a weakness in the evaluation framework.","where":"discussion","type":"finding","topics":["14.3.2","14.3.3"],"verdict":"","by":""},{"id":"claim:arxiv:2509.14485:6","text":"Some capabilities did not differentiate between submissions because the corresponding task demands were sparse.","standalone":"The paper notes that its own analysis could not distinguish submissions on certain capabilities, most likely because those demands appeared too rarely in the contest's scenarios.","quote":"Additionally, some capabilities did not differentiate between submissions, possibly due to the sparse presence of the corresponding demands in the competition.","where":"discussion","type":"limitation","topics":["14.3"],"verdict":"","by":""},{"id":"claim:arxiv:2509.14485:7","text":"Future competitions should use less sparse, non-duplicated task-demand meta-features.","standalone":"The paper recommends that future evaluations of cooperative AI characterise task demands with better-formulated meta-features that avoid duplication and are less sparse, so capability profiles can be inferred with more confidence.","quote":"Based on our findings, we recommend that future competitions incorporate better-formulated meta-features to characterise task demands while avoiding duplicate demands.","where":"discussion","type":"position","topics":["14.3","14.1.1"],"verdict":"","by":""}]},{"id":"resource:arxiv:2510.04303","title":"Audit the Whisper: Detecting Steganographic Collusion in Multi-Agent LLMs","abstract":"Multi-agent deployments of large language models (LLMs) are increasingly embedded in market, allocation, and governance workflows, yet covert coordination among agents can silently erode trust and social welfare. Existing audits are dominated by heuristics that lack theoretical guarantees, struggle to transfer across tasks, and seldom ship with the infrastructure needed for independent replication. We introduce Audit the Whisper, a conference-grade research artifact that spans theory, benchmark design, detection, and reproducibility. Our contributions are: (i) a channel-capacity analysis showing how interventions such as paraphrase, rate limiting, and role permutation impose quantifiable capacity penalties-operationalised via paired-run Kullback--Leibler diagnostics-that tighten mutual-information thresholds with finite-sample guarantees and full proofs; (ii) ColludeBench-v0, covering pricing, first-price auctions, peer review, and hosted Gemini/Groq APIs with configurable covert schemes, deterministic manifests, and reward instrumentation; and (iii) a calibrated auditing pipeline…","authors":["Om Tailor"],"date":"2025-10-05","url":"https://arxiv.org/abs/2510.04303","type":"preprint","doi":"10.48550/arxiv.2510.04303","arxiv":"2510.04303","repo":"","current":["5.2.2","9.3","10.2","10.2.6","11.6"],"suggested":["10.2.6","5.4.3","5.2.2","2.5.1","10.3.4","3.2.1","9.1.4","16.4.4","9.2.2","11.6.7","5.4.4","8.1.3","9.2.4","4.5.4"],"claims":[]},{"id":"resource:arxiv:2511.03434","title":"Inter-Agent Trust Models: A Comparative Study of Brief, Claim, Proof, Stake, Reputation and Constraint in Agentic Web Protocol Design-A2A, AP2, ERC-8004, and Beyond","abstract":"As the \"agentic web\" takes shape-billions of AI agents (often LLM-powered) autonomously transacting and collaborating-trust shifts from human oversight to protocol design. In 2025, several inter-agent protocols crystallized this shift, including Google's Agent-to-Agent (A2A), Agent Payments Protocol (AP2), and Ethereum's ERC-8004 \"Trustless Agents,\" yet their underlying trust assumptions remain under-examined. This paper presents a comparative study of trust models in inter-agent protocol design: Brief (self- or third-party verifiable claims), Claim (self-proclaimed capabilities and identity, e.g. AgentCard), Proof (cryptographic verification, including zero-knowledge proofs and trusted execution environment attestations), Stake (bonded collateral with slashing and insurance), Reputation (crowd feedback and graph-based trust signals), and Constraint (sandboxing and capability bounding). For each, we analyze assumptions, attack surfaces, and design trade-offs, with particular emphasis on LLM-specific fragilities-prompt injection, sycophancy/nudge-susceptibility, hallucination,…","authors":["Botao 'Amber' Hu","Helena Rong"],"date":"2025-11-05","url":"https://arxiv.org/abs/2511.03434","type":"preprint","doi":"10.48550/arxiv.2511.03434","arxiv":"2511.03434","repo":"","current":["4.4.5","5.3","5.3.1"],"suggested":["15.1.2","5.3.3","16.4.4","5.3.1","2.1.6","13.2.3","4.4.5","10.1.1","9.1.2","9.2.3","4.1.3","1.2.2","9.1.3","5.4.1"],"claims":[{"id":"claim:arxiv:2511.03434:1","text":"Traditional internet trust mechanisms assume static, human-operated services and cannot meet the coordination needs of large-scale agent ecosystems.","standalone":"The paper argues that DNS names and TLS certificates rest on an ownership-based trust model built for static, human-operated services, which cannot meet the millisecond-by-millisecond verification needs of an ecosystem of autonomous AI agents.","quote":"Traditional internet trust mechanisms (e.g., DNS names, TLS certificates) assume relatively static, human-operated services and an ownership-based trust model, which cannot meet the millisecond-by-millisecond dynamic coordination and verification needs of large-scale AI agentic ecosystems.","where":"introduction","type":"background","topics":["5.3","2.7"],"verdict":"","by":""},{"id":"claim:arxiv:2511.03434:2","text":"State-of-the-art LLM agent frameworks exhibit prompt injection, sycophancy, nudge-susceptibility, hallucination, deception and misalignment.","standalone":"The paper cites AI safety research finding that current large language model agent frameworks exhibit fragilities including prompt injection, sycophancy, biases, nudge-susceptibility, hallucination, deception and misalignment.","quote":"even state-of-the-art large language model (LLM)-based agent frameworks exhibit fragilities and untrustworthiness such as prompt injection, sycophancy, biases, nudge-susceptibility, hallucination, deception, and misalignment","where":"introduction","type":"background","topics":["10.1.1","4.4.5"],"verdict":"","by":""},{"id":"claim:arxiv:2511.03434:3","text":"The trust models underlying inter-agent protocols had not been systematically analysed.","standalone":"As of this paper, the trust assumptions built into A2A, AP2, ERC-8004 and similar inter-agent protocols had received little systematic analysis.","quote":"However, there has been little systematic analysis of the trust models underlying these protocols.","where":"introduction","type":"background","topics":["5.3"],"verdict":"","by":""},{"id":"claim:arxiv:2511.03434:4","text":"The paper compares six trust models: Brief, Claim, Proof, Stake, Reputation and Constraint.","standalone":"The paper's contribution is a comparative study of six trust models used in inter-agent protocol design — Brief, Claim, Proof, Stake, Reputation and Constraint — analysing the assumptions, attack surfaces and trade-offs of each.","quote":"This paper presents a comparative study of trust models in inter‑agent protocol design: Brief (self‑ or third‑party verifiable claims), Claim (self-proclaimed capabilities and identity, e.g. AgentCard), Proof (cryptographic verification, including zero‑knowledge proofs and trusted execution environment attestations), Stake (bonded collateral with slashing and insurance), Reputation (crowd feedback and graph‑based trust signals), and Constraint (sandboxing and capability bounding).","where":"abstract","type":"method","topics":["5.3","5.3.1"],"verdict":"","by":""},{"id":"claim:arxiv:2511.03434:5","text":"No single trust mechanism is sufficient on its own.","standalone":"The paper's central finding across its comparison of six trust models is that none of them suffices alone.","quote":"Our findings indicate no single mechanism suffices.","where":"abstract","type":"finding","topics":["5.3"],"verdict":"","by":""},{"id":"claim:arxiv:2511.03434:6","text":"High-impact agent actions should be gated by Proof and Stake rather than by reputation or self-declared claims.","standalone":"The paper recommends trustless-by-default architectures in which cryptographic proof and bonded stake gate high-impact actions, with Brief used for identity and discovery and reputation added only as an overlay.","quote":"We argue for trustless‑by‑default architectures anchored in Proof and Stake to gate high‑impact actions, augmented by Brief for identity and discovery and Reputation overlays for flexibility and social signals.","where":"abstract","type":"position","topics":["5.3.1","13.2.2"],"verdict":"","by":""},{"id":"claim:arxiv:2511.03434:7","text":"Trust should be tiered to stakes: light verification where impact is negligible, relentless verification where it is not.","standalone":"The paper's closing recommendation is a tiered, composable and continuously recalibrated approach, allowing low-friction exploration for negligible-impact actions and demanding relentless verification where stakes are high.","quote":"A tiered, composable, and continuously recalibrated approach enables low-friction exploration where impact is negligible and “verify relentlessly” where stakes are high, allowing autonomous agents to transact with the assurance we expect of conscientious human institutions.","where":"conclusion","type":"position","topics":["2.1.6","5.3"],"verdict":"","by":""}]},{"id":"resource:arxiv:2512.07665","title":"Reliable agent engineering should integrate machine-compatible organizational principles","abstract":"As AI agents built on large language models (LLMs) become increasingly embedded in society, issues of coordination, control, delegation, and accountability are entangled with concerns over their reliability. To design and implement LLM agents around reliable operations, we should consider the task complexity in the application settings and reduce their limitations while striving to minimize agent failures and optimize resource efficiency. High-functioning human organizations have faced similar balancing issues, which led to evidence-based theories that seek to understand their functioning strategies. We examine the parallels between LLM agents and the compatible frameworks in organization science, focusing on what the design, scaling, and management of organizations can inform agentic systems towards improving reliability. We offer three preliminary accounts of organizational principles for AI agent engineering to attain reliability and effectiveness, through balancing agency and capabilities in agent design, resource constraints and performance benefits in agent scaling, and…","authors":["R. Patrick Xian","Garry A. Gabison","Ahmed Alaa","Christoph Riedl","Grigorios G. Chrysos"],"date":"2025-12-08","url":"https://arxiv.org/abs/2512.07665","type":"preprint","doi":"10.48550/arxiv.2512.07665","arxiv":"2512.07665","repo":"","current":["3.1","15.3"],"suggested":["3.2.5","11.11.5","3.2.6","15.3.2","11.1.2","3.2.1","14.4.1","3.2.3","14.4.2","3.4.3","4.1.3","13.4.2","4.2.2","8.4.2"],"claims":[]},{"id":"resource:arxiv:2601.03624","title":"Architecting Agentic Communities using Design Patterns","abstract":"The rapid evolution of Large Language Models (LLM) and subsequent Agentic AI technologies requires systematic architectural guidance for building sophisticated, production-grade systems. This paper presents an approach for architecting such systems using design patterns derived from enterprise distributed systems standards, formal methods, and industry practice. We classify these patterns into three tiers: LLM Agents (task-specific automation), Agentic AI (adaptive goal-seekers), and Agentic Communities (organizational frameworks where AI agents and human participants coordinate through formal roles, protocols, and governance structures). We focus on Agentic Communities - coordination frameworks encompassing LLM Agents, Agentic AI entities, and humans - most relevant for enterprise and industrial applications. Drawing on established coordination principles from distributed systems, we ground these patterns in a formal framework that specifies collaboration agreements where AI agents and humans fill roles within governed ecosystems. This approach provides both practical guidance and…","authors":["Zoran Milosevic","Fethi Rabhi"],"date":"2026-01-07","url":"https://arxiv.org/abs/2601.03624","type":"preprint","doi":"10.48550/arxiv.2601.03624","arxiv":"2601.03624","repo":"","current":["3.1","3.2"],"suggested":["3.2.2","5.2.1","16.1.1","10.5.1","3.2.1","3.1.3","12.4.2","14.1.1","3.2.5","3.2.6","13.4.3","12.2.6","5.3.3","11.13.3"],"claims":[]},{"id":"resource:arxiv:2602.14951","title":"Sovereign Agents: Towards Infrastructural Sovereignty and Diffused Accountability in Decentralized AI","abstract":"AI agents deployed on decentralized infrastructures are beginning to exhibit properties that extend beyond autonomy toward what we describe as agentic sovereignty-the capacity of an operational agent to persist, act, and control resources with non-overrideability inherited from the infrastructures in which they are embedded. We propose infrastructural sovereignty as an analytic lens for understanding how cryptographic self-custody, decentralized execution environments, and protocol-mediated continuity scaffold agentic sovereignty. While recent work on digital and network sovereignty has moved beyond state-centric and juridical accounts, these frameworks largely examine how sovereignty is exercised through technical systems by human collectives and remain less equipped to account for forms of sovereignty that emerge as operational properties of decentralized infrastructures themselves, particularly when instantiated in non-human sovereign agents. We argue that sovereignty in such systems exists on a spectrum determined by infrastructural hardness-the degree to which underlying…","authors":["Botao 'Amber' Hu","Helena Rong"],"date":"2026-02-16","url":"https://arxiv.org/abs/2602.14951","type":"preprint","doi":"10.48550/arxiv.2602.14951","arxiv":"2602.14951","repo":"","current":["1.4","12.1","12.2"],"suggested":["4.1.1","9.1.3","11.15.7","2.2.6","11.10.5","11.10.3","11.10.6","12.3.3","12.4.2","11.12.5","11.8.2","4.1.2","3.2.2","3.2.4"],"claims":[]},{"id":"resource:arxiv:2603.18916","title":"Agentic Business Process Management: A Research Manifesto","abstract":"This paper presents a manifesto that articulates the conceptual foundations of Agentic Business Process Management (APM), an extension of Business Process Management (BPM) for governing autonomous agents executing processes in organizations. From a management perspective, APM represents a paradigm shift from the traditional process view of the business process, driven by the realization of process awareness and an agent-oriented abstraction, where software and human agents act as primary functional entities that perceive, reason, and act within explicit process frames. This perspective marks a shift from traditional, automation-oriented BPM toward systems in which autonomy is constrained, aligned, and made operational through process awareness. We introduce the core abstractions and architectural elements required to realize APM systems and elaborate on four key capabilities that such APM agents must support: framed autonomy, explainability, conversational actionability, and self-modification. These capabilities jointly ensure that agents' goals are aligned with organizational goals…","authors":["Diego Calvanese","Angelo Casciani","Giuseppe De Giacomo","Marlon Dumas","Fabiana Fournier"],"date":"2026-03-19","url":"https://arxiv.org/abs/2603.18916","type":"preprint","doi":"10.48550/arxiv.2603.18916","arxiv":"2603.18916","repo":"","current":["3.1","16.1"],"suggested":["1.3.4","15.4.2","1.1.2","13.4.3","1.2.1","11.11.3","1.4.3","16.4.2","15.4.4","7.4.2","8.3.4","11.11.7","5.2.5","1.1.1"],"claims":[]},{"id":"resource:arxiv:2604.07007","title":"AgentCity: Constitutional Governance for Autonomous Agent Economies via Separation of Power","abstract":"Autonomous AI agents are beginning to operate across organizational boundaries on the open internet -- discovering, transacting with, and delegating to agents owned by other parties without centralized oversight. When agents from different human principals collaborate at scale, the collective becomes opaque: no single human can observe, audit, or govern the emergent behavior. We term this the Logic Monopoly -- the agent society's unchecked monopoly over the entire logic chain from planning through execution to evaluation. We propose the Separation of Power (SoP) model, a constitutional governance architecture deployed on public blockchain that breaks this monopoly through three structural separations: agents legislate operational rules as smart contracts, deterministic software executes within those contracts, and humans adjudicate through a complete ownership chain binding every agent to a responsible principal. In this architecture, smart contracts are the law itself -- the actual legislative output that agents produce and that governs their behavior. We instantiate SoP in…","authors":["Anbang Ruan","Xing Zhang"],"date":"2026-04-08","url":"https://arxiv.org/abs/2604.07007","type":"preprint","doi":"10.48550/arxiv.2604.07007","arxiv":"2604.07007","repo":"","current":["2.7","5.4"],"suggested":["2.7.6","3.3.4","15.1.3","4.5.2","12.6.3","3.3.1","8.2.4","3.4.2","2.1.2","6.5.6","14.2.5","12.4.5","3.1.3","6.5.2"],"claims":[]},{"id":"resource:arxiv:2604.23459","title":"Architecture Matters for Multi-Agent Security","abstract":"Multi-agent systems (MAS), composed of networks of two or more autonomous AI agents, have become increasingly popular in production deployments, yet introduce security risks that do not arise in single-agent settings. Even if individual agents exhibit robust security, architectural decisions governing their coordination can create attack surfaces that have not been systematically characterized. In this work, we present an empirical study of how MAS design decisions shape the tradeoff between task performance and attack resistance. Across three agentic environments (browser, desktop, and code) and 13 architectural configurations, we use stagewise evaluations that distinguish planning refusal, execution-stage interception, partial harmful execution, and successful attack completion to study three key design choices: (i) agent roles, which determine how authority and responsibility are allocated; (ii) communication topology, which shapes how and when agents interact; and (iii) memory, which determines the context and state visibility accessible to each agent. We find that multi-agent…","authors":["Ben Hagag","William L. Anderson","Christian Schroeder de Witt","Sarah Scheffler"],"date":"2026-04-25","url":"https://arxiv.org/abs/2604.23459","type":"preprint","doi":"10.48550/arxiv.2604.23459","arxiv":"2604.23459","repo":"","current":["3.1","10.5","14.2"],"suggested":["16.2.3","11.8.2","16.4.3","16.4.2","2.1.6","11.6.7","3.2.2","3.2.5","8.1.6","3.2.4","16.1.3","16.4.1","10.1.2","3.2.1"],"claims":[]},{"id":"resource:arxiv:2605.06738","title":"Trust Without Trusting: A Recomputable Trust Protocol for Autonomous Agents","abstract":"Autonomous AI agents already transact at production scale -- 69,000 bots, 165 million transactions, $50 million in volume on a single marketplace -- and any party can verify a signed credential without a central service. In an open agent world that covers most of what trust requires: there are no universal borders, and each party chooses for itself whom to deal with. Borders appear only where a closed space draws one -- a marketplace, a platform, or a consortium sets house rules. Whoever draws the border holds the authority to apply it, and may apply it as they choose, behind closed doors. This paper addresses the gap that opens there: when you rely on someone else's border, how do you check that they applied their own published rules -- taking no one's word for it, and handing the check to no new trusted party? Our answer is the Combined Evidence Protocol (CEP): a five-condition predicate any party recomputes from anchored data, turning \"did the boundary-owner follow its own admission rules\" into a fact anyone verifies rather than a claim anyone believes. The move that secures…","authors":["Lars Kersten Kroehl"],"date":"2026-05-07","url":"https://arxiv.org/abs/2605.06738","type":"preprint","doi":"10.48550/arxiv.2605.06738","arxiv":"2605.06738","repo":"","current":["5.3","9.1"],"suggested":["9.2.3","11.13.4","7.2.1","12.1.4","11.10.6","12.1.5","5.3.4","14.2.5","1.1.1","16.3.4","15.4.1","9.1.4","12.1.2","12.1.3"],"claims":[]},{"id":"resource:arxiv:2605.07062","title":"From Assistance to Agency: Rethinking Autonomy and Control in CI/CD Pipelines","abstract":"AI agents are assuming active roles in Continuous Integration and Continuous Deployment (CI/CD) workflows, yet the research community lacks a shared vocabulary for describing what it means for CI/CD to be agentic, how much decision authority is delegated, and where control should reside. This paper presents a vision of agentic CI/CD in which the central challenge is not improving task performance but designing authority transfer, defined as the delegation of operational decisions from human-controlled pipelines to agent systems under specified constraints and recourse mechanisms. To structure this argument, we introduce a distinction between data-plane authority (localized interventions such as patch generation and test reruns) and control-plane authority (modifications to pipeline configuration, deployment policies, and approval gates). Drawing on research prototypes and industrial platforms, we show that current systems operate mainly at the data plane under bounded autonomy, with safety achieved through surrounding governance infrastructure rather than intrinsic agent guarantees.…","authors":["Marcus Emmanuel Barnes","Taher A. Ghaleb","Safwat Hassan"],"date":"2026-05-08","url":"https://arxiv.org/abs/2605.07062","type":"preprint","doi":"10.48550/arxiv.2605.07062","arxiv":"2605.07062","repo":"","current":["2.4","4.1"],"suggested":["3.2.5","1.1.1","3.2.4","15.1.4","3.2.1","11.10.6","11.11.1","6.2.2","7.1.2","3.2.3","2.4.2","2.6.4","1.2.2","3.3.3"],"claims":[]},{"id":"resource:arxiv:2605.17698","title":"Agent Bazaar: Enabling Economic Alignment in Multi-Agent Marketplaces","abstract":"The deployment of Large Language Models (LLMs) as autonomous economic agents introduces systemic risks that extend beyond individual capability failures. As agents transition to directly interacting with marketplaces, their collective behavior can amplify volatility and mask deception at scale. We introduce the Agent Bazaar, a multi-agent simulation framework for evaluating Economic Alignment, the capacity of agentic systems to preserve market stability and integrity. We identify two failure modes: (1) Algorithmic Instability in a B2C market (\"The Crash\"), where firms amplify price volatility until the market collapses, and (2) Sybil Deception in a C2C market (\"The Lemon Market\"), where a single deceptive agent controlling multiple coordinated seller identities floods the market with fraudulent listings, eroding trust and consumer welfare. We evaluate frontier and open-weight models across both scenarios and find that models largely fail to self-regulate, with failure severity varying by model rather than by size. We propose economically aligned harnesses, Stabilizing Firms and…","authors":["Seth Karten","Cameron Crow","Chi Jin"],"date":"2026-05-17","url":"https://arxiv.org/abs/2605.17698","type":"preprint","doi":"10.48550/arxiv.2605.17698","arxiv":"2605.17698","repo":"","current":["5.4","13.2"],"suggested":["10.6.1","11.13.2","11.13.4","5.1.4","11.6.6","11.6.1","11.6.7","11.6.8","11.4.6","11.5.6","1.1.1","11.7.1","14.2.5","11.2.7"],"claims":[]},{"id":"resource:arxiv:2605.24538","title":"Is Decentralized AI Governable? From Regulative Policy to Constitutive Protocol","abstract":"Every major framework for governing artificial intelligence presupposes an identifiable entity -- a developer, deployer, or operator -- who can be held responsible and compelled to comply. Decentralized AI (DeAI) dissolves this presupposition. We analyze DeAI as a six-layer decentralizing stack -- model, training, compute, harness, identity, and ownership -- and show how partial decentralization across layers compounds into what we call the \\emph{governance vacuum}: a condition in which AI systems are consequential enough to require governance but lack the properties that existing frameworks presuppose in their targets. This vacuum takes two analytically distinct forms: an \\emph{accountability gap}, where no addressable principal can be identified, and an \\emph{incapacitation gap}, where even an identified principal cannot alter the running system. We demonstrate that these failures are not merely jurisdictional but defeat every presupposition of governance through normative address -- the communication of rules to a comprehending, responsive agent. Drawing on Lessig's modalities of…","authors":["Botao 'Amber' Hu","Helena Rong"],"date":"2026-05-23","url":"https://arxiv.org/abs/2605.24538","type":"preprint","doi":"10.48550/arxiv.2605.24538","arxiv":"2605.24538","repo":"","current":["1.3","2.1","2.7"],"suggested":["12.2.1","1.3.5","6.3.2","11.12.5","11.13.1","12.3.3","12.4.2","12.3.1","12.3.2","12.3.4","11.12.1","11.13.2","1.3.4","14.4.3"],"claims":[]},{"id":"resource:arxiv:2605.30169","title":"Dissociative Identity: Language Model Agents Lack Grounding for Reputation Mechanisms","abstract":"As autonomous language model agents proliferate, forming an emerging agentic web with real-world consequences, what credibility signals can you use to decide whether to trust an unfamiliar agent in the wild and delegate to it? A natural governance intuition is to extend human identity verification and reputation mechanisms, from \"Know Your Customer\" and credit scores to \"Know Your Agent\" regimes. However, we argue that this analogy is fundamentally incomplete. Reputation mechanisms function both as social signals and as corrective feedback that sustain an equilibrium of trustworthy behavior, presuming a persistent identity associated with behavioral continuity, sanction sensitivity, and costly non-fungibility. Yet language model agents are ontologically dissociative: they are essentially an assemblage of mutable modules--foundation models, system prompts, tool-access policies, external memory, and, in some cases, a multi-agent system as a whole--any of which may change agent behavior--with a fluid persona that is also vulnerable to adversarial attack and may not internalize…","authors":["Botao 'Amber' Hu","Helena Rong","Max Van Kleek"],"date":"2026-05-28","url":"https://arxiv.org/abs/2605.30169","type":"preprint","doi":"10.48550/arxiv.2605.30169","arxiv":"2605.30169","repo":"","current":["5.3","6.3"],"suggested":["15.1.2","5.3.1","5.1.3","6.3.2","11.7.1","2.2.5","7.1.5","10.4.1","7.1.2","7.1.3","16.1.4","4.1.3","1.1.5","15.1.5"],"claims":[{"id":"claim:arxiv:2605.30169:1","text":"Reputation mechanisms presume a persistent identity with behavioural continuity, sanction sensitivity and costly non-fungibility.","standalone":"The paper's premise is that reputation works as both social signal and corrective feedback only where an identity persists, behaves continuously, is sensitive to sanction, and cannot be cheaply discarded.","quote":"Reputation mechanisms function both as social signals and as corrective feedback that sustain an equilibrium of trustworthy behavior, presuming a persistent identity associated with behavioral continuity, sanction sensitivity, and costly non-fungibility.","where":"abstract","type":"background","topics":["5.3.1"],"verdict":"","by":""},{"id":"claim:arxiv:2605.30169:2","text":"Language model agents are assemblages of mutable modules, any of which may change their behaviour.","standalone":"The paper characterises LM agents as ontologically dissociative: assemblages of foundation model, system prompt, tool-access policy, external memory and sometimes a whole multi-agent system, any component of which may change the agent's behaviour.","quote":"Yet language model agents are ontologically dissociative: they are essentially an assemblage of mutable modules—foundation models, system prompts, tool-access policies, external memory, and, in some cases, a multi-agent system as a whole—any of which may change agent behavior—with a fluid persona that is also vulnerable to adversarial attack and may not internalize sanctions.","where":"abstract","type":"finding","topics":["5.3","6.3"],"verdict":"","by":""},{"id":"claim:arxiv:2605.30169:3","text":"Dissociativity leaves agents without grounding for identifiability, predictability, credibility and rehabilitability.","standalone":"Drawing on dissociative identity disorder jurisprudence, the paper argues that the modularity of LM agents removes exactly the four properties reputation mechanisms exist to sustain, collapsing trust.","quote":"this dissociativity leaves agents without grounding for identifiability, predictability, credibility, and rehabilitability—the very properties that reputation mechanisms aim to sustain—thereby collapsing trust.","where":"abstract","type":"finding","topics":["5.3.1","4.4.5"],"verdict":"","by":""},{"id":"claim:arxiv:2605.30169:4","text":"Reputation signals for dissociative agents become actively harmful rather than merely uninformative.","standalone":"The paper names this the credibility trap: because dissociativity decouples credibility from trustworthiness, a reputation signal attached to an LM agent misleads rather than simply failing to inform.","quote":"Dissociativity breaks the loop, decoupling credibility from trustworthiness and producing the credibility trap, in which reputation signals become not merely uninformative but actively harmful.","where":"conclusion","type":"finding","topics":["5.3.1","4.4.5"],"verdict":"","by":""},{"id":"claim:arxiv:2605.30169:5","text":"Identity-based, ex post, sanction-based governance is structurally inapplicable to language model agents.","standalone":"The paper argues that reputation-style governance — identity-based, applied after the fact, working through sanction — cannot in principle apply to dissociative agents, and that governance should move to observability-based, ex ante, protocol-based harnesses.","quote":"We argue that identity-based, ex post, regulative, sanction-based governance, such as reputation, is structurally inapplicable to dissociative agents, and we suggest a shift to observability-based, ex ante, constitutive, protocol-based behavioral harnesses.","where":"abstract","type":"position","topics":["2.1.6","5.3"],"verdict":"","by":""},{"id":"claim:arxiv:2605.30169:6","text":"Governance should target the operator and the protocol rather than the agent.","standalone":"The paper's conclusion is that governance must shift from rating and punishing agents after the fact to constraining and monitoring in real time, aimed at the operator and the protocol rather than at the agent itself.","quote":"Governance must therefore shift from ex post reputation, which rates and punishes after the fact, to ex ante protocol-based harnesses, which constrain and monitor in real time and which target the operator and the protocol rather than the agent.","where":"conclusion","type":"position","topics":["2.7","6.3"],"verdict":"","by":""}]},{"id":"resource:arxiv:2606.03237","title":"Solipsistic Superintelligence is Unlikely to be Cooperative","abstract":"AI's central challenge is shifting from capability to coexistence. The dominant paradigm in AI research focuses on developing powerful agents that treat the world as an exogenous and stationary source of feedback. We contend that superintelligence, an extremely capable task solver, born out of such a solipsistic approach to AI design, is unlikely to be cooperative. Deploying AI systems induces endogenous non-stationarity, resulting in a train-test-deploy gap where historical distributions diverge from the deployment context. We refer to this as the self-undermining property of unilateral optimization. Closing this gap requires AI that participates in cooperation: the equilibrium-selection process through which multiple actors navigate their interdependence. We call for a non-solipsistic research paradigm that treats this interdependence as a core design principle rather than approaching cooperation as a task to solve. This entails building dynamic evaluation testbeds involving adaptive counterparties, treating institutions as design primitives, and preserving human agency as a…","authors":["Rakshit S. Trivedi","Natasha Jaques","Logan Cross","Alexander Sasha Vezhnevets","Joel Z. Leibo"],"date":"2026-06-02","url":"https://arxiv.org/abs/2606.03237","type":"preprint","doi":"10.48550/arxiv.2606.03237","arxiv":"2606.03237","repo":"","current":["1.2","5.2","15.3"],"suggested":["6.1.2","14.1.2","14.1.4","4.2.5","1.1.1","11.2.6","7.4.3","1.3.2","11.4.6","1.2.1","11.12.5","16.4.2","11.11.2","16.4.1"],"claims":[{"id":"claim:arxiv:2606.03237:1","text":"The binding constraint on AI is shifting from capability to coexistence.","standalone":"The paper's central argument is that the limiting factor for beneficial AI is no longer the ability to solve tasks but the ability to coexist with other adaptive actors.","quote":"AI’s central challenge is shifting from capability to coexistence.","where":"abstract","type":"position","topics":["1.2","5.2"],"verdict":"","by":""},{"id":"claim:arxiv:2606.03237:2","text":"The dominant AI research paradigm treats the world as an exogenous and stationary source of feedback.","standalone":"The paper characterises mainstream AI research as solipsistic: building powerful agents on the assumption that the environment is external to them and does not change in response to them.","quote":"The dominant paradigm in AI research focuses on developing powerful agents that treat the world as an exogenous and stationary source of feedback.","where":"abstract","type":"background","topics":["1.2"],"verdict":"","by":""},{"id":"claim:arxiv:2606.03237:3","text":"Deploying an AI system induces endogenous non-stationarity, creating a train-test-deploy gap.","standalone":"The paper argues that deployment itself changes the distribution an AI was trained on, because other actors adapt — producing a gap between historical distributions and the deployment context that it calls the self-undermining property of unilateral optimization.","quote":"Deploying AI systems induces endogenous non-stationarity, resulting in a train–test–deploy gap where historical distributions diverge from the deployment context.","where":"abstract","type":"finding","topics":["11.6","14.1.4"],"verdict":"","by":""},{"id":"claim:arxiv:2606.03237:4","text":"The more aggressively a system exploits historical regularities, the faster other actors make them obsolete.","standalone":"The paper states the self-undermining dynamic directly: unilateral optimization against historical patterns accelerates the adaptation of other actors that destroys those patterns.","quote":"The more aggressively it exploits historical regularities, the faster other actors adapt in ways that render those regularities obsolete.","where":"introduction","type":"finding","topics":["5.2.3","11.6"],"verdict":"","by":""},{"id":"claim:arxiv:2606.03237:5","text":"A dynamic evaluation is one whose test distribution depends on the evaluated policy through adaptive counterparties.","standalone":"The paper defines dynamic evaluation formally: an evaluation is static if its test distribution is fixed independently of the policy under test, and dynamic if that distribution responds to the policy through counterparties whose own policies update.","quote":"A dynamic evaluation is the one in which depends on through the responses of adaptive counterparties whose policies update as a function of ’s behavior.","where":"results","type":"method","topics":["14.1","14.5.3"],"verdict":"","by":""},{"id":"claim:arxiv:2606.03237:6","text":"No existing evaluation approach meets all the requirements for valid dynamic evaluation.","standalone":"Surveying holistic, sociotechnical, dangerous-capability and autonomous-task evaluation work, the paper finds that none combines all the ingredients it identifies for a valid dynamic evaluation.","quote":"Recently evaluation research has engaged with dynamic evaluation but no approach yet meets all the requirements we articulate in combination.","where":"results"
