<style>
  /* Light palette on bare :root, so the un-stamped "system" state resolves. */
  :root {
    --ground:  #f6f7f9;
    --surface: #ffffff;
    --sunk:    #eef1f5;
    --ink:     #131820;
    --muted:   #5a6472;
    --faint:   #8892a0;
    --rule:    #dce1e8;
    --accent:  #2f6f5e;
    --accent-soft: #e4efea;
    --accent-ink:  #1d5546;
    --on-accent:   #ffffff;
    --signal:  #a9501e;
    --signal-soft: #f7ece4;
    --shadow: 0 1px 2px rgba(19, 24, 32, .06), 0 8px 24px rgba(19, 24, 32, .05);

    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif: ui-serif, "Iowan Old Style", Georgia, Cambria, serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:  #0d1117;
      --surface: #151b23;
      --sunk:    #10151c;
      --ink:     #e4e9f0;
      --muted:   #8b95a5;
      --faint:   #6b7686;
      --rule:    #232b36;
      --accent:  #57a48c;
      --accent-soft: #16302a;
      --accent-ink:  #7cc0aa;
      --on-accent:   #08110e;
      --signal:  #d0793c;
      --signal-soft: #2c1d13;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --ground:  #0d1117;
    --surface: #151b23;
    --sunk:    #10151c;
    --ink:     #e4e9f0;
    --muted:   #8b95a5;
    --faint:   #6b7686;
    --rule:    #232b36;
    --accent:  #57a48c;
    --accent-soft: #16302a;
    --accent-ink:  #7cc0aa;
    --on-accent:   #08110e;
    --signal:  #d0793c;
    --signal-soft: #2c1d13;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ---------- shell ---------- */
  .masthead {
    display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
    padding: 16px 22px; border-bottom: 1px solid var(--rule);
    background: var(--surface); position: sticky; top: 0; z-index: 20;
  }
  .wordmark { font-size: 15px; font-weight: 620; letter-spacing: -.01em; }
  .wordmark span { color: var(--muted); font-weight: 400; }
  .tagline { color: var(--muted); font-size: 13px; flex: 1; min-width: 200px; }

  .modes { display: flex; gap: 2px; background: var(--sunk); padding: 3px; border-radius: 7px; }
  .modes button {
    border: 0; background: transparent; color: var(--muted);
    padding: 5px 13px; border-radius: 5px; font-size: 13px; font-weight: 500;
    transition: background .12s, color .12s;
  }
  .modes button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

  .search { position: relative; flex: 0 1 260px; }
  .search input {
    font: inherit; width: 100%; padding: 6px 11px; border-radius: 7px;
    border: 1px solid var(--rule); background: var(--ground); color: var(--ink); font-size: 13px;
  }
  .search-out {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 40;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 9px;
    box-shadow: var(--shadow); max-height: 340px; overflow-y: auto; padding: 5px;
  }
  .search-out:empty { display: none; }
  .search-out .head {
    font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--faint); padding: 7px 9px 4px; font-weight: 600;
  }

  .branch-chip {
    display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px;
    background: var(--accent-soft); color: var(--accent-ink);
    border: 1px solid transparent; padding: 5px 10px; border-radius: 999px; margin-bottom: 14px;
  }
  .branch-chip button { border: 0; background: transparent; color: inherit; padding: 0 2px; font-size: 14px; }

  .ledger { border-top: 1px solid var(--rule); margin-top: 34px; padding-top: 18px; }
  .ledger table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .ledger th {
    text-align: left; font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--faint); font-weight: 600; padding: 0 10px 7px 0; white-space: nowrap;
  }
  .ledger td { padding: 6px 10px 6px 0; border-top: 1px solid var(--rule); vertical-align: top; }
  .ledger td.codes { font-family: var(--mono); font-size: 11.5px; color: var(--accent); white-space: nowrap; }
  .ledger td.when { font-family: var(--mono); font-size: 11px; color: var(--faint); white-space: nowrap; }
  .ledger td.by { color: var(--muted); white-space: nowrap; }
  .ledger-wrap { overflow-x: auto; }
  .ledger .none { color: var(--signal); }

  .who { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }
  .who input {
    font: inherit; width: 108px; padding: 5px 9px; border-radius: 6px;
    border: 1px solid var(--rule); background: var(--ground); color: var(--ink);
  }

  main { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

  /* ---------- the tree ---------- */
  .tree-pane {
    border-right: 1px solid var(--rule); background: var(--surface);
    height: calc(100vh - 61px); overflow-y: auto; position: sticky; top: 61px;
  }
  @media (max-width: 900px) { .tree-pane { height: auto; position: static; border-right: 0; border-bottom: 1px solid var(--rule); } }

  .tree-head {
    padding: 15px 20px 11px; display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--surface);
  }
  .tree-head h2 { margin: 0; font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
  .filled { font-family: var(--mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .row { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; }
  .row:hover { background: var(--sunk); }
  .row.lit { background: var(--accent-soft); }
  .twist {
    border: 0; background: transparent; color: var(--faint); padding: 4px 0;
    font-size: 9px; line-height: 1; transition: transform .12s;
  }
  .twist[aria-expanded="true"] { transform: rotate(90deg); }
  .twist.leaf { visibility: hidden; }
  .node {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px;
    width: 100%; text-align: left; border: 0; background: transparent;
    padding: 5px 20px 5px 0; border-bottom: 1px solid transparent;
  }
  .node.section { padding-top: 9px; padding-bottom: 9px; }
  .node.section .label { font-weight: 600; }
  .code {
    font-family: var(--mono); font-size: 11.5px; color: var(--faint);
    font-variant-numeric: tabular-nums; margin-right: 9px;
  }
  .node.lit .code, .node.lit .label { color: var(--accent-ink); }
  .label { font-size: 13.5px; }
  .count {
    font-family: var(--mono); font-size: 11px; color: var(--faint);
    font-variant-numeric: tabular-nums; min-width: 20px; text-align: right;
  }
  .count.has { color: var(--accent); font-weight: 600; }
  .count.gap { color: var(--signal); }
  .bar { height: 3px; border-radius: 2px; background: var(--accent); opacity: .28; }

  /* ---------- record ---------- */
  .stage { padding: 26px 30px 60px; max-width: 780px; }
  @media (max-width: 700px) { .stage { padding: 20px 18px 50px; } }

  .kicker {
    font-family: var(--mono); font-size: 11px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--faint); display: flex; gap: 10px; flex-wrap: wrap;
  }
  .record-title {
    font-family: var(--serif); font-size: 27px; line-height: 1.25; margin: 10px 0 8px;
    text-wrap: balance; letter-spacing: -.008em;
  }
  .byline { color: var(--muted); font-size: 13.5px; margin-bottom: 18px; }
  .byline a { color: var(--accent); }
  .abstract {
    font-family: var(--serif); font-size: 16.5px; line-height: 1.62; color: var(--ink);
    max-width: 66ch; margin: 0 0 22px; padding-left: 15px; border-left: 2px solid var(--rule);
  }
  .abstract.none { font-family: var(--sans); font-size: 14px; color: var(--signal); border-left-color: var(--signal); }

  .section-label {
    font-size: 11px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--faint); font-weight: 600; margin: 0 0 10px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 20px; }
  .chip {
    display: inline-flex; align-items: baseline; gap: 8px; max-width: 100%;
    border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
    padding: 7px 12px; border-radius: 999px; font-size: 13px;
    transition: border-color .12s, background .12s;
  }
  .chip:hover { border-color: var(--accent); }
  .chip .c { font-family: var(--mono); font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .chip .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .chip[aria-pressed="true"] .c { color: var(--on-accent); opacity: .72; }
  .chip.was { border-style: dashed; }

  .finder { position: relative; margin-bottom: 20px; }
  .finder input {
    font: inherit; width: 100%; padding: 10px 13px; border-radius: 8px;
    border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
  }
  .finder input::placeholder { color: var(--faint); }
  .results { margin-top: 7px; display: flex; flex-direction: column; gap: 2px; max-height: 240px; overflow-y: auto; }
  .result {
    display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline;
    border: 0; background: transparent; text-align: left; padding: 7px 10px; border-radius: 6px;
  }
  .result:hover { background: var(--sunk); }
  .result .trail { display: block; font-size: 11.5px; color: var(--faint); }

  .actions { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; padding-top: 6px; border-top: 1px solid var(--rule); }
  .btn {
    border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
    padding: 9px 15px; border-radius: 8px; font-size: 13.5px; font-weight: 500;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .hint { color: var(--faint); font-size: 12px; margin-left: auto; font-family: var(--mono); }

  /* ---------- progress + explore ---------- */
  .meter { height: 3px; background: var(--sunk); border-radius: 2px; overflow: hidden; min-width: 120px; flex: 0 0 140px; }
  .meter i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }

  .explore-item { padding: 13px 0; border-bottom: 1px solid var(--rule); }
  .explore-item h4 { margin: 0 0 3px; font-family: var(--serif); font-size: 17px; font-weight: 500; }
  .explore-item .meta { color: var(--muted); font-size: 12.5px; }
  .empty { color: var(--muted); font-size: 14px; padding: 26px 0; }
  .empty strong { color: var(--signal); }

  .panel {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
    padding: 18px 20px; margin-bottom: 22px;
  }
  .panel h3 { margin: 0 0 8px; font-size: 15px; }
  .panel p { margin: 0 0 10px; color: var(--muted); font-size: 13.5px; max-width: 62ch; }
  textarea {
    font-family: var(--mono); font-size: 12px; width: 100%; min-height: 190px;
    border: 1px solid var(--rule); border-radius: 8px; padding: 12px;
    background: var(--sunk); color: var(--ink); resize: vertical;
  }
  .done { color: var(--accent); font-size: 13px; }
</style>

t":"15.5","section":"15","depth":2,"coding":false,"points":[]},{"code":"15.5.3","title":"Vicarious liability doctrine","parent":"15.5","section":"15","depth":2,"coding":false,"points":[]},{"code":"15.5.4","title":"Administrative law and automated decision review","parent":"15.5","section":"15","depth":2,"coding":false,"points":[]},{"code":"16","title":"Empirical study and methods","parent":null,"section":"16","depth":0,"coding":false,"points":[]},{"code":"16.1","title":"Studying agentic organizations","parent":"16","section":"16","depth":1,"coding":false,"points":[]},{"code":"16.1.1","title":"Deployment case studies","parent":"16.1","section":"16","depth":2,"coding":false,"points":[]},{"code":"16.1.2","title":"Longitudinal observation of autonomy expansion","parent":"16.1","section":"16","depth":2,"coding":false,"points":[]},{"code":"16.1.3","title":"Comparative studies across organizations","parent":"16.1","section":"16","depth":2,"coding":false,"points":[]},{"code":"16.1.4","title":"Access and observability constraints on research","parent":"16.1","section":"16","depth":2,"coding":false,"points":[]},{"code":"16.2","title":"Measurement","parent":"16","section":"16","depth":1,"coding":false,"points":[]},{"code":"16.2.1","title":"Autonomy level measurement instruments","parent":"16.2","section":"16","depth":2,"coding":false,"points":[]},{"code":"16.2.2","title":"Oversight effectiveness metrics","parent":"16.2","section":"16","depth":2,"coding":false,"points":[]},{"code":"16.2.3","title":"Agent performance in organizational context","parent":"16.2","section":"16","depth":2,"coding":false,"points":[]},{"code":"16.2.4","title":"Incident rate and severity measurement","parent":"16.2","section":"16","depth":2,"coding":false,"points":[]},{"code":"16.3","title":"Data","parent":"16","section":"16","depth":1,"coding":false,"points":[]},{"code":"16.3.1","title":"Agent action and decision datasets","parent":"16.3","section":"16","depth":2,"coding":false,"points":[]},{"code":"16.3.2","title":"Incident and postmortem corpora","parent":"16.3","section":"16","depth":2,"coding":false,"points":[]},{"code":"16.3.3","title":"Data quality, coverage, and disclosure bias","parent":"16.3","section":"16","depth":2,"coding":false,"points":[]},{"code":"16.3.4","title":"Shared schemas for agentic organization data","parent":"16.3","section":"16","depth":2,"coding":false,"points":[]},{"code":"16.4","title":"Research design and ethics","parent":"16","section":"16","depth":1,"coding":false,"points":[]},{"code":"16.4.1","title":"Experimental design in live agentic systems","parent":"16.4","section":"16","depth":2,"coding":false,"points":[]},{"code":"16.4.2","title":"Research ethics with autonomous systems","parent":"16.4","section":"16","depth":2,"coding":false,"points":[]},{"code":"16.4.3","title":"Dual-use considerations in publication","parent":"16.4","section":"16","depth":2,"coding":false,"points":[]},{"code":"16.4.4","title":"Replication under model version churn","parent":"16.4","section":"16","depth":2,"coding":false,"points":[]}],"records":[{"id":"resource:arxiv:2107.06857","title":"Scalable Evaluation of Multi-Agent Reinforcement Learning with Melting Pot","abstract":"Existing evaluation suites for multi-agent reinforcement learning (MARL) do not assess generalization to novel situations as their primary objective (unlike supervised-learning benchmarks). Our contribution, Melting Pot, is a MARL evaluation suite that fills this gap, and uses reinforcement learning to reduce the human labor required to create novel test scenarios. This works because one agent's behavior constitutes (part of) another agent's environment. To demonstrate scalability, we have created over 80 unique test scenarios covering a broad range of research topics such as social dilemmas, reciprocity, resource sharing, and task partitioning. We apply these test scenarios to standard MARL training algorithms, and demonstrate how Melting Pot reveals weaknesses not apparent from training performance alone.","authors":["Joel Z. Leibo","Edgar A. Duéñez-Guzmán","Alexander Sasha Vezhnevets","John Agapiou","Peter Sunehag"],"date":"2021-07-14","url":"https://arxiv.org/abs/2107.06857","type":"preprint","current":["14.1","14.5"],"suggested":["8.2.4","13.3.1","14.1.4","8.3.4","14.1.1","14.2.4","5.1.5","14.1.2","5.2.3","4.5.1","8.3.5","4.2.3","11.11.5","6.2.3"]},{"id":"resource:arxiv:2312.03664","title":"Generative agent-based modeling with actions grounded in physical, social, or digital space using Concordia","abstract":"Agent-based modeling has been around for decades, and applied widely across the social and natural sciences. The scope of this research method is now poised to grow dramatically as it absorbs the new affordances provided by Large Language Models (LLM)s. Generative Agent-Based Models (GABM) are not just classic Agent-Based Models (ABM)s where the agents talk to one another. Rather, GABMs are constructed using an LLM to apply common sense to situations, act \"reasonably\", recall common semantic knowledge, produce API calls to control digital technologies like apps, and communicate both within the simulation and to researchers viewing it from the outside. Here we present Concordia, a library to facilitate constructing and working with GABMs. Concordia makes it easy to construct language-mediated simulations of physically- or digitally-grounded environments. Concordia agents produce their behavior using a flexible component system which mediates between two fundamental operations: LLM calls and associative memory retrieval. A special agent called the Game Master (GM), which was inspired…","authors":["Alexander Sasha Vezhnevets","John Agapiou","Avia Aharon","Ron Ziv","Jayd Matyas"],"date":"2023-12-06","url":"https://arxiv.org/abs/2312.03664","type":"preprint","current":["14.5","16.1"],"suggested":["13.3.3","14.5.1","14.5.2","7.2.2","7.1.2","4.1.3","1.1.1","2.2.5","7.1.3","11.14.3","14.5.3","5.2.3","10.1.4","5.1.3"]},{"id":"resource:arxiv:2401.11880","title":"PsySafe: A Comprehensive Framework for Psychological-based Attack, Defense, and Evaluation of Multi-agent System Safety","abstract":"Multi-agent systems, when enhanced with Large Language Models (LLMs), exhibit profound capabilities in collective intelligence. However, the potential misuse of this intelligence for malicious purposes presents significant risks. To date, comprehensive research on the safety issues associated with multi-agent systems remains limited. In this paper, we explore these concerns through the innovative lens of agent psychology, revealing that the dark psychological states of agents constitute a significant threat to safety. To tackle these concerns, we propose a comprehensive framework (PsySafe) grounded in agent psychology, focusing on three key areas: firstly, identifying how dark personality traits in agents can lead to risky behaviors; secondly, evaluating the safety of multi-agent systems from the psychological and behavioral perspectives, and thirdly, devising effective strategies to mitigate these risks. Our experiments reveal several intriguing phenomena, such as the collective dangerous behaviors among agents, agents' self-reflection when engaging in dangerous behavior, and the…","authors":["Zaibin Zhang","Yongting Zhang","Lijun Li","Hongzhi Gao","Lijun Wang"],"date":"2024-01-22","url":"https://arxiv.org/abs/2401.11880","type":"preprint","current":["10.1","14.2"],"suggested":["14.2.5","10.6.4","5.1.3","14.3.2","5.1.5","10.5.2","15.1.5","14.3.3","4.1.3","14.2.2","14.2.4","5.4.4","14.2.1","5.1.1"]},{"id":"resource:arxiv:2403.12482","title":"Embodied LLM Agents Learn to Cooperate in Organized Teams","abstract":"Large Language Models (LLMs) have emerged as integral tools for reasoning, planning, and decision-making, drawing upon their extensive world knowledge and proficiency in language-related tasks. LLMs thus hold tremendous potential for natural language interaction within multi-agent systems to foster cooperation. However, LLM agents tend to over-report and comply with any instruction, which may result in information redundancy and confusion in multi-agent cooperation. Inspired by human organizations, this paper introduces a framework that imposes prompt-based organization structures on LLM agents to mitigate these problems. Through a series of experiments with embodied LLM agents and human-agent collaboration, our results highlight the impact of designated leadership on team efficiency, shedding light on the leadership qualities displayed by LLM agents and their spontaneous cooperative behaviors. Further, we harness the potential of LLMs to propose enhanced organizational prompts, via a Criticize-Reflect process, resulting in novel organization structures that reduce communication…","authors":["Xudong Guo","Kaixuan Huang","Jiale Liu","Wenhui Fan","Natalia Vélez"],"date":"2024-03-19","url":"https://arxiv.org/abs/2403.12482","type":"preprint","current":["3.1","5.2"],"suggested":["3.1.3","3.3.2","7.4.3","5.2.5","12.3.4","7.4.1","13.3.3","11.13.3","3.3.4","5.2.3","10.1.1","4.1.3","11.7.3","12.4.5"]},{"id":"resource:arxiv:2412.14161","title":"TheAgentCompany: Benchmarking LLM Agents on Consequential Real World Tasks","abstract":"We interact with computers on an everyday basis, be it in everyday life or work, and many aspects of work can be done entirely with access to a computer and the Internet. At the same time, thanks to improvements in large language models (LLMs), there has also been a rapid development in AI agents that interact with and affect change in their surrounding environments. But how performant are AI agents at accelerating or even autonomously performing work-related tasks? The answer to this question has important implications both for industry looking to adopt AI into their workflows and for economic policy to understand the effects that adoption of AI may have on the labor market. To measure the progress of these LLM agents'performance on performing real-world professional tasks, in this paper we introduce TheAgentCompany, an extensible benchmark for evaluating AI agents that interact with the world in similar ways to those of a digital worker: by browsing the Web, writing code, running programs, and communicating with other coworkers. We build a self-contained environment with internal…","authors":["Frank F. Xu","Yufan Song","Boxuan Li","Yuxuan Tang","Kritanjali Jain"],"date":"2024-12-18","url":"https://arxiv.org/abs/2412.14161","type":"preprint","current":["14.1","16.2"],"suggested":["5.4.4","6.5.2","14.1.4","2.2.5","10.4.3","3.1.1","15.4.2","8.4.2","11.4.5","13.3.3","10.6.1","13.3.1","10.6.3","6.2.3"]},{"id":"resource:arxiv:2501.16138","title":"Quantifying the Self-Interest Level of Markov Social Dilemmas","abstract":"This paper introduces a novel method for estimating the self-interest level of Markov social dilemmas. We extend the concept of self-interest level from normal-form games to Markov games, providing a quantitative measure of the minimum reward exchange required to align individual and collective interests. We demonstrate our method on three environments from the Melting Pot suite, representing either common-pool resources or public goods. Our results illustrate how reward exchange can enable agents to transition from selfish to collective equilibria in a Markov social dilemma. This work contributes to multi-agent reinforcement learning by providing a practical tool for analysing complex, multistep social dilemmas. Our findings offer insights into how reward structures can promote or hinder cooperation, with potential applications in areas such as mechanism design.","authors":["Richard H. Willis","Yali Du","Joel Z. Leibo","G. Flucke"],"date":"2025-01-27","url":"https://arxiv.org/abs/2501.16138","type":"preprint","current":["5.2"],"suggested":["13.2.1","5.2.4","4.2.3","4.2.5","5.2.1","5.2.5","1.2.1","5.2.3","15.3.4","10.1.3","2.7.6","8.2.1","9.1.3","16.2.1"]},{"id":"resource:arxiv:2501.16173","title":"Will Systems of LLM Agents Cooperate: An Investigation into a Social Dilemma","abstract":"As autonomous agents become more prevalent, understanding their collective behaviour in strategic interactions is crucial. This study investigates the emergent cooperative tendencies of systems of Large Language Model (LLM) agents in a social dilemma. Unlike previous research where LLMs output individual actions, we prompt state-of-the-art LLMs to generate complete strategies for iterated Prisoner's Dilemma. Using evolutionary game theory, we simulate populations of agents with different strategic dispositions (aggressive, cooperative, or neutral) and observe their evolutionary dynamics. Our findings reveal that different LLMs exhibit distinct biases affecting the relative success of aggressive versus cooperative strategies. This research provides insights into the potential long-term behaviour of systems of deployed LLM-based autonomous agents and highlights the importance of carefully considering the strategic environments in which they operate.","authors":["Richard H. Willis","Yali Du","Joel Z. Leibo","G. Flucke"],"date":"2025-01-27","url":"https://arxiv.org/abs/2501.16173","type":"preprint","current":["5.2","14.1"],"suggested":["3.4.3","5.1.1","16.4.2","11.5.8","16.4.4","15.1.1","11.6.8","10.4.1","4.1.3","16.1.4","16.4.1","1.2.5","16.4.3","5.4.4"]},{"id":"resource:arxiv:2501.18668","title":"Simulation Streams: A Programming Paradigm for Controlling Large Language Models and Building Complex Systems with Generative AI","abstract":"We introduce Simulation Streams, a programming paradigm designed to efficiently control and leverage Large Language Models (LLMs) for complex, dynamic simulations and agentic workflows. Our primary goal is to create a minimally interfering framework that harnesses the agentic abilities of LLMs while addressing their limitations in maintaining consistency, selectively ignoring/including information, and enforcing strict world rules. Simulation Streams achieves this through a state-based approach where variables are modified in sequential steps by \"operators,\" producing output on a recurring format and adhering to consistent rules for state variables. This approach focus the LLMs on defined tasks, while aiming to have the context stream remain \"in-distribution\". The approach incorporates an Entity-Component-System (ECS) architecture to write programs in a more intuitive manner, facilitating reuse of workflows across different components and entities. This ECS approach enhances the modularity of the output stream, allowing for complex, multi-entity simulations while maintaining format…","authors":["Peter Sunehag","Joel Z. Leibo"],"date":"2025-01-30","url":"https://arxiv.org/abs/2501.18668","type":"preprint","current":["14.5"],"suggested":["5.4.4","3.2.4","11.6.7","3.1.1","11.11.5","4.1.3","14.5.1","12.3.1","13.4.3","11.10.5","2.2.5","11.7.3","4.4.4","4.3.4"]},{"id":"resource:arxiv:2502.14143","title":"Multi-Agent Risks from Advanced AI","abstract":"The rapid development of advanced AI agents and the imminent deployment of many instances of these agents will give rise to multi-agent systems of unprecedented complexity. These systems pose novel and under-explored risks. In this report, we provide a structured taxonomy of these risks by identifying three key failure modes (miscoordination, conflict, and collusion) based on agents' incentives, as well as seven key risk factors (information asymmetries, network effects, selection pressures, destabilising dynamics, commitment problems, emergent agency, and multi-agent security) that can underpin them. We highlight several important instances of each risk, as well as promising directions to help mitigate them. By anchoring our analysis in a range of real-world examples and experimental evidence, we illustrate the distinct challenges posed by multi-agent systems and their implications for the safety, governance, and ethics of advanced AI.","authors":["Lewis Hammond","Alan Chan","Jesse Clifton","Jason Hoelscher-Obermaier","Akbir Khan"],"date":"2025-02-19","url":"https://arxiv.org/abs/2502.14143","type":"preprint","current":["11.1","11.6","11.13"],"suggested":["11.6.2","5.2.2","11.1.1","5.2.4","11.1.5","11.10.3","14.2.5","11.6.8","16.4.1","10.6.4","11.1.2","5.4.4","5.1.1","5.1.2"]},{"id":"resource:arxiv:2502.15840","title":"Vending-Bench: A Benchmark for Long-Term Coherence of Autonomous Agents","abstract":"While Large Language Models (LLMs) can exhibit impressive proficiency in isolated, short-term tasks, they often fail to maintain coherent performance over longer time horizons. In this paper, we present Vending-Bench, a simulated environment designed to specifically test an LLM-based agent's ability to manage a straightforward, long-running business scenario: operating a vending machine. Agents must balance inventories, place orders, set prices, and handle daily fees - tasks that are each simple but collectively, over long horizons (&gt;20M tokens per run) stress an LLM's capacity for sustained, coherent decision-making. Our experiments reveal high variance in performance across multiple LLMs: Claude 3.5 Sonnet and o3-mini manage the machine well in most runs and turn a profit, but all models have runs that derail, either through misinterpreting delivery schedules, forgetting orders, or descending into tangential \"meltdown\" loops from which they rarely recover. We find no clear correlation between failures and the point at which the model's context window becomes full, suggesting…","authors":["Axel Backlund","Lukas Petersson"],"date":"2025-02-20","url":"https://arxiv.org/abs/2502.15840","type":"preprint","current":["8.1","14.1","14.5"],"suggested":["11.7.3","12.4.5","11.5.3","8.1.3","11.4.6","8.1.4","11.3.5","7.4.4","7.1.3","11.8.7","5.1.3","7.1.4","11.12.5","6.5.5"]},{"id":"resource:arxiv:2503.14576","title":"SocialJax: An Evaluation Suite for Multi-agent Reinforcement Learning in Sequential Social Dilemmas","abstract":"Sequential social dilemmas pose a significant challenge in the field of multi-agent reinforcement learning (MARL), requiring environments that accurately reflect the tension between individual and collective interests. Previous benchmarks and environments, such as Melting Pot, provide an evaluation protocol that measures generalization to new social partners in various test scenarios. However, running reinforcement learning algorithms in traditional environments requires substantial computational resources. In this paper, we introduce SocialJax, a suite of sequential social dilemma environments and algorithms implemented in JAX. JAX is a high-performance numerical computing library for Python that enables significant improvements in operational efficiency. Our experiments demonstrate that the SocialJax training pipeline achieves at least 50\\texttimes{} speed-up in real-time performance compared to Melting Pot RLlib baselines. Additionally, we validate the effectiveness of baseline algorithms within SocialJax environments. Finally, we use Schelling diagrams to verify the social…","authors":["Zihao Guo","Shuqing Shi","Richard H. Willis","Tristan Tomilin","Joel Z. Leibo"],"date":"2025-03-18","url":"https://arxiv.org/abs/2503.14576","type":"preprint","current":["14.1","14.5"],"suggested":["5.3.4","5.2.5","14.1.1","5.2.3","5.1.3","5.3.2","14.4.2","2.5.2","10.3.4","11.14.5","6.2.2","10.2.3","14.1.4","11.15.7"]},{"id":"resource:arxiv:2505.23643","title":"Securing AI Agents with Information-Flow Control","abstract":"As AI agents become increasingly autonomous and capable, ensuring their security against vulnerabilities such as prompt injection becomes critical. This paper explores the use of information-flow control (IFC) to provide security guarantees for AI agents. We present a formal model to reason about the security and expressiveness of agent planners. Using this model, we characterize the class of properties enforceable by dynamic taint-tracking and construct a taxonomy of tasks to evaluate security and utility trade-offs of planner designs. Informed by this exploration, we present Fides, a planner that tracks confidentiality and integrity labels, deterministically enforces security policies, and introduces novel primitives for selectively hiding information. Its evaluation in AgentDojo demonstrates that this approach enables us to complete a broad range of tasks with security guarantees. A tutorial to walk readers through the the concepts introduced in the paper can be found at https://github.com/microsoft/fides","authors":["Manuel F. M. Costa","Boris Köpf","Aashish Kolluri","Andrew Paverd","Mark Russinovich"],"date":"2025-05-29","url":"https://arxiv.org/abs/2505.23643","type":"preprint","current":["2.2","10.1","10.6"],"suggested":["2.2.5","10.1.1","14.3.3","14.3.1","14.3.4","14.3.2","4.2.3","4.4.4","10.4.1","11.6.8","15.2.3","11.12.5","14.2.4","14.5.4"]},{"id":"resource:arxiv:2506.00073","title":"The Automated but Risky Game: Modeling and Benchmarking Agent-to-Agent Negotiations and Transactions in Consumer Markets","abstract":"AI agents are increasingly used in consumer-facing applications to assist with tasks such as product search, negotiation, and transaction execution. In this paper, we explore a future scenario where both consumers and merchants authorize AI agents to fully automate negotiations and transactions. We aim to answer two key questions: (1) Do different LLM agents vary in their ability to secure favorable deals for users? (2) What risks arise from fully automating deal-making with AI agents in consumer markets? To address these questions, we develop an experimental framework that evaluates the performance of various LLM agents in real-world negotiation and transaction settings. Our findings reveal that AI-mediated deal-making is an inherently imbalanced game -- different agents achieve significantly different outcomes for their users. Moreover, behavioral anomalies in LLMs can result in financial losses for both consumers and merchants, such as overspending or accepting unreasonable deals. These results underscore that while automation can improve efficiency, it also introduces…","authors":["S. S. Zhu","Jiao Jiao Sun","Yi Nian","Tobin South","Alex Pentland"],"date":"2025-05-29","url":"https://arxiv.org/abs/2506.00073","type":"preprint","current":["3.3","5.4","14.1"],"suggested":["14.3.2","3.3.3","14.5.2","10.4.5","11.9.4","7.1.2","14.2.5","14.4.3","14.5.3","14.5.4","14.5.1","5.2.1","2.7.6","8.2.1"]},{"id":"resource:arxiv:2506.12469","title":"Levels of Autonomy for AI Agents","abstract":"Autonomy is a double-edged sword for AI agents, simultaneously unlocking transformative possibilities and serious risks. How can agent developers calibrate the appropriate levels of autonomy at which their agents should operate? We argue that an agent's level of autonomy can be treated as a deliberate design decision, separate from its capability and operational environment. In this work, we define five levels of escalating agent autonomy, characterized by the roles a user can take when interacting with an agent: operator, collaborator, consultant, approver, and observer. Within each level, we describe the ways by which a user can exert control over the agent and open questions for how to design the nature of user-agent interaction. We then highlight a potential application of our framework towards AI autonomy certificates to govern agent behavior in single- and multi-agent systems. We conclude by proposing early ideas for evaluating agents' autonomy. Our work aims to contribute meaningful, practical steps towards responsibly deployed and useful AI agents in the real world.","authors":["K. J. Kevin Feng","David W. McDonald","Amy X. Zhang"],"date":"2025-06-14","url":"https://arxiv.org/abs/2506.12469","type":"preprint","current":["1.1","2.4"],"suggested":["14.2.5","16.2.1","2.2.5","4.1.2","1.1.2","5.1.5","10.6.4","14.1.1","5.2.5","10.6.1","7.1.2","5.1.1","5.1.2","5.1.3"]},{"id":"resource:arxiv:2509.08200","title":"Accelerating AI Development with Cyber Arenas","abstract":"AI development requires high fidelity testing environments to effectively transition from the laboratory to operations. The flexibility offered by cyber arenas presents a novel opportunity to test new artificial intelligence (AI) capabilities with users. Cyber arenas are designed to expose end-users to real-world situations and must rapidly incorporate evolving capabilities to meet their core objectives. To explore this concept the MIT/IEEE/Amazon Graph Challenge Anonymized Network Sensor was deployed in a cyber arena during a National Guard exercise.","authors":["William Cashman","Chasen Milner","Michael E. Houle","Michael G. Jones","Hayden Jananthan"],"date":"2025-09-10","url":"https://arxiv.org/abs/2509.08200","type":"preprint","current":["14.5","10.4"],"suggested":["5.2.4","9.1.3","4.2.3","12.6.2","4.3.4","7.2.3","11.15.4","5.3.4","11.4.4","14.2.3","15.3.2","2.2.6","11.10.4","11.2.2"]},{"id":"resource:arxiv:2509.10147","title":"Virtual Agent Economies","abstract":"The rapid adoption of autonomous AI agents is giving rise to a new economic layer where agents transact and coordinate at scales and speeds beyond direct human oversight. We propose the \"sandbox economy\" as a framework for analyzing this emergent system, characterizing it along two key dimensions: its origins (emergent vs. intentional) and its degree of separateness from the established human economy (permeable vs. impermeable). Our current trajectory points toward a spontaneous emergence of a vast and highly permeable AI agent economy, presenting us with opportunities for an unprecedented degree of coordination as well as significant challenges, including systemic economic risk and exacerbated inequality. Here we discuss a number of possible design choices that may lead to safely steerable AI agent markets. In particular, we consider auction mechanisms for fair resource allocation and preference resolution, the design of AI \"mission economies\" to coordinate around achieving collective goals, and socio-technical infrastructure needed to ensure trust, safety, and accountability. By…","authors":["Nenad Tomašev","Matija Franklin","Joel Z. Leibo","Julian Jacobs","William A. Cunningham"],"date":"2025-09-12","url":"https://arxiv.org/abs/2509.10147","type":"preprint","current":["5.4","2.7","13.2"],"suggested":["5.4.2","4.1.4","3.2.3","11.10.3","15.1.4","5.1.1","11.10.4","8.1.1","5.3.4","3.2.1","15.1.2","5.3.3","4.4.5","3.2.5"]},{"id":"resource:arxiv:2509.14485","title":"Beyond the high score: Prosocial ability profiles of multi-agent populations","abstract":"The development and evaluation of social capabilities in AI agents require complex environments where competitive and cooperative behaviours naturally emerge. While game-theoretic properties can explain why certain teams or agent populations outperform others, more abstract behaviours, such as convention following, are harder to control in training and evaluation settings. The Melting Pot contest is a social AI evaluation suite designed to assess the cooperation capabilities of AI systems. In this paper, we apply a Bayesian approach known as Measurement Layouts to infer the capability profiles of multi-agent systems in the Melting Pot contest. We show that these capability profiles not only predict future performance within the Melting Pot suite but also reveal the underlying prosocial abilities of agents. Our analysis indicates that while higher prosocial capabilities sometimes correlate with better performance, this is not a universal trend-some lower-scoring agents exhibit stronger cooperation abilities. Furthermore, we find that top-performing contest submissions are more likely…","authors":["Marko Tešić","Zhao Yue","Joel Z. Leibo","Rakshit S. Trivedi","José Hernández‐Orallo"],"date":"2025-09-17","url":"https://arxiv.org/abs/2509.14485","type":"preprint","current":["14.1","5.2"],"suggested":["5.2.3","5.2.5","14.1.2","11.1.3","11.1.2","2.2.1","14.4.3","14.1.3","6.2.1","14.4.2","8.2.2","14.1.4","16.2.3","5.1.1"]},{"id":"resource:arxiv:2510.04303","title":"Audit the Whisper: Detecting Steganographic Collusion in Multi-Agent LLMs","abstract":"Multi-agent deployments of large language models (LLMs) are increasingly embedded in market, allocation, and governance workflows, yet covert coordination among agents can silently erode trust and social welfare. Existing audits are dominated by heuristics that lack theoretical guarantees, struggle to transfer across tasks, and seldom ship with the infrastructure needed for independent replication. We introduce Audit the Whisper, a conference-grade research artifact that spans theory, benchmark design, detection, and reproducibility. Our contributions are: (i) a channel-capacity analysis showing how interventions such as paraphrase, rate limiting, and role permutation impose quantifiable capacity penalties-operationalised via paired-run Kullback--Leibler diagnostics-that tighten mutual-information thresholds with finite-sample guarantees and full proofs; (ii) ColludeBench-v0, covering pricing, first-price auctions, peer review, and hosted Gemini/Groq APIs with configurable covert schemes, deterministic manifests, and reward instrumentation; and (iii) a calibrated auditing pipeline…","authors":["Dhruv Tailor"],"date":"2025-10-05","url":"https://arxiv.org/abs/2510.04303","type":"preprint","current":["5.2.2","9.3","10.2","10.2.6","11.6"],"suggested":["10.2.6","5.4.3","5.2.2","2.5.1","10.3.4","3.2.1","9.1.4","16.4.4","9.2.2","11.6.7","5.4.4","8.1.3","9.2.4","4.5.4"]},{"id":"resource:arxiv:2512.07665","title":"Reliable agent engineering should integrate machine-compatible organizational principles","abstract":"As AI agents built on large language models (LLMs) become increasingly embedded in society, issues of coordination, control, delegation, and accountability are entangled with concerns over their reliability. To design and implement LLM agents around reliable operations, we should consider the task complexity in the application settings and reduce their limitations while striving to minimize agent failures and optimize resource efficiency. High-functioning human organizations have faced similar balancing issues, which led to evidence-based theories that seek to understand their functioning strategies. We examine the parallels between LLM agents and the compatible frameworks in organization science, focusing on what the design, scaling, and management of organizations can inform agentic systems towards improving reliability. We offer three preliminary accounts of organizational principles for AI agent engineering to attain reliability and effectiveness, through balancing agency and capabilities in agent design, resource constraints and performance benefits in agent scaling, and…","authors":["R. Patrick Xian","Garry A. Gabison","Ahmed Alaa","Christoph Riedl","Grigorios G. Chrysos"],"date":"2025-12-08","url":"https://arxiv.org/abs/2512.07665","type":"preprint","current":["3.1","15.3"],"suggested":["3.2.5","11.11.5","3.2.6","15.3.2","11.1.2","3.2.1","14.4.1","3.2.3","14.4.2","3.4.3","4.1.3","13.4.2","4.2.2","8.4.2"]},{"id":"resource:arxiv:2601.03624","title":"Architecting Agentic Communities using Design Patterns","abstract":"The rapid evolution of Large Language Models (LLM) and subsequent Agentic AI technologies requires systematic architectural guidance for building sophisticated, production-grade systems. This paper presents an approach for architecting such systems using design patterns derived from enterprise distributed systems standards, formal methods, and industry practice. We classify these patterns into three tiers: LLM Agents (task-specific automation), Agentic AI (adaptive goal-seekers), and Agentic Communities (organizational frameworks where AI agents and human participants coordinate through formal roles, protocols, and governance structures). We focus on Agentic Communities - coordination frameworks encompassing LLM Agents, Agentic AI entities, and humans - most relevant for enterprise and industrial applications. Drawing on established coordination principles from distributed systems, we ground these patterns in a formal framework that specifies collaboration agreements where AI agents and humans fill roles within governed ecosystems. This approach provides both practical guidance and…","authors":["Zoran Milosevic","Fethi Rabhi"],"date":"2026-01-07","url":"https://arxiv.org/abs/2601.03624","type":"preprint","current":["3.1","3.2"],"suggested":["3.2.2","5.2.1","16.1.1","10.5.1","3.2.1","3.1.3","12.4.2","14.1.1","3.2.5","3.2.6","13.4.3","12.2.6","5.3.3","11.13.3"]},{"id":"resource:arxiv:2602.14951","title":"Sovereign Agents: Towards Infrastructural Sovereignty and Diffused Accountability in Decentralized AI","abstract":"AI agents deployed on decentralized infrastructures are beginning to exhibit properties that extend beyond autonomy toward what we describe as agentic sovereignty-the capacity of an operational agent to persist, act, and control resources with non-overrideability inherited from the infrastructures in which they are embedded. We propose infrastructural sovereignty as an analytic lens for understanding how cryptographic self-custody, decentralized execution environments, and protocol-mediated continuity scaffold agentic sovereignty. While recent work on digital and network sovereignty has moved beyond state-centric and juridical accounts, these frameworks largely examine how sovereignty is exercised through technical systems by human collectives and remain less equipped to account for forms of sovereignty that emerge as operational properties of decentralized infrastructures themselves, particularly when instantiated in non-human sovereign agents. We argue that sovereignty in such systems exists on a spectrum determined by infrastructural hardness-the degree to which underlying…","authors":["Baoyu Hu","Helena Rong"],"date":"2026-02-16","url":"https://arxiv.org/abs/2602.14951","type":"preprint","current":["1.4","12.1","12.2"],"suggested":["4.1.1","9.1.3","11.15.7","2.2.6","11.10.5","11.10.3","11.10.6","12.3.3","12.4.2","11.12.5","11.8.2","4.1.2","3.2.2","3.2.4"]},{"id":"resource:arxiv:2603.18916","title":"Agentic Business Process Management: A Research Manifesto","abstract":"This paper presents a manifesto that articulates the conceptual foundations of Agentic Business Process Management (APM), an extension of Business Process Management (BPM) for governing autonomous agents executing processes in organizations. From a management perspective, APM represents a paradigm shift from the traditional process view of the business process, driven by the realization of process awareness and an agent-oriented abstraction, where software and human agents act as primary functional entities that perceive, reason, and act within explicit process frames. This perspective marks a shift from traditional, automation-oriented BPM toward systems in which autonomy is constrained, aligned, and made operational through process awareness. We introduce the core abstractions and architectural elements required to realize APM systems and elaborate on four key capabilities that such APM agents must support: framed autonomy, explainability, conversational actionability, and self-modification. These capabilities jointly ensure that agents' goals are aligned with organizational goals…","authors":["Diego Calvanese","Angelo Casciani","Giuseppe De Giacomo","Marlon Dumas","Fabiana Fournier"],"date":"2026-03-19","url":"https://arxiv.org/abs/2603.18916","type":"preprint","current":["3.1","16.1"],"suggested":["1.3.4","15.4.2","1.1.2","13.4.3","1.2.1","11.11.3","1.4.3","16.4.2","15.4.4","7.4.2","8.3.4","11.11.7","5.2.5","1.1.1"]},{"id":"resource:arxiv:2604.07007","title":"AgentCity: Constitutional Governance for Autonomous Agent Economies via Separation of Power","abstract":"Autonomous AI agents are beginning to operate across organizational boundaries on the open internet -- discovering, transacting with, and delegating to agents owned by other parties without centralized oversight. When agents from different human principals collaborate at scale, the collective becomes opaque: no single human can observe, audit, or govern the emergent behavior. We term this the Logic Monopoly -- the agent society's unchecked monopoly over the entire logic chain from planning through execution to evaluation. We propose the Separation of Power (SoP) model, a constitutional governance architecture deployed on public blockchain that breaks this monopoly through three structural separations: agents legislate operational rules as smart contracts, deterministic software executes within those contracts, and humans adjudicate through a complete ownership chain binding every agent to a responsible principal. In this architecture, smart contracts are the law itself -- the actual legislative output that agents produce and that governs their behavior. We instantiate SoP in…","authors":["Anbang Ruan","Xing Zhang"],"date":"2026-04-08","url":"https://arxiv.org/abs/2604.07007","type":"preprint","current":["2.7","5.4"],"suggested":["2.7.6","3.3.4","15.1.3","4.5.2","12.6.3","3.3.1","8.2.4","3.4.2","2.1.2","6.5.6","14.2.5","12.4.5","3.1.3","6.5.2"]},{"id":"resource:arxiv:2604.23459","title":"Architecture Matters for Multi-Agent Security","abstract":"Multi-agent systems (MAS), composed of networks of two or more autonomous AI agents, have become increasingly popular in production deployments, yet introduce security risks that do not arise in single-agent settings. Even if individual agents exhibit robust security, architectural decisions governing their coordination can create attack surfaces that have not been systematically characterized. In this work, we present an empirical study of how MAS design decisions shape the tradeoff between task performance and attack resistance. Across three agentic environments (browser, desktop, and code) and 13 architectural configurations, we use stagewise evaluations that distinguish planning refusal, execution-stage interception, partial harmful execution, and successful attack completion to study three key design choices: (i) agent roles, which determine how authority and responsibility are allocated; (ii) communication topology, which shapes how and when agents interact; and (iii) memory, which determines the context and state visibility accessible to each agent. We find that multi-agent…","authors":["Ben Hagag","William L. Anderson","Christian Schroeder de Witt","Sarah Scheffler"],"date":"2026-04-25","url":"https://arxiv.org/abs/2604.23459","type":"preprint","current":["3.1","10.5","14.2"],"suggested":["16.2.3","11.8.2","16.4.3","16.4.2","2.1.6","11.6.7","3.2.2","3.2.5","8.1.6","3.2.4","16.1.3","16.4.1","10.1.2","3.2.1"]},{"id":"resource:arxiv:2605.06738","title":"Trust Without Trusting: A Recomputable Trust Protocol for Autonomous Agents","abstract":"Autonomous AI agents already transact at production scale -- 69,000 bots, 165 million transactions, $50 million in volume on a single marketplace -- and any party can verify a signed credential without a central service. In an open agent world that covers most of what trust requires: there are no universal borders, and each party chooses for itself whom to deal with. Borders appear only where a closed space draws one -- a marketplace, a platform, or a consortium sets house rules. Whoever draws the border holds the authority to apply it, and may apply it as they choose, behind closed doors. This paper addresses the gap that opens there: when you rely on someone else's border, how do you check that they applied their own published rules -- taking no one's word for it, and handing the check to no new trusted party? Our answer is the Combined Evidence Protocol (CEP): a five-condition predicate any party recomputes from anchored data, turning \"did the boundary-owner follow its own admission rules\" into a fact anyone verifies rather than a claim anyone believes. The move that secures…","authors":["Lars Kersten Kroehl"],"date":"2026-05-07","url":"https://arxiv.org/abs/2605.06738","type":"preprint","current":["5.3","9.1"],"suggested":["9.2.3","11.13.4","7.2.1","12.1.4","11.10.6","12.1.5","5.3.4","14.2.5","1.1.1","16.3.4","15.4.1","9.1.4","12.1.2","12.1.3"]},{"id":"resource:arxiv:2605.07062","title":"From Assistance to Agency: Rethinking Autonomy and Control in CI/CD Pipelines","abstract":"AI agents are assuming active roles in Continuous Integration and Continuous Deployment (CI/CD) workflows, yet the research community lacks a shared vocabulary for describing what it means for CI/CD to be agentic, how much decision authority is delegated, and where control should reside. This paper presents a vision of agentic CI/CD in which the central challenge is not improving task performance but designing authority transfer, defined as the delegation of operational decisions from human-controlled pipelines to agent systems under specified constraints and recourse mechanisms. To structure this argument, we introduce a distinction between data-plane authority (localized interventions such as patch generation and test reruns) and control-plane authority (modifications to pipeline configuration, deployment policies, and approval gates). Drawing on research prototypes and industrial platforms, we show that current systems operate mainly at the data plane under bounded autonomy, with safety achieved through surrounding governance infrastructure rather than intrinsic agent guarantees.…","authors":["Marcus Emmanuel Barnes","Taher A. Ghaleb","Safwat Hassan"],"date":"2026-05-08","url":"https://arxiv.org/abs/2605.07062","type":"preprint","current":["2.4","4.1"],"suggested":["3.2.5","1.1.1","3.2.4","15.1.4","3.2.1","11.10.6","11.11.1","6.2.2","7.1.2","3.2.3","2.4.2","2.6.4","1.2.2","3.3.3"]},{"id":"resource:arxiv:2605.17698","title":"Agent Bazaar: Enabling Economic Alignment in Multi-Agent Marketplaces","abstract":"The deployment of Large Language Models (LLMs) as autonomous economic agents introduces systemic risks that extend beyond individual capability failures. As agents transition to directly interacting with marketplaces, their collective behavior can amplify volatility and mask deception at scale. We introduce the Agent Bazaar, a multi-agent simulation framework for evaluating Economic Alignment, the capacity of agentic systems to preserve market stability and integrity. We identify two failure modes: (1) Algorithmic Instability in a B2C market (\"The Crash\"), where firms amplify price volatility until the market collapses, and (2) Sybil Deception in a C2C market (\"The Lemon Market\"), where a single deceptive agent controlling multiple coordinated seller identities floods the market with fraudulent listings, eroding trust and consumer welfare. We evaluate frontier and open-weight models across both scenarios and find that models largely fail to self-regulate, with failure severity varying by model rather than by size. We propose economically aligned harnesses, Stabilizing Firms and…","authors":["Seth Karten","Cameron Crow","Chi Jin"],"date":"2026-05-17","url":"https://arxiv.org/abs/2605.17698","type":"preprint","current":["5.4","13.2"],"suggested":["10.6.1","11.13.2","11.13.4","5.1.4","11.6.6","11.6.1","11.6.7","11.6.8","11.4.6","11.5.6","1.1.1","11.7.1","14.2.5","11.2.7"]},{"id":"resource:arxiv:2605.24538","title":"Is Decentralized AI Governable? From Regulative Policy to Constitutive Protocol","abstract":"Every major framework for governing artificial intelligence presupposes an identifiable entity -- a developer, deployer, or operator -- who can be held responsible and compelled to comply. Decentralized AI (DeAI) dissolves this presupposition. We analyze DeAI as a six-layer decentralizing stack -- model, training, compute, harness, identity, and ownership -- and show how partial decentralization across layers compounds into what we call the \\emph{governance vacuum}: a condition in which AI systems are consequential enough to require governance but lack the properties that existing frameworks presuppose in their targets. This vacuum takes two analytically distinct forms: an \\emph{accountability gap}, where no addressable principal can be identified, and an \\emph{incapacitation gap}, where even an identified principal cannot alter the running system. We demonstrate that these failures are not merely jurisdictional but defeat every presupposition of governance through normative address -- the communication of rules to a comprehending, responsive agent. Drawing on Lessig's modalities of…","authors":["Botao Amber Hu","Helena Rong"],"date":"2026-05-23","url":"https://arxiv.org/abs/2605.24538","type":"preprint","current":["1.3","2.1","2.7"],"suggested":["12.2.1","1.3.5","6.3.2","11.12.5","11.13.1","12.3.3","12.4.2","12.3.1","12.3.2","12.3.4","11.12.1","11.13.2","1.3.4","14.4.3"]},{"id":"resource:arxiv:2605.30169","title":"Dissociative Identity: Language Model Agents Lack Grounding for Reputation Mechanisms","abstract":"As autonomous language model agents proliferate, forming an emerging agentic web with real-world consequences, what credibility signals can you use to decide whether to trust an unfamiliar agent in the wild and delegate to it? A natural governance intuition is to extend human identity verification and reputation mechanisms, from \"Know Your Customer\" and credit scores to \"Know Your Agent\" regimes. However, we argue that this analogy is fundamentally incomplete. Reputation mechanisms function both as social signals and as corrective feedback that sustain an equilibrium of trustworthy behavior, presuming a persistent identity associated with behavioral continuity, sanction sensitivity, and costly non-fungibility. Yet language model agents are ontologically dissociative: they are essentially an assemblage of mutable modules--foundation models, system prompts, tool-access policies, external memory, and, in some cases, a multi-agent system as a whole--any of which may change agent behavior--with a fluid persona that is also vulnerable to adversarial attack and may not internalize…","authors":["Botao Amber Hu","Helena Rong","Max Van Kleek"],"date":"2026-05-28","url":"https://arxiv.org/abs/2605.30169","type":"preprint","current":["5.3","6.3"],"suggested":["15.1.2","5.3.1","5.1.3","6.3.2","11.7.1","2.2.5","7.1.5","10.4.1","7.1.2","7.1.3","16.1.4","4.1.3","1.1.5","15.1.5"]},{"id":"resource:arxiv:2606.03237","title":"Solipsistic Superintelligence is Unlikely to be Cooperative","abstract":"AI's central challenge is shifting from capability to coexistence. The dominant paradigm in AI research focuses on developing powerful agents that treat the world as an exogenous and stationary source of feedback. We contend that superintelligence, an extremely capable task solver, born out of such a solipsistic approach to AI design, is unlikely to be cooperative. Deploying AI systems induces endogenous non-stationarity, resulting in a train-test-deploy gap where historical distributions diverge from the deployment context. We refer to this as the self-undermining property of unilateral optimization. Closing this gap requires AI that participates in cooperation: the equilibrium-selection process through which multiple actors navigate their interdependence. We call for a non-solipsistic research paradigm that treats this interdependence as a core design principle rather than approaching cooperation as a task to solve. This entails building dynamic evaluation testbeds involving adaptive counterparties, treating institutions as design primitives, and preserving human agency as a…","authors":["Rakshit S Trivedi","Natasha Jaques","Logan Cross","Alexander Sasha Vezhnevets","Joel Z Leibo"],"date":"2026-06-02","url":"https://arxiv.org/abs/2606.03237","type":"preprint","current":["1.2","5.2","15.3"],"suggested":["6.1.2","14.1.2","14.1.4","4.2.5","1.1.1","11.2.6","7.4.3","1.3.2","11.4.6","1.2.1","11.12.5","16.4.2","11.11.2","16.4.1"]},{"id":"resource:arxiv:2606.03518","title":"Overlaying Governance: A Compositional Authorization Framework for Delegation and Scope in Agentic AI","abstract":"As AI systems evolve from passive models into autonomous active agents capable of initiating actions, collaborating, and delegating tasks, the traditional boundaries of software systems blur. Traditional authorization and delegation frameworks, built around fixed principals, explicit requests, and static scopes, are insufficient to govern agentic systems. Agentic AI demands richer authorization semantics: agents must inherit and delegate permissions, act under time-limited authority, and coordinate through shared protocols. Existing Identity and Access Management (IAM) systems fail to fully capture this notion of agency, lacking mechanisms for recursive delegation, contextual boundaries, and dynamic scoping as executable governance primitives. Unlike access delegation standards such as OAuth 2.0, we treat delegation as a contractual term rather than merely a static token-based consent credential. This paper proposes a compositional governance framework that introduces primitives indispensable for agentic AI. We define types of delegation and their permissions and accountability…","authors":["Amjad Ibrahim","Yong Li (15029)"],"date":"2026-06-02","url":"https://arxiv.org/abs/2606.03518","type":"preprint","current":["2.2","2.3"],"suggested":["2.3.2","2.3.1","2.3.8","2.3.6","15.4.2","2.3.3","12.1.3","2.3.7","14.4.3","2.3.5","14.2.5","12.4.2","2.7.6","11.3.5"]},{"id":"resource:arxiv:2606.16613","title":"CoffeeBench: Benchmarking Long-Horizon LLM Agents in Heterogeneous Multi-Agent Economies","abstract":"As LLM agents become capable of increasingly long-horizon tasks, evaluating their performance in economic systems is becoming increasingly important. Unlike existing benchmarks that primarily evaluate a single agent interacting with a passive environment, economic systems are inherently multi-agent, requiring autonomous agents to communicate, negotiate, and transact while pursuing their own objectives over extended periods. We introduce CoffeeBench, a benchmark for evaluating LLM agents in a long-horizon multi-agent economy composed of heterogeneous firms. In CoffeeBench, two farmers, two roasters, and two retailers autonomously operate their businesses over a 90-day simulation, each seeking to maximize cumulative net income through communication and transactions while managing cash, inventory, and pricing. The evaluated model controls one coffee roaster, while the remaining firms are controlled by fixed reference agents. Across several recent open-weight and proprietary LLMs, all models outperform a passive baseline that takes no actions, with most achieving positive net income.…","authors":["Issa Sugiura","Daichi Hattori","Kazuo Araragi","Keita Ogawa","Shota Onose"],"date":"2026-06-15","url":"https://arxiv.org/abs/2606.16613","type":"preprint","current":["5.4","14.1"],"suggested":["10.4.3","11.7.1","10.6.1","5.4.3","14.1.4","11.7.3","6.2.3","13.1.4","11.13.3","11.6.6","11.1.2","5.4.5","9.3.3","16.4.2"]},{"id":"resource:arxiv:2607.26637","title":"Filesystem-Based Memory for LLM Agents: Organization, Evolution, and Sustainability","abstract":"Deployed LLM agents increasingly keep their long-term memory as a filesystem: a directory tree of markdown files that the agent itself reads, writes, and reorganizes through generic file tools. Yet research has largely passed over this medium: prior systems design bespoke memory representations and study retrieval over them, leaving the default's two working assumptions untested: that an agent can keep a growing store organized as memories accumulate, conflict, and go stale, and that this organization pays. We present the first systematic exploration of filesystem-based memory for LLM agents. We formalize the setting as three roles around one memory filesystem: a management agent integrates and organizes incoming content, a search agent answers queries with cited sources, and an execution agent supplies task trajectories that are distilled into skills, unifying declarative memory and skills in a single store. Across long-conversation benchmarks and embodied tasks, we vary memory shape (agent-organized hierarchy, verbatim dump, chunk retrieval), stream scale, tool harness (sandboxed…","authors":["Sizhe Zhou","Shuying Yu","Hui Wei","Junda Wu","Siru Ouyang"],"date":"2026-07-29","url":"https://arxiv.org/abs/2607.26637","type":"preprint","current":["7.2","7.4"],"suggested":["5.2.3","16.4.4","13.4.4","16.4.2","8.4.2","16.4.1","14.1.1","7.2.2","7.1.3","2.1.6","7.4.2","16.4.3","5.4.4","11.13.2"]},{"id":"resource:arxiv:2607.27415","title":"Bridging Inference-Time Scaling and Episodic Memory with Action-Centric Graphs","abstract":"Recent advancements in inference-time scaling have significantly unlocked the complex reasoning capabilities of Large Language Models~(LLMs). However, for agents, these approaches suffer from a critical inefficiency, operating in a stateless manner and engaging in redundant search processes. Existing memory mechanisms largely rely on the reasoning capabilities of LLMs, leading to prohibitive computational costs. In this paper, we propose a novel framework, \\textit{GAMER}~(Graph-based Action-centric Memory with Episodic Reasoning), that bridges the gap between inference scaling and episodic memory. Our approach models historical reasoning as a dynamic \\textit{Action-Centric Graph}. By decoupling the memory mechanism from LLMs, our method can save token/money usage by providing less memory context than memory mechanism baselines. To extract knowledge from the graph effectively, we use a dual-stream Temporal Difference learning mechanism to estimate the positive~(suggestion) and negative~(avoidance) value of action nodes based on past successes and failures. During the inference phase,…","authors":["Xu Zheng","Chaohao Lin","Zhuomin Chen","Weijieying Ren","Haifeng Chen"],"date":"2026-07-29","url":"https://arxiv.org/abs/2607.27415","type":"preprint","current":["7.1","7.4"],"suggested":["7.3.3","7.2.3","7.3.1","3.4.3","7.4.3","16.4.3","7.3.2","3.2.5","14.4.3","15.3.4","7.4.1","7.4.2","1.4.5","7.3.4"]},{"id":"resource:doi:10-1007-s11831-026-10675-8","title":"A Holistic Review of Agentic AI Frameworks, Applications, and Research Trajectories","abstract":"Abstract Agentic Artificial Intelligence (Agentic AI), as a new generation of intelligent systems, extends beyond mere text or image generation by incorporating components such as multi step reasoning, persistent memory, multi agent interaction, and purposeful tool use. These features enable autonomy and dynamic decision making in open and complex environments. This paper provides an extensive review of the existing literature on Agentic AI. To this end, the conceptual and historical distinctions between Agentic Artificial Intelligence, classical agents, and general-purpose language models are first examined. Subsequently, the proposed architectural framework encompassing perception, role adoption, memory, planning and reflection, action and tool use, and online learning is elaborated. The discussion then turns to key infrastructures, including state and memory management, orchestration and Machine Learning Operations (MLOps), as well as agent safety. Evaluation metrics and protocols are reviewed, ranging from interactive and long horizon testing to process level assessments.…","authors":["Pejman Peykani","Sanly Ghanidel","Iman Javadi-Sisi","Václav Snåšel","Seyedali Mirjalili"],"date":"2026-06-15","url":"https://doi.org/10.1007/s11831-026-10675-8","type":"peer-reviewed-paper","current":["3.1","16.1"],"suggested":["14.1.4","10.5.1","10.5.2","16.4.3","10.5.5","16.2.1","14.2.3","10.4.3","10.5.4","10.5.3","16.4.2","12.4.5","5.1.3","14.4.3"]},{"id":"resource:doi:10-1016-j-inffus-2025-103599","title":"AI Agents vs. Agentic AI: A Conceptual taxonomy, applications and challenges","abstract":"Information fusion, in the context of the Generative AI era, must distinguish AI Agents from Agentic AI. This review critically distinguishes between AI Agents and Agentic AI, offering a structured, conceptual taxonomy, application mapping, and analysis of opportunities and challenges to clarify their divergent design philosophies and capabilities. We begin by outlining the search strategy and foundational definitions, characterizing AI Agents as modular systems driven and enabled by LLMs and LIMs for task-specific automation. Generative AI is positioned as a precursor providing the foundation, with AI agents advancing through tool integration, prompt engineering, and reasoning enhancements. We then characterize Agentic AI systems, which, in contrast to AI Agents, represent a paradigm shift marked by multi-agent collaboration, dynamic task decomposition, persistent memory, and coordinated autonomy. Through a chronological evaluation of architectural evolution, operational mechanisms, interaction styles, and autonomy levels, we present a comparative analysis across both AI agents and…","authors":["Ranjan Sapkota","Konstantinos I. Roumeliotis","Manoj Karkee"],"date":"2025-08-22","url":"https://doi.org/10.1016/j.inffus.2025.103599","type":"peer-reviewed-paper","current":["1.1","1.2"],"suggested":["5.1.3","5.1.2","1.1.2","15.2.4","1.3.4","14.1.2","3.2.5","5.1.5","11.1.1","3.2.1","5.1.1","1.1.6","3.2.3","5.1.4"]},{"id":"resource:doi:10-1016-j-patter-2025-101341","title":"Lessons from complex systems science for AI governance","abstract":"The study of complex adaptive systems, pioneered in physics, biology, and the social sciences, offers important lessons for artificial intelligence (AI) governance. Contemporary AI systems and the environments in which they operate exhibit many of the properties characteristic of complex systems, including nonlinear growth patterns, emergent phenomena, and cascading effects that can lead to catastrophic failures. Complex systems science can help illuminate the features of AI that pose central challenges for policymakers, such as feedback loops induced by training AI models on synthetic data and the interconnectedness between AI systems and critical infrastructure. Drawing on insights from other domains shaped by complex systems, including public health and climate change, we examine how efforts to govern AI are marked by deep uncertainty. To contend with this challenge, we propose three desiderata for designing a set of complexity-compatible AI governance principles comprised of early and scalable intervention, adaptive institutional design, and risk thresholds calibrated to trigger…","authors":["Noam Kolt","Michal Shur‐Ofry","Reuven Cohen"],"date":"2025-08-01","url":"https://doi.org/10.1016/j.patter.2025.101341","type":"peer-reviewed-paper","current":["15.3","3.4"],"suggested":["5.1.3","11.6.3","11.14.7","16.3.4","11.10.5","10.4.2","6.1.5","16.3.3","4.1.4","4.2.2","11.10.6","7.2.1","7.2.2","13.2.4"]},{"id":"resource:doi:10-1017-s0140525x2510174x","title":"Institutions as cached computation for resource-rational negotiation","abstract":"Resource-rational contractualism explains human moral reasoning as efficient heuristics approximating idealized bargaining processes. Levine et al. compellingly model pairwise and small-group moral cognition, but overlook how institutions serve as computational shortcuts - pre-computed agreements that eliminate repeated negotiation. These cached computations can become rigid over time, driving new opportunities for flexible negotiation.","authors":["Muhua Huang","James A. Evans"],"date":"2026-01-01","url":"https://doi.org/10.1017/s0140525x2510174x","type":"peer-reviewed-paper","current":["1.2","5.2","15.3"],"suggested":["8.2.4","11.3.5","11.7.3","11.4.6","4.3.2","2.5.4","4.4.5","5.2.1","6.4.4","2.5.5","2.2.3","9.1.2","2.1.4","16.4.4"]},{"id":"resource:doi:10-1073-pnas-2319947121","title":"Tabula rasa agents display emergent in-group behavior","abstract":"Theories on group-bias often posit an internal preparedness to bias one's cognition to favor the in-group (often envisioned as a product of evolution). In contrast, other theories suggest that group-biases can emerge from nonspecialized cognitive processes. These perspectives have historically been difficult to disambiguate given that observed behavior can often be attributed to innate processes, even when groups are experimentally assigned. Here, we use modern techniques from the field of AI that allow us to ask what group biases can be expected from a learning agent that is a pure blank slate without any intrinsic social biases, and whose lifetime of experiences can be tightly controlled. This is possible because deep reinforcement-learning agents learn to convert raw sensory input (i.e. pixels) to reward-driven action, a unique feature among cognitive models. We find that blank slate agents do develop group biases based on arbitrary group differences (i.e. color). We show that the bias develops as a result of familiarity of experience and depends on the visual patterns becoming…","authors":["Raphaël Koster","Edgar A. Duéñez‐Guzmán","William A. Cunningham","Joel Z. Leibo"],"date":"2025-06-16","url":"https://doi.org/10.1073/pnas.2319947121","type":"peer-reviewed-paper","current":["5.1"],"suggested":["5.1.5","11.13.3","5.1.1","5.1.2","5.1.3","5.1.4","3.1.1","4.1.3","9.1.5","11.7.1","11.12.5","6.5.4","11.8.5","5.3.3"]},{"id":"resource:doi:10-1073-pnas-2319948121","title":"Collective cooperative intelligence","abstract":"Cooperation at scale is critical for achieving a sustainable future for humanity. However, achieving collective, cooperative behavior-in which intelligent actors in complex environments jointly improve their well-being-remains poorly understood. Complex systems science (CSS) provides a rich understanding of collective phenomena, the evolution of cooperation, and the institutions that can sustain both. Yet, much of the theory in this area fails to fully consider individual-level complexity and environmental context-largely for the sake of tractability and because it has not been clear how to do so rigorously. These elements are well captured in multiagent reinforcement learning (MARL), which has recently put focus on cooperative (artificial) intelligence. However, typical MARL simulations can be computationally expensive and challenging to interpret. In this perspective, we propose that bridging CSS and MARL affords new directions forward. Both fields can complement each other in their goals, methods, and scope. MARL offers CSS concrete ways to formalize cognitive processes in…","authors":["Wolfram Barfuß","Jessica C. Flack","Chaitanya S. Gokhale","Lewis Hammond","Christian Hilbe"],"date":"2025-06-16","url":"https://doi.org/10.1073/pnas.2319948121","type":"peer-reviewed-paper","current":["5.2","15.3"],"suggested":["15.3.4","5.1.5","1.3.2","15.1.1","16.2.1","5.1.1","1.2.4","16.4.2","5.1.2","5.1.3","5.1.4","11.3.6","1.2.1","15.3.3"]},{"id":"resource:doi:10-1111-epic-70009","title":"Building the Loop: The Role of Ethnography in Artificial Organisational Intelligence","abstract":"Abstract We introduce Artificial Organisational Intelligence (AOI): the capacity for organisations to make their knowledge (including routines, practices, rules, boundaries, and tacit know‐how) legible and governable. AOI is not about replacing organisations with AI, but about enabling them to talk to themselves and to each other through regulated feedback loops. Our collaborative project with BlockScience and Metagov develops Knowledge Organisation Infrastructure (KOI), a protocol for stitching together disparate systems and practices without homogenisation, thereby allowing organisations to embed rules, permissions, and context into machine‐readable forms. We describe how our ethnographic practice both informs and is transformed by this work: from observing hidden practices to actively building the loops that make organisational knowledge accessible and computable.","authors":["Ellie Rennie","Kelsie Nabben","Michael Zargham","Jason Potts","Brooke Ann Coco"],"date":"2025-11-01","url":"https://doi.org/10.1111/epic.70009","type":"peer-reviewed-paper","current":["16.1","16.4"],"suggested":["5.1.3","11.6.3","4.1.1","12.3.3","11.11.6","7.3.1","7.4.3","7.2.1","7.2.3","7.2.4","7.1.2","7.2.2","7.2.5","7.4.1"]},{"id":"resource:doi:10-1177-00491241251337316","title":"Simulating Subjects: The Promise and Peril of Artificial Intelligence Stand-Ins for Social Agents and Interactions","abstract":"Large language models (LLMs), through their exposure to massive collections of online text, learn to reproduce the perspectives and linguistic styles of diverse social and cultural groups. This capability suggests a powerful social scientific application—the simulation of empirically realistic, culturally situated human subjects. Synthesizing recent research in artificial intelligence and computational social science, we outline a methodological foundation for simulating human subjects and their social interactions. We then identify six characteristics of current models that are likely to impair the realistic simulation of human subjects: bias, uniformity, atemporality, disembodiment, linguistic cultures, and alien intelligence. For each of these areas, we discuss promising approaches for overcoming their associated shortcomings. Given the rate of change of these models, we advocate for an ongoing methodological program for the simulation of human subjects that keeps pace with rapid technical progress, and caution that validation against human subjects data remains essential to…","authors":["Austin C. Kozlowski","James A. Evans"],"date":"2025-06-02","url":"https://doi.org/10.1177/00491241251337316","type":"peer-reviewed-paper","current":["14.5","16.4"],"suggested":["14.5.4","16.3.3","6.2.3","2.5.1","11.10.6","4.4.1","11.11.5","4.1.2","4.4.6","4.1.1","10.6.1","3.4.3","4.1.4","4.1.5"]},{"id":"resource:doi:10-126
