# Concepts the corpus argues about that the taxonomy has no subpoint for.
#
# The vocabulary grows from the bottom up: a term is in it because a statement
# needed it, not because somebody predicted the field would need it. The
# evidence for doing it this way is in the corpus — of the terms carrying a
# statement, more arrived from claims than from the taxonomy, and 506 taxonomy
# subpoints have never been reached for at all.
#
# So those subpoints are a *suggestion pool*, searched before a near-duplicate
# is invented and joining the vocabulary the moment a statement uses one. They
# are read straight from the taxonomy file and not repeated here. This file
# holds what claims needed and the pool did not have.
#
# Adding one is meant to be cheap. A concept is not a filing target, nothing
# is tagged with it by obligation, and removing it later breaks nothing but
# the claims that used it. That is the opposite of a topic code, which is a
# stable identifier that other people's filings point at.
#
# `topics` says where a concept is reachable from, for navigation only.
#
# Watch this file. A concept layer drifting a long way from the taxonomy is
# evidence about the taxonomy, and the right response is eventually a topic
# proposal rather than a longer list here.
#
# ---------------------------------------------------------------------------
# Adding a term
#
#   aokg concepts --propose "Delegation revocation latency"
#
# Or read the whole list without a checkout: data/concepts.json holds all 523
# terms with their topics, origin and how many statements carry each. An
# agent can ask the MCP server instead — `search_concepts`.
#
# It answers one question: is this already here under another name? That is
# the only failure mode a concept list has, and it is silent — two terms for
# one idea break nothing, and every relation that would have been proposed
# between claims carrying them simply is not. Half a link layer disappears
# into a synonym and no error is ever raised.
#
# The loader refuses a term that collides, and there is no way to assert past
# it. Two resolutions, and "they are different, trust me" is not one: either
# the terms name one idea, and you use the existing one — or the *name* is
# doing a bad job of saying what differs, and the fix is a better name.
#
# Prefer the more specific. 'agent reputation' is a worse term than 'agent
# reputation systems' because it could mean either, and a vocabulary holding
# both makes every tagger guess. If the new idea is genuinely distinct, say
# what it is in the label — 'reputation portability between agent ecosystems'
# collides with nothing because it is actually specific.
#
# Then: reuse before adding. A term nothing else will ever carry proposes no
# pairs, which is the only thing a concept is for. Three of the seventeen in
# use are on exactly one statement — that is fine for a term added today and
# a sign of over-specificity for one added months ago.
#
# `aokg concepts` reports the whole list: what is used, what is inert, what
# collides, and how far the claim-added terms have drifted from the taxonomy.
# ---------------------------------------------------------------------------

concepts:
  - id: dissociative-agent-identity
    label: Dissociative agent identity
    topics: ["5.3", "6.3"]
    origin: claim
    note: >-
      An LLM agent is an assemblage of swappable modules, so the persistent
      identity reputation presumes may not exist. 5.3 covers reputation
      systems and 6.1 covers identity issuance; neither names the case where
      identity fails to persist at all.
    added: "2026-09-10"

  - id: sanction-sensitivity
    label: Sanction sensitivity
    topics: ["5.3", "2.7"]
    origin: claim
    note: >-
      Whether a principal can be made worse off by a penalty. A precondition
      for every ex post governance mechanism, and the thing that is missing
      when the agent is cheap to replace.
    added: "2026-09-10"

  - id: endogenous-non-stationarity
    label: Endogenous non-stationarity
    topics: ["5.2", "14.3"]
    origin: claim
    note: >-
      Deployment changes the environment the system was evaluated against,
      because other actors respond. Distinct from ordinary distribution
      shift: the system's own action is the cause.
    added: "2026-09-10"

  - id: train-test-deploy-gap
    label: Train-test-deploy gap
    topics: ["14.3"]
    origin: claim
    note: >-
      The third term is the new one. Held-out test data still comes from the
      pre-deployment world.
    added: "2026-09-10"

  - id: dynamic-evaluation
    label: Dynamic evaluation
    topics: ["14.1", "14.3"]
    origin: claim
    note: >-
      Evaluation whose test distribution depends on the policy being
      evaluated. The proposed answer to endogenous non-stationarity, and
      what 2606.03237 argues no current suite achieves.
    added: "2026-09-10"

  - id: prosocial-capability
    label: Prosocial capability
    topics: ["5.2", "14.1"]
    origin: claim
    note: >-
      Cooperation, reciprocity and restraint measured as a capability in its
      own right, separately from task score. The distinction 2509.14485 shows
      a leaderboard collapses.
    added: "2026-09-10"

  - id: capability-profiling
    label: Capability profiling
    topics: ["14.1"]
    origin: claim
    note: >-
      Inferring a per-ability profile rather than a single score, so that
      future performance can be predicted per scenario.
    added: "2026-09-10"

  - id: stake-based-trust
    label: Stake-based trust
    topics: ["5.3"]
    origin: claim
    note: >-
      Trust backed by something forfeitable. Sits alongside the reputation
      systems already at 5.3 and is the mechanism 2511.03434 recommends in
      their place for high-impact actions.
    added: "2026-09-10"

  - id: organisational-knowledge-legibility
    label: Organisational knowledge legibility
    topics: ["16.1", "2.4"]
    origin: claim
    note: >-
      Making an organisation's routines, rules and tacit know-how
      machine-readable so they can be governed. The core construct of the
      Artificial Organisational Intelligence work.
    added: "2026-09-10"

  - id: ex-ante-behavioural-harness
    label: Ex ante behavioural harness
    topics: ["2.5", "4.1"]
    origin: claim
    note: >-
      Constraining and monitoring an agent in real time, rather than rating and
      punishing it afterwards. The alternative 2605.30169 proposes once it argues
      reputation is structurally inapplicable — and the distinction its whole
      argument turns on, which nothing in the pool named.
    added: "2026-09-12"
