# Grow the corpus from its own citations, weekly and unattended.
#
#   held papers -> their reference lists -> what several of them cite
#     -> scope scan -> data/resources/ -> the site
#
# This is the workflow that retires "nothing enters the corpus without a
# human promoting it". Human promotion does not scale: a library that only
# grows when a maintainer has a free afternoon is a library that stops
# growing, and the queue it produced was never read.
#
# What replaces the human is not nothing. Three gates, in cost order — a
# threshold that rises with each hop from anybody's judgment, a scope scan
# that reads the abstract against the scope test and the exclusion register,
# and a budget per run. Every admitted record carries the generation, the
# papers that cited it, and the scan's reasoning in `source_provenance`, so
# a bad rule shows up as a readable pattern rather than a mystery pile.
#
# It commits to main for the same reason `new-resource.yml` does: blast
# radius. A new record changes no existing judgment and no measured number,
# lands `unreviewed` like everything else, and `git revert` undoes it
# completely. What still waits for a person is filing and taxonomy change.

name: Grow the corpus

on:
  schedule:
    - cron: "0 6 * * 2"        # Tuesday morning, a day after the tooling sync
  workflow_dispatch:
    inputs:
      budget:
        description: "Most records to admit in this run"
        default: "40"
      threshold:
        description: "Citations needed at generation 1"
        default: "2"
      dry_run:
        description: "Run the scan but write nothing"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write         # to report what the run decided
  actions: write        # to ask Pages to rebuild; see the dispatch step

concurrency:
  group: grow
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    # The key lives on this environment, not on the repository, and the
    # environment only admits `main`. Exfiltrating it therefore means
    # pushing to main rather than to a branch nobody watches — visible, and
    # revertible. Without this line the job would look for a repo-level
    # secret, find nothing, and quietly degrade to proposing only.
    environment: scope-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[scholarly,scope]"

      # Without a key the run admits nothing and says so. That is the
      # designed behavior rather than a failure — the fallback for a
      # missing scope test is a queue, not a keyword score — but a silent
      # no-op every Tuesday is how a broken secret goes unnoticed for a
      # month, so say it out loud.
      - name: Check the scope scan can run
        id: preflight
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY is not set — listing candidates only, admitting nothing"
            echo "scan=false" >> "$GITHUB_OUTPUT"
          else
            echo "scan=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Grow
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # A fortnight's window on the forward direction. The schedule is
          # weekly, so this overlaps deliberately: OpenAlex indexes a new
          # paper some days after it appears, and a window exactly the width
          # of the cadence would drop whatever landed late.
          since=$(python3 -c "import datetime;print((datetime.date.today()-datetime.timedelta(days=14)).isoformat())")
          aokg grow \
            --threshold "${{ github.event.inputs.threshold || 2 }}" \
            --budget "${{ github.event.inputs.budget || 40 }}" \
            --since "$since" \
            ${{ steps.preflight.outputs.scan == 'false' && '--propose-only' || '' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            | tee /tmp/grow.log

      # Two records arrive spelling one person differently — "Duéñez-Guzmán"
      # with a hyphen-minus and with U+2010, "Tramèr" with and without the
      # accent — and the corpus holds them as two people. `fold` already knows
      # they are the same; nothing was running the reconciliation, so every
      # growth run left main red until somebody looked.
      #
      # It cannot fix a wrong attribution: "G. Flucke" for Michael Luck is
      # OpenAlex mis-disambiguating, and telling those apart needs Crossref and
      # a person. That is what the integrity check below is for.
      - name: Reconcile split spellings
        run: aokg people --fix

      # The corpus is what this run changed, so check it before committing
      # rather than discovering it on somebody else's branch. Only the tests
      # that read the corpus: the site is rebuilt by a separate workflow, so
      # its figures are legitimately stale at this point.
      - name: Check the corpus still holds together
        id: integrity
        continue-on-error: true
        run: pytest tests/test_people.py tests/test_organizations.py tests/test_resources.py -q

      - name: Commit what was admitted
        id: commit
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          admitted=$(grep -c '^  + gen' /tmp/grow.log || echo 0)
          summary=$(sed -n '1,3p' /tmp/grow.log)
          git commit \
            -m "Grow the corpus by ${admitted} record(s) from its own citations" \
            -m "${summary}" \
            -m "Admitted by the citation-expansion path: cited by enough held records to clear the threshold for their generation, and passed a scope scan whose reasoning is recorded on each record. Unreviewed, like everything that has not been through the review queue."
          pushed=false
          for attempt in 1 2 3; do
            if git push; then pushed=true; break; fi
            git pull --rebase origin main || break
          done
          if [ "$pushed" != true ]; then
            echo "could not push" >&2
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN does not trigger other workflows, so
      # the site would keep serving a corpus without the new records.
      - name: Rebuild the site
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'pages.yml', ref: 'main',
            });

      # The run is the audit trail, so it has to be readable by someone who
      # was not watching. An issue rather than a log nobody opens.
      # Runs even when nothing was admitted. A silent Tuesday is
      # indistinguishable from a broken one, and the whole point of the
      # weekly cadence is that somebody notices.
      - name: Say nothing was admitted
        if: always() && steps.commit.outputs.changed != 'true'
        run: |
          echo "::notice::No records admitted this run. See the log above for whether that is because nothing qualified or because the scan failed."

      # Loud, and in the place somebody reads. A growth run that breaks the
      # corpus commits anyway — reverting is one command and blocking the
      # queue is worse — but it must never do so quietly.
      - name: Say the corpus needs a person
        if: steps.integrity.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              ...context.repo,
              title: `Corpus integrity after growth: ${new Date().toISOString().slice(0, 10)}`,
              labels: ['expansion'],
              body: [
                "This week's growth admitted records the corpus checks reject.",
                "",
                "Split spellings are reconciled automatically before this runs, so what",
                "is left needs a person: usually an author OpenAlex mis-disambiguated,",
                "which only a look at Crossref or the published paper settles.",
                "",
                `[The run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) says which test and which record.`,
              ].join("\n"),
            });

      - name: Report what it decided
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/grow.log', 'utf8');
            await github.rest.issues.create({
              ...context.repo,
              title: `Corpus growth: ${new Date().toISOString().slice(0, 10)}`,
              labels: ['expansion'],
              body: [
                "Records admitted automatically from the citation graph.",
                "",
                "Each carries its generation, the papers that cited it, and the",
                "scope scan's reasoning in `source_provenance`. **Reviewing these",
                "is how the scan earns trust** — a wrong admission here is the",
                "evidence for tightening the threshold, and a run with no wrong",
                "admissions is the evidence for relaxing it.",
                "",
                "```", log.slice(0, 55000), "```",
              ].join("\n"),
            });
