# Keeps the figures table in README.md in step with the corpus.
#
# Runs daily as well as on push, because the commits that add most records
# come from other workflows, and a push made with GITHUB_TOKEN does not trigger
# this one. Commits only when a number changed.

name: Update README figures

on:
  push:
    branches: [main]
    paths: ["data/**", "evals/**", "taxonomy/**"]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python3 scripts/update_readme_stats.py
      - name: Commit if the figures changed
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update the README figures from the corpus"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main || break
          done
          echo "could not push the README figures to main" >&2
          exit 1
