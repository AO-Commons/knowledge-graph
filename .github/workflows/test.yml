name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `airtable` brings requests, which scripts/mirror_public.py imports at
      # module level and tests/test_mirror_public.py therefore needs to collect.
      - run: pip install -e ".[dev,airtable]"
      - run: pytest -q

      # The release must rebuild byte-for-byte from the checked-in taxonomy.
      # If it doesn't, either the parser changed or the taxonomy did, and
      # both should be visible in review rather than discovered later.
      # A verdict is the most expensive thing here: somebody read a paper and
      # decided. Eight were deleted by a rebase that replaced the file
      # wholesale, and every other check passed — a gold set missing eight
      # entries is a perfectly valid gold set.
      - name: No judgement disappeared
        run: |
          git fetch --quiet origin main
          python3 scripts/check_gold_intact.py --base origin/main

      - name: Release is reproducible
        run: |
          aokg build --version check --out /tmp/rel-a
          aokg build --version check --out /tmp/rel-b
          diff -r /tmp/rel-a /tmp/rel-b

          # Compare against whichever release is checked in rather than a
          # pinned version: the version bumps, the invariant does not.
          latest="$(ls -d data/releases/*/ | sort -V | tail -1)"
          echo "checked-in release: $latest"

          # The taxonomy is the hard one. Codes are referenced from filings,
          # from the gold set, and from every record's tags, so the checked-in
          # release drifting from a rebuild means those references now point at
          # something else. That is a failure whatever caused it.
          diff "/tmp/rel-a/check/taxonomy.json" "${latest}taxonomy.json"

          # The corpus is the soft one, and deliberately so. Contributors add
          # resources between releases — the bot commits them straight to main —
          # so a release older than the corpus is the normal state, not a fault.
          # Still reported, because silent drift is how a release quietly stops
          # describing the thing it claims to.
          for f in nodes.jsonl relationships.jsonl; do
            if ! diff -q "/tmp/rel-a/check/$f" "$latest$f" > /dev/null; then
              ahead=$(( $(wc -l < "/tmp/rel-a/check/$f") - $(wc -l < "$latest$f") ))
              echo "::notice::$f has moved $ahead line(s) since $latest — cut a release when it matters"
            fi
          done

      # The MIRA projection is only worth publishing if it is MIRA. Validated
      # against their own generated shapes, vendored at the commit named in
      # schema/PINNED, so a green run here means the same thing in six months
      # as it does today.
      - name: MIRA projection conforms
        run: |
          pip install -q rdflib pyshacl
          python3 scripts/validate_mira.py /tmp/rel-a/check

      # A pin that silently falls behind is a fork nobody decided on. This
      # warns rather than fails: their schema moving is not our build breaking,
      # it is news.
      - name: MIRA pin is current
        run: |
          pinned="$(sed -n 2p schema/PINNED)"
          head="$(git ls-remote https://github.com/MIRA-science/schema HEAD | cut -f1)"
          if [ "$pinned" != "$head" ]; then
            echo "::notice::MIRA schema has moved: pinned ${pinned:0:8}, upstream ${head:0:8} — re-vendor and re-validate"
          fi
