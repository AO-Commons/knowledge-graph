# A reading, run by hand, for a paper somebody asked about.
#
#   record page  →  issue  →  a maintainer runs this  →  pull request  →  verdicts
#
# Started from the Actions tab rather than by the issue arriving, because a
# reading is a model call over a whole paper and the request form is public.
# Who gets one is a decision, and it is made where the rest of those decisions
# are made rather than encoded as a label here.
#
# A pull request rather than a commit to main, which is the opposite of what
# `new-resource.yml` does, and the difference is what the file changes. A new
# record changes no existing judgment and no measured number. Claims are the
# measured numbers: coverage, how much of the corpus has been read, how much a
# person has checked. Model output that moves those gets looked at first.
#
# Only papers in the curated set are read. `scripts/read_paper.py` says why,
# and enforces it — this workflow does not re-state the rule, it runs the thing
# that holds it.

name: Read a paper

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number asking for this (the bot reports back there)"
        required: false
      record:
        description: "Record id, if there is no issue — resource:arxiv:2604.10290"
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write

# One reading at a time. Two runs over the same paper would draft it twice,
# at the price of two readings.
concurrency:
  group: reading-${{ inputs.issue || inputs.record }}
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    # The reader's key lives on this environment, and the environment only
    # admits `main`. The same one the scope scan answers to.
    environment: scope-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `scope` carries the Anthropic client the reader shares with the scope
      # judge. Without it the reading refuses rather than silently filing
      # nothing — but a reader that always refuses is a closed door, which is
      # what issue #80 met on the other path.
      - run: pip install -e ".[scholarly,scope]"

      # Either input works. A record id is the whole request; an issue
      # number means the request is written down somewhere a person can read,
      # which is where the bot answers.
      - name: Work out what was asked
        id: ask
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { issue, record } = context.payload.inputs || {};
            if (!issue && !record) {
              core.setFailed('Give an issue number, a record id, or both.');
              return;
            }
            let body = record || '';
            if (issue && !record) {
              const got = await github.rest.issues.get({
                ...context.repo, issue_number: Number(issue) });
              body = got.data.body || '';
            }
            fs.writeFileSync('/tmp/request.md', body);
            core.setOutput('issue', issue || '');
            // The branch needs a name either way: the issue number when there
            // is one, otherwise the record flattened to what a git ref takes.
            core.setOutput('slug', issue
              ? `issue-${issue}`
              : (record || 'paper').replace(/[^A-Za-z0-9.]+/g, '-').toLowerCase());

      - name: Draft the claims
        id: draft
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 scripts/read_paper.py \
            --body-file /tmp/request.md --out /tmp/reading.json

      # Refused and could-not-read are answered on the issue rather than
      # failing silently in a log the requester will never open. Which of the
      # two it was is in the summary the script wrote, in its own words.
      - name: Say why not
        if: steps.draft.outcome == 'failure' && steps.ask.outputs.issue != ''
        uses: actions/github-script@v7
        env:
          ISSUE: ${{ steps.ask.outputs.issue }}
        with:
          script: |
            const fs = require('fs');
            let summary = '**This reading could not be done**, and no reason was recorded — which is itself worth looking at.';
            try {
              summary = JSON.parse(fs.readFileSync('/tmp/reading.json', 'utf8')).summary || summary;
            } catch (e) {}
            await github.rest.issues.createComment({
              ...context.repo, issue_number: Number(process.env.ISSUE), body: summary,
            });
            await github.rest.issues.addLabels({
              ...context.repo, issue_number: Number(process.env.ISSUE),
              labels: ['needs-maintainer'],
            });

      # Run as a check, not as a commit: a reading that breaks the corpus
      # should stop here rather than at deploy. The built page must not travel
      # in the pull request — `Publish the site` rebuilds it on main, and two
      # readings in flight would otherwise conflict over one generated file.
      - name: The corpus still builds
        if: steps.draft.outcome == 'success'
        run: |
          python3 scripts/build_site.py
          python3 scripts/check_claims.py || true

      - name: Write the pull request body
        if: steps.draft.outcome == 'success'
        run: |
          : > /tmp/pr-body.md
          if [ -n "${{ steps.ask.outputs.issue }}" ]; then
            printf 'Closes #%s\n\n' "${{ steps.ask.outputs.issue }}" > /tmp/pr-body.md
          fi
          python3 - <<'PY' >> /tmp/pr-body.md
          import json
          print(json.load(open("/tmp/reading.json"))["summary"])
          PY

      # Opening the pull request needs "Allow GitHub Actions to create and
      # approve pull requests", which this organization disables. The branch
      # still pushes, so a reading is never lost — a maintainer opens the pull
      # request from the link in the comment below.
      - name: Open the pull request
        if: steps.draft.outcome == 'success'
        id: pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          branch: reading/${{ steps.ask.outputs.slug }}
          # Only the claims. Anything generated is rebuilt on main.
          add-paths: |
            data/claims/**
          title: "Reading: ${{ steps.ask.outputs.slug }}"
          body-path: /tmp/pr-body.md
          commit-message: "Draft claims for ${{ steps.ask.outputs.slug }}"
          labels: reading
          delete-branch: true

      - name: Report back on the issue
        if: steps.draft.outcome == 'success' && steps.ask.outputs.issue != ''
        uses: actions/github-script@v7
        env:
          ISSUE: ${{ steps.ask.outputs.issue }}
          PR: ${{ steps.pr.outputs.pull-request-url }}
          BRANCH: reading/${{ steps.ask.outputs.slug }}
        with:
          script: |
            // GitHub renders every newline in a comment as a line break, so lines
            // wrapped here for reading are joined back into one paragraph; blank
            // lines, quotes and list items keep theirs.
            const para = (lines) => lines.join('\n').replace(/([^\n])\n(?![\n>*-])/g, '$1 ');
            const fs = require('fs');
            const reading = JSON.parse(fs.readFileSync('/tmp/reading.json', 'utf8'));
            const { owner, repo } = context.repo;
            const url = process.env.PR, branch = process.env.BRANCH;

            // Did the branch land? Saying "opened a pull request" when none
            // exists is a claim the requester cannot check and will believe.
            let tail;
            if (url) {
              tail = para([`The claims are in ${url}, waiting for somebody to read them`,
                `against the paper.`]);
            } else {
              const ref = await github.rest.git.getRef({
                owner, repo, ref: `heads/${branch}` }).catch(() => null);
              tail = ref
                ? para([`The claims are on branch \`${branch}\` —`,
                    `[open a pull request from it](https://github.com/${owner}/${repo}/compare/main...${branch}?expand=1).`,
                    `This repository does not let Actions open one itself.`])
                : para([`Nothing was pushed, so there is nothing to review. That is a bug`,
                    `in this workflow rather than a verdict on the paper.`]);
            }

            await github.rest.issues.createComment({
              ...context.repo, issue_number: Number(process.env.ISSUE),
              body: `${reading.summary}\n\n${tail}`,
            });

            // Renamed after the paper, and left open: it closes when the pull
            // request merges, which is when the reading actually landed.
            if (reading.title) {
              await github.rest.issues.update({ ...context.repo,
                issue_number: Number(process.env.ISSUE),
                title: `[Read] ${reading.title}`.slice(0, 256) });
            }

      # Whoever pressed the button is standing on this page, and a run started
      # from a record id has no issue to answer on. Always, so a refusal is
      # readable here too rather than only in a step's log.
      - name: Say what happened, on the run
        if: always()
        run: |
          if [ -f /tmp/reading.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          print(json.load(open("/tmp/reading.json")).get("summary", "No summary was written."))
          PY
          else
            echo "The reading did not get as far as writing a result." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "${{ steps.ask.outputs.slug }}" ] && [ "${{ steps.draft.outcome }}" = "success" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Branch: \`reading/${{ steps.ask.outputs.slug }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
