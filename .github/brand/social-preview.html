<!doctype html><meta charset=utf-8>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500&family=Hanken+Grotesk:wght@400;500&family=DM+Mono:wght@400&display=swap">
<style>
*{margin:0;box-sizing:border-box}
body{width:1280px;height:640px;overflow:hidden;
  background:linear-gradient(165deg,#cfe4f7 0%,#f5f8fb 58%);
  font-family:"Hanken Grotesk",sans-serif;color:#1a1a19;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:72px 80px}
.brand{display:flex;align-items:baseline;gap:16px}
.brand b{font-family:"Bricolage Grotesque",sans-serif;font-weight:400;font-size:36px;letter-spacing:-.025em}
.brand span{font-family:"DM Mono",monospace;font-size:15px;letter-spacing:.16em;
  text-transform:uppercase;color:#8b8b86}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:300;font-size:74px;
  line-height:1.03;letter-spacing:-.04em;max-width:17ch;margin:38px 0 0}
p{font-size:25px;line-height:1.42;color:#5a5a57;max-width:46ch;margin:22px 0 0}
.figs{display:flex;gap:54px;align-items:baseline}
.figs div b{font-size:44px;font-weight:500;display:block;line-height:1}
.figs div span{font-family:"DM Mono",monospace;font-size:14px;color:#8b8b86;
  letter-spacing:.04em}
.rule{height:3px;background:#0e4f46;width:92px;margin:0 0 26px}
</style>
<div>
  <div class="brand"><b>AO Commons</b><span>Knowledge Graph</span></div>
  <h1>Research on organizations machines help run.</h1>
  <p>Every claim carries the sentence it came from, so you can check it
     without opening the paper.</p>
</div>
<div>
  <div class="rule"></div>
  <div class="figs">
    <div><b>363</b><span>RECORDS</span></div>
    <div><b>349</b><span>CLAIMS</span></div>
    <div><b>27</b><span>PAPERS READ</span></div>
    <div><b>13</b><span>OPEN QUESTIONS</span></div>
  </div>
</div>
