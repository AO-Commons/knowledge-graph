name: Suggest something for the library
description: A paper, tool, deployment, organization, person or article we should hold.
title: "[Add] "
labels: ["new-resource"]   # a label that exists: GitHub silently drops one that does not, and the bot then never runs
body:
  - type: markdown
    attributes:
      value: |
        One form for everything. For a paper, just paste the link, DOI or arXiv id below and leave the title as "[Add]" — we look the rest up. For anything else, put its name in the title.

  - type: dropdown
    id: kind
    attributes:
      label: What is it?
      options:
        - Paper or preprint
        - Article, post or report
        - Tool or framework
        - Deployment — an autonomous organization actually running
        - Evaluation suite or benchmark
        - Organization
        - Person
        - Something else
    validations:
      required: true

  - type: input
    id: identifier
    attributes:
      label: Link, DOI or arXiv id
      placeholder: "https://…   ·   10.48550/arXiv.2502.14143   ·   2502.14143"
    validations:
      required: true

  - type: input
    id: organization
    attributes:
      label: Organization
      description: |
        Optional. Helpful for a tool or a deployed AO: the organization that makes
        or runs it, named as it names itself. We link it to the organization
        already in the library, or add it if it is new.
      placeholder: "Andon Labs   ·   Anthropic, Andon Labs"
    validations:
      required: false

  - type: textarea
    id: why
    attributes:
      label: Why does it belong?
      description: |
        We hold research on organizations where AI agents make real decisions or run
        real operations — not where they only assist someone who does.

        A sentence or two on why this matters for building, running or overseeing one.
      placeholder: "A sentence or two is plenty."
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ### What happens next

        A bot checks it against our scope, usually within a minute.

        **If it fits**, we look up the details, add it, and comment here with a link.
        New records are marked unreviewed until a person has checked them.

        **If it does not**, the bot says why and leaves this open. Reply if you
        disagree — a maintainer can still add it.
