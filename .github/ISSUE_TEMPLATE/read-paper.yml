name: Request claim extraction
description: Ask for the claims a paper makes to be drafted, each with the sentence it came from.
title: "[Read] "
labels: ["reading"]
body:
  - type: markdown
    attributes:
      value: |
        A record in this library starts as a paper with a title and an abstract.
        Extracting its claims means drafting what it found, what it argues and
        what it says is still open — each carried by a sentence quoted from the
        paper itself and checked against it word for word.

        Start this from a record's page on the
        [site](https://ao-commons.github.io/knowledge-graph/), which fills in the
        id for you.

  - type: input
    id: record
    attributes:
      label: Which record
      description: The id, which looks like `resource:arxiv:2604.10290`.
      placeholder: resource:arxiv:2604.10290
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything worth knowing before it is read
      description: |
        Optional. A section that matters, a result that is easy to misread, a
        claim you already know is in there.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ### What happens next

        A maintainer reads the request and approves it. Extraction is a model
        call over a whole paper, so requests are run deliberately rather than on
        arrival — which also means nothing is spent before somebody has looked.

        Once approved, a bot drafts the claims and opens a pull request. Nothing
        it writes has been checked by a person; the pull request is where that
        happens.

        Two things get a request turned down, and both are worth knowing before
        you ask:

        - **The paper is not in the verified set.** That set is the reading list
          behind the AO Commons research agenda, and it is what the site opens
          on. Getting the paper onto it is the step before this one.
        - **The paper has already been read.** Its claims carry verdicts, and
          drafting them again would throw those away. To correct one, use
          *Report an error* on the record instead.
