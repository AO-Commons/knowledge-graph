name: Ask for a paper to be read
description: Draft the claims a paper makes, each with the sentence it came from.
title: "[Read] "
labels: ["reading"]
body:
  - type: markdown
    attributes:
      value: |
        A record in this library starts as a paper with a title and an abstract.
        Reading it means drafting the claims it makes — what it found, what it
        argues, what it says is still open — each carried by a sentence quoted
        from the paper itself.

        A bot does the drafting and opens a pull request. Nothing it writes has
        been checked by a person; the pull request is where that happens.

        Start this from a record's page on the
        [site](https://ao-commons.github.io/knowledge-graph/), which fills in
        the id for you.

  - type: input
    id: record
    attributes:
      label: Which record
      description: The id, which looks like `resource:arxiv:2604.10290`.
      placeholder: resource:arxiv:2604.10290
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything worth knowing before it is read
      description: |
        Optional. A section that matters, a result that is easy to misread, a
        claim you already know is in there.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        **Only papers in the verified set can be read this way.** That set is the
        reading list behind the AO Commons research agenda, and it is what the
        site opens on. A paper outside it gets told so, which is also the request
        it becomes: it has to go on the list first.

        **A paper that has already been read is left alone.** Its claims carry
        verdicts, and drafting them again would throw those away. To correct one,
        use *Report an error* on the record instead.
