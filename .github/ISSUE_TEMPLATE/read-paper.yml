name: Request claim extraction
description: Ask for a paper's claims to be written down, each with the sentence it came from.
title: "[Read] "
labels: ["reading"]
# Every paragraph below is one line on purpose. GitHub renders each newline in
# an issue form as a line break, so a paragraph wrapped for this file arrives
# wrapped on the page — mid-sentence, at whatever column the file happened to
# break. The workflows solve the same problem with a `para()` helper; here the
# fix is to not wrap.
body:
  - type: markdown
    attributes:
      value: |
        Ask for a paper's claims to be written down: what it found, what it argues, and what it says is still unanswered. Every claim is saved with the exact sentence from the paper that it came from, so anyone can check it in seconds.

        The easy way to start one of these is from the paper's page on the [knowledge graph](https://ao-commons.github.io/knowledge-graph/) — press **Request claim extraction** there and the id below is filled in for you.

  - type: input
    id: record
    attributes:
      label: Which paper
      description: Its id in the library. It looks like `resource:arxiv:2604.10290`.
      placeholder: resource:arxiv:2604.10290
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything we should know
      description: Optional. A section that matters, a result that is easy to misread, or a claim you already know is in there.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ### What happens next

        1. **A maintainer starts it.** Nothing runs when you press send. Reading a whole paper costs real money, so somebody starts each one by hand after reading the request.
        2. **A bot drafts the claims** and opens a pull request with them.
        3. **A person checks them** against the paper. Until that happens, every claim is a draft — written by a model and checked by nobody.

        ### When a request is turned down

        **The paper isn't in the curated set.** That set is what the site shows before you press *Everything*, and only papers in it can be read this way. If yours isn't there yet, ask for it to be added first.

        **The paper has already been read.** Its claims may already carry people's verdicts, and drafting them again would throw those away. To fix a claim that's wrong, use *Report an error* on the paper instead.
