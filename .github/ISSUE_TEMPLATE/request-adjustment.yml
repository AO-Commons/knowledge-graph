name: Correct something in the library
description: Something we hold is wrong, out of date, or misreads its source.
title: "[Fix] "
labels: ["suggestion", "correction"]
body:
  - type: markdown
    attributes:
      value: |
        Corrections are the most useful thing you can send. Most of what is here has
        not been checked by anyone.

  - type: input
    id: record
    attributes:
      label: What is wrong?
      description: A record id, a claim id, or a link to the page. Copy it from the site.
      placeholder: "resource:arxiv:2502.14143   ·   claim:arxiv:2502.14143:3   ·   a link"
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem?
      options:
        - A claim does not say what the paper says
        - Wrong metadata — title, authors, date, venue, link
        - Wrong topic or tag
        - Wrong attribution — whose result it is, who wrote it, where they were
        - It should not be in the library at all
        - Something about this record is missing
        - Something else
    validations:
      required: true

  - type: textarea
    id: correction
    attributes:
      label: What should it say?
      description: |
        If a claim misreads a paper, give us the sentence the paper actually uses.
        We store every claim with its original quote, so we can compare the two.
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Where can we check that?
      description: Optional. A page number, a link, or a quote.

  - type: checkboxes
    id: author
    attributes:
      label: Did you write this work?
      options:
        - label: Yes — I am an author of the thing this record describes.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        A maintainer reads every correction. If you wrote the work, we note that —
        you are the best judge of whether a claim says what your paper says.
