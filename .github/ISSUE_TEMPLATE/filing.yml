name: Send in a filing
description: Statement verdicts or taxonomy tags from the filing site.
title: "[Filing] "
labels: ["filing"]
body:
  - type: markdown
    attributes:
      value: |
        Paste what the filing site's **Submit** screen gave you. A bot checks it
        and opens a pull request against the gold set — you don't need git, and
        you don't need to touch the repository.

        Two kinds of filing come through here, and one issue can carry both:

        - **Golden-set review** — verdicts on extracted statements. The block
          starts with `claims:`.
        - **Filing** — taxonomy codes on records. The block starts with `records:`.

        Everything is validated. If something is wrong the bot says what, on this
        issue, and nothing is merged until it's fixed.

  - type: textarea
    id: filing
    attributes:
      label: Your filing
      description: |
        The whole block, exactly as the Submit screen gave it — starting at
        `claims:` or `records:`.
      render: yaml
      placeholder: |
        claims:
          claim:arxiv:2606.03237:1:
            verdict: accurate
            reviewed_on: 2026-09-11
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything that gave you trouble
      description: |
        Statements you were unsure about, or records where nothing in the
        taxonomy fit. These are the most useful thing in the submission — a
        repeated near-miss is usually a real gap, and worth a proposal.
