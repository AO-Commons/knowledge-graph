title: 'Agentic AI in der Unternehmenspraxis: Vom Werkzeug zum Akteur'
abstract: Zusammenfassung Künstliche Intelligenz entwickelt sich von einfacher Automatisierung
  und Inhaltsgenerierung hin zu Systemen, die komplexe Ziele über heterogene Unternehmenslandschaften
  hinweg verfolgen. Ermöglicht durch Fortschritte bei generativer künstlicher Intelligenz,
  großen Sprachmodellen, dem Erlernen und Nutzen von Werkzeugen sowie großen Aktionsmodellen
  entstehen in Forschung und Praxis sogenannte Agentic-AI-Systeme. Trotz des wachsenden Interesses
  bleibt offen, ob sich der Begriff auf einzelne Agenten, auf Verbünde interagierender Agenten
  oder auf eine eigenständige Systemklasse bezieht. Der vorliegende Grundlagenbeitrag entwickelt
  eine fähigkeitsbasierte Begriffsbestimmung der Agentic AI und ordnet sie in die langjährige
  Forschung zu autonomen Agenten und Multi-Agenten-Systemen ein. Wir bestimmen Agentic AI
  über sechs Kernfähigkeiten – Ziele, Umgebungsinteraktion, Schlussfolgern, Gedächtnis, Werkzeuge
  und Handeln – und unterscheiden agentische Systeme erster Ordnung (einzelne KI-Agenten)
  von Systemen zweiter Ordnung (Kollaboration mehrerer Agenten). Auf dieser Grundlage grenzen
  wir agentenbasierte Workflows von herkömmlichen und nicht-agentenbasierten Workflows ab
  und erläutern zentrale Architekturmuster. Abschließend leiten wir Implikationen für die
  Praxis ab, die Gestaltung und Einführung, agentenbasierte Workflows und Prozessmanagement,
  Governance, die Zusammenarbeit von Mensch und Agent sowie Plattform-Ökosysteme betreffen.
  Der Beitrag bietet Fach- und Führungskräften eine strukturierte Grundlage, um Agentic AI
  einzuordnen, Potenziale zu bewerten und den verantwortungsvollen Einsatz im Unternehmen
  zu gestalten.
