abstract: Resource-rational contractualism explains human moral reasoning as efficient heuristics
  approximating idealized bargaining processes. Levine et al. compellingly model pairwise
  and small-group moral cognition, but overlook how institutions serve as computational shortcuts
  - pre-computed agreements that eliminate repeated negotiation. These cached computations
  can become rigid over time, driving new opportunities for flexible negotiation.
