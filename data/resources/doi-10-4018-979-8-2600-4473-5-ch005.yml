title: Human–AI Collaboration in Agentic Systems
abstract: 'The emergence of agentic artificial intelligence systems presents organizations
  with a profound governance challenge: how to preserve meaningful human oversight without
  negating the efficiency benefits that motivated adoption in the first place. This chapter
  examines the design principles, frameworks, and organizational practices that enable productive
  human–AI collaboration within agentic systems. The chapter develops an integrated conceptual
  model encompassing three interdependent design imperatives: guardrails that constrain autonomous
  action within acceptable boundaries; escalation protocols that route consequential decisions
  to appropriately qualified human agents; and trust architectures that calibrate the degree
  of reliance placed on AI judgment relative to task characteristics, organizational context,
  and demonstrated system performance. The chapter further examines how organizations should
  structure roles, accountability mechanisms, and cultural norms to sustain human agency in
  progressively automated environments.'
