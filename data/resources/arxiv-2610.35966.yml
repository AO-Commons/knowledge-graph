source_provenance: 'Brought in by hand on 2026-10-29, found outside the scouting path. Scope judged against
  the standing test by claude-opus-5 WITHOUT the machine judge in scope_judge.py, which needs an API key
  this session did not have — so this is a reading of the policy rather than a run of it, and should be
  confirmed. The judgment: a reflector diagnoses each failure, decides which part of the system owns the
  correction, and rewrites the controller''s routing, a specialist''s prompt or a procedural skill. That
  is a machine agent holding decision authority over the organization''s own structure, and removing the
  machine does not leave the finding intact — the result is about what a model does when it reorganizes
  its own multi-agent system. Nothing in the exclusion register bars it. Filed at 3 (organizational architecture)
  and 7 (knowledge, memory and institutional continuity).'
