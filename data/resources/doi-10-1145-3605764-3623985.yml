resource_type: peer-reviewed-paper
title: 'Not What You''ve Signed Up For: Compromising Real-World LLM-Integrated Applications
  with Indirect Prompt Injection'
abstract: Large Language Models (LLMs) are increasingly being integrated into applications,
  with versatile functionalities that can be easily modulated via natural language prompts.
  So far, it was assumed that the user is directly prompting the LLM. But, what if it is not
  the user prompting? We show that LLM-Integrated Applications blur the line between data
  and instructions and reveal several new attack vectors, using Indirect Prompt Injection,
  that enable adversaries to remotely (i.e., without a direct interface) exploit LLM-integrated
  applications by strategically injecting prompts into data likely to be retrieved at inference
  time. We derive a comprehensive taxonomy from a computer security perspective to broadly
  investigate impacts and vulnerabilities, including data theft, worming, information ecosystem
  contamination, and other novel security risks. We then demonstrate the practical viability
  of our attacks against both real-world systems, such as Bing Chat and code-completion engines,
  and GPT-4 synthetic applications. We show how processing retrieved prompts can act as arbitrary
  code execution, manipulate the application's functionality, and control how and if other
  APIs are called. Despite the increasing reliance on LLMs, effective mitigations of these
  emerging threats are lacking. By raising awareness of these vulnerabilities, we aim to promote
  the safe and responsible deployment of these powerful models and the development of robust
  defenses that protect users from potential attacks.
