title: Making Enterprise AI Explainable through Calibrated Confidence and Provenance
abstract: 'Enterprise AI systems cannot earn stakeholder trust without genuine transparency:
  the ability to trace reasoning, communicate uncertainty accurately, and adapt explanations
  to user expertise. This paper presents a framework treating provenance tracking and uncertainty
  communication as foundational requirements. The framework maintains complete reasoning chains
  with explanation adaptation across four stakeholder levels. Uncertainty decomposition separates
  epistemic from aleatoric components, enabling users to understand what actions might improve
  results. Confidence-based routing translates uncertainty into actionable decisions: validation
  bypass, mandatory review, or expert escalation. We evaluated the framework on 143 financial
  controlling queries. The first version was more confident on the predictions it got wrong
  than on the ones it got right, a gap of −2.42%. A confidence value like this misreports
  when a pattern choice is reliable, and a complete provenance record does not fix it on its
  own. Four improvement iterations raised pattern-selection accuracy from 68.53% to 84.62%
  (95% CI 77.7% to 89.8%) on that development set and moved the confidence gap to +17.93%.
  The same queries drove those iterations, so we then ran the selector unchanged on an independent
  set of 200 queries. Accuracy there was 77.0% and the gap stayed positive at +12.2 pp, next
  to an expected calibration error of 0.182 and a Brier score of 0.190. These are the figures
  that say how the method generalizes. A positive gap is one sign of calibration and not the
  whole of it, and every calibration figure reported here is for the pattern-selection confidence.
  The response confidence is future work.'
