  gate and its stakeholder-tiered audit trail, which only matter where an agent has operational
  latitude. What changes because agents hold authority: It shows that the confidence signal
  used to decide whether an agent''s output bypasses validation, gets mandatory review, or
  escalates to a human can be anti-calibrated — more confident when wrong — so the gating
  mechanism that allocates autonomy to the agent must itself be measured (ECE, Brier, confidence
  gap) on held-out data rather than assumed, and provenance records alone do not repair it.
