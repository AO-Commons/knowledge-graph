tool:
  agent_model: 'The agent modifies itself: it "reads its own brain, generates mutations, validates
    them, and applies them" through six AST-level strategies — repair, optimize, explore, exploit,
    innovate, prune. It absorbs GitHub repositories every seven cycles and self-reflects without
    user prompting. This is the strongest autonomy claim in the batch, and the only one where
    the artefact under change is the agent itself.'
  human_controls: Control is architectural rather than procedural. Protected kernel modules "cannot
    be modified" by the agent, which is a boundary drawn inside the system rather than a gate
    a person stands at. Five security layers are documented, including backups, import validation,
    a SecurityGuard blocking dangerous bash commands, and audit logging. Steering is by CLI command.
    There is no human approval step before a mutation is applied — the agent validates its own
    changes, which makes the protected kernel the whole of the containment story.
