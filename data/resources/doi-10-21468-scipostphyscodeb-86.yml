resource_type: peer-reviewed-paper
title: MadAgents
abstract: We uncover an effective and communicative set of agents working with MadGraph. Agentic
  installation, learning-by-doing training, and user support provide easy access to state-of-the-art
  simulations and accelerate LHC research. We show in detail how MadAgents interact with inexperienced
  and advanced users, support a range of simulation tasks, and analyze the results. In a second
  step, we illustrate how MadAgents automatize event generation and run an autonomous simulation
  campaign, starting from a pdf file of a paper. We also present successive MadAgents updates,
  including a Claude Code implementation with a self-improvement loop.
