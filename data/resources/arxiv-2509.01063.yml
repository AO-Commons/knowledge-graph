title: An Economy of AI Agents
abstract: In the coming decade, artificially intelligent agents with the ability to plan and
  execute complex tasks over long time horizons with little direct oversight from humans may
  be deployed across the economy. This chapter surveys recent developments and highlights
  open questions for economists around how AI agents might interact with humans and with each
  other, shape markets and organizations, and what institutions might be required for well-functioning
  markets.
