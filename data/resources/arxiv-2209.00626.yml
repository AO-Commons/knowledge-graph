id: resource:arxiv:2209.00626
resource_type: preprint
title: The Alignment Problem from a Deep Learning Perspective
abstract: In coming years or decades, artificial general intelligence (AGI) may surpass human
  capabilities across many critical domains. We argue that, without substantial effort to
  prevent it, AGIs could learn to pursue goals that are in conflict (i.e. misaligned) with
  human interests. If trained like today's most capable models, AGIs could learn to act deceptively
  to receive higher reward, learn misaligned internally-represented goals which generalize
  beyond their fine-tuning distributions, and pursue those goals using power-seeking strategies.
  We review emerging evidence for these properties. In this revised paper, we include more
  direct empirical evidence published as of early 2025. AGIs with these properties would be
  difficult to align and may appear aligned even when they are not. Finally, we briefly outline
  how the deployment of misaligned AGIs might irreversibly undermine human control over the
  world, and we review research directions aimed at preventing this outcome.
