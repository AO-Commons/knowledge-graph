title: Adaptive Governance of Autonomous AI Agents
abstract: The introduction of autonomous AI agents as active participants in the institutions
  is a qualitative change in the governance requirements facing organisations in the public
  sector, financial services and critical infrastructure. In contrast to the earlier generations
  of decision-support systems, AI agents do not simply enlighten human choices; they take
  consequential actions, coordinate multi-step work processes, and increasingly act in distributed
  multi-agent systems that decentralize responsibility and make it harder to monitor. The
  chapter states that the governance of AI agents is not appropriate to be addressed through
  compliance-oriented, checklist-driven approaches that are designed to be applicable to the
  systems that are static and rule-based
