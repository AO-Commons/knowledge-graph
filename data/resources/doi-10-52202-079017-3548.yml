title: 'Cooperate or Collapse: Emergence of Sustainable Cooperation in a Society of LLM Agents'
abstract: As AI systems pervade human life, ensuring that large language models (LLMs) make
  safe decisions remains a significant challenge. We introduce the Governance of the Commons
  Simulation (GovSim), a generative simulation platform designed to study strategic interactions
  and cooperative decision-making in LLMs. In GovSim, a society of AI agents must collectively
  balance exploiting a common resource with sustaining it for future use. This environment
  enables the study of how ethical considerations, strategic planning, and negotiation skills
  impact cooperative outcomes. We develop an LLM-based agent architecture and test it with
  the leading open and closed LLMs. We find that all but the most powerful LLM agents fail
  to achieve a sustainable equilibrium in GovSim, with the highest survival rate below 54%.
  Ablations reveal that successful multi-agent communication between agents is critical for
  achieving cooperation in these cases. Furthermore, our analyses show that the failure to
  achieve sustainable cooperation in most LLMs stems from their inability to formulate and
  analyze hypotheses about the long-term effects of their actions on the equilibrium of the
  group. Finally, we show that agents that leverage"Universalization"-based reasoning, a theory
  of moral thinking, are able to achieve significantly better sustainability. Taken together,
  GovSim enables us to study the mechanisms that underlie sustainable self-government with
  specificity and scale. We open source the full suite of our research results, including
  the simulation environment, agent prompts, and a comprehensive web interface.
