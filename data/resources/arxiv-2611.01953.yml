  pairs breach budgets pre-observability changes the design of agent containment and audit,
  not merely security research in the abstract. What changes because agents hold authority:
  It shows that oversight placed where a monitor inspects what an agent reads is structurally
  too late — harm from an agent''s first processing step occurs before any observable context
  exists — so control for agents with operational authority must be enforced at the tool/resource
  primitive (e.g., byte-budget gates on each call) rather than at the model-input boundary.
