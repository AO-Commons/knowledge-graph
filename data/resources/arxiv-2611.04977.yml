id: resource:arxiv:2611.04977
resource_type: preprint
title: 'GeoFaham: Domain-Specialized Multi-Agent Geospatial Analytics for Disaster Response'
abstract: Real-world geospatial decision support requires more than single-step retrieval
  or code generation. Disaster-response questions often involve multi-source workflows that
  combine spatial databases, map-derived features, satellite imagery, raster products, and
  reusable geospatial artifacts, where correctness depends on preserving spatial scope, temporal
  context, and intermediate execution state. While large language models and coding agents
  offer a promising interface for such workflows, they struggle with geospatial-specific failure
  modes, including handling large artifacts, selecting the wrong evidence source, losing spatial
  or temporal metadata, and applying invalid geometric operations. We introduce GeoFaham,
  a domain-specialized multi-agent system for geospatial disaster analytics. GeoFaham decomposes
  workflows into specialist agents for vector operations, map feature retrieval, imagery discovery,
  and raster analysis, coordinated by an Orchestrator with a dual-ledger control loop for
  dependency-aware planning, progress tracking, validation, and replanning. To support artifact-centric
  collaboration, GeoFaham uses a Response Store that persists full geospatial outputs and
  typed metadata outside the LLM context window while agents exchange compact identifiers
  and summaries. We also introduce GeoFaham-Bench, a 40-task benchmark grounded in 17 real-world
  disaster records, designed to evaluate multi-step geospatial reasoning, cross-source integration,
  raster-vector computation, artifact generation, and recovery under non-rigid ground truth.
  We evaluate GeoFaham on GeoFaham-Bench against strong general-purpose coding-agent baselines,
  including Codex, Claude Code, and OpenCode. GeoFaham achieves the best overall performance,
  scoring 0.940 versus the next-best 0.879, while using 7.5 times fewer tokens. Our code and
  benchmark are publicly available at https://github.com/microsoft/GeoFaham.
