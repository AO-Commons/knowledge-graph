title: A Survey of Ad Hoc Teamwork Research
abstract: 'Ad hoc teamwork is the research problem of designing agents that can collaborate
  with new teammates without prior coordination. This survey makes a two-fold contribution:
  First, it provides a structured description of the different facets of the ad hoc teamwork
  problem. Second, it discusses the progress that has been made in the field so far, and identifies
  the immediate and long-term open problems that need to be addressed in ad hoc teamwork.'
