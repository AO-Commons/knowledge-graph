title: 'Human Oversight Is Not Enough: Rethinking Accountability in AI-Assisted Clinical Decision-Making'
abstract: Governance of artificial intelligence (AI) in clinical care often places clinicians
  between AI outputs and care decisions, yet a human signature can coexist with weak practical
  control. This Perspective asks why participation may fail to produce accountable oversight,
  how duties should be distributed, and which institutional conditions make review meaningful
  and correctable. Drawing on human-factors research, sociotechnical governance, public-accountability
  theory, and recent oversight proposals, we argue that nominal involvement cannot establish
  accountability when clinicians lack relevant information, time, authority, or workable review
  routes. We define Accountable Human Oversight (AHO) as a normative institutional arrangement
  linking task-specific human review to capability, authority, traceability, and redress.
  These conditions overlap with prior frameworks, including a 2026 model. AHO’s narrower proposed
  contribution is to connect them to actor–forum answerability and accessible clinical reconsideration,
  rather than to claim new oversight dimensions. We outline risk-proportionate governance
  that assigns review ownership, evidence, triggers, and corrective actions across developers
  and model suppliers, healthcare institutions, clinicians, and regulators, while reserving
  case-level review for settings in which it can add value. AHO has not been empirically evaluated
  and is not evidence of improved patient outcomes. Future research should examine its feasibility,
  workload, equity, and effects.
