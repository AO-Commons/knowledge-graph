title: Holistic Evaluation of Language Models
abstract: 'Language models (LMs) like GPT-3, PaLM, and ChatGPT are the foundation for almost
  all major language technologies, but their capabilities, limitations, and risks are not
  well understood. We present Holistic Evaluation of Language Models (HELM) to improve the
  transparency of LMs. LMs can serve many purposes and their behavior should satisfy many
  desiderata. To navigate the vast space of potential scenarios and metrics, we taxonomize
  the space and select representative subsets. We evaluate models on 16 core scenarios and
  7 metrics, exposing important trade-offs. We supplement our core evaluation with seven targeted
  evaluations to deeply analyze specific aspects (including world knowledge, reasoning, regurgitation
  of copyrighted content, and generation of disinformation). We benchmark 30 LMs, from OpenAI,
  Microsoft, Google, Meta, Cohere, AI21 Labs, and others. Prior to HELM, models were evaluated
  on just 17.9% of the core HELM scenarios, with some prominent models not sharing a single
  scenario in common. We improve this to 96.0%: all 30 models are now benchmarked under the
  same standardized conditions. Our evaluation surfaces 25 top-level findings. For full transparency,
  we release all raw model prompts and completions publicly. HELM is a living benchmark for
  the community, continuously updated with new scenarios, metrics, and models https://crfm.stanford.edu/helm/latest/.'
