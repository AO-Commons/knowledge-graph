id: resource:arxiv:2407.01502
resource_type: preprint
title: AI Agents That Matter
abstract: AI agents are an exciting new research direction, and agent development is driven
  by benchmarks. Our analysis of current agent benchmarks and evaluation practices reveals
  several shortcomings that hinder their usefulness in real-world applications. First, there
  is a narrow focus on accuracy without attention to other metrics. As a result, SOTA agents
  are needlessly complex and costly, and the community has reached mistaken conclusions about
  the sources of accuracy gains. Our focus on cost in addition to accuracy motivates the new
  goal of jointly optimizing the two metrics. We design and implement one such optimization,
  showing its potential to greatly reduce cost while maintaining accuracy. Second, the benchmarking
  needs of model and downstream developers have been conflated, making it hard to identify
  which agent would be best suited for a particular application. Third, many agent benchmarks
  have inadequate holdout sets, and sometimes none at all. This has led to agents that are
  fragile because they take shortcuts and overfit to the benchmark in various ways. We prescribe
  a principled framework for avoiding overfitting. Finally, there is a lack of standardization
  in evaluation practices, leading to a pervasive lack of reproducibility. We hope that the
  steps we introduce for addressing these shortcomings will spur the development of agents
  that are useful in the real world and not just accurate on benchmarks.
