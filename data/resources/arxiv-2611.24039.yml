title: A Capability Framework for Evaluating Agentic AI Platforms in Regulated Enterprises
abstract: 'Agentic AI platforms-systems in which LLM agents plan, invoke tools, retain memory
  and coordinate to change the state of enterprise systems-are being procured faster than
  they can be measured. Public agent benchmarks score models in fixed harnesses; enterprises
  buy integrated platforms whose orchestration, memory, governance and tooling layers dominate
  outcomes, and they buy them largely on the strength of vendor demonstrations. We report
  an industrial evaluation programme ("bakeoff") run by the innovation laboratory of a global
  bank in which ten platforms-spanning open-source frameworks, proprietary products and hyperscaler
  ecosystems-were assessed by a cross-functional panel on nine capability dimensions across
  three financial-services workloads: counterparty credit risk, retrieval-augmented generation
  and process automation. Scores separate the field into three tiers that are stable under
  alternative weightings, and surface workload-specific strengths that aggregates hide. A
  secondary analysis, however, finds Cronbach''s alpha = 0.98 across nominally distinct dimensions
  and rank correlations >= 0.93 with the total for eight of nine: a halo effect indicating
  that demonstration-based scoring measures presentation as much as capability. From these
  lessons we propose a gate-then-score evaluation protocol with four layers (capability, execution
  reliability, governance gates, business value), trace-level reliability metrics estimated
  over repeated runs, an autonomy-readiness scale and a reproducibility protocol. We state
  precisely what the present evidence supports, and what a controlled harness must add to
  turn enterprise platform evaluation from structured judgement into measurement.'
