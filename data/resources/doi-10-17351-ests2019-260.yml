title: 'Moral Crumple Zones: Cautionary Tales in Human-Robot Interaction'
abstract: As debates about the policy and ethical implications of AI systems grow, it will
  be increasingly important to accurately locate who is responsible when agency is distributed
  in a system and control over an action is mediated through time and space. Analyzing several
  high-profile accidents involving complex and automated socio-technical systems and the media
  coverage that surrounded them, I introduce the concept of a moral crumple zone to describe
  how responsibility for an action may be misattributed to a human actor who had limited control
  over the behavior of an automated or autonomous system. Just as the crumple zone in a car
  is designed to absorb the force of impact in a crash, the human in a highly complex and
  automated system may become simply a component—accidentally or intentionally—that bears
  the brunt of the moral and legal responsibilities when the overall system malfunctions.
  While the crumple zone in a car is meant to protect the human driver, the moral crumple
  zone protects the integrity of the technological system, at the expense of the nearest human
  operator. The concept is both a challenge to and an opportunity for the design and regulation
  of human-robot systems. At stake in articulating moral crumple zones is not only the misattribution
  of responsibility but also the ways in which new forms of consumer and worker harm may develop
  in new complex, automated, or purported autonomous technologies.
