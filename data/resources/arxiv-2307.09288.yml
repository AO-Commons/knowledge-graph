source_provenance: 'admitted automatically at generation 1 by citation expansion: cited by
  3 records already held, which is at or above the threshold of 2 for this generation. Connected
  records: Can Large Language Model Agents Simulate Human Trust Behavio; Generative agent-based
  modeling with actions grounded in phy; Multi-Agent Collaboration Mechanisms: A Survey of
  LLMs. Scope scan by claude-opus-5: No exclusion-register line applies; this is agent-specific
  behavioral evidence, not human collective decision-making. But it is a single-model benchmark
  evaluation rather than a study of an organization where agents hold authority, so it belongs
  alongside Melting Pot as an evaluation-suite pointer in section 15 rather than as a core
  record. What changes because agents hold authority: It supplies evidence on whether an agent
  granted operational authority will actually exercise a safety veto against an authoritative
  human order over long context — showing the dominant failure is not sycophancy but producing
  no interpretable verdict at all, which argues that delegation designs need explicit refusal
  channels and null-output detection rather than only anti-sycophancy safeguards. Unreviewed,
  like everything that has not been through the review queue — and machine-admitted as well
  as machine-resolved, so the scope judgment here is a model''s until a person confirms it.'
