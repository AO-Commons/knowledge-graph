  This is squarely the hybrid human-AI case the deliberative-democracy line explicitly admits:
  the hypothesis is that the machine''s speed and fluency change the rate of premature closure,
  so removing the machine does not leave the finding intact. It is about designing verification
  and accountability for machine-generated operational status rather than about clinical-trial
  practice that would be the same without AI. What changes because agents hold authority:
  It names and operationalizes a failure mode — status assertions that are faithful to their
  source but false about the world — that arises specifically when a generative agent produces
  the closure-ready attestation an organization then acts on, and proposes evidence-based
