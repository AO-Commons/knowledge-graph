title: The reply is ready. Is the site? False operational closure in AI-assisted clinical
  trial workflows (Preprint)
abstract: UNSTRUCTURED Generative artificial intelligence (AI) can faithfully reproduce a
  status that no longer reflects the operational state of a clinical trial. A reply confirming
  that a site is "ready" can be accurate about its source and wrong about the world. We define
  false operational closure as the adoption of a completion or readiness status when the evidence
  required to support it is absent or no longer current. Unlike model error or automation
  bias, it is defined at the level of the workflow and can be identified without inferring
  why anyone accepted the status. The key distinction is between verifying a document and
  verifying the state it represents. The failure mode is not new, but we hypothesize that
  generative AI may increase its frequency by making closure-ready messages instant and fluent
  while the evidence behind them still takes hours or days, and while that evidence remains
  scattered across systems the tool cannot see. We propose evidence-based closure for statuses
  that bear on critical-to-quality factors and outline observational and experimental tests
  of the construct.
