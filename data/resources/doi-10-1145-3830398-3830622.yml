title: 'Prism-UX: Turning Evaluative Divergence into Traceable Design Evidence for LLM-Based
  Process-Level UX Evaluation'
abstract: Generative AI is increasingly being integrated into interactive workflows, introducing
  new challenges for UX evaluation because user experience is becoming more context-dependent
  and more closely tied to process-level moments such as waiting, flicker, uncertainty, intermediate
  artifacts, and loss of control. However, existing AI-assisted evaluation methods often compress
  such process-level differences into a single decontextualized conclusion. Interviews with
  10 practitioners revealed that reviewers often struggle to cite specific moments in an interaction,
  compare interpretations across stakeholders, or trace their judgments back to observable
  facts. We refer to this loss of perspective-specific evaluative distinctions as insight
  collapse. To address this problem, we propose Prism-UX, a traceable review system for short,
  visually observable UI workflows involving GenAI features. Prism-UX first transforms interaction
  screen recordings into citable storyboard evidence through a frame-difference algorithm,
  then supports side-by-side evaluation from configurable evaluative viewpoints over shared
  evidence, and finally applies a structured reasoning protocol that anchors review judgments
  in explicit Fact IDs. Through a technical ablation study and expert evaluation, Prism-UX
  reduced the logical conflict rate by 84%, increased grounding completeness from 0.38 to
  0.82, and was rated more useful than automated baselines for trade-off inspection, discussion
  support, and decision confidence. The results suggest that preserving evidence-grounded
  evaluative disagreement, rather than forcing convergence, can support more traceable and
  disagreement-aware design review.
