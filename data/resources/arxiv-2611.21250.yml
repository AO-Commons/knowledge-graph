title: 'Stream of Belief: Eliciting Collective Intelligence through Latent Belief Dynamics'
abstract: In this work, we view multi-agent reasoning as a process of seeking a collective
  equilibrium of implicit belief dynamics and introduce Stream of Belief (SoB), where agents
  maintain continuous latent beliefs and iteratively refine them through communication and
  reflection. Our method seeks a collective belief state of a multi-agent system where further
  communication induces no meaningful information propagation. Through extensive experiments,
  we demonstrate the generalization of SoB across tasks and model families. More Broadly,
  our results suggest a new perspective on scaling multi-agent reasoning from belief dynamics.
