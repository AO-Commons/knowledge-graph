  Scope scan by claude-opus-5: This is directly about overseeing and holding accountable an
  agent exercising operational authority over sensitive data access, and it supplies a concrete
  control architecture (boundary levels, gates, audit logs) plus evidence that user override
  frames defeat policy. No exclusion-register line applies; it is not general privacy regulation
  but a finding about novel exposure created by agent action, the carve-out at 12.6.3. What
  changes because agents hold authority: It shows that when an agent holds autonomous tool-invocation
  authority, output-level review cannot certify compliance — accountability requires pre-execution
  necessity gates, explicit policy boundaries, and access-log audits of what the agent reached
  for, not just what it said. Unreviewed, like everything that has not been through the review
