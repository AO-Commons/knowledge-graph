abstract: 'Abstract We introduce Artificial Organisational Intelligence (AOI): the capacity
  for organisations to make their knowledge (including routines, practices, rules, boundaries,
  and tacit know‐how) legible and governable. AOI is not about replacing organisations with
  AI, but about enabling them to talk to themselves and to each other through regulated feedback
  loops. Our collaborative project with BlockScience and Metagov develops Knowledge Organisation
  Infrastructure (KOI), a protocol for stitching together disparate systems and practices
  without homogenisation, thereby allowing organisations to embed rules, permissions, and
  context into machine‐readable forms. We describe how our ethnographic practice both informs
  and is transformed by this work: from observing hidden practices to actively building the
  loops that make organisational knowledge accessible and computable.'
