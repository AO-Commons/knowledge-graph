title: 'Designing Human-Agent Collaborations: Commitment, responsiveness, and support'
abstract: With the advancements in AI, agents (i.e., smart products, robots, software agents)
  are increasingly capable of working closely together with humans in a variety of ways while
  benefiting from each other. These human-agent collaborations have gained growing attention
  in the HCI community; however, the field lacks clear guidelines on how to design the agents’
  behaviors in collaborations. In this paper, the qualities that are relevant for designers
  to create robust and pleasant human-agent collaborations were investigated. Bratman's Shared
  Cooperative Activity framework was used to identify the core characteristics of collaborations
  and survey the most important issues in the design of human-agent collaborations, namely
  code-of-conduct, task delegation, autonomy and control, intelligibility, common ground,
  offering help and requesting help. The aim of this work is to add structure to this growing
  and important facet of HCI research and operationalize the concept of human-agent collaboration
  with concrete design considerations.
