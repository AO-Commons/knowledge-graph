title: Safeguarding LLM Agents from Misalignment through Provenance Analysis
abstract: As LLM agents gain increasing access to powerful tools, ensuring that their actions
  align with the user’s intent becomes critical. When an agent’s proposed action deviates
  from that intent—a phenomenon called misalignment— it may cause harm that is difficult to
  undo. Existing runtime guardrails rely on an LLM-as-a-judge paradigm that lacks a systematic
  framework for reasoning about alignment, often producing inconsistent or difficult-to-audit
  judgments. Motivated by provenance analysis, we propose a conceptual framework that formalizes
  misalignment detection as determining whether a proposed tool call is supported by traceable
  evidence in the agent’s context. Based on this framework, we build ProvenanceGuard, a multi-stage
  pipeline that analyzes the agent’s action for three types of misalignment before its execution
  and only allows aligned actions. We evaluated ProvenanceGuard on AgentSafetyBench and WorkBench,
  across 11 backbone LLMs. Compared to the LLM-as-a-judge baseline, ProvenanceGuard reduces
  error rate on misaligned traces from 44.3
