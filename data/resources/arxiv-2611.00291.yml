  of Advanced AI Assistants. Scope scan by claude-opus-5: This is squarely about machine agents
  acting with delegated authority on a principal''s behalf, and the failure taxonomy across
  autonomy levels is directly actionable for designing oversight and accountability in agentic
  organizations. No exclusion-register line applies; the hybrid human-AI authority reading
  settled 2026-09-10 reinforces inclusion, and the finding that incident records and agent
