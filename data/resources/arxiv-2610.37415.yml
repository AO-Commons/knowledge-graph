  Scope scan by claude-opus-5: This is agent-specific security for A2A delegated action —
  remove the machine agent and the finding vanishes, so no exclusion-register line applies.
  The memory-valence result (success memories raise breach rates) is an operational and oversight
  requirement for any organization where agents act with real authority, making it in-scope
  rather than a section 15 pointer. What changes because agents hold authority: It shows that
  an agent''s effective trust boundary is set jointly by inter-agent message labeling, envelope
  authenticity, frontend permissions, and prior memory, so an organization delegating authority
  to agents must govern context assembly and memory retention as control surfaces, not just
  the inbound channel. Unreviewed, like everything that has not been through the review queue
  — and machine-admitted as well as machine-resolved, so the scope judgment here is a model''s
  until a person confirms it.'
