source_provenance: 'admitted automatically at generation 1 by citation expansion: cited by
  5 records already held, which is at or above the threshold of 2 for this generation. Citing
  records: AI Agents vs. Agentic AI: A Conceptual taxonomy, application; Intelligent AI Delegation;
  Lessons from complex systems science for AI governance; Levels of Autonomy for AI Agents;
  Multi-Agent Collaboration Mechanisms: A Survey of LLMs. Scope scan by claude-opus-5: The
  paper is about the properties that make algorithmic systems agentic and the accountability
  consequences of that agency, which is squarely the scope test rather than any excluded category
  of human collective decision-making. No exclusion-register line applies; it is FATE-adjacent
  but explicitly agent-specific, and it underpins the autonomy-level and delegation work already
  in the library. What changes because agents hold authority: It supplies a graded characterization
  of machine agency (underspecification, directness of impact, goal-directedness, long-term
  planning) and an anticipatory harm framework, letting designers calibrate how much oversight
  and residual human accountability an agent''s delegated authority requires. Unreviewed,
  like everything that has not been through the review queue — and machine-admitted as well
  as machine-resolved, so the scope judgement here is a model''s until a person confirms it.'
