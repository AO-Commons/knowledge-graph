id: resource:platform:kellybench
resource_type: evaluation-suite
title: KellyBench
description: 'A long-horizon benchmark in which an agent manages a bankroll across a full
  football season, betting matchday by matchday against real historical market odds with access
  to lineups, advanced statistics and past prices. An episode runs from August to May and
  takes 500 to 1,000 tool calls. The reported result is that no model makes a return on average
  across five seeds: models front-load their analysis at the start of the season and fail
  to adapt as the world changes. Available as an open-access API endpoint on OpenReward.'
