source_provenance: 'Admitted by hand on 2026-11-06, on the same shelf as Vending-Bench: a
  single agent holding a budget and making consequential decisions over a long horizon, scored
  on what it did with the money rather than on an answer. What it measures — whether an agent
  keeps adapting once the plan is set — is the capability an organisation delegating a standing
  budget is relying on. The paper behind it is held separately as resource:arxiv:2604.27865,
  and the date here is that paper''s rather than the release page''s, which states none. Taxonomy
  tags are a first pass assigned by hand and unreviewed. Added by hand on 2026-11-06 rather
  than through the citation scan: General Reasoning publishes to its own site rather than
  to arXiv, so nothing in the corpus cites it and the scan cannot reach it.'
