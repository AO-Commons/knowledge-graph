resource_type: preprint
title: 'ORBIT: A Framework for Multi-Agent Safety and Security Evaluations'
abstract: 'Multi-agent LLM systems are increasingly deployed for complex, long-horizon tasks
  or emerge as a natural consequence of agents interacting in the wild. Yet they give rise
  to significant safety and security risks: the flexible protocols that enable task generalization
  also expose novel threats, from cascading prompt injection to inter-agent collusion. Progress
  in defending against these threats has been slowed by a lack of shared empirical infrastructure,
  which forces bespoke environment development for every new defense and makes standardized
  comparison impossible. Existing evaluations address isolated threat models or single-agent
  settings, but none jointly vary attack, defense, and architecture across realistic multi-agent
  environments. To address this gap, we introduce ORBIT, a configurable evaluation framework
  for empirical multi-agent safety and security research, built on UK AISI''s Inspect. ORBIT
  lets researchers configure communication topologies, memory, scheduling, and agent roles.
  It supports four threat types and four defense strategies, as well as non-adversarial failures,
  with a benchmark suite spanning five scenario families covering browser use, computer use,
  agentic coding, customer service, and cooperative allocation. Our central finding is a gap
  in defense transferability across threats: per-action defenses that cut a compromised agent''s
  attack success by 60 points on multi-issue coding give no measurable protection against
  colluding agents, and none of the defenses we tested generalized over all attacks tested.
  We further demonstrate security-performance tradeoffs and interactions between architecture
  and defense effectiveness. We make ORBIT available open-source at https://github.com/wlanderson0/orbit.'
