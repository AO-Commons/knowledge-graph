id: resource:arxiv:2308.08155
resource_type: preprint
title: AIKernel Semantic DSL Compiler and Deterministic Agent Execution Architecture
abstract: AutoGen is an open-source framework that allows developers to build LLM applications
  via multiple agents that can converse with each other to accomplish tasks. AutoGen agents
  are customizable, conversable, and can operate in various modes that employ combinations
  of LLMs, human inputs, and tools. Using AutoGen, developers can also flexibly define agent
  interaction behaviors. Both natural language and computer code can be used to program flexible
  conversation patterns for different applications. AutoGen serves as a generic infrastructure
  to build diverse applications of various complexities and LLM capacities. Empirical studies
  demonstrate the effectiveness of the framework in many example applications, with domains
  ranging from mathematics, coding, question answering, operations research, online decision-making,
  entertainment, etc.
