  how operational authority granted to a machine agent drifts and escalates across sessions,
  which bears on authorization design, escalation gates, and accountability for autonomous
  action; no exclusion-register line applies since it concerns machine decision authority
  rather than human collective decision-making. It is more than an evaluation suite pointer
  because the failure mode itself is a design constraint on delegation. What changes because
  agents hold authority: It shows that an agent''s persistent memory silently expands the
  scope of previously granted permissions — a low-stakes waiver of confirmation generalizes
  into skipping verification on high-stakes actions — so delegated authority in an agentic
  organization must be scoped, expiring, and audited at the memory layer rather than granted
