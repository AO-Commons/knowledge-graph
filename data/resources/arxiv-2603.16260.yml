id: resource:arxiv:2603.16260
resource_type: preprint
title: 'Human/AI Collective Intelligence for Deliberative Democracy: A Human-Centred Design
  Approach'
abstract: This chapter introduces the concept of Collective Intelligence for Deliberative
  Democracy (CI4DD). We propose that the use of computational tools, specifically artificial
  intelligence to advance deliberative democracy, is an instantiation of a broader class of
  human-computer system designed to augment collective intelligence. Further, we argue for
  a fundamentally human-centred design approach to orchestrate how stakeholders can contribute
  meaningfully to shaping the artifacts and processes needed to create trustworthy DD processes.
  We first contextualise the key concepts of CI and the role of AI within it. We then detail
  our co-design methodology for identifying key challenges, refining user scenarios, and deriving
  technical implications. Two exemplar cases illustrate how user requirements from civic organisations
  were implemented with AI support and piloted in authentic contexts.
