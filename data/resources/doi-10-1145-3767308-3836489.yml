title: 'HyperBalance: Hypergraph-based Topology Optimization for Reliable Multi-Agent Communication'
abstract: 'Communication topology plays a central role in the effectiveness of large language
  model (LLM)-based multi-agent systems. Recent hypergraph-based methods improve group coordination
  by connecting multiple agents within unified hyperedges, enabling direct one-step synchronization.
  However, they largely assume that stronger synchronization is uniformly beneficial. This
  assumption overlooks a key reliability dilemma: the same mechanism that accelerates useful
  insight sharing can also accelerate the spread of erroneous outputs. To address this issue,
  we conduct a causal analysis of hypergraph communication and show that enlarging hyperedges
  amplifies both insight propagation and error propagation, but the latter grows faster, causing
  performance to peak at intermediate collaboration intensity. Motivated by this observation,
  we propose HyperBalance, a dual-view hypergraph topology learning framework that treats
  topology design as collaboration-intensity allocation. Specifically, HyperBalance learns
  how strongly each task and agent pair should favor cautious communication for error containment
  or intensive collaboration for insight sharing, and instantiates this balance as a task-specific
  hypergraph topology. Experiments on six benchmarks show that HyperBalance is: (1) high-performing,
  achieving 91.46% average accuracy and outperforming the strongest topology baseline by 3.56%;
  (2) communication-efficient, substantially reducing communication overhead through more
  economical collaboration structures; and (3) broadly effective, yielding consistent improvements
  across reasoning, mathematical reasoning, real-world agentic tasks, and different language
  models.'
