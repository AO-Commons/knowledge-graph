id: resource:tool:kikubot
resource_type: code-tool
title: Kikubot
description: An email-driven multi-agent framework in Go where each agent is an autonomous inbox
  and agents coordinate by emailing one another. Notable for shipping sender allowlists, container
  isolation and watchdog timers as documented features rather than deployment advice.
