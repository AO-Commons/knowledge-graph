tool:
  agent_model: Each agent is an autonomous mailbox; a coordinator agent delegates to specialists,
    and agents collaborate by emailing each other. They act on the outside world through IMAP/SMTP,
    Salesforce, Buffer, WordPress, Box, Xero, web search and bash execution, plus local or remote
    MCP servers. That is an unusually wide external surface for a small project — an agent here
    can email, post, update a CRM and touch accounting records.
  human_controls: 'The strongest control is on who may address an agent at all: whitelist and
    blacklist modes restrict senders by domain or address, which bounds the instruction surface
    rather than the action surface. Integrations use scoped API keys. Agents run in containers
    — "no risk of AI agents running on user machines" — and each has an isolated knowledge base.
    Watchdog timers stop stuck recurring tasks, and snoozing tools are stripped during scheduled
    replays. No approval gate before an agent sends outbound mail or writes to a connected system
    is documented, and no spend control.'
