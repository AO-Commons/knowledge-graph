tool:
  agent_model: Agents hold specialised roles with defined goals and are described as having "true
    autonomy and agency… through role-based collaboration", with "autonomous decision-making between
    agents" and "dynamic task delegation". They call external tools, APIs and databases. Delegation
    to other agents is governed by `allow_delegation`, which defaults to False — an agent cannot
    hand work to another unless it is switched on.
  human_controls: Bounds are numeric and per-agent rather than policy-shaped. `max_iter` (default
    20) caps reasoning cycles before the agent must give its best answer; `max_retry_limit` (default
    2) caps retries; `max_rpm` and `max_execution_time` default to unlimited, so rate and duration
    are unbounded unless set. Code execution is off by default and `code_execution_mode` defaults
    to "safe" (Docker) — both now deprecated, with sandboxing pushed to E2B or Modal. At the task
    level `human_input` blocks completion pending human review of the final answer, and guardrails
    validate output either by a Python function returning (bool, Any) or by an LLM judging a natural-language
    criterion; a failed guardrail returns the error to the agent, which retries up to `guardrail_max_retries`
    (default 3). Notably the retry loop is agent-to-agent with no human in it — human_input is
    the only blocking human gate, and there is no documented spend cap or kill switch.
