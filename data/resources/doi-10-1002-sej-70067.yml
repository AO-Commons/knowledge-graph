  line applies; it is not voting mechanism design, token design, or human collective decision
  theory. What changes because agents hold authority: It gives a delegation threshold (minimum
  viable intelligence) that bundles reliability, net value after oversight and correction
  costs, and acceptable residual risk with clear accountability, and argues that trimming
  evaluation and oversight to scale degrades the agent''s capability loop — making oversight
  a capability investment rather than a drag on an agent-authority organization. Unreviewed,
