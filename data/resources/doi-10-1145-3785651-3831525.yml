title: Hidden Profile Decision Making in Multi-Agent LLM Groups
abstract: 'The hidden profile paradigm is a foundational tool of CSCW research on computer-mediated
  group decision making: a group can identify the collectively optimal option only if its
  members surface their uniquely held information, and asynchronous communication is known
  to improve that pooling in human groups. As multi-agent LLM systems take on group decision-support
  roles, it is unclear whether the same channel-level interventions improve their performance.
  We replicate the hidden profile paradigm with groups of three LLM agents from four families
  (Kimi K2, GPT-OSS 120B, Gemini 2.5 Flash, Llama 4 Scout 17B) in a two-by-two design crossing
  communication mode (synchronous, asynchronous) with information distribution (shared, hidden).
  Across 219 valid sessions, only one model-by-mode cell exceeds the three-candidate chance
  baseline of 33 percent: Kimi K2 under asynchronous communication, at 87 percent correct
  (Fisher’s exact, two-sided p equals 0.002), an early-stage result from 15 sessions that
  awaits larger-n replication; two other models share private information at rates above 75
  percent but never aggregate it into the correct decision. In this task and these model families,
  information sharing and information integration appear to be dissociated capabilities, and
  we develop the implications for CSCW systems that scaffold AI-mediated distributed decision
  making.'
