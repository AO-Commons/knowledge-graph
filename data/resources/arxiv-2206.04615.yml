  records: Discovering Language Model Behaviors with Model-Written Eval; Do the Rewards Justify
  the Means? Measuring Trade-Offs Betwe; Encouraging Divergent Thinking in Large Language
  Models thro; Solipsistic Superintelligence is Unlikely to be Cooperative; Using Large Language
  Models to Simulate Multiple Humans and . Scope scan by claude-opus-5: BIG-bench is a general
  language-model evaluation suite, not a study of agents holding authority, so it fails the
  scope test on its own terms; but it is the canonical benchmark precedent that library items
  such as Model-Written Evaluations and MACHIAVELLI build directly upon, making it exactly
  the kind of load-bearing evaluation infrastructure Section 15 holds as a pointer. No exclusion-register
  line applies; it is held as borrowed background rather than ingested as in-scope. What changes
  because agents hold authority: It supplies the capability-measurement and scale-extrapolation
  evidence base — including unpredictable ''breakthrough'' capabilities and poor calibration
  — that any decision about how much operational authority to delegate to a model must rest
  on, though it says nothing about organizations itself. Unreviewed, like everything that
  has not been through the review queue — and machine-admitted as well as machine-resolved,
  so the scope judgment here is a model''s until a person confirms it.'
