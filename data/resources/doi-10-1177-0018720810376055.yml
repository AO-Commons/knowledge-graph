source_provenance: 'Added by hand on 2026-11-03, from the refusal ledger rather than the citation scan.
  Cited by 10 held records and refused once by the scope scan, which read it as human-factors research
  rather than a study of organizations where agents hold authority. That reading is right about the paper
  and wrong about the shelf: section 15 holds exactly the adjacent literature the field borrows from,
  and the corpus already holds two other Parasuraman papers on the same axis — Humans and Automation (1997)
  and the levels-of-automation model (2000). This is the third, and the one that says what happens to
  a supervisor''s attention over time. Not read: no full text path, and section 15 is pointed at rather
  than ingested. Venue: Human Factors, 52(3).'
