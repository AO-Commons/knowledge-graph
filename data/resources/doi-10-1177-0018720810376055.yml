title: 'Complacency and Bias in Human Use of Automation: An Attentional Integration'
description: Why a person supervising an automated system stops checking it, and what that does to the
  errors they catch. Complacency and automation bias are treated as two faces of one attentional process
  rather than as separate failings, which is the account an oversight regime for agents is implicitly
  betting against.
