tool:
  agent_model: Agents are managed workers arranged in an org chart — described as employees
    that wake on scheduled "heartbeats", execute assigned work, and go dormant between runs.
    They do not set direction or hold budget authority; the documentation places humans in
    the role of the board of directors.
  human_controls: Human approval required before an agent is hired and before an agent executes
    a strategy. Per-agent and per-project budgets that auto-pause execution when limits are
    hit. Any agent can be paused, resumed, overridden, reassigned, or terminated. Full run
    transcripts and per-agent cost tracking.
