title: Trust in multi-agent systems
abstract: Trust is a fundamental concern in large-scale open distributed systems. It lies
  at the core of all interactions between the entities that have to operate in such uncertain
  and constantly changing environments. Given this complexity, these components, and the ensuing
  system, are increasingly being conceptualised, designed, and built using agent-based techniques
  and, to this end, this paper examines the specific role of trust in multi-agent systems.
  In particular, we survey the state of the art and provide an account of the main directions
  along which research efforts are being focused. In so doing, we critically evaluate the
  relative strengths and weaknesses of the main models that have been proposed and show how,
  fundamentally, they all seek to minimise the uncertainty in interactions. Finally, we outline
  the areas that require further research in order to develop a comprehensive treatment of
  trust in complex computational settings.
