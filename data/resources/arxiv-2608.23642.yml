title: AI Agents Push Humans Out of the Loop
abstract: 'AI agents pose significant risks as they are granted increasing autonomy. A commonly
  proposed solution is human oversight and keeping a ''''human in the loop'''', but this is
  not a simple solution: Not only do current approaches to AI agent design impede effective
  human oversight, but the cognitive capacities required for it are also themselves degraded
  by extended use of AI systems. This position paper argues that current approaches to the
  development and deployment of AI agent systems do not support effective human oversight
  -- they contribute to its degradation. To address this, a top priority in the advancement
  of AI agents should be supporting the situated goals and cognitive requirements of effective
  human oversight, treating the human needs of overseers at the same level of importance as
  AI agent capability. To put this idea into practice, we connect work on automation and human-computer
  interaction to AI agent processes, outlining design-level affordances and organizational
  protocols that (1) support overseers in exercising critical judgement and (2) counteract
  the skill atrophy that arises from extended use of automation. We urge developers and deployers
  to adopt these or similar approaches. Without explicit support for the cognitive demands
  of effective human-agent interaction, AI agent systems will continue to passively incentivize
  the degradation of the very human skills they rely on.'
