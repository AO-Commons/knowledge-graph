tool:
  agent_model: 'LangGraph itself grants no domain authority; it is a "low-level orchestration
    framework for building, managing, and deploying long-running, stateful agents" in which
    the developer wires nodes into a graph and the model decides the path. Its own docs are
    explicit that what runs can be consequential: interrupts exist to "pause before executing
    critical actions (API calls, database changes, financial transactions)", and the worked
    examples are an agent that calls a `send_email` tool on its own initiative ("The LLM can
    call the tool naturally", `agent_node`: "LLM may decide to call the tool") and an approval
    graph whose payload is `{"action_details": "Transfer $500"}`. Absent an explicitly placed
    `interrupt()`, execution is continuous and unattended — "durable execution" means agents
    "persist through failures and can run for extended periods, automatically resuming from
    exactly where they left off." Memory is both short-term working state and "long-term persistent
    memory across sessions", and graphs can fan out to parallel branches and subgraphs.'
  human_controls: 'The ships-in-the-box control is the `interrupt()` function plus the persistence
    layer: it "pause[s] graph execution at specific points and wait[s] for external input
    before continuing", checkpointing "the exact graph state" and waiting **indefinitely**
    until someone resumes with `Command(resume=...)`. This is opt-in code, not a default:
    the developer must call `interrupt()` at each point they want gated, and interrupts are
    "dynamic: they can be placed anywhere in your code and can be conditional based on your
    application logic." Documented patterns are approve/reject (`Command(resume=True)` routes
    to `proceed`, `False` to `cancel`), review-and-edit of state before continuing, input
    validation loops, and interrupts inside tool bodies where "the resume value can override
    inputs before executing" (e.g. the human can rewrite the email''s `to`/`subject`/`body`).
    Parallel pending interrupts must be resumed by mapping each `interrupt.id` to its resume
    value. Separately there are static breakpoints (`interrupt_before` / `interrupt_after`
    at compile or run time, settable in LangSmith Studio''s UI), but the docs say these "are
    not recommended for human-in-the-loop workflows" — they are for debugging. Prerequisites:
    a checkpointer ("use a durable checkpointer in production") and a `thread_id`, which is
    "effectively your persistent cursor." Observability is a separate product: LangSmith is
    recommended for tracing "execution paths, capture state transitions, and... detailed runtime
    metrics", plus time travel to replay/fork past executions. The docs also impose correctness
    discipline on gating code — no bare try/except around `interrupt()` (it pauses by raising),
    no conditionally skipped or non-deterministically looped interrupts (resume matching is
    "strictly index-based"), and side effects before an interrupt must be idempotent because
    the node re-runs from the top on every resume.'
