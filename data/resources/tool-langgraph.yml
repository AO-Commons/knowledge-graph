source_provenance: 'profiled by claude-opus-5 from the tool''s own documentation on 2026-09-30,
  promoted from the awesome-builder-tools mirror (Framework Zero, MIT). Every claim about
  what agents may do and what constrains them cites the document it came from. Not documented:
  Who is allowed to approve is entirely absent: possession of the `thread_id` is the only
  thing shown to be needed to resume a paused run, and no authentication, authorization, role
  or separation-of-duties for the resumer is documented here. There are no budgets, spend
  caps, per-tool or per-recipient allowlists, scopes, quotas, rate limits, or kill switch
  in these documents. Interrupts "wait indefinitely" — there is no veto window, timeout, expiry,
  escalation or auto-deny/auto-proceed semantics documented, and nothing about what happens
  to a pending approval if the approver never answers. Audit logging is not a framework feature:
  the only audit log in the docs is `db.create_audit_log(...)` written by the application
  author as an example side effect, and the scope, retention, tamper-resistance and contents
  of LangSmith traces/checkpoints are not described here. Nothing states whether any tool
  call is gated by default (the documents imply the opposite), and there is no documented
  policy layer, default-deny mode, or way to assert that every sensitive tool is covered by
  an interrupt — coverage is left to code review. Also undocumented in these pages: sandboxing
  or egress control for tool execution, secret/credential handling, multi-party or quorum
  approval, and whether resume values are validated against the original tool schema (the
  `send_email` example lets the human substitute arbitrary arguments). Unreviewed: no person
  has checked this against the source.'
