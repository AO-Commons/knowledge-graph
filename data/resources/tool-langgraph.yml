id: resource:tool:langgraph
resource_type: code-tool
title: LangGraph
description: 'LangGraph is LangChain Inc''s open-source graph orchestration library for long-running
  stateful agents, whose governance-relevant primitive is `interrupt()`: a checkpointed pause
  that suspends a run at a developer-chosen point and waits indefinitely for a human to approve,
  reject, or rewrite the pending action — including the arguments of a tool call. It is interesting
  to an organization designer precisely because the oversight is a library call rather than
  a policy surface: the framework supplies durable pause/resume, state inspection and replay,
  but who may approve, what must be approved, and any budget or allowlist are left for the
  deploying team to build.'
