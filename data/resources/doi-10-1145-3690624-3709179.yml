resource_type: peer-reviewed-paper
title: Benchmarking and Defending against Indirect Prompt Injection Attacks on Large Language
  Models
abstract: 'The integration of large language models (LLMs) with external content has enabled
  applications such as Microsoft Copilot but also introduced vulnerabilities to indirect prompt
  injection attacks. In these attacks, malicious instructions embedded within external content
  can manipulate LLM outputs, causing deviations from user expectations. To address this critical
  yet under-explored issue, we introduce the first benchmark for bindirect prompt injection
  attacks, named BIPIA, to assess the risk of such vulnerabilities. Using BIPIA, we evaluate
  existing LLMs and find them universally vulnerable. Our analysis identifies two key factors
  contributing to their success: LLMs'' inability to distinguish between informational context
  and actionable instructions, and their lack of awareness in avoiding the execution of instructions
  within external content. Based on these findings, we propose two novel defense mechanisms
  -- boundary awareness and explicit reminder -- to address these vulnerabilities in both
  black-box and white-box settings. Extensive experiments demonstrate that our black-box defense
  provides substantial mitigation, while our white-box defense reduces the attack success
  rate to near-zero levels, all while preserving the output quality of LLMs. We hope this
  work inspires further research into securing LLM applications and fostering their safe and
  reliable use. Our code is available at https://github.com/microsoft/BIPIA.'
