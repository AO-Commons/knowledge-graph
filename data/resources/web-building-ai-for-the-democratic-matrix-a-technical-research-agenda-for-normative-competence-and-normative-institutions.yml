abstract: Democracies are messy. They are constituted not just (or even primarily) by rules
  and principles written into laws and constitutions, nor by the formal organizational structure
  of organizations and governments. They are not comprised merely of articulated rights and
  duties, or even values. Democracies function as complex adaptive systems characterized by
  dynamic interactions between multiple independent actors. They are “dancing landscapes”
  as described by Kauffman (1993)—constituted by the concurrent adaptation of numerous independent
  agents responding to and anticipating behavioral patterns of others in their environment.
  Democracies embrace complexity rather than imposing order through authoritarian means, rejecting
  the order achieved by dictators and tyrannical rule in favor of the living order achieved
  by actors who, in theory and in aspiration, are free to make a wide variety of choices (including
  choosing or rejecting leaders, laws, and legal outcomes) without fear of retribution. Democracies
  are performed and experienced, residing in the myriad interactions that make up an ordinary
  life. The institutions of democracy, such as independent courts, do not only function to
