title: 'Building AI for the Democratic Matrix: A Technical Research Agenda for Normative Competence
  and Normative Institutions'
description: A democracy is held up by the everyday choices people make to classify and sanction
  each other's behaviour, so agents acting in economic life bear on whether it holds. Argues
  that such agents need normative competence — reading and anticipating norms at the moment
  of action — and proposes Model Specification Institutions, democratically selected bodies
  that would tell agents what the norms are.
