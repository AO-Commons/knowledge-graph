title: When Does Hallucination Propagate? Reconciling Six Formalizations of Error Spread in
  Multi-Agent LLM Systems
abstract: 'Abstract Multi-agent LLM systems are deployed on the assumption that agents checking
  one another reduce hallucination. Two studies of the same linear topology contradict it
  in opposite directions, and both are right: one measures prevalence, the other detectability,
  and a claim can become rarer and less visible at once. Whether a false claim grows is set
  by two structural variables: how correlated the agents'' errors are, and whether any channel
  supplies evidence independent of them. Topology bounds the number of carriers a chain can
  produce; it says nothing about the other channel. Six formalisms proposed in the past year
  describe this process. Each defines a state space, a transition rule and a measurable quantity;
  none is stated in terms another can absorb. Taking the travelling claim as the unit of analysis,
  we show that the six are projections of one process onto different observables. In a purposive
  sample of 42 papers, 10 of 32 included studies report a propagation-level metric, 9 report
  a verification channel independent of the agents, and 7 report a graph with a recoverable
  out-degree. The two features never co-occur: all nine studies with such a channel report
  attenuation, and both studies that report amplification lack one. One prediction runs against
  design intuition: raising the initial diversity of agents'' answers increases false adoption.
  We specify the experiment that separates a causal reading from an artefact, and a reporting
  standard — carrier set, aggregation loss, out-degree distribution, comparator — under which
  the six become comparable.'
