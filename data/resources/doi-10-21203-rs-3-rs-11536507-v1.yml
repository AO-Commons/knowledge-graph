  This is directly about the reliability of multi-agent LLM systems acting without a human
  in the loop, and its findings (independent channel required; higher initial diversity increases
  false adoption) are actionable design and assurance constraints for organizations delegating
  operational authority to such agents. No exclusion-register line applies; it is agent-specific
  by construction and not human collective decision-making. What changes because agents hold
  authority: It shows that stacking agents to cross-check each other does not by itself contain
  false claims — attenuation depends on having a verification channel whose evidence is independent
  of the agents — so oversight of an agent-run process must be designed around independent
  evidence sources and reported carrier/out-degree metrics rather than around topology or
  agent diversity. Unreviewed, like everything that has not been through the review queue
