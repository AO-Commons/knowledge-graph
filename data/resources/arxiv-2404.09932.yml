id: resource:arxiv:2404.09932
resource_type: preprint
title: Foundational Challenges in Assuring Alignment and Safety of Large Language Models
abstract: 'This work identifies 18 foundational challenges in assuring the alignment and safety
  of large language models (LLMs). These challenges are organized into three different categories:
  scientific understanding of LLMs, development and deployment methods, and sociotechnical
  challenges. Based on the identified challenges, we pose $200+$ concrete research questions.'
