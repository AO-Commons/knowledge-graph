title: 'The algorithmic scapegoat: Accountability evasion and the governance of autonomous
  promise–fulfilment misalignment in agentic AI'
abstract: 'Agentic AI systems increasingly generate customer-facing commitments while shaping
  the operational decisions through which those commitments are fulfilled. When both functions
  converge within a single autonomous system, a governance problem arises that responsible-technology
  scholarship has not named: the capacity to generate commitments may exceed an organisation''s
  verified ability, established rules, or willingness to honour them. Drawing on a multi-platform
  netnographic study of fifteen documented cases (2023–2026), I distinguish nine core cases
  in which AI systems both generate commitments and shape their fulfilment from six adjacent
  cases that fall outside this strict definition. Analysed through the Gioia methodology,
  the corpus yields three mechanisms: autonomous promise generation and the accountability
  vacuum, operational failure cascades, and a trust–data feedback loop. I conceptualise algorithmic
  scapegoating as a post-failure organisational manoeuvre through which responsibility is
  displaced onto the apparent autonomy or opacity of AI. The manoeuvre inverts the moral crumple
  zone and performs a responsibility gap it does not suffer. The empirical record documents
  the escalating branch of the resulting cycle, whereas the recursive trust–data relationship
  and the conditions under which escalation might be contained remain theoretical propositions
  requiring further investigation. Four governance features, comprising scope boundaries,
  verified knowledge, escalation architecture, and metric alignment, delineate the proposed
  conditions of containment; every documented core failure lacked at least one. I develop
  five propositions and consider their implications for AI accountability, responsible technology
  governance, and consumer welfare, and the adjacent cases indicate that the heaviest costs
  fall on those with least opportunity for recourse.'
