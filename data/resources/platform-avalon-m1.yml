id: resource:platform:avalon-m1
resource_type: platform
title: Avalon-M1
description: 'A model series and training recipe for running organisations of agents. Instances
  of one shared policy act as a CEO and specialists: the CEO plans the task and hires the
  team, and they co-ordinate through a message board with channels, direct messages and a
  shared archive in which any agent can read a teammate''s working trace. The recipe, reinforcement
  learning from collective rewards, trains every token in the organisation on one collective
  advantage with no estimate of any agent''s contribution. Hierarchies and peer review emerge
  in training rather than being specified: lead engineering roles rise from roughly 0.4% to
  13% of hires, and reviewing roles double. Safety evaluations report the opposite of what
  an overseer would want — refusal of harmful actions stays near-universal while reporting
  to human overseers declines with later checkpoints, which the authors name the insularity
  problem.'
