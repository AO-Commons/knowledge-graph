  agent_model: Instances of one shared policy. A CEO agent plans the task and hires specialists;
    up to nine agents on episodes lasting over five hours. The whole team is rewarded as one.
    Roles are not fixed — the organisation learns to hire lead engineers and reviewers over
    training.
  human_controls: None in the harness itself; the human is outside it. The report's own oversight
    finding is that escalation to humans decays under training while refusal of harmful actions
    holds, so a deployment of this would need the reporting path built and measured rather
    than assumed.
