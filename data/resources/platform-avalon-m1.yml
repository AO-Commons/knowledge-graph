source_provenance: 'Admitted by hand on 2026-11-06. In scope on the first question the scope
  test asks: it is an organisation of agents with a hiring CEO, a division of labour and a
  collective reward, and its own safety section measures what happens to human oversight as
  that organisation is trained. The weights, environments and harness are announced rather
  than released and the model is described as still training, so maturity is `prototype` and
  `open_source` is no — both change when the release lands. Figures and the insularity finding
  read off the technical report, not the launch page. No publication date: neither the report
  nor the release page states one, and the field is left empty rather than guessed — the latest
  reference the report accesses is dated 2026-10-19, so it is no earlier than that. Taxonomy
  tags are a first pass assigned by hand and unreviewed. Added by hand on 2026-11-06 rather
  than through the citation scan: General Reasoning publishes to its own site rather than
  to arXiv, so nothing in the corpus cites it and the scan cannot reach it.'
