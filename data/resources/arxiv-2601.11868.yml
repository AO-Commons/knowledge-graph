title: 'Terminal-Bench: Benchmarking Agents on Hard, Realistic Tasks in Command Line Interfaces'
abstract: 'AI agents may soon become capable of autonomously completing valuable, long-horizon
  tasks in diverse domains. Current benchmarks either do not measure real-world tasks, or
  are not sufficiently difficult to meaningfully measure frontier models. To this end, we
  present Terminal-Bench 2.0: a carefully curated hard benchmark composed of 89 tasks in computer
  terminal environments inspired by problems from real workflows. Each task features a unique
  environment, human-written solution, and comprehensive tests for verification. We show that
  frontier models and agents score less than 65\% on the benchmark and conduct an error analysis
  to identify areas for model and agent improvement. We publish the dataset and evaluation
  harness to assist developers and researchers in future work at https://www.tbench.ai/ .'
