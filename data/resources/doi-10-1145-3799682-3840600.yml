title: 'BenchGuard: A Calibrated, Adversary-Aware Triage Layer for Reward-Hacking Agentic
  Trajectories'
abstract: 'Agentic AI systems are increasingly evaluated on executable benchmarks, and a now
  well-documented failure mode is reward hacking: agents inspect graders, spoof expected outputs,
  hijack binaries, or extract hidden test inputs. The dominant operational response is to
  monitor every trajectory with a strong LLM judge, but at 0.4–3.8 per 100 trajectories and
  several minutes of latency, judge-everywhere is impractical for the millions of runs produced
  by continuous benchmark development. We present BenchGuard, a strict command-only forensic
  triage layer: TF-IDF word n-grams over agent shell commands feed a class-balanced LinearSVC
  that is recalibrated with Platt scaling and reports prevalence-aware operating points. On
  Terminal Wrench''s 5,984 paired trajectories, BenchGuard reaches ROC-AUC 0.928 [task-grouped
  bootstrap 95% CI 0.918, 0.939] at 50% prefix and TPR 0.70 at 5% FPR. We then run a head-to-head
  LLM judge experiment on the same balanced 100-trajectory sample under three configurations:
  command-only (judge AUC 0.806), full-context with a generic prompt (0.727, DeLong p=0.012
  vs. BenchGuard), and full-context with a rubric-tuned prompt (0.837, p=0.237). BenchGuard
  is point-estimate-best across all three at 0 vs. 0.77–1.50 per 100 trajectories. Two cheap
  baselines (BM25 max-similarity AUC 0.451, a distilled hashed-n-gram MLP AUC 0.931) bracket
  the result: pure lexical similarity is insufficient, but capacity at this scale is also
  not the bottleneck. Three static lexicon-evasion attacks plus an LLM-paraphrase adversary
  that drops token-Jaccard to 0.42 cost only 0.013–0.030 AUC (-9 pp at TPR@5%FPR for the paraphrase);
  adversary-aware retraining recovers the static gap. Platt-recalibrated flag rates on a 34,029-trajectory
  external corpus drop from 13.3% (raw) to 0.4% (Platt p >= 0.99), demonstrating calibration
  transfer. We document a sharp construct-validity boundary: against the realistic union-negative
  class (legitimate solves + no-reward attacks), AUC drops to 0.700 and operating-point precision
  collapses — and we translate this into a three-step deployment recommendation. All code,
  data extracts, judge response logs (scores and verdicts), the LLM paraphrase outputs, and
  calibration models are released as a reproducible artifact.'
