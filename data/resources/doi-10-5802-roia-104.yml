title: 'Système multi-agents génératif : état de l’art et défis'
abstract: Dotés de capacités exceptionnelles pour résoudre une grande variété de tâches complexes,
  les grands modèles de langue (LLMs) ouvrent de nouvelles perspectives pour la conception
  de Systèmes Multi-Agents (SMA) génératifs, capables de s’adapter à des environnements ouverts
  et de simuler des dynamiques sociales complexes. Cet article propose une analyse approfondie
  des LLMs et de leur intégration dans les SMA, en mettant en lumière leur potentiel pour
  surmonter les limites des approches traditionnelles. Les défis que soulève cette intégration
  sont également examinés, notamment le désalignement, la validité, l’explicabilité, la reproductibilité
  et le passage à l’échelle.
