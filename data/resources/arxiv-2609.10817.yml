title: 'Tapes Together Strong: The Co-evolution of Computation and Cooperation'
abstract: 'How does cooperation evolve in complex agentic systems? Prior work in evolutionary game theory
  studies why individuals are incentivized to cooperate by isolating social interactions from the physical
  costs of behavior, while artificial life models traditionally study emergent self-replication without
  formalizing the dilemma between acquiring resources and preserving the shared energy needed to reproduce.
  In contrast, we introduce Autopoietic Game Theory, a computational model where social interactions,
  replication mechanisms, and their associated computational costs are endogenous and simultaneously co-evolving.
  We study these dynamics using a computational substrate of randomly initialized programs in Z80 machine
  code, showing empirically, and motivating with a simplified theoretical model, that embedding a social
  dilemma directly into the physics of computation can favor the emergence of self-replicating, cooperative
  strategies. When resources are scarce, our analysis shows that defection can become self-limiting even
  in well-mixed populations: parasitic stealing destroys shared energy, slows execution, and can prevent
  reliable replication. Empirically, evolved programs suppress stealing across several Z80 environments,
  while spatial assortment further supports structural complexity and task performance. We further show
  that the framework can incorporate exogenous pressures, such as math tasks structured as sequential
  social dilemmas, when rewards are tied to computation budgets. These results suggest that coupling an
  agent''s capacity for computation to its available energy transforms cooperation into a dominant scaffolding
  for building sustainable, self-organizing systems.'
