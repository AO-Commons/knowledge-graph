id: resource:platform:backsearch
resource_type: platform
title: BackSearch
description: A point-in-time search and fetch API over a frozen archive of the web. Every
  request carries an `as_of` date and returns only material archived on or before it, so the
  same query with the same cutoff returns the same bytes on every run. Sold for forecasting
  work, where a reward means nothing if the agent can look up the outcome, and for evaluation
  and reinforcement-learning teams who need a corpus that does not move under a comparison.
  Paid API, billed per request.
