tool:
  agent_model: Not an agent runtime. A retrieval surface agents call, and the thing being
    controlled is what the agent is allowed to have known at the moment it acted.
  human_controls: 'The cutoff date itself: the evaluator fixes what the agent can see, which
    is what makes a result replayable rather than a fact about the week it ran in.'
