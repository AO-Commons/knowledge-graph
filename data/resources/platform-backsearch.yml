source_provenance: 'Admitted by hand on 2026-11-06 as field infrastructure rather than as
  a result. It is not about organisations of agents, and it is held because evaluating one
  honestly needs the evidence available to the agent to be fixed — a benchmark run against
  the live web measures the week as much as the model. The marginal call in this batch: if
  the corpus decides general evaluation plumbing does not belong, this is the record to drop.
  Taxonomy tags are a first pass assigned by hand and unreviewed. Added by hand on 2026-11-06
  rather than through the citation scan: General Reasoning publishes to its own site rather
  than to arXiv, so nothing in the corpus cites it and the scan cannot reach it.'
