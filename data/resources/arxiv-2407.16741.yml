id: resource:arxiv:2407.16741
resource_type: preprint
title: 'OpenHands: An Open Platform for AI Software Developers as Generalist Agents'
abstract: 'Software is one of the most powerful tools that we humans have at our disposal;
  it allows a skilled programmer to interact with the world in complex and profound ways.
  At the same time, thanks to improvements in large language models (LLMs), there has also
  been a rapid development in AI agents that interact with and affect change in their surrounding
  environments. In this paper, we introduce OpenHands (f.k.a. OpenDevin), a platform for the
  development of powerful and flexible AI agents that interact with the world in similar ways
  to those of a human developer: by writing code, interacting with a command line, and browsing
  the web. We describe how the platform allows for the implementation of new agents, safe
  interaction with sandboxed environments for code execution, coordination between multiple
  agents, and incorporation of evaluation benchmarks. Based on our currently incorporated
  benchmarks, we perform an evaluation of agents over 15 challenging tasks, including software
  engineering (e.g., SWE-BENCH) and web browsing (e.g., WEBARENA), among others. Released
  under the permissive MIT license, OpenHands is a community project spanning academia and
  industry with more than 2.1K contributions from over 188 contributors.'
