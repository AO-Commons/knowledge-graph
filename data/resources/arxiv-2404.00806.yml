title: Algorithmic Collusion by Large Language Models
abstract: We conduct experiments with algorithmic pricing agents based on Large Language Models
  (LLMs). In oligopoly settings, LLM-based pricing agents quickly and autonomously reach supracompetitive
  prices and profits. Variation in seemingly innocuous phrases in LLM instructions ("prompts")
  substantially influence the degree of supracompetitive pricing. We develop novel techniques
  for behavioral analysis of LLMs and use them to uncover price-war concerns as a contributing
  factor. Our results extend to auction settings. Our findings uncover unique challenges to
  any future regulation of LLM-based pricing agents, and AI-based pricing agents more broadly.
