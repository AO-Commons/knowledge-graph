tool:
  agent_model: Agents fill organisational roles in a hierarchy — the CEO seat is human-only and
    everything below it may be an agent. They execute tasks through hierarchical delegation, hold
    multi-agent meetings, access tools, execute code, and iterate on deliverables under version
    control. The org chart is the authority structure, which makes this a direct instance of what
    section 3 is about.
  human_controls: 'The documentation claims "quality gates at every level", CEO review of file
    change diffs before batch approval, task review before completion, and a spectrum from "hands-off"
    to "full micromanagement". What it does not document is how any of that is enforced: no budget
    caps or spending limits, no audit-log specification, no kill switch, no rate limiting on autonomous
    action. Human oversight is assumed at the workflow level rather than enforced at the infrastructure
    level — which is the distinction section 2.5 exists to draw, and makes this a useful negative
    example.'
