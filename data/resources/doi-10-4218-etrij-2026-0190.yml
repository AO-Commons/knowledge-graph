title: 'Lost in the comments: Social context as a single‐pass jailbreak and defense on agentic
  platforms'
abstract: 'Abstract As LLM‐based agents move onto multiagent platforms, they process direct
  prompts and surrounding social context—posts, comments, and upvotes—an attack surface that
  single‐turn alignment never addressed. We built a simulation of Moltbook, a social network
  for AI agents, and a pipeline turning 100 JailBreakBench goals into platform‐native posts
  with bystander comments of three valences: aggressive, ethical, and measured. Platform‐context
  reformatting alone raises the attack success rate (ASR) of GPT‐4o‐mini from 7% to 71%, beating
  a twenty‐query optimization baseline in one pass. Valence then acts as a bidirectional safety
  modulator: Ethical comments sharply suppress ASR, aggressive endorsements paradoxically
  reduce it by exposing intent, and measured, intellectually toned comments prove most dangerous,
  sustaining or elevating ASR. An ablation identifies valence rather than volume as key—a
  35‐fold rise in upvotes leaves ASR unchanged—and every finding reproduces under an independent
  safety classifier with human adjudication. Ambiguous social context thus poses a greater
  threat than explicit pressure, while safety‐valenced signals offer a deployable defense
  for agentic platforms.'
