id: resource:tool:agentteam-email
resource_type: code-tool
title: AgentTeam Email
description: Email infrastructure that gives agents their own mailboxes and puts a human approval
  step between an agent's draft and what actually leaves the building. One of the few tools in
  the mirror where the oversight step is the product rather than a setting.
url: https://github.com/agentteamhq/agentteam-email
repository_url: https://github.com/agentteamhq/agentteam-email
license: MIT
