  temporal_relevance: current
  applicability: directly-actionable
tool:
  agent_model: 'Agents get dedicated mailboxes with scoped access. They read inbound mail and
    draft outbound mail, but sending is not theirs to complete: the documentation describes letting
    "agents draft replies or outbound mail while people approve, edit, or restrict what actually
    gets sent". Untrusted inbound mail is opened in a separate product surface, which treats a
    message as data rather than as instructions.'
  human_controls: Operator approval on outbound mail is the core mechanism, making this machine-proposal
    / human-approval by construction rather than by configuration. Role-based mailbox permissions
    are managed through an admin surface, sending is restricted by domain via Cloudflare, and
    enrolment is token-based through a CLI. Rate limits, recipient allowlists and the scope of
    audit logging are not documented.
  maintainer: AgentTeam HQ
