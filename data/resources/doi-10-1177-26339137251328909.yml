title: AI for collective intelligence
abstract: 'AI has emerged as a transformative force in society, reshaping economies, work,
  and everyday life. We argue that AI can not only improve short-term productivity but can
  also enhance a group’s collective intelligence. Specifically, AI can be employed to enhance
  three elements of collective intelligence: collective memory, collective attention, and
  collective reasoning. This editorial reviews key emerging work in the area to suggest ways
  in which AI can support the socio-cognitive architecture of collective intelligence. We
  will then briefly introduce the articles in the “AI for Collective Intelligence” special
  issue.'
