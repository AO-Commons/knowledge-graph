source_provenance: 'profiled by claude-opus-5 from the tool''s own documentation on 2026-10-14,
  promoted from the awesome-builder-tools mirror (Framework Zero, MIT). Every claim about
  what agents may do and what constrains them cites the document it came from. Not documented:
  What `consequential` means is never defined — the quickstart branches on it, but the classification
  rule (which tools, which arguments, whether it is configurable per tool) is not given, and
  neither is the default when no `onToolCall` handler is passed: the coordinator example constructs
  `OpenMultiAgent` with no gate at all and the README does not say whether tools then run
  unchecked. Nothing describes reviewer identity, authentication, or authorization — who is
  allowed to approve a pending request, whether approver must differ from requester, or whether
  the ''independent review'' the governance floor checks for is enforced as a different human.
  No veto window, timeout, or expiry for pending approvals is stated, nor any kill switch,
  run cancellation, or mid-run abort mechanism. Budgets and rate limits are linked by title
  only (''Budgets and limits'') with no content in the README: no spend ceiling, token cap,
  per-tool call quota, concurrency limit, or wall-clock bound is described, though `result.totalTokenUsage`
  is shown as a post-hoc readout. Tool-level network control is unaddressed — the egress policy
  governs built-in LLM adapters, and the README says process and ACP backends sit outside
  it, but says nothing about what a `bash` or MCP tool may reach, no recipient or domain allowlist
  for tool actions, and no filesystem path scoping for `file_*`/`readwrite` (sandboxing appears
  only as a doc link and as one third-party user''s own Docker choice). Journal scope and
  retention are partly open: which backends exist, how long records are kept, how often windows
  are evicted into ''inconclusive'', and whether journaling is required for approvals to be
  auditable. The governance floor''s consequence is unstated beyond reporting `unsatisfied`
  — nothing says a run is halted or rolled back. No incident reports, red-team results, or
  evaluation of whether the approval gate catches what it claims; user counts are star counts
  and a single ''confirmed production use''. Unreviewed: no person has checked this against
  the source.'
