id: resource:tool:open-multi-agent-oma
resource_type: code-tool
title: open-multi-agent (OMA)
description: 'MIT-licensed, self-hosted TypeScript multi-agent runtime from YuanASI in which
  a coordinator model decomposes a goal into a task DAG at runtime and a deterministic scheduler
  executes it across agents with shell, filesystem, MCP, and external-CLI-agent backends.
  Interesting for organizational design because it ships named governance primitives — approval
  pauses before plan/task/tool execution, a verifiable run journal, declared governance roles,
  and an egress allowlist — and is unusually candid that each is partial: the journal is not
  tamper-proof, the governance check does not block a run, the approval UI is the application''s
  problem, and external-agent backends sit outside the egress policy.'
