id: resource:tool:open-multi-agent-oma
resource_type: code-tool
title: open-multi-agent (OMA)
description: 'A self-hosted, MIT-licensed TypeScript agent runtime from YuanASI in which a
  coordinator plans a task DAG from a goal at runtime and agents execute it with shell, file,
  MCP and external-CLI tools, optionally suspending consequential tool calls for durable,
  hash-bound human approval. Of interest to organizational designers for three unusually explicit
  primitives: approvals cryptographically bound to exactly what the reviewer saw and failing
  closed without compare-and-set; an offline-verifiable run journal whose limits are stated
  rather than oversold; and a ''governance floor'' that judges a run on an execution receipt
  of which roles ran in what order, blind to agent output text.'
