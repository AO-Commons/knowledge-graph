source_provenance: 'profiled by claude-opus-5 from the tool''s own documentation on 2026-10-07,
  promoted from the awesome-builder-tools mirror (Framework Zero, MIT). Every claim about
  what agents may do and what constrains them cites the document it came from. Not documented:
  The README does not define what makes a tool call `consequential` — whether the classification
  is a fixed built-in list (file writes, shell) or something a tool author sets — so the trigger
  condition for the entire approval path is unspecified. Default posture is not stated: whether
  any gate, journal, egress policy or sandbox is active when none is configured (the coordinator
  example suggests not). There is no reviewer identity or authorization model: nothing says
  who may decide a `pendingApproval`, how a reviewer authenticates, whether approvals are
  signed, or whether `requiredRoles` constrain humans at all (they appear to describe agent
  roles in the execution receipt). Token/cost budgets, per-run or per-agent spend caps, timeouts,
  concurrency and rate limits are not specified in the README (only a link to a budgets-and-limits
  guide). No kill switch, abort, or run-cancellation path is described, and no veto window
  or post-hoc rollback. Tool-side allowlists are absent: egress policy covers only built-in
  LLM adapters, with "process and ACP backends sit outside it," and no outbound network, domain,
  filesystem-path, or recipient allowlist is documented for `bash`/`file_*`/MCP/custom tools
  — sandboxing is only a doc link. Audit scope and retention are partly bounded but unresolved:
  journal capture requires an opt-in backend, evicted context windows verify as "inconclusive,"
  and there is no append-only or external-anchoring claim. Nothing states what happens to
  in-flight side effects if an approval is denied, how long a suspended run persists, or what
  the blast radius is when `toolPreset: ''readwrite''` is used (the presets are not enumerated).
  Finally, there is no evaluation of these controls in practice — no incident data, no adversarial
  testing of the gate, and the production evidence is one "confirmed production use" by a
  third party. Unreviewed: no person has checked this against the source.'
