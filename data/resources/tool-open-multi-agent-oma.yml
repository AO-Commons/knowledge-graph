source_provenance: 'profiled by claude-opus-5 from the tool''s own documentation on 2026-10-21,
  promoted from the awesome-builder-tools mirror (Framework Zero, MIT). Every claim about
  what agents may do and what constrains them cites the document it came from. Not documented:
  Default posture is not stated: whether approvals, journal, governance roles, and egress
  policy are off unless configured (the quickstart example runs a full plan-and-execute cycle
  with none of them, which suggests off, but the README never says). Approval identity and
  authority are entirely absent — no notion of who may approve, role separation between requester
  and approver, or expiry/timeout on a pending approval. No kill switch, run cancellation,
  or veto window is described anywhere in this document. Budget enforcement is a doc title
  only: `totalTokenUsage` is reported after the fact, but whether a cost or token ceiling
  can halt a run, and whether limits are per-run, per-agent, or per-tool, is not said; likewise
  no rate limits are described. Tool authorization is unspecified: nothing says whether `bash`/`file_*`
  are allowlisted, path-scoped, or sandboxed by the framework rather than by the user''s own
  Docker (the one production user supplies the container). Containment of process/ACP external
  agents is named as a gap in egress but no replacement control is given. Journal scope and
  retention are undefined — whether prompts, secrets, or tool arguments are redactable, where
  the journal lives, who can read it. No published evaluation, incident history, security
  review, or threat model; no dependency count, test or coverage figures beyond badges; no
  stated behavior when a run violates `governanceConclusion` beyond ''the application must
  check it''. Repository language breakdown and contributor/maintenance cadence are not reported
  in this document. Unreviewed: no person has checked this against the source.'
