id: resource:tool:open-multi-agent-oma
resource_type: code-tool
title: open-multi-agent (OMA)
description: 'Self-hosted MIT-licensed TypeScript multi-agent runtime (YuanASI) whose distinguishing
  feature is not the runtime-planned task DAG but the oversight surface built around it: suspendable
  plan/dispatch/tool-call gates with durable approvals hash-bound to exactly what the reviewer
  saw, an offline-verifiable run journal, a role-and-dependency ''governance floor'' evaluated
  from an execution receipt that never reads agent output, and a fail-closed LLM egress allowlist.
  Interesting to an organization designer because each control is an explicit opt-in that
  the integrator must wire, and the README is unusually candid about where each one stops
  — the journal ''proves lineage and content, not that the file was never edited,'' process
  and ACP agent backends sit outside the egress policy, and a governance-unsatisfied run still
  succeeds.'
