tool:
  agent_model: 'OMA is a self-hosted TypeScript agent runtime in which agents execute tool
    calls and multi-agent runs on a host the operator controls. Three execution modes ship:
    `runAgent()` (single agent), `runTasks()` ("an explicit pipeline"), and `runTeam()`, where
    a coordinator "decomposes a goal into a task graph across agents" — "One model call turns
    the goal into task specs with assignees and dependencies, a deterministic scheduler executes
    them, and a second call writes the final answer from the completed task outputs." The
    planning authority is bounded in two documented ways: "The coordinator is never consulted
    mid-run," and the plan can be frozen via Plan replay. Agent authority over the host comes
    from tools: built-in tools named in the README include `bash`, `file_*` and `grep` (one
    cited user runs them "inside a Docker runtime"), plus `defineTool` custom tools, MCP,
    and shell/sandbox configuration. Tool presets gate breadth — the quickstart agent is given
    `toolPreset: ''readwrite''`. The README classifies "file writes, shell" as "consequential
    tool calls." Runs may carry `sharedMemory: true`, perform "context rewrites," and dispatch
    work to external agent processes — "External agents puts Claude Code, Gemini CLI, and
    Codex on the same task graph through process and ACP backends." Nothing in the README
    grants or describes spending, payment, email/messaging send, or infrastructure-mutation
    authority beyond what a shell and filesystem tool imply; the one worked example is an
    agent told to "Reconcile overdue invoices" that drafts reminders.'
  human_controls: 'Mechanisms named: (1) **A tool-call / plan / dispatch gate.** "A plan,
    task dispatch, or tool-call gate can return `suspend`." This is a setting the integrator
    writes — in the quickstart it is an explicit `onToolCall: ({ consequential }) => (consequential
    ? { action: ''suspend'' } : { action: ''allow'' })` callback, and the second (coordinator)
    example constructs OMA with no such gate at all, so approval is opt-in, not default. (2)
    **Durable approvals.** A suspended request "is stored beside the checkpoint, bound to
    a SHA-256 hash of exactly what the reviewer saw, and the run resumes from that content
    after a restart. A decision is atomic and first-wins; a tampered request or a store without
    compare-and-set fails closed." Requires a checkpoint store (`FileStore`) to be configured.
    (3) **Verifiable journal / audit.** Opt-in: "Attach a journal backend and the run records
    every block the model saw, every tool call and result, and every context rewrite." `verifyRun()`
    re-checks it "cold, offline" byte for byte; an evicted window is "reported as inconclusive,
    not as a failure," and the README states the limit plainly: "It proves lineage and content,
    not that the file was never edited." (4) **Governance floor.** Opt-in declaration `governanceIntent:
    ''required''` with `requiredRoles`; the run is judged on an execution receipt covering
    "which roles ran, in what order, with which dependency edges, and whether an independent
    review happened," the evaluator "never sees agent output text," and "a run can succeed
    and still report `unsatisfied`" — i.e. it reports, it does not block. (5) **LLM egress
    policy.** `offline` or `allowlist`, "checked before a built-in adapter connects. A child
    policy can only tighten its parent, an unenforceable transport fails closed, and process
    and ACP backends sit outside it." (6) **Plan replay** freezes an approved plan; **Consensus**
    "verifies outputs with independent judges." (7) A `docs/budgets-and-limits.md` guide is
    linked but its content is not in the README; `result.totalTokenUsage` is exposed. (8)
    Platform-level: "No telemetry. No hosted control plane," MIT, self-hosted, keys and models
    stay with the operator. A third-party sidecar `@agentsonar/oma` detects "cross-run delegation
    cycles, repetition, and rate bursts" — external, not shipped.'
  maintainer: YuanASI (Shenzhen YuanASI Technology Co., Ltd.)
