tool:
  agent_model: 'OMA is "a self-hosted TypeScript agent runtime for coordinating agents." Three
    execution modes: `runAgent()` runs a single agent, `runTasks()` "executes an explicit
    pipeline," and `runTeam()` "plans from a goal." In team mode the authority to decide the
    work structure is handed to a model: "One model call turns the goal into task specs with
    assignees and dependencies, a deterministic scheduler executes them, and a second call
    writes the final answer from the completed task outputs." The README is explicit that
    no graph is declared by the human — "Nothing above declares a task graph. The coordinator
    planned one at runtime" — and that the planner does not steer mid-flight: "The coordinator
    is never consulted mid-run." Agents act through tools, including built-in shell and filesystem
    tools — the temodar-agent user runs "OMA''s built-in tools (`bash`, `file_*`, `grep`)
    inside a Docker runtime" — plus `defineTool` custom tools and MCP, and can be backed by
    "external agents" (Claude Code, Gemini CLI, Codex) placed "on the same task graph through
    process and ACP backends." Supporting capabilities imply sustained unattended operation:
    shared memory, checkpoints, "adaptive recovery," and context compaction "to keep autonomous
    agent loops alive under tight VRAM limits." Network reach is to model endpoints (hosted,
    local, OpenAI-compatible); the README claims no OMA-side telemetry or phone-home. Token
    consumption is surfaced (`result.totalTokenUsage`) but the README does not describe the
    agent holding any spending, messaging, or external-account authority of its own.'
  human_controls: 'Four named mechanisms, all of them opt-in settings rather than defaults,
    and the README states the limits of three of them itself. (1) **Durable approvals**: "Pause
    before executing a plan, dispatching a task, or calling a tool for human approval," surviving
    restart with persistent storage — but "Your application supplies the approval interface
    and notifications," so OMA ships the gate point, not the reviewer workflow or any notion
    of who is authorized to approve. (2) **Verifiable journal**: "Enable a run journal to
    record model inputs, tool calls, and results for later inspection. `verifyRun()` checks
    the recorded sources and content for consistency offline; it does not prove the journal
    was never edited" — consistency checking, explicitly not tamper-evidence. (3) **Governance
    floor**: "Declare required roles and their execution order, then check whether the actual
    run met those requirements," with the caveat that it is advisory, not blocking — "A successful
    run can still leave governance requirements unmet, so applications must check `governanceConclusion`
    separately." (4) **LLM egress policy**: `offline` or `allowlist`, "checked before a built-in
    adapter connects," where "a child policy can only tighten its parent, an unenforceable
    transport fails closed, and process and ACP backends sit outside it" — i.e. external-agent
    backends are outside the egress control. Additional constraining features are named but
    only as doc links, with no behavior described in this document: "Plan replay freezes an
    approved plan," "Consensus verifies outputs with independent judges," plus docs for "Budgets
    and limits," "Sandbox and shell," and "Execution routing." Observability is local by default:
    trace store, offline Run Viewer showing "per-task status, assignee, tokens, and tool calls,"
    optional OpenTelemetry adapter. A third-party sidecar (`@agentsonar/oma`) detects "cross-run
    delegation cycles, repetition, and rate bursts" — external, not part of the product.'
