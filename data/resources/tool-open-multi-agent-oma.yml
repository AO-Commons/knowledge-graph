tool:
  agent_model: 'OMA is a self-hosted TypeScript agent runtime with three execution modes:
    "`runAgent()` runs a single agent, `runTasks()` executes an explicit pipeline, and `runTeam()`
    plans from a goal." In the `runTeam()` path an optional coordinator "decomposes a goal
    into a task graph across agents" — "One model call turns the goal into task specs with
    assignees and dependencies, a deterministic scheduler executes them, and a second call
    writes the final answer from the completed task outputs. The coordinator is never consulted
    mid-run." Agents act through tools: the quickstart assigns an agent `toolPreset: ''readwrite''`,
    and the README names built-in tools `bash`, `file_*` and `grep` (used by temodar-agent
    "inside a Docker runtime"), plus `defineTool` custom tools, MCP, and "External agents
    ... puts Claude Code, Gemini CLI, and Codex on the same task graph through process and
    ACP backends." The README''s own framing of the consequential surface is file writes and
    shell: "Consequential tool calls (file writes, shell) pause for a human decision." Agents
    also share state (`sharedMemory: true`), rewrite their own context ("every context rewrite"
    is journaled, plus "context compaction to keep autonomous agent loops alive"), and call
    model providers over the network. No payment, email, or external-account authority is
    described.'
  human_controls: 'Five named mechanisms, all of which the developer must wire up or declare
    — none is described as on by default. (1) **Tool-call gate / durable approvals**: an `onToolCall`
    callback the developer supplies decides `allow` vs `suspend`; the quickstart''s handler
    suspends when `consequential` is true. "A plan, task dispatch, or tool-call gate can return
    `suspend`. The request is stored beside the checkpoint, bound to a SHA-256 hash of exactly
    what the reviewer saw, and the run resumes from that content after a restart. A decision
    is atomic and first-wins; a tampered request or a store without compare-and-set fails
    closed." The run reports `status.code === ''suspended''` with `result.pendingApprovals`
    until a reviewer decides. Durability requires passing a checkpoint store (`new FileStore(''./.oma/run.json'')`).
    (2) **Verifiable journal**: opt-in — "Attach a journal backend and the run records every
    block the model saw, every tool call and result, and every context rewrite." `verifyRun()`
    re-checks it "cold, offline" byte for byte; the README states its limit plainly: "It proves
    lineage and content, not that the file was never edited," and an evicted window is "reported
    as inconclusive." (3) **Governance floor**: declared per run — "Declare `governanceIntent:
    ''required''` with `requiredRoles`, and the run is judged on an execution receipt: which
    roles ran, in what order, with which dependency edges, and whether an independent review
    happened. The evaluator never sees agent output text, and a run can succeed and still
    report `unsatisfied`" — i.e. it reports, it does not block. (4) **LLM egress policy**:
    `offline` or `allowlist`, "checked before a built-in adapter connects. A child policy
    can only tighten its parent, an unenforceable transport fails closed, and process and
    ACP backends sit outside it" — so externally-delegated agents are explicitly out of scope.
    (5) **Plan controls**: "[Plan replay](docs/plan-replay.md) freezes an approved plan, [Consensus](docs/consensus.md)
    verifies outputs with independent judges." Deployment posture is itself a control: "No
    telemetry, no hosted control plane ... It makes no analytics, license, update, or phone-home
    request."'
  maintainer: YuanASI (Shenzhen YuanASI Technology Co., Ltd.)
  open_source: 'yes'
  self_hostable: 'yes'
  model_agnostic: 'yes'
  status: active
  languages:
  - TypeScript
