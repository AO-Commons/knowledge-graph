title: 'Ira: utilizar la inteligencia artificial para dañar'
abstract: 'Technological wrath is used as a metaphor for studying how artificial intelligence
  can amplify harm, misinformation, violence, and discriminatory decisions.This chapter examines
  mechanisms of harm without reducing them to a single intention and preserves distinctions
  among objective, production, distribution, decision, and consequence.The analysis integrates
  studies of bias, toxicity, automated messaging, deepfakes, and public trust with institutional
  frameworks of responsibility.The findings show that a consequence may require correction
  even when attribution of harm remains uncertain, and that human oversight is meaningful
  only when reviewers have sufficient time, information, competence, and practical authority
  to change a decision.Provenance is distinguished from truthfulness: confirming where content
  came from can help reconstruct responsibility, but does not demonstrate that a claim is
  true.The chapter also examines harassment, automation of hate, identity manipulation, and
  erosion of trust, together with the need to respond to affected people rather than only
  to technical system performance.The synthesis connects prevention, support, and remedy with
  responsible actors, resources, and review procedures.An illustrative scenario involving
  a false academic instruction separates verification, care, and restoration of opportunities;
  its effectiveness has not been evaluated.The chapter concludes that responsibility is a
  verifiable relationship between evidence and the capacity to modify consequences.An adequate
  institutional response must identify mechanisms, reduce exposure, correct decisions, and
  repair harm without using uncertainty about intention as a reason for inaction.Care therefore
  requires technical correction to be accompanied by understandable procedures for the people
  who experience the consequences.'
