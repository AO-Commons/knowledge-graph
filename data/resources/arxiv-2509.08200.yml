abstract: AI development requires high fidelity testing environments to effectively transition
  from the laboratory to operations. The flexibility offered by cyber arenas presents a novel
  opportunity to test new artificial intelligence (AI) capabilities with users. Cyber arenas
  are designed to expose end-users to real-world situations and must rapidly incorporate evolving
  capabilities to meet their core objectives. To explore this concept the MIT/IEEE/Amazon
  Graph Challenge Anonymized Network Sensor was deployed in a cyber arena during a National
  Guard exercise.
