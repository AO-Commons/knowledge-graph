title: Human-level performance in 3D multiplayer games with population-based reinforcement
  learning
abstract: Artificial teamwork Artificially intelligent agents are getting better and better
  at two-player games, but most real-world endeavors require teamwork. Jaderberg et al. designed
  a computer program that excels at playing the video game Quake III Arena in Capture the
  Flag mode, where two multiplayer teams compete in capturing the flags of the opposing team.
  The agents were trained by playing thousands of games, gradually learning successful strategies
  not unlike those favored by their human counterparts. Computer agents competed successfully
  against humans even when their reaction times were slowed to match those of humans. Science
  , this issue p. 859
