title: The Power of Meta Access in the Software of the Future --- Demonstrated on LLM Chat
  UIs and Chat AI
abstract: 'Chat remains the default surface for many large language model (LLM) tasks, even
  as agentic tools such as OpenCode excel at coding and automation. Yet the model sees the
  current dialogue but not the workspace around it. We explore meta access---giving the assistant
  a structured, permissioned view of the interface itself and propose a ladder of levels:
  feature tutoring; metadata, settings, and preference access; retrieval over summaries and
  messages, confirmed mutation, and full orchestration. Meta access can turn a chat client
  from many screens into one entry point for finding, navigating, organising, and operating
  it, while raising risks around grounding, privacy, prompt injection, and trust. General-purpose
  agentic harnesses are runtimes; because they can change their own settings, meta access
  becomes reflexive and needs a separate control-plane boundary. We ground this in the Meta
  Chat prototype of the Chat AI client. It builds bounded context from, e.g., summaries, settings,
  and relevant messages; links references to conversations, topics, and personas; supports
  confirmed, reversible changes; offers a browsable tutorial library; and recommends personas
  as user-started conversations. By exposing application state in structured form, meta access
  can extend screen readers from widget descriptions to semantic workspace operations. Meta
  access thus turns chat from a window onto one conversation into a control layer for the
  whole workspace, extending chat toward agentic capability without surrendering user control.
  As assistants become embedded in IDEs, dashboards, office suites, and operating systems,
  AI-era interfaces should expose a structured, permissioned model of their state and capabilities,
  ideally by opening their existing metamodels through a debugger-like interface.'
