title: Multiparty Dynamics and Failure Modes for Machine Learning and Artificial Intelligence
authors:
- David Manheim
published_at: '2018-10-16'
url: https://arxiv.org/abs/1810.10862
arxiv_id: '1810.10862'
doi: 10.48550/arXiv.1810.10862
abstract: 'An important challenge for safety in machine learning and artificial intelligence
  systems is a~set of related failures involving specification gaming, reward hacking, fragility
  to distributional shifts, and Goodhart''s or Campbell''s law. This paper presents additional
  failure modes for interactions within multi-agent systems that are closely related. These
  multi-agent failure modes are more complex, more problematic, and less well understood than
  the single-agent case, and are also already occurring, largely unnoticed. After motivating
  the discussion with examples from poker-playing artificial intelligence (AI), the paper
  explains why these failure modes are in some senses unavoidable. Following this, the paper
  categorizes failure modes, provides definitions, and cites examples for each of the modes:
  accidental steering, coordination failures, adversarial misalignment, input spoofing and
  filtering, and goal co-option or direct hacking. The paper then discusses how extant literature
  on multi-agent AI fails to address these failure modes, and identifies work which may be
  useful for the mitigation of these failure modes.'
