id: resource:arxiv:2610.37342
resource_type: preprint
title: Aligning Institutional Power and Operational Ability
abstract: To be socially sustainable, Agentic AI systems require normative designs that align responsibilities
  with the ability to fulfil them. Identifying incongruences such as unsatisfiable expectations or privilege
  escalation is crucial in avoiding normative pitfalls. In this study, we discuss design dimensions suitable
  for describing multi-agent systems in light of this norm-ability alignment requirement. We propose a
  formal framework centred on process-oriented modelling and institutional power for the analysis of a
  given normatively relevant process, discuss strategies for repairing it, and elaborate on how the symmetrical
  relation between operational process and institutional state affects the lifecycle of normative positions.
