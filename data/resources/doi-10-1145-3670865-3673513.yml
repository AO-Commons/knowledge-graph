title: 'Large Language Models as Simulated Economic Agents: What Can We Learn from Homo Silicus?'
abstract: 'Large language models---because of how they are trained and designed---are implicit
  computational models of humans---a homo silicus. Social scientists can use LLMs like economists
  use homo economicus: LLMs can be given endowments, information, preferences, and so on,
  and then their behavior can be explored in scenarios via simulation. We replicate four experiments
  using this approach and find qualitatively similar results to the original. Benefits of
  this approach include trying new variations for fresh insights, piloting studies via simulation,
  and searching for novel social science insights to test in the real world. The full version
  of the paper can be accessed at https://apostolos-filippas.com/papers/hs.pdf.'
