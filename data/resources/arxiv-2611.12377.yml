title: 'Detecting Shadow AI: Unsanctioned LLM Agents on Enterprise Endpoints: A Taxonomy,
  an Open Detector and a Controlled Evaluation'
abstract: 'Shadow IT, the use of technology that the IT organisation has not approved, is
  a long-standing governance problem. We argue that autonomous AI agents can make it grow
  much faster: agents make building tools nearly free, act with their user''s privileges,
  and leave behind scripts, automations and MCP servers that are themselves unsanctioned.
  A simple compounding model shows that, under its assumptions, shadow IT grows exponentially
  once agentic artifacts reproduce faster than the organisation retires them; retiring them
  starts with detecting them. We then ask whether unsanctioned agents can be detected on Windows
  endpoints. We propose a taxonomy of nine classes of agents and six layers of endpoint footprint,
  and argue that rules based only on the structure of processes and connections cannot separate
  an agent from its behavioural twin, the same program talking to a non-AI service. We present
  Agent Detector, an open-source Windows detector that anchors behaviour to the identity of
  the remote service and correlates it with configuration, installation and execution history,
  using a catalog of 39 tools and 184 LLM endpoint entries; it informs users through a notice
  they must acknowledge instead of blocking. On a controlled bench of 12 synthetic agents,
  3 AI components and 9 benign workloads, repeated 5 times on one workstation, two behavioural
  rules flagged every behavioural twin, while Agent Detector flagged none and detected every
  agent in the majority of runs. Its limits are temporal: a connection to a provider behind
  a shared content-delivery network is attributable only while the DNS cache holds the provider''s
  name, one to five minutes, and an intermittent agent was seen by about one scan in three.
  A scan costs about 154 ms. The bench is too small to rank detectors; it maps what each kind
  of evidence can see: unsanctioned agents can be partly detected, and not by behaviour alone.'
