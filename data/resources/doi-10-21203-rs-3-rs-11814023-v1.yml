resource_type: preprint
title: 'TCA-DARE: A Task-Complexity-Aware Dynamic Agent Routing Framework for Multi-Agent
  LLM Systems'
abstract: 'Autonomous Large Language Model (LLM) agents have demonstrated significant capability
  in complex problem-solving. However, existing multi-agent systems predominantly rely on
  fixed, static execution topologies where a predefined suite of specialist agents is invoked
  sequentially regardless of query complexity. This rigid paradigm imposes a heavy computational
  tax, leading to inflated token consumption, high execution latency, and elevated operational
  costs on simple to moderately complex tasks. In this paper, we propose TCA-DARE (Task-Complexity-Aware
  Dynamic Agent Routing and Execution), an adaptive multi-agent framework that evaluates incoming
  academic requests prior to agent instantiation and allocates a minimal viable agent topology.
  By combining a lightweight four-feature mathematical complexity-scoring router (Layer 1),
  a dynamic specialist agent pool (Layer 2), a source-grounding verification guardrail (Layer
  3, specified for future integration), and a telemetry logger (Layer 4), the framework routes
  queries across three distinct execution topologies: single-agent extraction (C₁), dual-pipeline
  synthesis (C₂), and full multi-agent orchestration (C₃). We present the complete system
  architecture, formal routing algorithm, and an implemented (not yet experimentally executed)
  local Python prototype built on Ollama (llama3) and tiktoken, alongside a structured multi-tier
  evaluation protocol designed for upcoming empirical validation against static multi-agent
  baselines.'
