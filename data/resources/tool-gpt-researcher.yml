id: resource:tool:gpt-researcher
resource_type: code-tool
title: GPT Researcher
description: An autonomous research agent that plans queries, scrapes and aggregates twenty or
  more sources, and writes a cited report. Widely used, and ships essentially no oversight surface
  — which is the interesting fact about it.
