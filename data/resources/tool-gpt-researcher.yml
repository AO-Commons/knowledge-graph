tool:
  agent_model: 'The agent researches autonomously end to end: it browses and scrapes the web with
    JavaScript enabled, aggregates over twenty sources, reads local documents, reaches external
    systems through MCP — "GitHub repositories, databases, and custom APIs" — and writes report
    files out to PDF and Word.'
  human_controls: 'Almost none are documented, and the omission is the finding. No search or iteration
    ceiling, no approval step, no domain allowlist, no mandatory review before a report is produced.
    Docker is available but not required, so sandboxing is the operator''s choice. The only quantified
    bound is economic and advisory rather than enforced: deep research is documented as costing
    around $0.40 per run. The project describes itself as experimental and "as-is without any
    warranty". A widely adopted agent that spends money and reaches arbitrary web and API endpoints
    with no ceiling is a useful data point for section 2.5.'
  maintainer: Assaf Elovic
  open_source: 'yes'
