id: resource:tool:meta-ads-kit
resource_type: code-tool
title: Meta Ads Kit
description: An agent kit that operates live Meta advertising accounts — pausing, resuming and
  adjusting budgets on real campaigns. The clearest case in the mirror of an agent with direct
  spend authority, and it answers that with approval gates and a dry-run default rather than with
  limits.
