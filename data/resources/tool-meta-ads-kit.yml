tool:
  agent_model: The agent works against real ad accounts through Meta's official Ads CLI and can
    "take action — pause, resume, adjust budgets" on live campaigns. That is unmediated authority
    over spend, which almost nothing else in the mirror claims.
  human_controls: 'Approval before anything that moves money: the agent "asks before taking any
    spend-impacting action", described as "always with your approval". A mock mode runs the whole
    loop without real API calls, a read-only mode allows reporting without action, and uploads
    are dry-run-first with new ads created PAUSED rather than live. The gap is that these are
    conventions of the loop, not enforced ceilings: there is no documented per-action spend cap,
    no rollback procedure if an approval is given in error, no audit log of who approved what,
    and the API token permission scopes required are unspecified.'
