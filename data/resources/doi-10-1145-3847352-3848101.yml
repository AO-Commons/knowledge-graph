title: 'Ghost Approvals: Approval-Provenance Failure in Agentic AI Frameworks'
abstract: 'Agentic AI systems increasingly execute actions for users, including transfers,
  deployments, account changes, and data release. Human approval gates are meant to prevent
  these actions from running until a reviewer has inspected the proposed action and issued
  a decision. Because approval can arrive after a delay, frameworks often persist workflow
  state and resume later. The resume path therefore becomes a security boundary: it must distinguish
  evidence that a human approved from approval-shaped values stored in mutable state. We define
  Approval-Provenance Failure as a condition in which a workflow resume path treats mutable
  approval-relevant state as evidence that a trusted human approval path produced a decision.
  Our adversary can write approval-relevant workflow state, but cannot use the approval path,
  change the model, modify tool code, invoke the tool directly, write the business database,
  mint a valid approval artifact, or access the approval issuer key. We evaluate 18 agent
  frameworks with human approval, interruption, or pause-resume behavior. Thirteen are exposed,
  three are resistant, and two are non-applicable. In exposed cases, state-only approval forgery
  causes gated action execution after a negative control blocks ordinary resume. The failure
  also forges the evidence of human oversight itself: across 500 paired audit traces, genuine
  and forged records are statistically indistinguishable, with exact-match rate 1.0 and AUC
  0.5 under the tested native audit-field projection, while provenance evidence separates
  them with AUC 1.0. Finally, we evaluate a provenance-bound approval artifact that authenticates
  the decision with a MAC or digital signature and is verified at resume time. The full artifact
  check blocks 13 adversarial variants on five representative targets with microsecond-scale
  verification cost.'
