source_provenance: 'Found on newcollectives.org''s Living Research Garden on 2026-10-29 and brought in
  by hand, not through the scouting path. Scope judged against the standing test by claude-opus-5 WITHOUT
  the machine judge in scope_judge.py, which needs an API key this session did not have — a reading of
  the policy rather than a run of it, and it should be confirmed. Nothing in the exclusion register bars
  it. The judgment: An agent runs a year-long campaign in a simulated facility where experiments take
  months, occupy scarce equipment and cannot be undone. Evaluates an agent holding operational authority
  over irreversible decisions, which is the part of autonomy benchmarks usually design away.'
