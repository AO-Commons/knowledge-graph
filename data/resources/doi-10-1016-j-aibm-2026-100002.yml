title: 'From passive tools to autonomous partners: the rise of AI agents in bioinformatics'
abstract: 'Large language model (LLM)-driven agents have emerged as a promising paradigm in
  bioinformatics, enabling autonomous and adaptive analysis of complex biological problems.
  This review comprehensively summarizes the fundamental frameworks of artificial intelligence
  (AI) agents, breaking down their core architecture into essential components: an LLM brain,
  planning, memory, and tools. Furthermore, we categorize current biomedical AI agents into
  general agents—designed for broad interdisciplinary tasks—and specialized agents tailored
  for distinct biological data types. We further organize specialized agents along two dimensions—data
  modalities and representative applications—with a particular focus on genomics, single-cell
  transcriptomics, proteomics, spatial omics, and multi-omics analysis, while highlighting
  drug discovery as a representative application scenario. Despite their potential to automate
  complex workflows, hurdles such as model hallucinations, “black-box” reasoning, and biosafety
  risks persist. We highlight the transition toward embodied intelligence and self-driving
  laboratories, envisioning natively multimodal agents as critical drivers in accelerating
  the pace of biological discovery.'
