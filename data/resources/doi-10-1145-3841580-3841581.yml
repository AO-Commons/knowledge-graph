title: 'Vibe Research: Active Exploration in Deep Research'
abstract: 'Deep-research systems are agentic tools that orchestrate multi-step web searches
  and summarization to produce comprehensive reports. However, in conventional deep-research
  systems, the user plays a largely passive role: they must approve extended agent runs, wait
  for the results, and repeat the process until a satisfactory result is obtained. We introduce
  Vibe Research, an active–exploration framework for deep research. The system enables the
  user to remain in control throughout a single interactive session by selecting candidate
  sections, drilling down into details, and pivoting the research direction based on intermediate
  results, while the agent performs web exploration in parallel. We developed a prototype
  user interface that interleaves a tile-based “research view” with a “report view”. In a
  user study with 32 participants, Vibe Research achieved higher ratings for user experience,
  reduced workload, and increased coverage compared with a conventional workflow.'
