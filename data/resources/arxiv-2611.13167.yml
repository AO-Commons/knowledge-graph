resource_type: preprint
title: AI Alignment Is Neither Solvable nor Sufficient
abstract: Humans and AI systems increasingly act within the same social and economic environments.
  Alignment, the goal of ensuring that AI systems act in accordance with human values, is
  widely regarded as a central challenge for ensuring that AI benefits society while avoiding
  harm. We argue that this endeavor is misguided. First, alignment is not well defined, as
  it presumes a sufficiently stable and identifiable set of human intentions or values. Second,
  where a concrete notion of alignment can be specified, it is not solvable. Third, where
  alignment appears solvable, solving it would not necessarily mitigate the negative consequences
  of AI. A key reason is that alignment is typically framed as a property of individual AI
  systems, while the resulting hybrid societies of humans and machines are complex systems
  shaped by interactions and feedback loops. Emergent risks, and not only those posed by individual
  misaligned systems, are therefore likely to become a major source of harm. We conclude that
  AI safety is an ongoing challenge and not a problem that can be solved once and for all
  by verifying a particular model property.
