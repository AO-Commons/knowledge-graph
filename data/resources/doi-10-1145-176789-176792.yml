  2 records already held, which is at or above the threshold of 2 for this generation. Connected
  records: Fully Autonomous AI Agents Should Not be Developed; Levels of Autonomy for AI Agents.
  Scope scan by claude-opus-5: Maes 1994 is foundational method the field builds on (cited
  by the autonomy-levels and autonomy-limits work in the library) rather than a study of organizations
  where agents hold operational or decision authority. No exclusion-register line bars it;
  it belongs as a section 15 pointer, held the way Melting Pot is, not ingested as in-scope.
  What changes because agents hold authority: It is the origin text for delegating tasks and
  discretion to software agents and for the trust/competence conditions under which a principal
  cedes control, which is the primitive that organizational agent authority is built from
  — but it concerns a single user and assistant, not an organization. Unreviewed, like everything
  that has not been through the review queue — and machine-admitted as well as machine-resolved,
  so the scope judgment here is a model''s until a person confirms it.'
