id: resource:arxiv:2611.03935
resource_type: preprint
title: 'Labtune: Treating Lab Organization and Information Sharing as Experimental Variables
  in LLM-Agent Discovery'
abstract: De-siloing can create groupthink; silos can prevent knowledge sharing and reduce
  research efficiency. The same tension appears in research systems built with large language
  model (LLM) agents, yet their organization is usually fixed by design. I propose treating
  laboratory structure and information sharing as experimental variables. I introduce Labtune,
  an open framework for bounded research workflows with user-selected laboratory organization,
  communication policy, model configuration and budget. Users can choose among six editable
  designs, from multidisciplinary silos and transdisciplinary teams to co-leaders, hub-and-spoke
  structures, flat co-labs and a single scientist. Information sharing can independently vary
  from none to high detail, with an optional channel for conditional abstractions called wisdom.
  Sharing is enforced by the controller at phase barriers rather than through unrestricted
  agent chat, while delegation does not create additional budget or permissions. Development
  evidence is separated from protected confirmation, and an optional multi-lab layer allows
  laboratories with different structures to exchange filtered information. Labtune is an idea
  and system-description paper, not a benchmark result. Its contribution is to make laboratory
  organization and information sharing configurable and measurable under matched budgets.
  I do not claim that one design or level of sharing is best; the aim is to create a concrete
  experimental space in which those differences can be tested.
