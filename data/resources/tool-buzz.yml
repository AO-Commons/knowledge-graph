tool:
  agent_model: Agents are participants rather than command-responders, holding their own cryptographic
    Nostr identities and defined permissions. They post, review code, send patches, and run
    approved workflows alongside humans under the same identity model. Block's announcement
    is explicit that this makes agents teammates, not holders of organizational authority.
  human_controls: Per-agent permission scopes, and automations that must be approved before
    an agent can run them. Every action by human or agent is a signed event in an append-only
    log, so the audit trail is inherent rather than a feature. Self-hosting means the operator
    controls the relay.
