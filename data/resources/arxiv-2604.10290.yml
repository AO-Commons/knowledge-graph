title: AI Organizations are More Effective but Less Aligned than Individual Agents
abstract: 'AI is increasingly deployed in multi-agent systems; however, most research considers
  only the behavior of individual models. We experimentally show that multi-agent "AI organizations"
  are simultaneously more effective at achieving business goals, but less aligned, than individual
  AI agents. We examine 12 tasks across two practical settings: an AI consultancy providing
  solutions to business problems and an AI software team developing software products. Across
  all settings, AI Organizations composed of aligned models produce solutions with higher
  utility but greater misalignment compared to a single aligned model. Our work demonstrates
  the importance of considering interacting systems of AI agents when doing both capabilities
  and safety research.'
