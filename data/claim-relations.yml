# How claims relate to each other.
#
# Kept in one file rather than inside each paper's claims, because a relation
# belongs to neither end. Filing it under the source would make the corpus
# read differently depending on which paper you opened.
#
# Every relation here is an INFERRED edge. No source says "claim A disagrees
# with claim B" — somebody read both and decided. So each carries a
# confidence class and its reasoning in `because`, exactly as a drafted statement
# carries its quote. An edge here that looked deterministic would be
# asserting a judgment nobody made.
#
# As of 2026-09-12 that somebody is a machine, for all twelve. Nine of them
# carried `asserted_by: ankeliu` until now and should not have: they were
# drafted by a model and labeled with a person's name, which is precisely
# the failure the confidence class exists to prevent, committed in the file
# that exists to prevent it. Corrected rather than left, because a relation
# attributed to a human reads as settled and none of these is.
#
# What `asserted_by` means: who made the judgment. Not who ran the command,
# and not who owns the repository.
#
# Relation names follow CiTO (Shotton, 2010) so they mean what a reader
# outside this project expects:
#
#   SUPPORTS        the source is evidence for the target
#   DISAGREES_WITH  the two cannot both hold as stated
#   QUALIFIES       the source narrows or conditions the target, not denying it
#   EXTENDS_CLAIM   the source takes the target further, or generalizes it
#
# Direction is source -> target and it matters: A supports B is not B
# supports A.

relations:

  # ---------------------------------------------------------------------
  # Thread A — is Melting Pot's evaluation valid?
  #
  # Three papers, one argument, from an inference about one competition to
  # a claim about a whole class of evaluation. Re-read against the full texts
  # on 2026-10-01: each later paper qualifies Melting Pot rather than refuting
  # it. Both share authors with Melting Pot, and Solipsistic Superintelligence
  # cites it as a step toward the evaluation it calls for.
  # This is the thread that shows the layer is worth having: none of these
  # papers cites a shared conclusion, and no keyword search puts them
  # together.
  # ---------------------------------------------------------------------

  - source: claim:arxiv:2509.14485:4
    target: claim:arxiv:2107.06857:5
    relation: QUALIFIES
    confidence_class: INFERRED
    because: >-
      Melting Pot's authors expect the suite to improve over time as the
      latest agent technology is reincorporated into new background
      populations and test scenarios. Beyond the High Score argues it is
      plausible that leading contest entries gained much of their edge by
      excelling in scenarios that did not reward prosocial ability,
      exploiting a weakness in the evaluation framework. Both can hold, but
      the second conditions the first: if it is right, improvement of the
      kind Melting Pot expects also depends on its test scenarios rewarding
      the prosocial abilities they are meant to measure, not only on
      stronger agents in its background populations.
    asserted_by: claude-opus-5-5 (drafted, unconfirmed)
    asserted_on: "2026-10-01"

  - source: claim:arxiv:2509.14485:3
    target: claim:arxiv:2107.06857:3
    relation: QUALIFIES
    confidence_class: INFERRED
    because: >-
      Melting Pot's authors show that testing against unfamiliar background
      populations reveals weaknesses that training performance does not.
      Beyond the High Score finds that, in the Melting Pot contest, higher-
      scoring entries had significantly higher base-chance rates: they were
      more likely to perform better in scenarios where prosocial demands
      were absent. So a high test score can still come from scenarios that
      do not exercise the prosocial abilities the suite is built to test,
      and what the held-out test reveals depends on reading results per
      demand, not only in aggregate. A narrowing, not a contradiction.
    asserted_by: claude-opus-5-5 (drafted, unconfirmed)
    asserted_on: "2026-10-01"

  - source: claim:arxiv:2509.14485:3
    target: claim:arxiv:2509.14485:4
    relation: SUPPORTS
    confidence_class: INFERRED
    because: >-
      Within one paper: higher-scoring entries having significantly higher
      base-chance rates, so that they are more likely to perform better when
      prosocial demands are absent, is one of the observations from which
      the authors judge it plausible that leading entries gained much of
      their edge in scenarios that did not reward prosocial ability.
    asserted_by: claude-opus-5-5 (drafted, unconfirmed)
    asserted_on: "2026-10-01"

  - source: claim:arxiv:2606.03237:3
    target: claim:arxiv:2606.03237:6
    relation: SUPPORTS
    confidence_class: INFERRED
    because: >-
      Within one paper: deployment inducing endogenous non-stationarity is
      the premise from which the insufficiency of current evaluation follows.
    asserted_by: claude-opus-5 (drafted, unconfirmed)
    asserted_on: "2026-09-10"

  # ---------------------------------------------------------------------
  # Thread B — is reputation usable for machine agents?
  #
  # Two papers that reach compatible recommendations from incompatible
  # premises. One treats reputation as the weakest of six available tools;
  # the other argues its precondition does not exist for LM agents at all.
  # ---------------------------------------------------------------------

  - source: claim:arxiv:2605.30169:4
    target: claim:arxiv:2511.03434:5
    relation: EXTENDS_CLAIM
    confidence_class: INFERRED
    because: >-
      Inter-Agent Trust Models demotes reputation: gate high-impact actions
      by Proof and Stake instead. Dissociative Identity goes further — for
      agents without persistent identity, reputation signals are actively
      harmful rather than merely weak. Same direction, stronger claim.
    asserted_by: claude-opus-5 (drafted, unconfirmed)
    asserted_on: "2026-09-10"

  - source: claim:arxiv:2605.30169:1
    target: claim:arxiv:2605.30169:4
    relation: SUPPORTS
    confidence_class: INFERRED
    because: >-
      Within one paper: reputation presupposing persistent identity, sanction
      sensitivity and costly non-fungibility is the premise; harm from
      reputation signals for dissociative agents is what follows when the
      presupposition fails.
    asserted_by: claude-opus-5 (drafted, unconfirmed)
    asserted_on: "2026-09-10"

  - source: claim:arxiv:2605.30169:5
    target: claim:arxiv:2511.03434:6
    relation: QUALIFIES
    confidence_class: INFERRED
    because: >-
      Tiering verification to stakes assumes there is a principal to verify
      and to sanction. Dissociative Identity argues identity-based ex post
      governance is structurally inapplicable to LM agents, which conditions
      where the tiering recommendation can apply rather than refuting it.
    asserted_by: claude-opus-5 (drafted, unconfirmed)
    asserted_on: "2026-09-10"

  - source: claim:arxiv:2605.30169:2
    target: claim:arxiv:2605.30169:3
    relation: SUPPORTS
    confidence_class: INFERRED
    because: >-
      Within one paper: agents being assemblages of mutable modules is the
      observation; the loss of grounding for identifiability, predictability,
      credibility and rehabilitability is the consequence drawn from it.
    asserted_by: claude-opus-5 (drafted, unconfirmed)
    asserted_on: "2026-09-10"

  # ---------------------------------------------------------------------
  # Drafted by a model from the shared-concept queue on 2026-09-11, and
  # NOT yet confirmed by a person. `asserted_by` says so on each one.
  #
  # That distinction matters more here than anywhere else in the corpus: a
  # relation is an inference, and a model both proposing the inference and
  # writing its justification is exactly the case the INFERRED class exists
  # to mark. A reviewer should read these as suggestions with reasoning
  # attached, not as settled.
  #
  # 25 candidate pairs were read and 3 survived. The 22 that did not are
  # the more informative number — sharing a concept is not a relation, and
  # a high yield would mean the vocabulary is too loose.
  # ---------------------------------------------------------------------

  - source: claim:arxiv:2509.14485:2
    target: claim:arxiv:2107.06857:4
    relation: QUALIFIES
    confidence_class: INFERRED
    because: >-
      Melting Pot's authors write that solving its test scenarios seems to
      require agents that understand trust, generosity, forgiveness,
      reciprocity, stubbornness and deception. Beyond the High Score infers
      such abilities for contest entries and finds that higher ability does
      not reliably accompany a higher score: some lower-scoring entries had
      significantly higher reciprocity and convention-following ability than
      some higher-scoring ones, and forgiveness did not differ between
      entries. A high contest score is not the same as solving the
      scenarios, so both can hold, but the contest's ranking did not
      reliably reward the abilities the scenarios are said to require.
    asserted_by: claude-opus-5-5 (drafted, unconfirmed)
    asserted_on: "2026-10-01"

  - source: claim:arxiv:2606.03237:6
    target: claim:arxiv:2107.06857:5
    relation: QUALIFIES
    confidence_class: INFERRED
    because: >-
      Solipsistic Superintelligence counts multi-agent testbeds, citing
      Melting Pot, as a step toward dynamic evaluation because they let the
      system interact with a population of agents, while holding that no
      current approach yet meets all of its requirements in combination.
      That bounds Melting Pot's expectation that folding improved agents
      into new background populations will keep the suite improving. Under
      this paper's definition, counterparties must update in response to the
      evaluated policy's behavior; whether a periodic refresh of background
      populations provides that is the drafter's inference, which the paper
      does not state about Melting Pot.
    asserted_by: claude-opus-5-5 (drafted, unconfirmed)
    asserted_on: "2026-10-01"

  - source: claim:arxiv:2605.30169:1
    target: claim:arxiv:2511.03434:3
    relation: QUALIFIES
    confidence_class: INFERRED
    because: >-
      Inter-Agent Trust Models puts Reputation among six mechanisms available to an
      agent ecosystem. Dissociative Identity states the precondition reputation runs
      on — persistent identity with behavioral continuity, sanction sensitivity and
      costly non-fungibility. That does not refute the comparison; it bounds where one
      of its six entries can be used at all.
    asserted_by: claude-opus-5 (drafted, unconfirmed)
    asserted_on: "2026-09-11"
