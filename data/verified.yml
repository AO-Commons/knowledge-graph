# The verified set: what the preview site shows before you ask it for more.
#
# The corpus is wide on purpose — a citation scan adds work nobody has looked
# at yet, and that is how a library finds the thing it was missing. But a
# reader arriving at the site should not have to guess which of 371 records
# AO Commons actually stands behind.
#
# This file is the subset that is stood behind. Every record here was put on
# the list by a person, for a stated reason, rather than by the scan: the
# reading list the AO Commons research agenda is built on, grouped by the nine
# research streams it is organized around, and the deployments, tools and
# evaluation suites already listed on aocommons.org/build.
#
# `scripts/build_site.py` reads it. The site opens on this set and says how
# many more records the graph holds; one control shows the rest. Nothing is
# hidden and nothing is deleted — the distinction is between what is published
# and what is merely held.
#
# An id here that no record matches fails `tests/test_verified.py`, so the set
# cannot quietly rot as records are renamed.

verified_by: AO Commons research team
verified_on: '2026-11-03'

