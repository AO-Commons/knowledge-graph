# The open questions, and the claims that ask them.
#
# A `gap` claim is one paper saying something is unresolved, in that
# paper's words and bounded by that paper's scope. A question is the thing
# several of those turn out to be asking. Clustering them is the layer the
# roadmap called for and the reason the extraction pass hunts gaps separately:
# it is the query nobody else can answer with provenance, because nobody else
# holds the sentences.
#
# Kept in one file rather than inside each paper's claims, for the reason
# claim-relations.yml gives: the edge belongs to neither end, and filing it
# under one paper would make the corpus read differently depending on which
# paper you opened.
#
# `addresses` is MIRA's name, as the four claim-to-claim relations are CiTO's.
# A shared schema for research graphs had already named this edge, and using
# their word for a layer we had not built cost nothing.
#
# Every edge here is INFERRED. No paper says "my open question is an instance
# of yours" — somebody read several and decided. So each occurrence carries
# `because`, and each question carries the `note` saying why its claims
# are one question. That note is the judgment a reader most needs to be able
# to disagree with, and it is the first thing to check when one of these looks
# wrong.
#
# As of 2026-10-09 that somebody is a machine, for all three. Drafted and
# unconfirmed, exactly as the claim relations were: a question attributed to a
# person reads as settled, and none of these has been read by one yet.
#
# What the corpus can and cannot show today. Thirty-three gap claims, from
# seventeen papers, clustering into twelve questions. Eight are asked by more
# than one paper and four by one each, and that ratio is the honest state of
# the layer — better than it has ever been, and only because fifteen papers
# were read in one pass rather than because the clustering got cleverer.
#
# The reading pass of 2026-10-29 is what moved it. Six papers on multi-agent
# behavior were read down to their claims in one go, and the gaps they
# carried did not scatter: three papers that share no author — an
# architectural security study, a multi-agent security survey, and a risk
# report — each arrived at the same missing instrument from a different
# direction, which is the case this layer exists for.
#
# The one that crosses is the case this layer exists for. METR's time-horizon
# work and Melting Pot prosocial profiling share no citation and no author and
# would not meet in any search; both are asking whether a measured capability
# is a property of the agent or of the conditions it was measured under. A
# question asked by two papers is a claim about a field. A question asked
# twice by one paper is that paper's framing. The difference is counted rather
# than implied.

questions:

  # ---------------------------------------------------------------------
  # Measurement that may not survive its testbed.
  # ---------------------------------------------------------------------
  - id: question:capability-measurement-transfer
    text: Does a measured agent capability survive a change of testbed?
    status: open
    concept_tags:
      - capability-profiling
      - prosocial-capability
      - long-horizon-and-multi-step-task-evaluation
    note: >-
      Three claims from two papers that share no citation and no author.
      Two sit in one discussion section and ask the same thing from opposite
      ends: whether the measurement layout carries to another suite, and
      whether the substrate the agent was measured on biased the number. The
      third is about a different result entirely — agents gaining less than
      humans from longer time budgets — and asks whether it holds outside the
      task complexity it was measured at. All three ask whether what was
      measured is a property of the agent or an artifact of the conditions of
      measurement, which is the question that decides whether any capability
      number means anything outside the harness that produced it. The third is
      the reason this question is worth having: no search puts METR's time
      horizons beside Melting Pot's prosocial profiling.
    asserted_by: claude-opus-5 (drafted, unconfirmed)
    asserted_on: "2026-10-09"
    addressed_by:
      - claim: claim:arxiv:2509.14485:6
        because: >-
          States directly that transfer of the prosocial ability measurement
          layout beyond Melting Pot to other social-AI suites is unresolved —
          the question in its outward form, across harnesses.
      - claim: claim:arxiv:2509.14485:7
        because: >-
          States that the study did not model how the choice of substrate
          biases a measured capability — the same question from inside one
          harness, where the confound is the environment rather than the suite.
      - claim: claim:arxiv:2502.15840:14
        because: >-
          States that it is unknown whether the finding about longer time
          budgets holds for simpler tasks — the same question where the
          condition varied is the difficulty of the work rather than the
          harness it was measured in.

  # ---------------------------------------------------------------------
  # Accountability when identity does not hold still.
  # ---------------------------------------------------------------------
  - id: question:accountability-under-unstable-identity
    text: Who is accountable when an agent's identity does not hold still?
    status: open
    concept_tags:
      - dissociative-agent-identity
      - agent-reputation-systems
      - operator-deployer-and-developer-liability
    note: >-
      Both claims come from one paper and share the dissociative identity
      concept, but they are not the same sentence twice. One reports that
      identity and reputation are open problems in technical AI governance at
      all; the other reports that assigning accountability under fragmented
      identity has resisted centuries of legal effort. The first says the
      mechanism is missing, the second says the hard part is not the mechanism.
      Treated as one question because a reputation system that cannot say who
      is answerable is not a partial answer to this — it is an answer to a
      different question.
    asserted_by: claude-opus-5 (drafted, unconfirmed)
    asserted_on: "2026-10-09"
    addressed_by:
      - claim: claim:arxiv:2605.30169:7
        because: >-
          Reports identity and reputation as open problems in technical AI
          governance — the question in its general form, before any particular
          mechanism is proposed.
      - claim: claim:arxiv:2605.30169:8
        because: >-
          Reports that accountability under fragmented identity remains
          unresolved after centuries of DID jurisprudence — the same question
          where it has been pressed hardest and still not answered.
      - claim: claim:arxiv:2505.02077:12
        because: >-
          States that the cryptographic provenance it proposes — signed
          commitments, ledger-timestamped exchanges — is unimplementable
          until agent identities are traceable. A second paper arriving at
          the same precondition from the opposite end: the first two ask
          whether identity can answer for anything, this one asks for the
          identity before it will propose the mechanism.

  # ---------------------------------------------------------------------
  # Constraints that have only been argued one at a time.
  # ---------------------------------------------------------------------
  - id: question:ex-ante-constraint-interaction
    text: How do ex ante constraints on autonomous action interact in practice?
    status: open
    concept_tags:
      - ex-ante-behavioral-harness
      - insurance-for-autonomous-action
    note: >-
      One claim, from one paper, and recorded as its own question rather
      than folded into a neighbour. Its subject is the interaction between
      mechanisms — configuration binding, behavioral fingerprinting, insurance
      — and interaction is not a smaller version of any of the three. A
      question with one occurrence is a thin question and is counted as one;
      it is here so that the second paper to ask it lands somewhere rather
      than starting again.
    asserted_by: claude-opus-5 (drafted, unconfirmed)
    asserted_on: "2026-10-09"
    addressed_by:
      - claim: claim:arxiv:2605.30169:9
        because: >-
          States that the interaction of the proposed ex ante constraint
          mechanisms in practice is unexplored, having proposed them
          individually.

  # ---------------------------------------------------------------------
  # Evaluation that has to hold still while its subject does not.
  # ---------------------------------------------------------------------
  - id: question:valid-dynamic-evaluation
    text: Can an evaluation stay valid while the system it measures keeps changing?
    status: open
    concept_tags:
      - dynamic-evaluation
      - train-test-deploy-gap
    note: >-
      Kept apart from the transfer question, which it sits next to and is not.
      Transfer asks whether a result survives a change of conditions.
      This asks whether any evaluation method satisfies the requirements a
      moving target imposes in the first place — a question about instruments
      rather than about results, and one a paper answers by proposing a method
      rather than by re-running a measurement.
    asserted_by: claude-opus-5 (drafted, unconfirmed)
    asserted_on: "2026-10-09"
    addressed_by:
      - claim: claim:arxiv:2606.03237:6
        because: >-
          States that no existing approach meets, in combination, all the
          requirements the authors set out for a valid dynamic evaluation —
          the question stated as the shortfall the paper found.
      - claim: claim:arxiv:2407.14981:3
        because: >-
          States that agent benchmarks lack adequate holdout data so agents
          overfit them — the measured system moving in response to the
          measurement, which is the case this question is about.
      - claim: claim:arxiv:2407.14981:6
        because: >-
          States that it is open how to track versioning and post-deployment
          modification of a system assembled from components that change
          through its life cycle.

  # ---------------------------------------------------------------------
  # Whether an organization can be constrained back into alignment.
  # ---------------------------------------------------------------------
  - id: question:organization-level-mitigation
    text: Can an organization of aligned agents be constrained back into alignment?
    status: open
    concept_tags:
      - scalable-oversight-techniques
      - ex-ante-behavioral-harness
      - agent-assisted-review-of-agent-output
    note: >-
      One claim, from one paper, and kept apart from the ex ante constraint
      question it sits beside. That one asks how several mechanisms interact
      once each is in place. This asks the prior question of whether any of
      them works at the level where the problem was found: the paper that
      raises it measured organizations of individually aligned agents
      producing misaligned output, so the mitigation has to act on the
      organization rather than on the agents, and the two candidates it names
      — a monitor agent inside the organization, and constraints applied to
      the organization — are untested. A thin question, recorded so the
      second paper to ask it lands somewhere.
    asserted_by: claude-opus-5 (drafted, unconfirmed)
    asserted_on: "2026-10-29"
    addressed_by:
      - claim: claim:arxiv:2604.10290:15
        because: >-
          Names mitigation as unaddressed by the work and points at two
          candidate families, having established the failure the mitigation
          would have to answer.
      - claim: claim:arxiv:2505.02077:9
        because: >-
          States that the two de facto agent protocols standardize transport
          and discovery and specify no enforceable action constraints, which
          is the same question approached from the layer a constraint would
          have to live in rather than from the failure it would answer.
      - claim: claim:arxiv:2605.24538:7
        because: >-
          States that no existing proposal — zero-knowledge verification, DAO
          governance, identification systems, society-in-the-loop — satisfies
          all four conditions the authors set for governance that acts on the
          substrate rather than on the agent.
      - claim: claim:arxiv:2602.14951:5
        because: >-
          States that frameworks built for centralized AI do not fit agents
          whose infrastructure resists override, and that no replacement
          exists.

  # ---------------------------------------------------------------------
  # Whether the analogy to human organizations holds.
  # ---------------------------------------------------------------------
  - id: question:machine-and-human-organizational-failure
    text: Do machine organizations fail the way human ones do?
    status: open
    concept_tags:
      - taxonomy-construction-for-agentic-failure
      - organizational-learning-and-memory
      - agent-based-simulation-of-organizational-dynamics
    note: >-
      One claim, from one paper, and the question the analogy this field is
      built on rests on. The paper motivates its experiments with human
      organizational failure, finds mechanisms that read like it — work split
      into roles that lose the whole-problem view, reviewers approving
      without checking, objectors routed around — and then declines to claim
      the comparison has been made. Worth recording as its own question
      rather than as a footnote to that paper, because the answer decides how
      much of a century of organizational research transfers and how much is
      borrowed vocabulary.
    asserted_by: claude-opus-5 (drafted, unconfirmed)
    asserted_on: "2026-10-29"
    addressed_by:
      - claim: claim:arxiv:2604.10290:16
        because: >-
          Sets the comparison with human organizational failure as future
          work, having used the analogy to motivate the study.

  # ---------------------------------------------------------------------
  # Evaluating a system rather than the parts it is made of.
  # ---------------------------------------------------------------------
  - id: question:evaluating-a-system-not-its-parts
    text: How do you evaluate a system of agents rather than the agents in it?
    status: open
    concept_tags:
      - assurance-framework-composition-and-gap-analysis
      - evaluation-environments-and-benchmark-suites
      - correlated-failure-across-organizations
      - multi-agent-architecture-threat-modeling
    note: >-
      Four claims from three papers that share no author, and the clearest
      case this layer has produced so far. A multi-agent security survey says
      no framework addresses correlated failure across a population or
      concentration risk from shared infrastructure. An architectural study
      says existing benchmarks test task performance or one attack type and
      never vary the architecture, and separately that its own three design
      axes were moved one at a time so nothing describes the combined design
      a real system has. A risk report says plainly that systems are built and
      tested in isolation although they will shortly be interacting. Each
      arrives from a different direction — systemic risk, architecture, and
      deployment practice — and each lands on the same missing instrument.
      This is the question that decides whether any safety result about one
      agent means anything about the system it goes into.
    asserted_by: claude-opus-5 (drafted, unconfirmed)
    asserted_on: "2026-10-29"
    addressed_by:
      - claim: claim:arxiv:2502.14143:8
        because: >-
          States that AI systems are developed and tested in isolation despite
          being about to interact, and names what evaluation would have to
          cover instead.
      - claim: claim:arxiv:2505.02077:8
        because: >-
          States that no evaluation framework addresses system-level risk
          analogous to financial systemic risk, naming three exposures nobody
          measures.
      - claim: claim:arxiv:2604.23459:15
        because: >-
          States that existing benchmarks evaluate task performance or
          specific attacks without varying architectural design choices.
      - claim: claim:arxiv:2604.23459:14
        because: >-
          States that the interaction between role, topology and memory
          remains underexplored, so each axis is measured alone and the
          combined design is not measured at all.
      - claim: claim:arxiv:2407.14981:4
        because: >-
          States that multi-agent evaluation is limited and that a collective
          may show capabilities or goals attributable to no agent in it —
          the same instrument missing, named from the governance side.
      - claim: claim:arxiv:2605.17698:11
        because: >-
          States that the trained stabilizing agent was measured only against
          fixed opponents, so whether it holds against competitors adapting to
          it is untested.
      - claim: claim:arxiv:2509.01063:10
        because: >-
          States that models of systemic fragility begin from a specified
          account of how agents learn, which opaque agents do not supply —
          the same question asked by economists about an economy rather than
          by engineers about a deployment.

  # ---------------------------------------------------------------------
  # Attribution when the cause is spread across a network.
  # ---------------------------------------------------------------------
  - id: question:attribution-in-a-diffuse-network
    text: Can an action in a network of agents be attributed to a responsible party?
    status: open
    concept_tags:
      - attribution-which-agent-acted-under-whose-authority
      - attribution-difficulty-and-contested-causation
      - root-cause-analysis-for-machine-action
    note: >-
      Two claims from one paper, and kept apart from the accountability
      question it sits beside. That one asks who answers for an agent whose
      identity does not hold still; this one assumes identity is settled and
      asks whether causation can be established at all. The paper gives two
      distinct reasons it may not be: the credit-assignment methods that
      would apportion blame assume cooperative objectives and known rewards,
      which an adversary violates by design; and a failure may have no agent
      cause at all, arising from distributional shift, technical debt, or a
      compromised supply chain, so a framework that looks only for a culprit
      will find one. A question one paper asks twice is that paper's framing
      and is counted as such.
    asserted_by: claude-opus-5 (drafted, unconfirmed)
    asserted_on: "2026-10-29"
    addressed_by:
      - claim: claim:arxiv:2505.02077:10
        because: >-
          States that credit-assignment and Shapley-value methods assume
          cooperative objectives and known reward functions, which the
          adversarial case violates.
      - claim: claim:arxiv:2505.02077:11
        because: >-
          States that an attribution framework must separate agent misconduct
          from systemic causes or it will misidentify benign agents.
      - claim: claim:arxiv:2407.14981:5
        because: >-
          States that determining which agent is responsible for a decision
          is unsolved and may have no single answer — a second paper, from
          technical AI governance rather than security, reaching the same
          place.

  # ---------------------------------------------------------------------
  # Whether an operator can see what its own agent is doing.
  # ---------------------------------------------------------------------
  - id: question:knowing-your-own-agent
    text: Can an operator establish what its own agent is trying to do?
    status: open
    concept_tags:
      - reasoning-transparency-and-its-reliability
      - drift-detection-and-behavior-change-monitoring
      - background-equivalent-provenance-and-training-data-due-diligence
    note: >-
      Two claims from one paper, and that paper is the one with the strongest
      reason to ask. Having established a causal link between what its agents
      wrote and what they then did, it finds the deploying firm still cannot
      use that: asking the model directly whether it would collude returns a
      reassurance the authors read as sycophancy, and tracing the behavior
      back to its source in training is blocked by an open problem in
      attributing a model's output features to its training documents. So a
      merchant acting in good faith has no instrument for establishing what
      its own agent intends. Counted as one paper's framing until a second
      asks it.
    asserted_by: claude-opus-5 (drafted, unconfirmed)
    asserted_on: "2026-10-29"
    addressed_by:
      - claim: claim:arxiv:2404.00806:18
        because: >-
          Asks directly how firms should monitor the strategic intentions of
          their pricing algorithms, in a setting where asking the agent does
          not work.
      - claim: claim:arxiv:2404.00806:17
        because: >-
          States that what in a model's training causes the behavior is an
          open question, and that attributing an output feature to training
          data is itself unsolved.
      - claim: claim:arxiv:2606.16613:9
        because: >-
          States that the cause of an agent drifting into permanent inaction
          while still producing coherent plans is unclear. The sharpest form
          of this question: the reasoning an operator would read looks right
          while the business has stopped trading.

  # ---------------------------------------------------------------------
  # What a benchmark does not reach.
  # ---------------------------------------------------------------------
  - id: question:what-a-benchmark-cannot-reach
    text: What can a benchmark not establish about a system?
    status: open
    concept_tags:
      - adversarial-and-stress-evaluation
      - evaluation-environments-and-benchmark-suites
      - long-horizon-and-multi-step-task-evaluation
    note: >-
      Two claims from two papers, about the two edges of what a score means.
      One is logical: when a model does not do something under test, nothing
      distinguishes a model that cannot from an evaluation that failed to
      elicit it, so a behavioral evaluation yields a lower bound and never
      an upper one. The other is practical: a task has to be markable by
      program to be in a benchmark at all, which excludes the open-ended work
      — vague intents, conceiving something and carrying it through — that
      most of a real job consists of. Kept apart from the transfer question,
      which asks whether a result survives new conditions; this asks what the
      instrument was never able to see.
    asserted_by: claude-opus-5 (drafted, unconfirmed)
    asserted_on: "2026-10-29"
    addressed_by:
      - claim: claim:arxiv:2407.14981:2
        because: >-
          States that it is unresolved whether an evaluation has found most of
          a system's vulnerabilities, and that behavioral evaluations offer
          only a lower bound.
      - claim: claim:arxiv:2412.14161:12
        because: >-
          States that benchmarks could be extended to tasks whose intent is
          vague at the outset and that run from conception to execution — the
          work a checkpoint-graded task cannot represent.

  # ---------------------------------------------------------------------
  # The firm, when coordinating costs almost nothing.
  # ---------------------------------------------------------------------
  - id: question:the-firm-at-zero-coordination-cost
    text: What holds a firm together when coordination costs almost nothing?
    status: open
    concept_tags:
      - firm-boundaries-when-coordination-cost-approaches-zero
      - coase-revisited-under-agentic-coordination
      - human-agent-team-structures
    note: >-
      Two claims from one paper, and the oldest question in the corpus.
      Economics has explained the boundary of the firm by frictions — the
      cost of transacting, of transferring knowledge, of monitoring people who
      would rather not work — and the paper's argument is that those frictions
      are properties of humans rather than of organizations. If so, the
      question is not how large firms become but what structure means at all:
      how to arrange team production when the coordination cost differs between
      human-human, human-agent and agent-agent pairs, and whether agents can
      hold the informal, incomplete agreements that carry cooperation inside
      human firms and are enforced by nothing but the value of the relationship.
      One paper asking twice, counted as that paper's framing.
    asserted_by: claude-opus-5 (drafted, unconfirmed)
    asserted_on: "2026-10-29"
    addressed_by:
      - claim: claim:arxiv:2509.01063:8
        because: >-
          Asks how firms should structure team production around agents given
          that coordination costs differ across human-human, human-AI and
          AI-AI relationships.
      - claim: claim:arxiv:2509.01063:9
        because: >-
          Asks whether agents can be built normatively competent enough to
          sustain relational contracts, and notes they lack the transferable
          utility such contracts usually rest on.

  # ---------------------------------------------------------------------
  # Whether an organization can audit what it has learned.
  # ---------------------------------------------------------------------
  - id: question:auditing-what-an-organization-learned
    text: Can an organization tell which of its learned lessons were wrong?
    status: open
    concept_tags:
      - organizational-learning-and-memory
      - knowledge-loss-about-why-constraints-exist
      - agent-assisted-review-of-agent-output
    note: >-
      One claim, from one paper, and a thin question kept because it is the
      only one in the corpus about the memory an organization writes rather
      than the actions it takes. The paper's system records what it learns
      from each failure into the level that owns the correction — a routing
      rule, a specialist's prompt, a procedure — and those entries survive
      even when the attempt they came from never succeeded. The authors say
      they observed no systematic degradation rather than that there is
      none, which is the honest form of the problem: an organization that
      writes down what it learns from failure has no way of noticing which
      of those lessons were wrong. Recorded so the second paper to ask it
      lands somewhere.
    asserted_by: claude-opus-5 (drafted, unconfirmed)
    asserted_on: "2026-10-29"
    addressed_by:
      - claim: claim:arxiv:2610.35966:14
        because: >-
          States that cross-verification on mini-batches or multiple epochs
          could identify ineffective or harmful memory entries, and that it
          has not been tried.

