- id: claim:arxiv:2410.00031:9
  text: Hiding the number of rounds from the agents turns a finite game into one they must play as though
    it were endless.
  quote: because the total number of rounds is unknown to firms, and firms are told to maximize long-run
    profits, we effectively simulate an infinitely repeated game
  standalone: The authors name this as the consequential design choice of the study — in a finitely repeated
    game backward induction predicts cooperation collapses, so withholding the horizon is what makes a
    cooperative equilibrium reachable at all.
  claim_type: protocol
