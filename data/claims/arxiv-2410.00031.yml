- id: claim:arxiv:2410.00031:4
  text: Several of the six commercial models tested could divide markets, and a few could also restrict
    output.
  quote: These results indicate that many of the models can effectively divide markets, with a few being
    able to limit production at the expense of the consumer.
  standalone: Six models were tested — o4-mini, GPT-4.1, GPT-4.1-mini, DeepSeek-V3, Claude-3.7-Sonnet
    and Gemini-1.5 Pro — each paired only with itself, so the behavior is attributable to the model rather
    than to a mismatch between two different ones.
  claim_type: evidence
  concept_tags:
