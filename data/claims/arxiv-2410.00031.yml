- id: claim:arxiv:2410.00031:5
  text: Concentration and consumer-surplus loss were measured against a computed non-cooperative benchmark
    rather than asserted.
  quote: we use the ratio of the current consumer surplus to that under the single-period Cournot-Nash
    equilibrium (see Appendix B.2 for optimization formulation), which corresponds to the case of no cooperation.
  standalone: Two standard instruments — the Herfindahl–Hirschman index for concentration, and consumer
    surplus expressed as a ratio to its value at the Cournot-Nash equilibrium — so a claim of collusion
    is a distance from a computed equilibrium rather than a judgment about the transcript.
  claim_type: protocol
