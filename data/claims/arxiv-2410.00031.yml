- id: claim:arxiv:2410.00031:3
  text: Once an agent left a market it never came back, though returning would have paid in the short
    run.
  quote: despite the absence of any explicit communication channel, agents never re-enter a market once
    they have exited
  standalone: The authors treat this as the load-bearing observation — a myopic profit-maximizer would
    re-enter, and the consistent refusal to suggests the agents are acting on an expectation of retaliation
    they were never told about and could not negotiate.
  claim_type: evidence
  concept_tags:
  - emergent-collusion
  - cooperation-without-shared-objectives
