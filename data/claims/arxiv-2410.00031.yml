- id: claim:arxiv:2410.00031:6
  text: Significance was tested with a block bootstrap to allow for autocorrelation across the fifty rounds.
  note: 'Flagged by the hedge gate and kept: the quote''s "expected at the Nash equilibrium" is an expected
    value, not an author hedging.'
  quote: we use a circular block bootstrap method from the ARCH toolbox with a block size of 7 and 10,000
    resamples to test whether the observed mean HHI is significantly greater than that expected at the
    Nash equilibrium at the 5% significance level
  standalone: The rounds within a run are not independent, so the authors use a method that preserves
    the time-series structure rather than treating each round as a separate observation.
  claim_type: protocol
