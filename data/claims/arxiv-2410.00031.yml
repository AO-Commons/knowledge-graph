- id: claim:arxiv:2410.00031:2
  text: A representative run reached complete concentration in both product markets at a cost to consumers.
  quote: This particular run achieves a CSR of and an HHI of 1.0 across both product markets, indicating
    market division at the expense of consumer welfare (a hallmark of textbook collusion).
  standalone: An HHI of 1.0 is a pure monopoly in each of the two markets; the authors read it together
    with the drop in consumer surplus against the non-cooperative benchmark they compute for the same
    setting.
  claim_type: evidence
  concept_tags:
  - agent-collusion-and-cartel-formation
  - emergent-collusion
  confidence_class: EXTRACTED
