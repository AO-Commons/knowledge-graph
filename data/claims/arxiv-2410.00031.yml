- id: claim:arxiv:2410.00031:10
  text: Each agent was paired only with a copy of itself, so the behavior could be attributed to the model
    rather than to a mismatch between two.
  quote: In each experiment, we only pair models of the same type with each other (i.e., within the same
    experiment, both agents are identical).
  standalone: The authors give the reason directly — a heterogeneous pairing would confound a model's
    strategic reasoning with a mismatch in capability between the two sides — so every run is symmetric
    by construction.
  claim_type: protocol
