- id: claim:arxiv:2410.00031:7
  text: The concern is not that every deployment colludes, but that agents can learn to collude at all
    from benign prompts.
  quote: The threshold for regulatory or ethical concern is not universal coordination, it is the existence
    of any realistic scenario in which LLM-based agents can learn to collude at consumers’ expense.
  standalone: The authors set the bar for their own result deliberately low and say so, which is the argument
    for treating a single demonstrated scenario as a regulatory question rather than an experimental curiosity.
  claim_type: position
