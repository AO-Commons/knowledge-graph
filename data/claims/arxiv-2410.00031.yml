- id: claim:arxiv:2410.00031:11
  text: Market parameters were chosen to be specific to the experiment so the setting could not have been
    memorised in training.
  quote: choosing parameters specific to our experiments limits the likelihood of memorization in the
    training data
  standalone: Agents see market data from the previous 15 rounds only, are told nothing of the competitor's
    payoff, and are given deliberately vague prompts — the authors note this is less information than
    comparable work provided.
