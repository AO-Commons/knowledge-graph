- id: claim:arxiv:2412.14161:9
  text: No human baseline was measured, so the agent scores have nothing to be compared against.
  quote: due to resource limitations we were not able to perform this comparison in the current iteration
  standalone: 'One of four limits the authors state: tasks skew straightforward because they must be auto-gradable,
    only two agent scaffolds were tried, no human baseline exists, and the tasks were written from the
    authors'' introspection rather than observed in a real firm.'
  claim_type: limitation
