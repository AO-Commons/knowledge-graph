- id: claim:arxiv:2412.14161:13
  claim_type: position
  text: A benchmark for real work has to be self-hosted and reproducible, or comparisons between methods
    do not hold over time.
  quote: In order to allow for careful comparisons between different methods that remain constant over
    time, the benchmark should be fully self-hosted and reproducible.
  standalone: 'The last of five desiderata the authors set before building: coverage across job categories,
    a requirement to interact with people, long-horizon tasks with granular checkpoints, interfaces spanning
    web, programs, terminal and chat, and self-hosting. They note existing benchmarks either ship no execution
    environment or depend on a third-party platform.'
  concept_tags:
  - reproducibility-of-failure-conditions
