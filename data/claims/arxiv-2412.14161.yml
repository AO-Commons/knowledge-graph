resource_id: resource:arxiv:2412.14161
claims:
- id: claim:arxiv:2412.14161:1
  text: The strongest model completed 30% of workplace tasks autonomously, at roughly 27 steps and $4
    each.
  quote: even with the strongest frontier model, it only manages to complete 30% of the total tasks and
    achieves a score of 39% taking into account partial completion credits
  standalone: Across 175 tasks in a simulated software company — software engineering, project management,
    finance, HR, administration — the best of the models tested finished under a third outright, at an
    average of nearly 27 LLM calls and more than $4 per task.
  claim_type: evidence
  concept_tags:
  - long-horizon-and-multi-step-task-evaluation
  - agent-performance-in-organizational-context
  confidence_class: EXTRACTED
