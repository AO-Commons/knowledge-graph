- id: claim:arxiv:2412.14161:2
  text: Agents scored worst on the tasks that required talking to colleagues and navigating professional
    software, which the authors suggest is a gap in communication skills.
  quote: most models struggle with RocketChat and ownCloud. RocketChat is where all social interaction
    with peers occurs, and the low scores suggest that LLMs still lack communication skills.
  standalone: The two platforms in the simulated company where an agent has to coordinate with a person
    or operate a web office suite were the ones every model handled worst, which the authors read as the
    characteristic difficulty of a real workplace rather than of the benchmark.
  claim_type: evidence
  concept_tags:
  - agent-performance-in-organizational-context
  - human-agent-team-structures
  confidence_class: EXTRACTED
