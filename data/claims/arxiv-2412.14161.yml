- id: claim:arxiv:2412.14161:7
  text: The benchmark's 175 tasks took about 3,000 person-hours to build, with every task reviewed and
    independently re-checked.
  quote: it took 20 computer science students, software engineers, and project managers over 2 months,
    consuming approximately 3,000 person-hours in total
  standalone: Each task required screenshot proof that its evaluator was valid and scored full marks on
    a correct solution, code review by a panel of lead authors, and a final pass in which someone who
    had not written the task checked that checkpoint weights were consistent across the whole benchmark.
  claim_type: protocol
