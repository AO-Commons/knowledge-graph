- id: claim:arxiv:2412.14161:6
  text: Tasks were scored at checkpoints, with partial credit and a bonus that only pays on full completion.
  quote: full task completion is strongly incentivized by incorporating an additional 50% credit, which
    is awarded only when all checkpoints are successfully completed
  standalone: 'Two capability metrics and two efficiency metrics: binary full completion, partial completion
    scaled to checkpoint points with the completion bonus, number of LLM calls, and API cost per task.'
  claim_type: protocol
