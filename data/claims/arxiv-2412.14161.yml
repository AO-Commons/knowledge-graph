- id: claim:arxiv:2412.14161:5
  text: A multi-agent scaffold scored half what a single-agent one did, losing progress at each delegation.
  quote: OpenHands CodeAct is a single agent that is better at maintaining consistency in a long-horizon
    task, while OWL RolePlay adopts multi-agent collaboration and experiences difficulty in preserving
    progress and context.
  standalone: 'On the same underlying model, the single agent scored 8.6% and the multi-agent scaffold
    4.0%. The authors trace it to delegation: the browsing agent often cannot finish inside its step limit,
    and when the main agent delegates again with a revised plan the browsing agent cannot resume where
    it left off.'
  claim_type: evidence
  concept_tags:
  - handoff-failures-between-agents-and-humans
  - orchestrator-and-sub-agent-patterns
  confidence_class: EXTRACTED
