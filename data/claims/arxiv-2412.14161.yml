- id: claim:arxiv:2412.14161:10
  text: Tasks had to be gradable by program, which excludes the open-ended work of a real job.
  quote: our tasks are generally on the more straightforward side due to the need to automatically evaluate
    with programs and test cases, and we do not cover more complex creative tasks such as brainstorming
    new product ideas or designing system architectures
  standalone: 'The constraint that makes the benchmark runnable is also what bounds what it can say: the
    30% figure is 30% of tasks a program can mark.'
  claim_type: limitation
  concept_tags:
