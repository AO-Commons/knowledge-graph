- id: claim:arxiv:2412.14161:3
  text: Tasks humans find harder to qualify for were easier for agents than administrative and financial
    ones.
  quote: there exists a gap between the perceived difficulty of the tasks for humans versus the difficulty
    for LLM agents
  standalone: 'Software engineering scored highest and data science, administration and finance lowest,
    with many models completing none of the latter. The authors attribute this to what models are trained
    on: coding benchmarks and abundant public code, against administrative and financial work that stays
    private inside firms.'
  claim_type: evidence
  concept_tags:
