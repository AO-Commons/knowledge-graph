- id: claim:arxiv:2412.14161:11
  text: Current agents fail a majority of the tasks, which the authors read as a large gap before an agent
    could do most of a human worker's job.
  quote: current state-of-the-art agents fail to solve a majority of the tasks, suggesting that there
    is a big gap for current AI agents to autonomously perform most of the jobs a human worker would do,
    even in a relatively simplified benchmarking setting
  standalone: The authors' own reading, offered against both the claim that most human labor is about
    to be automated and the claim that models cannot reason at all — the benchmark exists because neither
    side had an objective measure.
  claim_type: position
