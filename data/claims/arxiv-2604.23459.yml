- id: claim:arxiv:2604.23459:7
  text: Models with weaker safety training degraded far more under the same architectural change than
    well-aligned ones.
  quote: Weaker-aligned models degrade dramatically under the same architectural changes, with some showing
    4-fold increases in harmful task completion under specialization.
  standalone: The authors read this as architecture interacting with alignment — a strongly trained model
    can still detect harmful intent from a fragment, where a weaker one loses the ability to see it once
    the task is distributed.
  claim_type: evidence
