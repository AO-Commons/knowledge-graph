- id: claim:arxiv:2604.23459:14
  text: How role, topology and memory interact with each other has not been studied.
  quote: Our three design axes are varied independently in most experiments; the interaction effects between
    role configuration, topology, and memory, and with additional axes such as inter-agent communication
    protocols (e.g., A2A, MCP), remain underexplored.
  standalone: Each axis was moved on its own, so the results describe three separate effects rather than
    the combined design a real system has — and the authors name inter-agent protocols as a fourth axis
    nobody has varied at all.
