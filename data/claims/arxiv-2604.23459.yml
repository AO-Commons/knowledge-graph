- id: claim:arxiv:2604.23459:10
  text: Safety properties do not compose from the agents to the system they are arranged into.
  quote: our results provide evidence that safety properties do not compose straightforwardly from individual
    agents to multi-agent systems
  standalone: The authors' reading of their own result — a model that reliably refuses in isolation may
    enable the same harm once embedded in an architecture that fragments context, distributes authority,
    or separates who can see a task from who can act on it.
  claim_type: position
  concept_tags:
  - assurance-framework-composition-and-gap-analysis
  - emergence-in-agent-populations
