- id: claim:arxiv:2604.23459:3
  text: The riskiest communication topology in one environment was the safest in another.
  quote: Star topology is the riskiest on BrowserART but the safest multi-agent topology on RedCode-Gen
    and OS-Harm, where chain is the riskiest.
  standalone: The authors report no stable ranking of designs across environments, which is their argument
    against general architectural recommendations and for evaluating each deployment on its own.
  claim_type: evidence
