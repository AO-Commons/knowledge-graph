- id: claim:arxiv:2604.23459:5
  text: Splitting a task across specialists left no agent assessing the whole of it for harm.
  quote: specialists receive isolated instructions without visibility into the full harmful task, while
    orchestrators decompose tasks without safety evaluation, creating a responsibility gap where no agent
    performs end-to-end safety assessment
  standalone: The authors offer this as the mechanism behind their headline result — it explains why specialist
    configurations refuse less at the planning stage even when every agent in them has strong safety training.
  claim_type: evidence
  concept_tags:
  - function-to-agent-mapping-and-role-decomposition
  - responsibility-gaps-and-their-allocation
  confidence_class: EXTRACTED
  extracted_from: results
  extraction_method: claude-opus-5, drafted from arXiv full text under the gated process, 2026-10-29;
    every quote verified verbatim against the source
  review_status: machine-checked
  attribution: own
- id: claim:arxiv:2604.23459:6
  text: Agents passed processed output down a chain, which hid the harmful intent an agent seeing the
    whole task would have refused.
  quote: mesh agents see the complete harmful objective and can refuse independently, while chain agents
    receive processed outputs that mask harmful intent, explaining chain’s Planning Refusal collapse on
    RedCode-Gen (8.1% vs. 25.6% for star)
  standalone: Task visibility rather than connectivity is what the authors find decisive — the topology
    that let every agent see the whole objective produced three times the planning-stage refusal of the
    one that passed work along in steps.
  claim_type: evidence
  concept_tags:
  - handoff-failures-between-agents-and-humans
  - decision-legibility-for-reviewers
  confidence_class: EXTRACTED
