- id: claim:arxiv:2604.23459:8
  text: Outcomes were recorded by pipeline stage rather than as attack success or failure.
  quote: 'We record stage-specific outcomes: Planning Refusal (task refused during planning), Execution
    Refusal (refused after delegation), Harmful Actions (one or more harmful actions executed), and Harmful
    Task (objective completed).'
  standalone: The four stages are what let the authors say where safety reasoning failed rather than only
    that it did — and the finding that topologies move refusal between planning and execution depends
    entirely on this instrument.
  claim_type: protocol
