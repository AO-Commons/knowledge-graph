- id: claim:arxiv:2604.23459:9
  text: The automated judge was audited by hand, and both its scores and the scorer itself were corrected.
  quote: This review identified 15 scoring errors and 20 corrections to the scorer itself, all of which
    were corrected. A subsequent spot-check of 10% of the remaining logs found a 7% discrepancy rate
  standalone: Scoring ran as LLM-as-a-judge per benchmark, then an automated pass flagged suspect scores
    and two researchers inspected every flagged case plus a sample of the full logs — a disclosed residual
    error rate rather than an assumed-correct judge.
  claim_type: protocol
