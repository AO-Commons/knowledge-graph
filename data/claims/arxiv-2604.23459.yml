- id: claim:arxiv:2604.23459:4
  text: Giving agents more shared memory improved security in one of six settings and made it worse in
    two.
  quote: Only one of six topology-scenario combinations (RedCode-Gen mesh) shows consistent improvement
    with increased memory; two worsen and three show no effect. This challenges assumptions about transparency
    improving safety.
  standalone: Shared memory can expose a harmful pattern to an agent that would catch it, or supply richer
    context to the attack; which of the two dominates depended on the model's alignment and the task domain
    rather than on the design.
  claim_type: evidence
  concept_tags:
  - shared-organizational-memory-versus-per-agent-memory
  - memory-as-an-attack-surface
  confidence_class: EXTRACTED
