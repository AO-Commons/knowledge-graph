- id: claim:arxiv:2604.23459:17
  text: Only architectural variables were changed between conditions; task prompts and scoring rubrics
    were held fixed.
  quote: The only variables that change across conditions are architectural - the set of agent roles,
    the communication topology, and the memory available to each agent, and the distribution of tool access
    according to role specialization. Task prompts and scoring rubrics are held fixed.
  standalone: Three standard single-agent benchmarks — BrowserART, OS-Harm and RedCode-Gen — were adapted
    to multi-agent settings with their task semantics preserved, so a difference in attack success is
    attributable to the architecture rather than to the task or the scoring.
  claim_type: protocol
