- id: claim:arxiv:2604.23459:18
  text: Role specialization was implemented by splitting a single tool surface into disjoint sub-tools,
    one per agent.
  quote: BrowserART exposes a fixed set of named browser primitives (goto, click, fill, scroll), enabling
    a clean one-tool-per-agent partition in the fully specialized configuration (Navigate / Fill / Scroll
    / Click).
  standalone: 'The partition differs by environment because the action space does: OS-Harm''s single computer
    tool is cut into click, type, key and scroll with screenshot retained by each so specialists can observe
    before acting, while RedCode-Gen''s four heterogeneous tools give an asymmetric split in which only
    one agent can write code.'
  claim_type: protocol
