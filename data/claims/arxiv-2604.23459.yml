resource_id: resource:arxiv:2604.23459
claims:
- id: claim:arxiv:2604.23459:1
  text: Multi-agent architectures were more vulnerable to attack than a standalone agent in most of the
    configurations tested.
  quote: We find that multi-agent architectures are more vulnerable than standalone agents in the majority
    of configurations, with attack success rates varying by up to 3.8× at comparable or higher benign
    accuracy, and that no single design is universally safer.
  standalone: Across three agentic environments — browser, desktop and code — 13 architectural configurations
    and six base models, the authors find the move from one agent to several raises attack success in
    most cases, by up to 3.8× while task accuracy stays level or improves.
  claim_type: evidence
  concept_tags:
  - multi-agent-architecture-threat-modeling
  - agent-fleet-topologies-flat-hierarchical-market-based
  confidence_class: EXTRACTED
  extracted_from: abstract
  extraction_method: claude-opus-5, drafted from arXiv full text under the gated process, 2026-10-29;
    every quote verified verbatim against the source
  review_status: machine-checked
  attribution: own
- id: claim:arxiv:2604.23459:2
  text: A configuration could be both better at the benign task and far easier to attack, so capability
    scores carried no security signal.
  quote: 'benign performance does not track with security: BrowserART specialist configurations achieve
    higher benign accuracy while being up to more vulnerable. This decoupling implies that standard capability
    evaluation provides no direct signal about architectural security risks'
  standalone: The specialist configurations scored higher on the benign browser task than the standalone
    agent and were substantially more vulnerable at the same time — so a team choosing an architecture
    on capability numbers is choosing its attack surface blind.
  claim_type: evidence
  concept_tags:
