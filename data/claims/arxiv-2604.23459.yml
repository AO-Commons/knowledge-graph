- id: claim:arxiv:2604.23459:16
  text: When the agent that acts sits downstream of the agent that judges, the judgment can become advice
    rather than a constraint.
  quote: When agents with high execution authority are downstream from those responsible for safety reasoning
    (e.g., planners or critics), security judgments may become advisory rather than binding.
  standalone: 'The authors state the mechanism as a hypothesis before testing it: role separation distributes
    authority as well as work, and an executor holding the tools can act on a plan whose safety reasoning
    it is not bound by. They note centralizing authority instead trades this for a single point of failure.'
  claim_type: position
  concept_tags:
  - declared-authority-diverging-from-effective-authority
  - propose-versus-decide-versus-execute-separation
