- id: claim:arxiv:2604.23459:11
  text: Architecture should be treated as a security variable in its own right rather than as a backdrop
    to defenses.
  quote: This motivates treating architecture as a first-class security variable alongside traditional
    defenses.
  standalone: Drawn together with the authors' three stated implications — that security cannot be inferred
    from component evaluations, that a performance-improving choice can silently degrade it, and that
    the assessment has to be made per deployment.
