- id: claim:arxiv:2606.03237:16
  text: A learning problem exhibits endogenous non-stationarity when deploying a policy changes
    the transition dynamics or reward proxy through the response adaptations of other agents.
  quote: A learning problem exhibits endogenous non-stationarity when the deployment of policy
    induces changes in the transition dynamics or reward proxy through response adaptations
    of other agents.
  standalone: 'The authors'' Definition 3.1: a learning problem exhibits endogenous non-stationarity
    when deploying policy π induces changes in the transition dynamics P or the reward proxy
    R through the response adaptations of other agents, so that P_π(s′|s,a) ≠ P(s′|s,a). Physical
    laws may stay constant; what shifts is the state evolution the deployed system observes,
    as humans, institutions and algorithms adapt to it, and the environment becomes a Markov
    game rather than an exogenous Markov decision process.'
  claim_type: definition
  concept_tags:
  - endogenous-non-stationarity
  confidence_class: EXTRACTED
  extracted_from: other
