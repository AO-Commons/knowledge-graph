    audit against the full text, claude-opus-5-5, 2026-10-01 (evals/results/2026-10-01-statement-audit.md)
  review_status: machine-checked
  attribution: own
- id: claim:arxiv:2606.03237:6
  text: No existing evaluation approach yet meets, in combination, all the requirements the
    authors set out for a valid dynamic evaluation.
  quote: Recently evaluation research has engaged with dynamic evaluation but no approach
    yet meets all the requirements we articulate in combination
  standalone: 'The authors set out four requirements for a valid dynamic evaluation: counterparties
    that adapt strategically rather than randomly, in a pattern that keeps the score interpretable;
    a truncation of the regress in which counterparties model the system that models them;
    a specified equilibrium concept for the evaluation to target; and protocols that make
    scores comparable across runs, systems and counterparty populations. They judge that recent
    work meets these only in part: holistic and sociotechnical frameworks broaden metrics
    and scenarios; dangerous-capability and autonomous-task evaluations use counterparties
    that are typically scripted; and multi-agent testbeds, agentic economies and open-ended
    environments take a step forward by letting the system interact with a population of agents.'
  claim_type: gap
  concept_tags:
  - dynamic-evaluation
  - train-test-deploy-gap
  confidence_class: EXTRACTED
  extracted_from: other
  extraction_method: claude-opus-5, re-drafted from arXiv full text under the gated process,
    2026-09-12; every quote verified verbatim against the source. Revised after an independent
    audit against the full text, claude-opus-5-5, 2026-10-01 (evals/results/2026-10-01-statement-audit.md)
  review_status: machine-checked
  attribution: own
- id: claim:arxiv:2606.03237:7
  text: The shift the authors call for entails treating institutions as design primitives
    that restructure incentives at the pace of the systems they govern.
  quote: treating institutions as design primitives that restructure incentives at the pace
    of the systems they govern
  standalone: 'The authors call for treating institutions as design primitives that restructure
    incentives at the pace of the AI systems they govern, one of three directions alongside
    dynamic evaluation and preserving human agency. Section 5.2 gives instances within current
    AI pipelines: rubrics that co-evolve with the agent in place of RLHF''s fixed rewards;
    bidding, reputation and communication protocols in agentic marketplaces, which can be
    co-learned with mechanism-design objectives; and prediction markets that anchor a training
    signal to realized events rather than to a metric the system can game.'
  claim_type: position
  concept_tags:
  - institutional-design-for-agent-economies
  confidence_class: EXTRACTED
