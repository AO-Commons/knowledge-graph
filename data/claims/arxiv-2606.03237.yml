- id: claim:arxiv:2606.03237:11
  text: Decentralizing capability across many agents leaves the coordination problem in place,
    multiplies the points of failure and makes oversight harder.
  quote: Decentralizing capability across many agents does not eliminate the coordination
    problem; it multiplies the points of failure and makes oversight harder.
  standalone: 'An objection to multi-actor design that the authors state in order to rebut:
    economies of interacting actors introduce coordination failures that single aligned optimizers
    avoid, since they can race to the bottom, collude or deadlock; decentralizing capability
    multiplies the points of failure and makes oversight harder; so a well-aligned monolithic
    system offers more tractable safety guarantees than a poorly understood ecosystem of interacting
    ones.'
  claim_type: position
  concept_tags:
  - what-breaks-as-agent-count-grows
  confidence_class: EXTRACTED
  extracted_from: other
  extraction_method: claude-opus-5, deep pass over sections the first reading never reached,
