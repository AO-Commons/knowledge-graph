- id: claim:arxiv:2606.03237:5
  text: A dynamic evaluation is one whose test distribution depends on the evaluated policy
    through adaptive counterparties.
  quote: A dynamic evaluation is the one in which depends on through the responses of adaptive
    counterparties whose policies update as a function of ’s behavior
  standalone: 'The authors model an evaluation as a pair (D, μ): a test distribution D over
    interaction trajectories and a scoring functional μ. It is static if D is fixed independently
    of the evaluated policy π. It is dynamic if the test distribution D_π depends on π through
    the responses of adaptive counterparties whose policies update as a function of π''s behavior,
    so that the score μ(π; D_π) reflects the coupled system rather than π alone.'
  claim_type: definition
  concept_tags:
  - dynamic-evaluation
  confidence_class: EXTRACTED
  extracted_from: other
  extraction_method: claude-opus-5, re-drafted from arXiv full text under the gated process,
