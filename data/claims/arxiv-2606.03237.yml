  review_status: machine-checked
  attribution: own
- id: claim:arxiv:2606.03237:17
  text: The train-test-deploy gap is the systematic divergence between performance on exogenous
    historical data and performance on the endogenous data produced by responses to the deployed
    policy.
  quote: The train-test-deploy gap is the systematic divergence between performance under
    exogenous historical data and performance under endogenous data produced by responses
    to the deployed policy.
  standalone: 'The authors'' Definition 3.2: the divergence between a policy''s performance
    J_train, measured on exogenous historical data, and its performance J_deploy, under the
    endogenous data that other agents'' responses to the deployed policy produce. They argue
    that static evaluation, however broadened, leaves the gap in place as long as it does
    not account for the effect of the policy being evaluated.'
  claim_type: definition
  concept_tags:
  - train-test-deploy-gap
