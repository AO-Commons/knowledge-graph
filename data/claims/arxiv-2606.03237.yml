  review_status: machine-checked
  attribution: other
  attributed_to: an alternative view the authors state in order to rebut it
- id: claim:arxiv:2606.03237:12
  text: The real choice is between designs that acknowledge strategic interdependence and
    designs that defer it to deployment, when it is least tractable.
  quote: The actual choice is between systems that acknowledge strategic interdependence in
    their design and systems that defer this reckoning until deployment, when the dynamics
    are least tractable.
  standalone: 'Rebutting the objection that multi-actor designs fail worse, the authors argue
    the comparison is wrong: a monolithic optimizer still meets interaction dynamics at deployment,
    having been designed as if they did not exist.'
  claim_type: position
