- id: claim:arxiv:2606.03237:13
  text: A superintelligence born of the solipsistic approach to AI design, however capable
    a task solver, is unlikely to be cooperative.
  quote: We contend that superintelligence, an extremely capable task solver, born out of
    such a solipsistic approach to AI design, is unlikely to be cooperative.
  standalone: 'The authors contend that superintelligence, meaning an extremely capable task
    solver, is unlikely to be cooperative if it is built under the solipsistic approach to
    AI design: one anchored in the assumptions that the environment is exogenous to the agent''s
    policy, that the data distribution stays stationary from training to deployment, and that
    other agents are absorbed into the state space to be predicted rather than treated as
    strategic actors. Cooperation, for them, is the process by which a society coordinates
    to select beneficial equilibria and avoid harmful ones.'
  claim_type: position
  concept_tags:
  - cooperation-without-shared-objectives
  confidence_class: EXTRACTED
  extracted_from: abstract
  extraction_method: claude-opus-5-5, drafted from the arXiv full text, body read, 2026-10-01,
