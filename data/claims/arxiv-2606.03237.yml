  review_status: machine-checked
  attribution: own
- id: claim:arxiv:2606.03237:15
  text: An individual system may be perfectly aligned with a specification of desired behavior
    and still take part in collective dynamics that produce harm, instability or illegitimacy,
    even without overt misuse.
  quote: an individual may be perfectly aligned with such a specification and still participate
    in collective dynamics that produce harm, instability, or illegitimacy, even without overt
    misuse
  standalone: 'The authors argue that alignment research frames the hard problem as getting
    the objective right, and that this framing is unhelpful: a system may be aligned with
    its specification, values included, and still make things worse once it acts among other
    adaptive systems. Their examples, from the introduction, are recommenders optimized for
    engagement producing polarization, pricing algorithms that learn supracompetitive prices
    without explicit communication, and interacting automated order flow and liquidity provision
    of the kind seen in the Flash Crash.'
  claim_type: position
  concept_tags:
  - unintended-coordination-and-convergence
  - emergent-collusion
