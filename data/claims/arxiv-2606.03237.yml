    off against efficiency.
  quote: These constraints operate as feasibility bounds on admissible solutions, not as preferences
    to be weighed against efficiency.
  standalone: Arguing that even a system able to predict every adaptive response would still
    face the legitimacy constraints open societies impose, the authors hold that those constraints
    are feasibility bounds rather than one more objective to weigh.
  claim_type: position
  concept_tags:
  - sources-of-legitimate-machine-authority
