- id: claim:arxiv:2606.03237:18
  text: Keeping humans in the loop requires that they retain the skills, information and cognitive
    engagement needed to exercise meaningful authority, not only the formal authority to intervene.
  quote: Keeping humans in the loop requires that they retain the skills, information, and
    cognitive engagement needed to exercise meaningful authority, rather than only the formal
    authority to intervene.
  standalone: Part of the authors' case for preserving human agency as a design constraint.
    What humans learn, practice and come to rely on is shaped by the AI's presence, so the
    human capabilities a system meets on its next deployment are partly produced by its previous
    deployments. Systems that present options and defer to human judgment preserve the deliberative
    role that legitimacy requires; systems that optimize end to end risk making human participation
    nominal.
  claim_type: position
