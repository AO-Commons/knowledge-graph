- id: claim:arxiv:2606.03237:9
  text: An AI decision that is technically correct is still delegitimized by the absence of
    due process.
  quote: Even when an AI’s predictions or decisions are technically correct, the absence of
    due process delegitimizes the result, undermining the coordination that legal order provides.
  standalone: The authors argue that a functioning legal order rests on open, public and neutral
    procedures through which affected parties introduce private information, contest outcomes
    and demand justifications. Unilateral optimization by an AI system bypasses those procedures,
    imposing outcomes based on predictive accuracy and opaque logic rather than on public
    reasoning. So even when an AI's predictions or decisions are technically correct, the
    absence of due process delegitimizes the result and undermines the coordination that legal
    order provides.
  claim_type: position
  concept_tags:
  - contestability-as-a-legitimacy-condition
  - legitimacy-erosion-through-automation
  confidence_class: EXTRACTED
