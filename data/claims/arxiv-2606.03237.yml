- id: claim:arxiv:2606.03237:9
  text: An AI decision that is technically correct is still delegitimized by the absence of
    due process.
  quote: Even when an AI’s predictions or decisions are technically correct, the absence of
    due process delegitimizes the result, undermining the coordination that legal order provides.
  standalone: The authors argue that a functioning legal order depends on open, public procedures
    through which affected parties contest outcomes and demand justification, and that unilateral
    optimization bypasses them.
  claim_type: position
  concept_tags:
  - contestability-as-a-legitimacy-condition
  - legitimacy-erosion-through-automation
