- id: claim:arxiv:2606.03237:10
  text: Once a system tips into a degraded equilibrium, escaping it may be costly or impossible.
  quote: Once a system tips into a degraded equilibrium, escaping may be costly or impossible.
  standalone: Drawing on threshold and tipping-point models, which suggest that small differences
    can determine which equilibrium basin a coupled system settles into, the authors argue
    that introducing a powerful optimizer into a social system reshapes its payoff landscape,
    that deployment details such as timing, scale and interface design may shape which equilibrium
    is selected, and that once the system tips into a degraded equilibrium, network effects,
    infrastructure dependencies and behavioral habits may create lock-in, so that escaping
    may be costly or impossible.
  claim_type: position
  concept_tags:
  - unintended-coordination-and-convergence
  - phase-transitions-in-agent-system-behavior
  confidence_class: EXTRACTED
