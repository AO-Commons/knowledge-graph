- id: claim:arxiv:2606.03237:10
  text: A social system tipped into a degraded equilibrium may not be able to escape it at
    any acceptable cost.
  quote: Once a system tips into a degraded equilibrium, escaping may be costly or impossible.
  standalone: The authors argue that introducing a powerful optimizer reshapes the payoff
    landscape of a social system, that small deployment differences can decide which equilibrium
    it settles into, and that network effects and infrastructure dependencies can then lock
    it there.
  claim_type: position
  concept_tags:
  - endogenous-non-stationarity
  - unintended-coordination-and-convergence
