  review_status: machine-checked
  attribution: own
- id: claim:arxiv:2606.03237:4
  text: For an AI operating among other adaptive actors, the more aggressively it exploits
    historical regularities, the faster those actors adapt in ways that render the regularities
    obsolete.
  quote: For any AI operating in such environments, unilateral optimization is self-undermining.
    The more aggressively it exploits historical regularities, the faster other actors adapt
    in ways that render those regularities obsolete.
  standalone: 'Arguing from two hypothetical scenarios, competing AI restaurant-reservation
    systems and AI-assisted radiology, the authors hold that for any AI deployed among other
    intelligent actors unilateral optimization is self-undermining: the more aggressively
    it exploits historical regularities, the faster other actors adapt in ways that render
    those regularities obsolete. Section 3.2 adds that the effect varies with capability,
    and that for weakly capable systems the adaptations induced may be small.'
  claim_type: position
  concept_tags:
  - endogenous-non-stationarity
  - feedback-loops-between-agents
