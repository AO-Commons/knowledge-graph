- id: claim:arxiv:2606.03237:3
  text: Deploying an AI system induces endogenous non-stationarity, producing a train-test-deploy
    gap.
  quote: Deploying AI systems induces endogenous non-stationarity, resulting in a train–test–deploy
    gap where historical distributions diverge from the deployment context
  standalone: 'The authors argue that deploying AI systems induces endogenous non-stationarity:
    humans, institutions and other AI systems adapt in response to the deployed system, so
    historical distributions diverge from the deployment context. They call the result the
    train-test-deploy gap. They add that for weakly capable systems the induced adaptations
    may be small and the performance gap could stay within bounds.'
  claim_type: position
  concept_tags:
  - endogenous-non-stationarity
  - train-test-deploy-gap
  confidence_class: EXTRACTED
