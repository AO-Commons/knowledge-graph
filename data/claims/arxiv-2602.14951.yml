- id: claim:arxiv:2602.14951:5
  text: Governance frameworks built for centralized AI do not fit agents whose infrastructure resists
    override, and no replacement exists.
  quote: The governance frameworks developed for centralized AI systems are inadequate to this new configuration
    of autonomy and control. New theoretical frameworks, empirical research, and institutional innovations
    are needed to address the challenges that infrastructural sovereignty presents.
  standalone: The authors state the emergence is ongoing rather than hypothetical, and expect proliferation
    as the supporting infrastructure becomes more accessible.
  claim_type: gap
