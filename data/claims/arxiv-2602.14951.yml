# Five claims from a conceptual paper whose body surveys sovereignty theory
# and the decentralized infrastructure stack. See arxiv-2505.02077.yml.
resource_id: resource:arxiv:2602.14951
claims:
- id: claim:arxiv:2602.14951:1
  text: Agentic sovereignty is an agent's capacity to persist, act and control resources with non-overrideability
    inherited from its infrastructure.
  quote: what we describe as agentic sovereignty – the capacity of an operational agent to persist, act,
    and control resources with non-overrideability inherited from the infrastructures in which they are
    embedded
  standalone: 'The authors locate the property in the substrate rather than in the agent: cryptographic
    self-custody, decentralized execution environments and protocol-mediated continuity are what make
    an agent hard to stop, so the sovereignty is inherited rather than designed into the agent.'
  claim_type: definition
  concept_tags:
  - agent-operated-versus-agent-governed-versus-agent-constituted
  - halting-autonomous-operation-under-duress
  confidence_class: EXTRACTED
