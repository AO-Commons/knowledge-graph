- id: claim:arxiv:2602.14951:3
  text: At each layer of the stack, the party providing infrastructure has legitimate grounds not to answer
    for the layers above it.
  quote: At each layer, the party providing infrastructure has legitimate grounds for not bearing accountability
    for layers above, and the technical design systematically eliminates the observability and controllability
    that traditional accountability requires.
  standalone: 'The authors trace the stack from physical cables through internet protocols, blockchain
    networks, DePIN coordination and TEE enclaves to the agent. The diffusion is not evasion: each refusal
    is defensible on its own, and the result is that no layer answers for the whole.'
  claim_type: position
  concept_tags:
  - responsibility-gaps-and-their-allocation
  - no-identifiable-accountable-party
  confidence_class: EXTRACTED
  extracted_from: conclusion
  extraction_method: claude-opus-5, drafted from arXiv full text under the gated process, 2026-10-29;
    every quote verified verbatim against the source
