  attribution: own
- id: claim:arxiv:2602.14951:2
  text: Sovereignty exists on a spectrum set by infrastructural hardness — how far the underlying systems
    resist intervention or collapse.
  quote: sovereignty in such systems exists on a spectrum determined by infrastructural hardness—the degree
    to which underlying technical systems resist intervention or collapse
  standalone: A graded property rather than a line, which lets the same question be asked of a conventional
    deployment and an agent running in a trusted execution environment on a decentralized physical infrastructure
    network.
  claim_type: definition
  concept_tags:
  - ungoverned-infrastructure-as-escape-path
  - kill-switch-design-and-its-failure-modes
  confidence_class: EXTRACTED
