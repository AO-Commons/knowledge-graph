- id: claim:arxiv:2602.14951:4
  text: Infrastructural sovereignty may increase resilience, and the same hardness defeats human-in-the-loop
    control.
  quote: 'While infrastructural sovereignty may increase resilience, it also produces a profound accountability
    gap: responsibility diffuses across designers, infrastructure providers, protocol governance, and
    economic participants, undermining traditional oversight mechanisms such as human-in-the-loop control
    or platform moderation.'
  standalone: The authors treat non-terminability as the governance problem rather than as a feature or
    a bug — an agent that cannot be stopped by its designer is also an agent that cannot be stopped by
    anyone who should be able to.
  claim_type: position
  concept_tags:
  - halting-autonomous-operation-under-duress
  - circuit-breakers-and-pause-authority
  confidence_class: EXTRACTED
