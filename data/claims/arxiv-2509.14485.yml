- id: claim:arxiv:2509.14485:19
  text: Reducing the sparsity of the meta-features that annotate task demands would increase
    confidence in inferred capabilities and reduce the risk of competitors exploiting weaknesses
    in the evaluation framework.
  quote: Reducing sparsity would increase confidence in inferred capabilities and reduce the
    risk of competitors exploiting weaknesses in the evaluation framework.
  standalone: In the Melting Pot contest only a handful of scenarios exercise some cooperation
    demands, which leaves the corresponding ability estimates broad. The authors argue that
    annotating future competitions' scenarios with less sparse demand meta-features would
    make inferred capabilities more certain and reduce the risk of competitors exploiting
    weaknesses in the evaluation framework.
  claim_type: position
