    audit against the full text, claude-opus-5-5, 2026-10-01 (evals/results/2026-10-01-statement-audit.md)
  review_status: machine-checked
  attribution: own
- id: claim:arxiv:2509.14485:3
  text: 'Higher-scoring Melting Pot contest entries have significantly higher base-chance
    rates: they are more likely to perform better when prosocial demands are absent.'
  quote: The plot shows that higher-scoring entries have significantly higher base chance
    rates; that is, they are more likely to perform better when prosocial demands are absent.
  standalone: 'In the Measurement Layout fitted to each Melting Pot contest entry, base chance
    is the entry''s inferred probability of success when no specific cooperation demand is
    present. Among entries whose layouts reached R² > 0.25, higher-scoring entries had significantly
    higher base chance: they were more likely to perform better in scenarios where the modeled
    prosocial demands were absent.'
  claim_type: finding
