- id: claim:arxiv:2509.14485:18
  text: The authors recommend that future competitions incorporate better-formulated meta-features
    to characterize task demands while avoiding duplicate demands.
  quote: Based on our findings, we recommend that future competitions incorporate better-formulated
    meta-features to characterise task demands while avoiding duplicate demands.
  standalone: Drawn from the Melting Pot contest, whose 51 test scenarios were annotated with
    16 binary cooperation demands. Some of those demands mark exactly the same scenarios (partner
    choice, time pressure and ostracism; teaching and sanctioning), and after removing duplicates
    and the demands not negatively correlated with score, seven remained. The authors recommend
    that future competitions characterize task demands with better-formulated meta-features
    that avoid duplicates, are negatively correlated with performance if they are to indicate
    task difficulty, and are less sparse.
  claim_type: position
  concept_tags:
  - evaluation-environments-and-benchmark-suites
  confidence_class: EXTRACTED
