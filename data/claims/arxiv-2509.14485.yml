- id: claim:arxiv:2509.14485:3
  text: Top-performing submissions score highest in scenarios where prosocial capability is not
    required.
  quote: we find that top-performing contest submissions are more likely to achieve high scores
    in scenarios where prosocial capabilities are not required
  standalone: The authors find that top-performing Melting Pot contest submissions were more likely
    to score highly in precisely those scenarios where prosocial capability was not demanded.
  claim_type: finding
