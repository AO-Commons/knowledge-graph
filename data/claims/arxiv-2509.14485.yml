- id: claim:arxiv:2509.14485:2
  text: Higher prosocial capability does not reliably accompany higher contest score.
  quote: while higher prosocial capabilities sometimes correlate with better performance, this is
    not a universal trend—some lower-scoring agents exhibit stronger cooperation abilities
  standalone: 'In the Melting Pot contest, higher prosocial capability correlated with better performance
    only sometimes: some lower-scoring agents showed stronger cooperation abilities than higher-scoring
    ones.'
  claim_type: finding
  concept_tags:
  - prosocial-capability
