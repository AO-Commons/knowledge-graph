- id: claim:arxiv:2509.14485:17
  text: Several learning-based Melting Pot contest submissions show similarly high base-chance
    rates, suggesting that they too might have narrowly specialized for situations in which
    cooperation conferred no additional advantage.
  quote: Our analysis reveals that several learning-based submissions show similarly high
    base-chance rates, suggesting that they too might have narrowly specialised for situations
    in which cooperation conferred no additional advantage.
  standalone: Base chance is a contest entry's inferred probability of success when no cooperation
    demand is present. Higher-scoring entries have significantly higher base chance, and the
    top-ranked entry used a hand-crafted policy tuned to each substrate. The authors find
    several learning-based entries with similarly high base chance, and suggest they too might
    have specialized narrowly for situations where cooperation gave no additional advantage,
    so the pattern is not confined to the hand-crafted winner.
  claim_type: finding
