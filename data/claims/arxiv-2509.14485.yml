resource_id: resource:arxiv:2509.14485
claims:
- id: claim:arxiv:2509.14485:1
  text: Capability profiles inferred with Measurement Layouts for Melting Pot contest entries
    predict the entries' future performance within the Melting Pot suite.
  quote: We show that these capability profiles not only predict future performance within
    the Melting Pot suite but also reveal the underlying prosocial abilities of agents
  standalone: The authors fit a Measurement Layout, a hierarchical Bayesian model from prior
    work (Burden et al. 2023), to each Melting Pot contest entry using 80% of its scores,
    averaged over five-episode blocks across 51 held-out scenarios, and predict the remaining
    20%. The profiles beat a mean-score baseline for most entries and give predictive accuracy
    the authors call competitive with linear-regression, XGBoost and tabPFN assessors, but
    predictive power is low for several entries.
  claim_type: finding
  concept_tags:
  - capability-profiling
  confidence_class: EXTRACTED
  extracted_from: abstract
  extraction_method: claude-opus-5, re-drafted from arXiv full text under the gated process,
    2026-09-12; every quote verified verbatim against the source. Revised after an independent
    audit against the full text, claude-opus-5-5, 2026-10-01 (evals/results/2026-10-01-statement-audit.md)
  review_status: machine-checked
  attribution: own
- id: claim:arxiv:2509.14485:2
  text: Higher prosocial capability does not reliably accompany higher contest score.
  quote: while higher prosocial capabilities sometimes correlate with better performance,
    this is not a universal trend—some lower-scoring agents exhibit stronger cooperation abilities
  standalone: 'Among Melting Pot contest entries whose Measurement Layouts reached R² > 0.25,
    higher-scoring entries tended to have higher probabilities of some abilities, but not
    consistently: some lower-scoring entries had significantly higher convention-following
    and reciprocity ability than some higher-scoring entries, some had higher prosocial-newcomers
    ability, and teaching, forgiveness and time-pressure abilities did not differ significantly
    between entries.'
  claim_type: finding
  concept_tags:
  - prosocial-capability
  confidence_class: EXTRACTED
  extracted_from: abstract
  extraction_method: claude-opus-5, re-drafted from arXiv full text under the gated process,
