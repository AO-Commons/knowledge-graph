- id: claim:arxiv:2509.14485:15
  text: Some high-scoring Melting Pot contest agents may succeed not because of their prosocial
    abilities but because of general competence, or an ability to complete tasks without the
    specific prosocial capabilities the measurement layouts capture.
  quote: This suggests that some high-scoring agents succeed not because of their prosocial
    abilities but rather because of general competence or an ability to complete tasks without
    relying on the specific prosocial capabilities captured by the measurement layouts.
  standalone: The authors' reading of their base-chance result. Higher-scoring contest entries
    are significantly more likely to perform better when prosocial demands are absent, which
    the authors take to suggest that some high-scoring agents succeed through general competence,
    or by completing tasks without the specific prosocial capabilities their models capture,
    rather than through prosocial ability.
  claim_type: position
  concept_tags:
