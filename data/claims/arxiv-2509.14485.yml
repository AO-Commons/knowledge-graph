- id: claim:arxiv:2509.14485:4
  text: It is plausible that leading Melting Pot contest submissions gained much of their
    edge by excelling in scenarios that did not reward prosocial ability, thereby exploiting
    a weakness in the evaluation framework.
  quote: It is then plausible that the leading submissions gained much of their edge by excelling
    in scenarios that did not reward prosocial ability, thereby exploiting a weakness in the
    evaluation framework
  standalone: 'The authors'' inference from three observations: higher-scoring contest entries
    had significantly higher base-chance rates, so they did better when prosocial demands
    were absent; the competition report says the single top-ranked entry used a hand-crafted
    policy tuned to each substrate; and several learning-based entries had similarly high
    base-chance rates. From these they judge it plausible that leading entries gained much
    of their edge in scenarios that did not reward prosocial ability. The abstract puts it
    more cautiously: at least one top-performing team may have optimized for conditions where
    cooperation was not necessary.'
  claim_type: position
