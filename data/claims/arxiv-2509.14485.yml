- id: claim:arxiv:2509.14485:14
  text: For several Melting Pot contest submissions, both the assessor models and the Measurement
    Layouts have low predictive power.
  quote: We also observe that for several submissions, both the assessor models and the measurement
    layouts exhibit low predictive power.
  standalone: The authors compare Measurement Layouts with three assessor models (linear regression,
    XGBoost and tabPFN) that take the same binary cooperation demands as input, on held-out
    score data from the Melting Pot contest. Both kinds of model beat a mean-score baseline
    for most entries, but for several entries both predict poorly. The authors suggest the
    demands may not be informative enough for those entries, or that other latent factors
    drive their performance, and analyze ability profiles only for entries where the measurement
    layout reached R² > 0.25.
  claim_type: finding
  concept_tags:
  - capability-profiling
  confidence_class: EXTRACTED
