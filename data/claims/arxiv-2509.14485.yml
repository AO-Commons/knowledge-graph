- id: claim:arxiv:2509.14485:13
  text: 'To infer the cooperation capabilities of Melting Pot contest entries, the authors
    construct a measurement layout: a hierarchical Bayesian model that estimates an entry''s
    normalized score in different scenarios from the demands those scenarios impose.'
  quote: To infer the cooperation capabilities of submitted entries, we construct measurement
    layout, i.e. a hierarchical Bayesian model, that estimates the Min-Max normalised score
    in different scenarios based on the demands they impose.
  standalone: 'The authors fit a separate measurement layout to each contest entry. It has
    one latent ability per retained binary cooperation demand (seven of the sixteen the contest
    annotated: prosocial newcomers, visitor, time pressure, convention following, teaching,
    forgiveness and reciprocity), plus a base-chance parameter that sets the probability of
    success where a demand is absent. Abilities are non-compensatory, so the per-demand success
    probabilities are multiplied. Observed min-max normalized scores are modeled as Beta-distributed,
    and the model is fit with PyMC''s No-U-Turn Sampler. Measurement Layouts come from prior
    work (Burden et al. 2023); this paper applies them to a multi-agent contest.'
  claim_type: method
  concept_tags:
  - capability-profiling
  confidence_class: EXTRACTED
  extracted_from: method
  extraction_method: claude-opus-5-5, drafted from the arXiv full text, body read, 2026-10-01,
