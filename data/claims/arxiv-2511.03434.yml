    and untrustworthiness such as prompt injection, sycophancy, biases, nudge-susceptibility,
    hallucination, deception, and misalignment
  standalone: The paper reports, citing recent AI safety studies, that state-of-the-art LLM
    agent frameworks exhibit prompt injection, sycophancy, bias, nudge-susceptibility, hallucination,
    deception and misalignment.
