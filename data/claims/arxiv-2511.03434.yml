- id: claim:arxiv:2511.03434:12
  text: 'Two requirements hold at every level of assurance: least privilege at the capability boundary
    and evidence-first accountability at the audit boundary.'
  quote: 'Two invariants span all tiers: (i) least privilege at the capability boundary (minimal,
    time-boxed powers), and (ii) evidence-first accountability at the audit boundary (signed state
    and reproducible logs enabling independent verification)'
  standalone: 'The authors propose that across all four risk tiers of their blueprint, two invariants
    hold: least privilege at the capability boundary, and evidence-first accountability at the audit
    boundary through signed state and reproducible logs.'
  claim_type: position
