resource_id: resource:arxiv:2511.03434
claims:
- id: claim:arxiv:2511.03434:1
  text: Traditional internet trust mechanisms assume static human-operated services and cannot meet
    the coordination needs of large-scale agent ecosystems.
  quote: Traditional internet trust mechanisms (e.g., DNS names, TLS certificates) assume relatively
    static, human-operated services and an ownership-based trust model, which cannot meet the millisecond-by-millisecond
    dynamic coordination and verification needs of large-scale AI agentic ecosystems
  standalone: Citing Raskar et al. (2025), the authors open by noting that DNS names and TLS certificates
    assume relatively static, human-operated services and an ownership-based trust model, and cannot
    meet the millisecond-scale coordination and verification needs of large-scale AI agent ecosystems.
  claim_type: background
  concept_tags:
  - trust-bootstrapping-for-new-agents
  confidence_class: EXTRACTED
