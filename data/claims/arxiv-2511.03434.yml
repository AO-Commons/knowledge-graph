- id: claim:arxiv:2511.03434:3
  text: 'Six trust models are available to inter-agent protocol design: Brief, Claim, Proof,
    Stake, Reputation and Constraint.'
  quote: 'This paper presents a comparative study of trust models in inter‑agent protocol
    design: Brief (self‑ or third‑party verifiable claims), Claim (self-proclaimed capabilities
    and identity, e.g. AgentCard), Proof (cryptographic verification'
  standalone: The paper compares six trust models available to inter-agent protocol design
    — Brief, Claim, Proof, Stake, Reputation and Constraint — analyzing each for assumptions,
    attack surfaces and trade-offs.
