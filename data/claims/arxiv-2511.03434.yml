resource_id: resource:arxiv:2511.03434
claims:
- id: claim:arxiv:2511.03434:1
  text: Traditional internet trust mechanisms assume static, human-operated services and cannot
    meet the coordination needs of large-scale agent ecosystems.
  quote: Traditional internet trust mechanisms (e.g., DNS names, TLS certificates) assume
    relatively static, human-operated services and an ownership-based trust model, which cannot
    meet the millisecond-by-millisecond dynamic coordination and verification needs of large-scale
    AI agentic ecosystems.
  standalone: The paper argues that DNS names and TLS certificates rest on an ownership-based
    trust model built for static, human-operated services, which cannot meet the millisecond-by-millisecond
    verification needs of an ecosystem of autonomous AI agents.
  claim_type: background
  topic_codes:
  - '5.3'
  - '2.7'
  confidence_class: EXTRACTED
  extracted_from: introduction
  extraction_method: claude-opus-5, three-pass over arXiv full text, 2026-08-13
  review_status: unreviewed
- id: claim:arxiv:2511.03434:2
  text: State-of-the-art LLM agent frameworks exhibit prompt injection, sycophancy, nudge-susceptibility,
    hallucination, deception and misalignment.
  quote: even state-of-the-art large language model (LLM)-based agent frameworks exhibit fragilities
    and untrustworthiness such as prompt injection, sycophancy, biases, nudge-susceptibility,
    hallucination, deception, and misalignment
  standalone: The paper cites AI safety research finding that current large language model
    agent frameworks exhibit fragilities including prompt injection, sycophancy, biases, nudge-susceptibility,
    hallucination, deception and misalignment.
  claim_type: background
