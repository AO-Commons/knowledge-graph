- id: claim:arxiv:2511.03434:4
  text: 'The paper compares six trust models: Brief, Claim, Proof, Stake, Reputation and Constraint.'
  quote: 'This paper presents a comparative study of trust models in inter‑agent protocol
    design: Brief (self‑ or third‑party verifiable claims), Claim (self-proclaimed capabilities
    and identity, e.g. AgentCard), Proof (cryptographic verification, including zero‑knowledge
    proofs and trusted execution environment attestations), Stake (bonded collateral with
    slashing and insurance), Reputation (crowd feedback and graph‑based trust signals), and
    Constraint (sandboxing and capability bounding).'
  standalone: The paper's contribution is a comparative study of six trust models used in
    inter-agent protocol design — Brief, Claim, Proof, Stake, Reputation and Constraint —
    analysing the assumptions, attack surfaces and trade-offs of each.
  claim_type: method
  topic_codes:
  - '5.3'
  - 5.3.1
  confidence_class: EXTRACTED
  extracted_from: abstract
  extraction_method: claude-opus-5, three-pass over arXiv full text, 2026-08-13
  review_status: unreviewed
- id: claim:arxiv:2511.03434:5
  text: No single trust mechanism is sufficient on its own.
  quote: Our findings indicate no single mechanism suffices.
  standalone: The paper's central finding across its comparison of six trust models is that
    none of them suffices alone.
  claim_type: finding
  topic_codes:
  - '5.3'
  confidence_class: EXTRACTED
