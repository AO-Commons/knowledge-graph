- id: claim:arxiv:2511.03434:11
  text: A signed authorization proves that an action was permitted, not that the reasoning which produced
    it was sound.
  quote: mandate proofs attest authorization, not correctness of upstream agent reasoning (so LLM
    hallucinations must be contained by separate constraints)
  standalone: Assessing the Agent Payments Protocol, the authors note that its signed mandates prove
    an action was authorized but say nothing about whether the agent's upstream reasoning was correct,
    so hallucination has to be contained by separate constraints.
  claim_type: limitation
  concept_tags:
  - proof-of-authorized-execution
