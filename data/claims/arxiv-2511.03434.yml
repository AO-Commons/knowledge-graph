- id: claim:arxiv:2511.03434:3
  text: The trust models underlying inter-agent protocols had not been systematically analysed.
  quote: However, there has been little systematic analysis of the trust models underlying
    these protocols.
  standalone: As of this paper, the trust assumptions built into A2A, AP2, ERC-8004 and similar
    inter-agent protocols had received little systematic analysis.
  claim_type: background
  topic_codes:
