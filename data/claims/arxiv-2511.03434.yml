- id: claim:arxiv:2511.03434:8
  text: A proof can establish what a computation did but not whether doing it was desirable, so correct-but-misaligned
    behavior remains a governance problem.
  quote: proofs attest properties of computations, not normative desirability, so misaligned but formally
    correct behavior remains a governance problem
  standalone: The authors argue that cryptographic proofs attest properties of a computation rather
    than its normative desirability, leaving formally correct but misaligned agent behavior as a governance
    problem rather than a technical one.
  claim_type: limitation
