    links to off-chain metadata such as an AgentCard, enabling portable identification across contexts
  standalone: Describing Ethereum's ERC-8004 proposal, the authors note that an on-chain identity
    registry gives each agent a persistent handle linked to off-chain metadata, making identification
    portable across contexts.
  claim_type: background
