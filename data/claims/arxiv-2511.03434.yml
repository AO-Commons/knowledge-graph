resource_id: resource:arxiv:2511.03434
claims:
- id: claim:arxiv:2511.03434:1
  text: Traditional internet trust mechanisms assume static human-operated services and cannot
    meet the coordination needs of large-scale agent ecosystems.
  quote: Traditional internet trust mechanisms (e.g., DNS names, TLS certificates) assume
    relatively static, human-operated services and an ownership-based trust model, which cannot
    meet the millisecond-by-millisecond dynamic coordination and verification needs of large-scale
    AI agentic ecosystems
  standalone: The authors argue that traditional internet trust mechanisms such as DNS and
    TLS assume static, human-operated services and cannot meet the dynamic coordination needs
    of large-scale agent ecosystems.
  claim_type: background
  concept_tags:
  - trust-bootstrapping-for-new-agents
  confidence_class: EXTRACTED
