- id: claim:arxiv:2511.03434:5
  text: High-impact agent actions should be gated by cryptographic proof and bonded stake rather than
    by reputation or self-declared claims.
  quote: We argue for trustless‑by‑default architectures anchored in Proof and Stake to gate high‑impact
    actions, augmented by Brief for identity and discovery and Reputation overlays for flexibility
    and social signals
  standalone: The authors argue for trustless-by-default inter-agent architectures anchored in Proof
    and Stake to gate high-impact actions, with reputation relegated to an overlay for flexibility
    and social signal.
  claim_type: position
  concept_tags:
  - stake-based-trust
