- id: claim:arxiv:2502.14143:10
  text: Because AI systems can be copied, multi-agent settings are intrinsic to the technology rather
    than a later development.
  quote: A fundamental fact about (software-based) AI systems is that they can be easily duplicated. Thus,
    the vast training costs involved in producing state-of-the-art systems can be amortized over millions
    of instances.
  standalone: The authors draw the conclusion that the concept of multi-agent systems is core to transformative
    AI — the economics of training push towards many instances of one system, which is a population whether
    or not it was designed as one.
  claim_type: position
