- id: claim:arxiv:2502.14143:9
  text: Seven risk factors are named as largely independent of what the agents are each trying to do.
  quote: 'Information asymmetries (Section 3.1): private information can lead to miscoordination, deception,
    and conflict;'
  standalone: The first of seven the report sets out as an agenda — alongside network effects, selection
    pressures, destabilizing dynamics, commitment and trust, emergent agency, and multi-agent security.
    The authors note these are not specific to AI, but that the differences between AI agents and other
    intelligent actors give them different instances and different remedies.
  claim_type: position
