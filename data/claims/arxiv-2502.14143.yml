- id: claim:arxiv:2502.14143:5
  text: Collusion between AI agents may have no ascribable intent, may be lawful, and may not divide cleanly
    into explicit and tacit.
  quote: for more basic AI systems (such as algorithmic trading agents) it may be hard to ascribe any
    notion of intent to collude
  standalone: 'Three ways the authors say AI collusion departs from the classic notion: intent may not
    be ascribable, existing law may not yet reach it, and the explicit/tacit distinction may break down
    for agents whose communication does not resemble ours — correlation between two decisions requires
    information transfer, but that can come from a common cause rather than a message.'
  claim_type: definition
  concept_tags:
