# Eleven claims from a 144-section report, for the reason given at the head of
# arxiv-2505.02077.yml: this is a survey whose body summarises other people's
# results, and arXiv's LaTeXML strips the citation markers that would say
# whose. Held here is what the report asserts on its own account — its
# taxonomy of failure modes, its scope decisions, and its agenda.
resource_id: resource:arxiv:2502.14143
claims:
- id: claim:arxiv:2502.14143:1
  text: Multi-agent risks are distinct from single-agent ones and will not necessarily be addressed by
    work on the latter.
  quote: these risks are distinct from those posed by single agents or less advanced technologies, and
    will not necessarily be addressed by efforts to mitigate the latter
  standalone: 'The authors give three instances: aligning each agent to its own principal does not prevent
    conflict when the principals'' interests diverge; errors tolerable in isolation can compound across
    a network; and a group can develop capabilities or goals attributable to no individual in it.'
  claim_type: position
  concept_tags:
