- id: claim:arxiv:2502.14143:7
  text: Delegating a dispute to more capable agents may raise the speed and scale of conflict rather than
    resolve it.
  quote: delegation to increasingly advanced AI agents is far from guaranteed to lead to more cooperative
    outcomes, and could in some circumstances increase both the speed and the scale at which conflict
    might emerge
  standalone: The authors note AI could help by searching a wider space of settlements, monitoring agreements
    or mediating — and that the same competitive incentives driving a conflict are what push each side
    to adopt it for advantage.
  claim_type: position
