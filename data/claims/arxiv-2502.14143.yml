- id: claim:arxiv:2502.14143:4
  text: Conflict is any outcome in a mixed-motive setting that does not lie on the Pareto frontier.
  quote: we use the word conflict in a relatively broad sense to refer to any outcome in a mixed-motive
    setting that does not lie on the Pareto frontier
  standalone: 'Broader than the ordinary sense: it takes in legal disputes and warfare but also collective-action
    failures such as depleting a shared resource or a regulatory race to the bottom. The authors use the
    word in place of ''cooperation failure'' to keep it distinct from miscoordination.'
  claim_type: definition
  concept_tags:
