- id: claim:arxiv:2502.14143:8
  text: AI systems are developed and tested one at a time although they will shortly be interacting.
  quote: Today’s AI systems are developed and tested in isolation, despite the fact that they will soon
    interact with each other.
  standalone: 'The authors name what would be needed instead: evaluating cooperative capabilities, biases
    and vulnerabilities; testing for dangerous capabilities that appear only in multi-agent settings,
    such as manipulation, collusion or overriding safeguards; open-ended simulation of dynamics and emergent
    behavior; and studies of how well any of that matches real deployments.'
  claim_type: gap
