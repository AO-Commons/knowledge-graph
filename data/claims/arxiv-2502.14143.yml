- id: claim:arxiv:2502.14143:2
  text: Failure modes are divided by whether cooperation is wanted and how far the agents' objectives
    coincide.
  quote: First, we can distinguish between cases where we want the agents to be cooperating (as in collective
    action problems or team games) or competing (such as in markets or adversarial training). Second,
    we can further divide the space of failure modes depending on whether the agents have exactly the
    same objectives, different but overlapping objectives, or completely opposed objectives.
  standalone: 'Two axes rather than a list. The divisions correspond to common-interest, mixed-motive
    and constant-sum games, and yield the report''s three named failure modes: miscoordination, conflict
    and collusion.'
  claim_type: definition
  concept_tags:
  - taxonomy-construction-for-agentic-failure
  - objective-conflict-between-agents
  confidence_class: EXTRACTED
  extracted_from: other
  extraction_method: claude-opus-5, drafted from arXiv full text under the gated process, 2026-10-29;
    every quote verified verbatim against the source
  review_status: machine-checked
  attribution: own
- id: claim:arxiv:2502.14143:3
  text: Miscoordination is agents with a shared and clear objective failing to align their behavior to
    reach it.
  quote: Miscoordination arises when agents, despite a mutual and clear objective, cannot align their
    behaviours to achieve this objective.
  standalone: The authors require identical preferences over outcomes rather than merely symmetric ones
    — two agents both wanting a prize only one can win are not a common-interest case — and note AI agents
    can be given exactly the same goal far more easily than two people can hold one.
  claim_type: definition
  concept_tags:
