- id: claim:arxiv:2502.14143:11
  text: Risks that would arise in the same way for a single system are excluded, including alignment.
  quote: if the risk could arise in essentially the same way in the context of a single AI system, then
    we deem it to be out of scope for this report
  standalone: The authors also state that they treat the subject primarily from a technical perspective
    because of their own expertise, and that they almost entirely neglect the upsides — decentralization,
    assistance in coordinating, robustness, and more evenly distributed benefits.
  claim_type: limitation
