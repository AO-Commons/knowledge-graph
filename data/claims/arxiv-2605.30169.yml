- id: claim:arxiv:2605.30169:10
  text: A reputation mechanism requires that creating a new identity be expensive, or defectors simply
    re-enter with a clean slate.
  quote: Creating a new identity must be expensive; otherwise defectors re-enter with a clean slate.
    Without centralized certification, Sybil attacks are always possible, and the cheap-pseudonyms
    result shows costly identity is not merely helpful but formally necessary
  standalone: 'Among the eight preconditions the authors identify for reputation mechanisms, costly
    identity is formally necessary: if a new identity is cheap, a defector discards a damaged one
    and re-enters clean.'
  claim_type: background
  concept_tags:
  - reputation-and-sybil-resistance-mechanisms
  - dissociative-agent-identity
  confidence_class: EXTRACTED
