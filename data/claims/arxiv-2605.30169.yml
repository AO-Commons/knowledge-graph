  attribution: own
- id: claim:arxiv:2605.30169:3
  text: Dissociativity leaves agents without grounding for identifiability, predictability,
    credibility and rehabilitability.
  quote: this dissociativity leaves agents without grounding for identifiability, predictability,
    credibility, and rehabilitability—the very properties that reputation mechanisms aim to
    sustain—thereby collapsing trust
  standalone: The authors argue that the dissociativity of language model agents leaves them
    without grounding for identifiability, predictability, credibility and rehabilitability
    — the properties reputation mechanisms exist to sustain.
  claim_type: finding
