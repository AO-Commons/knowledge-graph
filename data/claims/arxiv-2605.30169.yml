- id: claim:arxiv:2605.30169:9
  text: How ex ante constraint mechanisms interact in practice has not been studied.
  quote: And the interaction of these mechanisms in practice is unexplored.
  standalone: 'Closing their proposal of ex ante harnesses (configuration binding, real-time behavioral
    monitoring using behavioral fingerprinting, and automated intervention), the authors list open
    questions: configuration binding faces a granularity problem, fingerprinting an arms race, and
    insurance models lack actuarial frameworks for agentic AI. How these mechanisms interact in practice
    is unexplored.'
  claim_type: gap
