  attribution: own
- id: claim:arxiv:2605.30169:2
  text: Language model agents are assemblages of mutable modules, any of which may change
    their behavior.
  quote: they are essentially an assemblage of mutable modules—foundation models, system prompts,
    tool-access policies, external memory, and, in some cases, a multi-agent system as a whole—any
    of which may change agent behavior
  standalone: 'The authors characterize language model agents as ontologically dissociative:
    assemblages of mutable modules — foundation model, system prompt, tool-access policy,
    external memory — any of which may change the agent''s behavior.'
  claim_type: finding
  concept_tags:
  - dissociative-agent-identity
  confidence_class: EXTRACTED
