claims:
- id: claim:arxiv:2605.30169:1
  text: Reputation mechanisms presume a persistent identity with behavioral continuity, sanction sensitivity
    and costly non-fungibility.
  quote: Reputation mechanisms function both as social signals and as corrective feedback that sustain
    an equilibrium of trustworthy behavior, presuming a persistent identity associated with behavioral
    continuity, sanction sensitivity, and costly non-fungibility
  standalone: The authors hold that reputation mechanisms work as social signal and corrective feedback
    only by presuming a persistent identity with behavioral continuity, sanction sensitivity and costly
    non-fungibility.
  claim_type: background
  concept_tags:
  - agent-reputation-systems
  - sanction-sensitivity
  confidence_class: EXTRACTED
