# Sixteen claims from a sixty-one-section paper, and the gap is deliberate.
#
# This is a survey that names a field. Its Section 2 walks ten adjacent
# subfields — game theory, blue- and red-teaming, privacy primitives,
# orchestration, cyber benchmarking — and its Section 3 catalogues threat
# classes largely demonstrated by other people. `check_claims.py` flags
# thirty-three of those sections as substantial body text with no claim, and
# that flag is correct about the text and wrong about what to do.
#
# Those sections are other people's results. Filing them would mean thirty
# `background` claims with `attribution: other` and `attributed_to` empty,
# because arXiv's LaTeXML strips citation markers and the fetched text reads
# "studied why multi-agent LLM teams fail and found..." with no author
# attached. A background claim whose whose-result-is-it cannot be answered is
# the exact failure the attribution field exists to prevent: it would make
# this paper the apparent source of thirty findings it is reporting.
#
# So what is held here is what this paper asserts on its own account — the
# definition of the field, the non-compositionality argument, the reading of
# existing governance instruments, and the open challenges it sets. The
# surveyed results belong to their own papers, and several are already held
# separately in this corpus.
resource_id: resource:arxiv:2505.02077
claims:
- id: claim:arxiv:2505.02077:1
  text: Multi-agent security is the securing of agent networks against threats that emerge or amplify
    through their interactions.
  quote: We introduce multi-agent security, a new field dedicated to securing networks of AI agents against
    threats that emerge or amplify through their interactions - whether direct or indirect via shared
    environments - with each other, humans, and institutions
  standalone: 'The authors name a field rather than a technique, and scope it by the source of the threat:
    what arises between agents, including through a shared environment, rather than within any one of
    them. They place it beyond both traditional cybersecurity and AI safety.'
  claim_type: definition
  concept_tags:
