- id: claim:arxiv:2505.02077:11
  text: An attribution framework must separate agent misconduct from systemic causes, or it will blame
    benign agents and miss the real fault.
  quote: Robust threat attribution frameworks must distinguish between agent-driven misconduct and systemic
    causes, for example by integrating root-cause analysis methods from systems safety engineering and
    causal modeling techniques with integrated systemic variables.
  standalone: The authors list the non-agent causes a failure may actually have — distributional shift,
    hidden technical debt, emergent system interactions, unsafe design, control failures, a compromised
    supply chain — any of which an attribution system looking only for a culprit will assign to an agent.
