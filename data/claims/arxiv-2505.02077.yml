- id: claim:arxiv:2505.02077:13
  text: The most developed AI regulation does not mention multi-agent risks, and one framework published
    in 2026 is the first to acknowledge them.
  quote: The EU AI Act (Regulation 2024/1689), the most developed AI regulatory instrument globally, does
    not mention multi-agent risks; its general-purpose AI provisions (Articles 51–56) target the foundation-model
    layer and inherit the model-centric unit of analysis.
  standalone: The authors survey the instruments and find Singapore's IMDA Model AI Governance Framework
    for Agentic AI, published January 2026, the first designed for agentic systems and the only one acknowledging
    multi-agent coordination risks including cascading errors and unintended coordination. US work at
    NIST remains in development or consultation; OECD and the International AI Safety Report propose no
    binding mechanisms.
  claim_type: evidence
