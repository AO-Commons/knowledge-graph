    verified verbatim against the source
  review_status: machine-checked
  attribution: own
- id: claim:arxiv:2107.06857:19
  text: Prosocial OPRE and A3C matched regular OPRE and A3C in self-play but scored closer
    to random in test scenarios, an overfitting the authors attribute to prosocial agents
    learning only cooperation strategies and so becoming exploitable by defectors at test
    time.
  quote: For example, in Bach or Stravinsky in the Matrix and Stag Hunt in the Matrix, prosocial
    OPRE and prosocial A3C achieve a similar self-play score to regular OPRE and A3C, but
    obtain a closer to random score in the test scenarios. This overfitting is due to prosocial
    agents only learning cooperation strategies during self-play training, and so becoming
    exploitable by defectors at test time.
  standalone: In two Melting Pot coordination games, Bach or Stravinsky in the Matrix and
    Stag Hunt in the Matrix, agents trained on reward shared across players (prosocial OPRE
    and prosocial A3C) reached self-play training scores similar to their selfish counterparts.
    Against the unfamiliar background bots of the test scenarios they scored closer to random.
    The authors attribute the gap to the prosocial agents having learned only to cooperate,
    which leaves them exploitable by defectors.
  claim_type: finding
  concept_tags:
  - generalization-to-unfamiliar-partners-and-novel-social-situations
  - reward-design-and-what-optimizing-a-proxy-does-to-a-population
  confidence_class: EXTRACTED
  extracted_from: results
  extraction_method: claude-opus-5-5, drafted from the arXiv full text, body read, 2026-10-01,
    after an independent audit (evals/results/2026-10-01-statement-audit.md); every quote
    verified verbatim against the source
  review_status: machine-checked
  attribution: own
- id: claim:arxiv:2107.06857:20
  text: The results suggest that doing well on Melting Pot will require agents able to balance
    selfishness and prosociality contingently.
  quote: This suggests that doing well on Melting Pot will require agents to be able to contingently
    balance selfishness and prosociality.
  standalone: Drawn from two results together. Prosocial (reward-sharing) agents were overall
    less robust than selfish ones in Melting Pot's test scenarios, yet in the Clean Up social
    dilemma only prosocial agents learned policies significantly better than random.
  claim_type: position
  concept_tags:
  - prosocial-capability
