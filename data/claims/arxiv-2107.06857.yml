- id: claim:arxiv:2107.06857:21
  text: Agents that learn specialized policies expecting others to behave in a particular
    way form a division of labor that can create efficiency but also makes populations less
    robust.
  quote: This means that some agents in the population learned specialized policies that expect
    other agents to behave in a particular way. Although such division of labour can create
    efficiency, it also makes populations less robust.
  standalone: 'Observed with Melting Pot''s universalization test, in which every player runs
    the same sampled policy. In Chemistry: Metabolic Cycles, OPRE did well in self-play and
    other scenarios but had low universalization scores, which the authors read as some agents
    in the population having learned specialized policies that expect other agents to behave
    in a particular way. The general lesson is drawn from this one case.'
  claim_type: position
  concept_tags:
