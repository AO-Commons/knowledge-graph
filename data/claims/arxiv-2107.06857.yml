  review_status: machine-checked
  attribution: own
- id: claim:arxiv:2107.06857:2
  text: Melting Pot uses reinforcement learning to reduce the human labor required to create
    novel test scenarios, which works because one agent's behavior is part of another agent's
    environment.
  quote: uses reinforcement learning to reduce the human labor required to create novel test
    scenarios. This works because one agent’s behavior constitutes (part of) another agent’s
    environment
  standalone: Melting Pot's authors pre-train populations of agents and hold them out for
    evaluation only, so that a test scenario pairs a familiar environment with unfamiliar
    co-players. Because one agent's behavior is part of another agent's environment, training
    new agents yields new tests. Designers still specify, train and quality-check the bots,
    so the human labor of building test environments is reduced, not removed.
  claim_type: method
  concept_tags:
  - held-out-background-populations
  confidence_class: EXTRACTED
  extracted_from: abstract
  extraction_method: claude-opus-5, re-drafted from arXiv full text under the gated process,
    2026-09-12; every quote verified verbatim against the source. Revised after an independent
    audit against the full text, claude-opus-5-5, 2026-10-01 (evals/results/2026-10-01-statement-audit.md)
  review_status: machine-checked
  attribution: own
- id: claim:arxiv:2107.06857:3
  text: Melting Pot reveals weaknesses in MARL algorithms that training performance alone
    does not show.
  quote: demonstrate how Melting Pot reveals weaknesses not apparent from training performance
    alone
  standalone: In the authors' benchmark of A3C, V-MPO and OPRE, and of prosocial variants
    of each, agents often had high self-play (training) scores but low scores on held-out
    test scenarios populated by unfamiliar background bots. Universalization tests also exposed
    populations whose agents had specialized on partners behaving in a particular way.
  claim_type: finding
  concept_tags:
  - generalization-to-unfamiliar-partners-and-novel-social-situations
  confidence_class: EXTRACTED
  extracted_from: abstract
  extraction_method: claude-opus-5, re-drafted from arXiv full text under the gated process,
