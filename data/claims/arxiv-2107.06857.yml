  review_status: unreviewed
- id: claim:arxiv:2107.06857:14
  text: Melting Pot is expected to get harder over time as improved agents are folded into
    its background populations.
  quote: since the effectiveness of the bots in test scenarios is itself advanced by improvements
    in the performance of learning systems, Melting Pot will likewise improve over time by
    reincorporating the latest agent technology into new background populations and test scenarios.
  standalone: The authors expect Melting Pot to improve over time, because the bots that populate
    its test scenarios are themselves built from learning systems, so advances in agent technology
    can be reincorporated into new background populations.
  claim_type: position
