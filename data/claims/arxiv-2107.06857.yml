    verified verbatim against the source
  review_status: machine-checked
  attribution: own
- id: claim:arxiv:2107.06857:16
  text: Maximizing collective reward often produces policies that are less robust to novel
    social situations than the policies obtained by maximizing individual reward.
  quote: Intriguingly, we find that maximizing collective reward often produces policies that
    are less robust to novel social situations than the policies obtained by maximizing individual
    reward.
  standalone: 'In the authors'' benchmark of A3C, V-MPO and OPRE on Melting Pot''s held-out
    test scenarios, prosocial variants trained on per-capita return (reward shared between
    players during training) underperformed their selfish counterparts overall. The result
    was not uniform: in the Clean Up social dilemma, only the prosocial agents learned policies
    significantly better than random.'
  claim_type: finding
  concept_tags:
  - reward-design-and-what-optimizing-a-proxy-does-to-a-population
  - prosocial-capability
  confidence_class: EXTRACTED
  extracted_from: introduction
