claims:
- id: claim:arxiv:2107.06857:1
  text: Existing MARL evaluation suites do not treat generalization to novel situations as
    their primary objective.
  quote: Existing evaluation suites for multi-agent reinforcement learning (MARL) do not assess
    generalization to novel situations as their primary objective (unlike supervised-learning
    benchmarks).
  standalone: As of 2021, existing evaluation suites for multi-agent reinforcement learning
    did not treat generalization to novel situations as their primary objective, unlike supervised-learning
    benchmarks.
  claim_type: background
  topic_codes:
  - '14.1'
  confidence_class: EXTRACTED
  extracted_from: abstract
  extraction_method: claude-opus-5, three-pass over arXiv full text, 2026-08-13
  review_status: unreviewed
- id: claim:arxiv:2107.06857:2
  text: No broadly accepted benchmark test set for MARL research existed.
  quote: No broadly accepted benchmark test set for multi-agent reinforcement learning (MARL)
    research yet exists.
  standalone: As of 2021, no broadly accepted benchmark test set existed for multi-agent reinforcement
    learning research.
  claim_type: background
  topic_codes:
