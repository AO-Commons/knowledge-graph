- id: claim:arxiv:2107.06857:15
  text: A background population is the part of a multi-agent simulation that is imbued with
    agency, excluding the focal population of agents being tested.
  quote: The term background population refers to the part of the simulation that is imbued
    with agency—excluding the focal population of agents being tested.
  standalone: Melting Pot's central equation is Substrate + Background Population = Scenario.
    The substrate is the physical part of the world (the map, the objects, the rules of physics).
    The background population is a set of agents pre-trained separately, which the agents
    under test never train with. The resulting scenario is used only for testing, as held-out
    test images are in supervised learning.
  claim_type: definition
  concept_tags:
  - held-out-background-populations
  confidence_class: EXTRACTED
  extracted_from: introduction
  extraction_method: claude-opus-5-5, drafted from the arXiv full text, body read, 2026-10-01,
