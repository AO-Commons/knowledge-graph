  review_status: machine-checked
  attribution: own
- id: claim:arxiv:2107.06857:17
  text: To perform well on Melting Pot's test scenarios, trained agents should be generalists.
    Division of labor is possible but works best when it self-organizes at test time, and
    where specialization is most important, successful populations should feature significant
    redundancy.
  quote: To perform well on test scenarios, trained agents should be generalists. Division
    of labor is possible in Melting Pot, but it works best when it self-organizes at test
    time with individuals taking on their roles in response to the ongoing behavior of others.
    In the cases where specialization is most important, successful populations should feature
    significant redundancy in order to be robust enough to do well in Melting Pot.
  standalone: Melting Pot samples each test-time agent independently from the trained population,
    so a training algorithm cannot control which agents end up playing together and cannot
    prescribe a fixed division of labor. The authors conclude that agents should be generalists,
    that roles should be taken up at test time in response to what others are doing, and that
    where specialization matters most a population needs significant redundancy to be robust.
  claim_type: position
  concept_tags:
  - function-to-agent-mapping-and-role-decomposition
  - redundancy-and-diversity-in-agent-assignment
  confidence_class: EXTRACTED
  extracted_from: method
  extraction_method: claude-opus-5-5, drafted from the arXiv full text, body read, 2026-10-01,
