claims:
- id: claim:arxiv:2107.06857:1
  text: Existing MARL evaluation suites do not treat generalization to novel situations as
    their primary objective.
  quote: Existing evaluation suites for multi-agent reinforcement learning (MARL) do not assess
    generalization to novel situations as their primary objective
  standalone: As of 2021, existing evaluation suites for multi-agent reinforcement learning
    did not treat generalization to novel situations as their primary objective, unlike supervised-learning
    benchmarks.
  claim_type: background
  concept_tags:
  - evaluation-environments-and-benchmark-suites
  confidence_class: EXTRACTED
