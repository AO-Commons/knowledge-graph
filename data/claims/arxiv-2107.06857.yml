  attribution: own
- id: claim:arxiv:2107.06857:5
  text: Because the effectiveness of its bots advances with improvements in learning systems,
    Melting Pot will improve over time by reincorporating the latest agent technology into
    new background populations and test scenarios.
  quote: since the effectiveness of the bots in test scenarios is itself advanced by improvements
    in the performance of learning systems, Melting Pot will likewise improve over time by
    reincorporating the latest agent technology into new background populations and test scenarios
  standalone: The authors expect Melting Pot to improve over time. The bots in its test scenarios
    are trained agents, so they become more effective as learning systems improve, and the
    latest agent technology can be folded into new background populations and test scenarios.
    At test time the bots are fixed; they do not adapt to the agent being evaluated.
  claim_type: position
  concept_tags:
