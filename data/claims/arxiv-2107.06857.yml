- id: claim:arxiv:2107.06857:18
  text: Ranking agents by skill is complicated and depends on how much each test scenario
    contributes to the overall score, and the authors' simple evaluation is far from the only
    option.
  quote: However, ranking agents’ by skill is complicated, and dependent on the contribution
    of each test scenario to the overall score. Here we did only a simple evaluation which
    is far from the only option.
  standalone: On average test-scenario score, V-MPO ranked first, then OPRE, then A3C. All
    three were similar in mixed-motivation games, and V-MPO was ahead in competitive ones
    such as King of the Hill. The authors caution that this ordering depends on how the scenarios
    are weighted in the aggregate score, and that their simple evaluation is one option among
    many.
  claim_type: limitation
  concept_tags:
  - capability-profiling
  confidence_class: EXTRACTED
  extracted_from: results
  extraction_method: claude-opus-5-5, drafted from the arXiv full text, body read, 2026-10-01,
