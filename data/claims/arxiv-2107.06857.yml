- id: claim:arxiv:2107.06857:9
  text: Focal-population per-capita return is Melting Pot's primary evaluation metric.
  quote: We propose the focal-population per-capita return as a primary evaluation metric,
    to test the performance of a learning algorithm in a novel social situation.
  standalone: Melting Pot proposes focal-population per-capita return as its primary evaluation
    metric for a learning algorithm's performance in a novel social situation.
  claim_type: method
  topic_codes:
  - '14.1'
  - '16.2'
  confidence_class: EXTRACTED
  extracted_from: results
  extraction_method: claude-opus-5, three-pass over arXiv full text, 2026-08-13
  review_status: unreviewed
- id: claim:arxiv:2107.06857:10
  text: Background-population per-capita return is measured as a secondary metric to detect
    harm to the wider population.
  quote: So we can measure the background-population per-capita return to see if it is negatively
    impacted by the introduction of the focal population.
  standalone: Melting Pot offers background-population per-capita return as a secondary metric,
    to detect whether introducing the evaluated agents negatively impacts the surrounding
    population — the suite's analogue of negative externalities.
  claim_type: method
  topic_codes:
  - '16.2'
