  review_status: machine-checked
  attribution: own
- id: claim:arxiv:2107.06857:4
  text: Solving Melting Pot's test scenarios seems to require agents that understand trust,
    generosity, forgiveness, reciprocity, stubbornness and deception.
  quote: Solutions to the problems posed here seem to require agents that understand trust,
    generosity, and forgiveness, as well as reciprocity, stubbornness, and deception
  standalone: Melting Pot's authors conclude that solving their test scenarios seems to require
    agents that understand trust, generosity, forgiveness, reciprocity, stubbornness and deception.
  claim_type: position
  concept_tags:
