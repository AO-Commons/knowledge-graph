- id: claim:arxiv:2107.06857:13
  text: Solving Melting Pot's scenarios appears to require agents that model trust, reciprocity
    and deception.
  quote: Solutions to the problems posed here seem to require agents that understand trust,
    generosity, and forgiveness, as well as reciprocity, stubbornness, and deception.
  standalone: The authors argue that solving the problems posed by Melting Pot's test scenarios
    seems to require agents that understand trust, generosity, forgiveness, reciprocity, stubbornness
    and deception.
  claim_type: position
  topic_codes:
