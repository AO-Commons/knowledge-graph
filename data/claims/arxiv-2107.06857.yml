- id: claim:arxiv:2107.06857:6
  text: Agents sampled from a multi-agent population must generalize to interact with unfamiliar
    individuals not seen during training, who may be human, and pass a universalization test.
  quote: generalize to interact effectively with unfamiliar individuals not seen during training
    (who may well be human), and pass a universalization test
  standalone: 'The authors set three desiderata for a population of agents acting as decentralized
    individuals: performing well across interdependent social situations, generalizing to
    individuals never seen in training who may be human, and answering positively to “what
    if everyone behaved like that?”'
  claim_type: position
  concept_tags:
  - generalization-to-unfamiliar-partners-and-novel-social-situations
  confidence_class: EXTRACTED
