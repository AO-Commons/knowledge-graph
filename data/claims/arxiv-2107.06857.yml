- id: claim:arxiv:2107.06857:12
  text: Exploiter agents and a random agent bound the performance range on each test scenario.
  quote: Together, exploiters and the random agent provide a rough estimate of the upper and
    lower bounds (respectively) of performance on the test scenarios.
  standalone: Melting Pot's benchmark results use exploiter agents, trained directly on a
    single test scenario, and a random agent to estimate the upper and lower bounds of achievable
    performance on that scenario.
