  extraction_method: claude-opus-5, three-pass over arXiv full text, 2026-08-13
  review_status: unreviewed
- id: claim:arxiv:2107.06857:11
  text: Each agent architecture was trained with 21 runs, one per substrate.
  quote: For each agent architecture, we performed 21 training runs—one for each substrate.
  standalone: In the paper's benchmark experiments, each agent architecture was trained with
    21 separate training runs, one for each of Melting Pot's substrates.
  claim_type: method
