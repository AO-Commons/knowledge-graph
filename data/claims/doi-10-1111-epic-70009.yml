- id: claim:doi:10-1111-epic-70009:10
  text: The ethnographer's authority shifts from solitary immersion to maintaining intelligibility
    inside a networked architecture.
  quote: The ethnographer’s authority no longer rests in solitary immersion or narrative synthesis
    but in their capacity to configure and maintain intelligibility within digitally networked
    architectures.
  standalone: 'The third implication the authors draw, about epistemology: the field is not
    discovered but enacted through socio-technical affordances, so what the ethnographer is
    expert at changes.'
  claim_type: position
