- id: claim:doi:10-1111-epic-70009:17
  text: Telescope gathers research data by letting community members flag a message and then
    asking its author for consent before the message enters the dataset.
  quote: Upon detecting this reaction, the Telescope bot automatically initiates a consent
    workflow by privately messaging the original author, informing them of the research, and
    requesting permission to include their message in the dataset.
  standalone: Participants in a Slack or Discord community flag a message with a telescope
    emoji, the bot privately asks its author for consent, and only approved messages are archived.
    Built for ethnography of decentralized online communities, where passive logging raises
    consent problems, and later connected to KOI as a sensor node.
  claim_type: method
  concept_tags:
  - research-ethics-with-autonomous-systems
  confidence_class: EXTRACTED
  extracted_from: other
  extraction_method: claude-opus-5-5, extracted from the publisher PDF (13 pages, 48k characters)
    2026-10-01; every quote verified verbatim against that text
  review_status: machine-checked
  attribution: own
- id: claim:doi:10-1111-epic-70009:18
  text: 'In the authors'' deployment, consent worked as a live governance surface rather than
    a one-time form: a participant''s revocation was enforced across the system as it happened.'
  quote: 'The episode demonstrated that KOI’s ethics layer is not a static consent form but
    a live governance surface: participants can continually redraw what counts as data, and
    the infrastructure enforces those decisions in real time.'
  standalone: One episode. A Metagov contributor revoked consent for a Slack post they had
    approved; the deletion propagated through the post's reference identifier and removed
    it from the ethnographer's notes, while a record that the boundary had changed stayed
    queryable and the message stayed in Metagov's Slack.
  claim_type: finding
  concept_tags:
  - research-ethics-with-autonomous-systems
  confidence_class: EXTRACTED
  extracted_from: other
  extraction_method: claude-opus-5-5, extracted from the publisher PDF (13 pages, 48k characters)
