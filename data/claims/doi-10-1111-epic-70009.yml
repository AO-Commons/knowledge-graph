- id: claim:doi:10-1111-epic-70009:9
  text: 'Under this infrastructure the stages of ethnography stop being sequential: a fieldnote
    can sync to a dataset at once, then be interpreted and fed back into the organization.'
  quote: data collection, analysis, and output are no longer staged sequentially
  standalone: 'The first of three implications the authors draw for ethnographic practice,
    about temporality: a fieldnote can sync to a dataset immediately, and that dataset can
    then be interpreted, fed back into the organization and acted on. An implication argued
    from their own tooling, not a measured result.'
