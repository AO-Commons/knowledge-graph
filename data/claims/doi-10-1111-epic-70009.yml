  review_status: machine-checked
  attribution: own
- id: claim:doi:10-1111-epic-70009:19
  text: Knowledge Organization Infrastructure is one architecture that makes Artificial Organizational
    Intelligence possible, by letting people connect and govern otherwise disparate sites
    of knowledge.
  quote: The BlockScience-developed Knowledge Organisation Infrastructure is an example of
    an architecture that makes this possible by enabling people to connect and govern over
    otherwise disparate sites of knowledge
  standalone: 'Where the paper joins its concept to a system: AOI is the capacity, and KOI
    is one implementation of it, which in the process makes the organization''s boundaries
    and practices machine-readable.'
  claim_type: position
