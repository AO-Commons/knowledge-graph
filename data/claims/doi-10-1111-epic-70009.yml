- id: claim:doi:10-1111-epic-70009:11
  text: Participatory ethnography can include machines as collaborators in interpretation
    rather than tools of extraction, under rules and permissions that can be collectively
    governed.
  quote: Participatory ethnography is extended to include machines, not as tools of extraction
    but as collaborators in interpretation where the rules and permissions for how that occurs
    can be collectively governed
  standalone: 'The authors'' closing argument: ethnography adapted to human-machine hybridity
    co-produces interpretation with moderators, stewards and AI agents, and the terms on which
    machines take part are themselves open to collective governance.'
  claim_type: position
  concept_tags:
