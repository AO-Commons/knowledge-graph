- id: claim:doi:10-1111-epic-70009:3
  text: Knowledge Organisation Infrastructure is a protocol for connecting disparate systems
    without homogenising them.
  quote: Our collaborative project with BlockScience and Metagov develops Knowledge Organisation
    Infrastructure (KOI), a protocol for stitching together disparate systems and practices
    without homogenisation, thereby allowing organisations to embed rules, permissions, and
    context into machine‐readable forms.
  standalone: Developed with BlockScience and Metagov, KOI is presented as a protocol that
    stitches together disparate organisational systems and practices without homogenisation,
    letting organisations embed rules, permissions and context in machine-readable form.
