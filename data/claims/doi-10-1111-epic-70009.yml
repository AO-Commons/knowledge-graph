- id: claim:doi:10-1111-epic-70009:4
  text: Ethnographic practice is transformed by this work, moving from observing hidden practices
    to building the loops that make them computable.
  quote: 'We describe how our ethnographic practice both informs and is transformed by this
    work: from observing hidden practices to actively building the loops that make organisational
    knowledge accessible and computable.'
  standalone: 'The paper argues that the ethnographer''s role changes in this setting: rather
    than only observing hidden organisational practices, the ethnographer actively builds
    the feedback loops that render organisational knowledge accessible and computable.'
