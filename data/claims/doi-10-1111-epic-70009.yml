- id: claim:doi:10-1111-epic-70009:12
  text: The authors' method is a design-oriented, participatory ethnography whose research
    tools are built together with collaborators and field participants.
  quote: Our approach is best described as a design-oriented, participatory ethnography in
    which the research instruments and tools have been co-developed with collaborators and
    field participants.
  standalone: 'Built in three phases: a bot that automates consent and collects approved posts;
    a plugin that pulls consented posts into ethnographers'' local note vaults for annotation;
    and an extension that sends annotated notes back into the organization, where participants
    can see additions, changes and deletions in real time.'
  claim_type: method
  concept_tags:
  - researcher-as-system-builder
  confidence_class: EXTRACTED
  extracted_from: method
  extraction_method: claude-opus-5-5, extracted from the publisher PDF (13 pages, 48k characters)
    2026-10-01; every quote verified verbatim against that text
  review_status: machine-checked
  attribution: own
- id: claim:doi:10-1111-epic-70009:13
  text: 'Building the loop is the authors'' name for regulating AI through a local, group
    process: specifying where and how AI systems connect into existing systems, and deciding
    collectively on boundaries such as permissions.'
  quote: The “regulability” of AI in this context occurs as a localised, group process for
    specifying where and how AI systems are connected into existing systems, as well as the
    ability to make collective decisions, including boundary-setting (permissioning, etc.).
    We call this “building the loop”.
  standalone: Where the term in the title comes from. The introduction gives the same idea
    as the deliberate assembling of knowledge pipelines that organize an organization's context,
    governance and interpretability, making the loop itself a co-governed system.
  claim_type: definition
  concept_tags:
  - building-the-loop
  confidence_class: EXTRACTED
  extracted_from: other
  extraction_method: claude-opus-5-5, extracted from the publisher PDF (13 pages, 48k characters)
    2026-10-01; every quote verified verbatim against that text
  review_status: machine-checked
  attribution: own
- id: claim:doi:10-1111-epic-70009:14
  text: Human oversight of automated decisions rarely corrects algorithmic bias and often
    works as a performative check that neither improves decisions nor redistributes responsibility.
  quote: Empirical studies show that human oversight rarely corrects algorithmic bias and
    often functions as a performative check that neither ensures better decisions nor redistributes
    responsibility meaningfully.
  standalone: The premise the authors' alternative argues from, reported in their discussion
    of Jake Goldenfein's critique of the human in the loop as a conceptual shortcut or last
    line of defense. The paper does not name the empirical studies it summarizes.
  claim_type: background
  concept_tags:
  - oversight-theater-process-present-function-absent
  confidence_class: EXTRACTED
  extracted_from: other
  extraction_method: claude-opus-5-5, extracted from the publisher PDF (13 pages, 48k characters)
    2026-10-01; every quote verified verbatim against that text
  review_status: machine-checked
  attribution: other
  attributed_to: Empirical studies of human oversight, as reported via Jake Goldenfein (2024)
- id: claim:doi:10-1111-epic-70009:15
  text: 'The question for AI oversight is not whether a human is in the loop at the moment
    of decision but how the loop is built: how organizations set context, permissions and
    the flow of meaning between people and machines.'
  quote: In our approach, the question is not whether a human is “in the loop” at the moment
    of decision, but how loops are built (how organisations construct systems for contextualising
    knowledge, setting permissions, and shaping the flow of meaning across human and machine
    actors).
  standalone: The argument the paper is named for. Following Goldenfein's critique, the authors
    move the oversight question from an individual reviewer at the point of decision to how
    an organization builds the pipelines, permissions and context its AI operates within.
    They say this does not settle questions of liability or regulation.
  claim_type: position
  concept_tags:
  - building-the-loop
  - human-in-the-loop-on-the-loop-and-out-of-the-loop
  confidence_class: EXTRACTED
  extracted_from: other
  extraction_method: claude-opus-5-5, extracted from the publisher PDF (13 pages, 48k characters)
    2026-10-01; every quote verified verbatim against that text
  review_status: machine-checked
  attribution: own
- id: claim:doi:10-1111-epic-70009:16
  text: Building the loop does not answer questions of liability or regulation, though it
    opens organizational approaches, such as shared rules, to mitigating AI harms.
  quote: While not an answer to questions of liability or regulation, it does open the door
    to possibilities for organisational-level approaches (including shared rules) in the mitigation
    of AI harms.
  standalone: 'The boundary the authors put on their alternative to human-in-the-loop oversight:
    it moves the oversight question to how organizations build their pipelines and permissions,
    and leaves who is liable for an AI harm where it was.'
  claim_type: limitation
  concept_tags:
  - building-the-loop
