- id: claim:doi:10-1111-epic-70009:1
  text: Artificial Organizational Intelligence is an organization's capacity to make its own
    knowledge legible and governable.
  quote: 'We introduce Artificial Organisational Intelligence (AOI): the capacity for organisations
    to make their knowledge (including routines, practices, rules, boundaries, and tacit know‐how)
    legible and governable'
  standalone: The authors define Artificial Organizational Intelligence as an organization's
    capacity to make its knowledge — routines, practices, rules, boundaries and tacit know-how
