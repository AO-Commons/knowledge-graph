- id: claim:doi:10-1111-epic-70009:11
  text: Machines belong in participatory ethnography as collaborators in interpretation, under
    rules and permissions that are collectively governed.
  quote: Participatory ethnography is extended to include machines, not as tools of extraction
    but as collaborators in interpretation where the rules and permissions for how that occurs
    can be collectively governed
  standalone: 'The authors'' closing argument, and the one the paper is named for: a move
    from “human in the loop” to “human building the loop”, designing systems that are ethically
    aware and epistemically accountable.'
  claim_type: position
