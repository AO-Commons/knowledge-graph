- id: claim:doi:10-1111-epic-70009:20
  text: Coordinated sensors, curators and machine agents free the ethnographer from the limit
    of what one person can perceive or track.
  quote: Second, in terms of scale, the ethnographer is no longer bounded by what they can
    physically perceive or manually track and parse.
  standalone: 'The second of three implications the authors draw for ethnographic practice,
    about scale: bots such as Telescope, human curators and KOI-connected language models
    form a distributed attention infrastructure that extends the ethnographer''s reach, and
    demand a new literacy in maintaining it.'
