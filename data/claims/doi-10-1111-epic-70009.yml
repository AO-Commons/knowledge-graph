- id: claim:doi:10-1111-epic-70009:8
  text: Artificial Organizational Intelligence means being able to address an organization
    itself rather than one of its representatives.
  quote: AOI is making the knowledge of organisations, including tacit and practice/process
    components, machine readable so that we may talk to an organisation (not just a representative
    of an organisation)
  standalone: 'The authors'' sharpest statement of what AOI is for: not applying AI to an
    organization''s data, and not replacing the organization, but making its knowledge addressable
    so that an outsider can query the organization rather than a person who speaks for it.'
  claim_type: definition
