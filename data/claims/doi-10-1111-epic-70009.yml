- id: claim:doi:10-1111-epic-70009:3
  text: Knowledge Organization Infrastructure is a protocol for connecting disparate systems
    without homogenizing them.
  quote: develops Knowledge Organisation Infrastructure (KOI), a protocol for stitching together
    disparate systems and practices without homogenisation
  standalone: KOI was designed by BlockScience and is used by the authors' project with BlockScience
    and Metagov. Nodes exchange reference identifiers for knowledge objects and a small set
    of signals (new, update, forget), so organizations can share knowledge without a shared
    database or ontology. The paper describes KOI and builds on it; it does not introduce
    it.
  claim_type: background
  concept_tags:
  - knowledge-graph-and-ontology-construction
  confidence_class: EXTRACTED
  extracted_from: abstract
  extraction_method: claude-opus-5, re-extracted from the abstract under the gated process,
    2026-09-12 (first recorded as arXiv full text; the paper is not on arXiv); quote verified
    against the abstract. Retyped and retagged against the publisher PDF, claude-opus-5-5,
    2026-10-01
  review_status: machine-checked
  attribution: other
  attributed_to: BlockScience, which designed KOI (Sisson et al. 2024)
- id: claim:doi:10-1111-epic-70009:4
  text: Ethnography changes from observing an organization's hidden practices to building
    the loops that make them computable.
  quote: 'We describe how our ethnographic practice both informs and is transformed by this
    work: from observing hidden practices to actively building the loops that make organisational
    knowledge accessible and computable.'
  standalone: 'From the abstract: the authors'' ethnographic practice both informs the infrastructure
    work and is changed by it, moving from observing practices nobody has written down to
    building the knowledge pipelines that make them accessible and computable.'
  claim_type: position
  concept_tags:
  - researcher-as-system-builder
  confidence_class: EXTRACTED
  extracted_from: abstract
  extraction_method: claude-opus-5, re-read of the abstract, 2026-09-18; quote verified against
