claims:
- id: claim:arxiv:2401.11880:1
  text: Agents' psychological assessments correlate with their dangerous behaviour, and dangerous
    behaviour appears collectively across a group of agents.
  quote: Our experiments reveal several intriguing phenomena, such as the collective dangerous
    behaviors among agents, agents' self-reflection when engaging in dangerous behavior, and
    the correlation between agents' psychological assessments and dangerous behaviors.
  claim_type: finding
  topic_codes:
