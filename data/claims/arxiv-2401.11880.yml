- id: claim:arxiv:2401.11880:2
  text: PsySafe attacks, defends, and evaluates multi-agent safety through induced dark personality
    traits, assessed psychologically and behaviourally.
  quote: 'we propose a comprehensive framework (PsySafe) grounded in agent psychology, focusing
    on three key areas: firstly, identifying how dark personality traits in agents can lead
    to risky behaviors; secondly, evaluating the safety of multi-agent systems from the psychological
    and behavioral perspectives, and thirdly, devising effective strategies to mitigate these
    risks.'
  claim_type: method
  topic_codes:
