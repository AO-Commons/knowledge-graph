- id: claim:arxiv:2407.14981:3
  text: Agent benchmarks often lack adequate holdout data, so agents overfit them and the resulting evaluations
    are unreliable.
  quote: existing agent benchmarks often don’t have adequate holdout datasets, causing existing agents
    to game and overfit to the benchmark, which in turn results in unreliable evaluations of these systems
  standalone: The authors add that best practices for evaluating agents are absent, which leaves evaluations
    inconsistent with each other and hard to reproduce. They call agent evaluation a nascent field.
  claim_type: gap
