- id: claim:arxiv:2407.14981:4
  text: Multi-agent evaluation is limited, and a collective may show capabilities or goals attributable
    to no agent in it.
  quote: it may be the case that collectives of agents exhibit unpredictable capabilities or goals not
    attributable to any one agent in isolation
  standalone: On top of the difficulty of evaluating one agent, the authors name information asymmetries,
    destabilizing dynamics, and the difficulty of establishing trust and security as what multi-agent
    interaction adds — and note this matters as agents enter finance and web services.
