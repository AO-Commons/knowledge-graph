- id: claim:arxiv:2407.14981:2
  text: Whether an evaluation has found most of a system's vulnerabilities is unresolved, so a behavioral
    evaluation gives only a lower bound.
  quote: if a model does not exhibit a particular behavior during testing, it is challenging to determine
    whether this is due to the model genuinely lacking the underlying ability or if the evaluation method
    applied was insufficient to surface it
  standalone: The authors note this bites hardest for the capabilities that matter most to governance
    — deception, long-horizon planning — and that jurisdictions including the EU already mandate capability
    evaluations for which the technical method does not exist.
  claim_type: gap
