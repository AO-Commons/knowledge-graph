- id: claim:arxiv:2407.14981:5
  text: Deciding which agent is responsible for a decision is unsolved, and may have no single answer.
  quote: For issues of liability, it will be critical to be able to determine which agent(s) or system(s)
    can be held responsible for a particular decision or action, if any. This may be complicated for cases
    in which the cause is not solely attributable to a single AI agent.
  standalone: The authors' phrasing allows that the answer may be none — the question is posed as whether
