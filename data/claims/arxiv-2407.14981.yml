- id: claim:arxiv:2407.14981:6
  text: How to track versioning and post-deployment changes to a system made of many components is open.
  quote: Key open questions in this context relate to how model versioning and post-deployment modifications
    should be kept track of, especially for models that undergo frequent updates.
  standalone: Deployed systems are not static models but assemblies — mixtures of experts, input and output
    filters — that change through their life cycle. The authors note a registry is one approach, and that
    it is unclear what it should hold or how its contents could be verified.
  claim_type: gap
