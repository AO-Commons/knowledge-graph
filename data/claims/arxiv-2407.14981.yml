- id: claim:arxiv:2407.14981:7
  text: Solving every technical problem in the catalog would not solve AI governance, and some of the
    capacities are in tension with each other.
  quote: having solutions to all open problems outlined in this paper will not have solved AI governance.
    On the contrary, careful management will be necessary to determine a balance between capacities that
    are in tension with each other, and to ensure that dual-use capacities are not misused.
  standalone: 'The authors name their own risk — techno-solutionism, applying technical fixes to normative
    social problems — and give examples of the tensions: broad access against security, and compute monitoring
    that could as easily surveil legitimate users as reveal private model development.'
  claim_type: position
