# Eight claims from a 49-section catalogue organised as six capacities across
# four targets. Most sections set out open problems in areas this corpus does
# not cover — chip location verification, proof-of-learning, anti-tamper
# hardware. Held here is the paper's framing and the problems bearing on
# agents and their evaluation. See arxiv-2505.02077.yml on survey sections.
resource_id: resource:arxiv:2407.14981
claims:
- id: claim:arxiv:2407.14981:1
  text: Technical AI governance is technical analysis and tooling that supports governing AI, rather than
    work aimed at making systems safer.
  quote: Technical AI governance, referring to technical analysis and tools for supporting the effective
    governance of AI, seeks to address such challenges.
  standalone: 'The authors distinguish it from AI safety and alignment, which aim directly at the system''s
    behavior, and from sociotechnical approaches that treat society and technology as one system. Three
    jobs: identify where intervention is needed, assess whether a governance action would work, and build
    mechanisms for enforcement, incentives or compliance.'
  claim_type: definition
  concept_tags:
  - agentic-ai-governance-frameworks
  - third-party-audit-of-agentic-systems
