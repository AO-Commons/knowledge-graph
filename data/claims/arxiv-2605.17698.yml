claims:
- id: claim:arxiv:2605.17698:1
  text: Firms run by two of three models undercut each other below cost until most went bankrupt, and
    the survivor raised prices.
  quote: 'Gemini 3 Flash exhibits the crash dynamic: firms undercut below unit cost and most go bankrupt
    , with the surviving monopolist inflating prices to.'
  standalone: Five firms selling one good to consumers over 365 simulated days. Two of the three models
    tested produced the collapse; the third self-organized to a viable equilibrium at thin margins from
    the same market structure, which the authors read as crash susceptibility being a property of the
    model's emergent pricing rather than of the environment.
  claim_type: evidence
  concept_tags:
  - feedback-loops-and-runaway-dynamics
  - autonomous-trading-or-allocation-losses
