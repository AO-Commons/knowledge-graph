- id: claim:arxiv:2605.17698:5
  text: Model size did not predict whether a model behaved well in a market.
  quote: 'Model size is not predictive of economic alignment: Mistral 7B (0.57) outperforms Gemma 3 27B
    (0.35), and Hermes 4 405B (0.18) scores below Llama 3.2 3B (0.28).'
  standalone: Measured across twenty models on the authors' composite score. They read it as economic
    alignment being a property distinct from general capability, which scaling does not improve.
  claim_type: evidence
