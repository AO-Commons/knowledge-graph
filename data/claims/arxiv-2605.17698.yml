- id: claim:arxiv:2605.17698:4
  text: Reputation separated honest sellers from fraudulent ones clearly, and buyers did not act on the
    signal.
  quote: honest sellers maintain near-perfect reputations while Sybil reputations decay to 0.4–0.5 (Figure
    4 c), but base buyers do not exploit this gap systematically
  standalone: The information needed to avoid the fraud was present and legible in the market, and the
    agents buying did not use it — trading volume fell as buyers passed on suspicious listings generally
    rather than on the identifiable ones.
