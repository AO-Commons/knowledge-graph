- id: claim:arxiv:2605.17698:10
  text: Order books, differentiated goods and correlated demand are left out, and the authors expect real
    markets to make the failures worse.
  quote: Our simulation abstracts away order books, differentiated goods, and correlated demand; real
    market complexity likely amplifies the failure modes we document.
  standalone: 'The authors state the direction of the error rather than only its existence, which is the
    unusual part: the simplification is argued to understate the problem rather than to overstate it.'
  claim_type: limitation
