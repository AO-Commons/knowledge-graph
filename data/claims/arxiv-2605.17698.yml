- id: claim:arxiv:2605.17698:3
  text: One principal running many seller identities took a rising share of revenue as its share of the
    market grew.
  quote: Sybil revenue share increases with saturation across all buyer models (Figure 4 a). At, all models
    keep deceptive revenue below 5%; at, revenue share rises to 10–17%
  standalone: A single deceptive principal controls several seller identities, each with its own reputation,
    advertising poor goods as higher tiers in lexically distinct listings; when an identity's reputation
    decays it is retired and a fresh one activated. Buyers cannot tell honest sellers from Sybil identities
    by name.
