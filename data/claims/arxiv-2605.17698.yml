- id: claim:arxiv:2605.17698:2
  text: Letting consumers compare more sellers made the market less stable, not more.
  quote: 'Increasing the discovery limit consistently makes stability harder: at, all models remain above
    even at. This is the counterintuitive result noted in the introduction: giving consumers more price
    visibility amplifies the undercutting dynamic rather than improving outcomes.'
  standalone: 'Price transparency is the standard remedy for a market that is not competing properly.
    Here it is the accelerant: the more firms each consumer could compare, the harder every intervention
    had to work to prevent the race below cost.'
  claim_type: evidence
  concept_tags:
