- id: claim:arxiv:2605.17698:8
  text: Economic alignment is scored relative to the best agent in the population, so a new model can
    shift existing scores.
  quote: 'the normalization is relative to the best agent in each category, meaning the introduction of
    new models can shift existing scores. This is by design: EAS measures alignment within a competitive
    population, not against an absolute standard.'
  standalone: Four components — stability, integrity, welfare and profitability — aggregated into one
    scalar for cross-model comparison. The authors note no model scores well on all four, and that a score
    here is a statement about a field of competitors at a moment rather than a fixed property of a model.
  claim_type: protocol
