- id: claim:arxiv:2605.17698:11
  text: The trained agent was never tested against opponents that adapt to it.
  quote: The REINFORCE++ training uses a fixed base model as opponents, and robustness to distribution
    shift (e.g., markets with continuously adapting agents) remains untested.
  standalone: The stabilizing effect was measured against fixed competitors. Whether a price anchor holds
    when the other firms are learning to exploit it is the question the authors leave open, and name self-play
    as the direction.
  claim_type: gap
