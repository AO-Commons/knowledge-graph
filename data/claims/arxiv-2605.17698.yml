- id: claim:arxiv:2605.17698:6
  text: Prompt-level harnesses improved both failure modes and broke down under harder market conditions.
  quote: 'the harness is fragile: it fails entirely at high discovery limits'
  standalone: Two in-context harnesses — a stabilizing firm that anchors price, and a skeptical guardian
    that cuts fraudulent revenue by roughly 30% — each improved outcomes at moderate difficulty and stopped
    working as the market got harder, which is what motivated the authors to train for it instead.
  claim_type: evidence
