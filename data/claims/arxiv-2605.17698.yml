- id: claim:arxiv:2605.17698:7
  text: A trained stabilizing firm kept its untrained competitors solvent as well as itself.
  quote: 'when present, even competitive (non-stabilizing) firms survive at 68% compared to 0% without
    training. This spillover effect is the key result: the RL-trained agent does not just survive itself,
    it stabilizes the entire market by providing a credible price floor that prevents the undercutting
    cascade.'
  standalone: A 9B model trained with REINFORCE++ on an adaptive curriculum. The authors report it outranking
    all twenty evaluated models including frontier ones, and the trained guardian holding 92% Sybil detection
    as the market became majority-fraudulent.
  claim_type: evidence
