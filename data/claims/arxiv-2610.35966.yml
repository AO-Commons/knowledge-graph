- id: claim:arxiv:2610.35966:10
  text: Bounding what an edit may touch lets a stronger model still learn more without letting any model
    make a larger or misplaced change.
  quote: The backbone decides which available edit to make, so a stronger model can still learn better
    memory, but no backbone can make a larger, misplaced or destructive one, so what is learned follows
    the training feedback rather than the backbone’s habits.
  standalone: 'The authors separate the choice from its envelope: the model keeps the judgment about which
    change to make, and loses the ability to decide how much of the system a single lesson may rewrite.'
  claim_type: position
  concept_tags:
  - ex-ante-behavioral-harness
  - declared-authority-diverging-from-effective-authority
