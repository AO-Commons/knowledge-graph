- id: claim:arxiv:2610.35966:4
  text: Corrections drawn from verified training failures transferred better than adapting on the evaluated
    tasks themselves.
  quote: All test-time variants remain well below EMMA, indicating that corrections derived from verified
    training failures transfer to held-out tasks more effectively than additional adaptation at test time.
  standalone: Compared against within-trajectory revision and against a search method run as cross-task
    self-evolution on the test split with no ground truth. The authors note the arms also differ in feedback
    access, so the comparison supports transfer rather than isolating persistence.
  claim_type: evidence
  concept_tags:
