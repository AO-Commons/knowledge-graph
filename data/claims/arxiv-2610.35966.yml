- id: claim:arxiv:2610.35966:12
  text: Accepted edits persist even when the attempt chain ends unsolved, so ineffective or harmful entries
    may remain.
  quote: accepted edits persist even when an attempt chain ends unsolved; we observed no systematic degradation,
    but ineffective or harmful entries may remain
  standalone: The authors name the mechanism and state they saw no systematic degradation rather than
    claiming there is none, and propose cross-verification on mini-batches or multiple epochs as a way
    to find such entries.
