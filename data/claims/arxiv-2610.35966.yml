- id: claim:arxiv:2610.35966:9
  text: Programmatic guards that never consult the model decide whether a proposed edit is allowed.
  quote: a proposed action is applied only if it passes a set of programmatic guards, which depend on
    the memory, the task and the revision history but never on the backbone
  standalone: A refused proposal returns its reason to the reflector, which tries again; persistent refusals
    default to no change. A new or revised artifact must be named in the re-run's plan, so an edit is
    always exercised before it is kept.
  claim_type: protocol
