- id: claim:arxiv:2610.35966:2
  text: Methods that let the model author a whole new configuration were the most sensitive to which model
    that was.
  quote: Multi-agent search methods are the most backbone-sensitive. On AppWorld challenge, EvoMAS and
    ADAS approach EMMA with Opus 5 (89.0 and 84.4 vs. 89.2 TGC) but fall to 7.2 (EvoMAS, GLM-5) and 0.5
    (ADAS, DeepSeek v3.2); on two open-weight backbones ADAS finds no program better than its hand-written
    seed.
  standalone: The authors draw the consequence directly — when the backbone authors the whole configuration,
    the result is only as good as that authorship — which is what their scoping is designed to remove.
  claim_type: evidence
  concept_tags:
  - agent-performance-in-organizational-context
  - model-selection-and-procurement-criteria
