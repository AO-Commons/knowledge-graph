- id: claim:arxiv:2610.35966:14
  text: Cross-verification could identify the entries in a system's learned memory that are useless or
    harmful, and has not been tried.
  quote: cross-verification on mini-batches or multiple epochs could identify them. We consider both directions
    as future work.
  standalone: Raised because edits survive a chain that never succeeded. An organization that writes down
    what it learns from failure has no way of noticing which of those lessons were wrong.
