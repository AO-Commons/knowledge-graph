- id: claim:arxiv:2610.35966:7
  text: 'The configuration of a multi-agent system is treated as three pools of memory: how work is routed,
    how an agent works, and how a class of problem is solved.'
  quote: The three levels answer different questions:, how the task is divided and routed; the agent prompts,
    how an agent works on any subtask; and, how a class of sub-problem is solved. This separation gives
    every lesson a single home
  standalone: Controller memory holds decomposition and dispatch rules, read as an index the controller
    chooses from rather than retrieved by similarity. The agent pool holds specialists that inherit a
    generalist's prompt, so a general habit written once reaches all of them. The skill pool holds short
    procedures indexed by when to use them.
  claim_type: definition
  concept_tags:
  - shared-organizational-memory-versus-per-agent-memory
  - organizational-learning-and-memory
