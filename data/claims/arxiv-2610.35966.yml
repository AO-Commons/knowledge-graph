- id: claim:arxiv:2610.35966:8
  text: A reflector localizes the failed step, classifies it into one of five scopes, generalizes the
    correction and makes the smallest edit within the scope that owns it.
  quote: It localizes the step where the outcome went wrong; classifies the failure into one of the five
    scopes listed in Table 1; generalizes the correction so that it applies to every task of the same
    kind, naming no entity or answer of this one, as the reflector’s generalization instructions require;
    and minimizes it to the smallest change within the lesson’s designated scope.
  standalone: The reflector sees the whole failed trajectory rather than a score — the plan, the code
    each sub-agent issued, the evaluator's explanation, earlier revisions, the full prompts of the agents
    that ran. A one-off slip is never written to durable memory; a failed working habit goes into a prompt,
    a wrong method into a skill, a wrong decomposition into controller memory.
  claim_type: protocol
  concept_tags:
