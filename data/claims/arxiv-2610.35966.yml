claims:
- id: claim:arxiv:2610.35966:1
  text: When a model is left to decide how its own multi-agent system changes, different models have almost
    opposite structural preferences.
  quote: without scope constraints, different backbone models have almost orthogonal structural preferences,
    which overshadow the knowledge actually learned from the task
  standalone: 'The authors'' framing finding: one model accumulates procedural skills where another spawns
    new agents, given the same failures. What the system learns reflects the model doing the editing rather
    than what went wrong.'
  claim_type: evidence
  concept_tags:
  - agent-fleet-topologies-flat-hierarchical-market-based
  - replication-under-model-version-churn
  confidence_class: EXTRACTED
