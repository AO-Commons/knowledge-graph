- id: claim:arxiv:2610.35966:3
  text: Learning the set of specialist agents added to what learning procedures alone achieved.
  quote: Learning the agent pool as well brings a further gain (0.591 to 0.647)
  standalone: An ablation holding the controller's routing memory learned in every arm and varying whether
    the skill and agent pools are learned or frozen. Learning procedures gave the larger gain; learning
    which specialists exist gave a further one on top, which the authors read as supporting their premise
    that the structure of the system and not only its context should be learned.
  claim_type: evidence
  concept_tags:
