- id: claim:arxiv:2610.35966:5
  text: One failure produced three artifacts, each written at the level that owned it, and later tasks
    of the same kind were solved first time.
  quote: 'a single failed zebra puzzle led to three artifacts, each written at the level that owns it:
    a constraint-satisfaction skill, a specialist agent created from overflow evidence, and a routing
    rule in controller memory. Subsequent zebra tasks were solved on the first attempt'
  standalone: 'The authors'' case study of what the training procedure produces: a lesson distributed
    across the memory hierarchy rather than written once wherever the model chose to put it.'
  claim_type: evidence
