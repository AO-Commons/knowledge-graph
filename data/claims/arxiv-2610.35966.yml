- id: claim:arxiv:2610.35966:11
  text: No edit is made after the final failure, because an edit that is never re-run is untested memory.
  quote: No edit is made after the final failure, since an edit that is never re-run is untested memory.
  standalone: Training runs each task as an attempt chain in a fresh environment, gated by its own correctness
    signal — an LLM judge, unit tests or exact match. A correct answer ends the chain; an incorrect one
    triggers reflection, one edit and a re-run, up to a fixed number of revisions.
  claim_type: protocol
  concept_tags:
  - reversibility-engineering-and-undo-paths
  - continuous-evaluation-in-production
