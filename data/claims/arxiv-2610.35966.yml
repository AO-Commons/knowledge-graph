- id: claim:arxiv:2610.35966:6
  text: The method ranked first in 17 of 20 benchmark and backbone pairings and used the fewest training
    runs.
  quote: EMMA achieves the highest mean performance on every benchmark and split across five backbones
    from two model families, ranks first in 17 of 20 benchmark–backbone settings, and uses the fewest
    training executions, while the multi-agent search baselines degrade sharply on open-weight backbones.
  standalone: Measured on KramaBench, AppWorld and BBEH against ACE, GEPA, EvoMAS and ADAS. The authors
    note the runner-up changes with the benchmark, so the margin does not rest on one weak comparison.
  claim_type: evidence
