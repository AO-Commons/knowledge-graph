- id: claim:arxiv:2509.10147:7
  text: Human-in-the-loop oversight is inadequate to the speed and scale of an agent economy.
  quote: The sheer speed and scale of an autonomous agent economy render traditional, human-in-the-loop
    oversight models inadequate.
  standalone: 'The authors'' third recommendation is a hybrid: AI systems providing real-time vigilance,
    with people retaining the decisions that oversight exists to protect. The claim is about capacity
    rather than preference — a person cannot be in a loop that closes faster than they can read it.'
  claim_type: position
  concept_tags:
