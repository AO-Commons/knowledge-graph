- id: claim:arxiv:2509.10147:9
  text: Local coordination inside a sandbox may be more tractable than coordinating agents globally.
  quote: There is no reason to consider AI agent coordination only at a global scale, as local coordination
    within sandbox economies may prove to be more tractable and easier to facilitate.
  standalone: The authors point at community currencies as a working model — issued by citizens, NGOs,
    firms and public administrations, implemented as cards, mobile payments, blockchains and time banks
    — and note early studies find gains in community participation alongside real obstacles to adoption.
  claim_type: position
