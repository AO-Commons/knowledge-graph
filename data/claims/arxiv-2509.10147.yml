- id: claim:arxiv:2509.10147:8
  text: Aggregating a large set of revealed preferences exceeds what any single coordination point can
    do, which is the case for markets.
  quote: the task of aggregating and acting upon a large set of revealed preferences is complex enough
    to easily exceed the capacity of any single coordination point. Therefore, it is often more practical
    to consider decentralized and distributed mechanisms for achieving desired outcomes—with markets providing
    a natural mechanism for doing so.
  standalone: The authors extend the distributional question beyond goods to bads — externalities and
    risks, including the carbon footprint of running the agents and the local consequences of actions
    taken on a user's behalf.
  claim_type: position
