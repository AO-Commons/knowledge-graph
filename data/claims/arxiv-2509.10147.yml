- id: claim:arxiv:2509.10147:3
  text: No participant in an agent economy can see its global state, because the agents belong to different
    people and organizations.
  quote: No individual party may have the access to the global state of such a system, given that the
    participating agents may be controlled by a number of different human users and organizations.
  standalone: The authors pair this with non-stationarity — each agent's behavior changes what the others
    face — to argue that identifying the equilibria such a system settles into is not straightforward,
    and that steering it towards good ones requires coordination that is necessary and hard to arrange.
  claim_type: position
  concept_tags:
