- id: claim:arxiv:2509.10147:2
  text: Guardrails have to be in place beforehand, because agents that can make thousands of decisions
    in an instant outrun real-time human oversight.
  quote: Since autonomous AI systems can make thousands of decisions in an instant, it is important to
    have the appropriate guardrails in place in advance, since real-time human oversight will often be
    impossible.
  standalone: 'The authors make the consequence concrete: appropriate guardrails are what convert a permeable
    sandbox into a relatively impermeable one, so the question of where constraints live is the same question
    as how far the agent economy can reach into the human one.'
  claim_type: position
  concept_tags:
  - governance-latency-versus-execution-latency
  - ex-ante-behavioral-harness
  confidence_class: EXTRACTED
