- id: claim:arxiv:2509.10147:10
  text: The risks of a sandbox economy run from market instability to the effect on human agency, and
    are stated rather than measured.
  quote: their design, deployment, and operation are attended by a complex array of risks that demand
    careful consideration
  standalone: 'The paper is a design proposal rather than a study: its claims about what sandbox economies
    would do rest on argument from mechanism, and the authors ask for limited gradual rollouts with stakeholder
    buy-in before any of it is built at scale.'
