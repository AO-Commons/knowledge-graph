resource_id: resource:arxiv:2509.10147
claims:
- id: claim:arxiv:2509.10147:1
  text: A sandbox economy is a set of linked digital markets where agents transact with each other, described
    by its origins and its permeability.
  quote: By the term “sandbox economy” we mean to describe a set of linked digital markets where AI agents
    transact with one another.
  standalone: 'Two axes: whether the economy arose spontaneously or by design, and how far developments
    inside it can affect the human economy and be affected by it. The authors hold that a fully sealed
    sandbox would have no value, so interfaces always exist and permeability is a design variable rather
    than a yes or no.'
  claim_type: definition
  concept_tags:
  - agent-based-simulation-of-organizational-dynamics
  - market-based-task-allocation
