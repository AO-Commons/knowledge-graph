- id: claim:arxiv:2509.10147:5
  text: Liability should attach to a coordinated agent system as a group agent, which would treat the
    system rather than any agent in it as the accountable entity.
  quote: instead of attempting to attribute blame to a single agent, new legal models should be developed
    that draw from jurisprudence on group agency, much like corporate liability. Such frameworks would
    treat the emergent, coordinated agent system as a single accountable entity
  standalone: 'The first of the authors'' recommendations, and their answer to the attribution problem:
    rather than tracing a causal chain through a network nobody can observe whole, treat the system as
    the entity that acted, as corporate law already does for firms.'
  claim_type: position
  concept_tags:
