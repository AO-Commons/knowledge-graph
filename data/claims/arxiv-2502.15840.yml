  review_status: machine-checked
  attribution: own
- id: claim:arxiv:2502.15840:6
  text: Long-term coherence can be measured on its own by making each task simple and the
    horizon long.
  quote: By formulating tasks that are more simple (but long-running), one could measure the
    capability of long-term coherence in a more isolated manner.
  standalone: 'The authors'' design argument for the benchmark: prior evaluations of long
    time budgets used very complex tasks, which confounds coherence with difficulty, so simple
    tasks over a long run isolate the thing being measured.'
  claim_type: method
  concept_tags:
  - long-horizon-and-multi-step-task-evaluation
  - evaluation-environments-and-benchmark-suites
  confidence_class: EXTRACTED
