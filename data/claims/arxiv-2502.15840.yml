- id: claim:arxiv:2502.15840:8
  text: The human baseline rests on a single sample, so the variance that separates humans
    from models is not measured.
  quote: We only have a single sample for the human baseline and therefore cannot compare
    variances.
  standalone: 'Variance is the paper''s central result about models, and the comparison against
    humans is the one place it cannot be computed: the human was run once, and the authors''
    expectation that human variance is lower rests on the human''s own estimate rather than
    on measurement.'
  claim_type: limitation
