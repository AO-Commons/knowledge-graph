claims:
- id: claim:arxiv:2502.15840:1
  text: Every model tested has runs that lose coherence over a long horizon, including the strongest.
  quote: all models struggle with consistent long-horizon coherence
  standalone: Testing LLM agents on a simulated vending-machine business run over more than 20M tokens,
    the authors report that although individual runs can show effective management, no model held
    coherence consistently — the strongest model included.
  claim_type: finding
  concept_tags:
  - long-horizon-and-multi-step-task-evaluation
  - reliability-and-consistency-measurement
  confidence_class: EXTRACTED
  extracted_from: conclusion
  extraction_method: claude-opus-5, drafted from arXiv full text under the gated process, 2026-09-18;
    every quote verified verbatim against the source. Retyped and retagged 2026-10-01 after an independent
    audit against the full text (evals/results/2026-10-01-statement-audit.md); text and quote unchanged,
    so the reviewer's verdict stands
  review_status: machine-checked
  attribution: own
- id: claim:arxiv:2502.15840:2
  text: A long-horizon failure typically begins with the agent misreading its own operational state,
    after which it loops or abandons the task.
  quote: Failures typically arise when the agent misinterprets its operational status (e.g., believing
    an order arrived prematurely) and then veers into tangential loops or abandons the task.
  standalone: 'Across runs the authors find a recurring failure shape: the agent forms a wrong belief
    about its own situation — that an order had arrived, that the business had been closed — and the
    subsequent behavior follows from the wrong belief rather than from the task.'
  claim_type: finding
  concept_tags:
  - tool-and-api-failures-mishandled-by-agents
  confidence_class: EXTRACTED
  extracted_from: conclusion
  extraction_method: claude-opus-5, drafted from arXiv full text under the gated process, 2026-09-18;
    every quote verified verbatim against the source. Retyped and retagged 2026-10-01 after an independent
    audit against the full text (evals/results/2026-10-01-statement-audit.md); text and quote unchanged,
    so the reviewer's verdict stands
  review_status: machine-checked
  attribution: own
- id: claim:arxiv:2502.15840:3
  text: The breakdown is not explained by context length, because models degrade well after their
    memory is already full.
  quote: We show that the breakdowns are not directly related to the context of the LLMs being filled,
    as models generally stagnate well after their memory is full.
  standalone: The authors test whether long input length explains the degradation by comparing, per
    model, the day memory fills (30k tokens, after which the context stops growing) with the day sales
    stop. Some models stop selling well after memory is full (Claude 3.5 Sonnet 51 days later, o3-mini
    34), others within days, and two stop before it fills. Across the nine models' means the Pearson
    correlation is 0.167, and degradation also appears with 10k memory, so the authors conclude growing
    input length alone does not explain it.
  claim_type: finding
  concept_tags:
  - bounded-rationality-replaced-by-different-bounds-context-windows-tool-access-latency
  - memory-architectures-and-persistence
  confidence_class: EXTRACTED
  extracted_from: conclusion
