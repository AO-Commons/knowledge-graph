- id: claim:arxiv:2502.15840:9
  text: Agents across different models fail in the same way, by assuming an order has arrived once
    its expected delivery date is reached.
  quote: the way they fail is usually the same. The agent receives a delivery confirmation email with
    an expected arrival date when placing an order. It then assumes the order has arrived as soon
    as that date is reached
  standalone: 'Vending-Bench''s authors report that although models differ in how they react to perceived
    failure, the triggering mistake is the same across them: the agent assumes an order has arrived
    as soon as its stated delivery date is reached.'
  claim_type: finding
  concept_tags:
  - silent-failure-detection
  - slow-onset-degradation
  confidence_class: EXTRACTED
