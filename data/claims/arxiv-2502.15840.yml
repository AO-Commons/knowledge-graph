- id: claim:arxiv:2502.15840:14
  text: Whether the finding that agents gain less than humans from longer time budgets holds for simple
    tasks is unknown.
  quote: METR’s investigation focused on very complex tasks (specifically, AI R&D), but it is not
    clear if this trend holds for more simple tasks
  standalone: Vending-Bench's authors note as an open question whether METR's finding — that LLMs
    gain far less than humans from larger time budgets — also holds for simpler, long-running tasks.
