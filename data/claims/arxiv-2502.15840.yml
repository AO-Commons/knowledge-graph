- id: claim:arxiv:2502.15840:7
  text: LLMs gain far less from a larger time budget than humans do.
  quote: found that LLMs gain far less in performance from increased time budgets compared to humans
  standalone: The authors cite METR, an AI safety organization evaluating LLMs, for this result, and
    note that METR's investigation covered very complex tasks — which is the premise their own simpler
    benchmark is built to test.
  claim_type: background
