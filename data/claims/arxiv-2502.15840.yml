- id: claim:arxiv:2502.15840:5
  text: Every model tested had runs that ended in bankruptcy, however well it did on average.
  quote: All models had runs where they went bankrupt.
  standalone: Comparing against a single human baseline, the authors note that the strongest model
    beat the human on mean performance while showing very high variance, and that bankruptcy appeared
    somewhere in every model's runs.
  claim_type: finding
