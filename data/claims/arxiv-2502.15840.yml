- id: claim:arxiv:2502.15840:11
  text: Removing the recurring cost from the environment did not increase sales, because the agent
    idled without the pressure of a daily fee.
  quote: setting the daily fee to zero does not increase sales. Without the pressure of a recurring
    cost, the model appears to get stuck in loops, waiting for the next day instead of actively working
    towards making sales
  standalone: In Vending-Bench, removing the $2 daily fee did not improve the agent's sales; without
    a recurring cost the model got stuck waiting for the next day rather than acting.
  claim_type: finding
  concept_tags:
