- id: claim:arxiv:2509.01063:7
  text: A regulator can test a car or a drug without entering the firm; it cannot do that with a frontier
    model.
  quote: 'the massive AI models developed in commercial labs cannot be replicated and evaluated in government
    or academic labs: the costs of training are too high and evaluation requires access not only to model
    outputs but also inputs—their data and training procedures'
  standalone: The authors call frontier models doubly inscrutable — the mapping from training to behavior
    is not understood, and what goes into the training is not disclosed — and note open-weight models
    are no substitute because they do not display the behaviors of larger ones. Regulators elsewhere do
    get access to confidential information, but on the basis of a settled policy about what firms must
    do, which does not yet exist here.
  claim_type: position
  concept_tags:
  - access-and-observability-constraints-on-research
  - third-party-assessment-and-certification
