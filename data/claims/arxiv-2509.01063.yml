- id: claim:arxiv:2509.01063:9
  text: Whether agents can hold the informal, incomplete agreements that carry cooperation inside human
    firms is unknown.
  quote: How might we build AI agents that are similarly normatively competent ?
  standalone: 'Relational contracts are enforced by the value of the future relationship rather than by
    law, and work because people fill gaps using shared norms. The authors add a second missing piece:
    such contracts usually rest on transferable utility, and agents trained to optimize a narrow goal
    have no equivalent, so some record-keeping or money would have to be built.'
  claim_type: gap
  concept_tags:
  - inter-agent-negotiation-protocols
  - cooperation-without-shared-objectives
