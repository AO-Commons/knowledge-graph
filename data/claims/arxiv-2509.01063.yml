- id: claim:arxiv:2509.01063:2
  text: Agents that generate their own training data as they produce can create a feedback loop that does
    not run into diminishing returns.
  quote: they continually improve with additional data---even in the ‘big data’ regime where humans are
    saturated; and (ii) data and algorithmic improvements can be duplicated at scale across different
    agents within the firm
  standalone: The authors distinguish this from the data feedback loops already studied for demand prediction
    and product quality, which diminish. A firm whose marginal costs fall this way tends towards concentration.
  claim_type: position
  concept_tags:
  - scaling-returns-and-coordination-cost
  - cost-curves-and-marginal-agent-economics
  confidence_class: EXTRACTED
