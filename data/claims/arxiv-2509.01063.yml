- id: claim:arxiv:2509.01063:5
  text: Legal identity and registration are preconditions for market institutions, and neither exists
    for AI agents.
  quote: Such identity and registration infrastructure are currently missing for AI agents.
  standalone: The authors trace the point historically — Qin surnames imposed for taxation, Athenian citizenship
    as the precondition for owning land and using courts, modern birth registration and identity numbers
    — and note even private institutions such as credit rating agencies could not function without a legal
    identity regime.
  claim_type: position
  concept_tags:
  - agent-identity-standards-and-registries
  - legal-personhood-gaps-for-agentic-organizations
