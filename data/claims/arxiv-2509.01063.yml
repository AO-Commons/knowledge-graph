- id: claim:arxiv:2509.01063:4
  text: Errors made by agents may be more correlated than human ones because the same agent is copied
    within and between firms.
  quote: This might arise because the same agent is ‘copied’ both within and between firms, inducing correlated
    mistakes that do not wash out in the aggregate.
  standalone: The authors connect this to the literature on how small shocks propagate across an economy,
    and cite automated trading's role in the 2010 Flash Crash — roughly $1 trillion over fifteen minutes
    — as the existing instance.
  claim_type: position
  concept_tags:
