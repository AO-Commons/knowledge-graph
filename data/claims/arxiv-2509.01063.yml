- id: claim:arxiv:2509.01063:6
  text: Registering each agent to an accountable human runs against two settled limits on liability.
  quote: Few legal regimes of accountability impose liability on a person or organization for actions
    that were not foreseeable by them or which are beyond their control to avoid.
  standalone: The second limit is agency law, which caps a principal's liability at actions within the
    agent's actual or apparent authority. The authors note instructions are trending towards the general
    — "go make $1 million" — and that it is unclear what technical means a user would have to bound what
    an agent can do.
  claim_type: position
  concept_tags:
  - operator-deployer-and-developer-liability
  - delegated-versus-originated-authority
