claims:
- id: claim:arxiv:2509.01063:1
  text: The frictions that stop human firms growing without bound seem intrinsic to people rather than
    to organizations.
  quote: The obstacles that prevent human firms from growing without bound seem intrinsic to humans but
    not to AI.
  standalone: Human communication is rate-limited — we know more than we can tell — where information
    passes between artificial agents near-instantaneously; and most people dislike work, where an agent's
    reward function can be designed against shirking, making monitoring and contractual enforcement unnecessary.
    The authors draw out that if agents resolve coordination and incentive problems more efficiently than
    people, economy-wide industry structure changes.
  claim_type: position
  concept_tags:
  - firm-boundaries-when-coordination-cost-approaches-zero
  - coase-revisited-under-agentic-coordination
  confidence_class: EXTRACTED
