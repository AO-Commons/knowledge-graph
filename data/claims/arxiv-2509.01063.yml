- id: claim:arxiv:2509.01063:8
  text: How a firm should structure team production around agents, given different coordination costs
    between humans and agents, is open.
  quote: How then should firms structure team production to integrate AI agents? How should we configure
    who workers interact with, and how is this shaped by differential coordination costs for human-human,
    human-AI, and AI-AI relationships?
  standalone: The authors note agents may work better with other agents than with people — partly from
    a greater capacity to monitor and discipline counterparties acting at superhuman speed — and that
    agents may have opportunities to cheat by means a human colleague could not detect.
  claim_type: gap
  concept_tags:
  - human-agent-team-structures
  - function-to-agent-mapping-and-role-decomposition
