- id: claim:arxiv:2509.01063:3
  text: Who decides last should be whoever is least likely to introduce a new error, and nothing fixes
    that as the human.
  quote: agents with higher scores make decisions later because they are less likely to introduce new
    errors. Given the current state of AI development, these final decision makers are likely to be human.
    But there is nothing inevitable about this.
  standalone: 'From a model of a decision chain in which each agent may correct an existing error or introduce
    a new one. The authors put the consequence as a question worth costing: how much efficiency is given
    up by requiring that a human decide last.'
  claim_type: position
  concept_tags:
