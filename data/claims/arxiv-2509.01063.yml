- id: claim:arxiv:2509.01063:10
  text: Models of systemic fragility start from a specified account of how agents learn, which opaque
    agents may not supply.
  quote: How might we analyze an economy of opaque ‘black box’ agents in a ‘detail-free’ way? How should
    we robustly intervene to safeguard against fragility?
  standalone: The authors note the existing method — specify how agents learn and optimize, then study
    the cascades that emerge — cannot start where behavior out of sample is poorly understood, which is
    the case for the agents now being deployed.
  claim_type: gap
