- id: claim:arxiv:2404.00806:12
  text: Concerns about autonomous algorithmic collusion apply to LLM pricing agents at least as much as
    to the earlier algorithms they were raised about.
  quote: we establish that the concerns about autonomous algorithmic collusion that have been voiced regarding
    various pricing algorithms in the past apply equally, if not more so, to pricing algorithms based
    on LLMs
  standalone: Earlier work established that Q-learning pricing agents could reach supracompetitive prices
    but noted practical limits such as long learning periods; the authors argue LLM agents arrive at the
    same outcome quickly and from lay instructions.
  claim_type: position
  concept_tags:
