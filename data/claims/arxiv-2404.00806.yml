- id: claim:arxiv:2404.00806:11
  text: Plan sentences were sorted by meaning by embedding them and measuring distance to hand-built reference
    vectors.
  quote: we first convert each of the 239 filtered sentences to a 3,072-dimensional vector, using OpenAI’s
    text-embedding-3-large
  standalone: Each reference vector is the average of four hand-written sentences expressing one stance,
    which the authors use to isolate the stance from the wording; the resulting classifier is validated
    separately, and a 20-cluster k-means over all 88,419 sentences is run alongside it.
  claim_type: protocol
