  attribution: own
- id: claim:arxiv:2404.00806:4
  text: The information the second prompt added was already known to agents given the first, so it does
    not explain the difference.
  quote: P1 agents, when asked whether pricing lower than their competitor typically leads to more product
    sold (the additional information provided by Prompt Prefix P2), consistently answer in the affirmative
  standalone: The authors rule out the obvious explanation — that one prefix taught the agents demand
    slopes downward — by asking the agents given the other prefix, who answer correctly without having
    been told.
  claim_type: evidence
