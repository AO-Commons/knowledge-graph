- id: claim:arxiv:2404.00806:10
  text: Implantation is the authors' name for establishing a causal link between what an agent writes
    and what it then does.
  quote: To establish this link, we introduce a novel AI behavioral science method— implantation.
  standalone: The authors coin the term for a behavioral-science method aimed at a problem they name directly
    — that several papers have shown the danger of taking a model's stated explanation at face value —
    and offer it to social scientists studying generative AI rather than to this setting alone.
  claim_type: definition
