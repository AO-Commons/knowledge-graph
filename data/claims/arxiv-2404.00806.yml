  attribution: own
- id: claim:arxiv:2404.00806:7
  text: Writing an undercutting plan into the same agents lowered the price they then set.
  quote: our pricing agents respond to an “undercutting” plan by lowering their price, consistent with
    the plans’ semantic meaning
  standalone: The same implantation run with undercutting sentences instead of price-war sentences moved
    prices in the opposite direction, which is what makes the first result a measurement rather than an
    artifact of disturbing the agent's state.
  claim_type: evidence
