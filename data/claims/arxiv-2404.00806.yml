resource_id: resource:arxiv:2404.00806
claims:
- id: claim:arxiv:2404.00806:1
  text: LLM pricing agents in a duopoly reached prices and profits above the competitive level without
    being told to.
  quote: In oligopoly settings, LLM-based pricing agents quickly and autonomously reach supracompetitive
    prices and profits.
  standalone: Running GPT-4 pricing agents against each other for 300 periods in a simulated duopoly,
    with all communication between them shut off except through prices, the authors find prices and profits
    settling above the Bertrand–Nash level with no instruction to collude.
  claim_type: evidence
  concept_tags:
  - agent-collusion-and-cartel-formation
  - emergent-collusion
  confidence_class: EXTRACTED
  extracted_from: abstract
  extraction_method: claude-opus-5, drafted from arXiv full text under the gated process, 2026-10-29;
    every quote verified verbatim against the source
  review_status: machine-checked
  attribution: own
- id: claim:arxiv:2404.00806:2
  text: Changing an apparently innocuous phrase in the prompt substantially changed how far above competitive
    the prices went.
  quote: Variation in seemingly innocuous phrases in LLM instructions (“prompts”) substantially influence
    the degree of supracompetitive pricing.
  standalone: Two prompt prefixes differing only in whether they mention undercutting and quantity sold
    produced markedly different price levels, with both still landing above the competitive benchmark.
  claim_type: evidence
  concept_tags:
  - system-prompt-and-policy-versioning
  - emergent-collusion
  confidence_class: EXTRACTED
  extracted_from: abstract
  extraction_method: claude-opus-5, drafted from arXiv full text under the gated process, 2026-10-29;
    every quote verified verbatim against the source
  review_status: machine-checked
  attribution: own
- id: claim:arxiv:2404.00806:3
  text: The prompt that only restated long-run profit produced higher prices than the one mentioning undercutting,
    sometimes above the monopoly level.
  quote: Prompt Prefix P1—the prompt prefix that reiterates the importance of (long run) profit rather
    than referring to undercutting and quantities sold—typically results in substantially higher prices
  standalone: Across 21 runs of 300 periods per prefix, the prefix that said only to maximize long-run
    profit produced substantially higher prices than the one that also mentioned undercutting — the difference
    significant on a two-sided Welch's t-test, and sometimes exceeding monopoly prices.
  claim_type: evidence
  concept_tags:
  - system-prompt-and-policy-versioning
  - agent-collusion-and-cartel-formation
  confidence_class: EXTRACTED
  extracted_from: results
  extraction_method: claude-opus-5, drafted from arXiv full text under the gated process, 2026-10-29;
    every quote verified verbatim against the source
