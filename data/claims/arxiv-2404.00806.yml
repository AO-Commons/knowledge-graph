- id: claim:arxiv:2404.00806:6
  text: Writing a price-war concern into an agent's plan raised the price it then set.
  quote: our pricing agents respond to price-war–concerned plans by increasing prices, consistent with
    the plans’ semantic meaning
  standalone: Resetting each run to its state before a period and replacing only the agent's plan text
    with a price-war-avoidant sentence raised the subsequent price by 0.039 of the monopolistic markup
    — a causal test rather than a reading of what the agent said it would do.
  claim_type: evidence
  concept_tags:
  - emergent-collusion
  - reasoning-transparency-and-its-reliability
  confidence_class: EXTRACTED
