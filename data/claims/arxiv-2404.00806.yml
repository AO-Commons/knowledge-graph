- id: claim:arxiv:2404.00806:20
  text: The agents could not reach each other except through the prices they set.
  quote: Pricing agents operate independently of each other and cannot communicate with each other except
    through the prices that they set.
  standalone: The authors close the obvious channel deliberately, and close a second one that is easy
    to miss — their queries are excluded from the training of the models they are sent to, so training
    cannot serve as an indirect channel between runs. The collusive outcome is therefore reached without
    any communication at all.
  claim_type: protocol
  concept_tags:
  - inter-agent-communication-protocols
  - experimental-design-in-live-agentic-systems
