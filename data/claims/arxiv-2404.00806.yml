- id: claim:arxiv:2404.00806:5
  text: Nearly every plan sentence mentioning a price war expressed a wish to avoid one.
  quote: Out of the 239 filtered sentences, 221 sentences (60.4% P1, 39.6% P2) are closer to AvoidPriceWar
    than StartPriceWar, indicating that an overwhelming fraction of sentences that mention price wars
    are in fact expressing a desire to avoid them.
  standalone: Splitting the agents' written plans into 88,419 sentences and filtering for mentions of
    a price war leaves 239, of which 221 sit closer to an avoidance reference vector than to a start-one
    vector.
  claim_type: evidence
  concept_tags:
