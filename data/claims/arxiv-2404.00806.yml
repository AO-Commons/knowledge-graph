- id: claim:arxiv:2404.00806:22
  text: Price data alone cannot show the threats an agent never had to carry out.
  quote: pricing data only captures the realized path of play (and not, e.g., off-path threats)
  standalone: One of three reasons the authors give for why identifying an agent's strategy is hard —
    alongside the size of the strategy space and the opacity of the models — and the reason they read
    the agents' written plans at all rather than only their prices.
