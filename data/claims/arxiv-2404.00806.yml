- id: claim:arxiv:2404.00806:17
  text: What in a model's training produces price-war-avoidant behavior is unknown.
  quote: It remains an open question to understand what in an off-the-shelf LLM’s training (inadvertently)
    causes price-war–avoidant behavior.
  standalone: The authors note this is hard for a reason beyond their study — attributing an output feature
    to specific training documents is itself an open problem — so the mechanism they measured cannot currently
    be traced to its source.
