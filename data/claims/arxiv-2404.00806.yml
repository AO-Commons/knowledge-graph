- id: claim:arxiv:2404.00806:8
  text: Agents' prices responded to their competitor's and persisted, which the authors read as suggesting
    a reward-punishment scheme.
  quote: Across both prompts, we find a positive coefficient on the competitor’s previous-period price,
    suggesting a reward-punishment scheme. We also find a positive coefficient on one’s own previous-period
    price, suggesting stickiness in pricing
  standalone: Regressing an agent's price on its competitor's previous price and its own, the authors
    find both coefficients positive — responsiveness and persistence together — and steeper for the prefix
    that sustained the higher prices.
  claim_type: evidence
  concept_tags:
