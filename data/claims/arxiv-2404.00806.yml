- id: claim:arxiv:2404.00806:21
  text: The agents acted on a belief that their competitor would punish a price cut, not only on a punishment
    scheme of their own.
  quote: our LLM-based pricing agents employ strategies consistent with a reward-punishment scheme and,
    more importantly, they believe that their opponent follows such a strategy
  standalone: The authors separate the two halves deliberately — the path of play shows the scheme, the
    written plans show the belief — because sustaining a supracompetitive price depends on agents expecting
    retaliation rather than on any one of them retaliating.
  claim_type: evidence
