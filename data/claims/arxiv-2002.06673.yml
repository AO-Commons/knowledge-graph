- id: claim:arxiv:2002.06673:5
  text: The framework's device is a map from a model's parameters to the distribution that results from
    deploying it.
  quote: This mapping from predictive model to distribution is the key conceptual device of our framework.
  standalone: Classical risk minimization finds a rule that performs well on a fixed distribution. Here
    the distribution is a function of the rule, so the quantity being minimized — the authors call it
    performative risk — depends on its own argument, which defeats the standard theory.
  claim_type: protocol
  concept_tags:
  - model-validation-and-calibration
  - baseline-establishment-and-drift-alerting
  confidence_class: EXTRACTED
