- id: claim:arxiv:2002.06673:8
  text: 'A model can be stable without being optimal: the two solution concepts are distinct and neither
    implies the other.'
  quote: We refer to this condition as performative stability, noting that it is neither implied by nor
    does it imply minimal performative risk.
  standalone: A model that has stopped moving under retraining is calibrated against the world it makes,
    which is not the same as being the best available model for that world. The authors give conditions
    under which the two are close.
  claim_type: evidence
