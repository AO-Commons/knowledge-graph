- id: claim:arxiv:2002.06673:7
  text: Stable points exist when the map from model to distribution is sufficiently Lipschitz.
  quote: Our algorithmic analysis of these methods reveals the existence of stable points under the assumption
    that the distribution map is sufficiently Lipschitz.
  standalone: 'Existence is not free: before this it was unclear whether a model calibrated against its
    own effects exists at all in a given setting, let alone whether it can be found efficiently. The condition
    bounds how much the world can move in response to a small change in the model.'
  claim_type: evidence
