- id: claim:arxiv:2002.06673:2
  text: Performative stability calibrates a model against the outcomes that follow from acting on its
    predictions, not against past outcomes.
  quote: Performative stability implies that the predictions are calibrated not against past outcomes,
    but against the future outcomes that manifest from acting on the prediction.
  standalone: The equilibrium notion the authors introduce, built from statistics, game theory and causality.
    It is what a model converges to when retraining accounts for its own effect on the world rather than
    treating that effect as drift.
  claim_type: definition
  concept_tags:
  - endogenous-non-stationarity
  - model-validation-and-calibration
  confidence_class: EXTRACTED
  extracted_from: abstract
  extraction_method: claude-opus-5, drafted from arXiv full text under the gated process, 2026-10-29;
