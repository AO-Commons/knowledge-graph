- id: claim:arxiv:2002.06673:6
  text: Retraining on the distribution the last model produced is the natural heuristic, and it is what
    practitioners already do for drift of any cause.
  quote: These procedures exemplify a family of retraining heuristics that are ubiquitous in practice
    for dealing with all kinds of distributions shifts irrespective of cause.
  standalone: The authors formalize the practice as repeated risk minimization — repeatedly fit the model
    that minimizes risk on the distribution the previous model induced — and analyze a cheaper gradient-step
    approximation alongside it.
  claim_type: protocol
  concept_tags:
  - continuous-evaluation-in-production
  - drift-detection-and-behavior-change-monitoring
