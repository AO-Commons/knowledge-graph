- id: claim:arxiv:2002.06673:4
  text: Performative prediction strictly subsumes strategic classification, where subjects adapt to the
    classifier.
  quote: In full generality, performative prediction strictly subsumes the setting known as strategic
    classification. We thus also give the first sufficient conditions for retraining to overcome strategic
    feedback effects.
  standalone: Strategic classification is the special case where the distribution shifts because the people
    being classified respond to the rule. The authors' framework covers that alongside the broader case
    where any decision taken on a prediction changes what is predicted.
  claim_type: position
  concept_tags:
  - specification-gaming-and-reward-hacking
  - goodhart-effects-under-machine-optimization
  confidence_class: EXTRACTED
  extracted_from: abstract
