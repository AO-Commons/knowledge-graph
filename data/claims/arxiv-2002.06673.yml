resource_id: resource:arxiv:2002.06673
claims:
- id: claim:arxiv:2002.06673:1
  text: A prediction is performative when making it may influence the outcome it aims to predict.
  quote: When predictions support decisions they may influence the outcome they aim to predict. We call
    such predictions performative; the prediction influences the target.
  standalone: The authors note performativity is well studied in policy-making and had been neglected
    in supervised learning, where it surfaces instead as distribution shift and is routinely answered
    by retraining.
  claim_type: definition
  concept_tags:
  - endogenous-non-stationarity
  - dynamic-evaluation
  confidence_class: EXTRACTED
  extracted_from: abstract
  extraction_method: claude-opus-5, drafted from arXiv full text under the gated process, 2026-10-29;
    every quote verified verbatim against the source
