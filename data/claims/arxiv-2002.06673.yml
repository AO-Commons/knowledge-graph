- id: claim:arxiv:2002.06673:3
  text: Necessary and sufficient conditions are given for retraining to converge to a performatively stable
    point of nearly minimal loss.
  quote: Our main results are necessary and sufficient conditions for the convergence of retraining to
    a performatively stable point of nearly minimal loss.
  standalone: The result turns the usual practice — retrain when performance degrades — from a heuristic
    into something with a stated condition under which it works and, by implication, conditions under
    which it does not.
  claim_type: evidence
  concept_tags:
  - endogenous-non-stationarity
  - continuous-evaluation-in-production
  confidence_class: EXTRACTED
