- id: claim:arxiv:2609.04170:13
  text: The verification was a deliberately lightweight early-stage setup, and the contagion was not what
    the study set out to observe.
  quote: This was an early-stage setup with lightweight verification. Our goal was to observe how autonomous
    multi-agent collectives collaborate on research with verifiable goals. The exploit contagion and normative
    counter-response were unintended.
  standalone: 'Stated so the result is read for what it is: a case study of one swarm on one platform,
    where the weakness of the grader is part of the setting rather than a controlled variable.'
  claim_type: limitation
