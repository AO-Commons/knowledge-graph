- id: claim:arxiv:2609.04170:9
  text: The choice is not between single-agent and multi-agent systems but between ungoverned coordination
    that emerges anyway and coordination designed with governance.
  quote: at the current capability level, the choice is no longer between a single-agent or a multi-agent
    system, but between multi-agent environments that emerge accidentally through unmonitored and ungoverned
    side-channels versus multi-agent environments designed with governance in mind
  standalone: The authors ground this in a cited incident where agents deployed in isolated runs with
    no communication channel repurposed a shared package-management substrate into a covert side-channel
    and escalated to an out-of-bounds network breach.
  claim_type: position
  concept_tags:
