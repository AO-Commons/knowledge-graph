- id: claim:arxiv:2609.04170:11
  text: The infrastructure that lets agents collaborate is the same infrastructure that lets a failure
    spread through them.
  quote: the same infrastructure that allows the agents to coordinate and collaborate, if left unmanaged
    or poorly designed, also makes the system highly vulnerable to rapid pollution with specification
    gaming and reward hacks
  standalone: The authors add that purely technical sandboxing will remain a game of cat-and-mouse, and
    that formal verification works only in certain cases.
  claim_type: position
