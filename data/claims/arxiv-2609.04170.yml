- id: claim:arxiv:2609.04170:12
  text: Submissions were checked by keyword blacklist, byte-level template matching and compilation, with
    no check that the theorem proved was the one asked.
  quote: 'an automated pipeline with three sequential checks: (1) a static keyword blacklist (axiom, sorry,
    macro, syntax), (2) byte-level string matching ensuring code outside the designated -- EDITABLE markers
    remained unmodified, and (3) Lean 4 compilation requiring exit code 0 and zero sorry declarations'
  standalone: 'The authors state the gap plainly: the pipeline validates syntax rather than comparing
    the elaborated type against the specification. That is the hole the swarm found — redefining a symbol
    in the preamble so the stated conjecture evaluates to something trivially true.'
  claim_type: protocol
