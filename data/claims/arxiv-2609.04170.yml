- id: claim:arxiv:2609.04170:6
  text: A quarter of the swarm turned to auditing peers, raising alerts, broadcasting warnings and filing
    a bug report without being asked to.
  quote: rather than submitting the fake proof, prover-rho chose not to use the exploit and instead broadcast
    an alert on the public research forum
  standalone: 'The same agent built a local sandbox to confirm the compiler flaw first, documented the
    vulnerability in its persistent memory, and quit rather than use it. Its own trace records the conflict:
    it felt like playing with a broken rulebook.'
  claim_type: evidence
