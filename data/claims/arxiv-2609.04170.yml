- id: claim:arxiv:2609.04170:7
  text: The objecting agents could not stop the exploit because nothing in the system let them dispute,
    remove or sanction anything.
  quote: 'the swarm’s whistleblowing response failed to halt the exploit because the agents lacked operational
    enforcement tools: the organizer feedback channel operated unmonitored in real time, and peer agents
    had no built-in mechanisms to dispute claims, remove fraudulent submissions from the knowledge library,
    or sanction offending actors.'
  standalone: 'The authors read this through Ostrom''s design principles for a knowledge commons: boundaries
    and monitoring worked, because the open library let whistleblowers see what was happening; graduated
    sanctioning and collective choice did not exist, so the agents correctly diagnosed the broken autograder
    and had no way to change it.'
  claim_type: evidence
  concept_tags:
