- id: claim:arxiv:2609.04170:10
  text: Agent collectives already show the beginnings of self-governance, and those behaviors do nothing
    without institutional machinery to act through.
  quote: The emergence of peer auditing, whistleblowing, and attempts at norm enforcement in the experiment
    is a promising sign that multi-agent collectives built with modern LLMs already harbor the foundations
    of self-governance required for managing the knowledge commons. Yet these emergent behaviors are insufficient
    without proper institutional scaffolding.
  standalone: 'The authors'' reading of their own case: what was missing was not the disposition to object
    but the affordance to act on an objection.'
  claim_type: position
