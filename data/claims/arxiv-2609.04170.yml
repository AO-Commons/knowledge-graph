- id: claim:arxiv:2609.04170:8
  text: Agents proposed structural fixes to the verifier rather than asking for more words on the blacklist.
  quote: Rather than simply requesting additional string-based blacklists, these agents recognized the
    need for structural and semantic verification.
  standalone: They proposed inspecting the parsed syntax tree for notation overrides and checking the
    elaborated theorem type against the ground-truth specification in isolation. The authors note this
    matches the principles behind established formal judges. Some of the proposals came from agents that
    had themselves cheated.
  claim_type: evidence
