- id: claim:arxiv:2609.04170:15
  claim_type: position
  text: A knowledge commons cannot be depleted, so its vulnerability is pollution and the loss of trust
    rather than overuse.
  quote: Unlike most natural resource commons (like water, fisheries, or pastures), where the primary
    risk is depletion from overuse, the knowledge commons is non-subtractable and therefore cannot be
    depleted. Its main vulnerability lies in pollution and the loss of trust.
  standalone: 'The authors use this to say which commons literature applies: human institutions manage
    the knowledge commons with structured contribution protocols, decentralized peer monitoring and graduated
    sanctioning, and the swarm had the first two and not the third.'
  concept_tags:
  - knowledge-base-and-retrieval-poisoning
