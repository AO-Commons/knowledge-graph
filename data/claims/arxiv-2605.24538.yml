- id: claim:arxiv:2605.24538:4
  text: Governance should move from addressing agents to shaping the substrate that decides which actions
    are possible.
  quote: Protocol-based constitutive governance does not address the agents operating within a system
    but shapes the substrate that determines what kinds of actions are possible within it.
  standalone: The authors frame this through Lessig's modalities of regulation and Searle's distinction
    between regulative and constitutive rules — a shift in the locus of governance from policy to protocol,
    chosen because it does not depend on the principal-agent chain that decentralization breaks.
  claim_type: position
  concept_tags:
  - ex-ante-behavioral-harness
  - agentic-ai-governance-frameworks
  confidence_class: EXTRACTED
  extracted_from: abstract
  extraction_method: claude-opus-5, drafted from arXiv full text under the gated process, 2026-10-29;
    every quote verified verbatim against the source
  review_status: machine-checked
  attribution: own
- id: claim:arxiv:2605.24538:5
  text: Architectural constraints are normally authorized by a policy layer, and without that chain protocol
    governance has no source of legitimacy.
  quote: In conventional governance, architectural constraints are authorized by a prior policy layer.
    In DeAI, that chain is fractured. Protocol governance must therefore develop alternative sources of
    legitimacy or risk becoming an unaccountable exercise of technocratic power.
  standalone: 'The authors treat this as the central political problem rather than an afterthought: moving
    governance into the substrate makes it effective and removes the democratic authorization that made
    it answerable.'
  claim_type: position
  concept_tags:
  - consent-to-being-governed-by-non-human-decision-makers
  - legitimacy-erosion-through-automation
  confidence_class: EXTRACTED
