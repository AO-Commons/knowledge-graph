- id: claim:arxiv:2605.24538:2
  text: The governance vacuum is a system consequential enough to need governing that lacks the properties
    governance frameworks assume of their targets.
  quote: 'we call the governance vacuum: a condition in which AI systems are consequential enough to require
    governance but lack the properties that existing frameworks presuppose in their targets'
  standalone: Named as a condition of the system rather than a failure of any regulator, and analyzed
    as a six-layer decentralizing stack in which partial decentralization at each layer compounds into
    the whole.
  claim_type: definition
  concept_tags:
  - no-identifiable-accountable-party
  - enforcement-against-organizations-without-legal-form
  confidence_class: EXTRACTED
  extracted_from: abstract
  extraction_method: claude-opus-5, drafted from arXiv full text under the gated process, 2026-10-29;
    every quote verified verbatim against the source
  review_status: machine-checked
  attribution: own
- id: claim:arxiv:2605.24538:3
  text: 'The vacuum takes two distinct forms: nobody can be addressed, or the party addressed cannot change
    the system.'
  quote: 'This vacuum takes two analytically distinct forms: an accountability gap, where no addressable
    principal can be identified, and an incapacitation gap, where even an identified principal cannot
    alter the running system.'
  standalone: 'The distinction is load-bearing for the argument: identifying a responsible party does
    not help if that party has no means of stopping or altering what is running, so finding an addressee
    and having an effect are separate problems.'
  claim_type: definition
  concept_tags:
