- id: claim:arxiv:2605.24538:7
  text: No existing proposal satisfies all four conditions; each meets some and falls short on others.
  quote: No existing proposal fully resolves this problem. Zero-knowledge verification, DAO governance,
    AI identification systems, and society-in-the-loop frameworks each address some of the relevant ethical
    conditions—of legitimacy, contestability, transparency, and non-domination—while falling short on
    others.
  standalone: The authors name four candidate approaches and assess each against their own four conditions,
    concluding a defensible regime would need them layered rather than chosen between.
  claim_type: gap
