# Seven claims from a conceptual paper whose body surveys the layers of the
# decentralizing stack. See the head of arxiv-2505.02077.yml.
resource_id: resource:arxiv:2605.24538
claims:
- id: claim:arxiv:2605.24538:1
  text: Every major AI governance framework assumes an identifiable entity that can be held responsible
    and compelled to comply.
  quote: Every major framework for governing artificial intelligence presupposes an identifiable entity—a
    developer, deployer, or operator—who can be held responsible and compelled to comply.
  standalone: 'The authors make the assumption explicit in order to show what dissolves it: decentralized
    AI spread across model, training, compute, harness, identity and ownership layers, where partial decentralization
    at each compounds.'
  claim_type: position
  concept_tags:
  - no-identifiable-accountable-party
  - agentic-ai-governance-frameworks
  confidence_class: EXTRACTED
