- id: claim:arxiv:2605.24538:6
  text: 'Four conditions are set for architectural governance: legitimacy, contestability, transparency,
    and non-domination.'
  quote: We identify four ethical conditions—legitimacy, contestability, transparency, and non-domination—that
    such governance must satisfy to avoid degenerating into unaccountable technocratic power
  standalone: Offered as the test any protocol-level governance has to pass, and used in the paper to
    assess existing proposals rather than left as a statement of values.
  claim_type: definition
  concept_tags:
  - contestability-as-a-legitimacy-condition
  - sources-of-legitimate-machine-authority
  confidence_class: EXTRACTED
