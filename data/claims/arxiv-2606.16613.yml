- id: claim:arxiv:2606.16613:8
  text: Production, financing, regulation and contracts are abstracted away, and real production can involve
    long horizons and significant uncertainty.
  quote: in our setting, goods can be generated via simple tools such as produce_item and roast, whereas
    in reality production often involves long time horizons and significant uncertainty
  standalone: The authors note real supply chains are deeper and more heterogeneous than the simplified
    tiers here, and that bridging the gap may need either a richer simulation or hybrid settings connecting
    simulation to real systems.
  claim_type: limitation
  concept_tags:
  - train-test-deploy-gap
