- id: claim:arxiv:2606.16613:7
  text: Each model was run three times, so small differences between them may not be significant.
  quote: Due to high API costs, we evaluate each model using only three runs. As a result, small performance
    differences may not be statistically significant.
  standalone: The authors state the variance is high from both environment randomness and the stochasticity
    of multi-agent LLM systems, and hold that the runs still support the qualitative findings — idle-drift,
    and differences in willingness to trade and communicate — rather than the ranking.
  claim_type: limitation
