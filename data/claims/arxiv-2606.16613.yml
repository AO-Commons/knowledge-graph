claims:
- id: claim:arxiv:2606.16613:1
  text: Agents in the same layer of the supply chain almost never messaged each other.
  quote: A striking pattern across all five representative models is the near-total silence between same-layer
    competitors
  standalone: Across five models, outbound messages went to upstream farmers and downstream retailers
    but essentially never to the competing roaster — at most one per run on average. The authors read
    it as explicit coordination between direct competitors not being discovered by these models.
  claim_type: evidence
  concept_tags:
  - agent-collusion-and-cartel-formation
  - emergent-collusion
  confidence_class: EXTRACTED
  extracted_from: results
  extraction_method: claude-opus-5, drafted from arXiv full text under the gated process, 2026-10-29;
    every quote verified verbatim against the source
  review_status: machine-checked
  attribution: own
- id: claim:arxiv:2606.16613:2
  text: The models that earned most also communicated most with their counterparties, which the authors
    suggest drove the difference.
  quote: GPT-5.5 maintains consistently high daily tool calls throughout the entire horizon and sends
    markedly more messages than other models, suggesting that sustained activity and frequent inter-agent
    communication are key drivers of its success.
  standalone: Running a coffee roaster for 90 simulated days against five other firms, the best-performing
    models traded and messaged more; the authors note profitability tracked proactive price negotiation
    rather than trade volume alone.
  claim_type: evidence
  concept_tags:
  - agent-performance-in-organizational-context
  - inter-agent-negotiation-protocols
  confidence_class: EXTRACTED
  extracted_from: results
  extraction_method: claude-opus-5, drafted from arXiv full text under the gated process, 2026-10-29;
    every quote verified verbatim against the source
  review_status: machine-checked
  attribution: own
- id: claim:arxiv:2606.16613:3
  text: One model went idle partway through each run and stayed idle, while still producing coherent plans.
  quote: Across the three runs, prolonged inactivity emerges on days 26, 66, and 25, respectively, and
    persists for the remainder of the simulation.
  standalone: Claude Haiku 4.5 averaged about 40 idle days of 90 and was the only model with negative
    mean net income. In every run the agent neither answered messages nor transacted from that point on,
    while continuing to reason about its situation — the behavior the authors name idle-drift.
  claim_type: evidence
  concept_tags:
  - slow-onset-degradation
  - long-horizon-and-multi-step-task-evaluation
  confidence_class: EXTRACTED
