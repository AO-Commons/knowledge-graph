- id: claim:arxiv:2606.16613:10
  claim_type: definition
  text: Idle-drift is the authors' name for an agent that keeps reasoning while repeatedly choosing to
    do nothing.
  quote: Claude Haiku 4.5 exhibits an idle-drift failure mode, repeatedly choosing inaction despite producing
    coherent assessments and plans
  standalone: 'Named from one model''s behavior on this benchmark, and distinguished from an agent that
    has stopped working: the reasoning trace stays coherent and forward-looking, so a check that reads
    the agent''s plans sees nothing wrong while the business stops trading.'
  concept_tags:
  - slow-onset-degradation
  - silent-failures-with-no-signal
