- id: claim:arxiv:2606.16613:6
  text: The evaluated model runs one firm among six, with the other five run by a fixed reference model.
  quote: the evaluated LLM is assigned the role of roaster_A, while the remaining five firms are independently
    operated by LLM agents that also seek to maximize cumulative net income
  standalone: Two farmers, two roasters and two retailers over 90 simulated days, each managing cash,
    inventory and pricing. Background agents run on a fixed model chosen for stable long-horizon behavior,
    so differences in score are attributable to the agent under test rather than to its opponents.
  claim_type: protocol
