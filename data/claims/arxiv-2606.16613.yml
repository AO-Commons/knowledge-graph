- id: claim:arxiv:2606.16613:5
  text: Both rule-based baselines lost money, suggesting the benchmark cannot be passed by a fixed policy.
  quote: PassiveRoaster and HeuristicRoaster both exhibit negative net income and rank among the worst-performing
    models, suggesting that CoffeeBench requires adaptive decision-making and coordinated communication
    with other agents for successful trading
  standalone: The authors use the two baselines to establish that the benchmark is not passable by a fixed
    policy — the score reflects adaptive trading and communication rather than the environment paying
    out on its own.
  claim_type: evidence
