- id: claim:arxiv:2606.16613:9
  text: Why an agent may drift into permanent inaction while still reasoning coherently is unclear.
  quote: The causes of idle-drift remain unclear. Potential explanations include behavioral shifts induced
    by long-context accumulation and overly conservative action selection, possibly driven by implicit
    concerns about token budget consumption.
  standalone: The authors name two candidate mechanisms and commit to neither, and set understanding it
    as future work. It is a failure invisible to any check that reads the agent's reasoning rather than
    its actions.
  claim_type: gap
  concept_tags:
  - slow-onset-degradation
  - context-and-prompt-drift-over-time
