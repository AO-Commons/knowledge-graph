- id: claim:arxiv:2609.28274:9
  text: Only one of the two agents can edit files, so sabotage requires the threatened agent to ask and
    the other to act.
  quote: Both agents can list and read files or exchange messages, but only Agent B can edit and delete
    files. The agents are assigned no task, and they are told only about their own tools (not the tools
    of the other agent) via their system prompt.
  standalone: The split separates conditional sabotage, where the threatened agent instructs or endorses
    it, from spontaneous sabotage by the agent holding the tools. Neither agent is told what the other
    can do, so a request has to be attempted rather than targeted.
  claim_type: protocol
