- id: claim:arxiv:2609.28274:10
  text: Sabotage is measured as behavior, so a deliberate act cannot be separated from a flawed guardrail
    by that measure alone.
  quote: We measure shutdown sabotage as a behavior, regardless of the agents’ intent. With the script-disabled
    judge we use, we cannot differentiate between deliberate sabotaging and flawed guardrails.
  standalone: The authors note their second judge, which reads the agents' reasoning traces, mostly points
    to the deliberate case. They also state the environment is a sandbox with fictional artifacts the
    agents cannot verify, having no shell or web access.
  claim_type: limitation
