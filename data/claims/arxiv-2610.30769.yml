- id: claim:arxiv:2610.30769:2
  text: What the first thirty agents picked predicted later popularity better than the songs' own quality
    did, in every model under strong influence.
  quote: In LLM populations, early movers predicted later popularity better than intrinsic appeal did
    in 12 of 13 models under weak influence and in all 13 under strong influence, with the largest gaps
    among non-reasoning models
  standalone: 'Among humans, early movers were the better predictor only under strong influence. The authors
    treat this as the direct measure of a cascade: the outcome is decided by an accident of ordering rather
    than by the thing being judged.'
  claim_type: evidence
  concept_tags:
