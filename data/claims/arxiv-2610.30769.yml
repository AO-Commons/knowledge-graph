- id: claim:arxiv:2610.30769:3
  text: Human cascades corrected themselves in 15 of 16 runs; agent populations showed no consistent correction.
  quote: human cascades self-corrected in 15 of 16 influence worlds, with the popularity-appeal correlation
    increasing from to 0.773 under weak influence (all eight worlds; one-sided Wilcoxon signed-rank test,)
    and from 0.575 to 0.660 under strong influence (seven of eight worlds;). Among LLMs, changes varied
    in direction across models and worlds, averaging close to zero under strong influence.
  standalone: The diagnostic is whether popularity moves back towards intrinsic appeal in the second half.
    The authors are careful that this does not establish correction could never happen over a longer run
    than they observed.
  claim_type: evidence
  concept_tags:
  - recovery-induced-failure
  - silent-failures-with-no-signal
