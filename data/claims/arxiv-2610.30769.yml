- id: claim:arxiv:2610.30769:5
  text: Without social feedback the agent populations were almost perfectly predictable; with it, every
    model exceeded human unpredictability.
  quote: unpredictability in the independent condition was close to zero across all models and slightly
    below the level observed among humans
  standalone: 'The independent baseline is what makes the comparison informative: the instability is produced
    by the agents seeing each other''s choices, not by any randomness in the agents themselves. All 13
    models exceeded the human figure under weak influence.'
