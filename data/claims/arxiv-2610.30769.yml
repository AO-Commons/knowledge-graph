- id: claim:arxiv:2610.30769:7
  text: The human comparison is qualitative, because the task was adapted and no matched human replication
    was run.
  quote: A matched human replication of this study is needed to rule out these design differences as the
    explanation for observed behavioral differences.
  standalone: Agents read lyrics rather than hearing songs, recommended rather than downloaded, assessed
    a fixed four, and saw a list rather than a grid. The authors name every difference and say plainly
    what it costs the human-versus-model contrast.
  claim_type: limitation
