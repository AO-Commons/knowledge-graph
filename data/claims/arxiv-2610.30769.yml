claims:
- id: claim:arxiv:2610.30769:1
  text: Populations of agents shown each other's choices diverged from independent judgment by about nine
    times the human figure.
  quote: Mean KL divergence was about nine times the human benchmark under weak influence and four times
    under strong influence
  standalone: Thirteen models run through a replication of the Music Lab experiment, recommending unfamiliar
    songs with or without seeing cumulative recommendation counts. Divergence from what the same agents
    chose independently is the measure of herding.
  claim_type: evidence
  concept_tags:
  - feedback-loops-and-runaway-dynamics
  - unintended-coordination-and-convergence
  confidence_class: EXTRACTED
