- id: claim:arxiv:2610.30769:6
  text: Evaluating a collective of agents requires testing how outputs become the next inputs, not responses
    to a fixed signal.
  quote: Evaluating collective AI behavior therefore requires going beyond individual responses to a fixed
    signal to test how model outputs shape subsequent inputs.
  standalone: 'The authors'' reading of their own result: a model judged alone against a static benchmark
    is not being measured on the property that failed here, because the property only exists once its
    judgments become inputs for other agents.'
  claim_type: position
