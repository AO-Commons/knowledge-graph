- id: claim:arxiv:2610.30769:9
  claim_type: protocol
  text: Sixteen separate worlds per model were run from identical starting conditions, so unpredictability
    could be measured rather than inferred.
  quote: 'For each model, we created 17 worlds: one independent world of 1,440 agents, eight weak-influence
    worlds of 720 agents, and eight strong-influence worlds of 720 agents. This yielded 12,960 agents
    per model and 168,480 agents across 13 models. All worlds began with zero recommendation counts and
    evolved separately.'
  standalone: 'Running the same population repeatedly from the same start is what turns divergence between
    outcomes into evidence of a cascade: the worlds differ only in the order agents happened to arrive.
    Agents acted sequentially, could not see other worlds, and exchanged no messages — earlier choices
    reached them only as cumulative counts and, under strong influence, the resulting ordering.'
  concept_tags:
  - counterfactual-analysis-with-stochastic-agents
  - agent-based-simulation-of-organizational-dynamics
