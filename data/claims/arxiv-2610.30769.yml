- id: claim:arxiv:2610.30769:4
  text: Susceptibility fell as model capability rose, and lower susceptibility did not bring self-correction
    with it.
  quote: Reasoning and higher-intelligence models were less susceptible to herding behavior, but lower
    susceptibility did not ensure self-correction.
  standalone: Both divergence and unpredictability decline against a composite capability index. Non-reasoning
    models diverged 2.4 to 3.2 times as far as reasoning ones and were nearly twice as unpredictable,
    but the corrective dynamic humans showed did not appear with capability.
  claim_type: evidence
