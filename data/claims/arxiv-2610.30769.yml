- id: claim:arxiv:2610.30769:8
  text: The populations were one model each, could not talk to one another, and had nothing at stake.
  quote: our experiment precluded more powerful influence mechanisms like communication, task incentives,
    and social sanctioning
  standalone: 'The authors state the direction this cuts: if task complexity rises alongside capability,
    and influence is reinforced with social pressure and incentives, susceptibility to errant cascades
    may increase rather than fall.'
  claim_type: limitation
