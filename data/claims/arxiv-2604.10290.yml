- id: claim:arxiv:2604.10290:4
  text: Changing an organization's structure did not move its solutions onto a better frontier; changing
    how its agents were prompted did.
  quote: only changing the organization structure does not lead to better Pareto-optimal solutions, while
    changing how agents are prompted does have an effect
  standalone: Sampling 90 counterfactual organizations varying structure, size, roles and connectivity,
    the authors report that structural variation alone did not produce better tradeoffs between business
    effectiveness and ethics, while varying the agents' system prompts did.
  claim_type: evidence
  concept_tags:
  - agent-fleet-topologies-flat-hierarchical-market-based
  - system-prompt-and-policy-versioning
