- id: claim:arxiv:2604.10290:8
  text: An AI Organization is a multi-agent system whose agents hold distinct roles, communicate over
    a fixed graph, and share one goal.
  quote: We define AI Organizations as multi-agent LLM systems where (1) agents take on different roles,
    (2) agents communicate with one another, and (3) agents work together towards a common goal.
  standalone: The authors fix the term "AI Organization" to a cooperative multi-agent LLM system meeting
    three conditions — differentiated roles, a specified communication graph, and a shared objective —
    which excludes systems whose agents compete.
  claim_type: definition
  concept_tags:
  - autonomy-thresholds-what-makes-an-organization-agentic-rather-than-automated
  - agent-fleet-topologies-flat-hierarchical-market-based
