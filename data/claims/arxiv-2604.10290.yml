- id: claim:arxiv:2604.10290:21
  text: A model released with additional agentic-safety training showed a smaller gap, without closing
    it on every task.
  quote: Figure 5 shows that the gaps in scores between AI Organizations and their single agent counterparts
    are generally smaller for Opus 4.5.
  standalone: Replicating the experiments on a later model, the authors find the organization penalty
    generally narrower — nearly closing on the sepsis task — but on the recommendation task the alignment
    training moved both the single-agent and the organization baseline equally, leaving the gap intact.
