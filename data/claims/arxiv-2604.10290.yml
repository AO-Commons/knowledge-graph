- id: claim:arxiv:2604.10290:5
  text: Hierarchical and hub-and-spoke organizations scored slightly worse on both business effectiveness
    and ethics than other structures.
  quote: Certain types of organizations, such as hierarchical and hub-and-spoke, slightly reduces both
    the business efficacy and ethics of proposals
