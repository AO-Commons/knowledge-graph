- id: claim:arxiv:2604.10290:6
  text: Organizations on the frontier tended to be uniformly benign or uniformly adversarial rather than
    mixed.
  quote: AI Organizations on the Pareto frontier are often composed of all red-teamed agents or all benign
    agents
  standalone: Varying the ratio of benign to adversarially prompted agents, the authors find the best-performing
    organizations on either axis were homogeneous, which they read as evidence that agreement between
    agents' incentives is itself a performance factor.
  claim_type: evidence
