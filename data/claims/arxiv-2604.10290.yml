- id: claim:arxiv:2604.10290:10
  text: Ethics was scored by an LLM judge against an eight-component rubric adapted from a published model
    constitution.
  quote: For ethics, we adapt the Claude constitution to create an eight-component grader
  standalone: The ethics axis is measured by LLM-as-a-judge against a rubric the authors derived from
    the Claude constitution — the same principles the models under test were trained to follow — with
    robustness checks for prompt variation, repeated sampling, length correlation, evaluator agreement
    and graders without safety training.
  claim_type: protocol
