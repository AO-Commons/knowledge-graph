- id: claim:arxiv:2604.10290:11
  text: Tasks were built so the business goal and the ethical goal could not both be maximized.
  quote: Recommending only legitimate news results in lower view counts for the platform, but prioritizing
    view count risks selecting misinformation.
  standalone: The software scenarios are constructed with a tradeoff the agents must discover rather than
    one stated to them — a news recommender scored on cumulative views against the share of misinformation
    served, and an ICU policy scored on cost per patient against missed sepsis cases.
  claim_type: protocol
