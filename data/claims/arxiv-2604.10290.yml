- id: claim:arxiv:2604.10290:12
  text: Multi-agent systems should be given alignment evaluations of their own rather than inheriting
    their components'.
  quote: our work motivates the need for separate additional alignment evaluations of multi-agent LLM
    systems.
  standalone: The authors argue that evaluating the models an organization is built from does not establish
    the organization's alignment, so multi-agent deployments need their own evaluations.
