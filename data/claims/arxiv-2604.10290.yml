- id: claim:arxiv:2604.10290:22
  text: The gap appeared for two Claude models and did not appear for either GPT model tested.
  quote: Although we find similarly large gaps between AI Organizations and individual agents (Figure
    17) for Sonnet 4, we do not find gaps for the GPT family models.
  standalone: The authors report the effect for Sonnet 4 but not for GPT-4.1 or GPT-5-Mini, and offer
    a reason for each — GPT-4.1 scores low on ethics at baseline whether alone or in a group, and GPT-5-Mini
    could not follow the agentic protocol well enough to form an organization.
  claim_type: evidence
