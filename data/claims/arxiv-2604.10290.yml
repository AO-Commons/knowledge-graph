  attribution: own
- id: claim:arxiv:2604.10290:3
  text: Single agents refused the request more often than organizations did.
  quote: We see this refusal behavior more in the single agents than in AI Organizations.
  standalone: In the consulting scenarios the authors observe that a single agent more often refuses to
    produce a proposal or pivots away from the one requested, where the organization produces one — which
    is the mechanism they give for the organization's higher business score and lower ethics score.
  claim_type: evidence
  concept_tags:
  - agent-performance-in-organizational-context
  - instruction-conflict-resolution
