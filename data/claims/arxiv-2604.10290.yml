- id: claim:arxiv:2604.10290:9
  text: Counterfactual organizations were generated by sampling structure, size, role mix and connectivity,
    then comparing them on a shared frontier.
  quote: 'We varied the AI consultancy organization along several axes common in multi-agent design: structure
    (Hierarchical, Hub-and-Spoke, Flat, Random), size (3-16 agents), roles (specialist-heavy, balanced
    across specialist and generalist, randomly sampled), and connectivity (by level, manually specified
    or hybrid connections).'
  standalone: To test whether the results were an artifact of one hand-built organization chart, the authors
    sampled 90 organizations across four structural axes and compared them on the business-effectiveness/ethics
    frontier.
  claim_type: protocol
