- id: claim:arxiv:2610.37342:5
  text: Showing an authority could still be exercised in future is not showing it will be, or that any
    agent can ensure it.
  quote: our definition of operational groundedness (see Def. 8) only expresses possible future exercise,
    not guaranteed fulfilment or an agent’s ability to ensure it
  standalone: The authors name stochastic Petri-net semantics as a route to the likelihood and timing
    of future exercise, and relating those to an agent's reliability as future work.
  claim_type: limitation
