- id: claim:arxiv:2610.37342:4
  text: The analysis is meant to run before or during deployment, not over logs after the fact.
  quote: our solution specifically targets strategies for evaluating a system before or during its deployment
  standalone: The authors contrast this with trace-based compliance checking over event logs, which they
    characterize as ex-post, and with deontic policy specification that does not model power as a stateful
    object bound to operational transitions.
  claim_type: protocol
  concept_tags:
