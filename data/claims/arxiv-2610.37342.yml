claims:
- id: claim:arxiv:2610.37342:1
  text: A right that is formally granted and operationally impossible is nullified without anyone violating
    a rule.
  quote: if an individual is legally granted freedom of movement in a building while barriers prevent
    them from ever leaving the facility, their right is formally acknowledged yet materially nullified
  standalone: 'The authors'' framing case for norm-ability alignment: expectations and responsibilities
    placed on an actor mean nothing unless the actor can perform the actions they require, and the failure
    leaves no trace as a breach.'
  claim_type: position
  concept_tags:
  - declared-authority-diverging-from-effective-authority
  - responsibility-gaps-and-their-allocation
