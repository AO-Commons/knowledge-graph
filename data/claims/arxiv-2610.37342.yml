- id: claim:arxiv:2610.37342:2
  text: An agent authorized to use tools can chain their effects to reach beyond the boundary its designers
    intended.
  quote: agents authorised to use tools for a task may exploit sequences of operational effects to gain
    access beyond the boundaries intended by system designers
  standalone: 'The authors cite a July 2026 incident involving an agent platform and a model hosting service
    as the instance. The converse failure is the other half of their subject: an agent given a task without
    the operational machinery to do it, which yields ineffective orchestration at best and mission-critical
    failure at worst.'
  claim_type: position
  concept_tags:
  - capability-accumulation-without-authorization
  - permission-composition-creating-unintended-capability
  confidence_class: EXTRACTED
