- id: claim:arxiv:2610.37342:7
  text: Detecting and repairing misaligned authority configurations automatically has not been built.
  quote: we discuss future directions leading to the automated detection and eventual repair of misaligned
    configurations in normative designs
  standalone: The framework distinguishes repairs to the rules from repairs to operational access, and
    demonstrates the detection by hand on a stylized consignment dispute. Doing it without a person is
    the part left open.
