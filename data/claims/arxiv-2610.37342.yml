- id: claim:arxiv:2610.37342:3
  text: 'Two kinds of misalignment are distinguished: authority whose exercise has become impossible,
    and actions that remain possible without authority.'
  quote: The framework distinguishes positions whose exercise has become operationally impossible from
    enabled actions unsupported by institutional power, making both kinds of misalignment explicit over
    reachable configurations.
  standalone: The institutional layer and the operational layer are modeled separately — institutional
    power as a stateful object, operational ability as Petri-net process primitives — so the question
    becomes whether every granted position is reachable and every reachable action is granted.
  claim_type: definition
  concept_tags:
  - authority-specification-languages-and-machine-readable-policy
  - boundary-verification-proving-the-declared-scope-equals-the-actual-scope
  confidence_class: EXTRACTED
