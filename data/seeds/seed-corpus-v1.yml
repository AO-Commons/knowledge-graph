# --- Round 2: citation expansion from Multi-Agent Risks (W4407806359) ---
# Four of eight citing works passed the scope test. The rejects are worth
# naming: two rheumatology applications, a utopian-futures simulation piece,
# and a playbook for governing LLM use in research. All are about AI, none is
# about an organization where agents hold authority — which is the scope test
# doing its job on a discovery path that cannot apply it itself.
round2:
  - doi: 10.12688/f1000research.169927.1
    title: "Trustworthy agentic AI systems: a cross-layer review of architectures, threat models, and governance"
    date: 2025-09-11
