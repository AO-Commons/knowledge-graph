# Seed corpus v1 — the starting set for Milestone 2.
#
# Curated by hand, resolved against OpenAlex, and expanded into
# data/resources/ by scripts/ingest_seeds.py.
#
# Taxonomy tags here are a FIRST PASS assigned from titles, abstracts, and
# venue — not classification-pipeline output, and not reviewed. They are good
# enough to make the graph navigable and wrong often enough that they should
# be treated as a to-do list rather than as findings. `review_status` on each
# record records that.
#
# The scope test still applies: an item belongs if it would change how you
# design, operate, oversee, or hold accountable an organization where agents
# act with real authority. Items kept mainly as method precedent or borrowed
# foundation are marked `borrowed: true`.

