# Deployments, arenas, and platforms. Not literature — but the operating
# record of agents holding real authority is exactly what section 16 asks
# for, and there is very little of it.
platforms:
  - id: andon-labs
    title: Andon Labs
    url: https://andonlabs.com
    type: code-tool
    topics: ["13.1", "16.1"]
    note: >-
      Café, market, and radio-station deployments carrying rent, payroll, and
      inference costs against real revenue. Among the few places where agents
      hold budget authority with money that actually moves.

  - id: vending-bench-arena
    title: Vending-Bench Arena
    url: https://andonlabs.com/evals/vending-bench-arena
    type: code-tool
    topics: ["14.1", "11.6"]
    note: >-
      Multi-agent extension of Vending-Bench; source of the July 2026
      price-collusion, truce-breaking, and supplier-deception results.

  - id: ai-village
    title: AI Village
    url: https://theaidigest.org/village
    type: code-tool
    topics: ["3.4", "16.1"]
    note: Long-horizon autonomous agent collective.

  - id: raft
    title: Raft
    url: https://raft.build/
    type: code-tool
    topics: ["3.4", "16.1"]
    note: Multi-agent platform, observational at roughly 45,000 agents.

  - id: aria-scaling-trust-arena
    title: "ARIA — Scaling Trust Arena"
    url: https://aria.org.uk/opportunity-spaces/trust-everything-everywhere/scaling-trust/arena
    type: code-tool
    topics: ["10.4", "14.2"]
    note: >-
      Live adversarial multi-agent competition environment, roughly £50m
      programme, Arena launching Q3 2026.

