source:
  name: awesome-builder-tools
  repository: https://github.com/framework-zero/awesome-builder-tools
  maintainer: Framework Zero
  license: MIT
  synced_at: '2026-08-24'
  commit: f495ec1a0546
  committed_at: '2026-07-09'
  note: Mirrored with attribution under the MIT licence. Descriptions are upstream's own words.
    Nothing here is a claim by AO Commons about a tool; a profiled record in data/resources/
    is.
entries:
- name: Open SaaS
  url: https://github.com/wasp-lang/open-saas
  section: 'Quick Start: The Anchor Stack'
  description: 100% free, MIT-licensed full-stack SaaS boilerplate (React/Node/Prisma via
    Wasp). AI-ready — ships `AGENTS.md` + a Claude Code plugin. Auth, Stripe/Polar.sh/Lemon
    Squeezy payments, S3 uploads, admin dashboard, one-command deploy. This is your product-facing
    shell.
- name: paperclip
  url: https://github.com/paperclipai/paperclip
  section: 'Quick Start: The Anchor Stack'
  description: The open-source app for managing agents at work — the dashboard/interface layer
    for viewing and directing an agent workforce. This is your company-facing shell.
  promoted_to: resource:tool:paperclip
- name: LangGraph
  url: https://github.com/langchain-ai/langgraph
  section: Managing the Company
  subsection: Agentic Orchestration
  description: Build resilient, stateful multi-agent workflows as graphs. The most production-proven
    framework in 2026 — ~400 production deployments (Cisco, Uber, LinkedIn, BlackRock, JPMorgan),
    34.5M monthly downloads. Steeper learning curve; pays back at production scale — reach
    for this once you need durable state or an audit trail.
  stars: 24.8k+
- name: CrewAI
  url: https://github.com/crewAIInc/crewAI
  section: Managing the Company
  subsection: Agentic Orchestration
  description: Framework for orchestrating role-playing autonomous AI agents. Fastest path
    to a working prototype (2–4 hrs). MIT. **Caveat:** telemetry collection reportedly can't
    be easily disabled — a real issue if you're privacy-sensitive; the role/goal/backstory
    abstraction can get "too rigid" once work doesn't decompose into team-shaped roles.
  stars: 50.8k+
- name: Mastra
  url: https://github.com/mastra-ai/mastra
  section: Managing the Company
  subsection: Agentic Orchestration
  description: TypeScript-native agent framework, v1.0 shipped Jan 2026. Real production wins
    (Replit Agent 3, SoftBank). The natural fit if your stack is already Node/TS (which it
    is, via Open SaaS).
  stars: 23k+
- name: open-multi-agent (OMA)
  url: https://github.com/open-multi-agent/open-multi-agent
  section: Managing the Company
  subsection: Agentic Orchestration
  description: 'Lean, fully permissive (3 core deps) TypeScript-native orchestrator. Goal-driven:
    a Coordinator builds the task DAG **at runtime** instead of a hand-wired graph up front.
    MIT, actively growing.'
  stars: 6.5k+
- name: Google ADK
  url: https://github.com/google/adk-python
  section: Managing the Company
  subsection: Agentic Orchestration
  description: 'Google''s Agent Development Kit — build, evaluate, deploy AI agents. Reported
    gap: in-memory session state is lost on Cloud Run container restarts.'
  stars: 20k+
- name: Agent2Agent (A2A)
  url: https://github.com/a2aproject/A2A
  section: Managing the Company
  subsection: Agentic Orchestration
  description: Open protocol for communication between opaque agentic applications — useful
    once you have more than one agent-built company that needs to talk to another.
  stars: 24k+
- name: Temporal
  url: https://github.com/temporalio/temporal
  section: Managing the Company
  subsection: Agentic Orchestration
  description: Durable workflow execution — retries, timeouts, versioning for long-running
    processes. The reliability substrate underneath a lot of "agent doesn't drop the ball"
    claims.
  stars: 14k+
- name: Composio
  url: https://github.com/ComposioHQ/composio
  section: Managing the Company
  subsection: Agentic Orchestration
  description: Agent tooling platform — 250+ integrations for AI agents (GitHub, Slack, Notion,
    etc).
  stars: 15k+
- name: AgentMail
  url: https://www.agentmail.to/
  section: Managing the Company
  subsection: Agent Interfaces to the World (Email, Voice, Browser)
  description: 'The category-defining product — API-first email provider built for AI agents:
    programmatic inbox creation, full threading, webhooks, MCP server, custom domains with
    DKIM/SPF/DMARC. SDKs are MIT and see real traction (71K+ weekly npm downloads). **Note:**
    this is a hosted service, not self-hostable infrastructure — the SDK is open, the mail
    server behind it isn''t.'
- name: Digidai/mails
  url: https://github.com/Digidai/mails
  section: Managing the Company
  subsection: Agent Interfaces to the World (Email, Voice, Browser)
  description: 'Self-hosted, MIT, deploys on Cloudflare''s free tier. The most built-out self-hosted
    alternative — has a real surrounding ecosystem: an MCP server, a Python SDK, agent skill
    files, and even an [open-source AI SDR agent](https://github.com/Digidai/mails-gtm-agent)
    built on top of it for cold outreach.'
- name: agentteamhq/agentteam-email
  url: https://github.com/agentteamhq/agentteam-email
  section: Managing the Company
  subsection: Agent Interfaces to the World (Email, Voice, Browser)
  description: 'Self-hosted (Docker Compose or Helm), MIT. Notably security-conscious: untrusted
    inbound mail opens in a dedicated review surface rather than being handed straight to
    the agent, and sending can be gated on human approval — a good default posture for a company
    where agents draft but don''t always auto-send.'
- name: kikubot
  url: https://github.com/mxaiorg/kikubot
  section: Managing the Company
  subsection: Agent Interfaces to the World (Email, Voice, Browser)
  description: 'Architecturally different and worth knowing about: **each agent is literally
    an inbox**, and agents coordinate with each other by emailing one another (a coordinator
    delegates to specialists via `message_tool`). MIT, used in production at mxHERO. If Framework
    Zero wants "email as the company''s internal nervous system" rather than just an outbound
    channel, this is the closest existing pattern.'
- name: email-agent-mcp
  url: https://github.com/usejunior/email-agent-mcp
  section: Managing the Company
  subsection: Agent Interfaces to the World (Email, Voice, Browser)
  description: For the opposite case — an agent operating *your own* existing Gmail/Microsoft
    365 mailbox rather than a fresh agent-only inbox. Apache-2.0. Send/delete are allowlist-gated
    and off by default; useful where you want an agent triaging a real human inbox without
    giving it free rein.
- name: Patter
  url: https://github.com/PatterAI/Patter
  section: Managing the Company
  subsection: Agent Interfaces to the World (Email, Voice, Browser)
  description: The strongest open option — an open-source Vapi/Retell alternative. MIT, 931★,
    very actively maintained. Full stack (LLM, STT, TTS, realtime engine, telephony carrier)
    with a swappable provider at every layer, plus an automatic LLM fallback chain and vendor-neutral
    OpenTelemetry tracing. Give an agent a phone number in a few lines.
- name: OpenVox
  url: https://github.com/amznsri/openvox
  section: Managing the Company
  subsection: Agent Interfaces to the World (Email, Voice, Browser)
  description: Apache-2.0, ships the *entire* stack including a dashboard and 33 ready-made
    templates (support, SDR, receptionist, document Q&A, an "executive assistant" combining
    email + calendar). Reaches phone, WhatsApp, and Telegram from one system. Self-hosts in
    60 seconds. The most turnkey/non-technical-friendly option here — worth prioritizing for
    a grassroots, non-engineer audience over hand-wiring Patter yourself.
- name: active-call
  url: https://github.com/miuda-ai/active-call
  section: Managing the Company
  subsection: Agent Interfaces to the World (Email, Voice, Browser)
  description: Rust, infrastructure-level (SIP/WebRTC core rather than a full product). The
    pick if you want to self-host the telephony layer itself, including fully offline/local
    ASR+TTS for privacy-sensitive use.
- name: browser-use
  url: https://github.com/browser-use/browser-use
  section: Managing the Company
  subsection: Agent Interfaces to the World (Email, Voice, Browser)
  description: The foundational, most-adopted open-source browser-agent library — the default
    choice for "let an agent operate a real browser."
- name: browser-harness
  url: https://github.com/browser-use/browser-harness
  section: Managing the Company
  subsection: Agent Interfaces to the World (Email, Voice, Browser)
  description: 'From the same team, a leaner sibling: connects an LLM directly to your real
    Chrome via CDP with almost nothing in between, and the harness itself gets edited/improved
    by the agent as it runs. MIT, very active.'
- name: Pie
  url: https://github.com/WiseriaAI/pie-ai-agent
  section: Managing the Company
  subsection: Agent Interfaces to the World (Email, Voice, Browser)
  description: A polished Chrome side-panel extension rather than a library — install from
    the Chrome Web Store, bring your own API key from any of 11 providers, describe a task
    in plain language. Apache-2.0, very active. The best fit if your audience is non-technical
    builders who shouldn't need to run a Python script to get browser automation working.
- name: sediman-browse
  url: https://github.com/JasonHonKL/sediman-browse
  section: Managing the Company
  subsection: Agent Interfaces to the World (Email, Voice, Browser)
  description: 'Differentiated: "watch me do it once, then do it forever." Records a demonstrated
    workflow, replays it on a cron schedule, self-heals when a site''s layout changes, and
    decides on its own when a completed task is worth saving as a reusable skill. The right
    tool for recurring company operations (daily competitor-pricing checks, weekly reporting)
    rather than one-off tasks.'
- name: OneManCompany
  url: https://github.com/1mancompany/OneManCompany
  section: Managing the Company
  subsection: AI Company Builders & Digital-Twin Platforms
  description: Open-source **agentic operating system** — one command, no Docker/Python/config,
    and you get a full AI company in your browser (pixel-art office visualization). Runs *above*
    agent frameworks, orchestrating a hierarchical AI team. Built-in **Talent Market** (community-verified
    AI-employee marketplace), **1-on-1 coaching** that becomes permanent agent "work experience,"
    **quarterly performance reviews** (probation/PIP/promotion/termination), structured **V1→V2→V3
    iteration**, and **self-evolution** (repeated tasks auto-distill into reusable workflows).
    Apache-2.0.
  stars: 343+
- name: KorroAi/mue-x
  url: https://github.com/KorroAi/mue-x
  section: Managing the Company
  subsection: AI Company Builders & Digital-Twin Platforms
  description: Self-evolving agent engine open-sourced by [KORRO](https://korro.me/) — a real,
    currently-running six-agent autonomous company. Reads its own Python source and rewrites
    it via validated AST mutations, with kernel-integrity protection and auto-rollback. MIT.
  stars: 62+
- name: Plane
  url: https://github.com/makeplane/plane
  section: Managing the Company
  subsection: Project & Task Management (Agent-Native)
  description: Mature open-source Jira/Linear/Monday/ClickUp alternative. AGPL-3.0, very active
    (53.9k★). The right base platform.
- name: Plane Plus
  url: https://github.com/eyriehq/plane-plus
  section: Managing the Company
  subsection: Project & Task Management (Agent-Native)
  description: '**AI-agent-first fork of Plane** — agent-ergonomic APIs, first-class epics
    with analytics endpoints, plus a companion Python SDK + FastMCP server so agents don''t
    have to reason about Plane''s polymorphic issue types. Drop-in compatible with upstream
    Plane''s deployment.'
- name: Poiesis
  url: https://github.com/arthur2jolly/poiesis
  section: Managing the Company
  subsection: Project & Task Management (Agent-Native)
  description: Production-oriented agile PM built natively for MCP 2.0. Full Projects→Epics→Stories→Tasks
    hierarchy, dependency/blocker tracking, 36+ MCP tools.
- name: markplane
  url: https://github.com/zerowand01/markplane
  section: Managing the Company
  subsection: Project & Task Management (Agent-Native)
  description: Markdown-first, git-native PM — no database; every task/epic/plan is a version-controlled
    file, auto-compressed into ~1000-token `.context/` summaries an AI can load without reading
    everything. Apache-2.0.
- name: PinkRoosterMcp
  url: https://github.com/pinkroosterai/PinkRoosterMcp
  section: Managing the Company
  subsection: Project & Task Management (Agent-Native)
  description: Purpose-built from scratch for AI agents (not a Jira/Linear wrapper). Automatic
    state cascades, 16 Claude Code slash commands (`/pm-scaffold`, `/pm-implement`, `/pm-audit`),
    built-in cross-session **project memories**. MIT — very new, evaluate maturity before
    depending on it.
- name: Wyoming DAO LLC Supplement
  url: https://sos.wyo.gov/Forms/WyoBiz/DAO_Supplement.pdf
  section: Managing the Company
  subsection: Legal, DAO & Governance Infra
  description: 'The closest existing legal precedent to "token = ownership + governance +
    dividend claim": token purchase can confer LLC membership (as a *default* rule, overridable),
    smart contracts can legally govern votes, formation is cheap (~$100). **Real constraint:**
    a Wyoming DAO LLC must remain under the control of at least one natural person or dissolve
    — no current US state statute permits a fully autonomous, human-free legal entity. Not
    recommended by the state''s own guidance for investment/token-distribution DAOs (securities
    law exposure).'
- name: Aragon OSx
  url: https://github.com/aragon/osx
  section: Managing the Company
  subsection: Legal, DAO & Governance Infra
  description: The current, actively maintained Aragon DAO framework (v1.4, April 2025) —
    governance, treasury, and voting modules. AGPL-3.0. (The earlier product, Aragon Govern,
    is archived — use OSx.)
- name: constitutional-agent-governance
  url: https://github.com/CognitiveThoughtEngine/constitutional-agent-governance
  section: Managing the Company
  subsection: Legal, DAO & Governance Infra
  description: '`pip install constitutional-agent` — a governance layer for AI agents: 6 gates,
    12 hard constraints, a formal amendment protocol. The "WHY layer" (should the agent be
    permitted to act at all, given its constitution?) sitting above execution-boundary policy
    tools. MIT. Grew out of the ["90 Days Building a Constitutional AI Company"](https://www.cteinvest.com/blog/90-days-building-constitutional-ai-company.html)
    experiment (see [Examples & Case Studies](#examples--case-studies--companies-people-have-actually-built)).
    **The closest existing prior art for a "constitution as symbolic governance engine" design.**'
- name: Activepieces
  url: https://github.com/activepieces/activepieces
  section: Managing the Company
  subsection: Workflow Automation
  description: No-code business automation, MIT (fully permissive). **Recommended default**
    — no CVEs reported, RBAC/audit logs included free in the community edition.
- name: Windmill
  url: https://github.com/windmill-labs/windmill
  section: Managing the Company
  subsection: Workflow Automation
  description: Developer platform for scripts, workflows, and UIs. AGPLv3 core (genuinely
    OSI-approved). Best real multi-language script sandboxing (nsjail) if your team can write
    code. ⚠️ A widely-read GitHub "open letter" argues Windmill markets itself as "fully open
    source" while gating features many consider basic behind paid Enterprise Edition — not
    a license violation, but know it going in.
- name: Twenty
  url: https://github.com/twentyhq/twenty
  section: Understanding Customers
  subsection: CRM & Customer Management
  description: Modern, AI-native open source CRM. Ships an official first-party MCP server
    as of v2.0 (April 2026) — agents can read/write CRM data in natural language. AGPL-3.0
    core + carved-out commercial "Enterprise" files.
  stars: 52k+
- name: Chatwoot
  url: https://github.com/chatwoot/chatwoot
  section: Understanding Customers
  subsection: CRM & Customer Management
  description: Customer engagement platform — live chat, email, social, WhatsApp. Intercom
    alternative. This is how your company actually hears from customers, not just tracks them.
  stars: 24k+
- name: Odoo
  url: https://github.com/odoo/odoo
  section: Understanding Customers
  subsection: CRM & Customer Management
  description: Full ERP + CRM suite. Only reach for this once Twenty's scope is genuinely
    too narrow — it's a much bigger commitment.
  stars: 52k+
- name: Formbricks
  url: https://github.com/formbricks/formbricks
  section: Understanding Customers
  subsection: Customer Discovery & Feedback
  description: Open source survey and experience management — in-app, website, and link surveys.
    The structured way to find out what a problem actually is before your agents try to solve
    it.
- name: OpenOutreach
  url: https://github.com/eracle/OpenOutreach
  section: Reaching Customers (Go-to-Market)
  subsection: Sales Outreach & AI SDR
  description: 'Self-hosted, email-first AI sales agent for B2B lead gen: describe your product
    and target market, it discovers, qualifies, and emails leads from a mailbox you own. Runs
    locally. ⚠️ GitHub reports its license as `NOASSERTION` (no cleanly detected SPDX license)
    — verify actual terms before relying on it.'
  stars: 2.3k+
- name: Bricks
  url: https://github.com/BraaMohammed/bricks
  section: Reaching Customers (Go-to-Market)
  subsection: Sales Outreach & AI SDR
  description: Fully local, open-source alternative to Clay.com — AI agents plus Puppeteer-based
    web scraping turn a raw CSV of companies/contacts into enriched business intelligence
    without a subscription or sending data to a third party. Early-stage; small community,
    evaluate maturity before depending on it.
  stars: 40+
- name: open-sdr
  url: https://github.com/MatthewDailey/open-sdr
  section: Reaching Customers (Go-to-Market)
  subsection: Sales Outreach & AI SDR
  description: Agent for outbound research and lead generation, ships an MCP server so other
    MCP clients (e.g. Claude Desktop) can call it as a tool. Very early-stage — no license
    file at last check.
  stars: ~20
- name: Mautic
  url: https://github.com/mautic/mautic
  section: Reaching Customers (Go-to-Market)
  subsection: Email & Marketing Automation
  description: The deepest open-source marketing automation suite here — campaigns, lead scoring,
    visual drip workflows, landing pages. Community-governed since Acquia handed it back to
    the Mautic Association in 2024; heavier PHP/MySQL/Apache stack to run than the alternatives
    below. ⚠️ GitHub reports its license as `NOASSERTION` — verify terms before relying on
    it.
  stars: 10k+
- name: Listmonk
  url: https://github.com/knadh/listmonk
  section: Reaching Customers (Go-to-Market)
  subsection: Email & Marketing Automation
  description: High-performance, self-hosted newsletter/mailing-list manager, single Go binary
    + Postgres. No CRM or visual workflow builder like Mautic — the pick if you mainly need
    to send campaigns and track opens/clicks with minimal infrastructure. AGPL-3.0.
  stars: 22k+
- name: Postiz
  url: https://github.com/gitroomhq/postiz-app
  section: Reaching Customers (Go-to-Market)
  subsection: Social Media Automation
  description: Self-hosted, agentic social media scheduler across 30+ platforms with AI-assisted
    content generation. The most active project in this section by far — multiple releases
    a month. AGPL-3.0.
  stars: 32.9k+
- name: Mixpost
  url: https://github.com/inovector/mixpost
  section: Reaching Customers (Go-to-Market)
  subsection: Social Media Automation
  description: Simpler self-hosted scheduler covering 10+ networks, one-time-payment model
    rather than a subscription. More permissive license than Postiz if that matters for your
    use case. MIT.
  stars: 3.4k+
- name: Pipeboard Meta Ads MCP
  url: https://github.com/pipeboard-co/meta-ads-mcp
  section: Reaching Customers (Go-to-Market)
  subsection: Paid Ads & Creative Generation
  description: The MCP that actually talks to Meta's Marketing API — launch campaigns, upload
    creatives, adjust budgets, pull performance, all from natural language in any MCP client
    (Claude, Goose, Cursor, ChatGPT). Badged Meta Business Partner; hosted remote MCP with
    a free tier, or self-host the PyPI package. **License note:** Business Source License,
    source-available rather than strictly open source (converts to Apache 2.0 in 2029); GitHub
    reports `NOASSERTION`.
  stars: 1.06k+
- name: gooseworks-ai/goose-skills
  url: https://github.com/gooseworks-ai/goose-skills
  section: Reaching Customers (Go-to-Market)
  subsection: Paid Ads & Creative Generation
  description: A Growth/GTM skill library (for Goose, Claude Code, Codex, Cursor) that's the
    actual creative-generation half of this pairing — image/video generation (`create-image-fal`,
    `create-video-fal`), templated ad renders (`render-offer-ad`, `render-value-prop`, UGC
    formats), a `meta-ads-campaign-builder` that turns an ICP + objective into targeting/ad-set/copy
    structure, plus analysis and Ad Library competitor-scraping skills. Produces the campaign
    brief and assets; pair with an MCP like the one above to actually post. No license file
    at last check — verify terms before depending on it.
  stars: 994+
- name: meta-ads-kit
  url: https://github.com/TheMattBerman/meta-ads-kit
  section: Reaching Customers (Go-to-Market)
  subsection: Paid Ads & Creative Generation
  description: 'Fully open-source (MIT) closed-loop agent, built on OpenClaw: monitor spend
    → detect ad fatigue → shift budget → generate new copy → upload PAUSED ads for human review
    → repeat. The most "batteries included" option that''s unambiguously permissively licensed.'
  stars: 272+
- name: meta-ads-automation-ai
  url: https://github.com/sandhere01/meta-ads-automation-ai
  section: Reaching Customers (Go-to-Market)
  subsection: Paid Ads & Creative Generation
  description: MIT. Generates ad images via DALL-E 3 and publishes directly to Meta's Marketing
    API. Small, early-stage — evaluate maturity before depending on it.
  stars: 17+
- name: meta-ads-cli
  url: https://github.com/attainmentlabs/meta-ads-cli
  section: Reaching Customers (Go-to-Market)
  subsection: Paid Ads & Creative Generation
  description: MIT. Bare CLI wrapper around the Meta Marketing API for campaign management
    — no creative generation, useful as a minimal scripting base.
  stars: 30+
- name: GPT Researcher
  url: https://github.com/assafelovic/gpt-researcher
  section: Translating Problems into Capability
  subsection: Deep Research & RAG / Context Engines
  description: Actively maintained autonomous research agent that plans/searches/reads/writes
    long-form cited reports. Apache-2.0. Native MCP support. ~5 min / ~$0.40 per query on
    an o3-mini-class model — this is your market-analysis/ICP generator.
  stars: 28.1k+
- name: open_deep_research
  url: https://github.com/langchain-ai/open_deep_research
  section: Translating Problems into Capability
  subsection: Deep Research & RAG / Context Engines
  description: 'Simple, configurable, fully MIT-licensed deep-research agent across many model
    providers/search tools/MCP servers. **Note:** its widely-repeated "#6 on Deep Research
    Bench with RACE 0.4943 using GPT-5" claim conflates two separate results — the actual
    #6 ranking scored RACE 0.4344 on gpt-4.1-class models. Still strong and actively maintained.'
  stars: 12k+
- name: Onyx
  url: https://github.com/onyx-dot-app/onyx
  section: Translating Problems into Capability
  subsection: Deep Research & RAG / Context Engines
  description: Self-hostable, permission-aware "ask questions of everything we know" platform
    — 50+ connectors, MCP support. MIT core. **Recommended default** central-context-store
    — genuinely current release cadence.
  stars: 30.8k+
- name: Honcho
  url: https://github.com/plastic-labs/honcho
  section: Translating Problems into Capability
  subsection: Deep Research & RAG / Context Engines
  description: Memory library for building stateful agents — long-term memory, personalization.
    The layer that lets your digital twin actually remember prior context instead of starting
    cold each session.
  stars: 5.8k+
- name: Airweave
  url: https://github.com/airweave-ai/airweave
  section: Translating Problems into Capability
  subsection: Deep Research & RAG / Context Engines
  description: Context retrieval layer for AI agents — connectors to enterprise data sources.
    Useful if your context store needs to reach into existing internal tools rather than starting
    from a blank RAG index.
  stars: 6.4k+
- name: R2R
  url: https://github.com/SciPhi-AI/R2R
  section: Translating Problems into Capability
  subsection: Deep Research & RAG / Context Engines
  description: Production-ready agentic RAG w/ hybrid search, auto knowledge-graph generation,
    built-in "Deep Research API." MIT. ⚠️ **Maintenance flag:** latest tagged release is v3.6.5
    (June 2025), over a year old at last check, with a bugfix PR that sat unmerged for months.
    Prefer Onyx unless R2R's specific feature set is needed.
  stars: 7.9k+
- name: ARC-402
  url: https://github.com/ARC-402/arc402
  section: Translating Problems into Capability
  subsection: Agent Payments & Micropayments (x402)
  description: 'The most architecturally complete option: an onchain wallet (spend-policy-governed),
    a public discoverable endpoint, a sandboxed "workroom" for governed execution, peer-to-peer
    deliverable handoff, on-chain receipts — plus one-off, metered-compute, and **recurring
    subscription** primitives.'
- name: agenticpay
  url: https://github.com/krystiangw/agentpay
  section: Translating Problems into Capability
  subsection: Agent Payments & Micropayments (x402)
  description: Full open-source stack (SDK, CLI, self-hosted x402 "facilitator," MCP bridge)
    for pay-per-tool-call micropayments on Solana. Ships a genuinely self-hostable facilitator
    — no third-party settlement dependency.
- name: ag402
  url: https://github.com/AetherCore-Dev/ag402
  section: Translating Problems into Capability
  subsection: Agent Payments & Micropayments (x402)
  description: Zero-code-change payment layer with real production security engineering —
    6-layer budget protection, wallet encryption, 4 completed security audits. The most security-hardened
    open option found.
- name: x402-mesh
  url: https://github.com/StartupHub-AI/x402-mesh
  section: Translating Problems into Capability
  subsection: Agent Payments & Micropayments (x402)
  description: Open peer-pricelist/referral layer on top of x402 — an agent hitting a paywall
    sees a *signed menu of competing offers*, not one vendor's price. An actual open market
    mechanism, not a single-vendor toll booth.
