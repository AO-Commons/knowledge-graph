[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ao-commons-kg"
version = "0.1.0"
description = "A maintained map of research on agentic organizations: taxonomy, scholarly graph, and discovery."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "AO Commons" }]
keywords = ["knowledge-graph", "agentic-organizations", "research", "taxonomy"]

# Deliberately thin. The logical product is a graph; the physical storage is
# meant to stay boring, so nothing here commits us to a graph database, a
# vector store, or a web framework before a real query needs one.
#
# PyYAML is the one hard dependency: curated resources are YAML because
# humans edit them, and that is core rather than optional.
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# requests, not httpx: this named httpx while both fetchers import requests,
# so `pip install .[scholarly]` gave you an unusable ingestion path.
scholarly = ["requests>=2.31"]   # OpenAlex and Semantic Scholar ingestion
airtable = ["requests>=2.31"]    # the curation-surface sync
mcp = ["mcp>=2.0"]                # the read-only query server
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
aokg = "ao_commons_kg.cli:main"

[project.urls]
Homepage = "https://github.com/AO-Commons/knowledge-graph"

[tool.hatch.build.targets.wheel]
packages = ["src/ao_commons_kg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
